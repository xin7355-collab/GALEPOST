# 部署到 GitHub Pages。
# configure-pages 的 enablement 會在 repo 還沒開啟 Pages 時自己用 API 開起來，
# 這樣不必先進 Settings 點一輪，第一次推上來就會有網址。
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/feng-shao-lgn3wn]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一份部署；排隊中的舊的可以取消,但正在跑的不要中斷。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # 整個 repo 就是站台本體（單檔 HTML + service worker + 圖示）,
      # 沒有建置流程,原樣上傳即可。
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
