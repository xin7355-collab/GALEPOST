/* 排法:西部由北至南 → 東部（宜、花、東）→ 外離島（澎、金、馬）。
   純照緯度排會把連江縣擺在最前面、金門插在苗栗與臺中之間 ——
   緯度上沒錯,但看的人是照著臺灣本島從上往下找自己的縣市,
   離島夾在中間會讓那條線斷掉。所以分三組,組內才照緯度由北至南。 */
const COUNTY_GROUPS = [
  { label: '西部', names: ['基隆市', '臺北市', '新北市', '桃園市', '新竹縣', '新竹市', '苗栗縣',
      '臺中市', '彰化縣', '南投縣', '雲林縣', '嘉義市', '嘉義縣', '臺南市', '高雄市', '屏東縣'] },
  { label: '東部', names: ['宜蘭縣', '花蓮縣', '臺東縣'] },
  // 外離島用慣用的「澎金馬」順序,不照緯度 —— 那三個字本來就是一組固定的講法
  { label: '外離島', names: ['澎湖縣', '金門縣', '連江縣'] },
];
const COUNTIES_NS = COUNTY_GROUPS.flatMap(g => g.names);

function dgpaRule(county, terrain) {
  const r = DGPA_BY_NORM[cnorm(county)];
  const hill = terrain === 'hill';
  if (!r) {
    return { county: county || '', known: false, label: hill ? '山區' : '平地',
      fc: hill ? DGPA_HILL : DGPA_FLAT, obs: null };
  }
  return {
    county: r.name, known: true, label: hill ? '山區' : '平地',
    fc: hill ? r.hill : r.flat,
    // 實際觀測基準只在它適用的地形上成立
    obs: (r.obs != null && (r.obsZone === 'all' || (r.obsZone === 'flat' && !hill))) ? r.obs : null,
    uniform: r.hill === r.flat,
  };
}

const TERRAIN = {
  flat: { label: '平地', thr: DGPA_FLAT, col: '#B0186B' },
  hill: { label: '山區', thr: DGPA_HILL, col: '#EF5B4C' },
};

/* 一個站臺只適用一個基準 —— 它不是平地就是山區。
   同時列出兩個門檻是錯的:岸際雷達拿到 240 mm 不該被標成「已達山區基準」。
   地形記在類別上（雷達站一律平地、中繼站臺山區）,個別站臺可以覆寫
   —— 同一種設備架在山上還是海邊,是位置的事,不是設備的事。 */
function terrainOf(st) {
  const own = st && st.terrain;
  if (own === 'flat' || own === 'hill') return own;
  const t = st && DB.types.find(x => x.id === st.type);
  return t && t.terrain === 'hill' ? 'hill' : 'flat';
}

/* 拿「實測」的 24 小時累積去比停班停課基準。
   附表裡只有南投（平地 300）、宜蘭（250）、連江（180）訂了實際觀測基準,
   那三個縣的實測達標是**官方依據**;其餘縣市附表只給預測值,
   拿實測去比 350／200 充其量是參考,所以回傳裡把兩者分開標。 */
function dgpaMark(h24, st) {
  if (h24 == null) return null;
  const k = terrainOf(st), T = TERRAIN[k];
  const rule = dgpaRule(countyOf(st), k);
  // 有訂實際觀測基準就用它（那是官方的）,沒有就退回預測值當參考
  const thr = rule.obs != null ? rule.obs : (rule.fc != null ? rule.fc : T.thr);
  if (h24 < thr) return null;
  return {
    t: `已達${T.label}基準`, terrain: k, label: T.label, thr,
    official: rule.obs != null, county: rule.county, col: T.col,
  };
}

/* 這個類別的站臺要不要進回報稿。中繼站臺是自用監看,不進交接通報。 */
const inReport = st => {
  const t = st && DB.types.find(x => x.id === st.type);
  return !(t && t.noReport);
};

function rainLevel(r) {
  if (!r) return null;
  for (const L of RAIN_LEVELS) {
    if ((L.h24 != null && r.h24 != null && r.h24 >= L.h24) ||
        (L.h3  != null && r.h3  != null && r.h3  >= L.h3)  ||
        (L.h1  != null && r.h1  != null && r.h1  >= L.h1)) return L;
  }
  return null;
}

function parseRainStation(o) {
  const base = stationBase(o);
  if (!base) return null;

  let now = null, h1 = null, h3 = null, h24 = null, day = null;
  const re = pick(o, 'RainfallElement', 'rainfallElement', 'WeatherElement', 'weatherElement');
  if (Array.isArray(re)) {
    // 舊版：RAIN 是當日累積,HOUR_x 是時段累積
    now = legacyEl(re, 'MIN_10'); h1 = legacyEl(re, 'HOUR_1');
    h3 = legacyEl(re, 'HOUR_3'); h24 = legacyEl(re, 'HOUR_24');
    day = legacyEl(re, 'RAIN');
  } else if (re && typeof re === 'object') {
    const g = (...ks) => {
      const v = pick(re, ...ks);
      if (v == null) return null;
      // 新版每個時段是 {Precipitation: 12.5} 這樣的物件
      return obsNum(typeof v === 'object' ? pick(v, 'Precipitation', 'precipitation') : v);
    };
    now = g('Past10Min', 'past10Min', 'Past10min');
    h1  = g('Past1hr', 'past1hr', 'Past1Hr');
    h3  = g('Past3hr', 'past3hr', 'Past3Hr');
    h24 = g('Past24hr', 'past24hr', 'Past24Hr');
    day = g('Now', 'now');
  }
  if (now == null && h1 == null && h3 == null && h24 == null && day == null) return null;

  return Object.assign(base, { now, h1, h3, h24, day });
}

async function fetchRain(key) {
  const j = await cwaJson('O-A0002-001', key);
  const list = pick(j && j.records ? j.records : {}, 'Station', 'station', 'location', 'Location');
  return Array.isArray(list) ? list.map(parseRainStation).filter(Boolean) : [];
}

/* 最近的測站超過這個距離就不採用。
   隔著一座山的測站量到的風,跟站臺現場沒有關係,擺出來只會誤導。 */
const OBS_MAX_KM = 60;

function nearestIn(list, st) {
  if (!list.length || !st || !Number.isFinite(st.lat) || !Number.isFinite(st.lng)) return null;
  const p = { lat: st.lat, lng: st.lng };
  let best = null;
  for (const o of list) {
    const km = distKm(p, o.pos);
    if (!best || km < best.km) best = { o, km };
  }
  return best && best.km <= OBS_MAX_KM ? best : null;
}
const nearestObs = st => nearestIn(OBS, st);
const nearestRain = st => nearestIn(RAIN, st);

// 實測風級。只有陣風沒有持續風時不換算 —— 陣風當成持續風會高估。
const obsBf = ob => (ob && ob.o.wind != null) ? ms2bf(ob.o.wind) : null;

/* ── 中央氣象署 W-C0034-001 颱風警報單 ─────────────────────
   風哨自己算的發布時機是模式推估；氣象署實際發布的警報單才是單位行動的依據。
   排除標題含「解除」與已過期的兩種，那都代表警報已不生效。
   任何解析失敗一律回「無警報」而不是拋錯 —— 警報單只是加分資訊，
   不該因為它的格式有變動就把整個颱風頁弄壞。                        */
async function fetchWarningCWA(key) {
  const none = { active: false, headline: '', issuedAt: '', expires: '',
                 areas: [], isLand: false, isSea: false };
  let records;
  try {
    const j = await cwaJson('W-C0034-001', key);
    records = j && j.records;
  } catch (e) { return none; }
  if (!records) return none;

  const list = Array.isArray(records.info) ? records.info
    : (records.info ? [records.info] : []);
  const now = Date.now();
  for (const info of list) {
    if (!info || typeof info !== 'object') continue;
    let text = String(info.headline || '');
    if (!text) {
      const ps = Array.isArray(info.parameter) ? info.parameter
        : (info.parameter ? [info.parameter] : []);
      const t = ps.find(p => p && p.valueName === 'alert_title');
      text = t ? String(t.value || '') : '';
    }
    if (!text || text.includes('解除')) continue;
    const expires = String(info.expires || '');
    if (expires) {
      const ex = Date.parse(expires);
      if (Number.isFinite(ex) && ex < now) continue;
    }
    const rawAreas = Array.isArray(info.area) ? info.area
      : (info.area ? [info.area] : []);
    return {
      active: true,
      headline: text,
      issuedAt: String(info.effective || info.onset || ''),
      expires,
      areas: rawAreas.map(a => a && a.areaDesc).filter(Boolean).map(String),
      isLand: text.includes('陸上'),
      isSea: text.includes('海上'),
    };
  }
  return none;
}

/* ── 站臺端靜態資料：由 GitHub Actions 在後端抓好並提交 ──────
   授權碼放在 repo 的 Secrets，使用者端不必申請、也不必填。
   這份 JSON 同源，會被 service worker 快取，離線時仍讀得到最後一次的內容。
   回傳 null 代表「這條路不可用」（檔案不存在或後端沒有金鑰），
   由呼叫端往下退到使用者自填的授權碼或 GDACS。                     */
async function fetchStatic() {
  let j;
  try {
    j = await getJSON(new URL('data/typhoon.json', location.href).href, 9000);
  } catch (e) { return null; }
  if (!j || typeof j !== 'object') return null;
  if (!j.hasKey) return null;              // 後端沒金鑰，這份是空殼
  return {
    updated: j.updated || '',
    warning: j.warning || null,
    // 後端已依「距臺灣遠近」排序，雙颱時排在前面的才是該優先看的那個。
    // t0 一定要是毫秒紀元：逐時內插直接用它算時間，缺了會整排變成 NaN。
    typhoons: (Array.isArray(j.typhoons) ? j.typhoons : []).map(t => ({
      ...t,
      t0: Number.isFinite(t.t0) ? t.t0 : (Date.parse(t.fixTime || '') || Date.now()),
    })),
  };
}

/* ── GDACS 免金鑰備援：只有觀測位置，沒有官方預報 ────────── */
async function fetchGDACS() {
  const j = await getJSON(GDACS_URL);
  const fs = (j?.features || []).filter(f => String(f?.properties?.eventtype || '').trim() === 'TC');
  if (!fs.length) return null;
  const TW = { lat: 23.7, lng: 121.0 };
  let best = null;
  for (const f of fs) {
    const g = f?.geometry?.coordinates; if (!Array.isArray(g)) continue;
    const p = { lat: Number(g[1]), lng: Number(g[0]) };
    if (!Number.isFinite(p.lat) || !Number.isFinite(p.lng)) continue;
    const d = distKm(p, TW);
    if (!best || d < best.d) best = { f, d, p };
  }
  if (!best) return null;
  const pr = best.f.properties || {};
  const kmh = Number(pr.severitydata?.severity || 0);
  const vmax = kmh / 3.6;
  return {
    src: 'GDACS', official: false,
    name: String(pr.eventname || pr.name || '未命名').trim(), en: pr.eventname || '',
    t0: new Date(pr.todate || pr.fromdate || Date.now()).getTime(),
    pos: best.p, vmax, gust: 0, pres: 0, mvDir: '', mvSpd: 0,
    r15: vmax >= 33 ? 250 : vmax >= 25 ? 200 : vmax >= TY_MIN_MS ? 150 : 0,
    track: [], past: [],
  };
}

/* ═══ 外推路徑：官方沒給預報時的替代品 ═══════════════════
   還是熱帶性低氣壓的時候，W-C0034-005 常常只有分析位置、沒有預報路徑，
   這時什麼時機都算不出來。用移動向量直線外推可以補上，但這是
   「假設它照現在的方向和速度直直走」，颱風並不會這樣走。
   所以外推出來的東西一定要標明白，不能讓它看起來像官方預報 ——
   拿外推的時間去排關機，跟拿官方預報去排，是兩件不同風險的事。   */
const EXTRAP_MIN_KMH = 8;      // 移速低於此值不外推：慢速系統的方向沒有意義
const EXTRAP_HOURS = 24;

function motionOf(ty) {
  const spd = Number(ty.mvSpd) || 0;
  let brg = null;
  // 方位優先用最近兩個分析點量出來的,比方位字串精確
  if (Array.isArray(ty.past) && ty.past.length >= 2) {
    const a = ty.past[ty.past.length - 2], b = ty.past[ty.past.length - 1];
    if (distKm(a, b) > 1) brg = bearing(a, b);
  }
  if (brg == null) brg = dirDeg(ty.mvDir);
  return (spd > 0 && brg != null) ? { spd, brg } : null;
}

function extrapolateTrack(ty) {
  if (!ty || !ty.pos) return null;
  if (ty.track && ty.track.length) return null;      // 有官方預報就絕不外推
  const m = motionOf(ty);
  if (!m || m.spd < EXTRAP_MIN_KMH) return null;
  const out = [];
  for (let tau = 6; tau <= EXTRAP_HOURS; tau += 6) {
    // 強度不外推:我們沒有能力預報增強或減弱,沿用現值並在畫面上說明。
    out.push({ tau, pos: destPoint(ty.pos, m.brg, m.spd * tau), vmax: ty.vmax, r70: 0 });
  }
  return out;
}

/* ═══ 逐時內插：把預報點補成每小時一筆 ═══════════════════ */
function interpolate(ty) {
  const pts = [{ tau: 0, pos: ty.pos, vmax: ty.vmax, r15: ty.r15 }];
  for (const f of ty.track) {
    // 暴風半徑隨強度縮放推估（CWA 預報點只給 70% 機率半徑，非風半徑）
    const scale = ty.vmax > 0 ? Math.pow(Math.max(f.vmax, 1) / ty.vmax, 0.35) : 1;
    pts.push({ tau: f.tau, pos: f.pos, vmax: f.vmax, r15: Math.round(ty.r15 * scale) });
  }
  pts.sort((a, b) => a.tau - b.tau);
  const maxTau = pts[pts.length - 1].tau;
  const out = [];
  for (let h = 0; h <= maxTau; h++) {
    let i = 0; while (i < pts.length - 2 && pts[i + 1].tau < h) i++;
    const a = pts[i], b = pts[i + 1] || pts[i];
    const span = b.tau - a.tau || 1, f = clamp((h - a.tau) / span, 0, 1);
    const prev = out[out.length - 1];
    const pos = { lat: a.pos.lat + (b.pos.lat - a.pos.lat) * f, lng: a.pos.lng + (b.pos.lng - a.pos.lng) * f };
    out.push({
      h, t: ty.t0 + h * 3600000, pos,
      vmax: a.vmax + (b.vmax - a.vmax) * f,
      r15: a.r15 + (b.r15 - a.r15) * f,
      mv: prev ? bearing(prev.pos, pos) : null,
      mvSpd: prev ? distKm(prev.pos, pos) : ty.mvSpd,
    });
  }
  if (out.length > 1 && out[0].mv == null) { out[0].mv = out[1].mv; out[0].mvSpd = out[1].mvSpd; }
  return out;
}

/* ═══ 風場：修正型 Rankine 渦旋 + 移動不對稱 ══════════════
   V(r) = Vmax·(r/Rmax)^0.6                r ≤ Rmax
   V(r) = Vmax·(Rmax/r)^x                  r > Rmax，x 由 R15 反解
   再疊加移動速度造成的右半圓增強。回傳持續風速 m/s。          */
function windAt(snap, p) {
  const r = distKm(snap.pos, p);
  const vmax = Math.max(snap.vmax, 1);
  const r15 = Math.max(snap.r15, 30);
  const Rmax = clamp(r15 * 0.18, 15, 70);
  let v;
  if (r <= Rmax) v = vmax * Math.pow(Math.max(r, 1) / Rmax, 0.6);
  else {
    let x = 0.55;
    if (vmax > 15 && r15 > Rmax) x = clamp(Math.log(vmax / 15) / Math.log(r15 / Rmax), 0.30, 0.95);
    v = vmax * Math.pow(Rmax / r, x);
  }
  if (snap.mv != null && snap.mvSpd > 0) {          // 右半圓增強
    const b = bearing(snap.pos, p);
    v += 0.5 * snap.mvSpd / 3.6 * Math.cos(rad(b - snap.mv - 90));
  }
  const brg = bearing(snap.pos, p);
  /* 風「從哪個方向來」。北半球是逆時針環流:在中心東側(θ=90°)空氣往北走,
     所以移動方向 ≈ θ−90°,再加上約 20° 的向心內流,風來向 = 移動方向+180 ≈ θ+110°。
     這個角度只用來分「哪一個象限」,校正與套用兩邊用同一條式子,
     就算內流角估得不準,分箱仍然一致。 */
  const dirFrom = ((brg + 110) % 360 + 360) % 360;
  return { ms: Math.max(v, 0), bf: ms2bf(Math.max(v, 0)), km: r, brg, dirFrom };
}

/* ═══ 站臺風力校正 ═══════════════════════════════════════
   問題:渦旋模型算的是**海面上的持續風**,沒有地形。
   真正的地形修正要有地形追隨的邊界層模式與地形高程資料,
   那不是一支單檔前端程式做得到的事,硬做只會做出一個看起來很準的假數字。

   做得到而且有用的是另一件事:**拿這個站自己的實測去學它的偏差**。
   每次更新時,同一個地點同時有「模型推估」與「最近測站實測」,
   兩者的比值就是這個站的**地形／曝風修正係數**。把它平滑地累積起來,
   之後的推估就乘上去 —— 這是作業上常用的偏差校正（MOS 的精神）,
   不是憑空猜一個地形參數。

   為什麼要分方位:同一個站,吹北風時被山擋住、吹南風時整片敞開,
   係數可以差一倍。颱風經過時風向會轉一大圈,剛好把各方位都學到。

   這修得掉的是**系統性偏差**（曝風、遮蔽、測站高度）。
   修不掉的是路徑誤差造成的時間偏移,以及複雜地形裡的瞬間陣風 ——
   所以畫面上仍然要並列實測,並保留「推估差 N 級」那個警告。      */
const CAL_MIN_MS = 5;        // 推估低於這個值不學:分母太小,比值全是雜訊
const CAL_MAX_KM = 25;       // 學習用的測站要比顯示用的(60 km)更近
const CAL_ALPHA = 0.25;      // 指數移動平均的權重
const CAL_MIN_N = 3;         // 樣本不足就不套用,寧可用未校正的原值
const CAL_LO = 0.35, CAL_HI = 1.8;   // 超出這個範圍多半是配錯測站,不是地形
const OCT = d => Math.round((((d % 360) + 360) % 360) / 45) % 8;
const OCT_NAME = ['北', '東北', '東', '東南', '南', '西南', '西', '西北'];

function calOf(st) {
  if (!st.cal || typeof st.cal !== 'object') st.cal = { k: 1, n: 0, at: 0, dir: [] };
  if (!Array.isArray(st.cal.dir)) st.cal.dir = [];
  return st.cal;
}
/* 取這個站在某個風向下該乘的係數。方位樣本夠就用方位的,
   不夠退回整體的,再不夠就回 1（＝不校正）。 */
function calFactor(st, dirFrom) {
  if (!st || st.calOff) return 1;
  if (Number.isFinite(st.calManual) && st.calManual > 0) return clamp(st.calManual, CAL_LO, CAL_HI);
  const c = st.cal;
  if (!c) return 1;
  if (Number.isFinite(dirFrom) && Array.isArray(c.dir)) {
    const d = c.dir[OCT(dirFrom)];
    if (d && d.n >= CAL_MIN_N) return clamp(d.k, CAL_LO, CAL_HI);
  }
  return (c.n >= CAL_MIN_N) ? clamp(c.k, CAL_LO, CAL_HI) : 1;
}

/* 每次拿到新的實測就學一次。只在「模型與實測都有意義」時才學。 */
function calibrateStations() {
  if (!SERIES || !SERIES.length || !OBS.length) return 0;
  const now = SERIES[0];
  let learned = 0;
  for (const st of DB.stations) {
    if (!IS_LIVE(st) || !Number.isFinite(st.lat) || !Number.isFinite(st.lng)) continue;
    const ob = nearestIn(OBS, st);
    if (!ob || ob.km > CAL_MAX_KM || ob.o.wind == null) continue;
    const w = windAt(now, { lat: st.lat, lng: st.lng });
    if (!(w.ms >= CAL_MIN_MS)) continue;            // 風太小,比值沒有意義
    const ratio = clamp(ob.o.wind / w.ms, CAL_LO, CAL_HI);
    const c = calOf(st);
    // 同一筆觀測時刻不要重複學（按兩次更新不該讓係數跑兩步）
    if (c.at && OBS_AT && c.at === OBS_AT) continue;
    c.k = c.n ? c.k + CAL_ALPHA * (ratio - c.k) : ratio;
    c.n++;
    c.at = OBS_AT || Date.now();
    c.km = Math.round(ob.km);
    c.src = ob.o.name;
    const i = OCT(w.dirFrom);
    const d = c.dir[i] || { k: ratio, n: 0 };
    d.k = d.n ? d.k + CAL_ALPHA * (ratio - d.k) : ratio;
    d.n++;
    c.dir[i] = d;
    learned++;
  }
  if (learned) save();
  return learned;
}

/* ═══ 警報預判 ═══════════════════════════════════════════
   海上颱風警報：暴風範圍可能侵襲臺灣或金馬 100 公里海域，約 24 小時前發布
   陸上颱風警報：暴風範圍可能侵襲陸地，約 18 小時前發布
   解除警報　：暴風範圍脫離上述範圍                           */
function predictWarnings(series, seaBuf) {
  const buf = Number.isFinite(seaBuf) ? seaBuf : 100;
  let seaIn = null, seaOut = null, landIn = null, landOut = null, cpa = null;
  let isTy = false;                      // 這段期間內有沒有達到颱風強度
  for (const s of series) {
    const d = distToTaiwan(s.pos);
    if (cpa == null || d < cpa.d) cpa = { d, t: s.t, h: s.h };
    /* 只有「當下已經是颱風」的時刻才算得上暴風範圍侵襲。
       熱帶性低氣壓不會有颱風警報 —— 氣象署改以豪大雨或強風特報因應。
       少了這個條件,一個 6 級的低壓也會被算成「暴風範圍影響中」。 */
    if (s.vmax < TY_MIN_MS || !(s.r15 > 0)) continue;
    isTy = true;
    const sea = s.r15 >= d - buf, land = s.r15 >= d;
    if (sea) { if (seaIn == null) seaIn = s; seaOut = s; }
    if (land) { if (landIn == null) landIn = s; landOut = s; }
  }
  const now = Date.now();
  const wrap = (i, o, lead) => i ? {
    affect: i.t, issue: i.t - lead * 3600000, clear: o.t,
    phase: now >= o.t ? 'done' : now >= i.t ? 'active' : now >= i.t - lead * 3600000 ? 'issued' : 'pending',
  } : null;
  return { cpa, isTy, sea: wrap(seaIn, seaOut, 24), land: wrap(landIn, landOut, 18) };
}

/* ═══ 站臺衝擊：何時該關、何時可復 ═══════════════════════ */
function stationImpact(series, st, cfg) {
  if (!Number.isFinite(st.lat) || !Number.isFinite(st.lng)) return null;
  const p = { lat: st.lat, lng: st.lng };
  /* 每個時刻各自依「那個時刻的風向」取係數 —— 颱風經過時風向會轉一大圈,
     用同一個係數套整條曲線,等於假設它從頭到尾都吹同一個方向。 */
  const curve = series.map(s => {
    const w = windAt(s, p);
    const k = calFactor(st, w.dirFrom);
    const ms = w.ms * k;
    return { t: s.t, h: s.h, ...w, ms, bf: ms2bf(ms), k };
  });
  const now = curve[0];
  let peak = curve[0];
  for (const c of curve) if (c.bf > peak.bf) peak = c;

  let shut = null, emerg = null, resume = null, lastHigh = -1;
  curve.forEach((c, i) => {
    if (shut == null && c.bf >= cfg.bfShut) shut = c;
    if (emerg == null && c.bf >= cfg.bfEmerg) emerg = c;
    if (c.bf >= cfg.bfShut) lastHigh = i;                // 記住最後一次超標
  });
  // 復機時機必須在「最後一次超過關機門檻」之後才算數。
  // 直接用尖峰之後判斷會被颱風眼通過時的短暫風平誤導，是致命誤判。
  if (lastHigh >= 0) resume = curve.slice(lastHigh + 1).find(c => c.bf <= cfg.bfResume) || null;
  else resume = curve.find(c => c.bf <= cfg.bfResume) || null;

  return {
    now, peak, shut, emerg, resume,
    deadline: shut ? shut.t - cfg.leadMin * 60000 : null,   // 應於此時前完成關機
    km: Math.round(now.km), brg: now.brg,
    k: now.k, cal: st.cal || null, calManual: st.calManual, calOff: !!st.calOff,
  };
}

/* ═══ 停班停課的風力基準推估 ══════════════════════════════
   《天然災害停止上班及上課作業辦法》第 4 條的風力款：
   **平均風力達 7 級以上,或陣風達 10 級以上**。
   這一款是可以算的 —— 逐時風場本來就有,拿門檻去掃一遍就得到時段。
   雨量款要的是「未來 24 小時累積雨量預測」,本程式沒有預測雨量,算不出來。

   算得出來不等於會放假:辦法要的是「已致災或有致災之虞」,
   而且宣布權在地方政府綜合研判。所以這裡一律寫「推估達基準」,
   不寫「會放假」,並在每一處都附上這句但書。

   陣風以持續風的 1.3 倍估（常用的陣風因子）。這是估的,不是實測。   */
const SUSP_BF_MEAN = 7, SUSP_BF_GUST = 10, GUST_FACTOR = 1.3;
const suspMeets = ms => ms2bf(ms) >= SUSP_BF_MEAN || ms2bf(ms * GUST_FACTOR) >= SUSP_BF_GUST;

/* ── 雨量款：用氣象署的豪大雨特報當替代訊號 ──────────────
   官方雨量款看的是「未來 24 小時累積雨量**預測**」,本程式沒有預測雨量。
   但**豪大雨特報本身就是預測性質**,而且它的分級門檻跟停班停課的門檻同一個口徑:
     超大豪雨 ≥ 500、大豪雨 ≥ 350（＝平地基準）、豪雨 ≥ 200（＝山區基準）。
   所以「氣象署已對這個縣市發布大豪雨特報」＝「官方預測該地 24 小時雨量達 350 mm」,
   這比拿雨量站的實測累積去比 350 更貼近官方的判斷口徑。

   這仍然是**替代訊號不是官方數字**:特報是分級,不是那個縣市每一點的預測值;
   而且雨量達標之後還要「已致災或有致災之虞」,宣布權仍在地方政府。       */
const ADV_H24 = { 超大豪雨: 500, 大豪雨: 350, 豪雨: 200, 大雨: 80 };
function advH24(kind) {
  // 由重到輕比對 —— 「大豪雨」本身就含有「豪雨」兩個字,順序反了會降級。
  for (const k of Object.keys(ADV_H24)) if (String(kind).includes(k)) return ADV_H24[k];
  return 0;
}
/* 站臺沒有縣市欄位,拿最近的雨量站（沒有就拿最近的氣象站）的縣市當作它所在的縣市。
   兩者都在 60 km 以內才會被採用,同縣市的機會很高;真的對不上就回 null,
   寧可不判斷也不要判斷錯 —— 說錯縣市就是說錯放假。 */
function countyOf(st) {
  if (!st) return '';
  if (st.county) return st.county;            // 使用者自己填的優先
  const r = nearestRain(st); if (r && r.o.county) return r.o.county;
  const o = nearestObs(st);  if (o && o.o.county) return o.o.county;
  return '';
}
function advRainFor(st) {
  const c = cnorm(countyOf(st));
  if (!c || !ADV.length) return null;
  const hill = terrainOf(st) === 'hill';
  let best = null;
  for (const a of ADV) {
    const mm = advH24(a.kind);
    if (!mm) continue;
    for (const area of a.areas) {
      const an = cnorm(area);
      // 「臺中市山區」「南投縣山區」只算山區的點
      if (/山區/.test(an) && !hill) continue;
      const bare = an.replace(/(山區|平地|沿海|地區|北部|南部|東部|西部)+$/, '');
      if (!an.includes(c) && !bare.includes(c) && !c.includes(bare)) continue;
      if (!best || mm > best.mm) best = { mm, kind: a.kind, area, end: a.end, county: c };
    }
  }
  if (!best) return null;
  // 門檻依附表逐縣市查,不是一律 350／200 —— 連江縣是 200,山區縣市山區也是 200
  const rule = dgpaRule(countyOf(st), terrainOf(st));
  best.thr = rule.fc;
  best.label = rule.label;
  best.knownCounty = rule.known;
  best.meets = best.mm >= best.thr;
  return best;
}

/* 回傳達標的連續時段（可能不只一段,颱風眼通過時會斷開;
   間隔 3 小時以內視為同一段 —— 中間那一兩個小時沒有人會去上班）。 */
function suspendWindows(series, p) {
  if (!series || !series.length) return [];
  const segs = [];
  let cur = null, peak = 0;
  for (const s of series) {
    const w = windAt(s, p);
    if (suspMeets(w.ms)) {
      if (!cur) { cur = { from: s.t, to: s.t, peakMs: w.ms }; }
      else { cur.to = s.t; if (w.ms > cur.peakMs) cur.peakMs = w.ms; }
    } else if (cur) { segs.push(cur); cur = null; }
    if (w.ms > peak) peak = w.ms;
  }
  if (cur) segs.push(cur);
  const merged = [];
  for (const g of segs) {
    const last = merged[merged.length - 1];
    if (last && g.from - last.to <= 3 * 3600000) {
      last.to = g.to; last.peakMs = Math.max(last.peakMs, g.peakMs);
    } else merged.push({ ...g });
  }
  merged.forEach(m => { m.peakBf = ms2bf(m.peakMs); m.peakGustBf = ms2bf(m.peakMs * GUST_FACTOR); });
  return merged;
}

/* ═══ 站臺當下建議 ═══════════════════════════════════════ */
function advise(st, imp, cfg) {
  if (!IS_LIVE(st)) return { k: 'warn', txt: '此點尚未建置，不列入關機管制與回報。建置完成後請改為開機。' };
  const bf = imp ? imp.now.bf : null;
  if (st.status === 'on') {
    if (bf != null && bf >= cfg.bfEmerg) return { k: 'stop', txt: `現場推估 ${bfLabel(bf)}，已達緊急關機門檻 ${cfg.bfEmerg} 級，應立即關機。` };
    if (bf != null && bf >= cfg.bfShut) return { k: 'stop', txt: `現場推估 ${bfLabel(bf)}，已達建議關機門檻 ${cfg.bfShut} 級。` };
    if (imp && imp.deadline) return { k: 'warn', txt: `預估 ${fmtShort(imp.shut.t)} 達 ${bfLabel(imp.shut.bf)}，應於 ${fmtShort(imp.deadline)} 前完成關機。` };
    return null;
  }
  // 關機或待機中
  const reasons = [];
  if (st.hum != null && st.hum > cfg.humMax) reasons.push(`現場濕度 ${st.hum}%，高於復機上限 ${cfg.humMax}%`);
  if (bf != null && bf > cfg.bfResume) reasons.push(`現場推估 ${bfLabel(bf)}，高於可復機門檻 ${cfg.bfResume} 級`);
  if (reasons.length) return { k: 'warn', txt: reasons.join('；') + '，暫不宜復機。' };
  if (imp && imp.resume && imp.resume.t > Date.now())
    return { k: 'warn', txt: `預估 ${fmtShort(imp.resume.t)} 風力降至 ${bfLabel(imp.resume.bf)}，屆時可評估復機。` };
  if (bf != null || st.hum != null) return { k: 'go', txt: '風力與濕度均已低於門檻，可評估復機。' };
  return null;
}

/* ═══ 取得颱風資料 ═══════════════════════════════════════ */
let SERIES = null, WARN = null;
// TRACK：目前實際採用的預報點（官方的，或外推出來的）。EXTRAP：是不是外推的。
let TRACK = [], EXTRAP = false;

function rebuildModel() {
  const ty = DB.ty.data;
  if (!ty) { SERIES = null; WARN = null; TRACK = []; EXTRAP = false; return; }
  const ex = extrapolateTrack(ty);
  EXTRAP = !!ex;
  TRACK = ex || ty.track || [];
  SERIES = interpolate(ex ? Object.assign({}, ty, { track: ex }) : ty);
  WARN = SERIES.length > 1 ? predictWarnings(SERIES, DB.cfg.seaBuffer) : null;
}

async function loadTyphoon(manual) {
  if (_busy) return;
  const now = Date.now();
  if (manual && now - _last < MIN_GAP) {
    toast(`${Math.ceil((MIN_GAP - (now - _last)) / 1000)} 秒後才能再次更新`); return;
  }
  _busy = true; _last = now;
  renderTyphoon({ loading: true });
  // 公告來源跟颱風資料一起更新。沒設定就是 no-op,不會多送任何請求。
  fetchDgpa(false);
  const key = (DB.cfg.cwaKey || '').trim();
  let note = '';
  // 實測觀測跟颱風路徑是兩件事:就算氣象署現在沒有任何颱風,
  // 「現在各站臺幾級風」還是要看得到。所以先發出去,不等路徑的結果。
  const obsP = key
    // fetchForecast 自己會寫 WX / WX_ERR,這裡不取它的回傳值;
    // 天氣預報抓不到絕對不能連帶讓颱風那條路徑掛掉,所以一律 allSettled。
    ? Promise.allSettled([fetchObs(key), fetchRain(key), fetchAdvisory(key),
        fetchForecast(key), fetchLightning(key)])
        .then(([w, r, a, f, l]) => {
          OBS = w.status === 'fulfilled' ? w.value : [];
          RAIN = r.status === 'fulfilled' ? r.value : [];
          ADV = a.status === 'fulfilled' ? a.value : [];
          if (f.status === 'rejected') { WX = null; WX_ERR = String((f.reason && f.reason.message) || f.reason || '天氣預報讀取失敗'); }
          if (l.status === 'rejected') { LTN = []; LTN_ERR = String((l.reason && l.reason.message) || l.reason || '閃電資料讀取失敗'); }
          OBS_AT = RAIN_AT = Date.now();
        })
    : Promise.resolve().then(() => {
        OBS = []; RAIN = []; ADV = []; OBS_AT = RAIN_AT = 0;
        WX = null; WX_AT = 0; WX_ERR = '';
        LTN = []; LTN_AT = 0; LTN_ERR = '';
      });
  try {
    let all = [];
    // ① 站臺端靜態資料：不需要任何人自備授權碼，優先用
    const stat = await fetchStatic();
    await obsP;                       // 上面已經在跑了,這裡只是收線
    // 實測進來了,但 SERIES 還要等路徑解析完;真正的學習在下面 rebuildModel 之後
    if (stat) {
      DB.ty.warning = stat.warning || null;
      if (stat.typhoons.length) {
        all = stat.typhoons;
      } else {
        // 後端有金鑰、也查得到，只是目前真的沒有颱風 —— 這是明確的答案，
        // 不該再退到 GDACS 去撈出一個地球另一端的熱帶氣旋。
        clearTyphoon(); renderTyphoon({ none: true, note }); renderStations(); return;
      }
    }
    // ② 使用者自填授權碼（後端沒設定時的退路）
    if (!all.length && key) {
      // 路徑與警報單一起抓：兩者互不相干，警報單掛掉不該影響路徑，
      // 所以用 allSettled 而不是讓任一個失敗把另一個一起帶走。
      const [pathRes, warnRes] = await Promise.allSettled([
        fetchCWAAll(key), fetchWarningCWA(key),
      ]);
      if (warnRes.status === 'fulfilled') DB.ty.warning = warnRes.value;
      if (pathRes.status === 'fulfilled') {
        all = pathRes.value || [];
        if (!all.length) {
          // 氣象署給了資料但一顆都解析不出來,跟氣象署沒發布是兩回事。
          // 講成一樣的話,等於把自己的 bug 說成別人沒資料。
          note = _cwaSeen.raw > 0
            ? `中央氣象署回傳了 ${_cwaSeen.raw} 筆熱帶氣旋，但風哨一筆都解析不出來`
              + '（欄位格式可能與預期不符，這是程式的問題，不是氣象署沒發布）。'
              + '暫時改以 GDACS 全球來源顯示。'
            : '中央氣象署目前沒有發布中的颱風路徑資料，改以 GDACS 全球來源顯示。';
        }
      } else {
        note = `中央氣象署查詢失敗（${pathRes.reason && pathRes.reason.message}），改以 GDACS 全球來源顯示。`;
      }
    } else if (!all.length && !key) {
      note = '尚未取得官方路徑資料，目前使用 GDACS 全球來源，沒有官方預報路徑，無法推算警報與復機時機。';
    }
    // ③ GDACS：免金鑰，但只有觀測位置
    if (!all.length) {
      const g = await fetchGDACS();
      if (g) all = [g];
    }
    if (!all.length) { clearTyphoon(); renderTyphoon({ none: true, note }); renderStations(); return; }

    DB.ty.list = all;
    DB.ty.data = selectTyphoon(all, DB.ty.sel);
    DB.ty.sel = tyKey(DB.ty.data);
    DB.ty.at = Date.now();
    // 回報稿的颱風名稱:使用者沒有自己改過就跟著選中的颱風走。
    // 以前只在「空的」時候才設,結果從 GDACS 換到氣象署資料之後,
    // 名字還停在 GDACS 的 NARRA-26,畫面上跟實際那顆對不起來。
    if (!DB.ty.nameEdited) DB.ty.name = DB.ty.data.name;
    save(); rebuildModel();
    /* 路徑與實測都到齊了才學得動:要有 SERIES（模型）也要有 OBS（實測）。
       學完再畫,畫面上看到的就是校正後的推估。 */
    calibrateStations();
    renderTyphoon({ note });
    renderStations(); syncForm(); generate();
  } catch (e) {
    renderTyphoon({ error: e.message });
  } finally { _busy = false; }
}

function clearTyphoon() {
  DB.ty.data = null; DB.ty.list = []; DB.ty.sel = '';
  save(); rebuildModel();
}

/* 同一顆颱風在不同批資料裡要能對上：優先用編號，其次英文名，最後中文名。 */
const tyKey = t => String((t && (t.id || t.en || t.name)) || '');

function selectTyphoon(list, sel) {
  // 使用者挑過的那顆若還在，就繼續看那顆；不在了（減弱、遠離而下架）就回到最近的一顆。
  return list.find(t => sel && tyKey(t) === sel) || list[0];
}

/* 雙颱時切換要看哪一顆。整份推算（內插、警報時機、站臺衝擊）全部跟著換，
   不只是換張圖 —— 選錯颱風做關機排程是會出事的。                        */
function pickTyphoon(k) {
  const t = (DB.ty.list || []).find(x => tyKey(x) === k);
  if (!t || tyKey(DB.ty.data) === k) return;
  DB.ty.data = t; DB.ty.sel = k;
  // 換颱風就換名字,回報稿才不會寫錯颱風。使用者自己改過的名字不動。
  if (!DB.ty.nameEdited) DB.ty.name = t.name;
  save(); rebuildModel(); renderTyphoon({});
  renderStations(); syncForm(); generate();
}
/* ═══════════════════════════════════════════════════════════════
   介面：站臺 / 颱風 / 回報 / 設定
   ═══════════════════════════════════════════════════════════════ */
const S_LABEL = { on: '開機', standby: '待機', off: '關機', plan: '未建置' };
const S_VERB = { on: '完成開機', standby: '實施待機', off: '完成關機', plan: '尚未建置' };
/* 未建置＝設備還沒架上去。它不是一種管制狀態,而是「這個點還不存在」——
   所以不進回報稿、不算戰力、不做關機推估,但留在清單裡好追蹤。
   建置完成之後由使用者自己改成開機。 */
const IS_LIVE = st => st && st.status !== 'plan';
/* 站臺卡上要的是「現在是什麼狀態」,不是「當時做了什麼動作」。
   還沒有颱風的時候寫「完成開機」,看起來像剛剛執行過復機作業,
   其實只是一直開著。S_VERB 留給回報稿用 —— 那裡本來就是在講動作。 */
const S_STATE = { on: '開機中', standby: '待機中', off: '關機中', plan: '未建置' };
const S_CSS = { on: 'on', standby: 'sb', off: 'off', plan: 'pl' };
const S_COL = { on: 'var(--ok)', standby: 'var(--sb)', off: 'var(--no)', plan: 'var(--fg4)' };
const ICON = {
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M4.9 4.9l14.2 14.2"/></svg>',
  go: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 15l-6-6-6 6"/></svg>',
  dn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>',
  radar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 12 20 7"/><path d="M4.9 19.1A10 10 0 1 1 19.1 4.9"/><path d="M8.5 15.5a5 5 0 1 1 7-7"/></svg>',
};
const typeOf = id => DB.types.find(t => t.id === id) || DB.types[0] || { id: '', label: '未分類', report: '未分類' };

function bfBadge(bf, size) {
  if (bf == null) return '';
  return `<span class="bf ${size || 'md'}" style="background:${bfColor(bf)}"><b>${bf >= 17 ? '17+' : bf}</b><small>級</small></span>`;
}

/* ═══ 站臺頁 ═══════════════════════════════════════════ */
let fType = 'all', fStatus = 'all';
/* 自用監看的開關。跟 fType 分開:類別篩選是「只看這一類」,
   這一顆是「要不要把不列入交接的也放進來」—— 兩個問題,兩顆鈕。 */
const AUX_KEY = 'galepost.ui.aux';
let fAux = (() => { try { return localStorage.getItem(AUX_KEY) === '1'; } catch (e) { return false; } })();

function impactMap() {
  const m = {};
  // 未建置的點沒有設備可關,推估它幾點該關機沒有意義,也會混進戰力與播報。
  if (SERIES) for (const s of DB.stations) if (IS_LIVE(s)) m[s.id] = stationImpact(SERIES, s, DB.cfg);
  return m;
}
function sortStations(list, imp) {
  const s = DB.cfg.sort;
  const arr = list.slice();
  if (s === 'custom') return arr;
  const ti = id => DB.types.findIndex(t => t.id === id);
  const cmp = {
    type: (a, b) => ti(a.type) - ti(b.type) || a.at - b.at,
    time: (a, b) => b.at - a.at,
    timeAsc: (a, b) => a.at - b.at,
    name: (a, b) => a.name.localeCompare(b.name, 'zh-Hant'),
    /* 由北至南：緯度大的在前。沒填座標的排在最後 ——
       不知道在哪裡就不能假裝知道它在北邊還是南邊。 */
    ns: (a, b) => (Number.isFinite(b.lat) ? b.lat : -1e3) - (Number.isFinite(a.lat) ? a.lat : -1e3)
      || a.name.localeCompare(b.name, 'zh-Hant'),
    status: (a, b) => ({ off: 0, standby: 1, on: 2 })[a.status] - ({ off: 0, standby: 1, on: 2 })[b.status] || a.at - b.at,
    wind: (a, b) => ((imp[b.id]?.now.bf ?? -1) - (imp[a.id]?.now.bf ?? -1)),
    dist: (a, b) => ((imp[a.id]?.km ?? 1e9) - (imp[b.id]?.km ?? 1e9)),
  }[s];
  return cmp ? arr.sort(cmp) : arr;
}

function renderStations() {
  const box = $('#eqBody');
  if (!DB.stations.length) {
    box.innerHTML = `<div class="empty">${ICON.radar}
      <b>尚未建立任何站臺</b>
      <p>本程式不內建任何單位或站臺資料。請新增第一個站臺，或把過去的回報文字整段貼上自動建檔。</p>
      <div class="btnrow" style="max-width:20rem;margin:0 auto">
        <button class="btn pri" onclick="openStation(null)">新增站臺</button>
        <button class="btn" onclick="go('rp')">貼上回報建檔</button>
      </div></div>`;
    $('#navDot').hidden = true; paintBfBar(null); return;
  }
  const imp = impactMap();
  /* 統計數字要跟交接通報對得起來。中繼站臺是自用監看、不列入回報,
     算進戰力的話「開機 3 / 5」跟通報上寫的處數就對不上,
     交接的時候那個差額沒有人解釋得出來。所以另外列。 */
  const n = { on: 0, standby: 0, off: 0, plan: 0, extra: 0 };
  DB.stations.forEach(s => {
    if (s.status === 'plan') { n.plan++; return; }
    if (!inReport(s)) { n.extra++; return; }
    if (n[s.status] != null) n[s.status]++;
  });
  const down = n.standby + n.off;
  $('#navDot').hidden = !down;
  $('#navDot').textContent = down;

  /* 管制盤是「現在有幾臺、狀態如何」,所以預設只列「已建置、且會進交接通報」的站。
     未建置的還沒架上去,自用監看的（中繼站臺）不進通報 —— 兩者擺在裡面只會佔位置。
     要看它們得**明確點選**：按「未建置」篩選鈕,或點該類別的篩選鈕。
     設定頁的站臺清單仍然是完整的。 */
  /* 自用監看（中繼站臺）用**獨立的開關**,不跟類別篩選同步 ——
     它不是「另一種類別」,而是「要不要把不列入交接的那些也放進來看」。
     做成類別鈕的話,按下去就會把其他類別關掉,那不是使用者要的。 */
  const list = sortStations(DB.stations.filter(s =>
    (fType === 'all' || s.type === fType)
    && (inReport(s) || fAux)
    && (fStatus === 'all' ? s.status !== 'plan' : s.status === fStatus)), imp);

  const fleet = DB.stations.filter(s => IS_LIVE(s) && inReport(s))
    .map(s => `<i style="background:${S_COL[s.status]}"></i>`).join('');
  // 類別鈕只列會進交接通報的類別;自用監看另外一顆獨立開關
  const auxTypes = DB.types.filter(t => t.noReport && DB.stations.some(s => s.type === t.id));
  const typeChips = ['all', ...DB.types.filter(t => !t.noReport && DB.stations.some(s => s.type === t.id)).map(t => t.id)]
    .map(v => `<button class="chip" data-f="type" data-v="${v}"
      aria-pressed="${fType === v}">${v === 'all' ? '全部類別' : esc(typeOf(v).label)}</button>`).join('')
    + (auxTypes.length ? `<button class="chip aux" data-auxbtn aria-pressed="${fAux}">${
        fAux ? '✓ ' : '＋ '}${auxTypes.map(t => esc(t.label)).join('、')}</button>` : '');
  const stChips = [['all', '不限狀態'], ['off', '關機'], ['standby', '待機'], ['on', '開機']]
    .concat(n.plan ? [['plan', '未建置']] : [])
    .map(([v, l]) => `<button class="chip" data-f="status" data-v="${v}" aria-pressed="${fStatus === v}">${l}</button>`).join('');

  const maxBf = Math.max(-1, ...DB.stations.filter(IS_LIVE).map(s => imp[s.id]?.now.bf ?? -1));
  paintBfBar(maxBf >= 0 ? maxBf : null);

  box.innerHTML = `
  <div class="stat">
    <div class="v-on${n.on ? '' : ' zero'}"><b>${n.on}</b><small>開機</small></div>
    <div class="v-sb${n.standby ? '' : ' zero'}"><b>${n.standby}</b><small>待機</small></div>
    <div class="v-off${n.off ? '' : ' zero'}"><b>${n.off}</b><small>關機</small></div>
  </div>
  ${(n.plan || n.extra) ? `<div class="hint" style="margin:-0.375rem 0 0.75rem">
    未計入戰力：${[
      n.extra ? `<b style="color:var(--aux)">${n.extra}</b> 處自用監看（下方獨立開關可顯示）` : '',
      n.plan ? `<b>${n.plan}</b> 處未建置（按「未建置」檢視）` : '',
    ].filter(Boolean).join('、')}。</div>` : ''}
  <div class="fleet">${fleet}</div>
  <div class="fleet-lb"><span>戰力 ${n.on} / ${n.on + n.standby + n.off}</span>
    <span>${maxBf >= 0 ? '現場最高推估 ' + bfLabel(maxBf)
      : !SERIES ? '尚無颱風資料，無風力推估'
      : '未設座標，無風力推估'}</span></div>

  <div class="sec"><h2>站臺管制</h2><button class="act" onclick="openStation(null)">＋ 新增</button></div>
  <div class="chips">${typeChips}</div>
  <div class="chips">${stChips}
    <button class="chip" data-sortbtn aria-pressed="${DB.cfg.sort !== 'custom'}">排序：${SORT_LABEL[DB.cfg.sort] || '自訂'}</button></div>

  <div class="stlist" id="stlist">${list.map((s, i) => stationCard(s, imp[s.id], i, list.length)).join('')}</div>

  <div class="sec" style="margin-top:1.625rem"><h2>本次管制</h2></div>
  ${ctlCard()}
  <div class="sec"><h2>狀態變更時序</h2></div>
  ${renderRail()}`;
}
const SORT_LABEL = {
  ns: '由北至南', custom: '自訂順序', type: '類別',
  time: '時間新到舊', timeAsc: '時間舊到新',
  name: '名稱', status: '狀態', wind: '風級高到低', dist: '離颱風近到遠',
};

function stationCard(s, imp, i, total) {
  const t = typeOf(s.type);
  const a = advise(s, imp, DB.cfg);
  const custom = DB.cfg.sort === 'custom';
  const meta = [`${S_STATE[s.status]}　<u>${fmtMD(s.at)} ${fmtHM(s.at)}</u> 起`];
  if (s.hum != null) meta.push(`濕度 ${s.hum}%`);
  if (imp) meta.push(`距中心 ${imp.km} km`);
  else if (!Number.isFinite(s.lat)) meta.push('未設座標');
  // 實測擺在推估旁邊。這是畫面上唯一一個不是算出來的數字,要標明是哪一站量的,
  // 否則看的人無從判斷這個數字能不能代表自己的現場。
  const ob = nearestObs(s), obf = obsBf(ob);
  if (obf != null) meta.push(`實測 ${bfLabel(obf)}　${esc(ob.o.name)} ${Math.round(ob.km)} km`);
  // 有在校正就講出來 —— 使用者要知道畫面上的推估已經不是原始模型值
  if (imp && imp.k != null && Math.abs(imp.k - 1) > 0.02) {
    meta.push(`<span style="color:var(--acc)">地形校正 ×${imp.k.toFixed(2)}</span>`);
  }
  // 颱風致災常常是雨先出事,山區站臺尤其如此,所以雨量跟風擺在一起看。
  const rb = nearestRain(s);
  if (rb && rb.o.h24 != null) {
    const L = rainLevel(rb.o);
    const dm = dgpaMark(rb.o.h24, s);
    // 等級與停班課標記本身不該被折行拆開——「大／豪雨」分兩行會看成兩個等級。
    const nb = 'white-space:nowrap';
    meta.push(`<span style="${nb}">24 小時雨量 ${Math.round(rb.o.h24)} mm</span>`
      + (L ? `　<b style="color:${L.col};${nb}">${L.name}</b>` : '')
      + (dm ? `　<b style="color:${dm.col};${nb}">停班課${dm.t} ${dm.thr}`
          + `${dm.official ? '（實際觀測）' : ''}</b>` : ''));
  }
  const aux = !inReport(s);
  return `<article class="st${aux ? ' aux' : ''}" data-id="${s.id}">
    <div class="st-main">
      <i class="st-i" style="background:${aux ? 'var(--aux)' : S_COL[s.status]}"></i>
      ${imp ? bfBadge(imp.now.bf, 'md') : ''}
      <div class="st-b">
        <div class="st-n"><span class="nm">${esc(s.name)}</span><em>${esc(t.label)}</em>${aux
          ? '<em class="auxlb" title="自用監看：不進交接通報、不計入戰力">自用監看</em>' : ''}</div>
        <div class="st-m">${meta.map(x => `<span>${x}</span>`).join('')}</div>
        ${s.note ? `<div class="st-m" style="color:var(--fg4)"><span>${esc(s.note)}</span></div>` : ''}
      </div>
      <span class="st-tag tag-${S_CSS[s.status]}">${S_LABEL[s.status]}</span>
      ${custom ? `<div class="st-ord">
        <button data-mv="up" data-id="${s.id}" ${i === 0 ? 'disabled' : ''} aria-label="上移">${ICON.up}</button>
        <button data-mv="dn" data-id="${s.id}" ${i === total - 1 ? 'disabled' : ''} aria-label="下移">${ICON.dn}</button></div>` : ''}
    </div>
    ${a ? `<div class="st-alert a-${a.k}">${ICON[a.k]}<span>${esc(a.txt)}</span></div>` : ''}
    <div class="st-act">
      <button class="k-on" data-act="on" data-id="${s.id}" ${s.status === 'on' ? 'disabled' : ''}>開機</button>
      <button class="k-sb" data-act="standby" data-id="${s.id}" ${s.status === 'standby' ? 'disabled' : ''}>待機</button>
      <button class="k-off" data-act="off" data-id="${s.id}" ${s.status === 'off' ? 'disabled' : ''}>關機</button>
      <button data-edit="${s.id}">編輯</button>
    </div></article>`;
}

/* ── 本次管制 ──────────────────────────────────────────────
   「還沒開始管制卻已經有一整排開機紀錄」的原因:
   時序以前是拿每個站臺的 `at`（＝「從什麼時候開始是這個狀態」）去畫,
   把「一直開著」當成「剛剛完成開機」。設備平常本來就是開的,
   那不是一次動作,不該出現在紀錄裡。

   改法是把「常態」跟「管制期間」分開:
   ① 時序改用 DB.log —— 那裡記的是**真的發生過的狀態變更**,不是目前狀態;
   ② 加上「本次管制」的起訖。沒有開始管制時,時序只顯示提示,不列任何東西;
      開始管制之後,只列這段期間內的變更。
   按下「開始管制」也會把回報的「已復機起算時間」一起推到那個時刻 ——
   兩者本來就是同一件事的兩個名字。                                   */
const ctlOn = () => !!(DB.ctl && DB.ctl.start && !DB.ctl.end);
function startCtl() {
  DB.ctl = { start: Date.now(), end: 0, ty: (DB.ty.name || '') };
  DB.since = DB.ctl.start;
  save(); renderStations(); generate();
  toast('已開始管制。之後的狀態變更才會進入本次紀錄');
}
function endCtl() {
  if (!confirm('結束本次管制？時序會保留這段期間的紀錄，之後的變更不再計入。')) return;
  DB.ctl.end = Date.now();
  save(); renderStations(); generate();
  toast('已結束管制');
}
function ctlCard() {
  const c = DB.ctl || {};
  if (!ctlOn()) {
    return `<div class="card pad" style="margin-bottom:0.75rem">
      <div class="sw"><div class="sw-t"><b>${c.end ? '管制已結束' : '尚未開始管制'}</b>
        <small>${c.end ? `上次管制 ${fmtShort(c.start)} – ${fmtShort(c.end)}　下方為該期間的紀錄` :
          '設備平常就是開機，那是常態不是動作，所以時序是空的'}</small></div>
        <button class="btn pri sm" onclick="startCtl()">開始管制</button></div></div>`;
  }
  return `<div class="card pad" style="margin-bottom:0.75rem;border-color:var(--sb)">
    <div class="sw"><div class="sw-t"><b style="color:var(--sb)">管制中${c.ty ? `　${esc(c.ty)}` : ''}</b>
      <small>自 ${fmtShort(c.start)} 起　已 ${Math.floor((Date.now() - c.start) / 3600000)} 小時</small></div>
      <button class="btn sm" onclick="endCtl()">結束管制</button></div></div>`;
}

function renderRail() {
  /* 時序要跟上面的清單一致 —— 上面看不到的站,下面卻在時序裡冒出來,
     會讓人以為清單漏了誰。 */
  const nameOf = n => DB.stations.find(x => x.name === n);
  const inView = n => {
    const st = nameOf(n);
    if (!st) return fType === 'all';             // 已刪除的站臺:全部類別時仍列出
    return IS_LIVE(st) && (fType === 'all' || st.type === fType) && (inReport(st) || fAux);
  };
  /* 上面那張卡與這裡必須講同一件事。以前這裡只看 `c.start`,
     管制結束之後卡片寫「尚未開始管制」、時序卻寫「本次管制自 05:57 起」,
     同一個畫面自相矛盾。改成三種狀態各自講各自的話。 */
  const c = DB.ctl || {};
  const on = ctlOn();
  if (!c.start) {
    return `<div class="msg i">尚未開始管制，因此沒有紀錄。
      設備平常就是開機，那是<b>常態</b>不是動作——按上方「開始管制」之後，
      每一次開機／待機／關機才會記進本次時序與回報。</div>`;
  }
  const from = c.start, to = c.end || Infinity;
  const label = on ? `本次管制自 ${fmtShort(from)} 起`
    : `上次管制 ${fmtShort(from)} – ${fmtShort(c.end)}`;
  const evs = (DB.log || [])
    .filter(e => e && e.at >= from - 3600000 && e.at <= to && inView(e.name))
    .sort((a, b) => b.at - a.at);
  if (!evs.length) {
    return `<div class="msg i">${label}，${on ? '目前還沒有任何狀態變更' : '期間沒有任何狀態變更'}。${
      on ? '' : '要開始新的一輪，請按上方「開始管制」。'}</div>`;
  }
  const head = on ? '' : `<div class="msg i" style="margin-bottom:0.5rem">以下是${label}的紀錄。
    要開始新的一輪，請按上方「開始管制」。</div>`;
  let html = head + '<div class="rail">', day = '';
  for (const e of evs) {
    const st = nameOf(e.name);
    const d = new Date(e.at), dk = `${d.getMonth() + 1}/${d.getDate()}`;
    if (dk !== day) {
      day = dk;
      html += `<div class="rail-day"><b>${d.getMonth() + 1} 月 ${d.getDate()} 日</b><span>週${wk(e.at)}</span></div>`;
    }
    html += `<div class="ev">
      <div class="ev-t">${fmtClock(e.at)}</div>
      <div class="ev-l"><i class="ev-d" style="background:${S_COL[e.to] || 'var(--fg4)'}"></i></div>
      <div class="ev-b"><b>${esc(e.name)}</b><small>${S_VERB[e.to] || '狀態變更'}${
        st ? `　${esc(typeOf(st.type).label)}` : ''}${
        e.from && e.from !== e.to ? `　（原 ${S_LABEL[e.from] || '—'}）` : ''}</small></div>
    </div>`;
  }
  return html + '</div>';
}

function paintBfBar(bf) {
  const f = $('#bfbarFill');
  f.style.background = bf == null ? 'var(--edge2)' : bfColor(bf);
  $('#bfbar').classList.toggle('live', bf != null && bf >= 6);
}

$('#eqBody').addEventListener('click', e => {
  if (e.target.closest('[data-auxbtn]')) {
    fAux = !fAux;
    try { localStorage.setItem(AUX_KEY, fAux ? '1' : '0'); } catch (err) {}
    renderStations(); return;
  }
  const chip = e.target.closest('[data-f]');
  if (chip) { if (chip.dataset.f === 'type') fType = chip.dataset.v; else fStatus = chip.dataset.v; renderStations(); return; }
  if (e.target.closest('[data-sortbtn]')) { openSort(); return; }
  const mv = e.target.closest('[data-mv]');
  if (mv) { moveStation(mv.dataset.id, mv.dataset.mv === 'up' ? -1 : 1); return; }
  const ed = e.target.closest('[data-edit]');
  if (ed) { openStation(ed.dataset.edit); return; }
  const act = e.target.closest('[data-act]');
  if (act) { setStatus(act.dataset.id, act.dataset.act); }
});

function setStatus(id, to) {
  const s = DB.stations.find(x => x.id === id); if (!s) return;
  const from = s.status;
  s.status = to; s.at = Date.now(); s.mt = Date.now();
  if (to === 'on') s.hum = null;
  DB.log.push({ t: Date.now(), name: s.name, from, to, at: s.at });
  save(); renderStations(); renderTyphoon({});
  toast(`${s.name}　${S_VERB[to]}　${fmtHM(s.at)}（可於「編輯」修正時間）`);
}
function moveStation(id, d) {
  const i = DB.stations.findIndex(x => x.id === id);
  const j = i + d;
  if (i < 0 || j < 0 || j >= DB.stations.length) return;
  const [x] = DB.stations.splice(i, 1);
  DB.stations.splice(j, 0, x);
  save(); renderStations();
}

/* ═══ 颱風頁 ═══════════════════════════════════════════ */
let MAP = null, MLAYER = null, MAPFIT = null;

/* 上一次載入的說明文字。
   以前 note 是逐次傳進來的,切個頁籤重畫一次就沒了 —— 使用者只剩下

   還是我們自己把資料弄丟了。留著,直到下一次載入把它換掉。      */
let _loadNote = '';

function renderTyphoon(o) {

  if (o.none) {
    // 什麼都沒查到的時候,原因反而最該講出來 ——

    // 都只會顯示同一句「查無熱帶氣旋」。
    msg.innerHTML = '<div class="tybar"><b>中央氣象署</b>'

  if (!ty) {

      + (note ? `<div class="msg w">${esc(note)}</div>` : '');
    body.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 12c0-3 2.5-5 5.5-5S22 9 20 11c-3 3-8 1-8 1zM12 12c0 3-2.5 5-5.5 5S2 15 4 13c3-3 8-1 8-1z"/></svg>
      <b>尚未取得颱風資料</b>

      <div class="btnrow" style="max-width:20rem;margin:0 auto">
        <button class="btn pri" onclick="loadTyphoon(true)">立即查詢</button>
        <button class="btn" onclick="go('cfg')">前往設定</button></div></div>`;
    $('#mapWrap').style.display = 'none'; clearTyPanes();
    paintBfBar(null); return;
  }

  /* 資料放久了要講。
     這支程式是「快取優先」而且颱風天訊號常常斷,畫面上明明有數字、
     其實可能是一小時前的 —— 過期的颱風資訊比沒有資訊更危險,
     所以超過門檻就明講幾分鐘前,不要讓人以為看到的是即時的。 */
  const ageMin = DB.ty.at ? Math.floor((Date.now() - DB.ty.at) / 60000) : -1;
  const stale = ageMin >= 30
    ? `<div class="msg ${ageMin >= 90 ? 'e' : 'w'}">資料已是 ${ageMin >= 120
        ? Math.floor(ageMin / 60) + ' 小時' : ageMin + ' 分鐘'}前取得的，`
      + `可能已經不是現況。按上方「更新」重新取得。</div>`
    : '';
  /* 一行帶過。「關機與警報時機為推估，以氣象署警報單為準」那句話,
     在警報卡、衝擊表、播報稿裡各講過一次,這裡再講第四次不會多提醒到誰。 */
  msg.innerHTML = `<div class="tybar"><b>${ty.official ? '中央氣象署' : 'GDACS（非官方）'}</b>`
    + `${DB.ty.at ? fmtShort(DB.ty.at) : ''}`
    + `<button class="act" onclick="loadTyphoon(true)">更新</button></div>`
    + (note ? `<div class="msg w">${esc(note)}</div>` : '') + stale;

  const bfV = ms2bf(ty.vmax), bfG = ms2bf(ty.gust);

  const g = [
    ['中心氣壓', ty.pres ? ty.pres + ' hPa' : '—'],
    ['瞬間陣風', ty.gust ? bfLabel(bfG) : '—'],
    ['七級風半徑', ty.r15 ? ty.r15 + ' km' : '—'],
    ['移動', ty.mvDir ? `${dirZh(ty.mvDir)} ${ty.mvSpd || '—'} km/h` : '—'],
    ['中心位置', fmtCoordShort(ty.pos.lat, ty.pos.lng)],
    ['距臺灣', `${dTw} km · 臺灣之${dirName(brg)}`],
  ];
  $('#tyPick').innerHTML = typhoonPicker();
  /* 停班停課（推估與官方公告）擺在播報頁籤 —— 那一頁本來就是
     「要抄進通報、要唸出來的材料」,概況頁是看颱風本身的。 */
  /* 播報頁只留氣象員播報 —— 特報卡與播報稿裡的「降雨特報分級」是同一份資料,
     擺兩次只是把同一件事講兩遍。停班停課整段搬到自己的頁籤。 */
