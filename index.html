function tlParts() {
  if (!SERIES || !SERIES[TCUR]) return { top: '', st: '' };
  const s = SERIES[TCUR], bf = ms2bf(s.vmax), d = Math.round(distToTaiwan(s.pos));
  const [tc, tt] = tlTag(), ph = phaseAt(s.t);
  // 真實時刻放最大 —— 拖到某一格時,要的答案是「幾點」而不是「第幾小時」。
  const head = `<div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.25rem">
    <b style="font-size:1.0625rem;color:var(--fg)">${TCUR === 0 ? '現在' : fmtWhen(s.t)}</b>
    <span style="font-family:var(--mono);font-size:0.8125rem;color:var(--acc)">${TCUR === 0
      ? fmtShort(s.t) : fmtShort(s.t) + '　+' + s.h + 'h'}</span>
    <span class="stag ${tc}">${tt}</span>
    ${WARN && WARN.isTy ? `<span style="font-size:0.75rem;color:${PH_COL[ph]}">${PH_TXT[ph]}</span>` : ''}</div>`;
  const src = TCUR === 0 ? '氣象署' : EXTRAP ? '外推' : '預報內插';
  const brgTw = bearing({ lat: 23.7, lng: 121.0 }, s.pos);
  const r15 = Math.round(s.r15 || 0), r25 = Math.round(s.r25 || 0);
  const dl = `<dl class="rd">
    <dt>中心位置</dt><dd>${s.pos.lat.toFixed(1)}°N ${s.pos.lng.toFixed(1)}°E</dd>
    <dt>近中心風</dt><dd><span class="pill" style="background:${bfColor(bf)};color:#08131A;padding:0 0.375rem;border-radius:0.25rem;font-weight:700">${bf} 級</span> ${Math.round(s.vmax)} m/s</dd>
    <dt>距臺灣</dt><dd>${d} km<small>臺灣之${dirName(brgTw)}</small></dd>
    <dt>七級風半徑</dt><dd>${r15 ? r15 + ' km' : '—'}<small>${src}</small></dd>
    <dt>十級風半徑</dt><dd>${r25 ? r25 + ' km' : '—'}<small>${r25 ? src : ''}</small></dd>
  </dl>`;
  // 縣市政府所在地在不在暴風圈內：參考畫面「七級風暴風圈內（估算）」那一行
  const inR = r => r > 0 ? Object.entries(COUNTY_PT).filter(([, p]) => distKm(s.pos, p) <= r).map(([n]) => n) : [];
  const in7 = inR(s.r15), in10 = inR(s.r25);
  const zone = `<div class="inzone">${in7.length
    ? `七級風暴風圈內（推估）：<b>${in7.join('、')}</b>${in10.length ? `<br>十級風暴風圈內（推估）：<em>${in10.join('、')}</em>` : ''}`
    : `<span style="color:var(--fg3)">這個時刻七級風暴風圈沒有罩到任何縣市政府所在地（推估）</span>`}</div>`;

  const withXY = DB.stations.filter(x => Number.isFinite(x.lat) && Number.isFinite(x.lng));
  if (!withXY.length) return { top: head + dl + zone, st: '' };
  /* 跟站臺頁同一個數字：取最高的那一個。
     「現在」這一格用 windRead（推估平均、推估陣風、實測平均、實測陣風四者最高）——
     以前這裡只算推估陣風,站臺頁有實測時兩邊級數對不上。
     未來的時刻沒有實測,最高的就是推估陣風（持續風 × 校正 × 陣風因子）。 */
  const rows = withXY
    .map(x => {
      if (TCUR === 0) {
        const wr = windRead(x, stationImpact(SERIES, x, DB.cfg));
        return { name: x.name, bf: wr.bf ?? 0, src: wr.src };
      }
      const w = windAt(s, { lat: x.lat, lng: x.lng });
      return { name: x.name, bf: ms2bf(w.ms * calFactor(x, w.dirFrom) * GUST_FACTOR), src: '推估陣風' };
    })
    .sort((a, b) => b.bf - a.bf);
  return { top: head + dl + zone, st: '<div style="font-size:0.6875rem;letter-spacing:.12em;color:var(--fg3);margin:0.625rem 0 0.375rem">各站臺風級</div>'
    + '<div style="display:flex;flex-wrap:wrap;gap:0.375rem">'
    + rows.map(r => `<div class="tl-st">
        <span class="pill" style="background:${bfColor(r.bf)}" title="${esc(r.src)}">${r.bf}</span>
        <span>${esc(r.name)}</span></div>`).join('')
    + '</div>' };
}

function onTimeline(v) {
  const max = SERIES ? SERIES.length - 1 : 0;
  TCUR = clamp(parseInt(v, 10) || 0, 0, max);
  const out = document.getElementById('tlOut'), st = document.getElementById('tlSt');
  if (out || st) { const p = tlParts(); if (out) out.innerHTML = p.top; if (st) st.innerHTML = p.st; }
  syncScrub();
  drawTimeMarker();
  if (FLOW) FLOW.refresh();
}

/* 播放：每 0.14 秒往後一小時,96 小時的預報大約 13 秒播完。
   離開路徑分頁就停 —— 背景裡一直重畫地圖只是耗電。 */
function setPlay(on) {
  if (PLAY) { clearInterval(PLAY); PLAY = 0; }
  if (on && SERIES && SERIES.length > 1) {
    if (TCUR >= SERIES.length - 1) onTimeline(0);
    PLAY = setInterval(() => {
      if (!SERIES || TCUR >= SERIES.length - 1 || !$('#ty-map').classList.contains('on')
          || !$('#p-ty').classList.contains('on')) { setPlay(false); return; }
      onTimeline(TCUR + 1);
    }, 140);
  }
  for (const id of ['tlPlay', 'tlPlay2']) {
    const b = document.getElementById(id);
    if (!b) continue;
    b.setAttribute('aria-pressed', String(!!PLAY));
    b.textContent = PLAY ? '❚❚ 暫停' : (SERIES && TCUR > 0 && TCUR >= SERIES.length - 1 ? '↺ 重播' : '▶ 播放');
  }
}

// 拉桿下方的刻度：現在、每 24 小時、最後一個預報時刻
function ticksHtml(max) {
  // 手機上拉桿只有兩百多 px 寬,一個刻度字約 60 px：刻度太密會疊在一起（實際截圖看過）
  const step = max <= 36 ? 12 : max <= 72 ? 24 : 48;
  const out = ['<span class="l" style="left:0%">現在</span>'];
  for (let h = step; h <= max * 0.7; h += step) out.push(`<span style="left:${(h / max * 100).toFixed(2)}%">${fmtHr(SERIES[h].t)}</span>`);
  out.push(`<span class="r" style="left:100%">${fmtHr(SERIES[max].t)}</span>`);
  return out.join('');
}

function syncScrub() {
  const box = document.getElementById('scrub'), r = document.getElementById('tlR');
  if (!box || !r) return;
  if (!SERIES || SERIES.length < 2) { box.hidden = true; setPlay(false); return; }
  box.hidden = false;
  const max = SERIES.length - 1;
  if (r.max !== String(max) || !box.dataset.t0 || +box.dataset.t0 !== SERIES[0].t) {
    r.max = String(max);
    box.dataset.t0 = String(SERIES[0].t);
    document.getElementById('tlTicks').innerHTML = ticksHtml(max);
  }
  if (TCUR > max) TCUR = max;
  if (String(TCUR) !== r.value) r.value = String(TCUR);
  const r2 = document.getElementById('tlR2'), n2 = document.getElementById('tlNow2');
  if (r2) { r2.max = String(max); if (String(TCUR) !== r2.value) r2.value = String(TCUR); }
  if (n2) n2.textContent = TCUR ? `${fmtShort(SERIES[TCUR].t)}　+${SERIES[TCUR].h}h` : '現在';
  const s = SERIES[TCUR], ph = phaseAt(s.t), [tc, tt] = tlTag(), bf = ms2bf(s.vmax);
  document.getElementById('tlNow').innerHTML = `<span>${fmtShort(s.t)}</span>`
    + `<span class="stag ${tc}">${tt}${TCUR ? ' +' + s.h + 'h' : ''}</span>`
    + `<span style="color:${bfColor(bf)}">${bfLabel(bf)}</span>`
    + (WARN && WARN.isTy ? `<span style="color:${PH_COL[ph]};font-family:var(--sans);font-weight:600">${PH_TXT[ph]}</span>` : '');
  if (!PLAY) setPlay(false);       // 只更新按鈕文字（播完要顯示「重播」）
}

/* 地圖上的時刻標記：拖到的那個時刻,颱風會在哪、暴風圈多大。
   畫法跟「現在」一樣（瞄準框、七級琥珀虛線、十級紅線）,只是淡一點、名牌用虛線框,
   一眼分得出哪個是現在、哪個是預報。拖到 0（現在）就撤掉,免得跟現在的重疊。 */
function drawTimeMarker() {
  if (typeof L === 'undefined' || !MAP || !SERIES) return;
  if (TMARK) { MAP.removeLayer(TMARK); TMARK = null; }
  GHOST = null;
  if (!TCUR || !SERIES[TCUR]) { declutterLabels(); return; }
  const s = SERIES[TCUR], ll = [s.pos.lat, s.pos.lng], ph = phaseAt(s.t);
  TMARK = L.layerGroup().addTo(MAP);
  if (s.r15 > 0) L.circle(ll, {
    radius: s.r15 * 1000, color: '#F0A63A', weight: 1.5, dashArray: '7,5', opacity: .85,
    fillColor: '#F0A63A', fillOpacity: .04, interactive: false,
  }).addTo(TMARK);
  if (s.r25 > 0) L.circle(ll, {
    radius: s.r25 * 1000, color: '#FF5247', weight: 1.5, opacity: .8, fillColor: '#FF5247', fillOpacity: .06, interactive: false,
  }).addTo(TMARK);
  const tag = EXTRAP ? '外推' : '預報';
  L.marker(ll, { icon: tyRet(true), zIndexOffset: 1350 })
    .bindTooltip(`${fmtShort(s.t)}（+${s.h}h）　${bfLabel(ms2bf(s.vmax))}　${WARN && WARN.isTy ? PH_TXT[ph] : ''}（${tag}）`).addTo(TMARK);
  const order = hudOrder(s.pos, SERIES[TCUR - 1].pos, SERIES[TCUR + 1] ? SERIES[TCUR + 1].pos : null);
  GHOST = hudMarker(ll, `${fmtHr(s.t)}　${tag}`,
    `+${s.h}h　${bfLabel(ms2bf(s.vmax))}${s.r15 > 0 ? '　七級 ' + Math.round(s.r15) + 'km' : ''}`, 'ghost', order, 1400).addTo(TMARK);
  declutterLabels();
}

/* 進出警報範圍的四個時間（推估）。跟地圖上的分段顏色同一套判斷。 */
function phaseTimes() {
  const W = WARN;
  if (EXTRAP || !W || !W.isTy || !(W.sea || W.land)) return '';
  const it = (t, txt, c) => Number.isFinite(t) ? `<span style="white-space:nowrap">
    <i style="width:0.625rem;height:0.625rem;border-radius:50%;background:${c};display:inline-block;border:1.5px solid #fff"></i>
    ${txt} <b class="mono">${fmtShort(t)}</b></span>` : '';
  return `<span style="flex-basis:100%;display:flex;flex-wrap:wrap;gap:0.375rem 0.875rem">
    ${W.sea ? it(W.sea.affect, '進入海警範圍', PH_COL.sea) : ''}${W.land ? it(W.land.affect, '進入陸警範圍', PH_COL.land) : ''}
    ${W.land ? it(W.land.clear, '離開陸警範圍', PH_COL.sea) : ''}${W.sea ? it(W.sea.clear, '離開海警範圍', PH_COL.out) : ''}</span>`;
}

/* 地圖下方的說明：線條符號已經在地圖左上角的圖例裡,這裡只講兩件圖例放不下的事——
   預報路徑的顏色代表什麼（附四個轉換時間）,以及站臺圖示的顏色。 */
function mapLegend() {
  const dot = (c, t) => `<span style="display:inline-flex;align-items:center;gap:0.25rem">
    <i style="width:0.625rem;height:0.625rem;border-radius:50%;background:${c};
      display:inline-block;flex:0 0 auto"></i>${t}</span>`;
  const phase = !EXTRAP && WARN && WARN.isTy
    ? `<p class="hint" style="display:flex;flex-wrap:wrap;gap:0.5rem 0.875rem;margin:0 0 0.625rem">
        <b style="color:var(--fg3)">預報路徑顏色</b>
        ${dot(PH_COL.pre, '未達警報範圍')}${dot(PH_COL.sea, '海警範圍內')}${dot(PH_COL.land, '陸警範圍內')}${dot(PH_COL.out, '已離開')}
        <span style="color:var(--fg4)">（以七級風圈推估，非官方發布）</span>
        ${phaseTimes()}</p>` : '';
  return phase + `<p class="hint" style="display:flex;flex-wrap:wrap;gap:0.5rem 0.875rem;margin:0 0 0.875rem">
    <b style="color:var(--fg3)">站臺</b>
    ${dot('var(--ok)', '開機')}${dot('var(--sb)', '待機')}${dot('var(--no)', '關機')}
    <span style="display:inline-flex;align-items:center;gap:0.25rem">
      <i style="width:0.625rem;height:0.625rem;border-radius:50%;border:1.5px dashed var(--fg4);
        display:inline-block;flex:0 0 auto"></i>未建置</span>
    <span style="color:var(--fg4)">右上角圖層鈕可切換底圖、逐類開關站臺、風場與落雷</span>
  </p>`;
}

function renderImpact() {
  const tl = $('#tyTl');
  if (tl) tl.innerHTML = (SERIES ? mapLegend() : '') + (SERIES ? timelineCard() : '');
  const box = $('#tyImpact');
  if (!SERIES) { box.innerHTML = ''; return; }
  const withXY = DB.stations.filter(s => IS_LIVE(s) && Number.isFinite(s.lat) && Number.isFinite(s.lng));
  if (!withXY.length) {
    box.innerHTML = `<div class="sec"><h2>站臺衝擊預判</h2></div>
      <div class="msg i">尚無站臺填寫座標。到站臺「編輯」填入座標後，這裡會逐站列出目前陣風、尖峰陣風、應完成待機時間與預估可復機時間。座標支援度分秒、十進位、海圖式等多種寫法。</div>`;
    return;
  }
  /* 目前狀態 vs 評估（使用者：要一欄目前站臺狀態與時間、一欄評估,兩個比對）。
     評估跟站臺卡的建議同一套（advise）：開機中達門檻＝應待機；待機／關機中風與濕度都降了＝可評估復機。
     不一致的排最上面——那幾站才是現在要動作的。 */
  const rows = withXY.map(s => { const i = stationImpact(SERIES, s, DB.cfg); return { s, i, e: evalState(s, i) }; })
    .sort((a, b) => (a.e.ok - b.e.ok) || (b.i.peak.bf - a.i.peak.bf) || (a.i.km - b.i.km));
  const bad = rows.filter(r => !r.e.ok), nSb = bad.filter(r => r.e.act === '應待機').length;
  const sum = bad.length
    ? `<b style="color:var(--no)">${bad.length} 站跟評估不一致</b>（${[nSb ? `${nSb} 站應待機` : '', bad.length - nSb ? `${bad.length - nSb} 站可評估復機` : ''].filter(Boolean).join('、')}）；${rows.length - bad.length} 站一致`
    : `<b style="color:var(--ok)">${rows.length} 站目前狀態都跟評估一致</b>`;
  box.innerHTML = `<div class="sec"><h2>站臺衝擊預判</h2></div>
  <p class="imp-sum">${sum}</p>
  <div class="card" style="padding:0.25rem 0.625rem;margin-bottom:0.375rem;overflow-x:auto">
   <table class="impact wide"><tr>
     <th>站臺</th><th>目前狀態</th><th>評估</th><th>應完成待機</th><th>判斷<br>(取最高)</th><th>推估<br>平均／陣風</th><th>實測<br>平均／陣風</th><th>尖峰陣風</th><th>預估可復機</th><th>雨量</th></tr>
   ${rows.map(({ s, i, e }) => { const wr = windRead(s, i); return `<tr${e.ok ? '' : ' class="imp-bad"'}>
     <td class="nm">${esc(s.name)}<br><span style="font-family:var(--mono);font-size:0.6875rem;color:var(--fg4)">${i.km} km</span></td>
     <td style="white-space:nowrap"><b style="color:${S_COL[s.status]}">${S_LABEL[s.status]}</b><br>
         <span style="font-family:var(--mono);font-size:0.6875rem;color:var(--fg4)">${s.at ? fmtShort(s.at) : '—'}</span></td>
     <td style="white-space:nowrap"><b>${e.label}</b><br>${e.ok
       ? '<span class="imp-ok">✓ 一致</span>' : `<span class="imp-no">⚠ ${e.act}</span>`}${e.note ? `<br><span style="font-size:0.6875rem;color:var(--fg4)">${e.note}</span>` : ''}</td>
     <td>${i.deadline ? `<b style="color:${i.deadline <= Date.now() ? 'var(--no)' : 'var(--sb)'}">${fmtShort(i.deadline)}</b>` : '<span style="color:var(--fg4)">不需待機</span>'}</td>
     <td><span class="pill" style="background:${bfColor(wr.bf)}">${wr.bf}</span>
         <span style="display:block;font-size:0.6875rem;color:var(--fg4);white-space:nowrap">${esc(wr.src)}</span></td>
     <td style="white-space:nowrap">${msTxt(i.now.ms)}<span class="lvl">${ms2bf(i.now.ms)}級</span><br>${msTxt(i.now.gust)}<span class="lvl">${i.now.bf}級</span></td>
     ${obsCell(s, wr)}
     <td><span class="pill" style="background:${bfColor(i.peak.bf)}">${i.peak.bf}</span><br>
         <span style="font-size:0.6875rem;color:var(--fg4)">${fmtShort(i.peak.t)}</span></td>
     <td>${i.resume ? fmtShort(i.resume.t) : '<span style="color:var(--fg4)">—</span>'}</td>
     ${rainCell(s)}
   </tr>`; }).join('')}</table></div>
  <p class="hint" style="margin:0">表格可左右滑動。門檻（陣風）：待機 ${DB.cfg.bfShut} 級、緊急 ${DB.cfg.bfEmerg} 級、
    可復機 ${DB.cfg.bfResume} 級以下，預留 ${DB.cfg.leadMin} 分。</p>
  <details class="more" style="margin:0.25rem 0 0.875rem"><summary>欄位怎麼算</summary><div class="hint">
    <b>判斷</b>＝推估與實測的平均風、陣風四者換成風級後取最高，待機就看這一欄。
    <b>推估</b>：平均風是渦旋模型算的海面持續風（含地形校正），陣風＝平均風 ×${GUST_FACTOR}；
    <b>實測</b>：最近測站的平均風與最大陣風（沒報陣風時以平均風 ×${GUST_FACTOR} 估，標「估」）。
    ${obsHint()} ${rainHint()}</div></details>`;
}

/* 衝擊表的「實測」欄。
   實測與推估差 3 級以上就標出來 —— 那不是小數點的差別,
   而是「模型在這個地形下算不準」的訊號,值班的人必須自己判斷,
   不能照著程式給的時間關機。差 1、2 級屬正常(海面風 vs 地面風)。 */
/* 實測欄。
   「差 N 級」以前講的是「實測跟推估差多少」—— 那是模型準不準,值班的人幫不上忙。
   改成講**距離關機門檻還差幾級**:那才是要做決定的那個數字
   （「還差 4 級」＝還很遠;「已達門檻」＝現在就該關）。
   模型與實測差三級以上仍然要講,但降成一個小記號,因為它的意思是
   「這一站的推估時間不可信,以現場為準」,不是一個要立刻動作的數字。 */
function obsCell(st, wr) {
  const o = wr && wr.obs;
  if (!o) return '<td><span style="color:var(--fg4)">—</span></td>';
  // 實測自己的最高級數（平均風、陣風取大）——「距門檻還差幾級」講的是現場
  const bf = Math.max(o.ms != null ? ms2bf(o.ms) : -1, o.gust != null ? ms2bf(o.gust) : -1);
  const estBf = wr.est ? ms2bf(wr.est.gust) : bf;
  const shut = DB.cfg.bfShut;
  const toShut = shut - bf;
  const line = toShut <= 0
    ? `<b style="display:block;font-size:0.6875rem;color:var(--no)">已達待機門檻 ${shut} 級</b>`
    : `<b style="display:block;font-size:0.6875rem;color:${toShut <= 2 ? 'var(--sb)' : 'var(--fg3)'}">`
      + `距待機門檻 ${toShut} 級</b>`;
  const est = Math.abs(bf - estBf) >= 3
    ? `<span style="display:block;font-size:0.6875rem;color:var(--sb)" title="模型在此地形不可信，以現場為準">`
      + `推估差 ${Math.abs(bf - estBf)} 級</span>` : '';
  return `<td style="white-space:nowrap">${msTxt(o.ms)}${o.ms != null ? `<span class="lvl">${ms2bf(o.ms)}級</span>` : ''}<br>`
    + `${msTxt(o.gust)}${o.gust != null ? `<span class="lvl">${ms2bf(o.gust)}級${o.gEst ? '，估' : ''}</span>` : ''}`
    + line + est
    + `<span style="display:block;font-size:0.6875rem;color:var(--fg4)">`
    + `${esc(o.name)} ${o.km}km</span></td>`;
}

function rainHint() {
  if (!RAIN.length) return '';
  return `雨量取最近雨量站（${RAIN.length} 站），分級依氣象署標準。`
    + '<b>待機門檻只看陣風，雨量供研判道路與積水風險。</b>'
    + '停班停課基準依《天然災害停止上班及上課作業辦法》第四條附表逐縣市認定'
    + `（多數縣市 ${DGPA_FLAT} mm，山區縣市山區 ${DGPA_HILL} mm，連江縣 200 mm）；`
    + '<b>附表的值是「未來 24 小時累積雨量預測」，此處為雨量站「實測」累積 ——'
    + '只有南投平地 300、宜蘭 250、連江 180 這三個縣訂了實際觀測基準，實測達標才是官方依據，'
    + '其餘縣市拿實測去比只是參考。達標仍須地方政府依致災情形研判。</b>';
}

function calSummary() {

  return `已有 <b>${live.length}</b> 站累積出地形校正係數`
    + `（×${Math.min(...ks).toFixed(2)}–×${Math.max(...ks).toFixed(2)}）。`;
}

function obsHint() {
  if (!OBS.length) return '目前沒有觀測資料，實測欄為 —。';

    + `<b>「距待機門檻 N 級」是實測陣風離待機門檻（${DB.cfg.bfShut} 級）還差幾級</b>，`
    + '這是要做決定的那個數字。'

    + `<br><b>地形校正</b>：模型算的是海面持續風、沒有地形，所以程式會拿<b>這個站自己的實測</b>`
    + `跟推估相比，把比值累積成該站的校正係數（依風向分八個方位各學一組，`

/* ── 底圖 ────────────────────────────────────────────────
   預設「戰情圖」：深色海面、經緯格線、發光的臺灣海岸線 —— 使用者看了參考的「颱風戰情室」畫面,
   覺得這種地圖最清楚好看。它不用圖磚：海岸線（Natural Earth 1:10m,公有領域,
   scripts/build_coast.py 產生）跟程式一起被快取,颱風天行動網路斷了、衛星圖只剩灰底的時候,
   這張照樣畫得出來。
   衛星影像、彩色街道圖、暗色圖磚留在右上角的圖層鈕裡 —— 要看站臺周邊地形、道路時切過去,
   選擇會記住。                                                        */
const BASEMAPS = {
  hud: { label: '戰情圖（離線可用）', vector: true, attr: '海岸線 Natural Earth' },
  sat: {
    label: '衛星影像',
    url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    attr: 'Esri, Maxar, Earthstar Geographics',
    max: 12,
    // 衛星影像沒有地名,疊一層邊界與地名才知道打到哪裡
    over: 'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
  },
  street: {
    label: '彩色地圖',
    url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    attr: '&copy; OpenStreetMap 貢獻者',
    max: 12,
  },
  dark: {
    label: '暗色地圖',
    url: 'https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
    attr: '&copy; OpenStreetMap 貢獻者, &copy; CARTO',
    max: 12,
  },
};
const BASEMAP_KEY = 'galepost.ui.basemap';

/* 海岸線只抓一次。失敗時把 promise 清掉,下次切回戰情圖會再試 ——
   第一次安裝剛好斷線的人,連上之後不必重開 App。 */
let COAST = null, COAST_P = null;
function loadCoast() {
  if (COAST) return Promise.resolve(COAST);
  if (!COAST_P) {
    COAST_P = fetch('assets/coast.json')
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(j => (COAST = j))
      .catch(e => { COAST_P = null; throw e; });
  }
  return COAST_P;
}
/* 地圖以太平洋為中心（經度 -25～335）：整塊在西經 25 度以西的陸地（美洲、楚科奇東端）
   加 360 度接到右邊 —— 不然縮小看全球時,太平洋右邊一片空白、美洲跑到最左邊。
   跨在接縫上的（格陵蘭、南極）左右各畫一份：只畫一份的話,接縫外那一半會整塊不見。 */
const ringsLL = rings => rings.flatMap(r => {
  let mn = 999, mx = -999;
  for (let i = 0; i < r.length; i += 2) { if (r[i] > mx) mx = r[i]; if (r[i] < mn) mn = r[i]; }
  const ll = sh => { const out = []; for (let i = 0; i + 1 < r.length; i += 2) out.push([r[i + 1], r[i] + sh]); return out; };
  return mx < -25 ? [ll(360)] : mn < -25 ? [ll(0), ll(360)] : [ll(0)];
});
const MAP_BOUNDS = [[-85, -25], [85, 335]];

// 認位置用的地名：只放幾個,顏色壓暗,不跟路徑標籤搶
const GEO_LB = [
  [26.3, 117.0, '中國'], [16.6, 121.3, '呂宋'], [32.6, 130.7, '九州'], [26.45, 127.95, '沖繩'],
  [24.86, 125.32, '宮古'], [24.4, 124.2, '石垣'], [24.5, 122.98, '與那國'],
];
// 海域名稱：氣象署海上颱風警報的警戒區就是用這些名字,標出來才對得起警報單
const SEA_LB = [[21.25, 120.75, '巴士海峽'], [24.15, 119.45, '臺灣海峽'], [18.6, 128.5, '西北太平洋'],
  [29.2, 124.8, '東海'], [17.8, 115.6, '南海']];

/* 戰情圖本身是一個圖層：切到別的底圖時,格線、陸地、地名、深色底一起撤掉。
   格線分兩張 canvas：線畫在地圖最底層（陸地蓋在上面）,經緯度數字畫在最上層 ——
   數字跟線放同一層的話,貼在左緣的「24°N」會被中國大陸的陸地蓋掉。 */
function makeHudLayer() {
  let map = null, under = null, over = null, land = null, lbs = null, cn = [];
  const draw = () => {
    if (!map) return;
    const sz = map.getSize(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    for (const cv of [under, over]) {
      if (cv.width !== Math.round(sz.x * dpr) || cv.height !== Math.round(sz.y * dpr)) {
        cv.width = Math.round(sz.x * dpr); cv.height = Math.round(sz.y * dpr);
        cv.style.width = sz.x + 'px'; cv.style.height = sz.y + 'px';
      }
      const g = cv.getContext('2d');
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, sz.x, sz.y);
    }
    const b = map.getBounds(), z = map.getZoom(), c = b.getCenter();
    const step = z >= 8 ? 0.5 : z >= 5 ? 1 : z >= 4 ? 5 : z >= 3 ? 10 : 30;
    const every = z >= 8 ? 1 : 2;                       // 數字隔一條標一次,不然擠在一起
    const gu = under.getContext('2d'), go = over.getContext('2d');
    gu.strokeStyle = 'rgba(111,211,255,.09)'; gu.lineWidth = 1;
    go.font = '10px ui-monospace,"SF Mono",Menlo,monospace';
    go.fillStyle = 'rgba(137,162,175,.85)';
    go.shadowColor = '#040A10'; go.shadowBlur = 3;
    const lab = (v, n) => Math.abs(v / (step * n) - Math.round(v / (step * n))) < 1e-6;
    const fmt = v => (Math.round(v * 10) / 10).toString();
    // 太平洋置中：180 度以東寫成西經（200 → 160°W）
    const lonTxt = v => {
      const w = ((v + 540) % 360) - 180;
      return Math.abs(w) === 180 || w === 0 ? fmt(Math.abs(w)) + '°' : w < 0 ? fmt(-w) + '°W' : fmt(w) + '°E';
    };
    gu.beginPath();
    for (let lon = Math.ceil(b.getWest() / step) * step; lon <= b.getEast(); lon += step) {
      const x = Math.round(map.latLngToContainerPoint([c.lat, lon]).x) + 0.5;
      gu.moveTo(x, 0); gu.lineTo(x, sz.y);
      if (lab(lon, every) && x > 30 && x < sz.x - 40) go.fillText(lonTxt(lon), x + 3, sz.y - 6);
    }
    for (let lat = Math.ceil(b.getSouth() / step) * step; lat <= b.getNorth(); lat += step) {
      const y = Math.round(map.latLngToContainerPoint([lat, c.lng]).y) + 0.5;
      gu.moveTo(0, y); gu.lineTo(sz.x, y);
      if (lab(lat, every) && y > 14 && y < sz.y - 18) go.fillText(lat < 0 ? fmt(-lat) + '°S' : fmt(lat) + (lat ? '°N' : '°'), 4, y - 3);
    }
    gu.stroke();
  };
  // 縮放動畫期間地圖本體在做 CSS 縮放,這兩張 canvas 不會跟著縮 —— 先藏起來,縮完重畫
  const hide = () => { for (const cv of [under, over]) cv.style.opacity = '0'; };
  const show = () => { draw(); for (const cv of [under, over]) cv.style.opacity = '1'; };
  const Hud = L.Layer.extend({
    onAdd(m) {
      map = m;
      const box = m.getContainer();
      box.classList.add('hud');
      under = L.DomUtil.create('canvas', 'grid-cv under', box);
      over = L.DomUtil.create('canvas', 'grid-cv over', box);
      cn = ['tl', 'tr', 'bl', 'br'].map(k => L.DomUtil.create('i', 'hud-cn ' + k, box));
      lbs = L.layerGroup().addTo(m);
      GEO_LB.forEach(([la, lo, t]) => L.marker([la, lo], { pane: 'geoPane', interactive: false, keyboard: false,
        icon: L.divIcon({ className: '', iconSize: [60, 14], iconAnchor: [30, 7], html: `<div class="geo-lb" style="text-align:center">${t}</div>` }) }).addTo(lbs));
      SEA_LB.forEach(([la, lo, t]) => L.marker([la, lo], { pane: 'geoPane', interactive: false, keyboard: false,
        icon: L.divIcon({ className: '', iconSize: [90, 14], iconAnchor: [45, 7], html: `<div class="geo-lb sea" style="text-align:center">${t}</div>` }) }).addTo(lbs));
      loadCoast().then(j => {
        MAP_NOCOAST = false;
        if (!map || land) return;
        land = L.layerGroup([
          L.polygon(ringsLL(j.land), { pane: 'landPane', interactive: false, stroke: true, color: 'rgba(137,162,175,.35)',
            weight: 1, fillColor: '#13232C', fillOpacity: 1 }),
          // 發光：先鋪一條寬而淡的描邊,再畫細的實線 —— Safari 對 SVG 元素的 CSS 濾鏡支援不穩,不靠 filter
          L.polygon(ringsLL(j.tw), { pane: 'landPane', interactive: false, fill: false,
            color: 'rgba(111,211,255,.2)', weight: 7 }),
          L.polygon(ringsLL(j.tw), { pane: 'landPane', interactive: false, color: 'rgba(111,211,255,.9)',
            weight: 1.3, fillColor: '#16303C', fillOpacity: 1 }),
        ]).addTo(map);
      }).catch(() => {
        // 沒有海岸線也還有格線與路徑；在圖例裡講一聲,不要讓人以為臺灣不見了
        MAP_NOCOAST = true; renderLegend();
      });
      m.on('move resize viewreset', draw).on('zoomstart', hide).on('zoomend', show);
      draw();
    },
    onRemove(m) {
      m.getContainer().classList.remove('hud');
      [under, over, ...cn].forEach(el => el && el.remove());
      if (lbs) m.removeLayer(lbs);
      if (land) m.removeLayer(land);
      m.off('move resize viewreset', draw).off('zoomstart', hide).off('zoomend', show);
      map = null; under = over = land = lbs = null; cn = [];
    },
  });
  return new Hud({ attribution: BASEMAPS.hud.attr });
}
let MAP_NOCOAST = false;

let BASELAYERS = null;
function initBasemaps(map) {
  let saved = 'hud';
  /* v55 換了預設底圖。使用者是看了參考畫面才要這個樣式的,以前選過的底圖（多半是衛星影像）
     更新後先換成戰情圖一次 —— 不然更新完還是舊地圖,會以為沒改到。之後再切換就照常記住。 */
  try {
    if (!localStorage.getItem(BASEMAP_KEY + '.v55')) {
      localStorage.setItem(BASEMAP_KEY + '.v55', '1');
      localStorage.removeItem(BASEMAP_KEY);
    }
    saved = localStorage.getItem(BASEMAP_KEY) || 'hud';
  } catch (e) {}
  if (!BASEMAPS[saved]) saved = 'hud';

  const layers = {};
  for (const [k, b] of Object.entries(BASEMAPS)) {
    if (b.vector) { layers[b.label] = makeHudLayer(); layers[b.label]._gpKey = k; continue; }
    const base = L.tileLayer(b.url, { maxZoom: b.max, attribution: b.attr });
    layers[b.label] = b.over
      ? L.layerGroup([base, L.tileLayer(b.over, { maxZoom: b.max })])
      : base;
    layers[b.label]._gpKey = k;
  }
  layers[BASEMAPS[saved].label].addTo(map);
  /* 底圖與站臺圖層共用同一個控制項。分成兩個的話右上角會出現兩疊一樣的圖示,
     使用者要猜哪一個是哪一個。 */
  BASELAYERS = layers;
  map.on('baselayerchange', e => {
    try { localStorage.setItem(BASEMAP_KEY, e.layer._gpKey || 'hud'); } catch (err) {}
  });
}

/* ── 地圖圖例（左上角） ──────────────────────────────────
   參考畫面把圖例疊在地圖左上角：看圖的當下就對得到哪條線是什麼,不用往下捲。
   可以收合（點「圖例」）,收合狀態會記住 —— 小螢幕上它會蓋掉一角的地圖。 */
const LEGEND_KEY = 'galepost.ui.legend';
let LEGEND = null;
function initLegend(map) {
  const c = L.control({ position: 'topleft' });
  c.onAdd = () => {
    const d = L.DomUtil.create('details', 'map-lg');
    let open = true;
    try { open = localStorage.getItem(LEGEND_KEY) !== '0'; } catch (e) {}
    d.open = open;
    d.innerHTML = '<summary>圖例</summary><ul></ul>';
    d.addEventListener('toggle', () => { try { localStorage.setItem(LEGEND_KEY, d.open ? '1' : '0'); } catch (e) {} });
    L.DomEvent.disableClickPropagation(d);
    L.DomEvent.disableScrollPropagation(d);
    return d;
  };
  c.addTo(map);
  LEGEND = c;
}
function renderLegend() {
  const ul = LEGEND && LEGEND.getContainer() && LEGEND.getContainer().querySelector('ul');
  if (!ul) return;
  const ty = DB.ty.data, it = [];
  const li = (sym, txt) => it.push(`<li>${sym}<span>${txt}</span></li>`);
  if (ty && ty.past && ty.past.length > 1) li('<i style="border-color:#fff"></i>', '已發生路徑');
  if (TRACK.length) {
    if (EXTRAP) li('<i class="dash" style="border-color:#EFAA35"></i>', '外推路徑 <small>非官方</small>');
    else li('<i class="dash" style="border-color:#54C7EA"></i>', '預報路徑 <small>分色見下方</small>');
    if (!EXTRAP && TRACK.some(f => f.r70 > 0)) li('<i class="box" style="border-color:#F0A63A"></i>', '70% 機率範圍');
  }
  if (ty && ty.r15 > 0) li('<i class="dash" style="border-color:#F0A63A"></i>', '七級風暴風圈');
  if (ty && (ty.r25 > 0 || (SERIES || []).some(s => s.r25 > 0))) li('<i style="border-color:#FF5247"></i>', '十級風暴風圈');
  const seaKm = Number.isFinite(DB.cfg.seaBuffer) ? DB.cfg.seaBuffer : 100;
  if (seaKm > 0) li('<i class="dash" style="border-color:rgba(84,199,234,.6)"></i>', `近海 ${seaKm} km`);
  if (FLOW && MAP && MAP.hasLayer(FLOW)) li('<i style="border-color:#E070C8"></i>', '風場流線 <small>推估</small>');
  if (LTNLAYER && MAP && MAP.hasLayer(LTNLAYER)) {
    const n = ltnRecent().length;
    // 沒抓到資料要講「無資料」,不能寫 0 筆 —— 沒有資料不等於沒有打雷
    li('<i class="dot" style="background:#FFE27A"></i>', LTN_AT ? `落雷 ${n} 筆 <small>實測</small>` : '落雷 <small>無資料</small>');
  }
  if (PROBLAYER && MAP && MAP.hasLayer(PROBLAYER)) {
    const off = probOfficial();
    li('<i class="box" style="border-color:#FF5247;border-style:solid;background:linear-gradient(90deg,rgba(111,211,255,.35),rgba(240,166,58,.35),rgba(255,82,71,.35))"></i>',
      off ? '侵襲機率 <small>官方</small>' : '侵襲機率 <small>無資料</small>');
  }
  if (MAP_NOCOAST && MAP && MAP.getContainer().classList.contains('hud')) li('<i class="dash" style="border-color:var(--sb)"></i>', '海岸線未載入 <small>連網後再開</small>');
  ul.innerHTML = it.join('');
}

/* ── 風場流線（推估） ─────────────────────────────────────
   參考畫面最搶眼的是會流動的風場。我們沒有官方的風場格點,能畫的是自己的渦旋模型
   （windAt：修正型 Rankine 渦旋＋移動造成的右半圓增強）—— 跟站臺推估是同一套,
   所以流線的強弱跟各站推估的級數對得起來。方向：北半球逆時針,再向中心偏約 20°（內流角）。
   這是推估：模型是對稱的、沒有地形,陸地上的風不會長這樣,所以圖例標「推估」,也能從圖層鈕關掉。
   跟著時間軸走：拖到哪個時刻就畫那時候的風場。
   省電：不在路徑分頁、App 在背景、地圖拖動縮放時都停；系統要求減少動態時只畫一張靜態的。 */
const FLOW_KEY = 'galepost.ui.flow', LTN_MAP_KEY = 'galepost.ui.ltnmap', PROB_MAP_KEY = 'galepost.ui.probmap';
const FLOW_COL = ['rgba(111,211,255,.22)', 'rgba(111,211,255,.5)', 'rgba(240,248,255,.62)', 'rgba(224,112,200,.85)'];
const flowBin = ms => ms >= BF_MIN[12] ? 3 : ms >= BF_MIN[8] ? 2 : ms >= BF_MIN[6] ? 1 : 0;
let FLOW = null;
function makeFlowLayer() {
  const reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  let map = null, cv = null, g = null, parts = [], raf = 0, last = 0, W = 0, H = 0, moving = false, tick = 0;
  const phone = () => W < 600;
  const visible = () => map && !moving && !document.hidden
    && $('#p-ty').classList.contains('on') && $('#ty-map').classList.contains('on');
  const geo = () => {
    const s = SERIES && SERIES[TCUR];
    if (!s || !(s.vmax > 0)) return null;
    const c = map.latLngToContainerPoint([s.pos.lat, s.pos.lng]);
    const kmPx = 40075.016 * Math.cos(rad(s.pos.lat)) / (256 * Math.pow(2, map.getZoom()));
    return { s, c, R: Math.max((s.r15 || 0) * 1.7, 350) / kmPx };
  };
  // 新粒子撒在中心附近的圓裡（面積均勻）,不撒在整個畫面 —— 遠處模型風速趨近零,粒子只會卡在原地
  const spawn = (p, G) => {
    for (let k = 0; k < 4; k++) {
      const r = G.R * Math.sqrt(Math.random()), a = Math.random() * 2 * Math.PI;
      p.x = G.c.x + r * Math.cos(a); p.y = G.c.y + r * Math.sin(a);
      if (p.x >= 0 && p.x <= W && p.y >= 0 && p.y <= H) break;
    }
    p.a = 0; p.l = 35 + Math.random() * 70;
  };
  const advance = (p, G, dt, buckets) => {
    const ll = map.containerPointToLatLng([p.x, p.y]);
    const w = windAt(G.s, { lat: ll.lat, lng: ll.lng });
    const to = rad(w.brg - 110);                         // 逆時針切線方向再往中心偏 20°
    const v = Math.min(w.ms, 70) * 0.055 * (dt / 16);
    const nx = p.x + Math.sin(to) * v, ny = p.y - Math.cos(to) * v;
    buckets[flowBin(w.ms)].push(p.x, p.y, nx, ny);
    p.x = nx; p.y = ny; p.a += dt / 16;
    const dx = p.x - G.c.x, dy = p.y - G.c.y;
    if (p.a > p.l || dx * dx + dy * dy > G.R * G.R || p.x < 0 || p.x > W || p.y < 0 || p.y > H) spawn(p, G);
  };
  const stroke = buckets => {
    g.lineWidth = 1.1;
    buckets.forEach((b, i) => {
      if (!b.length) return;
      g.strokeStyle = FLOW_COL[i];
      g.beginPath();
      for (let j = 0; j < b.length; j += 4) { g.moveTo(b[j], b[j + 1]); g.lineTo(b[j + 2], b[j + 3]); }
      g.stroke();
    });
  };
  const frame = t => {
    raf = 0;
    if (!visible()) return;                               // 回到畫面時由 kick() 重新啟動
    const dt = Math.min(64, t - last || 16); last = t;
    // 手機上跑 30 fps 就夠順,省一半電
    if (phone() && (tick++ & 1)) { raf = requestAnimationFrame(frame); return; }
    const G = geo();
    if (G) {
      g.globalCompositeOperation = 'destination-out';
      g.fillStyle = 'rgba(0,0,0,.08)'; g.fillRect(0, 0, W, H);
      g.globalCompositeOperation = 'source-over';
      const buckets = [[], [], [], []];
      for (const p of parts) advance(p, G, phone() ? dt * 2 : dt, buckets);
      stroke(buckets);
    }
    raf = requestAnimationFrame(frame);
  };
  // 減少動態：每顆粒子往前追 14 步,畫成一張靜態的流線圖
  const still = () => {
    const G = geo(); if (!G) return;
    const buckets = [[], [], [], []];
    for (const p of parts) for (let k = 0; k < 14; k++) { const a = p.a; advance(p, G, 32, buckets); if (p.a < a) break; }
    stroke(buckets);
  };
  const reset = () => {
    if (!map) return;
    const sz = map.getSize(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = sz.x; H = sz.y;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    // canvas 在跟著地圖平移的 pane 裡：每次停下來都要把它對回畫面左上角
    L.DomUtil.setPosition(cv, map.containerPointToLayerPoint([0, 0]));
    g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    const G = geo();
    parts = [];
    const n = phone() ? 420 : 900;
    for (let i = 0; i < n; i++) { const p = {}; if (G) spawn(p, G); else { p.x = -1; p.y = -1; p.a = 0; p.l = 0; } p.a = Math.random() * 30; parts.push(p); }
    moving = false;
    if (reduce) still(); else kick();
  };
  const kick = () => { if (!raf && !reduce && visible()) { last = performance.now(); raf = requestAnimationFrame(frame); } };
  const pause = () => { moving = true; if (g) g.clearRect(0, 0, W, H); };
  const Flow = L.Layer.extend({
    onAdd(m) {
      map = m;
      cv = L.DomUtil.create('canvas', 'flow-cv', m.getPane('flowPane'));
      m.on('movestart zoomstart', pause).on('moveend zoomend resize viewreset', reset);
      reset();
    },
    onRemove(m) {
      if (raf) cancelAnimationFrame(raf);
      raf = 0;
      m.off('movestart zoomstart', pause).off('moveend zoomend resize viewreset', reset);
      if (cv) cv.remove();
      map = cv = g = null; parts = [];
    },
    /* 時間軸換了時刻：不清畫面,舊的尾巴自己會淡掉,粒子跑出新暴風圈範圍時會重撒 ——
       播放時每 0.14 秒換一個時刻,每次都清掉重撒的話畫面會一閃一閃。
       減少動態模式沒有動畫,要重畫那張靜態圖。 */
    refresh() { if (!map) return; if (reduce) reset(); else kick(); },
    kick,
  });
  return new Flow();
}
document.addEventListener('visibilitychange', () => { if (FLOW && !document.hidden) FLOW.kick(); });

/* ── 落雷（實測） ────────────────────────────────────────
   參考畫面的「閃電」是隨機畫上去的裝飾。這裡畫的是中央氣象署的實測落雷（後端每 10 分鐘抓一次）,
   雲對地黃色、雲間紫色,越舊越淡。點太多時用 canvas 畫,不會拖慢地圖。 */
let LTNLAYER = null, LTN_RENDER = null;
const ltnT = s => typeof s.t === 'string' ? Date.parse(s.t) : s.t;
function ltnRecent() {
  const now = Date.now();
  return LTN.filter(s => Number.isFinite(s.lat) && Number.isFinite(s.lng)
    && !(ltnT(s) > 0 && now - ltnT(s) > 75 * 60000));
}
function drawLtn() {
  if (!LTNLAYER) return;
  LTNLAYER.clearLayers();
  if (!LTN_RENDER) LTN_RENDER = L.canvas({ padding: 0.3 });
  const now = Date.now();
  // 太多筆時只畫最新的 3000 筆：再多手機會卡,而且疊在一起也看不出差別
  ltnRecent().slice(-3000).forEach(s => {
    const t = ltnT(s), age = t > 0 ? (now - t) / 60000 : 30;
    L.circleMarker([s.lat, s.lng], {
      renderer: LTN_RENDER, interactive: false, radius: s.cg ? 3.2 : 2.1,
      stroke: !!s.cg, color: '#040A10', weight: 0.8,
      fillColor: s.cg ? '#FFE27A' : '#C9B8FF', fillOpacity: clamp(1 - age / 90, 0.3, 1),
    }).addTo(LTNLAYER);
  });
}

/* ── 侵襲機率（官方）────────────────────────────────────
   中央氣象署的等值區（20%、40%…100% 一圈一圈,外圈挖掉內圈）照停班課頁同一套顏色畫成色帶。
   預設關閉：色帶會蓋住底下的海岸與風場,要看再從圖層鈕打開。只畫官方的——
   本機推估只算到縣市政府所在地那幾個點,畫不出面。 */
let PROBLAYER = null;
const PROB_HEX = v => v >= 80 ? '#FF5247' : v >= 60 ? '#FF8A3D' : v >= 40 ? '#F0A63A' : '#6FD3FF';
function drawProb() {
  if (!PROBLAYER) return;
  PROBLAYER.clearLayers();
  const P = DB.ty.prob;
  if (!P || !Array.isArray(P.items)) return;
  P.items.filter(it => Number.isFinite(it.p) && (it.polys || []).length)
    .sort((a, b) => a.p - b.p)
    .forEach(it => it.polys.forEach(pg => {
      if (!pg.o || pg.o.length < 3) return;
      L.polygon([pg.o, ...(pg.h || [])], { pane: 'probPane', interactive: false, color: PROB_HEX(it.p),
        weight: 1, opacity: .7, fillColor: PROB_HEX(it.p), fillOpacity: .2 }).addTo(PROBLAYER);
    }));
}

/* 地圖第一次出現時建立：控制項的位置、各圖層的 pane 順序。
   pane 由下到上：陸地 350 → 風場 390 → 路徑與圓（overlayPane 400）→ 地名 420 → 颱風符號（markerPane 600）。 */
function initMap() {
  // 可拖的範圍限制在一整圈（太平洋置中）：再往外拖只會看到重複的世界或一片空白
  MAP = L.map('map', { attributionControl: true, zoomControl: false, minZoom: 1,
    maxBounds: MAP_BOUNDS, maxBoundsViscosity: 1 }).setView([23.7, 121], 5);
  MAP.attributionControl.setPrefix('');
  // 左上角讓給圖例,縮放鈕搬到左下
  L.control.zoom({ position: 'bottomleft' }).addTo(MAP);
  MAP.createPane('landPane').style.zIndex = 350;
  MAP.createPane('geoPane').style.zIndex = 420;
  MAP.getPane('geoPane').style.pointerEvents = 'none';
  // 風場墊在路徑底下（參考畫面也是先畫風場再畫路徑）：流線再漂亮,也不能蓋掉預報路徑
  MAP.createPane('flowPane').style.zIndex = 390;      // Leaflet 自己會加上 .leaflet-flow-pane
  // 侵襲機率色帶墊在陸地之上、風場之下
  MAP.createPane('probPane').style.zIndex = 370;
  MAP.getPane('probPane').style.pointerEvents = 'none';
  initBasemaps(MAP);
  initLegend(MAP);
  const fc = L.control({ position: 'bottomright' });
  fc.onAdd = () => {
    const d = L.DomUtil.create('div', 'leaflet-control');
    d.appendChild($('#mapFull'));
    L.DomEvent.disableClickPropagation(d);
    return d;
  };
  fc.addTo(MAP);
  FLOW = makeFlowLayer();
  LTNLAYER = L.layerGroup();
  PROBLAYER = L.layerGroup();
  let fOn = true, lOn = true, pOn = false;
  try {
    fOn = localStorage.getItem(FLOW_KEY) !== '0'; lOn = localStorage.getItem(LTN_MAP_KEY) !== '0';
    pOn = localStorage.getItem(PROB_MAP_KEY) === '1';
  } catch (e) {}
  if (fOn) FLOW.addTo(MAP);
  if (lOn) LTNLAYER.addTo(MAP);
  if (pOn) PROBLAYER.addTo(MAP);
  MAP.on('overlayadd overlayremove', e => {
    const on = e.type === 'overlayadd';
    try {
      if (e.layer === FLOW) localStorage.setItem(FLOW_KEY, on ? '1' : '0');
      if (e.layer === LTNLAYER) localStorage.setItem(LTN_MAP_KEY, on ? '1' : '0');
      if (e.layer === PROBLAYER) localStorage.setItem(PROB_MAP_KEY, on ? '1' : '0');
    } catch (err) {}
    renderLegend();
  });
  MAP.on('zoomend', declutterLabels);
  MAP.on('moveend', declutterLabels);
}

/* ── 地圖上的站臺 ────────────────────────────────────────
   使用者要的是「臺灣地圖上看得到我的雷達站、紅外線，關機的用灰色」。
   顏色 = 狀態（開機綠／待機琥珀／關機紅／未建置虛線灰）,
   符號 = 類別（可在設備類別裡自己改一個字或 emoji）。
   每個類別自成一個圖層,右上角的圖層控制可以逐類開關 ——
   十幾個點擠在西海岸,不能逐類關掉的話什麼都看不清楚。       */
const TYPE_ICON_DEFAULT = '◉';
function typeIcon(t) {
  if (t && t.icon) return t.icon;
  const n = (t && (t.label + t.report)) || '';
  if (/紅外線|熱影像/.test(n)) return '🔺';
  if (/中繼/.test(n)) return '📡';
  if (/雷達/.test(n)) return '◎';
  return TYPE_ICON_DEFAULT;
}
const stPin = (s, t) => L.divIcon({
  className: '', iconSize: [22, 22], iconAnchor: [11, 11],
  html: `<div class="st-pin${s.status === 'plan' ? ' plan' : ''}" style="color:${S_COL[s.status]}"><i>${typeIcon(t)}</i></div>`,
});
// 標籤要落在圖標下方,不能壓在圖標上 —— 圖標高 22px,中心錨定,
// 所以下緣在 +11,標籤從 +14 開始才不會被蓋住。
const stTag = name => L.divIcon({
  className: '', iconSize: [110, 14], iconAnchor: [55, -14],
  html: `<div class="st-lb">${esc(name)}</div>`,
});

let STLAYERS = null, STCTRL = null;
let MYPTS = [];                          // 自己的點（站臺＋關注地點）,對焦用
const MAPFOCUS_KEY = 'galepost.ui.mapfocus';
let MAPFOCUS = (() => { try { return localStorage.getItem(MAPFOCUS_KEY) || 'all'; } catch (e) { return 'all'; } })();
function drawStations(pts) {
  MYPTS = [];
  /* 舊圖層一定要從地圖上移掉。只把變數設成 null 會讓上一輪的標記留在圖上,
     每重畫一次多疊一層 —— 時刻標記那裡踩過同一個坑。 */
  if (STLAYERS) { for (const g of Object.values(STLAYERS)) MAP.removeLayer(g); }
  STLAYERS = {};
  for (const t of DB.types) {
    const has = DB.stations.some(x => x.type === t.id && Number.isFinite(x.lat));
    if (!has) continue;
    STLAYERS[t.id] = L.layerGroup().addTo(MAP);
  }

  DB.stations.forEach(s => {
    if (!Number.isFinite(s.lat) || !Number.isFinite(s.lng)) return;
    const g = STLAYERS[s.type]; if (!g) return;
    const t = typeOf(s.type);
    const imp = SERIES && IS_LIVE(s) ? stationImpact(SERIES, s, DB.cfg) : null;
    L.marker([s.lat, s.lng], { icon: stPin(s, t), zIndexOffset: 800 })
      .bindTooltip(`${s.name}　${S_STATE[s.status]}` +
        (imp ? `　推估陣風 ${bfLabel(imp.now.bf)}` : '') + `　${t.label}`)
      .on('click', () => openStation(s.id))
      .addTo(g);
    /* 名稱標籤交給疏化機制。十幾個站臺擠在西海岸,縮小的時候標籤會疊成一團 ——
       疊在一起等於全部看不見,不如讓它自己在放大之後才長回來。 */
    FCLABELS.push(L.marker([s.lat, s.lng],
      { icon: stTag(s.name), zIndexOffset: 790, interactive: false, pri: 1 }).addTo(g));
    pts.push([s.lat, s.lng]); MYPTS.push([s.lat, s.lng]);
  });

  /* 圖層控制每次重畫都要換掉 —— 類別可能被改名、新增或刪除,
     沿用舊的控制項會指向已經從地圖上移除的圖層。 */
  if (STCTRL) { MAP.removeControl(STCTRL); STCTRL = null; }
  const ov = {};
  for (const [k, g] of Object.entries(STLAYERS)) {
    ov[`${typeIcon(typeOf(k))} ${typeOf(k).label}`] = g;
  }
  // 風場（推估）與落雷（實測）跟站臺類別放在同一個圖層鈕裡：選項都收在一個下拉,不另排一列按鈕
  if (FLOW) ov['風場流線（推估）'] = FLOW;
  if (LTNLAYER) ov['落雷（實測・1 小時內）'] = LTNLAYER;
  if (PROBLAYER && probOfficial()) ov['侵襲機率（官方）'] = PROBLAYER;
  STCTRL = L.control.layers(BASELAYERS, Object.keys(ov).length ? ov : null,
    { position: 'topright', collapsed: true }).addTo(MAP);
}

/* 颱風符號（會轉的 🌀）與常駐標籤。
   做法取自使用者另一支程式 ARGUS —— 四顆颱風同圖時，
   靠 tooltip 認不出來，名稱與時間要直接畫在圖上。          */
const tyEye = sel => L.divIcon({
  className: '', iconSize: [34, 34], iconAnchor: [17, 17],
  html: `<div class="ty-eye${sel ? '' : ' sec'}">🌀</div>`,
});

/* 標籤疏化：縮小時預報點、路徑時間、站臺名稱會擠成一團,疊在一起等於全部看不見。
   以前只比「錨點」之間的距離,但颱風名牌是往右下偏的方框、半徑標籤有 70 px 寬 ——
   點跟點離得夠遠,字框還是疊在一起（名牌底下透出路徑時間,實際截圖看過）。
   改成比實際的字框：先放一定要看見的（颱風名牌、七級半徑、中心的瞄準框）,
   其他標籤依序放,跟已保留的任何一個框重疊就藏起來。放大之後空間夠了自然會再出現。 */
let FCLABELS = [], ANCHORS = [];

function declutterLabels() {
  if (!MAP) return;
  const o = MAP.getContainer().getBoundingClientRect();
  const rg = document.createRange();
  const rectOf = m => {
    const el = m.getElement();
    if (!el) return null;
    rg.selectNodeContents(el.firstElementChild || el);         // 量字本身,不是 iconSize 給的外框
    const r = rg.getBoundingClientRect();
    return r.width ? { l: r.left - 1, t: r.top - 1, r: r.right + 1, b: r.bottom + 1 } : null;
  };
  // 名牌先決定放哪一角：照候選順序試,第一個完整落在地圖裡的就用它（颱風靠近畫面邊緣時名牌才不會被切掉）
  const huds = [...ANCHORS.filter(m => m._hud), GHOST].filter(m => m && m.getElement());
  for (const m of huds) {
    const h = m._hud;
    for (const q of h.order) {
      if (q !== h.q) { m.setIcon(hudTag(h.title, h.sub, h.cls, q)); h.q = q; }
      const r = rectOf(m);
      if (r && r.l >= o.left + 2 && r.r <= o.right - 2 && r.t >= o.top + 2 && r.b <= o.bottom - 2) break;
    }
  }
  const labels = FCLABELS.filter(m => m.getElement())
    .sort((a, b) => (a.options.pri ?? 2) - (b.options.pri ?? 2));   // 自己的站臺名稱優先於路徑時間
  labels.forEach(m => { m.getElement().style.display = ''; });      // 先全部放出來,一次量完,避免反覆重排
  const kept = [];
  const ty = DB.ty.data;
  if (ty && ty.pos) {
    const p = MAP.latLngToContainerPoint([ty.pos.lat, ty.pos.lng]);
    kept.push({ l: o.left + p.x - 22, t: o.top + p.y - 22, r: o.left + p.x + 22, b: o.top + p.y + 22 });
  }
  for (const m of [...ANCHORS, ...huds]) { const r = rectOf(m); if (r) kept.push(r); }
  const hit = a => kept.some(k => a.l < k.r && a.r > k.l && a.t < k.b && a.b > k.t);
  for (const m of labels) {
    const r = rectOf(m);
    if (!r) continue;
    if (hit(r)) m.getElement().style.display = 'none';
    else kept.push(r);
  }
}

// 地圖上的時刻寫成「23日14時」：地圖標籤要短,完整的「10/23(五) 14:00」放在點了才出現的提示裡
const fmtHr = ts => { const d = new Date(ts); return `${d.getDate()}日${p2(d.getHours())}時`; };
// 純文字標籤（深色光暈襯字,不加框）。錨點在字的左邊,標籤落在點的右側
const lbIcon = (txt, cls, col) => L.divIcon({
  className: '', iconSize: [96, 14], iconAnchor: [-7, 7],
  html: `<div class="${cls}"${col ? ` style="color:${col}"` : ''}>${txt}</div>`,
});
/* 颱風名牌：名稱＋英文名一行、座標與時間一行,用斜線連回中心（參考畫面的樣子）。
   iconSize 不給,讓字數決定寬度。名牌放在中心的哪一角,看路徑從哪來、往哪去：
   固定放右下的話,往西北走的颱風,已發生路徑剛好從名牌底下穿過去（實際截圖看過）。 */
const HUD_Q = { se: [-24, -16], sw: [24, -16], ne: [-24, 16], nw: [24, 16] };
const QUAD_BRG = { se: 135, sw: 225, ne: 45, nw: 315 };
/* 四個角依「離路徑多遠」排好順序：第一個是最不會壓到路徑的。
   busy 是其他已經佔掉的方向（七級、十級半徑標籤固定標在東北 45°）。
   真正用哪一角在疏化時決定：排第一的那角超出地圖邊界（颱風靠近畫面邊緣）就換下一個。 */
function hudOrder(pos, from, to, busy) {
  const ang = (a, b) => { const d = Math.abs(((a - b) % 360 + 360) % 360); return d > 180 ? 360 - d : d; };
  const dirs = [...(busy || [])];
  if (from) dirs.push(bearing(pos, from));       // 已發生路徑在這個方向
  if (to) dirs.push(bearing(pos, to));           // 預報路徑往這個方向
  const qs = ['se', 'sw', 'ne', 'nw'];             // 同分時照這個順序：右下、左下優先,不擋圖例與圖層鈕
  if (!dirs.length) return qs;
  const score = q => Math.round(Math.min(...dirs.map(d => ang(d, QUAD_BRG[q]))) / 5);
  return qs.map((q, i) => ({ q, v: score(q), i })).sort((a, b) => b.v - a.v || a.i - b.i).map(x => x.q);
}
// 名牌 marker：記住內容與候選角,疏化時才決定放哪一角
function hudMarker(ll, title, sub, cls, order, z) {
  const m = L.marker(ll, { icon: hudTag(title, sub, cls, order[0]), zIndexOffset: z, keyboard: false });
  m._hud = { title, sub, cls, order, q: order[0] };
  return m;
}
const hudTag = (title, sub, cls, q) => L.divIcon({
  className: '', iconSize: null, iconAnchor: HUD_Q[q || 'se'],
  html: `<div class="hud-lb q-${q || 'se'}${cls ? ' ' + cls : ''}">${title}${sub ? `<small>${sub}</small>` : ''}</div>`,
});
// 瞄準框的弧：角度從正上方順時針算
const arcD = (r, a1, a2) => {
  const P = a => `${(r * Math.sin(rad(a))).toFixed(2)},${(-r * Math.cos(rad(a))).toFixed(2)}`;
  return `M${P(a1)} A${r},${r} 0 0 1 ${P(a2)}`;
};
const RET_SVG = (() => {
  const inner = [0, 120, 240].map(a => `<path d="${arcD(16, a, a + 70)}"/>`).join('');
  const outer = [20, 110, 200, 290].map(a => `<path d="${arcD(23, a, a + 32)}"/>`).join('');
  const ticks = [0, 90, 180, 270].map(a => {
    const x1 = 25 * Math.sin(rad(a)), y1 = -25 * Math.cos(rad(a)), x2 = 30 * Math.sin(rad(a)), y2 = -30 * Math.cos(rad(a));
    return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
  }).join('');
  return `<svg class="a1" viewBox="-26 -26 52 52"><g fill="none" stroke="rgba(111,211,255,.9)" stroke-width="1.6">${inner}</g></svg>`
    + `<svg class="a2" viewBox="-26 -26 52 52"><g fill="none" stroke="rgba(240,166,58,.85)" stroke-width="1.6">${outer}</g>`
    + `<g stroke="rgba(111,211,255,.5)" stroke-width="1">${ticks}</g></svg>`;
})();
const tyRet = ghost => L.divIcon({
  className: '', iconSize: [52, 52], iconAnchor: [26, 26],
  html: `<div class="ty-ret${ghost ? ' ghost' : ''}">${RET_SVG}<i>🌀</i></div>`,
});

const PH_COL = { pre: '#54C7EA', sea: '#EFAA35', land: '#EF5B4C', out: '#3FCB8E' };
const PH_TXT = { pre: '未達警報範圍', sea: '海警範圍內', land: '陸警範圍內', out: '已離開警報範圍' };
// 某時刻颱風在哪一段：陸警範圍內 > 海警範圍內 > 已離開 > 還沒到
function phaseAt(t) {
  const W = WARN;
  if (!W || !W.isTy) return 'pre';
  if (W.land && t >= W.land.affect && t <= W.land.clear) return 'land';
  if (W.sea && t >= W.sea.affect && t <= W.sea.clear) return 'sea';
  if (W.sea && t > W.sea.clear) return 'out';
  return 'pre';
}

/* 70% 機率範圍（潛勢錐）：每個預報點的 70% 半徑,逐時內插後往路徑左右各推出去一個半徑,
   連成一條越來越寬的帶子,末端補半圓。氣象署的潛勢預報圖也是這個意思：越後面中心越不確定。
   畫成一整塊多邊形而不是一顆顆圓 —— 圓疊在一起透明度會加深,看起來像某些地方特別危險。
   半徑一律用官方的 Radius70PercentProbability；外推路徑沒有這個數字,不畫。 */
function coneLatLngs(ty) {
  if (EXTRAP || !SERIES || SERIES.length < 2) return null;
  const nodes = [{ tau: 0, r: 0 }, ...TRACK.filter(f => f.r70 > 0).map(f => ({ tau: f.tau, r: f.r70 }))];
  if (nodes.length < 2) return null;
  const maxH = Math.min(nodes[nodes.length - 1].tau, SERIES.length - 1);
  const rAt = h => {
    let i = 0;
    while (i < nodes.length - 2 && nodes[i + 1].tau < h) i++;
    const a = nodes[i], b = nodes[i + 1];
    return a.r + (b.r - a.r) * clamp((h - a.tau) / ((b.tau - a.tau) || 1), 0, 1);
  };
  const posAt = h => SERIES[clamp(h, 0, maxH)].pos;
  const left = [], right = [];
  for (let h = 0; h <= maxH; h++) {
    const p = posAt(h), brg = bearing(posAt(h - 1), posAt(h + 1)), r = rAt(h);
    if (!(r > 0)) { left.push(p); continue; }
    left.push(destPoint(p, brg - 90, r)); right.push(destPoint(p, brg + 90, r));
  }
  const pe = posAt(maxH), be = bearing(posAt(maxH - 1), pe), re = rAt(maxH), cap = [];
  for (let a = -80; a <= 80; a += 10) cap.push(destPoint(pe, be + a, re));
  return [...left, ...cap, ...right.reverse()].map(q => [q.lat, q.lng]);
}

function drawMap(ty) {
  if (window.__noLeaflet || typeof L === 'undefined' || !ty.pos) { $('#mapWrap').style.display = 'none'; return; }
  $('#mapWrap').style.display = '';
  if (!MAP) initMap();
  if (MLAYER) MAP.removeLayer(MLAYER);
  // 時刻標記是獨立圖層,上面那行清不到它。只把變數設成 null 會讓舊圖層
  // 留在地圖上變成孤兒,每重畫一次多疊一個,所以要真的移除再重掛。
  if (TMARK) { MAP.removeLayer(TMARK); TMARK = null; }
  MLAYER = L.layerGroup().addTo(MAP);
  FCLABELS = []; ANCHORS = [];
  const pts = [[ty.pos.lat, ty.pos.lng]];

  // 彩色底圖（尤其衛星影像）底下什麼顏色都有,細線會被吃掉。
  // 每條路徑先鋪一條深色襯線再畫本體,亮處暗處都看得見。
  const cased = (latlngs, opt) => {
    L.polyline(latlngs, { color: '#040A10', weight: (opt.weight || 2) + 2.5, opacity: .55, interactive: false }).addTo(MLAYER);
    return L.polyline(latlngs, opt).addTo(MLAYER);
  };

  // ── 臺灣近海界線：海上颱風警報的門檻 ──────────────────────
  // 墊在最底層。暴風圈碰到這條線,就是氣象署發海警的條件。
  const seaKm = Number.isFinite(DB.cfg.seaBuffer) ? DB.cfg.seaBuffer : 100;
  if (seaKm > 0) {
    L.polyline(offshoreRing(seaKm), {
      color: '#54C7EA', weight: 1.4, opacity: .5, dashArray: '3,6',
      fill: false, interactive: false,
    }).addTo(MLAYER);
  }

  // ── 其他同時活動的颱風：琥珀色、輕量、可點選切換 ──────────
  // 先畫,讓選中的那顆疊在最上層。
  // 一併納入 fitBounds:多颱時要能一眼看到全部幾顆在哪裡,
  // 代價是臺灣會縮小一點 —— station 標記仍然畫著,要看細節就點選擇列切換,
  // 切過去之後這顆就變成主要颱風,框選也會跟著收斂。
  (DB.ty.list || []).forEach(o => {
    if (!o || !o.pos || tyKey(o) === tyKey(ty)) return;
    const k = tyKey(o), go = () => pickTyphoon(k);
    if (o.track && o.track.length) {
      L.polyline([[o.pos.lat, o.pos.lng], ...o.track.map(f => [f.pos.lat, f.pos.lng])],
        { color: '#EFAA35', weight: 1.6, dashArray: '5,5', opacity: .75 }).on('click', go).addTo(MLAYER);
      o.track.forEach(f => L.circleMarker([f.pos.lat, f.pos.lng],
        { radius: 2.5, color: '#EFAA35', fillColor: '#B4700B', fillOpacity: 1, weight: 1 }).addTo(MLAYER));
    }
    if (o.r15 > 0) L.circle([o.pos.lat, o.pos.lng], {
      radius: o.r15 * 1000, color: '#EFAA35', weight: 1.4,
      dashArray: '4,4', fillColor: '#EFAA35', fillOpacity: .06,
    }).addTo(MLAYER);
    L.marker([o.pos.lat, o.pos.lng], { icon: tyEye(false), zIndexOffset: 1100 })
      .bindTooltip(`${o.name}　${tcLabel(o.vmax)}（點選切換）`).on('click', go).addTo(MLAYER);
    ANCHORS.push(hudMarker([o.pos.lat, o.pos.lng], esc(o.name), `${fmtHr(o.t0)}　點選切換`, 'sec',
      hudOrder(o.pos, null, o.track && o.track.length ? o.track[0].pos : null), 1090).on('click', go).addTo(MLAYER));
    pts.push([o.pos.lat, o.pos.lng]);
  });

  // ── 70% 機率範圍：壓在路徑底下 ─────────────────────────
  const cone = coneLatLngs(ty);
  if (cone) L.polygon(cone, {
    color: '#F0A63A', weight: 1, opacity: .5, dashArray: '3,4', fillColor: '#F0A63A', fillOpacity: .1,
    fillRule: 'nonzero', interactive: false,
  }).addTo(MLAYER);

  /* 預報路徑依「暴風圈有沒有碰到警報範圍」分段上色（使用者要的：抵達海警線、陸警線、離開時變色）。
     判斷跟警報時機預判同一套（predictWarnings：七級風半徑碰到近海 100 km＝海警、碰到陸地＝陸警）,
     所以畫面上的顏色、轉換點時間,跟「警報」卡寫的時間一致。這是推估,不是官方發布。 */
  function drawPhased() {
    let cur = null, seg = [];
    const flush = () => { if (seg.length > 1) cased(seg, { color: PH_COL[cur], weight: 3, dashArray: '7,5' }); };
    for (const p of SERIES) {
      const ph = phaseAt(p.t), ll = [p.pos.lat, p.pos.lng];
      if (ph !== cur) { if (seg.length) { seg.push(ll); flush(); } cur = ph; seg = [ll]; }
      else seg.push(ll);
    }
    flush();
    // 轉換點：進入／離開兩條線各標一次
    const mark = (t, txt, cls) => {
      if (!Number.isFinite(t)) return;
      const p = SERIES.reduce((a, b) => Math.abs(b.t - t) < Math.abs(a.t - t) ? b : a);
      if (Math.abs(p.t - t) > 2 * 3600000) return;          // 落在預報範圍外就不標
      // 只放圓點（點了看時間）：進入海警、進入陸警常常只差一兩個小時,文字標籤會疊成一團。
      // 四個時間另外列在地圖下方（phaseTimes）。
      L.circleMarker([p.pos.lat, p.pos.lng], { radius: 6, color: '#FFFFFF', weight: 2, fillColor: PH_COL[cls], fillOpacity: 1 })
        .bindTooltip(`${txt}　${fmtShort(t)}（推估）`).addTo(MLAYER);
    };
    const W = WARN;
    if (W.sea) { mark(W.sea.affect, '進入海警範圍', 'sea'); mark(W.sea.clear, '離開海警範圍', 'out'); }
    if (W.land) { mark(W.land.affect, '進入陸警範圍', 'land'); mark(W.land.clear, '離開陸警範圍', 'sea'); }
  }

  // ── 已發生路徑：白色實線（參考畫面的畫法）,每 6 小時一個點 ──────
  const past = (ty.past || []).filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lng));
  if (past.length > 1) cased(past.map(p => [p.lat, p.lng]), { color: '#FFFFFF', weight: 2, opacity: .92 });
  /* 點只畫在 2／8／14／20 時（氣象署的整點分析時刻）,時間標籤只標最近三天 ——
     兩週前的位置在畫面外,標了也只是讓疏化多一堆東西要比。最後一點是中心本身,不另外標。 */
  past.forEach((p, i) => {
    if (!p.t || i === past.length - 1 || new Date(p.t).getHours() % 6 !== 2) return;
    L.circleMarker([p.lat, p.lng], { radius: 3, color: '#040A10', weight: 1, fillColor: '#FFFFFF', fillOpacity: 1 })
      .bindTooltip(`${fmtShort(p.t)}　${p.vmax ? bfLabel(ms2bf(p.vmax)) : ''}（氣象署分析位置）`).addTo(MLAYER);
    if (ty.t0 - p.t <= 72 * 3600000) {
      FCLABELS.push(L.marker([p.lat, p.lng], { icon: lbIcon(fmtHr(p.t), 'trk-lb'), interactive: false, keyboard: false, pri: 3 }).addTo(MLAYER));
    }
  });

  // ── 預報路徑與預報點 ─────────────────────────────────────
  if (TRACK.length) {
    const tp = TRACK.map(f => [f.pos.lat, f.pos.lng]);
    // 外推路徑用另一個顏色與更疏的虛線,一眼就看得出不是官方預報。
    const tcol = EXTRAP ? '#EFAA35' : '#54C7EA';
    if (!EXTRAP && SERIES && SERIES.length > 1 && WARN && WARN.isTy) drawPhased();
    else cased([[ty.pos.lat, ty.pos.lng], ...tp],
      { color: tcol, weight: 2.5, dashArray: EXTRAP ? '2,7' : '7,5' });
    TRACK.forEach(f => {
      const t = ty.t0 + f.tau * 3600000;
      const col = EXTRAP ? tcol : (WARN && WARN.isTy ? PH_COL[phaseAt(t)] : tcol);
      const tip = [`${fmtShort(t)}（+${f.tau}h）`, bfLabel(ms2bf(f.vmax)),
        f.r15 ? `七級 ${f.r15} km` : '', f.r25 ? `十級 ${f.r25} km` : '', f.r70 ? `70% 半徑 ${f.r70} km` : '', f.st || '']
        .filter(Boolean).join('　') + (EXTRAP ? '（外推推估，非官方預報）' : '（氣象署預報）');
      L.circleMarker([f.pos.lat, f.pos.lng], { radius: 3.5, color: '#040A10', weight: 1, fillColor: col, fillOpacity: 1 })
        .bindTooltip(tip).addTo(MLAYER);
      // 每個預報點標上「幾點」—— 排班的人要的是時刻,時距（+24h）在提示裡
      FCLABELS.push(L.marker([f.pos.lat, f.pos.lng], {
        icon: lbIcon(fmtHr(t) + (EXTRAP ? ' 外推' : ''), 'trk-lb', col), interactive: false, keyboard: false, pri: 2,
      }).addTo(MLAYER));
      pts.push([f.pos.lat, f.pos.lng]);
    });
  }

  // ── 現在的暴風圈：七級琥珀虛線、十級紅色實線,半徑直接標在圈上 ──────
  // 沒有暴風圈就不要畫圈 —— 熱帶性低氣壓本來就沒有七級風範圍
  const c0 = [ty.pos.lat, ty.pos.lng];
  if (ty.r15 > 0) {
    L.circle(c0, {
      radius: ty.r15 * 1000, color: '#F0A63A', weight: 1.8, dashArray: '7,5',
      fillColor: '#F0A63A', fillOpacity: .05, className: 'r7-ring',
    }).bindTooltip(`七級風暴風半徑 ${ty.r15} km`).addTo(MLAYER);
    const q = destPoint(ty.pos, 45, ty.r15);
    ANCHORS.push(L.marker([q.lat, q.lng], { icon: lbIcon(`七級 ${ty.r15}km`, 'rad-lb', '#F0A63A'), interactive: false, keyboard: false }).addTo(MLAYER));
  }
  if (ty.r25 > 0) {
    L.circle(c0, {
      radius: ty.r25 * 1000, color: '#FF5247', weight: 1.8, fillColor: '#FF5247', fillOpacity: .08,
    }).bindTooltip(`十級風暴風半徑 ${ty.r25} km`).addTo(MLAYER);
    const q = destPoint(ty.pos, 45, ty.r25);
    FCLABELS.push(L.marker([q.lat, q.lng], { icon: lbIcon(`十級 ${ty.r25}km`, 'rad-lb', '#FF5247'), interactive: false, keyboard: false, pri: 0 }).addTo(MLAYER));
  }

  L.marker(c0, { icon: tyRet(false), zIndexOffset: 1300 })
    .bindTooltip(`${ty.name}　${tcLabel(ty.vmax)}`).addTo(MLAYER);
  const en = ty.en && ty.en !== ty.name ? ' ' + esc(ty.en) : '';
  const prev = past.length > 1 ? past[past.length - 2] : null;
  const order = hudOrder(ty.pos, prev, TRACK.length ? TRACK[0].pos : null, ty.r15 > 0 ? [45] : []);
  ANCHORS.unshift(hudMarker(c0, `${esc(ty.name)}${en}`, `${ty.pos.lat.toFixed(1)}N ${ty.pos.lng.toFixed(1)}E　${fmtHr(ty.t0)}`,
    '', order, 1290).addTo(MLAYER));

  drawProb();
  drawStations(pts);
  drawLtn();
  /* 切到颱風頁的當下 #map 可能還沒有尺寸（剛從 display:none 出來）,
     這時候 fitBounds 會拿 0×0 去算縮放,結果縮到 zoom 0 ——
     整個世界擠成一團,颱風跟站臺全部疊在畫面中央。
     所以要先 invalidateSize 讓 Leaflet 量到真正的大小,再 fitBounds。 */
  /* 兩種框選：全域（颱風＋站臺一起看得到）與對焦站臺（只框自己的點）。
     颱風還在一千多公里外的時候,全域框出來站臺就是海岸線上的一小撮 ——
     「我的站臺現在長怎樣」那個問題,在那個縮放下根本回答不了。 */
  const fit = MAPFIT = () => {
    const good = pts.filter(p => Number.isFinite(p[0]) && Number.isFinite(p[1]));
    const mine = MYPTS.filter(p => Number.isFinite(p[0]) && Number.isFinite(p[1]));
    const use = (MAPFOCUS === 'tw' && mine.length) ? mine : good;
    if (use.length > 1) MAP.fitBounds(L.latLngBounds(use).pad(0.28));
    else if (use.length === 1) MAP.setView(use[0], 10);
  };
  applyMapTab();
  MAP.invalidateSize();
  fit();
  drawTimeMarker();                  // 主圖重畫後把時刻標記掛回去
  syncScrub();
  renderLegend();
  declutterLabels();
  // 版面若還在收斂（字級切換、旋轉螢幕）,晚一拍再量一次並重新框。
  setTimeout(() => { MAP.invalidateSize(); fit(); declutterLabels(); if (FLOW) FLOW.kick(); }, 80);
}

/* ═══ 回報產出 ═══════════════════════════════════════════ */
const CN = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '十二', '十三', '十四', '十五',
  '十六', '十七', '十八', '十九', '二十', '二十一', '二十二', '二十三', '二十四', '二十五', '二十六', '二十七', '二十八', '二十九', '三十'];
/* 回報的日期照單位原本的寫法「（7月10日）」——用 fmtMD 會變成「（10月22日(四)）」,
   括號套括號,看起來就像結尾多了一個「）」。 */
const repMD = ts => { const d = new Date(ts); return `${d.getMonth() + 1}月${d.getDate()}日`; };
/* 使用者指定的寫法：「○○於10月9日1640時完成關機」——日期在前、時間在後,不再把日期括在句尾。 */
function repLine(s, opt) {
  let t = `${s.name}於${repMD(s.at)}${fmtHM(s.at)}${S_VERB[s.status]}`;
  if (opt.hum && s.hum != null && s.hum !== '' && s.status !== 'on') t += `（濕度${s.hum}%）`;
  return t + '。';
}
function blk(title, items, opt) {
  return { title, body: items.length ? items.map((x, i) => `${i + 1}.${x}`).join('\n') : (opt.empty ? '1.無。' : ''), n: items.length };
}
function joinBlocks(bs, opt) {

      if (h < 24 && mi < 60) { ctx.msgAt = gTs(null, h, mi, ctx); ctx.sender = x[4].trim(); body = x[5]; }
    } else if ((x = line.match(/^([^:：\d\s]{1,10})[:：]\s*(.+)$/)) && !NOT_SENDER.test(x[1])
      && !gStations(gNorm(x[1]), keys).length && !ACT_ONE.test(x[1])) {
      // 「王小明：…」只算這一行：沒有訊息邊界,不能讓下一行別人寫的也算成他說的
      lc = Object.assign({}, ctx, { sender: x[1], msgAt: 0 }); body = x[2];
    }
    let got = false;
    for (const seg of body.split(/[。；;]/)) {
      const sg = gNorm(seg);
      if (!sg || /[?？嗎呢]$/.test(sg)) continue;                       // 問句不是回報
      for (const it of gSeg(sg, lc, keys)) {
        it.key = hashS(sg + '|' + (lc.msgAt || '') + '|' + it.gi + '.' + it.si);
        it.line = line; it.sender = lc.sender; it.msgAt = lc.msgAt; it.type = lc.type; it.asOf = lc.asOf || 0; it.unit = lc.unit || '';
        items.push(it); got = true;
      }
    }
    // 括號裡的補充（「1.○○雷達站（10月22日1100時開機，由發電機供電）」）不算事件：主句已經是狀態回報了
    const ev = EVENT_RE.test(body.replace(/[(（][^)）]*[)）]/g, '')) ? evText(body) : '';
    if (ev && (/案/.test(ev) || ev.length >= 20)) addEv(ev, lc, line);
    else if (!got) other.push(line);
  }
  closeSec();
  return { items, other, events, warns, units: [...units] };
}

let IMP = null;                        // 最近一次比對的結果（套用、確認後重算）
/* 判讀 → 套上問過的答案 → 每站取最新一筆 → 跟目前站臺比、跟上一份貼上比 */
/* 沒寫時間的站（使用者：「截止至24日1010時」是截止時間,不是每一站都改成 1010,應該用之前的時間）：
   1. 同一段裡更早明寫過時間的同一站同一狀態；
   2. 狀態跟站臺現在一樣 → 站臺原本的時間；
   3. 之前貼過的報告明寫過這站進入這個狀態的時間（DB.paste.known）,而且比站臺現在的狀態新
      （比較舊的是上一輪的事,拿來用會把時間倒退）；
   4. 都沒有才用報告的「截止至」時間,標「截止時間」並列進「請查明」——實際時間只會比它早。 */
function fillLastTime(items, known) {
  items.forEach((it, i) => {
    if (it.atFrom !== 'need') return;
    const st = it.sid ? DB.stations.find(x => x.id === it.sid) : null;
    const nk = nameKey(st ? st.name : it.cand || '');
    const same = items.slice(0, i).reverse().find(x => (it.sid ? x.sid === it.sid : !x.sid && nameKey(x.cand || '') === nk)
      && x.status === it.status && x.at && (x.atFrom === 'text' || x.atFrom === 'msg'));
    if (same) { it.at = same.at; it.atFrom = 'last'; return; }
    if (st && st.status === it.status) { it.at = st.at; it.atFrom = 'last'; return; }
    const k = known && known[nk];
    if (k && k.s === it.status && (!st || k.at > st.at) && k.at <= (it.asOf || Date.now()) + 60000) {
      it.at = k.at; it.atFrom = 'known'; return;
    }
    if (it.asOf) { it.at = it.asOf; it.atFrom = 'asof'; return; }
    it.at = st ? st.at : Date.now(); it.atFrom = 'last';
  });
}
function pasteDiff(text) {
  const R = readGroup(text), M = DB.paste || {}, F = M.fix || {};
  fillLastTime(R.items, M.known);
  const ok = [], ask = [], skipped = [];
  for (const it of R.items) {
    const f = F[it.key];
    if (f && f.skip) { skipped.push(it); continue; }
    if (f) {
      // 當時選「新增站臺」、後來已經建好了：對到那一站（不然會再建一次）
      const st = f.sid ? DB.stations.find(x => x.id === f.sid) : DB.stations.find(x => nameKey(x.name) === nameKey(f.name || ''));
      if (f.sid && !st) { ask.push(it); continue; }                      // 對到的站後來被刪了：重問
      ok.push(Object.assign({}, it, { sid: st ? st.id : '', cand: st ? '' : f.name, type: f.type || it.type,
        status: f.status, at: f.at, hum: f.hum, why: [], src: 'fix' }));
      continue;
    }
    (it.why.length ? ask : ok).push(it);
  }
  /* 同一站好幾句：狀態一樣時,句子裡明寫的時間勝過推來的（清單寫 jj 關機、只有截止時間 1010；
     第三點寫「雷達設備已於1000時完成關機」→ 用 1000）。狀態不同就取最新的。 */
  const explicit = x => x.src === 'fix' || x.atFrom === 'text' || x.atFrom === 'msg';
  const by = new Map();
  let merged = 0;
  for (const it of ok) {
    const k = it.sid ? 'id:' + it.sid : 'nm:' + nameKey(it.cand);
    const p = by.get(k);
    if (p) merged++;
    if (!p || (p.status === it.status && explicit(p) !== explicit(it) ? explicit(it) : it.at >= p.at)) by.set(k, it);
  }
  const rows = [...by.values()].map(it => {
    const ex = it.sid ? DB.stations.find(x => x.id === it.sid) : null;
    // 沒寫濕度不算「濕度變了」：群組訊息常常省略濕度,不能因此把現有的濕度清掉
    const kind = !ex ? 'new' : ex.status !== it.status ? 'status'
      : Math.abs(ex.at - it.at) >= 60000 ? 'time'
      : it.hum != null && (ex.hum ?? null) !== it.hum ? 'hum' : 'same';
    return { name: ex ? ex.name : it.cand, sid: ex ? ex.id : '', type: ex ? ex.type : it.type,
      status: it.status, at: it.at, hum: it.hum, kind, ex, it };
  }).sort((a, b) => a.at - b.at);
  // 跟上一份「不同的」貼上比：換了新文字 → 上一份是記住的那份；同一段文字重按比對（或套用後重算）→ 跟再前一份比
  const base = M.text && M.text !== text ? { at: M.at, rows: M.rows || [] } : M.prev;
  const prev = (base && base.rows) || [], pb = new Map(prev.map(r => [nameKey(r.name), r]));
  rows.forEach(r => {
    const p = r.was = pb.get(nameKey(r.name)) || null;
    r.fresh = !!base && (!p || p.status !== r.status || p.at !== r.at || (p.hum ?? null) !== (r.hum ?? null));
  });
  const cur = new Set(rows.map(r => nameKey(r.name)));
  const cmp = base ? { add: rows.filter(r => !r.was), chg: rows.filter(r => r.was && r.fresh),
    gone: prev.filter(p => !cur.has(nameKey(p.name))) } : null;
  /* 使用者：新增或減少的單位要挑出來查明。報告寫了單位就只比那個單位的站（含依位置推估的）；
     名單還沒分單位時比全部。只列關、待機的報告（上級彙整常這樣）沒提到多半是照常運作,
     有列「正常運作」的才是完整名冊——roster 為真時沒提到的站才算「減少」、放進請查明。 */
  const us = R.units || [], inU = s => us.includes(unitOf(s).k);
  const pool = DB.stations.filter(s => IS_LIVE(s) && inReport(s));
  const scoped = us.length && pool.some(inU) ? pool.filter(inU) : pool;
  const missing = scoped.filter(s => !cur.has(nameKey(s.name)));
  const roster = R.items.some(it => it.gi === 'L' && it.status === 'on');
  const unassigned = us.length ? rows.filter(r => r.ex && !r.ex.unit && r.it.unit) : [];
  const otherUnit = rows.filter(r => r.ex && r.ex.unit && r.it.unit && unitKey(r.ex.unit) !== r.it.unit);
  const asof = rows.filter(r => r.it.atFrom === 'asof' && r.kind !== 'same');
  const events = R.events.map(e => Object.assign(e, { added: (DB.events || []).some(x => x.key === e.key) }));
  return { rows, ok, ask, skipped, other: R.other, events, merged, missing, cmp, prevAt: base ? base.at : 0,
    units: us, warns: R.warns || [], roster, unassigned, otherUnit, asof };
}
// 比對時把這次的內容記成「上次貼上」,下一回才比得出差異；同一段文字只更新結果（確認過的答案會改變結果）
function pasteRemember(text, D) {
  const P = DB.paste || (DB.paste = {});
  if (P.text !== text) { if (P.text) P.prev = { at: P.at, rows: P.rows || [] }; P.text = text; P.at = Date.now(); }
  P.rows = D.rows.map(r => ({ name: r.name, status: r.status, at: r.at, hum: r.hum ?? null }));
  // 句子裡明寫的時間記下來：之後的報告只列站名、沒寫時間時拿來用（fillLastTime 第 3 步）
  const K = P.known || (P.known = {});
  for (const it of D.ok) {
    if (!it.at || !(it.src === 'fix' || it.atFrom === 'text' || it.atFrom === 'msg')) continue;
    const st = it.sid && DB.stations.find(x => x.id === it.sid), nm = st ? st.name : it.cand;
    if (!nm) continue;
    const k = nameKey(nm);
    if (!K[k] || K[k].at <= it.at) K[k] = { s: it.status, at: it.at, t: Date.now() };
  }
  const ks = Object.keys(K);
  if (ks.length > 600) ks.sort((a, b) => K[a].t - K[b].t).slice(0, ks.length - 600).forEach(k => delete K[k]);
}
function autoUnits(D) {
  const ua = (D.unassigned || []).filter(r => r.ex && !r.ex.unit);
  ua.forEach(r => { r.ex.unit = r.it.unit; r.ex.mt = Date.now(); });
  return ua.length;
}
function pasteFix(key, v) {
  const F = (DB.paste || (DB.paste = {})).fix || (DB.paste.fix = {});
  F[key] = Object.assign({ t: Date.now() }, v);
  // 只留最近 400 句的答案：一場颱風的群組訊息綽綽有餘,舊的不必一直帶著
  const ks = Object.keys(F);
  if (ks.length > 400) ks.sort((a, b) => F[a].t - F[b].t).slice(0, ks.length - 400).forEach(k => delete F[k]);
}
function refreshImp() {
  const P = DB.paste || {};
  if (P.text) { IMP = pasteDiff(P.text); pasteRemember(P.text, IMP); save(); }
  renderImp();
}
function applyPaste(rows) {
  let n = 0;
  for (const r of rows) {
    if (r.kind === 'new') {
      const st = { id: uid(), name: r.name, type: r.type || (DB.types[0] || {}).id, status: r.status, at: r.at,
        hum: r.status === 'on' ? null : r.hum ?? null, note: '', lat: null, lng: null, mt: Date.now(),
        unit: (r.it && r.it.unit) || '' };
      DB.stations.push(st);
      DB.log.push({ id: uid(), t: Date.now(), sid: st.id, name: st.name, from: null, to: r.status, at: r.at, hum: st.hum, src: 'paste' });
      n++; continue;
    }
    const st = DB.stations.find(x => x.id === r.sid);
    if (!st) continue;
    if (r.kind === 'status') {
      DB.log.push({ id: uid(), t: Date.now(), sid: st.id, name: st.name, from: st.status, to: r.status,
        prevAt: st.at, prevHum: st.hum ?? null, at: r.at, hum: r.hum ?? null, src: 'paste' });
      st.status = r.status; st.at = r.at;
      st.hum = r.status === 'on' ? null : r.hum ?? st.hum ?? null;
    } else if (r.kind === 'time') {
      // 狀態一樣、時間不同：改時間,最新那一筆紀錄跟著改,不另外多一筆「變更」
      const last = DB.log.filter(x => (x.sid === st.id || x.name === st.name) && x.to === st.status)
        .sort((a, b) => b.at - a.at)[0];
      if (last && isLatestOf(last)) last.at = r.at;
      st.at = r.at;
      if (r.hum != null) st.hum = r.hum;
    } else if (r.kind === 'hum') st.hum = r.hum;
    st.mt = Date.now(); n++;
  }
  save(); rebuildModel(); renderStations(); renderTyphoon({}); generate();
  toast(`已套用 ${n} 項`);
}

/* 逐筆確認：看不懂的、名單裡沒有的一句一句問。也用來修改判讀成功的那幾筆（edit）。
   答案以「這一句」記住：整段聊天紀錄再貼一次,問過的不再問。 */
function openAsk(list, i, edit) {

  const opts = grp.map(([lb, ss]) => `<optgroup label="${esc(lb)}">${ss.map(s =>

  openSheet(edit ? '修改這筆判讀' : `要你確認　${i + 1} / ${n}`, `

      <p>${esc(it.line)}</p></div>
    ${why ? `<div class="msg w" style="margin-bottom:0.75rem">${why}</div>` : ''}
    <label class="fld"><span class="lb">站臺</span><select id="ak_sid"><option value="">請選擇</option>${opts}
      <option value="__new"${sel === '__new' ? ' selected' : ''}>＋ 新增站臺</option></select></label>
    <div id="ak_new"${sel === '__new' ? '' : ' hidden'}><div class="two">

      <label class="fld"><span class="lb">類別</span><select id="ak_type">${DB.types.map(t =>
        `<option value="${t.id}"${t.id === it.type ? ' selected' : ''}>${esc(t.label)}</option>`).join('')}</select></label></div></div>
    <div class="two">
      <label class="fld"><span class="lb">狀態</span><select id="ak_st">${it.status ? '' : '<option value="">請選擇</option>'}${
        ['off', 'standby', 'on'].map(k => `<option value="${k}"${k === it.status ? ' selected' : ''}>${S_LABEL[k]}</option>`).join('')}</select></label>
      <label class="fld"><span class="lb">濕度 %</span><input type="number" id="ak_hum" min="0" max="100" inputmode="numeric"
        value="${it.hum ?? ''}" placeholder="—"></label></div>
    <label class="fld"><span class="lb">時間${it.atFrom === 'msg' ? '（句子沒寫，先用訊息時間）' : it.atFrom === 'last' ? '（句子沒寫，沿用這站最後紀錄的時間）' : it.atFrom === 'asof' ? '（句子沒寫，用報告的「截止至」時間，實際只會更早）' : it.atFrom === 'known' ? '（句子沒寫，用之前報告寫的時間）' : ''}</span>
      <input type="datetime-local" id="ak_at" value="${toInput(it.at || it.msgAt || Date.now())}"></label>
    <label class="ask-learn" id="ak_lb" hidden><input type="checkbox" id="ak_learn" checked><span id="ak_lt"></span></label>
    <div class="btnrow"><button class="btn pri" id="ak_ok" style="flex:2">${edit ? '儲存' : i < n - 1 ? '確認，下一筆' : '確認'}</button>
      <button class="btn" id="ak_skip" style="flex:1">${edit ? '不採用' : '略過'}</button></div>
    ${!edit && n - i > 1 ? `<button class="btn sm wide" id="ak_rest" style="margin-top:0.5rem">剩下 ${n - i} 筆都略過</button>` : ''}`,
  () => {
    let learnKey = '';

      const v = $('#ak_sid').value, st = DB.stations.find(x => x.id === v);
      $('#ak_new').hidden = v !== '__new';

        learnKey = gNorm(it.cand); $('#ak_lt').textContent = `記住：以後看到「${it.cand}」就是 ${st.name}`;

      }

    const next = () => { if (edit || i + 1 >= n) { closeSheet(); refreshImp(); } else openAsk(list, i + 1); };
    $('#ak_ok').onclick = () => {
      const sid = $('#ak_sid').value, status = $('#ak_st').value;
      if (!sid) return toast('請選站臺；不是回報的話按「略過」');
      if (!status) return toast('請選開機、待機或關機');
      const at = fromInput($('#ak_at').value);
      // 跟判讀（gTs）同一把尺：比現在晚 10 分鐘內算今天。以前這裡只容 5 分鐘——06:39 貼「0645 關機」
      // 判讀成今天 06:45、這裡卻說在未來,按確認永遠過不去

{
  const box = document.getElementById('impBody');
  let draftT = null;
  box.addEventListener('input', e => {
    if (e.target.id !== 'impText') return;
    clearTimeout(draftT);
    draftT = setTimeout(() => { (DB.paste || (DB.paste = {})).draft = e.target.value; save(); }, 400);
  });
  box.addEventListener('change', e => {
    // 事件的勾選記在比對結果上：改字後整張卡會重畫,不能把取消的又勾回去
    const ec = e.target.closest('[data-evp]');
    if (ec && IMP && IMP.events[+ec.dataset.evp]) { IMP.events[+ec.dataset.evp].off = !ec.checked; return; }
    const cb = e.target.closest('[data-dif]');
    if (!cb) return;
    const n = box.querySelectorAll('[data-dif]:checked').length;
    const btn = document.getElementById('impApply');

    if (b.dataset.unskip) { const F = (DB.paste || {}).fix || {}; delete F[b.dataset.unskip]; save(); return refreshImp(); }
    if (b.dataset.unalias) { delete (DB.alias || {})[b.dataset.unalias]; save(); toast('已刪除這個寫法'); return refreshImp(); }
    if (id === 'impGo') {

      (DB.paste || (DB.paste = {})).draft = ta.value;

      const nu = autoUnits(IMP);

    } else if (id === 'impAll') {

function tglOn(sel) { return $(sel).getAttribute('aria-pressed') === 'true'; }
function bindToggle(sel, get, set) {
  const el = $(sel);
  el.setAttribute('aria-pressed', String(!!get()));
  el.onclick = () => {
    const v = el.getAttribute('aria-pressed') !== 'true';
    el.setAttribute('aria-pressed', String(v)); set(v);
  };
}

/* ── 底部彈出面板 ────────────────────────────────────── */
function openSheet(title, html, mount) {
  $('#shTitle').textContent = title;
  /* 換一個新的 #shBody：排序、類別視窗會在它上面掛 click／input 監聽，以前從來沒拿掉,
     開過幾次之後每一次點擊都會跑好幾個舊視窗的處理函式。 */
  const old = $('#shBody'), body = old.cloneNode(false);
  old.replaceWith(body);
  body.innerHTML = html;
  $('#sheet').classList.add('on');
  document.body.style.overflow = 'hidden';
  if (mount) mount();
}
function closeSheet() { $('#sheet').classList.remove('on'); document.body.style.overflow = ''; }
$('#shClose').onclick = closeSheet;
$('.sheet-bg').onclick = closeSheet;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

      <input type="datetime-local" id="f_at" value="${toInput(s ? s.at : Date.now())}"></label>
    <label class="fld"><span class="lb">所屬單位</span>
      <input type="text" id="f_unit" value="${esc(s && s.unit ? s.unit : '')}" list="f_units" placeholder="留空：貼報告時自動歸、或依位置推估" autocomplete="off">
      <datalist id="f_units">${[...new Set(DB.stations.map(x => unitKey(x.unit)).filter(Boolean))].map(k => `<option value="${esc(k)}">`).join('')}</datalist>
      <span class="sub">同一轄區的不同寫法會歸成同一個，對照在「設定 › 單位與回報用語」。${s && !s.unit && unitOf(s).k ? `目前依 ${esc(unitOf(s).from)}（${unitOf(s).km} km）推估是 ${esc(unitOf(s).k)}。` : ''}</span></label>
    <label class="fld"><span class="lb">座標　萬用輸入</span>
      <input type="text" id="f_ll" value="${s && Number.isFinite(s.lat) ? `${s.lat}, ${s.lng}` : ''}"
        placeholder="24.2534, 120.5123　或　24°15'12&quot;N 120°30'44&quot;E">
      <span class="sub" id="f_llout">度分秒、十進位、海圖式 2415.20N 12030.50E、N24 15.2 E120 30.5 都能辨識，經緯寫反會自動修正。填了才能推算該站陣風與待機時機。</span></label>
    <div class="btnrow" style="margin:-4px 0 0.875rem">
      <button class="btn sm" id="f_gps">用目前位置</button>
      <button class="btn sm" id="f_clr">清除座標</button></div>
    <div class="two">
      <label class="fld"><span class="lb">現場濕度 %</span>
        <input type="number" id="f_hum" min="0" max="100" value="${s && s.hum != null ? s.hum : ''}" placeholder="未量測"></label>
      <label class="fld"><span class="lb">備註</span>
        <input type="text" id="f_note" value="${esc(s ? s.note : '')}" placeholder="選填"></label></div>
    ${s ? (() => {
      const c = s.cal || {};
      const dirs = (c.dir || []).map((d, i) => d && d.n ? `${OCT_NAME[i]} ×${d.k.toFixed(2)}（${d.n}）` : '')
        .filter(Boolean).join('、');
      return `<label class="fld"><span class="lb">地形校正</span>
        <input type="text" id="f_cal" value="${Number.isFinite(s.calManual) ? s.calManual : ''}"
          inputmode="decimal" placeholder="${c.n >= CAL_MIN_N ? `自動 ×${c.k.toFixed(2)}` : '自動（樣本不足，暫不校正）'}">
        <span class="sub">推估風力會乘上這個係數。程式會拿這個站附近 ${CAL_MAX_KM} km 內測站的實測
          跟推估相比，自動累積出係數${c.n ? `——目前 <b>${c.n}</b> 筆，整體 ×${c.k.toFixed(2)}${
            c.src ? `（最近取 ${esc(c.src)} ${c.km} km）` : ''}` : '，目前還沒有樣本'}。
          ${dirs ? `各方位：${dirs}。` : ''}
          填數字可手動覆寫（${CAL_LO}–${CAL_HI}），留空則用自動值。</span></label>
      <div class="sw" style="margin-bottom:0.875rem"><div class="sw-t"><b>停用校正</b>
        <small>只用原始模型值，不做任何修正</small></div>
        <button class="tgl" id="f_caloff" aria-pressed="${!!s.calOff}"></button></div>
      ${c.n ? `<div class="btnrow" style="margin:-0.5rem 0 0.875rem">
        <button class="btn sm" id="f_calreset">清除已學到的係數</button></div>` : ''}`;
    })() : ''}
    <label class="fld"><span class="lb">停班停課雨量基準</span>
      <select id="f_terr">
        <option value="">依類別（${s ? TERRAIN[terrainOf(s)].thr : DGPA_FLAT} mm）</option>
        ${Object.entries(TERRAIN).map(([k, v]) =>
          `<option value="${k}" ${s && s.terrain === k ? 'selected' : ''}>${v.thr} mm（${v.label}）</option>`).join('')}
      </select>
      <span class="sub">同一種設備架在山上還是海邊是位置的事，這裡可以覆寫類別的設定。
      實際比對時會依該站所在縣市查第四條附表。</span></label>
    ${s ? wxLogHtml(s.id) : ''}
    <div class="btnrow">
      <button class="btn pri" id="f_save">儲存</button>
      ${s ? '<button class="btn dg" id="f_del">刪除</button>' : ''}</div>`,
    () => {
      const out = $('#f_llout');
      const show = () => {
        const v = $('#f_ll').value.trim();
        if (!v) { out.textContent = '未填座標時，該站不會出現在風力推估與衝擊預判中。'; out.style.color = ''; return; }
        const c = parseCoord(v);
        if (c) { out.textContent = `辨識為 ${fmtCoord(c.lat, c.lng)}　（${c.lat.toFixed(5)}, ${c.lng.toFixed(5)}）`; out.style.color = 'var(--acc)'; }
        else { out.textContent = '無法辨識這組座標，請確認格式。'; out.style.color = 'var(--no)'; }
      };
      $('#f_ll').addEventListener('input', show); show();
      $('#f_clr').onclick = () => { $('#f_ll').value = ''; show(); };
      $('#f_gps').onclick = () => {
        if (!navigator.geolocation) return toast('此裝置不支援定位');
        toast('定位中…');
        navigator.geolocation.getCurrentPosition(
          p => { $('#f_ll').value = `${p.coords.latitude.toFixed(6)}, ${p.coords.longitude.toFixed(6)}`; show(); },
          () => toast('取得定位失敗，請確認已允許定位權限'), { enableHighAccuracy: true, timeout: 10000 });
      };
      if (s) {
        const off = $('#f_caloff');
        if (off) off.onclick = () => {
          s.calOff = off.getAttribute('aria-pressed') !== 'true';
          off.setAttribute('aria-pressed', String(s.calOff));
          save(); rebuildModel(); renderStations(); renderTyphoon({});
        };
        const rst = $('#f_calreset');
        if (rst) rst.onclick = () => {
          s.cal = { k: 1, n: 0, at: 0, dir: [] };
          save(); rebuildModel(); renderStations(); renderTyphoon({}); closeSheet();
          toast('已清除該站的校正係數');
        };
      }
      $('#f_save').onclick = () => {
        const name = $('#f_name').value.trim();
        if (!name) return toast('請填站臺名稱');
        const llv = $('#f_ll').value.trim();
        const c = llv ? parseCoord(llv) : null;
        if (llv && !c) return toast('座標格式無法辨識，請修正或清空');
        const humv = $('#f_hum').value.trim();
        const d = {
          name, type: $('#f_type').value, status: $('#f_status').value,
          at: fromInput($('#f_at').value),
          lat: c ? c.lat : null, lng: c ? c.lng : null,
          hum: humv === '' ? null : clamp(+humv, 0, 100),
          note: $('#f_note').value.trim(),
          terrain: $('#f_terr').value || null,
          unit: unitKey($('#f_unit').value.trim()),
        };
        const calIn = $('#f_cal');
        if (calIn) {
          const v = parseFloat(calIn.value);
          d.calManual = Number.isFinite(v) && v > 0 ? clamp(v, CAL_LO, CAL_HI) : null;
        }
        /* mt＝最後一次被人改動的時刻。跟 at（「從什麼時候開始是這個狀態」）
           不是同一件事:改座標、改名字不會動到 at,但那確實是一次修改。
           團隊同步要靠 mt 決定誰比較新 —— 只看 at 的話,對方補上的經緯度
           永遠傳不過來。 */
        d.mt = Date.now();
        if (s) { if (s.status !== d.status) DB.log.push({ t: Date.now(), name, from: s.status, to: d.status, at: d.at }); Object.assign(s, d); }
        else { DB.stations.push(Object.assign({ id: uid() }, d)); DB.log.push({ t: Date.now(), name, from: null, to: d.status, at: d.at }); }
        save(); rebuildModel(); renderStations(); renderTyphoon({}); renderSettings(); closeSheet(); toast('已儲存');
      };
      if (s) $('#f_del').onclick = () => {
        if (!confirm(`刪除「${s.name}」？無法復原。`)) return;
        DB.stations = DB.stations.filter(x => x.id !== s.id);
        save(); renderStations(); renderSettings(); closeSheet(); toast('已刪除');
      };
    });
}

/* ── 設定頁清單的排序 ────────────────────────────────────
   站臺頁的排序（DB.cfg.sort）是給值班掃狀態用的,會用到風級、離颱風遠近;
   設定頁的清單是用來「找到某一站去改它」,要的只有地理位置與名字。
   兩個分開存,互不影響。 */
const LIST_SORT = { ns: '由北至南', name: '名稱', type: '類別', custom: '自訂順序' };
const listSortKey = () => (LIST_SORT[DB.cfg.listSort] ? DB.cfg.listSort : 'ns');
function sortForList(list) {
  const k = listSortKey();
  const arr = list.slice();
  if (k === 'custom') return arr;
  const ti = id => DB.types.findIndex(t => t.id === id);
  const byName = (a, b) => String(a.name).localeCompare(String(b.name), 'zh-Hant');
  const byNs = (a, b) =>
    (Number.isFinite(b.lat) ? b.lat : -1e3) - (Number.isFinite(a.lat) ? a.lat : -1e3) || byName(a, b);
  if (k === 'name') return arr.sort(byName);
  if (k === 'type') return arr.sort((a, b) => (ti(a.type) - ti(b.type)) || byNs(a, b));
  return arr.sort(byNs);
}
