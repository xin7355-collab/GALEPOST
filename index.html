     「氣象署發警報了沒」跟「外面現在有沒有在下雨」。 */
  $('#tyWx').innerHTML = thunderCard() + wxCard();
  $('#tyWarnEst').innerHTML = warningCard();
  body.innerHTML = `<div class="card ty-hero">
    <div class="glow" style="background:${bfColor(bfV)}"></div>
    <div class="ty-top">${bfBadge(bfV, 'lg')}
      <div class="ty-nm"><b>${esc(ty.name)}</b>
        <span>${ty.en && ty.en !== ty.name ? esc(ty.en) + '　' : ''}<i style="font-style:normal;font-weight:700;color:${bfColor(bfV)}">${TC_FULL[tcClass(ty.vmax)] || ''}</i>　近中心最大風 ${bfLabel(bfV)}</span></div></div>
    <div class="ty-gr">${g.map(([l, v]) => `<div><b>${esc(v)}</b><small>${l}</small></div>`).join('')}</div>
  </div>` + glanceCard();

  drawMap(ty);
  renderImpact();
  renderForecast();
  paintBfBar(Math.max(bfV, ...DB.stations.filter(IS_LIVE)
    .map(s => (SERIES ? stationImpact(SERIES, s, DB.cfg)?.now.bf : -1) ?? -1)));
}

/* ── 各縣市停班停課「官方」資訊 ─────────────────────────────
   使用者要的是官方公告本身,不是我的推估。這裡分兩件事處理:

   ① **官方基準**：《天然災害停止上班及上課作業辦法》第四條附表已經內建
      （DGPA_COUNTY）,那是法規附表,可以直接列給人看。
   ② **官方即時公告**：行政院人事行政總處的「天然災害停止上班及上課情形」。
      **我沒有驗證過任何可跨網域取用的官方資料端點** —— 這個開發環境連不到
      dgpa.gov.tw,無從確認。憑猜測寫一個網址上去,就是重演抓 W-C0034-003
      （平台上根本不存在的資料集）那個錯:畫面上會出現一個永遠失敗、
      或更糟、成功但內容是別的東西的區塊。
      所以做法是:預設只給官方頁面的連結,另外開一個設定欄位,
      使用者拿到可用的 JSON 端點時自己填進來,程式才會去抓。         */
let DGPA_LIVE = null, DGPA_LIVE_AT = 0, DGPA_LIVE_ERR = '', DGPA_HEAD = '', DGPA_UPD = '';
/* 沒有颱風的日子,官方那張表裡一列縣市都沒有,只有一格
   「無停班停課訊息。」。那是**有效的答案**,不是解析失敗 ——
   原本一律當成「找不到縣市資料（來源格式可能變了）」報錯,
   等於在風平浪靜的日子天天對值班的人謊報來源壞掉。 */
let DGPA_NONE = false;
const DGPA_NONE_RE = /無停班停課訊息|無停止上班上課|尚無停班停課|無停班、?停課/;

/* 解析官方那張表。結構（實際回應）:
     <TABLE id="Table"> … <TD headers='city_Name'><FONT>基隆市</FONT></TD>
     <TD headers='StopWorkSchool_Info'>
       <FONT color=#000080>今天照常上班、照常上課。</FONT><br>
       <FONT color=#FF0000>明天停止上班、停止上課。</FONT> … </TD>
   紅字（#FF0000）＝有停班停課,藍字（#000080）＝照常。
   最後一列是備註,只有一個 colspan 的 TD,沒有 city_Name,自然會被略過。
   縣市以外的細項（「蘇澳鎮南強里:今天晚上06:00起…」）原樣保留 ——
   那正是值班的人要看的那一行,不能只留縣市層級的結論。            */
function parseDgpaHtml(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const t = doc.querySelector('#Table') || doc.querySelector('table');
  const head = doc.querySelector('.Header_YMD');
  DGPA_HEAD = head ? head.textContent.trim().replace(/\s+/g, ' ') : '';
  const upd = doc.querySelector('.Content_Updata');
  const m = upd && upd.textContent.match(/更新時間：([\d\/: -]+)/);
  /* 官方寫的是「2026/08/25 06:47:16」。年份與秒在這裡沒有用 ——
     公告本來就是今天的,秒數也不會改變任何決定。留「08/25 06:47」。 */
  DGPA_UPD = m ? m[1].trim().replace(/^\d{4}[\/-]/, '').replace(/:\d{2}$/, '') : '';
  DGPA_NONE = false;
  if (!t) return [];
  /* 表格在、但整張表寫著「無停班停課訊息。」—— 這是官方的答案本身,
     不是抓不到。記下來,下面 rows 為空時才分得出是「今天沒事」
     還是「頁面格式真的變了」。 */
  if (DGPA_NONE_RE.test(t.textContent.replace(/\s+/g, ''))) DGPA_NONE = true;
  const out = [];
  for (const tr of t.querySelectorAll('tr')) {
    const tds = tr.querySelectorAll('td');
    if (tds.length < 2) continue;                       // 備註列
    const county = tds[0].textContent.trim().replace(/\s+/g, '');
    if (!county || !/[縣市]$/.test(county)) continue;    // 表頭與雜項
    /* 每一行分兩件事看:停不停,以及**停的是整個縣市還是某幾個區／鄉／里**。
       官方那張表在高雄市、屏東縣這種情況下,整格裡一條全縣的敘述都沒有,
       只有「六龜區:今天停止上班、停止上課。」這種逐區的。
       如果把整個縣市塗紅,等於說高雄市全市放假 —— 那天並沒有。
       判斷方式:行首有「○○區:」「○○鄉:」「○○里:」這種前綴的就是局部。 */
    const PART_RE = /^[^:：]{1,18}(區|鄉|鎮|市|里|村|部落|分校|國民小學|國小|國中|高中)[^:：]{0,12}[:：]/;
    const lines = [];
    let full = false, part = false;
    const add = (txt, stop) => {
      const scope = PART_RE.test(txt) ? 'part' : 'all';
      if (stop) { if (scope === 'all') full = true; else part = true; }
      lines.push({ txt, stop, scope });
    };
    for (const f of tds[1].querySelectorAll('font, span')) {
      const txt = f.textContent.trim().replace(/\s+/g, ' ');
      if (!txt) continue;
      const col = (f.getAttribute('color') || '').toUpperCase();
      add(txt, /停止上班|停止上課/.test(txt) || col === '#FF0000' || col === 'FF0000');
    }
    if (!lines.length) {
      const txt = tds[1].textContent.trim().replace(/\s+/g, ' ');
      if (txt) add(txt, /停止上班|停止上課/.test(txt));
    }
    out.push({ county, lines, full, part, alert: full || part });
  }
  return out;
}

/* 也接 JSON —— 使用者若自備一個整理好的端點,不必被逼著回傳 HTML。 */
function parseDgpaJson(j) {
  const rows = Array.isArray(j) ? j
    : (j && (j.records || j.data || j.result || j.list)) || [];
  if (!Array.isArray(rows)) return [];
  return rows.map(r => {
    if (!r || typeof r !== 'object') return null;
    const county = pick(r, 'county', 'County', 'countyName', 'CountyName', 'name', 'area', '縣市');
    if (!county) return null;
    const txt = [pick(r, 'work', 'Work', 'status', '上班'), pick(r, 'school', 'School', '上課'),
      pick(r, 'note', 'Note', '備註')].filter(Boolean).map(String).join('、');
    const stop = /停止上班|停止上課|停班|停課/.test(txt);
    return { county: String(county), lines: txt ? [{ txt, stop, scope: 'all' }] : [],
      full: stop, part: false, alert: stop };
  }).filter(Boolean);
}

async function fetchDgpa(manual) {
  const cfgUrl = (DB.cfg.dgpaUrl || '').trim();
  const proxy = DB.cfg.dgpaProxy === undefined ? DGPA_PROXY_DEFAULT : String(DB.cfg.dgpaProxy || '');
  const url = cfgUrl || (proxy ? proxy + encodeURIComponent(DGPA_URL) : '');
  if (!url) { DGPA_LIVE = null; DGPA_LIVE_ERR = ''; if (manual) renderTyphoon({}); return; }
  try {
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const body = await r.text();
    const isJson = /^\s*[[{]/.test(body);
    const rows = isJson ? parseDgpaJson(JSON.parse(body)) : parseDgpaHtml(body);
    // 自訂 JSON 端點回一個空陣列,意思就是「今天沒有任何縣市停班停課」
    if (isJson) DGPA_NONE = !rows.length;
    // 一列縣市都沒有,但官方明講「無停班停課訊息」—— 那是答案,不是失敗
    if (!rows.length && !DGPA_NONE) throw new Error('回應中找不到縣市資料（來源格式可能變了）');
    DGPA_LIVE = rows; DGPA_LIVE_AT = Date.now(); DGPA_LIVE_ERR = '';
  } catch (e) {
    DGPA_LIVE = null; DGPA_NONE = false; DGPA_LIVE_ERR = String((e && e.message) || e);
  }
  if (manual) renderTyphoon({});
}

/* 我自己的站臺與關注地點落在哪些縣市 —— 只把那幾個縣市挑出來排在最前面,
   二十二個縣市全列一次,要找自己的那一個還得用眼睛掃。 */
function myCounties() {
  const set = new Set();
  for (const x of DB.stations) { if (!IS_LIVE(x)) continue; const c = countyOf(x); if (c) set.add(c); }
  return [...set];
}

/* ── 天氣 ────────────────────────────────────────────────
   分三段,因為這三段的資料來源與可信度完全不同:
   ① **現在**:雨量站的 10 分鐘累積 —— **實測**,不是預報。
   ② **未來 2 天**:鄉鎮預報逐 3 小時 —— 照原始時距,不內插成 1 小時。
   ③ **第 3 天起**:1 週預報,12 小時一格,只講早上／晚上。
   每一段都標明是實測還是預報,這是這支程式一貫的規矩。          */
/* ── 天氣要看哪裡 ─────────────────────────────────────────
   以前是「清單裡第一個有座標的站臺」—— 那是**實作的順序**,不是
   使用者的選擇。值班的人手上可能有五個站,想看的常常不是第一個;
   人也可能就站在現場,那時最準的參考點是「我現在人在這裡」。      */
const WXLOC_GEO = '__geo__';
let GEO = null, GEO_ERR = '', GEO_BUSY = false;

// 可選的站臺:要有座標才談得上天氣。排序沿用設定裡的清單排序（預設由北至南）。
const wxSites = () => sortForList(
  DB.stations.filter(x => IS_LIVE(x) && Number.isFinite(x.lat) && Number.isFinite(x.lng)));

/* 目前正在細看的那一個地點。「全部站臺」模式沒有單一地點,回傳 null ——
   讓呼叫端自己決定要怎麼辦,而不是偷偷挑一站當成使用者選的。 */
function wxSite() {
  const pick = DB.cfg.wxLoc || '';
  if (!pick) return null;                       // 全部站臺
  if (pick === WXLOC_GEO) {
    return GEO
      ? { id: WXLOC_GEO, name: '現在位置', lat: GEO.lat, lng: GEO.lng, geo: true, at: GEO.at }
      : { id: WXLOC_GEO, name: '現在位置', lat: NaN, lng: NaN, geo: true, pending: true };
  }
  const hit = wxSites().find(x => x.id === pick);
  if (hit) return hit;
  /* 選過的站臺被刪掉或被改成未建置了。不要靜靜換一站當成沒事 ——
     畫面上會是別的地方的天氣,而使用者以為還是原本那個。 */
  return { id: pick, name: '（已選的站臺不存在）', lat: NaN, lng: NaN, gone: true };
}


function locateMe() {
  if (!navigator.geolocation) { GEO_ERR = '這個瀏覽器沒有定位功能'; renderTyphoon({}); return; }
  GEO_BUSY = true; GEO_ERR = ''; renderTyphoon({});
  navigator.geolocation.getCurrentPosition(
    p => {
      GEO = { lat: p.coords.latitude, lng: p.coords.longitude, at: Date.now(),
        acc: Math.round(p.coords.accuracy || 0) };
      GEO_BUSY = false; GEO_ERR = '';
      DB.cfg.wxLoc = WXLOC_GEO; save(); renderTyphoon({});
    },
    e => {
      GEO_BUSY = false;
      /* 講清楚是哪一種失敗。「定位失敗」四個字讓人不知道要去開權限
         還是走到窗邊 —— 這兩件事要做的動作完全不同。 */
      GEO_ERR = e && e.code === 1 ? '定位權限被拒絕，請到瀏覽器設定允許此網站取用位置'
        : e && e.code === 2 ? '取不到位置訊號（室內或關閉定位服務時常見）'
        : e && e.code === 3 ? '定位逾時，請再試一次'
        : '定位失敗';
      renderTyphoon({});
    },
    { enableHighAccuracy: true, timeout: 12000, maximumAge: 5 * 60000 });
}

function setWxLoc(v) {
  if (v === WXLOC_GEO && !GEO) { locateMe(); return; }   // 選了就順手定位一次
  DB.cfg.wxLoc = v; save(); renderTyphoon({});
}

/* ── 地點選擇 ────────────────────────────────────────────
   上一版做成一個 <select>,使用者的回饋是「還是沒有看到可以選擇地點的功能」,
   而且「目前站臺位置是誰也不明顯」—— 那顆下拉混在卡片裡,看起來像裝飾。

   重做成兩層,而且把「現在在看哪裡」講得很大聲:
   ① 一排**分頁鈕**：全部站臺 / 現在位置 /（有站臺時）指定站臺
   ② 選了「指定站臺」才出現站臺清單,照設定的清單排序（預設由北至南）
   ③ 不管選哪一種,下面一定有一行**大字寫出現在看的是哪裡**

   預設是**全部站臺**。使用者問「裡面還有全部站臺會不會錯亂」——
   會,如果只給單站又不講清楚是哪一站。解法不是把其他站藏起來,
   而是**先給一張全部站臺的總表**,要看細節再點進單站。      */
const WXMODE_ALL = '', WXMODE_GEO = '__geo__';
const wxMode = () => {
  const v = DB.cfg.wxLoc || '';
  if (v === WXMODE_GEO) return 'geo';
  return v ? 'one' : 'all';
};

function wxPicker() {
  const mode = wxMode();
  const list = wxSites();
  const cur = DB.cfg.wxLoc || '';
  const seg = [
    ['all', WXMODE_ALL, `全部站臺${list.length ? `（${list.length}）` : ''}`],
    ['geo', WXMODE_GEO, '現在位置'],
  ];
  if (list.length) seg.push(['one', '', '指定站臺']);

  const segHtml = `<div class="seg" style="margin-bottom:0.5rem">${seg.map(([m, v, label]) =>
    `<button type="button" aria-pressed="${mode === m}" onclick="setWxMode('${m}')">${label}</button>`
  ).join('')}</div>`;

  const chips = (mode === 'one' && list.length)
    ? `<div class="chips" style="margin-bottom:0.5rem">${list.map(x =>
        `<button type="button" class="chip" aria-pressed="${cur === x.id}"
          onclick="setWxLoc('${esc(x.id)}')">${esc(x.name)}</button>`).join('')}</div>`
    : '';

  const geoBtn = mode === 'geo'
    ? `<div class="btnrow" style="margin-bottom:0.5rem">
        <button class="btn sm" onclick="locateMe()"${GEO_BUSY ? ' disabled' : ''}>${
          GEO_BUSY ? '定位中…' : GEO ? '重新定位' : '取得目前位置'}</button>
        ${GEO ? `<span class="mono" style="align-self:center;font-size:0.6875rem;color:var(--fg4)">
          誤差 ±${GEO.acc} m　${fmtShort(GEO.at)}</span>` : ''}</div>`
    : '';

  return segHtml + chips + geoBtn
    + (GEO_ERR && mode === 'geo' ? `<div class="msg e" style="margin:0 0 0.5rem">${esc(GEO_ERR)}</div>` : '')
    + (!list.length && mode !== 'geo'
        ? '<div class="msg i" style="margin:0 0 0.5rem">還沒有任何有座標的站臺。'
          + '可以先用「現在位置」，或到站臺頁替站臺補上經緯度。</div>' : '');
}

/* 現在看的是哪裡 —— 大字,而且一定出現。以前只在卡片標題旁邊寫一小行,
   使用者的原話是「目前站臺位置是誰也不明顯」。 */
function wxWhere(site, sub) {
  return `<div style="display:flex;align-items:baseline;gap:0.5rem;flex-wrap:wrap;
    padding:0.5rem 0.75rem;background:var(--surf);border:1px solid var(--edge);
    border-radius:var(--r2);margin-bottom:0.5rem">
    <span class="mono" style="font-size:0.6875rem;color:var(--fg4);letter-spacing:0.06em">地點</span>
    <b style="font-size:1.0625rem;color:var(--acc)">${esc(site.name)}</b>
    ${sub ? `<span class="mono" style="font-size:0.6875rem;color:var(--fg4)">${sub}</span>` : ''}</div>`;
}

function setWxMode(m) {
  if (m === 'all') { DB.cfg.wxLoc = WXMODE_ALL; save(); renderTyphoon({}); return; }
  if (m === 'geo') { setWxLoc(WXMODE_GEO); return; }
  // 「指定站臺」：還沒選過就先選清單第一個（由北至南的最北那一站）
  const list = wxSites();
  if (!list.length) return;
  const cur = DB.cfg.wxLoc || '';
  if (!cur || cur === WXMODE_GEO || !list.some(x => x.id === cur)) DB.cfg.wxLoc = list[0].id;
  save(); renderTyphoon({});
}

function nowRain(st) {
  const rb = nearestRain(st);
  if (!rb) return null;
  const o = rb.o;
  const m10 = o.now, h1 = o.h1;
  const raining = (m10 != null && m10 > 0) || (h1 != null && h1 > 0);
  return { raining, m10, h1, h24: o.h24, name: o.name, km: Math.round(rb.km) };
}

/* ── 今日重點 ─────────────────────────────────────────────
   使用者的原話：**「像今天風哨重點應該是雷雨，其它暫時不是重點，
   應該要靈活變動」**。

   固定順序的摘要在颱風天是對的,在今天就是錯的:一顆四千公里外的
   輕颱排在第一行,而真正要動作的雷雨排在第三行。所以摘要不排死,
   **依現在實際的威脅程度重排**,最該注意的那一件放最上面、放大。

   分數的來源全部是既有資料,不另外算一套模型 ——
   兩套算法遲早會不一致,而不一致的那一刻沒有人會發現。         */
function todayFocus() {
  const F = [];
  const add = (rank, key, tab, val, sub, col) => F.push({ rank, key, tab, val, sub, col });

  const sites = DB.stations.filter(x => IS_LIVE(x) && Number.isFinite(x.lat));

  // ── 警報 ──
  const w = DB.ty.warning;
  if (w && w.active) {
    const n = (w.areas || []).length;
    add(w.isLand ? 100 : 90, '警報', 'warn', esc(w.headline || '颱風警報'),
      `中央氣象署發布${n ? `　影響 ${n} 個縣市` : ''}`, 'var(--no)');
  } else if (WARN && WARN.isTy && (WARN.sea || WARN.land)) {
    const p = WARN.land || WARN.sea;
    if (p && p.phase === 'pending') {
      const which = WARN.land ? '陸上' : '海上';
      add(60, '警報', 'warn',
        `推估 ${fmtWhen((WARN.land || WARN.sea).issue)} 發布${which}警報`,
        '本機推估，非官方發布時間', 'var(--sb)');
    } else {
      add(55, '警報', 'warn', '尚未發布警報', '本機已推算發布時機，點開看', 'var(--sb)');
    }
  } else {
    /* 沒有威脅的時候要沉下去,而且要講出**為什麼**沒事 ——
       「目前無颱風警報」配上一顆四千公里外的颱風,講的是同一件事。 */
    const km = WARN && WARN.cpa ? Math.round(WARN.cpa.d) : null;
    add(5, '警報', 'warn', '目前無颱風警報',
      km != null
        ? (km > CPA_MID ? `路徑最近時距臺約 ${km} 公里，距離很遠、無影響`
                        : `路徑最近時距臺約 ${km} 公里`)
        : (WARN ? '暴風範圍預估不會觸及臺灣近海' : '尚未取得官方預報路徑'),
      'var(--fg2)');
  }

  /* ── 雷電：打雷就要關站臺,所以它的分數只低於官方颱風警報 ──
     **實測的落雷排在特報前面** —— 特報說「這個縣市正在打雷」,
     落雷點說「離這一站 4 公里處三分鐘前打了一次雲對地」。
     值班要決定關不關機,問的是後者。 */
  const R = ltnRadius();
  const cgNear = sites.map(x => ({ x, s: strikesNear(x, R) })).filter(r => r.s.cg > 0)
    .sort((a, b) => a.s.nearest.d - b.s.nearest.d);
  const icNear = sites.map(x => ({ x, s: strikesNear(x, R) })).filter(r => r.s.cg === 0 && r.s.ic > 0);
  const tAdv = thunderAdv();
  const inZone = tAdv.length ? sites.filter(x => thunderFor(x)) : [];
  if (cgNear.length) {
    const n0 = cgNear[0];
    add(98, '雷電', 'wx', `${cgNear.length} 站 ${R} km 內有雲對地落雷`,
      `最近 ${esc(n0.x.name)} ${Math.round(n0.s.nearest.d)} km`
      + (n0.s.last ? `　${fmtClock(n0.s.last)}` : '') + '　實測，依規定應關閉設備', 'var(--no)');
  } else if (inZone.length) {
    add(95, '雷電', 'wx', `${inZone.length} 站在雷雨特報範圍`,
      inZone.slice(0, 4).map(x => esc(x.name)).join('、')
      + (inZone.length > 4 ? ' 等' : '') + '　依規定應關閉設備', 'var(--no)');
  } else if (icNear.length) {
    add(72, '雷電', 'wx', `${icNear.length} 站 ${R} km 內有雲間閃電`,
      '雲間閃電不會打到地面設備，但代表雷雨胞就在附近', 'var(--sb)');
  } else if (tAdv.length) {
    add(70, '雷電', 'wx', `${tAdv.map(a => esc(a.kind)).join('、')}發布中`,
      '轄區內沒有站臺落在範圍內', 'var(--sb)');
  } else {
    const ahead = sites.map(x => ({ x, t: thunderAhead(x) })).filter(r => r.t);
    if (ahead.length) {
      const first = ahead.reduce((a, b) => a.t.from <= b.t.from ? a : b);
      add(40, '雷電', 'wx', `預報 ${ahead.length} 站有雷`,
        `最早 ${esc(first.x.name)} ${relDay(first.t.from)}${fmtClock(first.t.from)}　這是預報不是現在`, 'var(--sb)');
    } else if (LTN_AT) {
      add(6, '雷電', 'wx', `${R} km 內沒有落雷`, '過去 1 小時實測，也沒有雷雨特報', 'var(--ok)');
    }
  }

  // ── 停班停課 ──
  const offHit = (DGPA_LIVE || []).filter(r => r.alert);
  if (offHit.length) {
    add(85, '停班課', 'dgpa', `官方 ${offHit.length} 個縣市停止上班上課`,
      offHit.slice(0, 4).map(r => esc(r.county)).join('、') + (offHit.length > 4 ? ' 等' : ''), 'var(--no)');
  } else if (DGPA_NONE) {
    add(4, '停班課', 'dgpa', '官方：無停班停課訊息', '人事行政總處公告', 'var(--ok)');
  } else {
    const estHit = COUNTIES_NS.filter(n => { const e = countyEstimate(n); return e && e.any; });
    add(estHit.length ? 50 : 3, '停班課', 'dgpa',
      estHit.length ? `推估 ${estHit.length} 個縣市達基準` : '推估均未達基準',
      DGPA_LIVE_ERR ? '官方公告取得失敗，點開看原因' : '推估不是公告，一律以官方為準',
      estHit.length ? 'var(--sb)' : 'var(--fg2)');
  }

  // ── 站臺已達關機門檻（推估）──
  if (SERIES && sites.length) {
    const hit = sites.map(x => ({ x, i: stationImpact(SERIES, x, DB.cfg) }))
      .filter(r => r.i && r.i.deadline);
    if (hit.length) {
      add(80, '站臺', 'st', `${hit.length} 站推估將達關機風級`,
        `門檻 ${DB.cfg.bfShut} 級　點開看各站時間`, 'var(--no)');
    }
  }

  /* ── 天氣 ──
     一律講「幾站」,不挑代表點。挑一站代表其餘十八站,寫出來的東西
     對那十八站可能完全不成立。 */
  const raining = sites.filter(x => { const r = nowRain(x); return r && r.raining; });
  if (raining.length) {
    add(45, '天氣', 'wx', `${raining.length} 站正在下雨`,
      raining.slice(0, 4).map(x => esc(x.name)).join('、')
      + (raining.length > 4 ? ' 等' : '') + '　雨量站實測', 'var(--acc)');
  } else if (!sites.length) {
    add(2, '天氣', 'wx', '尚未有可判斷的站臺', '站臺要有經緯度才對得到雨量站與預報', 'var(--fg2)');
  } else {
    // 最早會下雨的那一站,講它 —— 那是「接下來第一件事」,不是代表
    const ahead = sites.map(x => {
      const tf = townFor(x);
      const ser = tf ? townSeries(tf.town).filter(y => y.to > Date.now()) : [];
      const wet = ser.find(y => isRainy(y.wx) || (y.pop != null && y.pop >= 70));
      return wet ? { x, wet } : null;
    }).filter(Boolean).sort((a, b) => a.wet.from - b.wet.from);
    if (ahead.length) {
      add(20, '天氣', 'wx', `${ahead.length} 站預報有雨`,
        `最早 ${esc(ahead[0].x.name)} ${relDay(ahead[0].wet.from)}${fmtClock(ahead[0].wet.from)} 起`,
        'var(--fg2)');
    } else {
      const anyTf = sites.some(x => townFor(x));
      add(2, '天氣', 'wx',
        anyTf ? `${sites.length} 站目前都沒有下雨` : '尚未取得鄉鎮天氣預報',
        anyTf ? '未來預報時段內也無明顯降雨'
              : (WX_ERR ? '預報取得失敗，點開看原因' : '按上方「更新」取得'), 'var(--fg2)');
    }
  }

  return F.sort((a, b) => b.rank - a.rank);
}

/* ── 概況頁的摘要 ─────────────────────────────────────────
   最上面一張「現在最該注意的事」,下面是其餘各項,一律照威脅程度排。
   按下去跳到那一頁。數字全部取自各頁自己的資料。            */
function glanceCard() {
  const F = todayFocus();
  if (!F.length) return '';
  const top = F[0], rest = F.slice(1);

  /* 分數低於 30 就代表「今天沒有什麼特別要注意的」——
     那時候不該端出一張大卡假裝有事。 */
  const hot = top.rank >= 30;

  const banner = hot
    ? `<button type="button" class="focus" onclick="goTySub('${top.tab}')"
        style="border-color:${top.col}">
        <span class="fc-k" style="color:${top.col}">現在最該注意　${top.key}</span>
        <span class="fc-v" style="color:${top.col}">${top.val}</span>
        <span class="fc-s">${top.sub}</span></button>`
    : '';

  const row = f =>
    `<button type="button" class="glance" onclick="goTySub('${f.tab}')">
       <span class="gl-k">${f.key}</span>
       <span class="gl-b"><span class="gl-v"${f.col ? ` style="color:${f.col}"` : ''}>${f.val}</span>
         ${f.sub ? `<span class="gl-s">${f.sub}</span>` : ''}</span>
       <span class="gl-a">›</span></button>`;

  return banner
    + (hot ? '' : `<div class="mono" style="font-size:0.6875rem;color:var(--fg4);
        margin:0.25rem 0 0.375rem;letter-spacing:0.06em">目前沒有需要立即處置的項目</div>`)
    + (hot ? rest : F).map(row).join('');
}

/* ── 雷電 ─────────────────────────────────────────────────
   使用者的規則：**打雷就要關站臺**。所以雷不能跟雨混在一起講,
   它要自己一段,而且要回答「**離我的站臺幾公里處剛剛打了一次**」。

   來源有三種,可信度與意義完全不同,畫面上一律分開標:
   ① **落雷實測**（O-A0039-001,見上面 fetchLightning）—— 逐點的經緯度與時間,
      是真的量到的。**雲對地才會打到地面設備**,與雲間分開算。
   ② **官方雷雨特報** —— 區域性的判斷,講的是「這個縣市正在打雷」。
   ③ **鄉鎮預報裡的雷雨時段** —— 那是預報,不是現在正在打雷。

   註：上一版這裡寫著「真正的落雷即時位置拿不到」。那是**錯的** ——
   使用者提供了官方檔案,O-A0039-001 確實存在。沒查證就說「沒有」,
   跟沒查證就說「有」（W-C0034-003）是同一個毛病的反面,而且更難發現:
   畫面上不會出錯,只會少一個本來做得到的功能。              */
const thunderAdv = () => ADV.filter(a => a.cat === 'thunder');

// 這個地點目前是否在官方雷雨特報的範圍內
function thunderFor(st) {
  const c = cnorm(countyOf(st));
  if (!c) return null;
  for (const a of thunderAdv()) {
    for (const area of a.areas) {
      const an = cnorm(area);
      const bare = an.replace(/(山區|平地|沿海|地區|北部|南部|東部|西部)+$/, '');
      if (an.includes(c) || bare.includes(c) || c.includes(bare)) {
        return { kind: a.kind, area, end: a.end };
      }
    }
  }
  return null;
}

// 預報時段裡的雷（不是現在正在打雷,是等一下可能會）
const isThunder = w => /雷/.test(String(w || ''));
function thunderAhead(site) {
  const tf = site && Number.isFinite(site.lat) ? townFor(site) : null;
  if (!tf) return null;
  const ser = townSeries(tf.town).filter(x => x.to > Date.now());
  const hit = ser.find(x => isThunder(x.wx));
  return hit ? { from: hit.from, to: hit.to, wx: hit.wx, town: tf.town.name } : null;
}

function thunderCard() {
  const adv = thunderAdv();
  const sites = DB.stations.filter(x => IS_LIVE(x) && Number.isFinite(x.lat));
  const R = ltnRadius();

  /* 每一站周圍的落雷。這是**實測**,優先於特報 ——
     特報講的是「這個縣市正在打雷」,落雷點講的是「離這一站幾公里處剛剛打了一次」。
     值班要決定關不關機,問的是後者。 */
  const near = sites.map(x => ({ x, s: strikesNear(x, R) }))
    .filter(r => r.s.cg + r.s.ic > 0)
    .sort((a, b) => (b.s.cg - a.s.cg) || (a.s.nearest.d - b.s.nearest.d));
  const cgHit = near.filter(r => r.s.cg > 0);

  const inZone = adv.length ? sites.map(x => ({ x, t: thunderFor(x) })).filter(r => r.t) : [];
  const ahead = sites.map(x => ({ x, t: thunderAhead(x) })).filter(r => r.t);

  const head = `<div class="sec"><h2>雷電</h2></div>`;
  const win = LTN_AT
    ? `<div class="tybar" style="margin-bottom:0.5rem"><b>落雷實測</b>
        ${LTN_WIN ? esc(LTN_WIN) : '過去 1 小時'}
        <span class="mono" style="color:var(--fg4)">　全臺 ${LTN.length} 筆　半徑 ${R} km</span></div>`
    : '';
  const err = LTN_ERR
    ? `<div class="msg e" style="margin-bottom:0.5rem">落雷資料取得失敗：${esc(LTN_ERR)}。
       可在設定「閃電（落雷）」改資料集代號。下方仍會顯示官方雷雨特報與預報。</div>` : '';

  const nothing = !adv.length && !ahead.length && !near.length;
  if (nothing) {
    return head + err + `<div class="card pad" style="margin-bottom:0.75rem">${win}
      <b style="color:var(--ok);font-size:1.0625rem">${
        LTN_AT ? `半徑 ${R} km 內沒有落雷` : '目前沒有雷電資訊'}</b>
      <div class="hint" style="margin-top:0.375rem">
        ${LTN_AT ? '過去 1 小時各站臺周圍都沒有偵測到落雷，' : ''}中央氣象署也沒有發布雷雨特報，
        鄉鎮預報的時段裡也沒有雷。</div>
      ${thunderNote()}</div>`;
  }

  const rows = [];

  // ① 落雷實測 —— 這一段排最前面,因為它是實測而且是逐點的
  if (near.length) {
    rows.push(`<div style="padding:0.5rem 0;border-bottom:1px solid var(--edge)">
      <div style="display:flex;align-items:baseline;gap:0.5rem;flex-wrap:wrap">
        <b style="font-size:1.0625rem;color:${cgHit.length ? 'var(--no)' : 'var(--sb)'}">${
          cgHit.length ? `${cgHit.length} 站 ${R} km 內有雲對地落雷`
                       : `${near.length} 站 ${R} km 內有雲間閃電`}</b>
        <span class="tag" style="background:${cgHit.length ? 'var(--no)' : 'var(--sb)'};color:#08131A">實測</span></div>
      <div style="overflow-x:auto;margin-top:0.375rem"><table class="impact wx">
        <colgroup><col><col style="width:3.6rem"><col style="width:3.6rem"><col style="width:5.4rem"></colgroup>
        <tr><th>站臺</th><th>對地</th><th>雲間</th><th>最近一次</th></tr>
        ${near.map(r => `<tr${r.s.cg ? ' style="background:var(--no-d)"' : ''}>
          <td class="nm">${esc(r.x.name)}
            <span class="mono" style="font-size:0.625rem;color:var(--fg4);font-weight:400">　${
              S_LABEL[r.x.status] || r.x.status}</span></td>
          <td class="mono" style="text-align:right;color:${r.s.cg ? 'var(--no)' : 'var(--fg4)'};font-weight:700">${r.s.cg}</td>
          <td class="mono" style="text-align:right;color:var(--fg3)">${r.s.ic}</td>
          <td class="mono" style="text-align:right">${Math.round(r.s.nearest.d)} km<br>
            <span style="color:var(--fg4)">${r.s.last ? fmtClock(r.s.last) : '—'}</span></td>
        </tr>`).join('')}</table></div>
      <div class="hint" style="margin-top:0.375rem">
        <b>「對地」才是打到地面的那一種</b>，對設備有直接威脅；雲間閃電不會打到設備，兩者分開算。
        依單位規定，雷雨期間應關閉站臺設備——這裡只列出偵測到什麼，
        <b>關機與否仍由值班判斷</b>。半徑可在設定調整。</div></div>`);
  } else if (LTN_AT) {
    rows.push(`<div style="padding:0.5rem 0;border-bottom:1px solid var(--edge)">
      <span style="color:var(--ok)">落雷實測：各站臺 ${R} km 內過去 1 小時沒有偵測到落雷。</span></div>`);
  }

  // ② 官方雷雨特報
  if (adv.length) {
    rows.push(`<div style="padding:0.5rem 0;border-bottom:1px solid var(--edge)">
      <div style="display:flex;align-items:baseline;gap:0.5rem;flex-wrap:wrap">
        <b style="color:var(--no)">${adv.map(a => esc(a.kind)).join('、')}</b>
        <span class="tag" style="background:var(--no);color:#08131A">中央氣象署發布</span></div>
      ${adv.map(a => `<div style="font-size:0.8125rem;color:var(--fg2);margin-top:0.25rem">
        ${esc(a.kind)}：${a.areas.length ? esc(a.areas.join('、')) : '（未列地區）'}
        ${a.end ? `<span class="mono" style="color:var(--fg4)">　至 ${fmtShort(a.end)}</span>` : ''}
        </div>`).join('')}
      ${inZone.length
        ? `<div style="font-size:0.8125rem;margin-top:0.375rem"><b style="color:var(--no)">轄區內 ${
            inZone.length} 站在範圍：</b>${inZone.map(r => esc(r.x.name)).join('、')}</div>`
        : '<div style="font-size:0.8125rem;margin-top:0.375rem;color:var(--ok)">轄區內沒有站臺落在特報範圍內。</div>'}
      </div>`);
  }

  // ③ 預報
  if (ahead.length) {
    /* 十九站各寫一行,而且十九行寫的是同兩個時段 —— 那是雜訊不是資訊。
       **照時段分組**:同一個時段的站臺併成一行,值班一眼看到的是
       「幾點開始、有幾站」,而不是一整面站名。 */
    const byT = new Map();
    for (const r of ahead) {
      const k = `${relDay(r.t.from)}${fmtClock(r.t.from)}–${fmtClock(r.t.to)}`;
      if (!byT.has(k)) byT.set(k, { from: r.t.from, wx: r.t.wx, names: [] });
      byT.get(k).names.push(r.x.name);
    }
    const groups = [...byT.entries()].sort((a, b) => a[1].from - b[1].from);
    rows.push(`<div style="padding:0.5rem 0">
      <b style="color:var(--sb)">預報有雷：${ahead.length} 站，${groups.length} 個時段</b>
      ${groups.map(([k, g]) => `<details style="margin-top:0.3125rem">
        <summary style="cursor:pointer;font-size:0.8125rem;padding:0.125rem 0">
          <span class="mono" style="color:var(--sb)">${k}</span>
          <span style="color:var(--fg2)">　${esc(g.wx)}　${g.names.length} 站</span></summary>
        <div style="font-size:0.75rem;color:var(--fg3);padding:0.125rem 0 0 0.75rem">${
          g.names.map(esc).join('、')}</div></details>`).join('')}
      <div class="hint" style="margin-top:0.375rem">
        <b>這是預報不是現在正在打雷</b>，時距 3 小時一格。點時段看是哪幾站。</div></div>`);
  }

  return head + err + `<div class="card pad" style="margin-bottom:0.75rem">${win}${
    rows.join('')}${thunderNote()}</div>`;
}

function thunderNote() {
  return `<details style="margin-top:0.5rem">
    <summary style="cursor:pointer;font-size:0.8125rem;color:var(--acc);padding:0.25rem 0">
      這裡的雷是哪裡來的　·　點開</summary>
    <p class="hint" style="margin:0.375rem 0">
      三種來源，可信度與意義完全不同，畫面上一律分開標：<br><br>
      ① <b>落雷實測</b>（<code>O-A0039-001</code> 過去 1 小時閃電偵測資料）——
      逐點的經緯度與時間，是<b>真的量到的落雷</b>。分成<b>雲對地</b>與<b>雲間</b>：
      只有雲對地會打到地面設備，兩者一定要分開算
      （官方樣本裡 124 筆中有 91 筆是雲間，加在一起會把數字灌水一倍以上）。<br>
      ② <b>官方雷雨特報</b>——區域性的判斷，講的是「這個縣市正在打雷」，
      不是「離這一站幾公里」。<br>
      ③ <b>鄉鎮預報裡有雷的時段</b>——那是<b>預報</b>，不是現在。<br><br>
      要看即時的雷達回波，請用<b>實況頁</b>的圖層，或
      <a href="https://www.cwa.gov.tw/V8/C/W/OBS_Radar.html" target="_blank" rel="noopener">氣象署雷達回波</a>。</p>
  </details>`;
}

function wxCard() {
  const head = `<div class="sec"><h2>天氣</h2></div>` + wxPicker();
  const mode = wxMode();
  if (mode === 'all') return head + wxAllTable();

  const st = wxSite();
  if (!st || st.gone) {
    return head + `<div class="msg ${st ? 'e' : 'i'}">${st
      ? '原本選的站臺已經不存在了，請從上面重新選一個地點。'
      : '還沒有可用的地點。'}</div>`;
  }
  if (st.pending) {
    return head + wxWhere(st, '尚未定位')
      + `<div class="msg i">${GEO_BUSY ? '定位中…'
        : '尚未取得目前位置。按上面的「取得目前位置」，或改選一個站臺。'}</div>`;
  }
  return head + wxDetail(st);
}

/* ── 全部站臺的天氣總表 ──────────────────────────────────
   一站一列:現在下不下雨（實測）、接下來第一個有雨的時段（預報）、有沒有雷。
   值班真正要問的是「我這幾站,哪一站要出事」,不是「某一站接下來三天怎樣」。
   點一列就進到那一站的細節。                                        */
function wxAllTable() {
  const list = wxSites();
  if (!list.length) {
    return `<div class="msg i">還沒有任何有座標的站臺。天氣要靠座標才對得到雨量站與鄉鎮預報。</div>`;
  }
  const rows = list.map(x => {
    const rn = nowRain(x);
    const tf = townFor(x);
    const ser = tf ? townSeries(tf.town).filter(y => y.to > Date.now()) : [];
    const wet = ser.find(y => isRainy(y.wx) || (y.pop != null && y.pop >= 70));
    const th = ser.find(y => isThunder(y.wx));
    const zone = thunderFor(x);
    return { x, rn, tf, wet, th, zone };
  });
  const anyThunder = rows.some(r => r.zone || r.th);

  const cell = r => {
    const nowTxt = !r.rn ? '<span style="color:var(--fg4)">無雨量站</span>'
      : r.rn.raining
        ? `<b style="color:var(--acc)">下雨中</b><br><span class="mono" style="color:var(--fg4)">${
            r.rn.h1 == null ? '—' : r.rn.h1} mm/h</span>`
        : '<span style="color:var(--fg3)">無雨</span>';
    const fcTxt = !r.tf ? '<span style="color:var(--fg4)">—</span>'
      : r.wet ? `<span style="color:var(--sb)">${relDay(r.wet.from)}${fmtClock(r.wet.from)}</span>`
      : '<span style="color:var(--ok)">無</span>';
    const thTxt = r.zone
      ? `<b style="color:var(--no)">特報中</b>`
      : r.th ? `<span style="color:var(--sb)">${relDay(r.th.from)}${fmtClock(r.th.from)}</span>`
      : '<span style="color:var(--fg4)">—</span>';
    return `<tr${r.zone ? ' style="background:var(--no-d)"' : (r.rn && r.rn.raining ? ' style="background:var(--acc-d)"' : '')}>
      <td class="nm"><button type="button" class="lnk" onclick="setWxLoc('${esc(r.x.id)}')"
        >${esc(r.x.name)}</button></td>
      <td>${nowTxt}</td>
      <td class="mono">${fcTxt}</td>
      <td class="mono">${thTxt}</td></tr>`;
  };

  const wetN = rows.filter(r => r.rn && r.rn.raining).length;
  const thN = rows.filter(r => r.zone).length;

  return `<div class="card pad" style="margin-bottom:0.75rem">
    <div style="display:flex;gap:0.75rem;flex-wrap:wrap;align-items:baseline;margin-bottom:0.5rem">
      <b style="font-size:1.0625rem;color:${thN ? 'var(--no)' : wetN ? 'var(--acc)' : 'var(--ok)'}">${
        thN ? `${thN} 站在雷雨特報範圍` : wetN ? `${wetN} 站正在下雨` : '全部站臺目前都沒有下雨'}</b>
      <span class="mono" style="font-size:0.6875rem;color:var(--fg4)">共 ${list.length} 站　由北至南</span>
    </div>
    <div style="overflow-x:auto"><table class="impact wx">
      <colgroup><col><col style="width:5rem"><col style="width:5rem"><col style="width:5rem"></colgroup>
      <tr><th>站臺</th><th>現在</th><th>下次有雨</th><th>雷</th></tr>
      ${rows.map(cell).join('')}</table></div>
    ${(!WX && (WX_ERR || !rows.some(r => r.tf))) ? `<div class="msg ${WX_ERR ? 'e' : 'i'}" style="margin:0.5rem 0 0">${
      WX_ERR ? `預報取得失敗：${esc(WX_ERR)}。資料集代號可在設定「天氣預報來源」修改。`
      : '尚未取得鄉鎮天氣預報。按颱風頁上方「更新」，或到設定確認授權碼與「天氣預報來源」。'}</div>` : ''}
    <p class="hint" style="margin-top:0.5rem">
      <b>「現在」是雨量站實測</b>（10 分鐘累積），<b>「下次有雨」與「雷」是預報</b>（3 小時一格）；
      「雷　特報中」才是官方認定該地區正在打雷。點站臺名稱看那一站的完整預報。
      ${anyThunder ? '' : ''}</p>
  </div>`;
}

/* ── 單一地點的完整預報 ───────────────────────────────── */
function wxDetail(st) {
  const rn = nowRain(st);
  const zone = thunderFor(st);
  const where = wxWhere(st, st.geo ? 'GPS 定位' : (countyOf(st) || ''));

  const nowLine = rn
    ? `<div style="display:flex;align-items:baseline;gap:0.5rem;flex-wrap:wrap">
        <b style="font-size:1.0625rem;color:${rn.raining ? 'var(--acc)' : 'var(--fg2)'}">${
          rn.raining ? '正在下雨' : '目前沒有下雨'}</b>
        <span class="mono" style="font-size:0.75rem;color:var(--fg3)">
          10 分鐘 ${rn.m10 == null ? '—' : rn.m10} mm　時雨 ${rn.h1 == null ? '—' : rn.h1} mm　
          24 小時 ${rn.h24 == null ? '—' : Math.round(rn.h24)} mm</span>
        <span class="mono" style="font-size:0.6875rem;color:var(--fg4)">
          實測　${esc(rn.name)} ${rn.km} km</span></div>`
    : '<div style="color:var(--fg4)">附近沒有可用的雨量站，無法判斷現在有沒有下雨。</div>';

  const zoneLine = zone
    ? `<div class="msg e" style="margin:0.5rem 0 0"><b>這一站在「${esc(zone.kind)}」範圍內</b>
       （${esc(zone.area)}${zone.end ? `，至 ${fmtShort(zone.end)}` : ''}）。
       依單位規定，雷雨期間應關閉站臺設備。</div>` : '';

  const tf = townFor(st);
  if (!tf) {
    return where + `<div class="card pad" style="margin-bottom:0.75rem">${nowLine}${zoneLine}
      <div class="msg ${WX_ERR ? 'e' : 'i'}" style="margin:0.625rem 0 0">${
        WX_ERR ? `預報取得失敗：${esc(WX_ERR)}。資料集代號可在設定「天氣預報來源」修改。`
        : '尚未取得鄉鎮天氣預報。按颱風頁上方「更新」，或到設定確認授權碼與「天氣預報來源」。'}</div></div>`;
  }

  const ser = townSeries(tf.town).filter(x => x.to > Date.now());
  const h48 = ser.filter(x => x.from < Date.now() + 48 * 3600000);
  const later = ser.filter(x => x.from >= Date.now() + 48 * 3600000);

  const cell = x => {
    const rain = isRainy(x.wx), th = isThunder(x.wx);
    const popCol = x.pop == null ? 'var(--fg4)' : x.pop >= 70 ? 'var(--no)' : x.pop >= 30 ? 'var(--sb)' : 'var(--fg3)';
    return `<tr${th ? ' style="background:var(--no-d)"' : rain ? ' style="background:var(--acc-d)"' : ''}>
      <td class="mono" style="white-space:nowrap">${relDay(x.from)}<br>
        <span style="color:var(--fg4)">${fmtClock(x.from)}–${fmtClock(x.to)}</span></td>
      <td style="color:${th ? 'var(--no)' : rain ? 'var(--acc)' : 'var(--fg2)'}">${esc(x.wx || '—')}</td>
      <td class="mono" style="color:${popCol};font-weight:700;text-align:right">${
        x.pop == null ? '—' : x.pop + '%'}</td>
      <td class="mono" style="text-align:right">${x.t == null ? '—' : x.t + '°'}</td>
      <td class="mono" style="text-align:right;color:var(--fg3)">${
        x.ws == null ? '—' : bfLabel(ms2bf(x.ws))}</td></tr>`;
  };

  const table = rows => `<div style="overflow-x:auto"><table class="impact wx">
    <colgroup><col class="c-t"><col><col style="width:2.9rem"><col style="width:2.6rem">
      <col style="width:2.9rem"></colgroup>
    <tr><th>時段</th><th>天氣</th><th>降雨</th><th>溫度</th><th>風</th></tr>
    ${rows.map(cell).join('')}</table></div>`;

  const soon = h48.filter(x => x.from < Date.now() + 24 * 3600000);
  const rest = h48.filter(x => x.from >= Date.now() + 24 * 3600000);

  const firstRain = ser.find(x => isRainy(x.wx) || (x.pop != null && x.pop >= 70));
  const lead = firstRain
    ? (isRainy(ser[0] && ser[0].wx) || (ser[0] && ser[0].pop >= 70)
      ? `<b style="color:var(--acc)">目前時段預報有雨</b>`
      : `<b style="color:var(--acc)">${relDay(firstRain.from)}${fmtClock(firstRain.from)}</b> 起預報有雨`)
    : '<span style="color:var(--ok)">未來預報時段內都沒有明顯降雨</span>';

  return where + `<div class="card pad" style="margin-bottom:0.75rem">
    ${nowLine}${zoneLine}
    <div style="margin-top:0.5rem;padding-top:0.5rem;border-top:1px solid var(--edge)">
      <span class="mono" style="font-size:0.6875rem;color:var(--fg4)">預報</span>
      ${lead}
      <span class="mono" style="font-size:0.6875rem;color:var(--fg4)">
        　${esc(tf.town.name)}${tf.km != null ? `（${tf.km} km）` : `（依${tf.by}對應）`}</span></div>
    ${soon.length ? table(soon) : '<div class="msg i" style="margin:0.5rem 0 0">預報時段都已過去，請按上方「更新」。</div>'}
    ${rest.length ? `<details style="margin-top:0.375rem">
      <summary style="cursor:pointer;font-size:0.8125rem;color:var(--acc);padding:0.25rem 0">
        24–48 小時（${rest.length} 個時段）</summary>${table(rest)}</details>` : ''}
    ${later.length ? `<details style="margin-top:0.25rem">
      <summary style="cursor:pointer;font-size:0.8125rem;color:var(--acc);padding:0.25rem 0">
        第 3 天以後（${later.length} 個時段，12 小時一格）</summary>${table(later)}</details>` : ''}
    <p class="hint" style="margin-top:0.5rem">
      <b>「正在下雨」是雨量站的實測</b>（10 分鐘累積），不是預報。
      下方是中央氣象署鄉鎮天氣預報，<b>最細就是 3 小時一格</b>——
      官方沒有逐時降雨預報，把 3 小時內插成 1 小時只是把猜的講得比較細，這裡不做。
      要看「等一下會不會下」請用<b>實況頁的雷達回波</b>，那才是臨近預報該看的東西。
      ${WX_ERR ? `<br><b style="color:var(--no)">部分預報取得失敗：${esc(WX_ERR)}</b>` : ''}</p>
  </div>`;
}

/* ── 停班停課：官方公告與本機推估合成一張表 ────────────────
   以前是兩張卡:一張「推估」、一張「官方公告」。同一件事分兩處講,
   讀的人得自己在兩張卡之間對照 —— 而且推估說沒事、官方說停課時,
   兩張卡會並排給出相反的印象。合成一張:
   **每個縣市一列,官方在左（是事實）、推估在右（是推算）**,
   一列裡就看得出「現在放不放假」跟「接下來可能怎樣」。

   全臺二十二個縣市都算,由北到南排 —— 停班停課本來就是以縣市為單位宣布的,
   只算自己站臺所在的那幾個縣市,反而看不出颱風正從哪個方向掃過來。   */
function countyEstimate(name) {
  const pt = COUNTY_PT[name];
  if (!pt) return null;
  const wins = SERIES ? suspendWindows(SERIES, pt) : [];
  const ref = { lat: pt.lat, lng: pt.lng, county: name, terrain: 'flat' };
  const rain = advRainFor(ref);
  const w0 = wins[0] || null;
  const wEnd = wins.length ? wins[wins.length - 1].to : 0;
  // 推估的「到何時取消」:風力款看最後一段達標時段的結束,雨量款看特報有效期
  const until = Math.max(wEnd || 0, (rain && rain.meets && rain.end) || 0) || 0;
  return {
    name, lat: pt.lat,
    wind: w0 ? { from: w0.from, to: wEnd, peakBf: Math.max(...wins.map(x => x.peakBf)) } : null,
    rain: rain && rain.meets ? rain : null,
    rainNear: rain || null,
    until,
    any: !!w0 || !!(rain && rain.meets),
  };
}

/* 一列的官方狀態。回傳 null 代表還沒取得公告。 */
function countyOfficial(name) {
  if (!DGPA_LIVE) return null;
  const hit = DGPA_LIVE.find(r => cnorm(r.county) === cnorm(name));
  if (hit) return hit;
  /* 官方公告「無停班停課訊息」的日子,表上一列縣市都沒有。
     那時每一縣市的官方狀態是「照常」,不是「尚未取得」——
     後者會讓值班的人以為公告還沒出來,其實已經出來了,寫的是沒事。 */
  if (DGPA_NONE) {
    return { county: name, lines: [{ txt: '無停班停課訊息。', stop: false, scope: 'all' }],
      full: false, part: false, alert: false, none: true };
  }
  return null;
}

function dgpaCard() {
  const myC = myCounties().map(cnorm);
  const rows = COUNTIES_NS.map(name => ({
    name, off: countyOfficial(name), est: countyEstimate(name), mine: myC.includes(cnorm(name)),
  }));
  const anyOff = rows.some(r => r.off);
  const hitOff = rows.filter(r => r.off && r.off.alert);
  const hitEst = rows.filter(r => r.est && r.est.any && !(r.off && r.off.alert));

  const head = `<div class="sec"><h2>停班停課　全臺</h2>
    <button class="act" onclick="fetchDgpa(true)">更新</button></div>`;

  const src = `<div class="tybar" style="margin-bottom:0.5rem">
    ${DGPA_HEAD ? `<b>${esc(DGPA_HEAD)}</b>` : '<b>人事行政總處公告</b>'}
    ${DGPA_UPD ? `官方 ${esc(DGPA_UPD)}` : ''}
    ${DGPA_LIVE_AT ? `· 本機 ${fmtShort(DGPA_LIVE_AT)}` : ''}</div>`;

  const err = (!anyOff && !DGPA_NONE && DGPA_LIVE_ERR)
    ? `<div class="msg e">公告取得失敗：${esc(DGPA_LIVE_ERR)}。官方那一頁沒有 CORS 標頭，
       要透過代理才拿得到；到設定確認「停班停課來源」，或按下方連結直接看官方公告。</div>` : '';

  /* 一列的內容。左邊是官方（事實）,右邊是推估（推算）,
     兩者一律標明是哪一種 —— 混在一起看會把推估當成公告。 */
  const row = r => {
    const o = r.off, e = r.est;
    const oCol = !o ? 'var(--fg4)' : o.full ? 'var(--no)' : o.part ? 'var(--sb)' : 'var(--ok)';
    const oTxt = !o ? '尚未取得' : o.full ? '停止上班上課' : o.part ? '部分地區停止' : '照常上班上課';
    const stops = o ? o.lines.filter(l => l.stop) : [];
    const wide = stops.filter(l => l.scope === 'all');
    const part = stops.filter(l => l.scope !== 'all');
    let est = '<span style="color:var(--fg4)">推估未達基準</span>';
    if (e && e.any) {
      const bits = [];
      if (e.wind) bits.push(`風力 ${relDay(e.wind.from)}${fmtClock(e.wind.from)} 起，尖峰 ${e.wind.peakBf} 級`);
      if (e.rain) bits.push(`雨量 ${esc(e.rain.kind)}（≥ ${e.rain.mm} mm）`);
      est = `<span style="color:var(--sb);font-weight:700">推估達基準</span>`
        + `<span style="color:var(--fg3)">　${bits.join('；')}</span>`
        + (e.until ? `<div style="color:var(--fg4)">推估${relDay(e.until)}${fmtClock(e.until)}前後解除</div>` : '');
    } else if (!SERIES && !e) {
      est = '<span style="color:var(--fg4)">—</span>';
    }
    return `<div style="padding:0.5rem 0;border-top:1px solid var(--edge)${
      r.mine ? ';background:var(--acc-d);margin:0 -0.5rem;padding-left:0.5rem;padding-right:0.5rem' : ''}">
      <div style="display:flex;align-items:baseline;gap:0.375rem;flex-wrap:nowrap">
        <b style="flex:0 0 auto">${esc(r.name)}</b>
        ${r.mine ? '<em style="font-style:normal;font-size:0.6875rem;color:var(--acc)">轄區</em>' : ''}
        <span style="flex:1 1 auto;min-width:0;text-align:right;color:${oCol};font-weight:700">
          <span class="mono" style="font-size:0.625rem;color:var(--fg4);font-weight:400">官方</span>
          ${oTxt}</span>
      </div>
      ${wide.map(l => `<div style="font-size:0.75rem;color:${
        l.stop ? 'var(--no)' : 'var(--fg3)'}">${esc(l.txt)}</div>`).join('')}
      ${part.length ? `<details><summary style="cursor:pointer;font-size:0.75rem;color:var(--sb);padding:0.125rem 0">
        ${part.length} 個地區停止上班上課（展開）</summary>
        <div style="padding-left:0.25rem;font-size:0.75rem;color:var(--sb)">${
          part.map(l => `<div>${esc(l.txt)}</div>`).join('')}</div></details>` : ''}
      <div style="font-size:0.75rem;margin-top:0.125rem">
        <span class="mono" style="font-size:0.625rem;color:var(--fg4)">推估</span> ${est}</div>
    </div>`;
  };

  const sum = `<div class="msg ${hitOff.length ? 'e' : hitEst.length ? 'w' : 'i'}" style="margin:0 0 0.5rem">
    ${hitOff.length
      ? `官方已公告 <b>${hitOff.length}</b> 個縣市停止上班上課${
          hitEst.length ? `；另有 <b>${hitEst.length}</b> 個縣市<b>推估</b>達基準但尚未公告` : ''}。`
      : hitEst.length
        ? `${DGPA_NONE ? '官方公告<b>無停班停課訊息</b>' : '官方尚未公告任何縣市停止上班上課'}；`
          + `<b>${hitEst.length}</b> 個縣市<b>推估</b>達基準。`
        : DGPA_NONE
          /* 「無停班停課訊息」是官方今天已經給出的答案,不是還沒公告。
             兩者對值班的人意義完全不同:前者可以放心,後者要繼續盯。 */
          ? '官方公告<b>無停班停課訊息</b>，各縣市推估也都未達基準。'
          : '官方尚未公告任何縣市停止上班上課，各縣市推估也都未達基準。'}
    <b>推估不是公告</b>，一律以官方為準。</div>`;

  const foot = `<details class="msg w" style="margin:0.625rem 0 0">
    <summary style="cursor:pointer;font-weight:700">推估的依據與但書　·　點開</summary>
    <div style="margin-top:0.375rem">《天然災害停止上班及上課作業辦法》兩款：
    <b>風力</b>——平均風 ${SUSP_BF_MEAN} 級以上或陣風 ${SUSP_BF_GUST} 級以上
    （本程式由預報路徑逐時推算各縣市政府所在地，陣風以持續風 ${GUST_FACTOR} 倍估算）；
    <b>雨量</b>——24 小時累積雨量<b>預測</b>達第四條附表的門檻（多數縣市平地 ${DGPA_FLAT}、
    山區縣市山區 ${DGPA_HILL}、連江縣 200 毫米；南投平地 300、宜蘭 250、連江 180 另訂實際觀測基準），
    本程式改看氣象署的豪大雨特報等級，特報本身即預測性質、門檻同一口徑，但它是分級不是逐點預測值。
    <b>達到基準不等於一定放假</b>——還要已致災或有致災之虞，且由地方政府綜合研判宣布。
    代表點取縣市政府所在地，山區與離島的實際風雨會與它不同。請以
    <a href="${DGPA_URL}" target="_blank" rel="noopener">人事行政總處公告</a>為準。</div></details>`;

  const byName = Object.fromEntries(rows.map(r => [r.name, r]));
  const groups = COUNTY_GROUPS.map(g => `<div class="cgrp">${g.label}</div>`
    + g.names.map(n => row(byName[n])).join('')).join('');

  return head + `<div class="card pad" style="margin-bottom:0.75rem">
    ${src}${err}${sum}
    ${groups}
    <div class="btnrow" style="margin-top:0.625rem">
      <a class="btn pri sm" href="${DGPA_URL}" target="_blank" rel="noopener"
        style="text-decoration:none">開啟官方公告 ↗</a></div>
    ${foot}</div>`;
}


/* 站臺最近雨量站的累積雨量。24 小時是特報分級的主要依據,所以擺第一個。 */
function rainCell(st) {
  const rb = nearestRain(st);
  if (!rb) return '<td><span style="color:var(--fg4)">—</span></td>';
  const r = rb.o, L = rainLevel(r);
  const v = n => n == null ? '—' : (n < 10 ? n.toFixed(1) : Math.round(n));
  return `<td><span style="font-family:var(--mono);font-weight:700;color:${L ? L.col : 'var(--fg2)'}">`
    + `${v(r.h24)}</span><span style="font-size:0.6875rem;color:var(--fg4)"> mm/24h</span>`
    + (L ? `<b style="display:block;font-size:0.6875rem;color:${L.col}">${L.name}</b>` : '')
    + (() => { const m = dgpaMark(r.h24, st); return m
        ? `<b style="display:block;font-size:0.6875rem;color:${m.col}">停班課${m.t} ${m.thr}`
          + `${m.official ? '（實測）' : ''}</b>` : ''; })()
    + `<span style="display:block;font-size:0.6875rem;color:var(--fg4)">`
    + `時雨 ${v(r.h1)}　${esc(r.name)} ${Math.round(rb.km)}km</span></td>`;
}

/* ── 時間的講法 ────────────────────────────────────────────
   通報上不會寫「8/24 22:00」,會寫「今日晚間 22:00」——
   值班的人不必自己把日期換算成「那是今天還是明天」。
   當天=今日、隔天=明日、再隔天=後天,第四天起用星期。
   超過一週還講「週三」會分不出是哪一個週三,所以改回日期。   */
const WEEK = WK_CH;                     // 同一份星期表,不再各留一份

function relDay(ts) {
  const a = new Date(); a.setHours(0, 0, 0, 0);
  const b = new Date(ts); b.setHours(0, 0, 0, 0);
  const n = Math.round((b - a) / 86400000);
  if (n === 0) return '今日';
  if (n === 1) return '明日';
  if (n === 2) return '後天';
  if (n >= 3 && n <= 6) return '週' + WEEK[b.getDay()];
  if (n === -1) return '昨日';
  return `${b.getMonth() + 1}/${b.getDate()}`;
}

// 一天之內的時段。22:00 講「晚間」,05:30 講「清晨」。
function dayPart(h) {
  if (h < 5) return '凌晨';
  if (h < 8) return '清晨';
  if (h < 11) return '上午';
  if (h < 13) return '中午';
  if (h < 17) return '午後';
  if (h < 19) return '傍晚';
  if (h < 23) return '晚間';
  return '深夜';
}

// 「今日晚間 22:00」
function fmtWhen(ts) {
  const d = new Date(ts);
  return `${relDay(ts)}${dayPart(d.getHours())} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
}
// 「今日 08:23」——標頭用,不必講時段
function fmtDayTime(ts) {
  const d = new Date(ts);
  return `${relDay(ts)} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
}

/* ── 氣象員播報 ────────────────────────────────────────────
   把距離、方位、強度、侵襲機率、最接近時間、豪大雨特報、
   各站臺實測與衝擊，串成一段可以直接唸、直接抄進通報的話。
   規則：官方數字（侵襲機率、特報、警報單、實測）與本機推估分開講，
   每一句都要說得出來源，不能讓聽的人分不清哪句是氣象署說的。      */
function briefText() {
  const ty = DB.ty.data;
  if (!ty) return '';
  const IN = '　';                       // 全形空格縮排,中文對得齊
  const L = [];
  const bf = ms2bf(ty.vmax);
  const d = Math.round(distToTaiwan(ty.pos));
  const brg = bearing({ lat: 23.7, lng: 121.0 }, ty.pos);

  L.push(`【今日氣象概況與警報】（更新時間：${fmtDayTime(DB.ty.at || Date.now())}）`);

  /* 播報稿也要靈活:今天真正的重點是什麼,就先講什麼。
     固定從颱風動態開始念,在颱風四千公里外、卻正在打雷的日子是本末倒置。 */
  {
    const f = todayFocus()[0];
    if (f && f.rank >= 30) {
      L.push('');
      L.push(`本日重點：${f.key}——${String(f.val).replace(/<[^>]+>/g, '')}`
        + `（${String(f.sub).replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim()}）`);
    }
  }

  // ── 颱風動態 ──
  L.push('');
  L.push(`${TC_FULL[tcClass(ty.vmax)] || '熱帶氣旋'} ${ty.name}` +
    `${ty.en && ty.en !== ty.name ? `（${ty.en}）` : ''} 動態`);
  L.push(`${IN}位置風力：臺灣${dirName(brg)}方 ${d} 公里海面，近中心最大風速 ${bfLabel(bf)}。`);
  if (ty.mvSpd) {
    L.push(`${IN}移動方向：向${dirZh(ty.mvDir) || dirName(brg)}移動（時速 ${Math.round(ty.mvSpd)} 公里）。`);
  }
  if (ty.pres) L.push(`${IN}中心氣壓：${Math.round(ty.pres)} 百帕。`);
  if (WARN && WARN.cpa) {
    const km = Math.round(WARN.cpa.d);
    /* 四千公里外還寫「最接近時間」,唸出來就像快到了。距離遠就直說遠。 */
    L.push(`${IN}路徑最近時刻：推估為${fmtWhen(WARN.cpa.t)}，屆時距臺約 ${km} 公里`
      + (km > CPA_MID ? '，距離很遠、對臺灣無影響' : km > CPA_NEAR ? '，仍有距離' : '')
      + '。' + (EXTRAP ? '［外推路徑推算，非官方預報］' : ''));
  }
  if (!ty.official) L.push(`${IN}資料來源：GDACS 全球災害警報系統（非官方，僅觀測位置）。`);

  // ── 颱風警報 ──
  const w = DB.ty.warning;
  if (w && w.active) {
    L.push('');
    L.push('颱風警報（中央氣象署發布）');
    L.push(`${IN}${w.isLand ? '陸上颱風警報' : '海上颱風警報'}` +
      `${w.areas && w.areas.length ? `：${w.areas.join('、')}` : ''}`);
  }

  // ── 降雨特報 ──
  if (ADV.length) {
    L.push('');
    L.push('降雨特報分級（中央氣象署發布）');
    for (const a of ADV) {
      L.push(`${IN}${a.kind}：${a.areas.length ? a.areas.join('、') : '（未列地區）'}`);
    }
  }

  /* ── 雷電 ──
     打雷要關站臺,所以它自己一段,而且實測的落雷寫在特報前面。 */
  {
    const R = ltnRadius();
    const sites2 = DB.stations.filter(x => IS_LIVE(x) && Number.isFinite(x.lat));
    const near2 = sites2.map(x => ({ x, s: strikesNear(x, R) })).filter(r => r.s.cg + r.s.ic > 0)
      .sort((a, b) => (b.s.cg - a.s.cg) || (a.s.nearest.d - b.s.nearest.d));
    const tAdv2 = thunderAdv();
    if (near2.length || tAdv2.length) {
      L.push('');
      L.push('雷電');
      if (LTN_AT) {
        const cg2 = near2.filter(r => r.s.cg > 0);
        if (cg2.length) {
          L.push(`${IN}落雷實測：${cg2.length} 站於半徑 ${R} 公里內偵測到雲對地落雷`
            + `（${cg2.slice(0, 4).map(r => `${r.x.name} ${r.s.cg} 次、最近 ${Math.round(r.s.nearest.d)} 公里`).join('；')}`
            + `${cg2.length > 4 ? `；等 ${cg2.length} 站` : ''}）。`);
        } else if (near2.length) {
          L.push(`${IN}落雷實測：半徑 ${R} 公里內僅偵測到雲間閃電，無雲對地落雷。`);
        }
      } else if (LTN_ERR) {
        L.push(`${IN}落雷實測：取得失敗（${LTN_ERR}）。`);
      }
      for (const a of tAdv2) {
        L.push(`${IN}${a.kind}：${a.areas.length ? a.areas.join('、') : '（未列地區）'}`
          + `${a.end ? `，至 ${fmtShort(a.end)}` : ''}。`);
      }
      L.push(`${IN}※ 雲對地落雷才會打到地面設備；雲間閃電不會。關機與否依單位規定由值班判斷。`);
    }
  }

  /* ── 天氣 ──
     以前是挑一站當「代表點」寫一段。使用者的原話:**「我不想要代表」**——
     十九個站散在好幾個縣市,挑一站代表其餘十八站,寫出來的東西對那十八站
     可能完全不成立。而且「代表點」這三個字本身就是在告訴讀的人
     「這個數字不一定是你要的那一站」—— 那就不該寫。

     改成**逐站彙整**:現在哪幾站在下雨（實測）、哪幾站預報有雨、其餘沒有。
     一句話講不完就分行,但**每一行講的都是真的那幾站**,不代表任何人。 */
  {
    const wsites = DB.stations.filter(x => IS_LIVE(x) && Number.isFinite(x.lat));
    if (wsites.length) {
      const rows = wsites.map(x => {
        const rn = nowRain(x);
        const tf = townFor(x);
        const ser = tf ? townSeries(tf.town).filter(y => y.to > Date.now()) : [];
        const wet = ser.find(y => isRainy(y.wx) || (y.pop != null && y.pop >= 70));
        return { x, rn, tf, wet };
      });
      const raining = rows.filter(r => r.rn && r.rn.raining);
      /* 「現在在下」與「接下來會下」是兩件獨立的事,不能互相排除 ——
         正在下雨的站臺等一下可能就停了,現在沒下的也可能等一下才下。
         原本把正在下雨的站臺從預報那一行排除,結果全部站臺都在下雨時,
         預報那一行整個不見。 */
      const wetAhead = rows.filter(r => r.wet);
      const noRain = rows.filter(r => r.rn && !r.wet && !r.rn.raining);
      const noGauge = rows.filter(r => !r.rn);

      L.push('');
      L.push('天氣');
      if (raining.length) {
        L.push(`${IN}正在降雨（實測）：${raining.map(r =>
          `${r.x.name} 時雨量 ${r.rn.h1 == null ? '—' : r.rn.h1} 毫米`
          + `（24 小時累積 ${r.rn.h24 == null ? '—' : Math.round(r.rn.h24)} 毫米）`).join('；')}。`);
      } else {
        L.push(`${IN}正在降雨（實測）：無。各站臺周圍雨量站目前均未測到降雨。`);
      }
      if (wetAhead.length) {
        // 同一個時段的站臺併在一起,十九站不要寫成十九行
        const byT = new Map();
        for (const r of wetAhead) {
          const k = `${relDay(r.wet.from)}${fmtClock(r.wet.from)}`;
          if (!byT.has(k)) byT.set(k, []);
          byT.get(k).push(r.x.name);
        }
        const parts = [...byT.entries()]
          .sort((a, b) => a[0].localeCompare(b[0]))
          .map(([k, ns]) => `${k} 起 ${ns.length} 站（${ns.slice(0, 5).join('、')}${
            ns.length > 5 ? `等 ${ns.length} 站` : ''}）`);
        L.push(`${IN}預報有雨：${parts.join('；')}。`);
      }
      if (noRain.length) {
        L.push(`${IN}預報無明顯降雨：${noRain.length} 站`
          + (noRain.length <= 6 ? `（${noRain.map(r => r.x.name).join('、')}）` : '') + '。');
      }
      if (noGauge.length) {
        L.push(`${IN}無鄰近雨量站可判斷：${noGauge.length} 站`
          + (noGauge.length <= 6 ? `（${noGauge.map(r => r.x.name).join('、')}）` : '') + '。');
      }
      L.push(`${IN}預報時距：官方最細為 3 小時一格，本表未做內插；`
        + `更近的降雨請看雷達回波。`);
    }
  }

  /* ── 站臺衝擊 ──
     以前是每一站一句完整敘述,十幾站就是十幾行,而且十幾行講的都是
     「推估不需關機」—— 值班的人要在那面文字裡找出真正會被影響的那幾站。
     改成只列「會被影響的」,並且講的是**時段**而不是每站的流水帳;
     其餘的用一行帶過。要逐站細節的話,衝擊預判那一頁本來就是完整的表。 */
  const withXY = DB.stations.filter(x => IS_LIVE(x) && Number.isFinite(x.lat) && Number.isFinite(x.lng));
  let gaps = [];
  if (SERIES && withXY.length) {
    const rows = withXY.map(x => ({ x, i: stationImpact(SERIES, x, DB.cfg) }))
      .filter(r => r.i).sort((a, b) => b.i.peak.bf - a.i.peak.bf);
    const hit = rows.filter(r => r.i.deadline);
    const miss = rows.filter(r => !r.i.deadline);
    if (rows.length) {
      L.push('');
      L.push(`站臺衝擊（系統推估，關機門檻 ${DB.cfg.bfShut} 級）`);
      if (hit.length) {
        for (const { x, i } of hit) {
          // 不列入回報的類別（中繼站臺）仍然要看,但要看得出來它不會出現在交接通報裡
          L.push(`${IN}${x.name}${inReport(x) ? '' : '（不列入回報）'}：應於${fmtWhen(i.deadline)}前完成關機`
            + `（尖峰 ${i.peak.bf} 級於${fmtWhen(i.peak.t)}`
            + (i.resume ? `，${fmtWhen(i.resume.t)}起可評估復機` : '') + '）。');
        }
      } else {
        L.push(`${IN}全部 ${rows.length} 站推估均未達關機門檻。`);
      }
      if (miss.length && hit.length) {
        const bfs = miss.map(r => r.i.peak.bf);
        const lo = Math.min(...bfs), hi = Math.max(...bfs);
        L.push(`${IN}其餘 ${miss.length} 站推估尖峰 ${lo === hi ? `${lo} 級` : `${lo}–${hi} 級`}，不需關機。`);
      }
      // 尖峰時段:所有站臺尖峰時刻的範圍,一句話講完「什麼時候最不好過」
      const pt = rows.map(r => r.i.peak.t).sort((a, b) => a - b);
      const pk = Math.max(...rows.map(r => r.i.peak.bf));
      L.push(`${IN}影響時段：${fmtWhen(pt[0])}` +
        (pt[pt.length - 1] - pt[0] > 3600000 ? ` 至 ${fmtWhen(pt[pt.length - 1])}` : '') +
        `，全區推估尖峰 ${pk} 級。`);
    }
    gaps = rows.map(({ x, i }) => {
      const ob = nearestObs(x), obf = obsBf(ob);
      return (obf != null && Math.abs(obf - i.now.bf) >= 3)
        ? `${x.name}（推估 ${i.now.bf} 級、實測 ${obf} 級）` : null;
    }).filter(Boolean);
  }

  /* ── 停班停課 ──
     播報稿只講兩件事:官方公告了哪些縣市、推估還有哪些縣市可能達標。
     逐站列出來沒有意義 —— 停班停課是以縣市為單位宣布的。 */
  {
    const myC = myCounties();
    const offHit = (DGPA_LIVE || []).filter(r => r.alert);
    const estHit = COUNTIES_NS.map(n => countyEstimate(n))
      .filter(e => e && e.any && !offHit.some(o => cnorm(o.county) === cnorm(e.name)));
    /* 官方公告「無停班停課訊息」的日子也要寫一句 —— 那是今天已經有的
       答案。整段不出現的話,讀播報稿的人分不出「官方說沒事」跟
       「還沒去查」。 */
    if (!offHit.length && !estHit.length && DGPA_NONE) {
      L.push('');
      L.push('停班停課');
      L.push(`${IN}官方公告：無停班停課訊息（人事行政總處${DGPA_UPD ? ' ' + DGPA_UPD : ''}）。`);
      L.push(`${IN}本機推估：各縣市均未達基準。`);
    }
    if (offHit.length || estHit.length) {
      L.push('');
      L.push('停班停課（官方公告優先，其餘為本機推估）');
      if (offHit.length) {
        for (const o of offHit) {
          const st2 = o.lines.filter(l => l.stop);
          const wide2 = st2.filter(l => l.scope === 'all').map(l => l.txt.replace(/。\s*$/, ''));
          const part2 = st2.filter(l => l.scope !== 'all').map(l => l.txt.replace(/[:：].*$/, ''));
          const detail = wide2.concat(part2.length
            ? [part2.slice(0, 3).join('、') + (part2.length > 3 ? `等 ${part2.length} 個地區` : '')]
            : []).join('；');
          L.push(`${IN}官方公告　${o.county}${o.full ? '停止上班上課' : '部分地區停止上班上課'}`
            + (detail ? `（${detail}）` : '') + (myC.some(c => cnorm(c) === cnorm(o.county)) ? '【轄區】' : '') + '。');
        }
      }
      if (estHit.length) {
        L.push(`${IN}推估達基準（尚未公告）：${estHit.map(e =>
          `${e.name}${e.until ? `（推估${relDay(e.until)}${fmtClock(e.until)}前後解除）` : ''}`).join('、')}。`);
      }
      L.push(`${IN}※ 官方公告為準。推估依《天然災害停止上班及上課作業辦法》風力款`
        + `（平均風 ${SUSP_BF_MEAN} 級以上或陣風 ${SUSP_BF_GUST} 級以上，由預報路徑逐時推算縣市政府所在地）`
        + '與雨量款（改看氣象署豪大雨特報等級）；達到基準仍須已致災或有致災之虞，'
        + '由地方政府綜合研判宣布。');
    }
  }

  // ── 雨量實測 ──
  let anyDgpa = false;
  /* 只列「豪雨等級以上或已達停班停課基準」的那幾站 —— 大雨等級一次列七八站,
     那幾行沒有一行會改變任何決定。其餘的用一行帶過。 */
  const rall = withXY.map(x => {
    const rb = nearestRain(x);
    const lv = rb && rainLevel(rb.o);
    if (!lv) return null;
    const m = dgpaMark(rb.o.h24, x);
    if (m) anyDgpa = true;
    return { x, rb, lv, m, key: RAIN_LEVELS.findIndex(L2 => L2.name === lv.name) };
  }).filter(Boolean);
  const rTop = rall.filter(r => r.m || r.key < RAIN_LEVELS.length - 1);   // 非「大雨」即入列
  const rains = rTop.map(({ x, rb, lv, m }) =>
    `${IN}${x.name}：鄰近${rb.o.name}站 24 小時累積 ${Math.round(rb.o.h24)} 毫米`
      + `（${lv.name}等級${m ? `，已達停班停課雨量參考基準之${m.label}基準 ${m.thr} 毫米` : ''}）。`);
  const rRest = rall.length - rTop.length;
  if (rRest > 0) rains.push(`${IN}其餘 ${rRest} 站為大雨等級。`);
  if (rains.length) {
    L.push(''); L.push('雨量實測（自動雨量站）'); L.push(...rains);
    if (anyDgpa) {
      L.push(`${IN}※ 停班停課基準為未來 24 小時累積雨量「預測」達山區 ${DGPA_HILL} 毫米、`
        + `平地 ${DGPA_FLAT} 毫米（各站依其所在地形取一個基準），`
        + '且已致災或有致災之虞，由地方政府研判宣布；'
        + '上列為雨量站實測累積，達標不等於已宣布停班停課，請以人事行政總處公告為準。');
    }
  }

  // ── 注意事項 ──
  L.push('');
  if (gaps.length) {
    L.push(`注意：${gaps.join('、')}實測與推估相差三級以上，代表模型在該地形不可靠，`
      + '請以現場實測為準，勿逕依系統時間執行關機。');
  }
  L.push('注意事項：警報資料來自氣象署官方發布；系統推估時間與距離僅供參考，'
    + '最新動態請依中央氣象署為準。');
  return L.join('\n');
}

/* 播報稿的上色。
   整段同一個灰色時,要在裡面找出「幾點該關機」得逐字讀。
   上色的對象只有三種:**會改變決定的數字**（風級、雨量等級、時刻）、
   **動作**（關機、停班停課）、以及**但書**（推估、非公告）。
   其餘一律不動 —— 每個字都是重點就等於沒有重點。

   注意這是先 esc 再上色,所以比對的是已經跳脫過的字串;
   複製出去的仍然是 briefText() 的純文字,不含任何標記。            */
function briefHtml(txt) {
  const wrap = (v, col, bold) =>
    `<span style="color:${col}${bold ? ';font-weight:700' : ''}">${v}</span>`;
  const rainRe = new RegExp('(' + RAIN_LEVELS.map(x => x.name).join('|') + ')', 'g');

  /* 一行一行處理。整段一起 replace 的話,但書那幾行會被前面的規則
     先塗上紅色與粗體,再被但書規則包一層灰 —— 內層贏,結果但書比正文還醒目。
     但書就是要安靜,所以碰到但書行直接整行壓暗,不再套其他規則。 */
  return txt.split('\n').map(raw => {
    const line = esc(raw);
    if (!line) return '';
    if (/^　?(※|注意事項：|注意：)/.test(raw)) {
      return `<span style="color:var(--fg4)">${line}</span>`;
    }
    let h = line;
    // 風級 → 用蒲福風級本來的色階,跟畫面上的徽章對得起來
    h = h.replace(/(\d{1,2})\s*級/g, (m0, n) => wrap(m0, bfColor(+n), +n >= 8));
    /* 雨量等級必須一次掃完 —— 逐個等級各掃一遍的話,「超大豪雨」上色之後
       下一輪的「大豪雨」會再命中它裡面那三個字,顏色會從中間裂開。
       RAIN_LEVELS 由重到輕排,交替式會先吃長的那個。 */
    h = h.replace(rainRe, m0 => wrap(m0, (RAIN_LEVELS.find(x => x.name === m0) || {}).col || 'var(--sb)', true));
    // 時刻
    h = h.replace(/(今日|明日|後天|昨日|週[日一二三四五六]|\d{1,2}\/\d{1,2})?\s*(凌晨|清晨|上午|中午|午後|傍晚|晚間|深夜)?\s*(\d{1,2}:\d{2})/g,
      m0 => wrap(m0, 'var(--acc)', true));
    // 要動作的事
    h = h.replace(/(應於|前完成關機|完成關機|立即關機|停班停課|停止上班上課|陸上颱風警報|海上颱風警報)/g,
      m0 => wrap(m0, 'var(--no)', true));
    h = h.replace(/(可評估復機|不需關機|未達關機門檻)/g, m0 => wrap(m0, 'var(--ok)', true));
    h = h.replace(/(本機推估，非公告|系統推估|推估)/g, m0 => wrap(m0, 'var(--fg4)'));
    // 段落標題（不以全形空格起首的那幾行）
    if (raw.startsWith('【')) return `<b style="color:var(--acc);font-size:0.9375rem">${h}</b>`;
    if (!raw.startsWith('　')) return `<b style="color:var(--fg);letter-spacing:.04em">${h}</b>`;
    return h;
  }).join('\n');
}

function briefCard() {
  const txt = briefText();
  if (!txt) return '';
  return `<div class="sec"><h2>氣象員播報</h2>
    <button class="act" onclick="copyBrief()">複製</button></div>
   <div class="card pad" style="margin-bottom:0.75rem">
     <div id="briefTxt" style="white-space:pre-wrap;line-height:1.85;font-size:0.875rem;
       color:var(--fg2)">${briefHtml(txt)}</div>
   </div>`;
}

function copyBrief() {
  const txt = briefText();
  if (!txt) return;
  const done = () => toast('已複製播報稿');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt, done));
  } else fallbackCopy(txt, done);
}

function fallbackCopy(txt, done) {
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast('複製失敗，請長按選取'); }
  document.body.removeChild(ta);
}

function clearTyPanes() {
  ['tyPick', 'tyTl', 'tyImpact', 'tyFc', 'tyBrief', 'tyWx', 'tyWarnEst'].forEach(id => {
    const el = document.getElementById(id); if (el) el.innerHTML = '';
  });
}

/* 雙颱（含以上）時的選擇列。只有一顆就不顯示，免得多佔一行版面。 */
function typhoonPicker() {
  const list = DB.ty.list || [];
  if (list.length < 2) return '';
  const cur = tyKey(DB.ty.data);
  const chips = list.map(t => {
    const k = tyKey(t), bf = ms2bf(t.vmax), d = Math.round(distToTaiwan(t.pos));
    return `<button class="ty-chip${k === cur ? ' on' : ''}" onclick="pickTyphoon('${esc(k)}')">
      <i style="background:${bfColor(bf)}"></i>
      <span class="tc-b"><span class="tc-n">${esc(t.name)}</span>
      <span class="tc-d">${tcClass(t.vmax)} ${bf} 級 · ${d} km</span></span></button>`;
  }).join('');
  return `<div class="ty-pick">
    <div class="tp-h">${list.length} 個熱帶氣旋活動中，點選要推算的那一顆</div>
    <div class="tp-r">${chips}</div></div>`;
}

/* 「中心最接近」這個標題配上紅字,在距離四千公里的時候讀起來像是
   「快要靠近了」。使用者的原話:「目前颱風這麼遠，你又用中心最接近
   這個字眼很容易讓人誤會」。

   標題與顏色都要跟著距離走 —— 同一個數字,在 200 公里和 4000 公里
   是完全不同的兩件事,不能長得一樣。                              */
const CPA_NEAR = 300, CPA_MID = 1000;      // 公里
function cpaLook(km) {
  if (km <= CPA_NEAR) return { title: '最接近臺灣', col: '#EF5B4C', icon: '🎯',
    note: '距離已在暴風可能影響的範圍' };
  if (km <= CPA_MID) return { title: '路徑最近時刻（推估）', col: '#EFAA35', icon: '📍',
    note: '仍有距離，尚未構成直接影響' };
  return { title: '路徑最近時刻（推估）', col: 'var(--fg3)', icon: '📍',
    note: '距離很遠，對臺灣無影響' };
}
function cpaRowHtml(cpa) {
  const km = Math.round(cpa.d);
  const L = cpaLook(km);
  return `<div class="warnrow"><div class="wi" style="background:${
      L.col.startsWith('#') ? L.col + '22' : 'var(--surf)'};color:${L.col}">${L.icon}</div>
    <div class="wt"><b>${L.title}</b><small>最近時距臺灣約 ${km} 公里　${L.note}</small></div>
    <div class="wv" style="color:${L.col}">${fmtWhen(cpa.t)}
      <br><span style="color:var(--fg4);font-weight:400">${fmtShort(cpa.t)}　${relative(cpa.t)}</span>
    </div></div>`;
}

function warningCard() {
  if (!WARN) return `<div class="msg w">目前來源沒有官方預報路徑，無法推算警報時機。到設定填入中央氣象署授權碼即可啟用。</div>`;

  /* 熱帶性低氣壓不會有颱風警報 —— 氣象署的颱風警報只發給
     近中心最大風達八級（17.2 m/s）以上的系統。
     這裡不能拿它去套海警／陸警的推算,否則會端出一個
     「預估發布陸上颱風警報」這種根本不會發生的結論。      */
  if (!WARN.isTy) {
    const ty0 = DB.ty.data;
    const cpa = WARN.cpa ? cpaRowHtml(WARN.cpa) : '';
    return `<div class="sec"><h2>警報時機預判</h2></div>
      <div class="msg i" style="margin-bottom:0.75rem">
        目前是<b>${TC_FULL[tcClass(ty0 ? ty0.vmax : 0)] || '熱帶性低氣壓'}</b>
        （近中心最大風 ${bfLabel(ms2bf(ty0 ? ty0.vmax : 0))}），
        <b>不會發布颱風警報</b> —— 中央氣象署的海上／陸上颱風警報，
        只發給近中心最大風達 8 級（17.2 m/s）以上的颱風。
        這類系統氣象署改以<b>豪大雨特報、強風特報</b>因應，請看播報頁的特報清單。
        若後續增強為颱風，這裡就會出現警報時機推算。</div>
      ${cpa ? `<div class="card" style="margin-bottom:0.75rem">${cpa}</div>` : ''}`;
  }
  // 外推來的時機和官方預報算出來的時機,風險完全不同,不能長得一樣。
  const exNote = EXTRAP ? `<div class="msg w" style="margin-bottom:0.5rem">
    以下時機是由<b>外推路徑</b>推算的，不是根據中央氣象署的預報路徑。
    只能當作粗略參考，不建議直接拿來排關機時程。</div>` : '';
  const row = (icon, col, title, sub, val) =>
    `<div class="warnrow"><div class="wi" style="background:${col}22;color:${col}">${icon}</div>
     <div class="wt"><b>${title}</b><small>${sub}</small></div><div class="wv" style="color:${col}">${val}</div></div>`;
  // 「8/27 01:00 · 3.8 天後」要自己換算成星期幾;「週三凌晨 01:00」不用。
  const two = (t, tag) => `${tag ? tag + '<br>' : ''}${fmtWhen(t)}`
    + `<br><span style="color:var(--fg4);font-weight:400">${fmtShort(t)}　${relative(t)}</span>`;

  // 依目前處於哪個階段，講當下最該知道的那一件事
  const state = w => {
    if (!w) return { sub: '暴風範圍預估不會觸及', val: '<span style="color:var(--fg4)">預估不發布</span>' };
    if (w.phase === 'pending') return { sub: '預估發布時機', val: two(w.issue) };
    if (w.phase === 'issued') return { sub: '已達發布時機，暴風範圍尚未觸及', val: two(w.affect, '預估開始影響') };
    if (w.phase === 'active') return { sub: '暴風範圍影響中', val: two(w.clear, '預估脫離') };
    return { sub: '暴風範圍已脫離', val: '<span style="color:var(--fg4)">預估可解除</span>' };
  };
  const s = state(WARN.sea), l = state(WARN.land);
  /* 沒有資料的列就不要擺出來。四列裡三列寫著「預估不發布」「—」,
     等於用整張卡講一句「不會有事」—— 那一句話寫成一行就好。 */
  const noWarn = !WARN.sea && !WARN.land;
  const rows = [];
  if (!noWarn) {
    rows.push(row('🌊', '#54C7EA', '海上颱風警報', s.sub, s.val));
    rows.push(row('🏝', '#EFAA35', '陸上颱風警報', l.sub, l.val));
  }
  if (WARN.cpa) rows.push(cpaRowHtml(WARN.cpa));
  if (WARN.sea) {
    rows.push(row('✅', '#3ECB92', '預估解除警報', '暴風範圍完全脫離近海之後', two(WARN.sea.clear)));
  }
  if (!rows.length) return '';
  let html = `<div class="sec"><h2>警報時機預判${EXTRAP ? '（由外推路徑推算）' : ''}</h2></div>` + exNote;
  if (noWarn) {
    html += `<div class="msg i" style="margin-bottom:0.5rem">暴風範圍預估不會觸及臺灣近海，
      <b>推估不會發布海上或陸上颱風警報</b>。</div>`;
  }
  html += '<div class="card" style="margin-bottom:0.75rem">' + rows.join('') + '</div>';
  if (!noWarn) {
    html += `<p class="hint" style="margin-bottom:0.875rem">依氣象署慣例推算（海警：暴風範圍及岸外 ${DB.cfg.seaBuffer} km 前 24 小時；陸警：及陸前 18 小時）。實際發布時間由氣象署決定，此處供先期排程參考。</p>`;
  }
  return html;
}

/* ── 時間軸 ────────────────────────────────────────────────
   逐時內插序列本來就算好了,只差一個介面。
   排班的人最想知道的是「我交接的那個時刻,各站臺是幾級風」,
   拖到那一格看一眼就有答案,不必自己從尖峰時間反推。            */
let TCUR = 0, TMARK = null;

function timelineCard() {
  if (!SERIES || SERIES.length < 2) return '';
  const max = SERIES.length - 1;
  if (TCUR > max) TCUR = 0;
  return `<div class="sec"><h2>時間軸${EXTRAP ? '（外推推估）' : ''}</h2></div>
  <div class="card pad" style="margin-bottom:0.75rem">
    <input class="tl-r" type="range" id="tlR" min="0" max="${max}" step="1" value="${TCUR}"
      oninput="onTimeline(this.value)" aria-label="預報時刻">
    <div id="tlOut">${timelineOut()}</div>
    <span class="sub" style="display:block;margin-top:0.375rem">
      拖到交接時刻，看那時各站臺幾級風。${EXTRAP ? '外推推估，越遠越不可信。' : ''}</span>
  </div>`;
}

function timelineOut() {
  if (!SERIES || !SERIES[TCUR]) return '';
  const s = SERIES[TCUR], bf = ms2bf(s.vmax), d = Math.round(distToTaiwan(s.pos));
  // 真實時刻放最大 —— 拖到某一格時,要的答案是「幾點」而不是「第幾小時」。
  const head = `<div style="display:flex;align-items:baseline;gap:0.5rem;flex-wrap:wrap;margin:0.5rem 0">
    <b style="font-size:1.0625rem;color:var(--fg)">${TCUR === 0 ? '現在' : fmtWhen(s.t)}</b>
    <span style="font-family:var(--mono);font-size:0.8125rem;color:var(--acc)">${TCUR === 0
      ? fmtShort(s.t) : '+' + s.h + ' 小時後'}</span>
    <span class="pill" style="background:${bfColor(bf)}">${bf} 級</span>
    <span style="font-size:0.8125rem;color:var(--fg3)">距臺灣 ${d} km</span></div>`;

  const withXY = DB.stations.filter(x => Number.isFinite(x.lat) && Number.isFinite(x.lng));
  if (!withXY.length) return head;
  const rows = withXY
    .map(x => ({ name: x.name, bf: windAt(s, { lat: x.lat, lng: x.lng }).bf }))
    .sort((a, b) => b.bf - a.bf);
  return head + '<div style="display:flex;flex-wrap:wrap;gap:0.375rem">'
    + rows.map(r => `<div class="tl-st">
        <span class="pill" style="background:${bfColor(r.bf)}">${r.bf}</span>
        <span>${esc(r.name)}</span></div>`).join('')
    + '</div>';
}

function onTimeline(v) {
  const max = SERIES ? SERIES.length - 1 : 0;
  TCUR = clamp(parseInt(v, 10) || 0, 0, max);
  // 滑桿自己拖的時候值已經對了,但從別處呼叫時要把把手一起移過去,
  // 否則畫面顯示 +18h、滑桿卻停在最左邊,兩者對不起來。
  const r = document.getElementById('tlR');
  if (r && String(TCUR) !== r.value) r.value = String(TCUR);
  const out = document.getElementById('tlOut');
  if (out) out.innerHTML = timelineOut();
  drawTimeMarker();
}

/* 地圖上的時刻標記。放在自己的圖層,重畫主圖時不會互相蓋掉。
   拖到 0（現在）就撤掉,免得跟主標記重疊看不清楚。               */
function drawTimeMarker() {
  if (typeof L === 'undefined' || !MAP || !SERIES) return;
  if (TMARK) { MAP.removeLayer(TMARK); TMARK = null; }
  if (!TCUR || !SERIES[TCUR]) return;
  const s = SERIES[TCUR];
  TMARK = L.layerGroup().addTo(MAP);
  L.circle([s.pos.lat, s.pos.lng], {
    radius: Math.max(s.r15, 0) * 1000, color: '#FFFFFF', weight: 1.2,
    dashArray: '4,4', fill: false, opacity: .65,
  }).addTo(TMARK);
  L.circleMarker([s.pos.lat, s.pos.lng], {
    radius: 6, color: '#FFFFFF', weight: 2,
    fillColor: bfColor(ms2bf(s.vmax)), fillOpacity: 1,
  }).bindTooltip(`+${s.h}h　${fmtShort(s.t)}　${bfLabel(ms2bf(s.vmax))}`).addTo(TMARK);
  // 拖到的那個時刻也標出來,白框紅底,跟預報點的藍標籤分得開
  L.marker([s.pos.lat, s.pos.lng], {
    icon: tyTag(`${fmtShort(s.t)}<br>+${s.h}h`, 'now', -6), zIndexOffset: 1400,
  }).addTo(TMARK);
}

/* 地圖圖例。顏色多了之後（紅=選中、琥珀=其他颱風、青=預報、虛線=近海界線）,
   不講一下沒人知道那條淡青虛線是什麼。 */
function mapLegend() {
  const seaKm = Number.isFinite(DB.cfg.seaBuffer) ? DB.cfg.seaBuffer : 100;
