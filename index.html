function openTypes() {
  const rows = DB.types.map(t => `<div class="card pad" style="margin-bottom:0.5625rem">
    <label class="fld"><span class="lb">顯示名稱</span><input type="text" data-t="${t.id}" data-k="label" value="${esc(t.label)}"></label>
    <label class="fld" style="margin-bottom:0.5rem"><span class="lb">回報段落用語</span>
      <input type="text" data-t="${t.id}" data-k="report" value="${esc(t.report)}">
      <span class="sub">產出時寫成「一、${esc(t.report)}3處：」</span></label>
    <label class="fld" style="margin-bottom:0.5rem"><span class="lb">地圖符號</span>
      <input type="text" data-t="${t.id}" data-k="icon" value="${esc(t.icon || '')}"
        placeholder="${typeIcon(t)}" maxlength="2">
      <span class="sub">地圖上這個類別的圖標，可填一個字或 emoji。留空用預設的 ${typeIcon(t)}。</span></label>
    <label class="fld" style="margin-bottom:0.5rem"><span class="lb">停班停課雨量基準</span>
      <select data-t="${t.id}" data-k="terrain">
        ${Object.entries(TERRAIN).map(([k, v]) =>
          `<option value="${k}" ${t.terrain === k ? 'selected' : ''}>${v.thr} mm（${v.label}）</option>`).join('')}
      </select>
      <span class="sub">目前為 <b>${TERRAIN[t.terrain === 'hill' ? 'hill' : 'flat'].thr} mm</b>。
        依《天然災害停止上班及上課作業辦法》第四條附表，門檻是「平地／山區」而不是一個固定數字——
        多數縣市平地與山區都是 ${DGPA_FLAT} mm，只有部分縣市山區是 ${DGPA_HILL} mm，連江縣兩者都是 200 mm。
        實際比對時會依該站所在縣市查表。個別站臺可在該站「編輯」裡覆寫。</span></label>
    <div class="sw" style="margin-bottom:0.5rem"><div class="sw-t"><b>列入回報稿</b>
      <small>${t.noReport ? '目前不列入。自用監看，不進交接通報' : '目前列入交接通報'}</small></div>
      <button class="tgl" data-t="${t.id}" data-k="noReport" aria-pressed="${!t.noReport}"></button></div>
    <button class="btn sm dg" data-del="${t.id}">刪除此類別</button></div>`).join('');
  openSheet('設備類別', rows + `
    <div class="btnrow"><button class="btn pri wide" id="t_add">新增類別</button></div>
    <p class="hint" style="margin-top:0.75rem">類別完全由您自訂，程式不預設任何實際設備名稱。刪除類別前，請先把該類別下的站臺改到其他類別。
    關掉「列入回報稿」的類別，仍會出現在站臺頁、衝擊預判與播報，只是不進交接通報。</p>`,
    () => {
      $('#shBody').addEventListener('change', e => {
        const el = e.target.closest('select[data-t]'); if (!el) return;
        const t = DB.types.find(x => x.id === el.dataset.t); if (!t) return;
        t[el.dataset.k] = el.value; save(); renderStations(); renderTyphoon({}); generate();
      });
      $('#shBody').addEventListener('input', e => {
        const el = e.target.closest('input[data-t]'); if (!el) return;
        const t = DB.types.find(x => x.id === el.dataset.t); if (!t) return;
        t[el.dataset.k] = el.value; save();
      });
      $('#shBody').addEventListener('click', e => {
        const g = e.target.closest('button.tgl[data-t]');
        if (g) {
          const t = DB.types.find(x => x.id === g.dataset.t);
          if (t) { t.noReport = !t.noReport; save(); openTypes(); renderStations(); generate(); }
          return;
        }
        const d = e.target.closest('[data-del]');
        if (d) {
          const used = DB.stations.filter(s => s.type === d.dataset.del).length;
          if (used) return toast(`還有 ${used} 個站臺屬於此類別，請先改到其他類別`);
          if (DB.types.length <= 1) return toast('至少需保留一個類別');
          DB.types = DB.types.filter(x => x.id !== d.dataset.del); save(); openTypes(); renderStations();
        }
      });
      $('#t_add').onclick = () => {
        DB.types.push({ id: uid(), label: '新類別', report: '新類別', terrain: 'flat', noReport: false });
        save(); openTypes(); renderStations();
      };
    });
}

  <div class="sec"><h2>使用說明</h2></div>
  <div class="card pad help">
    <details><summary>一次颱風的操作順序</summary>
      <ul><li>平時：在「站臺」建好站臺、填座標。</li>
      <li>颱風接近：「戰情 › 總覽」看警報；「站臺 › 預判」看哪一站幾點達門檻。</li>
      <li>按「站臺」頁上方的「開始管制」。</li>
      <li>陣風達門檻：站臺卡把「待機」框起來，按下去就記時間。<b>關機只在特殊需要時才按。</b></li>
      <li>發報：「回報」選初報或續報，「複製全文」貼到群組，發完按「標記已回報」。</li>
      <li>颱風離開、陣風降到可復機以下：按「開機」，再發一次續報，最後「結束管制」。</li></ul></details>
    <details><summary>各頁在哪裡</summary>
      <ul><li><b>戰情</b>：總覽（名牌、警報、時間軸）、播報員（可直接唸、複製的播報稿）、路徑（地圖與播放列）、天氣（落雷、雷達、下雨與預報）。</li>
      <li><b>站臺</b>：管制（狀態按鈕）、預判（各站何時待機、何時復機）、時序（管制紀錄）。</li>
      <li><b>回報</b>：回報稿、撤除檢核（縮編、撤除的通知與時間，可複製成通報）。</li>
      <li><b>停班課</b>：各縣市（侵襲機率、推估、官方公告、長截圖）、推估比對。</li></ul></details>
    <details><summary>待機和關機怎麼判斷</summary>
      <p>一律看<b>最大陣風</b>：測站有量到就用實測，沒有就用模型持續風 ×${GUST_FACTOR}（標「推估」）。
      達 ${c.bfShut} 級建議待機、達 ${c.bfEmerg} 級提醒立即待機；降到 ${c.bfResume} 級以下、濕度不超過 ${c.humMax}% 才建議復機。</p></details>
    <details><summary>推估和官方的差別</summary>
      <p>標「中央氣象署」「官方」的是官方資料；各站陣風、待機復機時間、警報時機、停班停課推估是本程式依官方路徑推算，
      供先期作業參考，以官方與單位規定為準。沒有資料時會寫「尚未取得」，不代表沒事。</p></details>
    <div class="btnrow" style="margin-top:0.5rem"><button class="btn" onclick="setGuide(true)">重新顯示新手引導</button></div>
  </div>

/* ── 匯出 / 匯入 ───────────────────────────────────────
   **全面備份**:換手機、重灌之後要能完全還原,所以除了 DB 之外,
   還要帶上存在 DB 以外的那些偏好（字級、底圖、對焦、子頁籤…）。

   帶的東西裡有兩樣是憑證性質的:
   - **中央氣象署授權碼**（氣象序號）—— 使用者明確要求要含在備份裡,
     不含的話換機之後還要自己去翻,那不叫備份。
   - **開啟密碼的雜湊** —— 帶著,但**匯入時會先問要不要一併還原**;
     不問就蓋掉的話,還原一份忘了密碼的舊備份會把人鎖在門外。

   所以匯出時畫面上要講清楚這個檔案含授權碼。要給別人看的話,
   關掉「備份含座標」並不夠 —— 那只擋座標。 */
const UI_KEYS = ['galepost.ui.ts', 'galepost.ui.sub', 'galepost.ui.basemap',
  'galepost.ui.mapfocus', 'galepost.ui.aux', 'galepost.ui.windyfocus'];

/* 匯出範圍。
   `all` 是整份;`cfg` 只有設定（換新機先把門檻、用語、授權碼帶過去,
   不必連別人的站臺一起搬進來）;其餘是單一設備類別。

   **分類匯出必然要有分類匯入。** 只匯出雷達、再照舊的方式匯入,
   會把整個 DB 換成「只有雷達」那一份 —— 紅外線與中繼站臺就沒了。
   所以分類的備份一律走**合併**:依站臺名稱比對,有的覆蓋、沒有的新增,
   範圍以外的東西一律不動。整份備份才會問要取代還是合併。            */
const EXP_SCOPES = () => [
  { k: 'all', label: '全部（完整備份）' },
  ...DB.types.map(t => ({ k: t.id, label: t.label,
    n: DB.stations.filter(x => x.type === t.id).length })),
  { k: 'cfg', label: '僅設定（不含站臺）' },
];
let expScope = 'all';

/* ═══ 團隊共用 ═══════════════════════════════════════════
   使用者要的是「把一個檔案給某人之後,兩邊就能互通,也能解綁」。

   **先講做不到的：真正的即時點對點，這支程式做不到。**
   WebRTC 要先交換 SDP 與 ICE（signalling）才連得起來,那需要一台
   雙方都連得到的伺服器。手動貼一次 offer/answer 是可以連起來,但
   ICE 候選會過期、IP 會變,**下一次還要再貼一次** —— 對值班台來說
   比不做還糟。這支程式是 GitHub Pages 上的靜態檔,沒有後端。

   **做得到而且真的堪用的：配對檔 + 同步包。**
   ① 一方建立團隊,匯出一個**邀請檔**,用你們本來就在用的管道傳過去
      （LINE、AirDrop、電子郵件都行）。對方匯入就綁定了。
   ② 之後任何一方匯出**同步包**,對方匯入就把站臺狀態併進來。
      不需要兩邊同時在線,不怕 NAT,離線也能事後補。
   ③ **解綁**：移除某個成員（之後拒收他的同步包）,或整個離開團隊。

   同步包用團隊金鑰做 HMAC-SHA256 簽章。意義是:別人隨手丟一個檔案
   進來**不會**默默改掉你的站臺狀態。但金鑰本身就在邀請檔裡 ——
   **邀請檔傳得多安全,這件事就有多安全**,它是共用密鑰不是公鑰。   */

const TEAM_TAG = 'team1', SYNC_TAG = 'sync1';

// 簽章要對「同一個字串」算。物件的鍵順序經過 JSON 來回可能不同,
// 所以先遞迴排序鍵再序列化 —— 兩邊算出來才會是同一串。
function canon(v) {
  if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
  if (v && typeof v === 'object') {
    return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
  }
  return JSON.stringify(v === undefined ? null : v);
}

async function hmacB64(keyB64, msg) {
  const k = await crypto.subtle.importKey('raw', b64d(keyB64),
    { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  return b64e(await crypto.subtle.sign('HMAC', k, new TextEncoder().encode(msg)));
}

function meId() {
  if (!DB.me.id) { DB.me.id = uid(); save(); }
  return DB.me.id;
}
const meName = () => (DB.me.name || DB.cfg.unit || '未命名裝置');

function createTeam(name) {
  const key = b64e(crypto.getRandomValues(new Uint8Array(32)));
  DB.team = { id: uid(), name: String(name || '').trim() || '未命名團隊', key, at: Date.now() };
  meId();
  save(); renderSettings();
  toast('已建立團隊，接著匯出邀請檔傳給對方');
}

function exportInvite() {
  if (!DB.team) return;
  download({ galepost: TEAM_TAG, app: APP_VER, at: new Date().toISOString(),
    team: DB.team, from: { id: meId(), name: meName() } },
    `風哨團隊邀請_${DB.team.name}_${stamp()}.json`);
  toast('已下載邀請檔。請用你們本來就在用的管道傳給對方');
}

function exportSyncPack() {
  if (!DB.team) return;
  /* 只送真正需要共用的欄位。授權碼、開啟密碼、代理網址一律不送 ——
     那是這台裝置的東西,不該因為分享站臺狀態就一起跑到別人手上。 */
  const body = {
    team: DB.team.id,
    from: { id: meId(), name: meName() },
    at: Date.now(),
    types: DB.types.map(t => ({ label: t.label, report: t.report,
      terrain: t.terrain, noReport: !!t.noReport, icon: t.icon || '' })),
    stations: DB.stations.map(x => ({
      name: x.name, type: (DB.types.find(t => t.id === x.type) || {}).label || '',
      status: x.status, at: x.at, mt: Number.isFinite(x.mt) ? x.mt : x.at,
      hum: x.hum == null ? null : x.hum, note: x.note || '',
      lat: Number.isFinite(x.lat) ? x.lat : null, lng: Number.isFinite(x.lng) ? x.lng : null,
      terrain: x.terrain || null, county: x.county || '',
    })),
    ctl: DB.ctl, log: DB.log.slice(-200),
  };
  hmacB64(DB.team.key, canon(body)).then(sig => {
    download({ galepost: SYNC_TAG, app: APP_VER, sig, body },
      `風哨同步_${meName()}_${stamp()}.json`);
    toast(`已下載同步包（${body.stations.length} 站）`);
  }).catch(e => toast('簽章失敗：' + e.message));
}

/* 收到的同步包要先算出「會變成什麼樣」再問要不要套用。
   默默合併是資料消失的標準劇本 —— 值班的人要先看得到差異。 */
function syncDiff(body) {
  const add = [], upd = [], skip = [];
  for (const r of (body.stations || [])) {
    if (!r || !r.name) continue;
    const ex = DB.stations.find(x => x.name === r.name);
    if (!ex) { add.push(r.name); continue; }
    const mine = Number.isFinite(ex.mt) ? ex.mt : (ex.at || 0);
    const theirs = Number.isFinite(r.mt) ? r.mt : (r.at || 0);
    if (theirs > mine) upd.push(`${r.name}：${S_LABEL[ex.status] || ex.status} → ${S_LABEL[r.status] || r.status}`);
    else skip.push(r.name);
  }
  return { add, upd, skip };
}

async function importSyncPack(o) {
  const body = o.body;
  if (!body || typeof body !== 'object') throw new Error('同步包的內容不完整');
  if (!DB.team) throw new Error('這台裝置還沒有加入任何團隊。請先匯入邀請檔');
  if (body.team !== DB.team.id) throw new Error('這個同步包屬於別的團隊，不會套用');

  const want = await hmacB64(DB.team.key, canon(body));
  /* 簽章對不上就停手。可能是被改過,也可能只是對方用的金鑰不同 ——
     兩種都不該套用,因為兩種都表示「這不是我這個團隊的資料」。 */
  if (want !== o.sig) throw new Error('簽章驗證失敗，這個檔案不是用本團隊的金鑰產生的（或中途被改過）');

  const from = body.from || {};
  const blocked = DB.peers.find(p => p.id === from.id && p.blocked);
  if (blocked) throw new Error(`「${blocked.name}」已被解綁，不再接受他的同步包`);

  const d = syncDiff(body);
  if (!d.add.length && !d.upd.length) {
    toast(`來自「${from.name || '未知'}」：${d.skip.length} 站都比本機舊，沒有變動`);
    return;
  }
  const lines = [];
  if (d.add.length) lines.push(`新增 ${d.add.length} 站：${d.add.slice(0, 6).join('、')}${d.add.length > 6 ? '…' : ''}`);
  if (d.upd.length) lines.push(`更新 ${d.upd.length} 站：\n　${d.upd.slice(0, 8).join('\n　')}${d.upd.length > 8 ? '\n　…' : ''}`);
  if (d.skip.length) lines.push(`${d.skip.length} 站本機比較新，維持不動`);
  if (!confirm(`來自「${from.name || '未知裝置'}」的同步包（${fmtShort(body.at)}）\n\n`
    + lines.join('\n') + '\n\n要套用嗎？（不會刪除任何站臺）')) return;

  // 類別照 label 對回去,對不到就整個加進來
  const tmap = {};
  for (const t of (body.types || [])) tmap[t.label] = adoptType(t);

  let add = 0, upd = 0;
  for (const r of (body.stations || [])) {
    if (!r || !r.name) continue;
    const tid = tmap[r.type] || (DB.types[0] || {}).id;
    const ex = DB.stations.find(x => x.name === r.name);
    const rec = { name: r.name, type: tid, status: r.status, at: r.at,
      mt: Number.isFinite(r.mt) ? r.mt : r.at, hum: r.hum, note: r.note || '',
      lat: Number.isFinite(r.lat) ? r.lat : null, lng: Number.isFinite(r.lng) ? r.lng : null,
      terrain: r.terrain || null, county: r.county || '' };
    if (!ex) { DB.stations.push(Object.assign({ id: uid() }, rec)); add++; continue; }
    const mine = Number.isFinite(ex.mt) ? ex.mt : (ex.at || 0);
    const theirs = rec.mt;
    /* 只有對方比較新才覆蓋。**絕不刪除** —— 一個過期的同步包如果能刪站,
       某人拿三天前的檔案匯入就會把新加的站臺全部抹掉。 */
    if (theirs > mine) { Object.assign(ex, rec, { id: ex.id }); upd++; }
  }

  // 紀錄取聯集,重複的（同名同時刻同狀態）跳過
  const seen = new Set((DB.log || []).map(x => `${x.name}|${x.at}|${x.to}`));
  for (const l of (body.log || [])) {
    const k = `${l.name}|${l.at}|${l.to}`;
    if (!seen.has(k)) { DB.log.push(l); seen.add(k); }
  }
  DB.log.sort((x, y) => x.at - y.at);

  // 本次管制取比較晚開始的那一次
  if (body.ctl && body.ctl.start && body.ctl.start > (DB.ctl.start || 0)) DB.ctl = body.ctl;

  // 記下這位成員,之後才有得解綁
  if (from.id) {
    const p = DB.peers.find(x => x.id === from.id);
    if (p) { p.name = from.name || p.name; p.lastRecv = Date.now(); }
    else DB.peers.push({ id: from.id, name: from.name || '未命名', at: Date.now(), lastRecv: Date.now(), blocked: false });
  }

  save(); refreshAll(); renderSettings(); syncForm();
  toast(`已同步：新增 ${add}、更新 ${upd}`);
}

function importInvite(o) {
  const t = o.team;
  if (!t || !t.id || !t.key) throw new Error('邀請檔的內容不完整');
  if (DB.team && DB.team.id !== t.id
    && !confirm(`這台裝置已經在團隊「${DB.team.name}」裡。\n\n`
      + `要改加入「${t.name}」嗎？原本團隊的成員清單會被清掉（站臺與紀錄不會動）。`)) return;
  DB.team = { id: t.id, name: t.name || '未命名團隊', key: t.key, at: Date.now() };
  if (!DB.peers.length || (DB.team && DB.team.id !== t.id)) DB.peers = [];
  meId();
  const f = o.from || {};
  if (f.id && f.id !== DB.me.id && !DB.peers.some(p => p.id === f.id)) {
    DB.peers.push({ id: f.id, name: f.name || '未命名', at: Date.now(), lastRecv: 0, blocked: false });
  }
  save(); renderSettings();
  toast(`已加入團隊「${DB.team.name}」`);
}

function unbindPeer(id) {
  const p = DB.peers.find(x => x.id === id); if (!p) return;
  if (!confirm(`解綁「${p.name}」？\n\n之後他的同步包會被拒收。`
    + '已經併進來的站臺與紀錄不會被移除（那是既成的資料，刪掉才是真的危險）。')) return;
  p.blocked = true; p.at = Date.now();
  save(); renderSettings();
  toast(`已解綁「${p.name}」`);
}
function rebindPeer(id) {
  const p = DB.peers.find(x => x.id === id); if (!p) return;
  p.blocked = false; save(); renderSettings(); toast(`已恢復接收「${p.name}」`);
}
function forgetPeer(id) {
  const p = DB.peers.find(x => x.id === id); if (!p) return;
  if (!confirm(`從清單移除「${p.name}」？\n\n`
    + '注意：移除之後他的同步包會再度被接受（因為已經不在拒收名單上）。\n'
    + '只是想擋掉他的話，用「解綁」不要用這個。')) return;
  DB.peers = DB.peers.filter(x => x.id !== id);
  save(); renderSettings(); toast('已從清單移除');
}
function leaveTeam() {
  if (!DB.team) return;
  if (!confirm(`離開團隊「${DB.team.name}」？\n\n`
    + '之後不再接受任何同步包，也不能再匯出同步包。\n'
    + '站臺、紀錄與設定都不會被刪除。')) return;
  DB.team = null; DB.peers = [];
  save(); renderSettings(); toast('已離開團隊');
}

function exportPayload(scope) {
  const sc = scope || 'all';
  const d = JSON.parse(JSON.stringify(DB));
  d.ty.data = null; d.ty.list = [];    // 颱風資料每次重抓即可,備份它只會過期

  let info = { kind: 'all' };
  if (sc === 'cfg') {
    info = { kind: 'cfg' };
    d.stations = []; d.log = [];
  } else if (sc !== 'all') {
    const t = DB.types.find(x => x.id === sc);
    const keep = d.stations.filter(x => x.type === sc);
    const names = new Set(keep.map(x => x.name));
    info = { kind: 'type', typeId: sc, typeLabel: t ? t.label : '', n: keep.length };
    d.stations = keep;
    /* 只帶這個類別的定義 —— 匯入端的類別 id 不一定一樣,
       所以要靠 label 對回去;帶著整份 types 反而會蓋掉對方的設定。 */
    d.types = t ? [JSON.parse(JSON.stringify(t))] : [];
    d.log = (d.log || []).filter(e => e && names.has(e.name));
    // 分類備份不帶這些「整體性」的東西,它們不屬於某一個類別
    delete d.cfg; delete d.ctl; delete d.ty; delete d.since; delete d.tpl;
  }
  if (!DB.cfg.exportCoords && d.stations) {
    d.stations.forEach(x => { x.lat = null; x.lng = null; });
  }
  const ui = {};
  if (info.kind !== 'type') {
    for (const k of UI_KEYS) {
      try { const v = localStorage.getItem(k); if (v != null) ui[k] = v; } catch (e) {}
    }
  }
  return { galepost: 'full1', app: APP_VER, at: new Date().toISOString(), scope: info, db: d, ui };
}

/* 下載。錨點**一定要先掛進文件**再 click ——
   沒掛進去的 <a> 在 Firefox 與部分 Android 瀏覽器上點了不會有反應,
   或是產生一個 0 位元組的檔案;那個檔案再拿去匯入,
   看到的就是「不是有效的 JSON」。 */
function download(obj, name) {
  const text = JSON.stringify(obj, null, 2);
  LAST_EXPORT = text;                 // 下載不成功時,還能用「複製備份內容」帶走
  try {
    const b = new Blob([text], { type: 'application/json' });
    const url = URL.createObjectURL(b);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
  } catch (e) {
    toast('這個瀏覽器擋下了下載，請改用「複製備份內容」');
  }
  renderSettings();
}
let LAST_EXPORT = '';
const stamp = () => new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '');
// 檔名帶上範圍 —— 三個檔案都叫「風哨備份」的話,要還原時分不出哪個是哪個
const scopeName = sc => sc === 'all' ? '完整'
  : sc === 'cfg' ? '設定'
  : (DB.types.find(t => t.id === sc) || {}).label || '站臺';
async function doExport(enc) {
  const p = exportPayload(expScope);
  const nm = scopeName(expScope);
  if (p.scope.kind === 'type' && !p.scope.n
    && !confirm(`「${nm}」目前沒有任何站臺，還是要匯出嗎？`)) return;
  if (!enc) { download(p, `風哨備份_${nm}_${stamp()}.json`); toast(`已下載「${nm}」備份`); return; }
  const pw = prompt('設定備份檔密碼（解密時需要，遺失無法還原）：');
  if (!pw) return;
  try {
    download(await encryptJSON(p, pw), `風哨備份_${nm}_加密_${stamp()}.json`);
    toast(`已下載「${nm}」加密備份`);
  } catch (e) { toast('加密失敗：' + e.message); }
}
/* 依名稱合併站臺:有的覆蓋、沒有的新增,範圍以外的一律不動。
   名稱是這支程式一直以來的比對依據（貼回報建檔也是照名稱比對）。 */
function mergeStations(incoming, typeId) {
  let add = 0, upd = 0;
  for (const r of incoming) {
    if (!r || !r.name) continue;
    const ex = DB.stations.find(x => x.name === r.name);
    const d = Object.assign({}, r, { type: typeId || r.type });
    if (ex) { Object.assign(ex, d, { id: ex.id }); upd++; }
    else { DB.stations.push(Object.assign({ id: uid() }, d)); add++; }
  }
  return { add, upd };
}

/* 匯入端的類別 id 不一定跟匯出端一樣,所以照 label 對回去;
   對不到就把備份裡那個類別整個加進來。 */
function adoptType(t) {
  if (!t) return DB.types[0] ? DB.types[0].id : '';
  const ex = DB.types.find(x => x.label === t.label || x.report === t.report);
  if (ex) return ex.id;
  const id = uid();
  DB.types.push(Object.assign({}, t, { id }));
  return id;
}

function doImport(e) {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onerror = () => importFail(new Error('讀不到這個檔案，請改用「貼上備份內容」'));
  r.onload = () => applyBackupText(String(r.result));
  r.readAsText(f);
  e.target.value = '';
}

function importFail(err) {
  const m = err && err.message === 'OperationError' ? '密碼錯誤' : (err && err.message) || String(err);
  IMPORT_ERR = m;
  toast('匯入失敗：' + m);
  renderSettings();
}
let IMPORT_ERR = '';

/* 檔案與「貼上」共用同一條路。
   BOM 一定要去掉 —— Android 上經過某些 App 轉手的檔案會多一個 \uFEFF,
   JSON.parse 會直接丟 "Unexpected token",看起來就像備份壞了。 */
async function applyBackupText(raw) {
  try {
    const txt = String(raw || '').replace(/^\uFEFF/, '').trim();
    if (!txt) throw new Error('讀到的內容是空的（0 個字元）——檔案可能是空檔或下載沒完成');
    let o;
    try { o = JSON.parse(txt); }
    catch (e) {
      /* 光說「不是有效的 JSON」沒辦法排查。把**實際讀到什麼**講出來:
         長度、開頭幾個字。是 HTML 就是下載到錯誤頁,是空白就是檔案沒寫成功,
         看起來像 JSON 但斷在中間就是只複製到一半。 */
      const head = txt.slice(0, 60).replace(/\s+/g, ' ');
      const kind = /^</.test(txt) ? '這看起來是一個網頁（HTML），不是備份檔'
        : /^\{|^\[/.test(txt) ? '開頭是 JSON，但中途斷掉——可能只複製到一半'
        : '開頭不是 { 或 [，這不像備份檔';
      throw new Error(`${kind}。讀到 ${txt.length} 個字元，開頭是「${head}」`);
    }
    IMPORT_ERR = '';
    await applyBackup(o);
  } catch (err) { importFail(err); }
}

/* 錯誤一律往上丟給 applyBackupText 統一處理,這裡不自己吞掉 ——
   兩層各接一次的話,訊息會被講兩遍或漏掉一遍。 */
async function applyBackup(oIn) {
  {
    {
      let o = oIn;
      /* 邀請檔與同步包走同一個「匯入」入口 —— 使用者手上就是一個檔案,
         不該還要先分辨它是哪一種再按對應的按鈕。 */
      if (o && o.galepost === TEAM_TAG) { importInvite(o); return; }
      if (o && o.galepost === SYNC_TAG) { await importSyncPack(o); return; }
      if (o && o.galepost === 'enc1') {
        const pw = prompt('這是加密備份，請輸入密碼：');
        if (!pw) return;
        o = await decryptJSON(o, pw);
      }
      // 新版是 {galepost:'full1', scope, db, ui};舊版直接就是 DB 本身,兩種都要接
      const full = o && o.galepost === 'full1';
      const body = full ? o.db : o;
      const ui = full ? (o.ui || {}) : null;
      const sc = (full && o.scope) || { kind: 'all' };
      if (!body || typeof body !== 'object') throw new Error('不是風哨的備份檔');
      if (sc.kind === 'all' && !Array.isArray(body.stations)) throw new Error('不是風哨的備份檔');

      const applyUI = () => {
        if (!ui) return;
        for (const k of UI_KEYS) {
          if (ui[k] == null) continue;
          try { localStorage.setItem(k, ui[k]); } catch (err) {}
        }
      };

      /* ── 單一類別:一律合併,絕不取代 ──
         只匯出雷達、再照整份的方式套用,會把紅外線與中繼站臺一起洗掉。 */
      if (sc.kind === 'type') {
        const tid = adoptType((body.types || [])[0]);
        const n = mergeStations(body.stations || [], tid);
        // 該類別的紀錄一併併回來,重複的（同名同時刻同狀態）跳過
        const seen = new Set((DB.log || []).map(x => `${x.name}|${x.at}|${x.to}`));
        for (const l of (body.log || [])) {
          const k = `${l.name}|${l.at}|${l.to}`;
          if (!seen.has(k)) { DB.log.push(l); seen.add(k); }
        }
        DB.log.sort((x, y) => x.at - y.at);
        save(); refreshAll(); renderSettings(); syncForm();
        toast(`已合併「${sc.typeLabel || '站臺'}」：新增 ${n.add}、更新 ${n.upd}`);
        return;
      }

      /* ── 僅設定:只動設定與類別,不碰站臺 ── */
      if (sc.kind === 'cfg') {
        if (!confirm('這是「僅設定」的備份。將覆蓋管制門檻、回報用語、授權碼與來源網址，'
          + '站臺與紀錄不會被動到。要繼續嗎？')) return;
        const keepPin = DB.cfg.pin;
        const base = blankDB();
        DB.cfg = Object.assign({}, base.cfg, body.cfg || {});
        DB.cfg.pin = keepPin;
        if (Array.isArray(body.types) && body.types.length) DB.types = body.types;
        applyUI();
        save(); refreshAll(); renderSettings(); syncForm();
        toast('設定已匯入（站臺未變動）');
        return;
      }

      /* ── 整份:問要取代還是合併 ──
         取代是原本的行為;會把現有站臺清掉,所以要問。 */
      const replace = confirm(`這是完整備份（${(body.stations || []).length} 個站臺）。\n\n`
        + '按「確定」＝取代：清掉這台目前的站臺與設定，完全還原成備份的樣子\n'
        + '按「取消」＝合併：保留現有站臺，備份裡有的依名稱覆蓋或新增，設定不動');

      if (!replace) {
        const idMap = {};
        for (const t of (body.types || [])) idMap[t.id] = adoptType(t);
        const n = mergeStations((body.stations || []).map(x =>
          Object.assign({}, x, { type: idMap[x.type] || x.type })));
        save(); refreshAll(); renderSettings(); syncForm();
        toast(`已合併：新增 ${n.add}、更新 ${n.upd}（設定未變動）`);
        return;
      }

      /* 密碼要不要一併還原,一定要問。不問就蓋掉的話,
         還原一份忘了密碼的舊備份會把人鎖在門外。 */
      const keepPin = DB.cfg.pin;
      const bakPin = (body.cfg && body.cfg.pin) || '';
      let usePin = keepPin;
      if (bakPin && bakPin !== keepPin) {
        usePin = confirm('這份備份含開啟密碼。要一併還原成備份裡的密碼嗎？\n\n'
          + '按「確定」＝改用備份裡的密碼（記不得就會被鎖在外面）\n'
          + '按「取消」＝保留這台裝置目前的設定') ? bakPin : keepPin;
      }

      const base = blankDB();
      const defCfg = base.cfg, defTy = base.ty, defTypes = base.types;
      DB = Object.assign(base, body);
      DB.cfg = Object.assign({}, defCfg, body.cfg || {}); DB.cfg.pin = usePin;
      DB.ty = Object.assign({}, defTy, body.ty || {});
      if (!Array.isArray(DB.types) || !DB.types.length) DB.types = defTypes;
      applyUI();
      save(); refreshAll(); renderSettings(); syncForm();
      toast(full ? '全面備份已匯入，重新整理後套用顯示偏好' : '備份已匯入');
    }
  }
}

/* ── 密碼鎖 ──────────────────────────────────────────── */
let locked = false, idleT = null;
function openPin() {
  openSheet('開啟密碼', `
    ${DB.cfg.pin ? '<label class="fld"><span class="lb">目前密碼</span><input type="password" id="p_old" inputmode="numeric"></label>' : ''}
    <label class="fld"><span class="lb">新密碼　留空表示取消密碼</span>
      <input type="password" id="p_new" inputmode="numeric" maxlength="8" placeholder="4 至 8 位數字">
      <span class="sub">密碼只在本機驗證。忘記密碼時只能清除資料重建，請保留匯出的備份。</span></label>
    <button class="btn pri wide" id="p_ok">儲存</button>`, () => {
    $('#p_ok').onclick = async () => {
      if (DB.cfg.pin) {
        const old = await sha256($('#p_old').value);
        if (old !== DB.cfg.pin) return toast('目前密碼不正確');
      }
      const nv = $('#p_new').value.trim();
      if (nv && !/^\d{4,8}$/.test(nv)) return toast('請設定 4 至 8 位數字');
      DB.cfg.pin = nv ? await sha256(nv) : '';
      save(); renderSettings(); closeSheet();
      toast(nv ? '密碼已設定' : '密碼已取消');
    };
  });
}
function lock() {
  if (!DB.cfg.pin || locked) return;
  locked = true; $('#lock').classList.add('on'); $('#pinIn').value = '';
  setTimeout(() => $('#pinIn').focus(), 120);
}
async function unlock() {
  if (await sha256($('#pinIn').value) === DB.cfg.pin) {
    locked = false; $('#lock').classList.remove('on'); $('#pinIn').value = '';
  } else { toast('密碼不正確'); $('#pinIn').value = ''; }
}
$('#pinGo').onclick = unlock;
$('#pinIn').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
document.addEventListener('visibilitychange', () => {
  if (!DB.cfg.pin || !DB.cfg.lockMin) return;
  if (document.hidden) { clearTimeout(idleT); idleT = setTimeout(lock, DB.cfg.lockMin * 60000); }
  else clearTimeout(idleT);
});

/* 全螢幕地圖。切換之後一定要 invalidateSize —— 容器換了大小,

function toggleMapFull(on) {
  const w = document.getElementById('mapWrap');
  if (!w) return;
  const next = on == null ? !w.classList.contains('full') : !!on;
  w.classList.toggle('full', next);
  document.body.style.overflow = next ? 'hidden' : '';
  const b = document.getElementById('mapFull');
  if (b) { b.textContent = next ? '✕' : '⛶'; b.title = next ? '離開全螢幕' : '全螢幕'; }
  /* 換了大小之後不只要 invalidateSize,還要重新框一次 ——
     不然全螢幕打開來,內容還擠在原本那 18.75rem 的位置,下面一大片空白。 */

     `window.MAP` 永遠是 undefined,整段就永遠不會執行。 */
  if (MAP) setTimeout(() => {

    declutterLabels();
  }, 60);
}

/* 沒接到的錯誤也要讓人看得到：手機上沒有開發者工具,畫面默默停住只會被說成「沒反應」。
   一分鐘最多跳一次,訊息帶版本號,截圖就能查。 */
let _errAt = 0;
function reportErr(e) {
  console.error(e);
  if (Date.now() - _errAt < 60000) return;
  _errAt = Date.now();
  try { toast(`程式出錯（${APP_VER}）：${String((e && (e.message || e.reason)) || e).slice(0, 80)}——請截圖給維護的人`); } catch (x) { /* 連提示都出不來就算了 */ }
}
addEventListener('error', ev => reportErr(ev.error || ev.message));
addEventListener('unhandledrejection', ev => reportErr(ev.reason));
// 沒開自動更新也要抓一次：不然一打開「出門建議」「天氣」全是資料不足,要先找到「更新」按一下
if (DB.cfg.auto) setAuto(true); else loadTyphoon(false);
if (DB.cfg.wxLoc === WXLOC_GEO) {
  geoLoad();
  // 只有已經允許過才自動重定位：還沒問過的話一打開就跳權限視窗很突兀,等使用者自己按
  try {
    navigator.permissions.query({ name: 'geolocation' })
      .then(r => { if (r.state === 'granted') locateMe(); renderTyphoon({}); }).catch(() => renderTyphoon({}));
  } catch (e) { renderTyphoon({}); }
}
window.openStation = openStation; window.setGuide = setGuide;
window.startCtl = startCtl; window.endCtl = endCtl; window.openTypes = openTypes;
window.goImp = goImp; window.loadTyphoon = loadTyphoon; window.go = go; window.openPin = openPin;
/* 手動檢查更新。
   平常不自動換版是刻意的（颱風天不該把正在操作的人從腳下抽換）,
   但那也代表使用者可能一直停在舊版。這顆按鈕是唯一的出口。 */
async function checkUpdate() {
  if (!('serviceWorker' in navigator)) { toast('此瀏覽器不支援離線更新'); return; }
  let reg = null;
  try { reg = await navigator.serviceWorker.getRegistration(); } catch (e) {}
  if (!reg) { toast('尚未安裝離線版本，重新整理即可取得最新版'); return; }
  toast('檢查中…');
  try { await reg.update(); } catch (e) {}
  // update() 回來時新的 worker 可能還在安裝,等它進到 waiting 再說
  const waiting = await new Promise(res => {
    if (reg.waiting) return res(reg.waiting);
    const nw = reg.installing;
    if (!nw) return res(null);
    nw.addEventListener('statechange', () => {
      if (nw.state === 'installed') res(reg.waiting || nw);
      else if (nw.state === 'redundant') res(null);
    });
    setTimeout(() => res(reg.waiting || null), 8000);
  });
  if (waiting) { toast('正在套用新版本…'); waiting.postMessage('SKIP_WAITING'); }
  else toast(`目前已是最新版本 ${APP_VER}`);
}

/* ── 颱風頁的子頁籤 ────────────────────────────────────────
   整頁攤開要滑很久,而值班的人一次只問一件事:
   現在怎樣、有沒有警報（總覽）、我的站臺會怎樣（各站）、往哪走（路徑）、
   外面實際在下什麼、有沒有打雷（天氣）、要怎麼寫怎麼唸（播報）。
   選的分頁會記住 —— 每次進來都要重點一次很煩。              */
// 使用者：打開 App 預設就在總覽。所以子頁不再存進 localStorage,只在這一次開著的期間記住
let tySub = 'now';

/* ── 子頁籤（站臺、回報、停班課、設定共用一套）──────────
   底部五個分頁各自再分子頁：一頁只放一件事,不再一路往下捲（使用者：頁面太長該開分頁就分頁）。
   選了哪個子頁會記住,下次打開還在那裡。 */
function setSub(g, k) {
  const tabs = document.querySelectorAll(`[data-sub^="${g}:"]`);
  if (![...tabs].some(b => b.dataset.sub === `${g}:${k}`)) return;     // 舊存檔記的子頁已不存在：維持預設
  SUB[g] = k;
  try { localStorage.setItem(SUB_KEY, JSON.stringify(SUB)); } catch (e) {}
  document.querySelectorAll(`[data-sp^="${g}:"]`).forEach(el => el.classList.toggle('on', el.dataset.sp === `${g}:${k}`));
  tabs.forEach(b => { if (b.closest('.seg')) b.setAttribute('aria-pressed', String(b.dataset.sub === `${g}:${k}`)); });
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-sub]');
  if (!b) return;
  const [g, k] = b.dataset.sub.split(':');
  setSub(g, k);
  if (!b.closest('.seg')) window.scrollTo(0, 0);       // 從別處的捷徑跳過來：回到頂端
});
['eq', 'rp', 'dg'].forEach(g => { if (SUB[g]) setSub(g, SUB[g]); });

/* 舊頁籤併進別頁之後的對照：摘要卡、舊存檔記住的分頁都還會叫舊名字，
   切到合併後的那一頁，再捲到那一段。 */
const TY_ALIAS = { warn: ['now', 'tyEvt'], live: ['wx', 'tyThunder'] };
function goTySub(k) {
  // 停班停課、各站、播報都搬到底部導覽的其他頁了；總覽摘要、舊存檔還會叫舊名字
  if (k === 'dgpa') { go('dg'); return; }
  if (k === 'st') { go('eq'); setSub('eq', 'imp'); return; }
  if (k === 'end') { go('rp'); setSub('rp', 'end'); return; }
  const panes = ['now', 'brief', 'map', 'wx'];
  const alias = TY_ALIAS[k];
  if (alias) k = alias[0];
  if (!panes.includes(k)) k = 'now';
  tySub = k;
  panes.forEach(x => {
    const el = document.getElementById('ty-' + x);
    if (el) el.classList.toggle('on', x === k);
  });
  document.querySelectorAll('#tySeg button[data-ty]').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.ty === k)));
  // 地圖在隱藏狀態下量不到自己的大小,切回來要重新量再重新框,
  // 否則會停在切走之前的尺寸,變成一條窄縫或整個世界。
  if (k === 'map' && MAP) {
    setTimeout(() => { MAP.invalidateSize(); if (DB.ty.data) drawMap(DB.ty.data); }, 30);
  }
  // Windy 的 iframe 到真的切到路徑頁的「即時影像」才建立,不然一開 app 就吃掉幾 MB；切走就卸掉
  applyMapTab();
  if (k !== 'map') { const box = document.getElementById('tyWindy'); if (box) box.innerHTML = ''; }
  if (alias) {
    const el = document.getElementById(alias[1]);
    if (el) setTimeout(() => el.scrollIntoView({ block: 'start', behavior: 'smooth' }), 30);
  }
}

let _windyReady = null;
function renderWindyIfReady() { if (_windyReady) _windyReady(); }

window.setWxLoc = setWxLoc; window.locateMe = locateMe; window.setWxMode = setWxMode;
window.importLightningFile = importLightningFile;
window.exportInvite = exportInvite; window.exportSyncPack = exportSyncPack;
window.unbindPeer = unbindPeer; window.rebindPeer = rebindPeer;
window.forgetPeer = forgetPeer; window.leaveTeam = leaveTeam;
window.pickTyphoon = pickTyphoon; window.goTySub = goTySub; window.copyBrief = copyBrief; window.onTimeline = onTimeline;
window.checkUpdate = checkUpdate; window.fetchDgpa = fetchDgpa;

</script>

<div class="pwa" id="pwaBar" role="status">
  <div class="tx"><b id="pwaT"></b><span id="pwaS"></span></div>
  <button id="pwaGo"></button>
  <button class="gh" id="pwaNo" aria-label="關閉">✕</button>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   PWA:安裝、離線警示、版本更新
   直接用 file:// 打開時 service worker 不存在,整段靜默跳過,不影響 app。
   ═══════════════════════════════════════════════════════════════ */
(function () {
  'use strict';
  const bar = document.getElementById('pwaBar');
  const elT = document.getElementById('pwaT'), elS = document.getElementById('pwaS');
  const elGo = document.getElementById('pwaGo'), elNo = document.getElementById('pwaNo');
  if (!bar) return;

  const DISMISS = 'galepost.pwa.dismiss';
  let onGo = null;

  function show(kind, title, sub, action, fn) {
    elT.textContent = title;
    elS.textContent = sub || '';
    elGo.textContent = action;
    elGo.hidden = !action;
    onGo = fn;
    bar.classList.toggle('warn', kind === 'warn');
    bar.classList.add('on');
  }
  function hide() { bar.classList.remove('on'); onGo = null; }

  elGo.addEventListener('click', () => { const f = onGo; hide(); if (f) f(); });
  elNo.addEventListener('click', hide);

  const standalone = () =>
    matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

  /* ── 字級 ───────────────────────────────────────────────────
     存在自己的 key,不進 DB —— 字級是這台裝置的偏好,
     不該跟著站臺資料被匯出、也不該被別台的備份蓋掉。 */
  const TS_KEY = 'galepost.ui.ts';
  const TS = [
    ['s', '小'], ['m', '中'], ['l', '大'], ['xl', '特大'],
  ];
  function getTs() {
    const v = localStorage.getItem(TS_KEY);
    return TS.some(([k]) => k === v) ? v : 'm';
  }
  function applyTs(v) {
    document.documentElement.setAttribute('data-ts', v);
    // 地圖容器尺寸跟著字級變,Leaflet 需要被告知重新量測
    // 同上:頂層 let 不會出現在 window 上。原本這裡的字級切換其實沒有通知過地圖。
    if (typeof MAP !== 'undefined' && MAP && MAP.invalidateSize) {
      setTimeout(() => { MAP.invalidateSize(); if (MAPFIT) MAPFIT(); }, 60);
    }
  }
  function setTs(v) {
    localStorage.setItem(TS_KEY, v);
    applyTs(v);
  }
  applyTs(getTs());

  /* 設定頁的字級、CWA 代理、版本三塊。renderSettings 每次進頁都整段重畫,
     所以在它畫完之後把佔位的 #tsBox、#cwaProxyBox、#verBox 換掉（見下方包裝）。 */
  /* 中央氣象署代理：放在「資料來源 › 中央氣象署」那張卡裡（以前單獨一張卡掛在設定最底下） */
  function cwaProxySection() {
    const wrap = document.createElement('label');
    wrap.className = 'fld';
    wrap.style.margin = '0.75rem 0 0';
    wrap.innerHTML = '<span class="lb">CWA 代理網址（選填）</span>'
      + `<input type="text" id="cwaProxyIn" placeholder="https://xxx.workers.dev" `
      + `value="${esc((DB.cfg && DB.cfg.cwaProxy) || '')}" autocomplete="off" spellcheck="false">`
      + '<span class="sub">直連被擋時改走這個代理（POST cwaDataset／cwaKey，跟常見的 CWA 代理同格式）。留空只用直連。</span>';
    wrap.querySelector('#cwaProxyIn').addEventListener('change', e => {
      DB.cfg.cwaProxy = e.target.value.trim();
      save();
      toast(DB.cfg.cwaProxy ? '已儲存代理網址' : '已清除代理網址');
    });
    return wrap;
  }
  function versionSection() {
    const wrap = document.createElement('div');
    wrap.innerHTML = '<div class="sec"><h2>版本</h2></div>'
      + `<div class="card pad"><div style="display:flex;align-items:center;gap:0.625rem;flex-wrap:wrap">
         <b class="mono" style="font-size:1rem">風哨 ${APP_VER}</b>
         <span id="swVer" style="font-size:0.75rem;color:var(--fg3)"></span>
         <button class="btn sm" id="updBtn" style="margin-left:auto">檢查更新</button></div>
         <span class="sub" style="display:block;margin-top:0.5rem;font-size:0.7188rem;color:var(--fg4);line-height:1.55">
         為了離線可用，程式是快取優先；新版不會在你操作到一半時自動抽換，要換版按這顆。</span></div>`;
    // 顯示 service worker 實際掛著的狀態,跟上面的版本號對照才知道是不是舊的
    const swVer = wrap.querySelector('#swVer');
    if (swVer && 'serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistration().then(reg => {
        if (!reg) { swVer.textContent = '（未安裝離線版本）'; return; }
        swVer.textContent = reg.waiting ? '（有新版本待套用）'
          : reg.active ? '（離線版本已就緒）' : '（安裝中）';
      }).catch(() => {});
    }
    wrap.querySelector('#updBtn').addEventListener('click', () => checkUpdate());
    return wrap;
  }

  /* ── 兩指暫時放大 ────────────────────────────────────────
     只吃「兩根手指」的手勢,單指捲動完全不動它。
     放大時以兩指中點為原點,才會放大你正在看的那一塊而不是畫面正中央。
     手指離開就彈回 scale(1) —— 這是「湊近看一眼」,不是切換縮放層級。
     地圖自己有雙指縮放,所以在地圖上不接管。                    */
  (function pinchPeek() {
    const el = document.querySelector('main');
    if (!el) return;
    const MAXK = 3;
    let base = 0, k = 1, ox = 0, oy = 0, on = false;

    const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
    const apply = () => { el.style.transform = k === 1 ? '' : `translate(${ox}px,${oy}px) scale(${k})`; };
    const reset = () => {
      on = false; k = 1; ox = oy = 0;
      el.classList.remove('peeking');
      el.classList.add('peek-back');
      el.style.transform = '';
      setTimeout(() => el.classList.remove('peek-back', 'peek'), 240);
    };

    el.addEventListener('touchstart', e => {
      if (e.touches.length !== 2) return;
      // 地圖有自己的雙指縮放,不搶
      if (e.target.closest && e.target.closest('#mapWrap')) return;
      const t = [e.touches[0], e.touches[1]];
      base = dist(t);
      if (!base) return;
      on = true;
      const r = el.getBoundingClientRect();
      const cx = (t[0].clientX + t[1].clientX) / 2 - r.left;
      const cy = (t[0].clientY + t[1].clientY) / 2 - r.top;
      el.style.transformOrigin = `${cx}px ${cy}px`;
      el.classList.add('peek', 'peeking');
      el.classList.remove('peek-back');
    }, { passive: true });

    el.addEventListener('touchmove', e => {
      if (!on || e.touches.length !== 2) return;
      const d = dist([e.touches[0], e.touches[1]]);
      if (!d || !base) return;
      const next = clamp(d / base, 1, MAXK);
      // 只放大不縮小 —— 縮到比原本還小沒有用途,而且會露出背景
      if (next <= 1.01 && k <= 1.01) return;
      k = next;
      e.preventDefault();                 // 蓋掉瀏覽器自己的縮放與捲動
      apply();
    }, { passive: false });

    const end = e => { if (on && e.touches.length < 2) reset(); };
    el.addEventListener('touchend', end, { passive: true });
    el.addEventListener('touchcancel', end, { passive: true });
  })();

  /* 字級擺在設定的**最上面**（使用者指定）,分頁列之上、哪一頁都看得到。
     它是「看不清楚的時候第一個要找的東西」,埋在某個分頁裡等於找不到。 */
  function textSizeSection() {
    const wrap = document.createElement('div');
    wrap.className = 'card ts-row';
    wrap.innerHTML = '<div class="sw"><div class="sw-t"><b>字級</b><small>整個介面一起縮放；兩指撐開可暫時放大</small></div>'
      + '<select id="tsSel" aria-label="字級" style="width:6.875rem">'
      + TS.map(([k, label]) => `<option value="${k}" ${getTs() === k ? 'selected' : ''}>${label}</option>`).join('')
      + '</select></div>';
    wrap.querySelector('#tsSel').addEventListener('change', e => setTs(e.target.value));
    return wrap;
  }

  const cfgBody = document.getElementById('cfgBody');
  if (cfgBody && typeof window.renderSettings === 'function') {
    const orig = window.renderSettings;
    window.renderSettings = function () {
      orig.apply(this, arguments);
      const put = (id, el) => { const box = document.getElementById(id); if (box) box.replaceWith(el); };
      put('tsBox', textSizeSection());
      put('cwaProxyBox', cwaProxySection());
      put('verBox', versionSection());
    };
  }

  /* ── Windy 即時影像 ─────────────────────────────────────────
     風哨自己算的是「模式推估」,Windy 給的是實際的雷達回波與風場。
     兩者互補:推估用來排關機時程,實況用來確認現在到底在下什麼。
     嵌入不需要金鑰。iframe 到真的切到颱風頁才建立 —— 一開 app 就載
     等於每次開啟都吃掉幾 MB 行動網路,颱風天很珍貴。 */
  const WINDY_OV = [
    ['radar', '雷達'], ['rain', '雨量'], ['wind', '風速'], ['gust', '陣風'],
  ];
  let windyOv = 'radar';

  /* 對焦位置:站臺或颱風。
     預設仍是站臺 —— 值班最常問的是「自家設備頭上在下什麼」,
     不是颱風中心那片海。但要看颱風本體的雲系與環流時,
     切到颱風才對得上,所以兩個都留,並記住上次的選擇。      */
  const WINDY_FOCUS_KEY = 'galepost.ui.windyfocus';
  let windyFocus = 'station';
  try { windyFocus = localStorage.getItem(WINDY_FOCUS_KEY) || 'station'; } catch (e) {}

  function typhoonCenter() {
    const ty = (typeof DB !== 'undefined' && DB.ty) ? DB.ty.data : null;
    const p = ty && ty.pos;
    return (p && Number.isFinite(p.lat) && Number.isFinite(p.lng)) ? p : null;
  }

  function windyCenter() {
    if (windyFocus === 'typhoon') {
      const p = typhoonCenter();
      // 颱風可能還在幾百公里外,拉遠一級才看得到整個環流
      if (p) return { lat: p.lat, lng: p.lng, zoom: 5 };
    }
    // 以自己的站臺為中心最有用 —— 要看的是自家設備頭上在下什麼,
    // 不是颱風中心那片海。沒有站臺座標才退回臺灣中心。
    const pts = (typeof DB !== 'undefined' ? DB.stations : [])
      .filter(s => Number.isFinite(s.lat) && Number.isFinite(s.lng));
    if (pts.length) {
      return {
        lat: pts.reduce((a, s) => a + s.lat, 0) / pts.length,
        lng: pts.reduce((a, s) => a + s.lng, 0) / pts.length,
        zoom: 6,
      };
    }
    return { lat: 23.7, lng: 121.0, zoom: 6 };
  }

  function windyURL(ov) {
    const c = windyCenter();
    const lat = c.lat.toFixed(3), lng = c.lng.toFixed(3);
    const q = new URLSearchParams({
      lat, lon: lng, detailLat: lat, detailLon: lng,
      zoom: String(c.zoom || 6), level: 'surface', overlay: ov,
      calendar: 'now', menu: '', type: 'map',
      location: 'coordinates', metricWind: 'm/s', metricTemp: 'default',
      radarRange: '-1',
    });
    if (ov === 'radar') q.set('product', 'radar');
    return 'https://embed.windy.com/embed2.html?' + q.toString();
  }

  _windyReady = () => renderWindy();

  function renderWindy() {
    const box = document.getElementById('tyWindy');
    if (!box) return;
    const c = windyCenter();
    const full = `https://www.windy.com/${c.lat.toFixed(3)}/${c.lng.toFixed(3)}?${windyOv},${c.lat.toFixed(3)},${c.lng.toFixed(3)},${c.zoom || 6}`;
    // 沒有颱風就不顯示對焦切換 —— 切過去也只會是一片空海
    const canTy = !!typhoonCenter();
    /* 圖層與對焦各一個下拉、排成一列（以前是兩排按鈕,佔掉地圖上方一大塊） */
    const sel = (id, lb, opts, cur) => `<label class="wy-sel"><span>${lb}</span><select id="${id}">${
      opts.map(([v, l]) => `<option value="${v}" ${cur === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>`;
    box.innerHTML =
      '<div class="sec"><h2>即時影像 Windy</h2></div>' +
      `<div class="wy-bar">${sel('wyOv', '圖層', WINDY_OV, windyOv)}${
        canTy ? sel('wyFo', '對焦', [['station', '站臺'], ['typhoon', '颱風']], windyFocus) : ''}</div>` +
      '<div class="tyframe" id="wyFrame"></div>' +
      `<div class="btnrow" style="margin-top:0.625rem">
         <a class="btn sm" href="${full}" target="_blank" rel="noopener">Windy 全畫面 ↗</a>
         <a class="btn sm" href="https://watch.ncdr.nat.gov.tw/watch_page_typhoon_v2" target="_blank" rel="noopener">NCDR 颱風監測 ↗</a>
       </div>` +
      '<p class="hint" style="margin-top:0.5rem">Windy 是實際觀測與模式繪圖（需連網）；NCDR 可比對各國預報路徑與衛星雲圖。' +
      '風哨的待機、復機時間是本機推估，兩者分開看。</p>';

    mountWindyFrame();
    box.querySelector('#wyOv').addEventListener('change', e => {
      windyOv = e.target.value;
      mountWindyFrame();
    });
    const fo = box.querySelector('#wyFo');
    if (fo) fo.addEventListener('change', e => {
      windyFocus = e.target.value;
      try { localStorage.setItem(WINDY_FOCUS_KEY, windyFocus); } catch (err) {}
      mountWindyFrame();
    });
  }

  // 上一次真的載進去的網址。Windy 的圖磚刻意不快取,重掛一次 iframe
  // 就是又一輪流量,颱風天要省。網址沒變就不重載。
  let _windySrc = '';

  function mountWindyFrame() {
    const frame = document.getElementById('wyFrame');
    if (!frame) return;
    if (!navigator.onLine) {
      frame.innerHTML = '<div class="ph">目前離線，無法載入 Windy 即時影像。<br>' +
        '站臺管制與回報產出不受影響。</div>';
      _windySrc = '';                  // 恢復連線後要重新掛回來
      return;
    }
    const src = windyURL(windyOv);
    if (_windySrc === src && frame.querySelector('iframe')) return;
    _windySrc = src;
    const f = document.createElement('iframe');
    f.src = src;
    f.loading = 'lazy';
    f.title = 'Windy 即時影像';
    f.referrerPolicy = 'no-referrer';
    f.setAttribute('allow', 'fullscreen');
    frame.innerHTML = '';
    frame.appendChild(f);
  }

  // 切到颱風頁才掛載,其他分頁不建立 iframe
  if (typeof window.go === 'function') {
    const origGo = window.go;
    window.go = function (p) {
      origGo.apply(this, arguments);
      if (p === 'ty') { goTySub(tySub); }
      else {
        const box = document.getElementById('tyWindy');
        if (box) box.innerHTML = '';   // 離開就卸載,不讓它在背景繼續拉圖資
      }
    };
  }
  addEventListener('online', () => {
    if (document.getElementById('wyFrame')) mountWindyFrame();
  });
  addEventListener('offline', () => {
    if (document.getElementById('wyFrame')) mountWindyFrame();
  });

  /* ── 分頁深連結 ────────────────────────────────────────────
     manifest 的捷徑(長按圖示 → 站臺 / 回報)靠 #eq、#rp 指定開哪一頁。 */
  const PANES = ['ty', 'eq', 'rp', 'dg', 'cfg'];
  /* 沒指定分頁（一般打開 App）就到戰情 › 總覽（使用者要求）。
     例外：還沒有任何站臺的新使用者留在站臺頁——「開始使用」引導在那裡,先到戰情頁他會找不到從哪開始。
     HTML 預設也是站臺頁：這段腳本若在前面就出錯,至少停在能按狀態的那一頁,不是一片空白的戰情頁。 */
  function fromHash(e) {
    const p = (location.hash || '').replace(/^#/, '');
    if (typeof go !== 'function') return;
    if (PANES.includes(p)) go(p);
    else if (!e && DB.stations.length) go('ty', true);
  }
  addEventListener('hashchange', fromHash);
  fromHash();

  /* ── 離線警示 ──────────────────────────────────────────────
     颱風資料是唯一會過期的東西。離線時操作者必須知道畫面上的
     颱風位置是什麼時候抓的,否則會拿舊資料做關機判斷。          */
  function tyAge() {
    try {
      const at = (typeof DB !== 'undefined' && DB.ty && DB.ty.at) || 0;
      if (!at) return '尚未取得過颱風資料';
      const min = Math.round((Date.now() - at) / 60000);
      if (min < 60) return `颱風資料為 ${min} 分鐘前取得`;
      const hr = min / 60;
      if (hr < 48) return `颱風資料為 ${hr.toFixed(1)} 小時前取得`;
      return `颱風資料為 ${(hr / 24).toFixed(1)} 天前取得`;
    } catch (e) { return ''; }
  }
  function offlineCheck() {
    if (!navigator.onLine) {
      show('warn', '目前離線', tyAge() + ',站臺管制與回報不受影響。', '', null);
    } else if (bar.classList.contains('warn')) {
      hide();
    }
  }
  addEventListener('offline', offlineCheck);
  addEventListener('online', offlineCheck);

  /* ── 安裝 ─────────────────────────────────────────────────── */
  let deferred = null;
  addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferred = e;
    if (standalone() || localStorage.getItem(DISMISS) || !navigator.onLine) return;
    show('', '把風哨加到主畫面', '之後開啟不必找網址,離線也能用。', '安裝', async () => {
      localStorage.setItem(DISMISS, '1');
      deferred.prompt();
      await deferred.userChoice.catch(() => {});
      deferred = null;
    });
  });
  addEventListener('appinstalled', () => { localStorage.setItem(DISMISS, '1'); hide(); });
  elNo.addEventListener('click', () => {
    if (deferred) localStorage.setItem(DISMISS, '1');
  });

  // iOS Safari 沒有 beforeinstallprompt,只能告訴使用者手動加入
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (isIOS && !standalone() && !localStorage.getItem(DISMISS) &&
      location.protocol === 'https:') {
    setTimeout(() => {
      if (!bar.classList.contains('on')) {
        show('', '把風哨加到主畫面', '點下方分享鈕 → 加入主畫面。', '知道了',
          () => localStorage.setItem(DISMISS, '1'));
      }
    }, 2500);
  }

  /* ── Service worker 與版本更新 ─────────────────────────────── */
  if (!('serviceWorker' in navigator) || !location.protocol.startsWith('http')) {
    offlineCheck();
    return;
  }

  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloading) return;
    reloading = true;
    location.reload();
  });

  /* 新版本：沒在操作就直接套用（資料都在本機,重新載入不會掉）；正在輸入、開著視窗、貼上的訊息還沒比對,
     才留一條「重新載入」讓人自己按。以前一律等人按——使用者沒按就一直停在舊版,
     回報的「現在位置還是不能點」修好兩版了手機上都還是舊的。 */
  const busy = () => {
    const a = document.activeElement, imp = document.getElementById('impText');
    return !!document.querySelector('#sheet.on')
      || !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))
      || !!(imp && imp.value.trim() && imp.value !== ((DB.paste && DB.paste.text) || ''));
  };
  function offerUpdate(worker) {
    if (!busy()) { worker.postMessage('SKIP_WAITING'); return; }
    show('', '有新版本', '重新載入即可套用,現有資料不受影響。', '重新載入',
      () => worker.postMessage('SKIP_WAITING'));
  }

  addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      if (reg.waiting && navigator.serviceWorker.controller) offerUpdate(reg.waiting);
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', () => {
          // 有 controller 才代表這是「更新」而非第一次安裝
          if (nw.state === 'installed' && navigator.serviceWorker.controller) offerUpdate(nw);
        });
      });
      // 回到前景時查一次有沒有新版
      addEventListener('visibilitychange', () => {
        if (document.visibilityState !== 'visible') return;
        if (reg.waiting && navigator.serviceWorker.controller && !busy()) { reg.waiting.postMessage('SKIP_WAITING'); return; }
        reg.update().catch(() => {});
      });
    }).catch(() => {});
    offlineCheck();
  });
})();
</script>
</body>
</html>
