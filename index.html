    <i style="width:0.625rem;height:0.625rem;border-radius:50%;background:${c};
      display:inline-block;flex:0 0 auto"></i>${t}</span>`;
  return `<p class="hint" style="display:flex;flex-wrap:wrap;gap:0.5rem 0.875rem;
    margin:0.375rem 0 0.875rem">
    ${dot('#EF5B4C', '選中的颱風')}${dot('#EFAA35', '其他颱風（點可切換）')}
    ${dot(EXTRAP ? '#EFAA35' : '#54C7EA', EXTRAP ? '外推路徑' : '官方預報路徑')}
    <span style="display:inline-flex;align-items:center;gap:0.25rem">
      <i style="width:1.125rem;height:0;border-top:1.5px dashed #54C7EA;
        display:inline-block;flex:0 0 auto"></i>近海 ${seaKm} km（海警門檻）</span>
  </p>
  <p class="hint" style="display:flex;flex-wrap:wrap;gap:0.5rem 0.875rem;margin:0 0 0.875rem">
    <b style="color:var(--fg3)">站臺</b>
    ${dot('var(--ok)', '開機')}${dot('var(--sb)', '待機')}${dot('var(--no)', '關機')}
    <span style="display:inline-flex;align-items:center;gap:0.25rem">
      <i style="width:0.625rem;height:0.625rem;border-radius:50%;border:1.5px dashed var(--fg4);
        display:inline-block;flex:0 0 auto"></i>未建置</span>
    <span style="color:var(--fg4)">符號為類別，右上角可逐類開關圖層</span>
  </p>`;
}

function renderImpact() {
  const tl = $('#tyTl');
  if (tl) tl.innerHTML = (SERIES ? mapLegend() : '') + (SERIES ? timelineCard() : '');
  const box = $('#tyImpact');
  if (!SERIES) { box.innerHTML = ''; return; }
  const withXY = DB.stations.filter(s => IS_LIVE(s) && Number.isFinite(s.lat) && Number.isFinite(s.lng));
  if (!withXY.length) {
    box.innerHTML = `<div class="sec"><h2>站臺衝擊預判</h2></div>
      <div class="msg i">尚無站臺填寫座標。到設定或站臺編輯中填入座標後，這裡會逐站列出目前風級、尖峰風級、應完成關機時間與預估可復機時間。座標支援度分秒、十進位、海圖式等多種寫法。</div>`;
    return;
  }
  const rows = withXY.map(s => ({ s, i: stationImpact(SERIES, s, DB.cfg) }))
    .sort((a, b) => (b.i.peak.bf - a.i.peak.bf) || (a.i.km - b.i.km));
  box.innerHTML = `<div class="sec"><h2>站臺衝擊預判</h2></div>
  <div class="card" style="padding:0.25rem 0.625rem;margin-bottom:0.375rem;overflow-x:auto">
   <table class="impact wide"><tr>
     <th>站臺</th><th>目前推估</th><th>實測</th><th>雨量</th><th>尖峰</th><th>應完成關機</th><th>預估可復機</th></tr>
   ${rows.map(({ s, i }) => `<tr>
     <td class="nm">${esc(s.name)}<br><span style="font-family:var(--mono);font-size:0.6875rem;color:var(--fg4)">${i.km} km</span></td>
     <td><span class="pill" style="background:${bfColor(i.now.bf)}">${i.now.bf}</span></td>
     ${obsCell(s, i.now.bf)}
     ${rainCell(s)}
     <td><span class="pill" style="background:${bfColor(i.peak.bf)}">${i.peak.bf}</span><br>
         <span style="font-size:0.6875rem;color:var(--fg4)">${fmtShort(i.peak.t)}</span></td>
     <td>${i.deadline ? fmtShort(i.deadline) : '<span style="color:var(--fg4)">不需關機</span>'}</td>
     <td>${i.resume ? fmtShort(i.resume.t) : '<span style="color:var(--fg4)">—</span>'}</td>
   </tr>`).join('')}</table></div>
  <p class="hint" style="margin-bottom:0.875rem">
    <b>推估</b>為渦旋模型算的海面持續風，未計入地形；<b>實測</b>為最近測站實際量到的地面風。
    ${obsHint()} ${rainHint()}
    門檻：關機 ${DB.cfg.bfShut} 級、緊急 ${DB.cfg.bfEmerg} 級、可復機 ${DB.cfg.bfResume} 級以下，預留 ${DB.cfg.leadMin} 分鐘（可於設定調整）。</p>`;
}

/* 衝擊表的「實測」欄。
   實測與推估差 3 級以上就標出來 —— 那不是小數點的差別,
   而是「模型在這個地形下算不準」的訊號,值班的人必須自己判斷,
   不能照著程式給的時間關機。差 1、2 級屬正常(海面風 vs 地面風)。 */
/* 實測欄。
   「差 N 級」以前講的是「實測跟推估差多少」—— 那是模型準不準,值班的人幫不上忙。
   改成講**距離關機門檻還差幾級**:那才是要做決定的那個數字
   （「還差 4 級」＝還很遠;「已達門檻」＝現在就該關）。
   模型與實測差三級以上仍然要講,但降成一個小記號,因為它的意思是
   「這一站的推估時間不可信,以現場為準」,不是一個要立刻動作的數字。 */
function obsCell(st, estBf) {
  const ob = nearestObs(st), bf = obsBf(ob);
  if (bf == null) {
    return '<td><span style="color:var(--fg4)">—</span></td>';
  }
  const shut = DB.cfg.bfShut;
  const toShut = shut - bf;
  const line = toShut <= 0
    ? `<b style="display:block;font-size:0.6875rem;color:var(--no)">已達關機門檻 ${shut} 級</b>`
    : `<b style="display:block;font-size:0.6875rem;color:${toShut <= 2 ? 'var(--sb)' : 'var(--fg3)'}">`
      + `距關機門檻 ${toShut} 級</b>`;
  const est = Math.abs(bf - estBf) >= 3
    ? `<span style="display:block;font-size:0.6875rem;color:var(--sb)" title="模型在此地形不可信，以現場為準">`
      + `推估差 ${Math.abs(bf - estBf)} 級</span>` : '';
  return `<td><span class="pill" style="background:${bfColor(bf)}">${bf}</span>`
    + line + est
    + `<span style="display:block;font-size:0.6875rem;color:var(--fg4)">`
    + `${esc(ob.o.name)} ${Math.round(ob.km)}km</span></td>`;
}

function rainHint() {
  if (!RAIN.length) return '';
  return `雨量取最近雨量站（${RAIN.length} 站），分級依氣象署標準。`
    + '<b>關機門檻只看風，雨量供研判道路與積水風險。</b>'
    + '停班停課基準依《天然災害停止上班及上課作業辦法》第四條附表逐縣市認定'
    + `（多數縣市 ${DGPA_FLAT} mm，山區縣市山區 ${DGPA_HILL} mm，連江縣 200 mm）；`
    + '<b>附表的值是「未來 24 小時累積雨量預測」，此處為雨量站「實測」累積 ——'
    + '只有南投平地 300、宜蘭 250、連江 180 這三個縣訂了實際觀測基準，實測達標才是官方依據，'
    + '其餘縣市拿實測去比只是參考。達標仍須地方政府依致災情形研判。</b>';
}

function calSummary() {
  const live = DB.stations.filter(s => IS_LIVE(s) && s.cal && s.cal.n >= CAL_MIN_N);
  if (!live.length) return '';
  const ks = live.map(s => s.cal.k);
  return `已有 <b>${live.length}</b> 站累積出地形校正係數`
    + `（×${Math.min(...ks).toFixed(2)}–×${Math.max(...ks).toFixed(2)}）。`;
}

function obsHint() {
  if (!OBS.length) return '目前沒有觀測資料，實測欄為 —。';
  return `取 ${OBS_MAX_KM} km 內最近測站（${OBS.length} 站，${OBS_AT ? fmtShort(OBS_AT) : '—'}）。`
    + `<b>「距關機門檻 N 級」是實測風力離建議關機門檻（${DB.cfg.bfShut} 級）還差幾級</b>，`
    + '這是要做決定的那個數字。'
    + '<b style="color:var(--sb)">另標「推估差 N 級」時代表模型與實測差三級以上，'
    + '該站的推估時間不可信，請以現場為準。</b>'
    + `<br><b>地形校正</b>：模型算的是海面持續風、沒有地形，所以程式會拿<b>這個站自己的實測</b>`
    + `跟推估相比，把比值累積成該站的校正係數（依風向分八個方位各學一組，`
    + `每個方位滿 ${CAL_MIN_N} 筆才套用），之後的推估與關機時間都乘上去。`
    + `這修得掉的是曝風、遮蔽、測站高度這類<b>系統性偏差</b>；`
    + `修不掉的是路徑誤差造成的時間偏移，以及複雜地形裡的瞬間陣風。`
    + `${calSummary()}`;
}

function renderForecast() {
  const box = $('#tyFc');
  const ty = DB.ty.data;
  if (!ty || !TRACK.length) { box.innerHTML = ''; return; }
  box.innerHTML = `<div class="sec"><h2>${EXTRAP ? '外推路徑（非官方預報）' : '路徑潛勢預報'}</h2></div>
  ${EXTRAP ? `<div class="msg w" style="margin-bottom:0.5rem">
    <b>以下不是中央氣象署的預報路徑。</b>目前來源只有分析位置，沒有官方預報，
    這張表是假設它<b>照現在的方向（${esc(dirName(motionOf(ty) ? motionOf(ty).brg : 0))}）
    與速度（${Math.round(ty.mvSpd)} km/h）直線前進</b>算出來的，強度沿用現值、不預測增強減弱。
    颱風不會這樣走，時距越遠誤差越大。請以中央氣象署發布的警報單為準。</div>` : ''}
  <div class="card" style="padding:0.25rem 0.625rem;overflow-x:auto"><table class="impact">
    <tr><th>時刻</th><th>中心位置</th><th>近中心風</th><th>距臺灣</th><th>${EXTRAP ? '性質' : '70%機率半徑'}</th></tr>
    ${TRACK.map(f => {
      const bf = ms2bf(f.vmax), d = Math.round(distToTaiwan(f.pos));
      // 幾點鐘擺前面、時距擺後面 —— 排班要的是「幾點」,不必自己加減。
      return `<tr><td><b style="color:var(--fg)">${fmtShort(ty.t0 + f.tau * 3600000)}</b>
        <br><span style="color:var(--acc);font-size:0.6875rem">+${f.tau}h</span></td>
        <td>${f.pos.lat.toFixed(1)}N ${f.pos.lng.toFixed(1)}E</td>
        <td><span class="pill" style="background:${bfColor(bf)}">${bf} 級</span></td>
        <td>${d} km</td><td>${EXTRAP ? '<span style="color:var(--sb)">外推</span>' : (f.r70 ? f.r70 + ' km' : '—')}</td></tr>`;
    }).join('')}</table></div>`;
}

/* ── 底圖 ────────────────────────────────────────────────
   預設彩色衛星影像：看得出海陸、地形與雲下的島嶼位置，
   判斷颱風離哪個岸段近時比灰階底圖直觀得多。
   另外保留彩色街道圖與暗色圖 —— 暗色在夜間值班的機房裡比較不刺眼，
   要用的人自己切，選擇會記住。                                        */
const BASEMAPS = {
  sat: {
    label: '衛星影像',
    url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    attr: 'Esri, Maxar, Earthstar Geographics',
    max: 12,
    // 衛星影像沒有地名,疊一層邊界與地名才知道打到哪裡
    over: 'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
  },
  street: {
    label: '彩色地圖',
    url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    attr: '&copy; OpenStreetMap 貢獻者',
    max: 12,
  },
  dark: {
    label: '暗色地圖',
    url: 'https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
    attr: '&copy; OpenStreetMap 貢獻者, &copy; CARTO',
    max: 12,
  },
};
const BASEMAP_KEY = 'galepost.ui.basemap';

let BASELAYERS = null;
function initBasemaps(map) {
  let saved = 'sat';
  try { saved = localStorage.getItem(BASEMAP_KEY) || 'sat'; } catch (e) {}
  if (!BASEMAPS[saved]) saved = 'sat';

  const layers = {};
  for (const [k, b] of Object.entries(BASEMAPS)) {
    const base = L.tileLayer(b.url, { maxZoom: b.max, attribution: b.attr });
    layers[b.label] = b.over
      ? L.layerGroup([base, L.tileLayer(b.over, { maxZoom: b.max })])
      : base;
    layers[b.label]._gpKey = k;
  }
  layers[BASEMAPS[saved].label].addTo(map);
  /* 底圖與站臺圖層共用同一個控制項。分成兩個的話右上角會出現兩疊一樣的圖示,
     使用者要猜哪一個是哪一個。 */
  BASELAYERS = layers;
  map.on('baselayerchange', e => {
    try { localStorage.setItem(BASEMAP_KEY, e.layer._gpKey || 'sat'); } catch (err) {}
  });
}

/* ── 地圖上的站臺 ────────────────────────────────────────
   使用者要的是「臺灣地圖上看得到我的雷達站、紅外線，關機的用灰色」。
   顏色 = 狀態（開機綠／待機琥珀／關機紅／未建置虛線灰）,
   符號 = 類別（可在設備類別裡自己改一個字或 emoji）。
   每個類別自成一個圖層,右上角的圖層控制可以逐類開關 ——
   十幾個點擠在西海岸,不能逐類關掉的話什麼都看不清楚。       */
const TYPE_ICON_DEFAULT = '◉';
function typeIcon(t) {
  if (t && t.icon) return t.icon;
  const n = (t && (t.label + t.report)) || '';
  if (/紅外線|熱影像/.test(n)) return '🔺';
  if (/中繼/.test(n)) return '📡';
  if (/雷達/.test(n)) return '◎';
  return TYPE_ICON_DEFAULT;
}
const stPin = (s, t) => L.divIcon({
  className: '', iconSize: [22, 22], iconAnchor: [11, 11],
  html: `<div class="st-pin${s.status === 'plan' ? ' plan' : ''}" style="color:${S_COL[s.status]}"><i>${typeIcon(t)}</i></div>`,
});
// 標籤要落在圖標下方,不能壓在圖標上 —— 圖標高 22px,中心錨定,
// 所以下緣在 +11,標籤從 +14 開始才不會被蓋住。
const stTag = name => L.divIcon({
  className: '', iconSize: [110, 14], iconAnchor: [55, -14],
  html: `<div class="st-lb">${esc(name)}</div>`,
});

let STLAYERS = null, STCTRL = null;
let MYPTS = [];                          // 自己的點（站臺＋關注地點）,對焦用
const MAPFOCUS_KEY = 'galepost.ui.mapfocus';
let MAPFOCUS = (() => { try { return localStorage.getItem(MAPFOCUS_KEY) || 'all'; } catch (e) { return 'all'; } })();
function drawStations(pts) {
  MYPTS = [];
  /* 舊圖層一定要從地圖上移掉。只把變數設成 null 會讓上一輪的標記留在圖上,
     每重畫一次多疊一層 —— 時刻標記那裡踩過同一個坑。 */
  if (STLAYERS) { for (const g of Object.values(STLAYERS)) MAP.removeLayer(g); }
  STLAYERS = {};
  for (const t of DB.types) {
    const has = DB.stations.some(x => x.type === t.id && Number.isFinite(x.lat));
    if (!has) continue;
    STLAYERS[t.id] = L.layerGroup().addTo(MAP);
  }

  DB.stations.forEach(s => {
    if (!Number.isFinite(s.lat) || !Number.isFinite(s.lng)) return;
    const g = STLAYERS[s.type]; if (!g) return;
    const t = typeOf(s.type);
    const imp = SERIES && IS_LIVE(s) ? stationImpact(SERIES, s, DB.cfg) : null;
    L.marker([s.lat, s.lng], { icon: stPin(s, t), zIndexOffset: 800 })
      .bindTooltip(`${s.name}　${S_STATE[s.status]}` +
        (imp ? `　推估 ${bfLabel(imp.now.bf)}` : '') + `　${t.label}`)
      .on('click', () => openStation(s.id))
      .addTo(g);
    /* 名稱標籤交給疏化機制。十幾個站臺擠在西海岸,縮小的時候標籤會疊成一團 ——
       疊在一起等於全部看不見,不如讓它自己在放大之後才長回來。 */
    FCLABELS.push(L.marker([s.lat, s.lng],
      { icon: stTag(s.name), zIndexOffset: 790, interactive: false }).addTo(g));
    pts.push([s.lat, s.lng]); MYPTS.push([s.lat, s.lng]);
  });

  /* 圖層控制每次重畫都要換掉 —— 類別可能被改名、新增或刪除,
     沿用舊的控制項會指向已經從地圖上移除的圖層。 */
  if (STCTRL) { MAP.removeControl(STCTRL); STCTRL = null; }
  const ov = {};
  for (const [k, g] of Object.entries(STLAYERS)) {
    ov[`${typeIcon(typeOf(k))} ${typeOf(k).label}`] = g;
  }
  STCTRL = L.control.layers(BASELAYERS, Object.keys(ov).length ? ov : null,
    { position: 'topright', collapsed: true }).addTo(MAP);
}

/* 颱風符號（會轉的 🌀）與常駐標籤。
   做法取自使用者另一支程式 ARGUS —— 四顆颱風同圖時，
   靠 tooltip 認不出來，名稱與時間要直接畫在圖上。          */
const tyEye = sel => L.divIcon({
  className: '', iconSize: [34, 34], iconAnchor: [17, 17],
  html: `<div class="ty-eye${sel ? '' : ' sec'}">🌀</div>`,
});

// 標籤寬度隨字數變,外面包一層 flex 置中,長短名稱都對得準中心點。
/* 預報點標籤在縮小時會擠成一團,疊在一起等於全部看不見。
   依螢幕距離疏化:離已保留的標籤太近就藏起來,放大之後自然再出現。
   颱風名稱標籤永遠保留 —— 那是最該看見的東西,先佔位。      */
let FCLABELS = [], ANCHORS = [];
const LABEL_MIN_X = 52, LABEL_MIN_Y = 26;

function declutterLabels() {
  if (!MAP) return;
  const kept = [];
  for (const m of ANCHORS) {
    if (!m.getElement()) continue;
    kept.push(MAP.latLngToContainerPoint(m.getLatLng()));
  }
  for (const m of FCLABELS) {
    const el = m.getElement();
    if (!el) continue;
    const p = MAP.latLngToContainerPoint(m.getLatLng());
    const clash = kept.some(q =>
      Math.abs(q.x - p.x) < LABEL_MIN_X && Math.abs(q.y - p.y) < LABEL_MIN_Y);
    el.style.display = clash ? 'none' : '';
    if (!clash) kept.push(p);
  }
}

const tyTag = (html, cls, dy) => L.divIcon({
  className: '', iconSize: [96, 30], iconAnchor: [48, dy == null ? -8 : dy],
  html: `<div class="ty-wrap"><div class="ty-lb${cls ? ' ' + cls : ''}">${html}</div></div>`,
});

function drawMap(ty) {
  if (window.__noLeaflet || typeof L === 'undefined' || !ty.pos) { $('#mapWrap').style.display = 'none'; return; }
  $('#mapWrap').style.display = '';
  if (!MAP) {
    MAP = L.map('map', { attributionControl: true, zoomControl: true }).setView([23.7, 121], 5);
    MAP.attributionControl.setPrefix('');
    initBasemaps(MAP);
    MAP.on('zoomend', declutterLabels);
    MAP.on('moveend', declutterLabels);
  }
  if (MLAYER) MAP.removeLayer(MLAYER);
  // 時刻標記是獨立圖層,上面那行清不到它。只把變數設成 null 會讓舊圖層
  // 留在地圖上變成孤兒,每重畫一次多疊一個,所以要真的移除再重掛。
  if (TMARK) { MAP.removeLayer(TMARK); TMARK = null; }
  MLAYER = L.layerGroup().addTo(MAP);
  FCLABELS = []; ANCHORS = [];
  const pts = [[ty.pos.lat, ty.pos.lng]];

  // 彩色底圖（尤其衛星影像）底下什麼顏色都有,細線會被吃掉。
  // 每條路徑先鋪一條深色襯線再畫本體,亮處暗處都看得見。
  const cased = (latlngs, opt) => {
    L.polyline(latlngs, { color: '#08131A', weight: (opt.weight || 2) + 2.5, opacity: .55 }).addTo(MLAYER);
    return L.polyline(latlngs, opt).addTo(MLAYER);
  };

  // ── 臺灣近海界線：海上颱風警報的門檻 ──────────────────────
  // 墊在最底層。暴風圈碰到這條線,就是氣象署發海警的條件。
  const seaKm = Number.isFinite(DB.cfg.seaBuffer) ? DB.cfg.seaBuffer : 100;
  if (seaKm > 0) {
    L.polyline(offshoreRing(seaKm), {
      color: '#54C7EA', weight: 1.4, opacity: .5, dashArray: '3,6',
      fill: false, interactive: false,
    }).addTo(MLAYER);
  }

  // ── 其他同時活動的颱風：琥珀色、輕量、可點選切換 ──────────
  // 先畫,讓選中的那顆疊在最上層。
  // 一併納入 fitBounds:多颱時要能一眼看到全部幾顆在哪裡,
  // 代價是臺灣會縮小一點 —— station 標記仍然畫著,要看細節就點選擇列切換,
  // 切過去之後這顆就變成主要颱風,框選也會跟著收斂。
  (DB.ty.list || []).forEach(o => {
    if (!o || !o.pos || tyKey(o) === tyKey(ty)) return;
    const k = tyKey(o), go = () => pickTyphoon(k);
    if (o.track && o.track.length) {
      L.polyline([[o.pos.lat, o.pos.lng], ...o.track.map(f => [f.pos.lat, f.pos.lng])],
        { color: '#EFAA35', weight: 1.6, dashArray: '5,5', opacity: .75 }).on('click', go).addTo(MLAYER);
      o.track.forEach(f => L.circleMarker([f.pos.lat, f.pos.lng],
        { radius: 2.5, color: '#EFAA35', fillColor: '#B4700B', fillOpacity: 1, weight: 1 }).addTo(MLAYER));
    }
    if (o.r15 > 0) L.circle([o.pos.lat, o.pos.lng], {
      radius: o.r15 * 1000, color: '#EFAA35', weight: 1.4,
      dashArray: '4,4', fillColor: '#EFAA35', fillOpacity: .06,
    }).addTo(MLAYER);
    L.marker([o.pos.lat, o.pos.lng], { icon: tyEye(false), zIndexOffset: 1100 })
      .bindTooltip(`${o.name}　${tcLabel(o.vmax)}（點選切換）`).on('click', go).addTo(MLAYER);
    ANCHORS.push(
      L.marker([o.pos.lat, o.pos.lng], { icon: tyTag(`${esc(o.name)}<br>${fmtShort(o.t0)}`, 'sec'), zIndexOffset: 1090 })
        .on('click', go).addTo(MLAYER));
    pts.push([o.pos.lat, o.pos.lng]);
  });

  // ── 選中的颱風：完整 ────────────────────────────────────
  if (ty.past.length > 1)
    cased(ty.past.map(p => [p.lat, p.lng]), { color: '#A8C6D6', weight: 2 });

  if (TRACK.length) {
    const tp = TRACK.map(f => [f.pos.lat, f.pos.lng]);
    // 外推路徑用另一個顏色與更疏的虛線,一眼就看得出不是官方預報。
    const tcol = EXTRAP ? '#EFAA35' : '#54C7EA';
    cased([[ty.pos.lat, ty.pos.lng], ...tp],
      { color: tcol, weight: 2.5, dashArray: EXTRAP ? '2,7' : '6,5' });
    TRACK.forEach(f => {
      if (f.r70) L.circle([f.pos.lat, f.pos.lng], { radius: f.r70 * 1000, color: tcol, weight: 1.4, fill: false, opacity: .55 }).addTo(MLAYER);
      L.circleMarker([f.pos.lat, f.pos.lng], { radius: 4, color: '#08131A', weight: 1.2, fillColor: tcol, fillOpacity: 1 })
        .bindTooltip(`+${f.tau}h　${bfLabel(ms2bf(f.vmax))}${EXTRAP ? '（外推推估，非官方預報）' : ''}`).addTo(MLAYER);
      // 每個預報點標上時刻與時距 —— 排班的人要的是「幾點」,不是「第幾個點」
      FCLABELS.push(L.marker([f.pos.lat, f.pos.lng], {
        icon: tyTag(`${fmtShort(ty.t0 + f.tau * 3600000)}<br><span style="opacity:.75">+${f.tau}h${EXTRAP ? ' 外推' : ''}</span>`,
                    EXTRAP ? 'ex' : 'fc', -6),
      }).addTo(MLAYER));
      pts.push([f.pos.lat, f.pos.lng]);
    });
  }

  // 沒有暴風圈就不要畫圈 —— 熱帶性低氣壓本來就沒有七級風範圍
  if (ty.r15 > 0) {
    L.circle([ty.pos.lat, ty.pos.lng], {
      radius: ty.r15 * 1000, color: '#EF5B4C', weight: 2,
      fillColor: '#EF5B4C', fillOpacity: .10,
    }).bindTooltip(`七級風半徑 ${ty.r15} km`).addTo(MLAYER);
  }

  L.marker([ty.pos.lat, ty.pos.lng], { icon: tyEye(true), zIndexOffset: 1300 })
    .bindTooltip(`${ty.name}　${tcLabel(ty.vmax)}`).addTo(MLAYER);
  ANCHORS.unshift(L.marker([ty.pos.lat, ty.pos.lng], {
    icon: tyTag(`${esc(ty.name)}<br>${fmtShort(ty.t0)}`, ''), zIndexOffset: 1290,
  }).addTo(MLAYER));

  drawStations(pts);
  /* 切到颱風頁的當下 #map 可能還沒有尺寸（剛從 display:none 出來）,
     這時候 fitBounds 會拿 0×0 去算縮放,結果縮到 zoom 0 ——
     整個世界擠成一團,颱風跟站臺全部疊在畫面中央。
     所以要先 invalidateSize 讓 Leaflet 量到真正的大小,再 fitBounds。 */
  /* 兩種框選：全域（颱風＋站臺一起看得到）與對焦站臺（只框自己的點）。
     颱風還在一千多公里外的時候,全域框出來站臺就是海岸線上的一小撮 ——
     「我的站臺現在長怎樣」那個問題,在那個縮放下根本回答不了。 */
  const fit = MAPFIT = () => {
    const good = pts.filter(p => Number.isFinite(p[0]) && Number.isFinite(p[1]));
    const mine = MYPTS.filter(p => Number.isFinite(p[0]) && Number.isFinite(p[1]));
    const use = (MAPFOCUS === 'tw' && mine.length) ? mine : good;
    if (use.length > 1) MAP.fitBounds(L.latLngBounds(use).pad(0.28));
    else if (use.length === 1) MAP.setView(use[0], 10);
  };
  const seg = $('#mapFocus');
  if (seg) {
    seg.style.display = MYPTS.length ? '' : 'none';
    $$('#mapFocus button').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.mf === MAPFOCUS)));
  }
  MAP.invalidateSize();
  fit();
  drawTimeMarker();                  // 主圖重畫後把時刻標記掛回去
  declutterLabels();
  // 版面若還在收斂（字級切換、旋轉螢幕）,晚一拍再量一次並重新框。
  setTimeout(() => { MAP.invalidateSize(); fit(); declutterLabels(); }, 80);
}

/* ═══ 回報產出 ═══════════════════════════════════════════ */
const CN = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
function repLine(s, opt) {
  let t = `${s.name}於${fmtHM(s.at)}${S_VERB[s.status]}（${fmtMD(s.at)}）`;
  if (opt.hum && s.hum != null && s.status !== 'on') t += `（濕度${s.hum}%）`;
  return t + '。';
}
function blk(title, items, opt) {
  return { title, body: items.length ? items.map((x, i) => `${i + 1}.${x}`).join('\n') : (opt.empty ? '1.無。' : ''), n: items.length };
}
function joinBlocks(bs, opt) {
  let i = 0;
  return bs.filter(b => b.n > 0 || b.body || opt.empty)
    .map(b => `${CN[i++]}、${b.title}${b.body ? '\n' + b.body : ''}`).join('\n');
}
function generate() {
  const opt = { hum: tglOn('#optHum'), empty: tglOn('#optEmpty') };
  const c = DB.cfg;
  const head = tglOn('#optHead') && c.unit ? `${c.unit}報告：\n` : '';
  const since = DB.since || 0;
  /* 回報稿裡每個區塊都由北至南列。原本是照狀態變更時間排,
     但通報是給人照地理位置對照的,時間順序在紙上看不出任何意義。
     沒填座標的排在最後,同緯度或都沒座標時才回到時間先後。 */
  const nsAt = (a, b) => (Number.isFinite(b.lat) ? b.lat : -1e3) - (Number.isFinite(a.lat) ? a.lat : -1e3)
    || a.at - b.at;
  /* 標成「不列入回報」的類別整個不進交接通報（中繼站臺是自用監看）。
     它們仍然出現在站臺頁、衝擊表與播報 —— 值班的人自己要看,只是不對外發。 */
  const rTypes = DB.types.filter(t => !t.noReport);
  const inType = id => DB.stations.filter(s => s.type === id && IS_LIVE(s)).sort(nsAt);
  const back = DB.stations.filter(s => s.status === 'on' && s.at >= since && inReport(s)).sort(nsAt);
  const bs = [];
  let txt = '';

  if (DB.tpl === 'A') {
    const intro = (c.introA || '').replace('{颱風}', DB.ty.name || '（颱風名稱）');
    rTypes.forEach(t => {
      const items = inType(t.id).filter(s => s.status !== 'on')
        .sort((a, b) => (a.status === 'standby') - (b.status === 'standby') || nsAt(a, b))
        .map(s => repLine(s, opt));
      if (items.length || opt.empty) bs.push(blk(`${t.report}${items.length}處：`, items, opt));
    });
    bs.push(blk(`已復機站臺${back.length}處：`, back.map(s => repLine(s, opt)), opt));
    bs.push({ title: c.endA, body: '', n: 1 });
    txt = head + intro + '\n' + joinBlocks(bs, opt);
  } else {
    rTypes.forEach(t => {
      const off = inType(t.id).filter(s => s.status === 'off');
      if (off.length) bs.push(blk(`尚未開機${t.report}計${off.length}處：`, off.map(s => repLine(s, opt)), opt));
    });
    if (!bs.length && opt.empty) bs.push(blk('尚未開機站臺計0處：', [], opt));
    bs.push(blk(`已復機站臺${back.length}處：`, back.map(s => repLine(s, opt)), opt));
    const sb = DB.stations.filter(s => s.status === 'standby' && inReport(s)).sort(nsAt);
    if (sb.length || opt.empty) bs.push(blk(`待機站臺計${sb.length}處：`, sb.map(s => repLine(s, opt)), opt));
    bs.push({ title: c.endB, body: '', n: 1 });
    txt = head + joinBlocks(bs, opt);
  }
  $('#out').value = txt;
}

/* ── 反向彙整：把既有回報文字解析回站臺資料 ─────────────
   兩段式：先 parseReport 產生比對結果供預覽，確認後才 applyReport 寫入。
   直接覆蓋會在貼錯內容時把整個管制盤蓋掉，所以中間一定要有確認關卡。 */
const HDR_RE = /^\s*[一二三四五六七八九十]\s*[、.．]\s*(.+?)(?:計)?\s*\d*\s*處/;
const ITEM_RE = /^\s*\d+\s*[.、．]\s*(.+?)\s*於\s*(\d{1,4})\s*時\s*(完成關機|實施關機|完成開機|實施開機|完成復機|實施待機|完成待機)\s*[（(]?\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/;

function parseReport(text) {
  const lines = String(text).split(/\r?\n/);
  const Y = new Date().getFullYear();
  let curType = DB.types[0] ? DB.types[0].id : '';
  let typeSure = true;
  const raw_rows = [];
  let skipped = 0, seenItem = false;

  for (const raw of lines) {
    const L = raw.trim();
    if (!L) continue;

    const h = L.match(HDR_RE);
    if (h) {
      const title = h[1].replace(/^(本分署|本單位|尚未開機|已復機|目前)+/g, '');
      const t = DB.types.find(x =>
        title.includes(x.report) || title.includes(x.label) ||
        x.report.includes(title) || x.label.includes(title));
      // 「已復機站臺」「待機站臺」這類區塊沒有指明設備類別，沿用上一個區塊，
      // 但標記為不確定，之後同名合併時以有指明類別的那筆為準。
      typeSure = !!t;
      if (t) curType = t.id;
      continue;
    }

    const m = L.match(ITEM_RE);
    if (!m) { if (/^\s*\d+\s*[.、．]\s*\S+\s*於/.test(L) || /於\s*\d{1,4}\s*時/.test(L)) skipped++; continue; }
    seenItem = true;

    const name = m[1].replace(/^\d+\s*[.、．]\s*/, '').replace(/\s+/g, '').trim();
    if (!name) continue;
    const hhmm = m[2];
    const hh = hhmm.length <= 2 ? +hhmm : +hhmm.slice(0, hhmm.length - 2);
    const mi = hhmm.length <= 2 ? 0 : +hhmm.slice(-2);
    if (hh > 23 || mi > 59) { skipped++; continue; }
    const status = /開機|復機/.test(m[3]) ? 'on' : /待機/.test(m[3]) ? 'standby' : 'off';
    const at = new Date(Y, +m[4] - 1, +m[5], hh, mi).getTime();
    const humM = L.match(/濕度\s*(\d{1,3})\s*%/);
    const hum = humM ? clamp(+humM[1], 0, 100) : null;

    raw_rows.push({ name, type: curType, typeSure, status, at, hum });
  }

  // 同一份文字裡同名站臺可能出現兩次（例如先列關機、後列已復機）。
  // 直接照單全收會建出重複站臺，因此以名稱合併：狀態時間取最新的一筆，
  // 類別取「區塊標題有明確指出類別」的那一筆。
  const byName = new Map();
  let merged = 0;
  for (const r of raw_rows) {
    const p = byName.get(r.name);
    if (!p) { byName.set(r.name, r); continue; }
    merged++;
    const keepType = p.typeSure ? p.type : (r.typeSure ? r.type : p.type);
    const newer = r.at >= p.at ? r : p;
    byName.set(r.name, { ...newer, type: keepType, typeSure: p.typeSure || r.typeSure });
  }

  const rows = [];
  for (const r of byName.values()) {
    const ex = DB.stations.find(s => s.name === r.name);
    const same = ex && ex.status === r.status && ex.at === r.at && (ex.hum ?? null) === r.hum;
    rows.push({
      name: r.name, type: ex ? ex.type : r.type, status: r.status, at: r.at, hum: r.hum,
      kind: !ex ? 'new' : same ? 'same' : 'update',
      exId: ex ? ex.id : null,
      from: ex ? { status: ex.status, at: ex.at } : null,
      typeSure: r.typeSure || !!ex,
    });
  }
  rows.sort((a, b) => a.at - b.at);
  return { rows, skipped, seenItem, merged };
}

function applyReport(rows) {
  let added = 0, updated = 0;
  for (const r of rows) {
    if (r.kind === 'same') continue;
    if (r.exId) {
      const s = DB.stations.find(x => x.id === r.exId);
      if (!s) continue;
      if (s.status !== r.status) DB.log.push({ t: Date.now(), name: s.name, from: s.status, to: r.status, at: r.at });
      s.status = r.status; s.at = r.at; s.hum = r.hum; updated++;
    } else {
      DB.stations.push({ id: uid(), name: r.name, type: r.type, status: r.status, at: r.at, hum: r.hum, note: '', lat: null, lng: null });
      DB.log.push({ t: Date.now(), name: r.name, from: null, to: r.status, at: r.at });
      added++;
    }
  }
  save(); rebuildModel(); renderStations(); generate();
  toast(`已套用：新增 ${added} 站、更新 ${updated} 站`);
  go('eq');
}

function openImportPreview(text) {
  const { rows, skipped, merged } = parseReport(text);
  if (!rows.length) {
    openSheet('解析結果', `<div class="msg e">沒有解析到任何站臺。</div>
      <p class="hint">可辨識的句型是：<code>1.○○雷達站於1310時完成關機（7月10日）。</code><br><br>
      動詞支援完成關機、實施關機、完成開機、完成復機、實施待機、完成待機；
      時間可寫 <code>15時</code> 或 <code>1310時</code>；濕度寫在同一行的
      <code>（濕度87%）</code> 也會一併帶入。區塊標題如
      <code>一、岸際雷達11處：</code> 用來判斷新站臺歸到哪個類別。</p>`);
    return;
  }
  const KIND = {
    new: ['新增', 'var(--ok)'], update: ['更新', 'var(--sb)'], same: ['無變更', 'var(--fg4)'],
  };
  const n = { new: 0, update: 0, same: 0 };
  rows.forEach(r => n[r.kind]++);

  openSheet('確認要套用的內容', `
    <div class="stat" style="margin-bottom:0.75rem">
      <div class="v-on"><b>${n.new}</b><small>新增站臺</small></div>
      <div class="v-sb"><b>${n.update}</b><small>狀態更新</small></div>
      <div><b style="color:var(--fg4)">${n.same}</b><small>無變更</small></div>
    </div>
    ${skipped ? `<div class="msg w">有 ${skipped} 行看起來像站臺紀錄但格式不合，已略過。請比對下表確認沒有漏掉。</div>` : ''}
    ${merged ? `<div class="msg i">有 ${merged} 個站臺在這份文字裡出現超過一次（例如先列關機、後列已復機），已合併為最新的一筆狀態。</div>` : ''}
    ${rows.some(r => r.kind === 'new' && !r.typeSure) ? `<div class="msg w">部分新站臺所在的區塊沒有指明設備類別，已暫時歸到最接近的類別，套用後請確認下表的類別欄。</div>` : ''}
    <div class="card" style="padding:0.25rem 0.625rem;margin-bottom:0.75rem;max-height:46vh;overflow-y:auto">
      <table class="impact"><tr><th>站臺</th><th>類別</th><th>解析結果</th><th>異動</th></tr>
      ${rows.map(r => `<tr>
        <td class="nm">${esc(r.name)}</td>
        <td style="font-size:0.7188rem;color:${r.typeSure ? 'var(--fg3)' : 'var(--sb)'}">${esc(typeOf(r.type).label)}${r.typeSure ? '' : ' ?'}</td>
        <td>${fmtMD(r.at)} ${fmtHM(r.at)}<br>
            <span style="font-size:0.7188rem;color:var(--fg3)">${S_VERB[r.status]}${r.hum != null ? `　濕度${r.hum}%` : ''}</span></td>
        <td style="color:${KIND[r.kind][1]};font-size:0.75rem">${KIND[r.kind][0]}

function tglOn(sel) { return $(sel).getAttribute('aria-pressed') === 'true'; }
function bindToggle(sel, get, set) {
  const el = $(sel);
  el.setAttribute('aria-pressed', String(!!get()));
  el.onclick = () => {
    const v = el.getAttribute('aria-pressed') !== 'true';
    el.setAttribute('aria-pressed', String(v)); set(v);
  };
}

/* ── 底部彈出面板 ────────────────────────────────────── */
function openSheet(title, html, mount) {
  $('#shTitle').textContent = title;
  $('#shBody').innerHTML = html;
  $('#sheet').classList.add('on');
  document.body.style.overflow = 'hidden';
  if (mount) mount();
}
function closeSheet() { $('#sheet').classList.remove('on'); document.body.style.overflow = ''; }
$('#shClose').onclick = closeSheet;
$('.sheet-bg').onclick = closeSheet;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* ── 站臺編輯 ────────────────────────────────────────── */
function openStation(id) {
  const s = id ? DB.stations.find(x => x.id === id) : null;
  const opts = DB.types.map(t => `<option value="${t.id}" ${s && s.type === t.id ? 'selected' : ''}>${esc(t.label)}</option>`).join('');
  openSheet(s ? '編輯站臺' : '新增站臺', `
    <label class="fld"><span class="lb">回報名稱</span>
      <input type="text" id="f_name" value="${esc(s ? s.name : '')}" placeholder="例：○○雷達站">
      <span class="sub">產出回報文字時會原字照用，請填成正式回報要出現的寫法。</span></label>
    <div class="two">
      <label class="fld"><span class="lb">類別</span><select id="f_type">${opts}</select></label>
      <label class="fld"><span class="lb">狀態</span><select id="f_status">
        ${['on', 'standby', 'off', 'plan'].map(k => `<option value="${k}" ${s && s.status === k ? 'selected' : ''}>${S_LABEL[k]}</option>`).join('')}
      </select></label></div>
    <label class="fld"><span class="lb">狀態變更時間</span>
      <input type="datetime-local" id="f_at" value="${toInput(s ? s.at : Date.now())}"></label>
    <label class="fld"><span class="lb">座標　萬用輸入</span>
      <input type="text" id="f_ll" value="${s && Number.isFinite(s.lat) ? `${s.lat}, ${s.lng}` : ''}"
        placeholder="24.2534, 120.5123　或　24°15'12&quot;N 120°30'44&quot;E">
      <span class="sub" id="f_llout">度分秒、十進位、海圖式 2415.20N 12030.50E、N24 15.2 E120 30.5 都能辨識，經緯寫反會自動修正。填了才能推算該站風級與關機時機。</span></label>
    <div class="btnrow" style="margin:-4px 0 0.875rem">
      <button class="btn sm" id="f_gps">用目前位置</button>
      <button class="btn sm" id="f_clr">清除座標</button></div>
    <div class="two">
      <label class="fld"><span class="lb">現場濕度 %</span>
        <input type="number" id="f_hum" min="0" max="100" value="${s && s.hum != null ? s.hum : ''}" placeholder="未量測"></label>
      <label class="fld"><span class="lb">備註</span>
        <input type="text" id="f_note" value="${esc(s ? s.note : '')}" placeholder="選填"></label></div>
    ${s ? (() => {
      const c = s.cal || {};
      const dirs = (c.dir || []).map((d, i) => d && d.n ? `${OCT_NAME[i]} ×${d.k.toFixed(2)}（${d.n}）` : '')
        .filter(Boolean).join('、');
      return `<label class="fld"><span class="lb">地形校正</span>
        <input type="text" id="f_cal" value="${Number.isFinite(s.calManual) ? s.calManual : ''}"
          inputmode="decimal" placeholder="${c.n >= CAL_MIN_N ? `自動 ×${c.k.toFixed(2)}` : '自動（樣本不足，暫不校正）'}">
        <span class="sub">推估風力會乘上這個係數。程式會拿這個站附近 ${CAL_MAX_KM} km 內測站的實測
          跟推估相比，自動累積出係數${c.n ? `——目前 <b>${c.n}</b> 筆，整體 ×${c.k.toFixed(2)}${
            c.src ? `（最近取 ${esc(c.src)} ${c.km} km）` : ''}` : '，目前還沒有樣本'}。
          ${dirs ? `各方位：${dirs}。` : ''}
          填數字可手動覆寫（${CAL_LO}–${CAL_HI}），留空則用自動值。</span></label>
      <div class="sw" style="margin-bottom:0.875rem"><div class="sw-t"><b>停用校正</b>
        <small>只用原始模型值，不做任何修正</small></div>
        <button class="tgl" id="f_caloff" aria-pressed="${!!s.calOff}"></button></div>
      ${c.n ? `<div class="btnrow" style="margin:-0.5rem 0 0.875rem">
        <button class="btn sm" id="f_calreset">清除已學到的係數</button></div>` : ''}`;
    })() : ''}
    <label class="fld"><span class="lb">停班停課雨量基準</span>
      <select id="f_terr">
        <option value="">依類別（${s ? TERRAIN[terrainOf(s)].thr : DGPA_FLAT} mm）</option>
        ${Object.entries(TERRAIN).map(([k, v]) =>
          `<option value="${k}" ${s && s.terrain === k ? 'selected' : ''}>${v.thr} mm（${v.label}）</option>`).join('')}
      </select>
      <span class="sub">同一種設備架在山上還是海邊是位置的事，這裡可以覆寫類別的設定。
      實際比對時會依該站所在縣市查第四條附表。</span></label>
    <div class="btnrow">
      <button class="btn pri" id="f_save">儲存</button>
      ${s ? '<button class="btn dg" id="f_del">刪除</button>' : ''}</div>`,
    () => {
      const out = $('#f_llout');
      const show = () => {
        const v = $('#f_ll').value.trim();
        if (!v) { out.textContent = '未填座標時，該站不會出現在風力推估與衝擊預判中。'; out.style.color = ''; return; }
        const c = parseCoord(v);
        if (c) { out.textContent = `辨識為 ${fmtCoord(c.lat, c.lng)}　（${c.lat.toFixed(5)}, ${c.lng.toFixed(5)}）`; out.style.color = 'var(--acc)'; }
        else { out.textContent = '無法辨識這組座標，請確認格式。'; out.style.color = 'var(--no)'; }
      };
      $('#f_ll').addEventListener('input', show); show();
      $('#f_clr').onclick = () => { $('#f_ll').value = ''; show(); };
      $('#f_gps').onclick = () => {
        if (!navigator.geolocation) return toast('此裝置不支援定位');
        toast('定位中…');
        navigator.geolocation.getCurrentPosition(
          p => { $('#f_ll').value = `${p.coords.latitude.toFixed(6)}, ${p.coords.longitude.toFixed(6)}`; show(); },
          () => toast('取得定位失敗，請確認已允許定位權限'), { enableHighAccuracy: true, timeout: 10000 });
      };
      if (s) {
        const off = $('#f_caloff');
        if (off) off.onclick = () => {
          s.calOff = off.getAttribute('aria-pressed') !== 'true';
          off.setAttribute('aria-pressed', String(s.calOff));
          save(); rebuildModel(); renderStations(); renderTyphoon({});
        };
        const rst = $('#f_calreset');
        if (rst) rst.onclick = () => {
          s.cal = { k: 1, n: 0, at: 0, dir: [] };
          save(); rebuildModel(); renderStations(); renderTyphoon({}); closeSheet();
          toast('已清除該站的校正係數');
        };
      }
      $('#f_save').onclick = () => {
        const name = $('#f_name').value.trim();
        if (!name) return toast('請填站臺名稱');
        const llv = $('#f_ll').value.trim();
        const c = llv ? parseCoord(llv) : null;
        if (llv && !c) return toast('座標格式無法辨識，請修正或清空');
        const humv = $('#f_hum').value.trim();
        const d = {
          name, type: $('#f_type').value, status: $('#f_status').value,
          at: fromInput($('#f_at').value),
          lat: c ? c.lat : null, lng: c ? c.lng : null,
          hum: humv === '' ? null : clamp(+humv, 0, 100),
          note: $('#f_note').value.trim(),
          terrain: $('#f_terr').value || null,
        };
        const calIn = $('#f_cal');
        if (calIn) {
          const v = parseFloat(calIn.value);
          d.calManual = Number.isFinite(v) && v > 0 ? clamp(v, CAL_LO, CAL_HI) : null;
        }
        /* mt＝最後一次被人改動的時刻。跟 at（「從什麼時候開始是這個狀態」）
           不是同一件事:改座標、改名字不會動到 at,但那確實是一次修改。
           團隊同步要靠 mt 決定誰比較新 —— 只看 at 的話,對方補上的經緯度
           永遠傳不過來。 */
        d.mt = Date.now();
        if (s) { if (s.status !== d.status) DB.log.push({ t: Date.now(), name, from: s.status, to: d.status, at: d.at }); Object.assign(s, d); }
        else { DB.stations.push(Object.assign({ id: uid() }, d)); DB.log.push({ t: Date.now(), name, from: null, to: d.status, at: d.at }); }
        save(); rebuildModel(); renderStations(); renderTyphoon({}); renderSettings(); closeSheet(); toast('已儲存');
      };
      if (s) $('#f_del').onclick = () => {
        if (!confirm(`刪除「${s.name}」？無法復原。`)) return;
        DB.stations = DB.stations.filter(x => x.id !== s.id);
        save(); renderStations(); renderSettings(); closeSheet(); toast('已刪除');
      };
    });
}

/* ── 設定頁清單的排序 ────────────────────────────────────
   站臺頁的排序（DB.cfg.sort）是給值班掃狀態用的,會用到風級、離颱風遠近;
   設定頁的清單是用來「找到某一站去改它」,要的只有地理位置與名字。
   兩個分開存,互不影響。 */
const LIST_SORT = { ns: '由北至南', name: '名稱', type: '類別', custom: '自訂順序' };
const listSortKey = () => (LIST_SORT[DB.cfg.listSort] ? DB.cfg.listSort : 'ns');
function sortForList(list) {
  const k = listSortKey();
  const arr = list.slice();
  if (k === 'custom') return arr;
  const ti = id => DB.types.findIndex(t => t.id === id);
  const byName = (a, b) => String(a.name).localeCompare(String(b.name), 'zh-Hant');
  const byNs = (a, b) =>
    (Number.isFinite(b.lat) ? b.lat : -1e3) - (Number.isFinite(a.lat) ? a.lat : -1e3) || byName(a, b);
  if (k === 'name') return arr.sort(byName);
  if (k === 'type') return arr.sort((a, b) => (ti(a.type) - ti(b.type)) || byNs(a, b));
  return arr.sort(byNs);
}

/* ── 排序 ────────────────────────────────────────────── */
function openSort() {
  openSheet('站臺排序', Object.entries(SORT_LABEL).map(([k, v]) =>
    `<button class="btn wide" data-sort="${k}" style="margin-bottom:0.5rem;justify-content:flex-start;
      ${DB.cfg.sort === k ? 'border-color:var(--acc);color:var(--acc);background:var(--acc-d)' : ''}">${v}</button>`).join('') +
    '<p class="hint">預設為「由北至南」，依站臺座標的緯度排列，'
    + '未填座標的排在最後。選「自訂順序」時，每張站臺卡右側會出現上下箭頭，'
    + '可自行調整成與回報稿相同的順序。</p>',
    () => {
      $('#shBody').addEventListener('click', e => {
        const b = e.target.closest('[data-sort]'); if (!b) return;
        DB.cfg.sort = b.dataset.sort; save(); renderStations(); closeSheet();
      });
    });
}

      </select>
      <span class="sub">目前為 <b>${TERRAIN[t.terrain === 'hill' ? 'hill' : 'flat'].thr} mm</b>。
        依《天然災害停止上班及上課作業辦法》第四條附表，門檻是「平地／山區」而不是一個固定數字——
        多數縣市平地與山區都是 ${DGPA_FLAT} mm，只有部分縣市山區是 ${DGPA_HILL} mm，連江縣兩者都是 200 mm。
        實際比對時會依該站所在縣市查表。個別站臺可在該站「編輯」裡覆寫。</span></label>
    <div class="sw" style="margin-bottom:0.5rem"><div class="sw-t"><b>列入回報稿</b>
      <small>${t.noReport ? '目前不列入。自用監看，不進交接通報' : '目前列入交接通報'}</small></div>
      <button class="tgl" data-t="${t.id}" data-k="noReport" aria-pressed="${!t.noReport}"></button></div>
    <button class="btn sm dg" data-del="${t.id}">刪除此類別</button></div>`).join('');
  openSheet('設備類別', rows + `
    <div class="btnrow"><button class="btn pri wide" id="t_add">新增類別</button></div>
    <p class="hint" style="margin-top:0.75rem">類別完全由您自訂，程式不預設任何實際設備名稱。刪除類別前，請先把該類別下的站臺改到其他類別。
    關掉「列入回報稿」的類別，仍會出現在站臺頁、衝擊預判與播報，只是不進交接通報。</p>`,
    () => {
      $('#shBody').addEventListener('change', e => {
        const el = e.target.closest('select[data-t]'); if (!el) return;
        const t = DB.types.find(x => x.id === el.dataset.t); if (!t) return;
        t[el.dataset.k] = el.value; save(); renderStations(); renderTyphoon({}); generate();
      });
      $('#shBody').addEventListener('input', e => {
        const el = e.target.closest('input[data-t]'); if (!el) return;
        const t = DB.types.find(x => x.id === el.dataset.t); if (!t) return;
        t[el.dataset.k] = el.value; save();
      });
      $('#shBody').addEventListener('click', e => {
        const g = e.target.closest('button.tgl[data-t]');
        if (g) {
          const t = DB.types.find(x => x.id === g.dataset.t);
          if (t) { t.noReport = !t.noReport; save(); openTypes(); renderStations(); generate(); }
          return;
        }
        const d = e.target.closest('[data-del]');
        if (d) {
          const used = DB.stations.filter(s => s.type === d.dataset.del).length;
          if (used) return toast(`還有 ${used} 個站臺屬於此類別，請先改到其他類別`);
          if (DB.types.length <= 1) return toast('至少需保留一個類別');
          DB.types = DB.types.filter(x => x.id !== d.dataset.del); save(); openTypes(); renderStations();
        }
      });
      $('#t_add').onclick = () => {
        DB.types.push({ id: uid(), label: '新類別', report: '新類別', terrain: 'flat', noReport: false });
        save(); openTypes(); renderStations();
      };
    });
}

  <div class="sec"><h2>停班停課來源</h2></div>

      <input type="text" id="c_dgpaProxy" value="${esc(c.dgpaProxy === undefined ? DGPA_PROXY_DEFAULT : (c.dgpaProxy || ''))}"

      <span class="sub">資料取自
        <a href="${DGPA_URL}" target="_blank" rel="noopener">人事行政總處「天然災害停止上班及上課情形」</a>。
        那一頁沒有 CORS 標頭，瀏覽器直連一定被擋，所以要透過代理把 HTML 取回來再自己重排。
        程式會把官方網址接在這個網址後面（已做 URL 編碼）。
        <b>預設用的是公開的轉發 Worker，不經手任何憑證</b>；不想走第三方就換成自己的，或清空。</span></label>
    <label class="fld" style="margin-bottom:0.5rem"><span class="lb">自訂來源（選填，會蓋過上面）</span>

      <span class="sub">填了就直接抓這個網址。回應是官方那張表的 HTML 會照上面的規則解析；

    <div class="btnrow">
      <a class="btn sm" href="${DGPA_URL}" target="_blank" rel="noopener" style="text-decoration:none">官方公告頁 ↗</a>
      <button class="btn sm" onclick="fetchDgpa(true)">立即取得</button>
    </div>
  </div>

  <div class="sec"><h2>閃電（落雷）</h2></div>
  <div class="card pad" style="margin-bottom:1.125rem">
    <label class="fld" style="margin-bottom:0.5rem"><span class="lb">資料集代號</span>
      <input type="text" id="c_ltnSet" value="${esc(c.ltnSet === undefined ? LTN_DEFAULT : (c.ltnSet || ''))}"
        placeholder="留空則不抓" autocomplete="off" spellcheck="false"></label>
    <label class="fld" style="margin-bottom:0.5rem"><span class="lb">計入半徑（公里）</span>
      <input type="number" id="c_ltnKm" min="1" max="100" step="1" value="${ltnRadius()}">
      <span class="sub">站臺周圍多少公里內的落雷要算進來。預設 15 公里。</span></label>
    <label class="fld" style="margin-bottom:0.5rem"><span class="lb">自訂網址（選填，會優先使用）</span>
      <input type="text" id="c_ltnUrl" value="${esc(c.ltnUrl || '')}"
        placeholder="https://…　可用 {DS} 代表代號、{KEY} 代表授權碼"
        autocomplete="off" spellcheck="false"></label>
    <span class="sub"><code>O-A0039-001</code> 是<b>過去 1 小時閃電偵測資料</b>，
      一筆一個落雷點，有經緯度、時間，以及<b>雲對地／雲間</b>的分別。
      <b>只有雲對地會打到地面設備</b>，程式分開計算——官方樣本裡 124 筆中有 91 筆是雲間，
      加在一起會把數字灌水一倍以上。<br><br>
      <b>這支資料集官方是以 KML／KMZ 發布的，不是一般的 JSON 資料集。</b>
      程式會<b>依序試</b>：自訂網址 →
      <code>fileapi</code> 的 KML → <code>datastore</code> 的 JSON；每一個都先直連，
      直連被擋就改走上面「停班停課來源」的<b>通用網址代理</b>。
      全部失敗時會列出<b>試過哪些、各自失敗在哪裡</b>——
      看到之後可以把正確的網址直接貼在上面這一格。<br>
      JSON 與 KML 兩種格式都接；拿到 KMZ（壓縮檔）會直接講出來，
      瀏覽器沒有函式庫解不開壓縮檔。</span>
    <div class="btnrow"><button class="btn sm" onclick="loadTyphoon(true)">立即取得</button></div>
  </div>

  <div class="sec"><h2>天氣預報來源</h2></div>
  <div class="card pad" style="margin-bottom:1.125rem">
    <label class="fld" style="margin-bottom:0.5rem"><span class="lb">逐 3 小時（未來 2 天）資料集代號</span>
      <input type="text" id="c_wx3h" value="${esc(c.wx3h === undefined ? WX_3H_DEFAULT : (c.wx3h || ''))}"
        placeholder="留空則不抓這一支" autocomplete="off" spellcheck="false"></label>
    <label class="fld" style="margin-bottom:0.5rem"><span class="lb">未來 1 週資料集代號</span>
      <input type="text" id="c_wxWk" value="${esc(c.wxWk === undefined ? WX_WK_DEFAULT : (c.wxWk || ''))}"
        placeholder="留空則不抓這一支" autocomplete="off" spellcheck="false"></label>
    <span class="sub">兩支都走上面那把<b>中央氣象署授權碼</b>。
      <b>最細就是 3 小時一格</b>，官方沒有逐小時的降雨預報，所以本程式不做內插——
      把 3 小時的「天氣現象」硬切成 1 小時就是編造。
      要看更近的降雨，請用實況頁的雷達回波。
      抓不到時卡片會直接寫是哪一支代號失敗，改這裡即可。</span>
    <div class="btnrow"><button class="btn sm" onclick="loadTyphoon(true)">立即取得</button></div>
  </div>

  <div class="sec"><h2>設備與站臺</h2></div>
  <div class="card pad" style="margin-bottom:1.125rem">
    <div class="sw"><div class="sw-t"><b>設備類別</b><small>目前 ${DB.types.length} 類，可自行新增或改名</small></div>
      <button class="btn sm" onclick="openTypes()">管理</button></div>
    <div class="sw"><div class="sw-t"><b>站臺清單</b>
      <small>共 ${DB.stations.length} 站，其中 ${DB.stations.filter(s => Number.isFinite(s.lat)).length} 站已填座標</small></div>
      <button class="btn sm" onclick="openStation(null)">新增</button></div>
    ${DB.stations.length ? `
    <div class="seg" id="listSortSeg" style="margin-top:0.625rem">
      ${Object.entries(LIST_SORT).map(([k, v]) =>
        `<button type="button" data-ls="${k}" aria-pressed="${listSortKey() === k}">${v}</button>`).join('')}
    </div>
    <div style="margin-top:0.5rem">${sortForList(DB.stations).map(s =>
      `<button class="btn sm wide" style="justify-content:space-between;margin-bottom:0.375rem" onclick="openStation('${s.id}')">
        <span>${esc(s.name)}<em style="font-style:normal;font-size:0.6875rem;color:var(--fg4);margin-left:0.375rem">${
          esc(typeOf(s.type).label)}${s.status === 'plan' ? '　未建置' : ''}</em></span>
        <span class="mono" style="color:${Number.isFinite(s.lat) ? 'var(--acc)' : 'var(--fg4)'};font-size:0.7188rem">
          ${Number.isFinite(s.lat) ? fmtCoord(s.lat, s.lng) : '未設座標'}</span></button>`).join('')}</div>` : ''}
  </div>

  <div class="sec"><h2>團隊共用</h2></div>
  <div class="card pad" style="margin-bottom:1.125rem">
    ${DB.team ? `
      <div style="display:flex;align-items:baseline;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.5rem">
        <b style="font-size:1.0625rem">${esc(DB.team.name)}</b>
        <span class="mono" style="font-size:0.6875rem;color:var(--fg4)">加入於 ${fmtShort(DB.team.at)}</span>
      </div>
      <label class="fld" style="margin-bottom:0.5rem"><span class="lb">這台裝置在團隊裡的名稱</span>
        <input type="text" id="c_meName" value="${esc(DB.me.name || '')}"
          placeholder="${esc(DB.cfg.unit || '例：值班台一')}" maxlength="20" autocomplete="off">
        <span class="sub">會寫在你送出的同步包裡，讓對方知道是誰傳的。留空就用單位名稱。</span></label>
      <div class="btnrow">
        <button class="btn pri" onclick="exportSyncPack()">匯出同步包</button>
        <button class="btn" id="c_imp2">匯入檔案</button>
      </div>
      <div class="btnrow" style="margin-top:0.375rem">
        <button class="btn sm" onclick="exportInvite()">匯出邀請檔</button>
        <button class="btn sm dg" onclick="leaveTeam()">離開團隊</button>
      </div>
      ${DB.peers.length ? `<div style="margin-top:0.75rem">
        <div class="mono" style="font-size:0.6875rem;color:var(--fg4);margin-bottom:0.25rem">成員</div>
        ${DB.peers.map(p => `<div style="display:flex;align-items:center;gap:0.5rem;
          padding:0.4375rem 0;border-top:1px solid var(--edge)">
          <span style="flex:1;min-width:0">
            <b style="color:${p.blocked ? 'var(--fg4)' : 'var(--fg)'}">${esc(p.name)}</b>
            <span class="mono" style="font-size:0.6875rem;color:var(--fg4);display:block">${
              p.blocked ? '已解綁，拒收同步包'
                : p.lastRecv ? '最後收到 ' + fmtShort(p.lastRecv) : '尚未收過同步包'}</span></span>
          ${p.blocked
            ? `<button class="btn sm" onclick="rebindPeer('${esc(p.id)}')">恢復</button>`
            : `<button class="btn sm" onclick="unbindPeer('${esc(p.id)}')">解綁</button>`}
          <button class="btn sm" onclick="forgetPeer('${esc(p.id)}')">移除</button>
        </div>`).join('')}</div>` : `<p class="hint" style="margin-top:0.5rem">
          還沒有任何成員。把「邀請檔」傳給對方，他匯入之後再回傳一份同步包，就會出現在這裡。</p>`}
    ` : `
      <label class="fld" style="margin-bottom:0.5rem"><span class="lb">建立團隊</span>
        <input type="text" id="c_teamName" placeholder="例：北區值班" maxlength="20" autocomplete="off">
        <span class="sub">建立之後匯出「邀請檔」傳給對方；對方匯入就綁定了。</span></label>
      <div class="btnrow">
        <button class="btn pri" id="c_teamNew">建立團隊</button>
        <button class="btn" id="c_imp3">匯入邀請檔</button>
      </div>
    `}
    <details style="margin-top:0.625rem">
      <summary style="cursor:pointer;font-size:0.8125rem;color:var(--acc);padding:0.25rem 0">
        這是怎麼運作的　·　點開</summary>
      <p class="hint" style="margin:0.375rem 0">
        <b>先講做不到的：真正的即時點對點，這支程式做不到。</b>
        WebRTC 要先交換連線資訊才連得起來，那需要一台雙方都連得到的伺服器。
        手動貼一次是可以連上，但下一次還要再貼一次——對值班台來說比不做還糟。
        這支程式是靜態網頁，沒有後端。<br><br>
        <b>實際的做法是「配對檔＋同步包」：</b>
        一方建立團隊、匯出<b>邀請檔</b>，用你們本來就在用的管道傳過去（LINE、AirDrop、電子郵件都行），
        對方匯入就綁定。之後任何一方匯出<b>同步包</b>，對方匯入就把站臺狀態併進來。
        <b>不需要兩邊同時在線</b>，不怕 NAT，離線也能事後補。<br><br>
        <b>合併規則</b>：依站臺名稱比對，<b>誰的比較新誰生效</b>（比的是最後修改時間）。
        <b>絕不刪除站臺</b>——一份三天前的同步包如果能刪站，匯入一次就會把新加的全部抹掉。
        套用之前一定會先列出「新增幾站、更新哪幾站」讓你確認。<br><br>
        <b>同步包不含授權碼、開啟密碼與來源網址</b>，那是這台裝置的東西。<br><br>
        <b>簽章與安全</b>：同步包用團隊金鑰做 HMAC-SHA256 簽章，所以別人隨手丟一個檔案進來
        <b>不會</b>默默改掉你的狀態。但<b>金鑰就在邀請檔裡</b>——邀請檔傳得多安全，這件事就有多安全。
        它是共用密鑰，不是公鑰。<br><br>
        <b>解綁</b>：把某個成員設為拒收，之後他的同步包一律不套用。已經併進來的資料不會被移除
        （那是既成的資料，刪掉才是真的危險）。</p>
    </details>
  </div>

  <div class="sec"><h2>資料與安全</h2></div>
  <div class="card pad" style="margin-bottom:1.125rem">
    <div class="sw"><div class="sw-t"><b>開啟密碼</b>
      <small>${c.pin ? '已設定。開啟程式需輸入密碼' : '未設定。任何拿到裝置的人都能看到站臺與座標'}</small></div>
      <button class="btn sm" onclick="openPin()">${c.pin ? '變更' : '設定'}</button></div>
    <div class="sw"><div class="sw-t"><b>閒置自動鎖定</b><small>離開畫面超過設定時間即需重新輸入密碼</small></div>
      <select id="c_lock" style="width:6.875rem">
        ${[[0, '不鎖定'], [1, '1 分鐘'], [5, '5 分鐘'], [15, '15 分鐘'], [30, '30 分鐘']]
      .map(([v, l]) => `<option value="${v}" ${c.lockMin === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    <div class="sw"><div class="sw-t"><b>備份含座標</b><small>關閉後，匯出的備份不含任何站臺座標</small></div>
      <button class="tgl" id="c_expc" aria-pressed="${c.exportCoords}"></button></div>
    <label class="fld" style="margin:0.875rem 0 0.5rem"><span class="lb">匯出範圍</span>
      <select id="c_scope">
        ${EXP_SCOPES().map(o => `<option value="${o.k}" ${expScope === o.k ? 'selected' : ''}>${
          esc(o.label)}${o.n != null ? `（${o.n} 站）` : ''}</option>`).join('')}
      </select></label>
    <div class="btnrow">
      <button class="btn" id="c_exp">匯出備份</button>
      <button class="btn" id="c_expE">加密匯出</button>
      <button class="btn" id="c_imp">匯入備份</button>
    </div>
    <!-- 完全不經過檔案系統的一條路:這一台複製、那一台貼上。
         Android 的下載／選擇器出任何問題,這條都還走得通。 -->
    <div class="btnrow" style="margin-top:0.375rem">
      <button class="btn sm" id="c_copy">複製備份內容</button>
      <button class="btn sm" id="c_show">顯示備份內容</button>
    </div>
    <textarea id="c_out" rows="3" readonly class="offscreen"
      style="font-family:var(--mono);font-size:0.6875rem"></textarea>
    <p class="hint" style="margin-top:0.5rem"><b>全部（完整備份）</b>：站臺、類別、設備類別設定、
      紀錄、本次管制、回報用語、管制門檻，以及<b>中央氣象署授權碼</b>與停班停課來源網址，
      連字級、底圖、對焦這些顯示偏好都一起帶走，換手機直接還原。<br>
      <b>單一類別</b>：只帶那個類別的站臺、它的類別定義與相關紀錄，不含設定與授權碼；
      <b>匯入時一律「合併」</b>（依站臺名稱覆蓋或新增），其他類別不會被動到。<br>
      <b>僅設定</b>：門檻、用語、授權碼、來源網址與類別定義，<b>不含任何站臺</b>——換新機時
      先把設定帶過去最方便。<br>
      完整備份匯入時會問要<b>取代</b>還是<b>合併</b>。
      <b style="color:var(--sb)">完整與僅設定含授權碼與團隊金鑰，等同憑證，不要外傳；
      要給別人請用「加密匯出」。</b>開啟密碼也在裡面，但匯入時會先問要不要一併還原。</p>
    <div class="btnrow" style="margin-top:0.5rem">
      <button class="btn dg wide" id="c_wipe">清除本機全部資料</button></div>
    <!-- 不設 accept:Android 的檔案選擇器是照 **MIME** 過濾的,不是照副檔名。
         瀏覽器下載下來的備份常被記成 application/octet-stream 或 text/plain,
         一設 accept=".json" 那些檔案就變灰的、點不下去 —— 看起來就像「無法匯入」。
         也不用 hidden:display:none 的 input 在部分 Android WebView
         （LINE、其他 App 內建瀏覽器）上,程式呼叫 .click() 不會開啟選擇器。
         改成移到畫面外但仍然存在。 -->
    <input type="file" id="c_file" class="offscreen">
    ${IMPORT_ERR ? `<div class="msg e" style="margin-top:0.5rem">上次匯入失敗：${esc(IMPORT_ERR)}</div>` : ''}
    <details style="margin-top:0.5rem">
      <summary style="cursor:pointer;font-size:0.8125rem;color:var(--acc);padding:0.25rem 0">
        選不到檔案？改用「貼上備份內容」</summary>
      <p class="hint" style="margin:0.375rem 0">Android 的檔案選擇器有時候會把備份檔變成灰色點不下去
        （它是照檔案的 MIME 判斷，不是照副檔名，而下載下來的檔案常被記成一般二進位檔）。
        遇到這種情況，用任何文字編輯器或檔案管理員把備份檔打開、<b>全選複製</b>，貼在這裡即可。
        加密備份也可以直接貼。</p>
      <textarea id="c_paste" rows="4" placeholder="貼上備份檔的內容（以 { 開頭）…"
        spellcheck="false" style="font-family:var(--mono);font-size:0.75rem"></textarea>
      <div class="btnrow" style="margin-top:0.375rem">
        <button class="btn pri sm" id="c_pasteGo">套用貼上的備份</button>
      </div>
    </details>
  </div>

  <div class="sec"><h2>蒲福風級對照</h2></div>
  <div class="card pad" style="margin-bottom:1.125rem">
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(4.875rem,1fr));gap:0.375rem">
      ${Array.from({ length: 14 }, (_, i) => i).map(i => `

/* ── 匯出 / 匯入 ───────────────────────────────────────
   **全面備份**:換手機、重灌之後要能完全還原,所以除了 DB 之外,
   還要帶上存在 DB 以外的那些偏好（字級、底圖、對焦、子頁籤…）。

   帶的東西裡有兩樣是憑證性質的:
   - **中央氣象署授權碼**（氣象序號）—— 使用者明確要求要含在備份裡,
     不含的話換機之後還要自己去翻,那不叫備份。
   - **開啟密碼的雜湊** —— 帶著,但**匯入時會先問要不要一併還原**;
     不問就蓋掉的話,還原一份忘了密碼的舊備份會把人鎖在門外。

   所以匯出時畫面上要講清楚這個檔案含授權碼。要給別人看的話,
   關掉「備份含座標」並不夠 —— 那只擋座標。 */
const UI_KEYS = ['galepost.ui.ts', 'galepost.ui.tysub', 'galepost.ui.basemap',
  'galepost.ui.mapfocus', 'galepost.ui.aux', 'galepost.ui.windyfocus'];

/* 匯出範圍。
   `all` 是整份;`cfg` 只有設定（換新機先把門檻、用語、授權碼帶過去,
   不必連別人的站臺一起搬進來）;其餘是單一設備類別。

   **分類匯出必然要有分類匯入。** 只匯出雷達、再照舊的方式匯入,
   會把整個 DB 換成「只有雷達」那一份 —— 紅外線與中繼站臺就沒了。
   所以分類的備份一律走**合併**:依站臺名稱比對,有的覆蓋、沒有的新增,
   範圍以外的東西一律不動。整份備份才會問要取代還是合併。            */
const EXP_SCOPES = () => [
  { k: 'all', label: '全部（完整備份）' },
  ...DB.types.map(t => ({ k: t.id, label: t.label,
    n: DB.stations.filter(x => x.type === t.id).length })),
  { k: 'cfg', label: '僅設定（不含站臺）' },
];
let expScope = 'all';

/* ═══ 團隊共用 ═══════════════════════════════════════════
   使用者要的是「把一個檔案給某人之後,兩邊就能互通,也能解綁」。

   **先講做不到的：真正的即時點對點，這支程式做不到。**
   WebRTC 要先交換 SDP 與 ICE（signalling）才連得起來,那需要一台
   雙方都連得到的伺服器。手動貼一次 offer/answer 是可以連起來,但
   ICE 候選會過期、IP 會變,**下一次還要再貼一次** —— 對值班台來說
   比不做還糟。這支程式是 GitHub Pages 上的靜態檔,沒有後端。

   **做得到而且真的堪用的：配對檔 + 同步包。**
   ① 一方建立團隊,匯出一個**邀請檔**,用你們本來就在用的管道傳過去
      （LINE、AirDrop、電子郵件都行）。對方匯入就綁定了。
   ② 之後任何一方匯出**同步包**,對方匯入就把站臺狀態併進來。
      不需要兩邊同時在線,不怕 NAT,離線也能事後補。
   ③ **解綁**：移除某個成員（之後拒收他的同步包）,或整個離開團隊。

   同步包用團隊金鑰做 HMAC-SHA256 簽章。意義是:別人隨手丟一個檔案
   進來**不會**默默改掉你的站臺狀態。但金鑰本身就在邀請檔裡 ——
   **邀請檔傳得多安全,這件事就有多安全**,它是共用密鑰不是公鑰。   */

const TEAM_TAG = 'team1', SYNC_TAG = 'sync1';

// 簽章要對「同一個字串」算。物件的鍵順序經過 JSON 來回可能不同,
// 所以先遞迴排序鍵再序列化 —— 兩邊算出來才會是同一串。
function canon(v) {
  if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
  if (v && typeof v === 'object') {
    return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
  }
  return JSON.stringify(v === undefined ? null : v);
}

async function hmacB64(keyB64, msg) {
  const k = await crypto.subtle.importKey('raw', b64d(keyB64),
    { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  return b64e(await crypto.subtle.sign('HMAC', k, new TextEncoder().encode(msg)));
}

function meId() {
  if (!DB.me.id) { DB.me.id = uid(); save(); }
  return DB.me.id;
}
const meName = () => (DB.me.name || DB.cfg.unit || '未命名裝置');

function createTeam(name) {
  const key = b64e(crypto.getRandomValues(new Uint8Array(32)));
  DB.team = { id: uid(), name: String(name || '').trim() || '未命名團隊', key, at: Date.now() };
  meId();
  save(); renderSettings();
  toast('已建立團隊，接著匯出邀請檔傳給對方');
}

function exportInvite() {
  if (!DB.team) return;
  download({ galepost: TEAM_TAG, app: APP_VER, at: new Date().toISOString(),
    team: DB.team, from: { id: meId(), name: meName() } },
    `風哨團隊邀請_${DB.team.name}_${stamp()}.json`);
  toast('已下載邀請檔。請用你們本來就在用的管道傳給對方');
}

function exportSyncPack() {
  if (!DB.team) return;
  /* 只送真正需要共用的欄位。授權碼、開啟密碼、代理網址一律不送 ——
     那是這台裝置的東西,不該因為分享站臺狀態就一起跑到別人手上。 */
  const body = {
    team: DB.team.id,
    from: { id: meId(), name: meName() },
    at: Date.now(),
    types: DB.types.map(t => ({ label: t.label, report: t.report,
      terrain: t.terrain, noReport: !!t.noReport, icon: t.icon || '' })),
    stations: DB.stations.map(x => ({
      name: x.name, type: (DB.types.find(t => t.id === x.type) || {}).label || '',
      status: x.status, at: x.at, mt: Number.isFinite(x.mt) ? x.mt : x.at,
      hum: x.hum == null ? null : x.hum, note: x.note || '',
      lat: Number.isFinite(x.lat) ? x.lat : null, lng: Number.isFinite(x.lng) ? x.lng : null,
      terrain: x.terrain || null, county: x.county || '',
    })),
    ctl: DB.ctl, log: DB.log.slice(-200),
  };
  hmacB64(DB.team.key, canon(body)).then(sig => {
    download({ galepost: SYNC_TAG, app: APP_VER, sig, body },
      `風哨同步_${meName()}_${stamp()}.json`);
    toast(`已下載同步包（${body.stations.length} 站）`);
  }).catch(e => toast('簽章失敗：' + e.message));
}

/* 收到的同步包要先算出「會變成什麼樣」再問要不要套用。
   默默合併是資料消失的標準劇本 —— 值班的人要先看得到差異。 */
function syncDiff(body) {
  const add = [], upd = [], skip = [];
  for (const r of (body.stations || [])) {
    if (!r || !r.name) continue;
    const ex = DB.stations.find(x => x.name === r.name);
    if (!ex) { add.push(r.name); continue; }
    const mine = Number.isFinite(ex.mt) ? ex.mt : (ex.at || 0);
    const theirs = Number.isFinite(r.mt) ? r.mt : (r.at || 0);
    if (theirs > mine) upd.push(`${r.name}：${S_LABEL[ex.status] || ex.status} → ${S_LABEL[r.status] || r.status}`);
    else skip.push(r.name);
  }
  return { add, upd, skip };
}

async function importSyncPack(o) {
  const body = o.body;
  if (!body || typeof body !== 'object') throw new Error('同步包的內容不完整');
  if (!DB.team) throw new Error('這台裝置還沒有加入任何團隊。請先匯入邀請檔');
  if (body.team !== DB.team.id) throw new Error('這個同步包屬於別的團隊，不會套用');

  const want = await hmacB64(DB.team.key, canon(body));
  /* 簽章對不上就停手。可能是被改過,也可能只是對方用的金鑰不同 ——
     兩種都不該套用,因為兩種都表示「這不是我這個團隊的資料」。 */
  if (want !== o.sig) throw new Error('簽章驗證失敗，這個檔案不是用本團隊的金鑰產生的（或中途被改過）');

  const from = body.from || {};
  const blocked = DB.peers.find(p => p.id === from.id && p.blocked);
  if (blocked) throw new Error(`「${blocked.name}」已被解綁，不再接受他的同步包`);

  const d = syncDiff(body);
  if (!d.add.length && !d.upd.length) {
    toast(`來自「${from.name || '未知'}」：${d.skip.length} 站都比本機舊，沒有變動`);
    return;
  }
  const lines = [];
  if (d.add.length) lines.push(`新增 ${d.add.length} 站：${d.add.slice(0, 6).join('、')}${d.add.length > 6 ? '…' : ''}`);
  if (d.upd.length) lines.push(`更新 ${d.upd.length} 站：\n　${d.upd.slice(0, 8).join('\n　')}${d.upd.length > 8 ? '\n　…' : ''}`);
  if (d.skip.length) lines.push(`${d.skip.length} 站本機比較新，維持不動`);
  if (!confirm(`來自「${from.name || '未知裝置'}」的同步包（${fmtShort(body.at)}）\n\n`
    + lines.join('\n') + '\n\n要套用嗎？（不會刪除任何站臺）')) return;

  // 類別照 label 對回去,對不到就整個加進來
  const tmap = {};
  for (const t of (body.types || [])) tmap[t.label] = adoptType(t);

  let add = 0, upd = 0;
  for (const r of (body.stations || [])) {
    if (!r || !r.name) continue;
    const tid = tmap[r.type] || (DB.types[0] || {}).id;
    const ex = DB.stations.find(x => x.name === r.name);
    const rec = { name: r.name, type: tid, status: r.status, at: r.at,
      mt: Number.isFinite(r.mt) ? r.mt : r.at, hum: r.hum, note: r.note || '',
      lat: Number.isFinite(r.lat) ? r.lat : null, lng: Number.isFinite(r.lng) ? r.lng : null,
      terrain: r.terrain || null, county: r.county || '' };
    if (!ex) { DB.stations.push(Object.assign({ id: uid() }, rec)); add++; continue; }
    const mine = Number.isFinite(ex.mt) ? ex.mt : (ex.at || 0);
    const theirs = rec.mt;
    /* 只有對方比較新才覆蓋。**絕不刪除** —— 一個過期的同步包如果能刪站,
       某人拿三天前的檔案匯入就會把新加的站臺全部抹掉。 */
    if (theirs > mine) { Object.assign(ex, rec, { id: ex.id }); upd++; }
  }

  // 紀錄取聯集,重複的（同名同時刻同狀態）跳過
  const seen = new Set((DB.log || []).map(x => `${x.name}|${x.at}|${x.to}`));
  for (const l of (body.log || [])) {
    const k = `${l.name}|${l.at}|${l.to}`;
    if (!seen.has(k)) { DB.log.push(l); seen.add(k); }
  }
  DB.log.sort((x, y) => x.at - y.at);

  // 本次管制取比較晚開始的那一次
  if (body.ctl && body.ctl.start && body.ctl.start > (DB.ctl.start || 0)) DB.ctl = body.ctl;

  // 記下這位成員,之後才有得解綁
  if (from.id) {
    const p = DB.peers.find(x => x.id === from.id);
    if (p) { p.name = from.name || p.name; p.lastRecv = Date.now(); }
    else DB.peers.push({ id: from.id, name: from.name || '未命名', at: Date.now(), lastRecv: Date.now(), blocked: false });
  }

  save(); refreshAll(); renderSettings(); syncForm();
  toast(`已同步：新增 ${add}、更新 ${upd}`);
}

function importInvite(o) {
  const t = o.team;
  if (!t || !t.id || !t.key) throw new Error('邀請檔的內容不完整');
  if (DB.team && DB.team.id !== t.id
    && !confirm(`這台裝置已經在團隊「${DB.team.name}」裡。\n\n`
      + `要改加入「${t.name}」嗎？原本團隊的成員清單會被清掉（站臺與紀錄不會動）。`)) return;
  DB.team = { id: t.id, name: t.name || '未命名團隊', key: t.key, at: Date.now() };
  if (!DB.peers.length || (DB.team && DB.team.id !== t.id)) DB.peers = [];
  meId();
  const f = o.from || {};
  if (f.id && f.id !== DB.me.id && !DB.peers.some(p => p.id === f.id)) {
    DB.peers.push({ id: f.id, name: f.name || '未命名', at: Date.now(), lastRecv: 0, blocked: false });
  }
  save(); renderSettings();
  toast(`已加入團隊「${DB.team.name}」`);
}

function unbindPeer(id) {
  const p = DB.peers.find(x => x.id === id); if (!p) return;
  if (!confirm(`解綁「${p.name}」？\n\n之後他的同步包會被拒收。`
    + '已經併進來的站臺與紀錄不會被移除（那是既成的資料，刪掉才是真的危險）。')) return;
  p.blocked = true; p.at = Date.now();
  save(); renderSettings();
  toast(`已解綁「${p.name}」`);
}
function rebindPeer(id) {
  const p = DB.peers.find(x => x.id === id); if (!p) return;
  p.blocked = false; save(); renderSettings(); toast(`已恢復接收「${p.name}」`);
}
function forgetPeer(id) {
  const p = DB.peers.find(x => x.id === id); if (!p) return;
  if (!confirm(`從清單移除「${p.name}」？\n\n`
    + '注意：移除之後他的同步包會再度被接受（因為已經不在拒收名單上）。\n'
    + '只是想擋掉他的話，用「解綁」不要用這個。')) return;
  DB.peers = DB.peers.filter(x => x.id !== id);
  save(); renderSettings(); toast('已從清單移除');
}
function leaveTeam() {
  if (!DB.team) return;
  if (!confirm(`離開團隊「${DB.team.name}」？\n\n`
    + '之後不再接受任何同步包，也不能再匯出同步包。\n'
    + '站臺、紀錄與設定都不會被刪除。')) return;
  DB.team = null; DB.peers = [];
  save(); renderSettings(); toast('已離開團隊');
}

function exportPayload(scope) {
  const sc = scope || 'all';
  const d = JSON.parse(JSON.stringify(DB));
  d.ty.data = null; d.ty.list = [];    // 颱風資料每次重抓即可,備份它只會過期

  let info = { kind: 'all' };
  if (sc === 'cfg') {
    info = { kind: 'cfg' };
    d.stations = []; d.log = [];
  } else if (sc !== 'all') {
    const t = DB.types.find(x => x.id === sc);
    const keep = d.stations.filter(x => x.type === sc);
    const names = new Set(keep.map(x => x.name));
    info = { kind: 'type', typeId: sc, typeLabel: t ? t.label : '', n: keep.length };
    d.stations = keep;
    /* 只帶這個類別的定義 —— 匯入端的類別 id 不一定一樣,
       所以要靠 label 對回去;帶著整份 types 反而會蓋掉對方的設定。 */
    d.types = t ? [JSON.parse(JSON.stringify(t))] : [];
    d.log = (d.log || []).filter(e => e && names.has(e.name));
    // 分類備份不帶這些「整體性」的東西,它們不屬於某一個類別
    delete d.cfg; delete d.ctl; delete d.ty; delete d.since; delete d.tpl;
  }
  if (!DB.cfg.exportCoords && d.stations) {
    d.stations.forEach(x => { x.lat = null; x.lng = null; });
  }
  const ui = {};
  if (info.kind !== 'type') {
    for (const k of UI_KEYS) {
      try { const v = localStorage.getItem(k); if (v != null) ui[k] = v; } catch (e) {}
    }
  }
  return { galepost: 'full1', app: APP_VER, at: new Date().toISOString(), scope: info, db: d, ui };
}

/* 下載。錨點**一定要先掛進文件**再 click ——
   沒掛進去的 <a> 在 Firefox 與部分 Android 瀏覽器上點了不會有反應,
   或是產生一個 0 位元組的檔案;那個檔案再拿去匯入,
   看到的就是「不是有效的 JSON」。 */
function download(obj, name) {
  const text = JSON.stringify(obj, null, 2);
  LAST_EXPORT = text;                 // 下載不成功時,還能用「複製備份內容」帶走
  try {
    const b = new Blob([text], { type: 'application/json' });
    const url = URL.createObjectURL(b);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
  } catch (e) {
    toast('這個瀏覽器擋下了下載，請改用「複製備份內容」');
  }
  renderSettings();
}
let LAST_EXPORT = '';
const stamp = () => new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '');
// 檔名帶上範圍 —— 三個檔案都叫「風哨備份」的話,要還原時分不出哪個是哪個
const scopeName = sc => sc === 'all' ? '完整'
  : sc === 'cfg' ? '設定'
  : (DB.types.find(t => t.id === sc) || {}).label || '站臺';
async function doExport(enc) {
  const p = exportPayload(expScope);
  const nm = scopeName(expScope);
  if (p.scope.kind === 'type' && !p.scope.n
    && !confirm(`「${nm}」目前沒有任何站臺，還是要匯出嗎？`)) return;
  if (!enc) { download(p, `風哨備份_${nm}_${stamp()}.json`); toast(`已下載「${nm}」備份`); return; }
  const pw = prompt('設定備份檔密碼（解密時需要，遺失無法還原）：');
  if (!pw) return;
  try {
    download(await encryptJSON(p, pw), `風哨備份_${nm}_加密_${stamp()}.json`);
    toast(`已下載「${nm}」加密備份`);
  } catch (e) { toast('加密失敗：' + e.message); }
}
/* 依名稱合併站臺:有的覆蓋、沒有的新增,範圍以外的一律不動。
   名稱是這支程式一直以來的比對依據（貼回報建檔也是照名稱比對）。 */
function mergeStations(incoming, typeId) {
  let add = 0, upd = 0;
  for (const r of incoming) {
    if (!r || !r.name) continue;
    const ex = DB.stations.find(x => x.name === r.name);
    const d = Object.assign({}, r, { type: typeId || r.type });
    if (ex) { Object.assign(ex, d, { id: ex.id }); upd++; }
    else { DB.stations.push(Object.assign({ id: uid() }, d)); add++; }
  }
  return { add, upd };
}

/* 匯入端的類別 id 不一定跟匯出端一樣,所以照 label 對回去;
   對不到就把備份裡那個類別整個加進來。 */
function adoptType(t) {
  if (!t) return DB.types[0] ? DB.types[0].id : '';
  const ex = DB.types.find(x => x.label === t.label || x.report === t.report);
  if (ex) return ex.id;
  const id = uid();
  DB.types.push(Object.assign({}, t, { id }));
  return id;
}

function doImport(e) {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onerror = () => importFail(new Error('讀不到這個檔案，請改用「貼上備份內容」'));
  r.onload = () => applyBackupText(String(r.result));
  r.readAsText(f);
  e.target.value = '';
}

function importFail(err) {
  const m = err && err.message === 'OperationError' ? '密碼錯誤' : (err && err.message) || String(err);
  IMPORT_ERR = m;
  toast('匯入失敗：' + m);
  renderSettings();
}
let IMPORT_ERR = '';

/* 檔案與「貼上」共用同一條路。
   BOM 一定要去掉 —— Android 上經過某些 App 轉手的檔案會多一個 \uFEFF,
   JSON.parse 會直接丟 "Unexpected token",看起來就像備份壞了。 */
async function applyBackupText(raw) {
  try {
    const txt = String(raw || '').replace(/^\uFEFF/, '').trim();
    if (!txt) throw new Error('讀到的內容是空的（0 個字元）——檔案可能是空檔或下載沒完成');
    let o;
    try { o = JSON.parse(txt); }
    catch (e) {
      /* 光說「不是有效的 JSON」沒辦法排查。把**實際讀到什麼**講出來:
         長度、開頭幾個字。是 HTML 就是下載到錯誤頁,是空白就是檔案沒寫成功,
         看起來像 JSON 但斷在中間就是只複製到一半。 */
      const head = txt.slice(0, 60).replace(/\s+/g, ' ');
      const kind = /^</.test(txt) ? '這看起來是一個網頁（HTML），不是備份檔'
        : /^\{|^\[/.test(txt) ? '開頭是 JSON，但中途斷掉——可能只複製到一半'
        : '開頭不是 { 或 [，這不像備份檔';
      throw new Error(`${kind}。讀到 ${txt.length} 個字元，開頭是「${head}」`);
    }
    IMPORT_ERR = '';
    await applyBackup(o);
  } catch (err) { importFail(err); }
}

/* 錯誤一律往上丟給 applyBackupText 統一處理,這裡不自己吞掉 ——
   兩層各接一次的話,訊息會被講兩遍或漏掉一遍。 */
async function applyBackup(oIn) {
  {
    {
      let o = oIn;
      /* 邀請檔與同步包走同一個「匯入」入口 —— 使用者手上就是一個檔案,
         不該還要先分辨它是哪一種再按對應的按鈕。 */
      if (o && o.galepost === TEAM_TAG) { importInvite(o); return; }
      if (o && o.galepost === SYNC_TAG) { await importSyncPack(o); return; }
      if (o && o.galepost === 'enc1') {
        const pw = prompt('這是加密備份，請輸入密碼：');
        if (!pw) return;
        o = await decryptJSON(o, pw);
      }
      // 新版是 {galepost:'full1', scope, db, ui};舊版直接就是 DB 本身,兩種都要接
      const full = o && o.galepost === 'full1';
      const body = full ? o.db : o;
      const ui = full ? (o.ui || {}) : null;
      const sc = (full && o.scope) || { kind: 'all' };
      if (!body || typeof body !== 'object') throw new Error('不是風哨的備份檔');
      if (sc.kind === 'all' && !Array.isArray(body.stations)) throw new Error('不是風哨的備份檔');

      const applyUI = () => {
        if (!ui) return;
        for (const k of UI_KEYS) {
          if (ui[k] == null) continue;
          try { localStorage.setItem(k, ui[k]); } catch (err) {}
        }
      };

      /* ── 單一類別:一律合併,絕不取代 ──
         只匯出雷達、再照整份的方式套用,會把紅外線與中繼站臺一起洗掉。 */
      if (sc.kind === 'type') {
        const tid = adoptType((body.types || [])[0]);
        const n = mergeStations(body.stations || [], tid);
        // 該類別的紀錄一併併回來,重複的（同名同時刻同狀態）跳過
        const seen = new Set((DB.log || []).map(x => `${x.name}|${x.at}|${x.to}`));
        for (const l of (body.log || [])) {
          const k = `${l.name}|${l.at}|${l.to}`;
          if (!seen.has(k)) { DB.log.push(l); seen.add(k); }
        }
        DB.log.sort((x, y) => x.at - y.at);
        save(); refreshAll(); renderSettings(); syncForm();
        toast(`已合併「${sc.typeLabel || '站臺'}」：新增 ${n.add}、更新 ${n.upd}`);
        return;
      }

      /* ── 僅設定:只動設定與類別,不碰站臺 ── */
      if (sc.kind === 'cfg') {
        if (!confirm('這是「僅設定」的備份。將覆蓋管制門檻、回報用語、授權碼與來源網址，'
          + '站臺與紀錄不會被動到。要繼續嗎？')) return;
        const keepPin = DB.cfg.pin;
        const base = blankDB();
        DB.cfg = Object.assign({}, base.cfg, body.cfg || {});
        DB.cfg.pin = keepPin;
        if (Array.isArray(body.types) && body.types.length) DB.types = body.types;
        applyUI();
        save(); refreshAll(); renderSettings(); syncForm();
        toast('設定已匯入（站臺未變動）');
        return;
      }

      /* ── 整份:問要取代還是合併 ──
         取代是原本的行為;會把現有站臺清掉,所以要問。 */
      const replace = confirm(`這是完整備份（${(body.stations || []).length} 個站臺）。\n\n`
        + '按「確定」＝取代：清掉這台目前的站臺與設定，完全還原成備份的樣子\n'
        + '按「取消」＝合併：保留現有站臺，備份裡有的依名稱覆蓋或新增，設定不動');

      if (!replace) {
        const idMap = {};
        for (const t of (body.types || [])) idMap[t.id] = adoptType(t);
        const n = mergeStations((body.stations || []).map(x =>
          Object.assign({}, x, { type: idMap[x.type] || x.type })));
        save(); refreshAll(); renderSettings(); syncForm();
        toast(`已合併：新增 ${n.add}、更新 ${n.upd}（設定未變動）`);
        return;
      }

      /* 密碼要不要一併還原,一定要問。不問就蓋掉的話,
         還原一份忘了密碼的舊備份會把人鎖在門外。 */
      const keepPin = DB.cfg.pin;
      const bakPin = (body.cfg && body.cfg.pin) || '';
      let usePin = keepPin;
      if (bakPin && bakPin !== keepPin) {
        usePin = confirm('這份備份含開啟密碼。要一併還原成備份裡的密碼嗎？\n\n'
          + '按「確定」＝改用備份裡的密碼（記不得就會被鎖在外面）\n'
          + '按「取消」＝保留這台裝置目前的設定') ? bakPin : keepPin;
      }

      const base = blankDB();
      const defCfg = base.cfg, defTy = base.ty, defTypes = base.types;
      DB = Object.assign(base, body);
      DB.cfg = Object.assign({}, defCfg, body.cfg || {}); DB.cfg.pin = usePin;
      DB.ty = Object.assign({}, defTy, body.ty || {});
      if (!Array.isArray(DB.types) || !DB.types.length) DB.types = defTypes;
      applyUI();
      save(); refreshAll(); renderSettings(); syncForm();
      toast(full ? '全面備份已匯入，重新整理後套用顯示偏好' : '備份已匯入');
    }
  }
}

  openSheet('開啟密碼', `

    <label class="fld"><span class="lb">新密碼　留空表示取消密碼</span>
      <input type="password" id="p_new" inputmode="numeric" maxlength="8" placeholder="4 至 8 位數字">

/* 手動檢查更新。
   平常不自動換版是刻意的（颱風天不該把正在操作的人從腳下抽換）,
   但那也代表使用者可能一直停在舊版。這顆按鈕是唯一的出口。 */
async function checkUpdate() {
  if (!('serviceWorker' in navigator)) { toast('此瀏覽器不支援離線更新'); return; }
  let reg = null;
  try { reg = await navigator.serviceWorker.getRegistration(); } catch (e) {}
  if (!reg) { toast('尚未安裝離線版本，重新整理即可取得最新版'); return; }
  toast('檢查中…');
  try { await reg.update(); } catch (e) {}
  // update() 回來時新的 worker 可能還在安裝,等它進到 waiting 再說
  const waiting = await new Promise(res => {
    if (reg.waiting) return res(reg.waiting);
    const nw = reg.installing;
    if (!nw) return res(null);
    nw.addEventListener('statechange', () => {
      if (nw.state === 'installed') res(reg.waiting || nw);
      else if (nw.state === 'redundant') res(null);
    });
    setTimeout(() => res(reg.waiting || null), 8000);
  });
  if (waiting) { toast('正在套用新版本…'); waiting.postMessage('SKIP_WAITING'); }
  else toast(`目前已是最新版本 ${APP_VER}`);
}

/* ── 颱風頁的子頁籤 ────────────────────────────────────────
   整頁攤開要滑很久,而值班的人一次只問一件事:
   現在怎樣（概況）、往哪走（路徑）、我的站臺會怎樣（站臺）、
   要怎麼寫（播報）、外面實際在下什麼（實況）。
   選的分頁會記住 —— 每次進來都要重點一次很煩。              */
const TYSUB_KEY = 'galepost.ui.tysub';
let tySub = 'now';
try { tySub = localStorage.getItem(TYSUB_KEY) || 'now'; } catch (e) {}

function goTySub(k) {
  const panes = ['now', 'brief', 'warn', 'wx', 'dgpa', 'map', 'live', 'st'];
  if (!panes.includes(k)) k = 'now';
  tySub = k;
  try { localStorage.setItem(TYSUB_KEY, k); } catch (e) {}
  panes.forEach(x => {
    const el = document.getElementById('ty-' + x);
    if (el) el.classList.toggle('on', x === k);
  });
  document.querySelectorAll('#tySeg button[data-ty]').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.ty === k)));
  // 地圖在隱藏狀態下量不到自己的大小,切回來要重新量再重新框,
  // 否則會停在切走之前的尺寸,變成一條窄縫或整個世界。
  if (k === 'map' && MAP) {
    setTimeout(() => { MAP.invalidateSize(); if (DB.ty.data) drawMap(DB.ty.data); }, 30);
  }
  // Windy 的 iframe 到真的切到實況頁才建立,不然一開 app 就吃掉幾 MB。
  if (k === 'live') renderWindyIfReady();
}

let _windyReady = null;
function renderWindyIfReady() { if (_windyReady) _windyReady(); }

window.setWxLoc = setWxLoc; window.locateMe = locateMe; window.setWxMode = setWxMode;
window.exportInvite = exportInvite; window.exportSyncPack = exportSyncPack;
window.unbindPeer = unbindPeer; window.rebindPeer = rebindPeer;
window.forgetPeer = forgetPeer; window.leaveTeam = leaveTeam;
window.pickTyphoon = pickTyphoon; window.goTySub = goTySub; window.copyBrief = copyBrief; window.onTimeline = onTimeline;
window.checkUpdate = checkUpdate; window.fetchDgpa = fetchDgpa;

</script>

<style>
/* PWA 提示條:安裝、離線、更新。三者共用同一個位置,一次只出現一個。 */

  overflow:hidden;border:1px solid var(--edge);background:var(--bg2)}
