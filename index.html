/* ═══════════════════════════════════════════════════════════════
   介面：站臺 / 颱風 / 回報 / 設定
   ═══════════════════════════════════════════════════════════════ */
const S_LABEL = { on: '開機', standby: '待機', off: '關機', plan: '未建置' };
const S_VERB = { on: '完成開機', standby: '實施待機', off: '完成關機', plan: '尚未建置' };
/* 未建置＝設備還沒架上去。它不是一種管制狀態,而是「這個點還不存在」——
   所以不進回報稿、不算戰力、不做關機推估,但留在清單裡好追蹤。
   建置完成之後由使用者自己改成開機。 */
const IS_LIVE = st => st && st.status !== 'plan';
/* 站臺卡上要的是「現在是什麼狀態」,不是「當時做了什麼動作」。
   還沒有颱風的時候寫「完成開機」,看起來像剛剛執行過復機作業,
   其實只是一直開著。S_VERB 留給回報稿用 —— 那裡本來就是在講動作。 */
const S_STATE = { on: '開機中', standby: '待機中', off: '關機中', plan: '未建置' };
const S_CSS = { on: 'on', standby: 'sb', off: 'off', plan: 'pl' };
const S_COL = { on: 'var(--ok)', standby: 'var(--sb)', off: 'var(--no)', plan: 'var(--fg4)' };
const ICON = {
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M4.9 4.9l14.2 14.2"/></svg>',
  go: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 15l-6-6-6 6"/></svg>',
  dn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>',
  radar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 12 20 7"/><path d="M4.9 19.1A10 10 0 1 1 19.1 4.9"/><path d="M8.5 15.5a5 5 0 1 1 7-7"/></svg>',
};
const typeOf = id => DB.types.find(t => t.id === id) || DB.types[0] || { id: '', label: '未分類', report: '未分類' };

function bfBadge(bf, size) {
  if (bf == null) return '';
  return `<span class="bf ${size || 'md'}" style="background:${bfColor(bf)}"><b>${bf >= 17 ? '17+' : bf}</b><small>級</small></span>`;
}

/* ═══ 站臺頁 ═══════════════════════════════════════════ */
let fType = 'all', fStatus = 'all', fUnit = 'all';
/* 自用監看的開關。跟 fType 分開:類別篩選是「只看這一類」,
   這一顆是「要不要把不列入交接的也放進來」—— 兩個問題,兩顆鈕。 */
const AUX_KEY = 'galepost.ui.aux';
let fAux = (() => { try { return localStorage.getItem(AUX_KEY) === '1'; } catch (e) { return false; } })();

function impactMap() {
  const m = {};
  // 未建置的點沒有設備可關,推估它幾點該關機沒有意義,也會混進戰力與播報。
  if (SERIES) for (const s of DB.stations) if (IS_LIVE(s)) m[s.id] = stationImpact(SERIES, s, DB.cfg);
  return m;
}
function sortStations(list, imp) {
  const s = DB.cfg.sort;
  const arr = list.slice();
  if (s === 'custom') return arr;
  const ti = id => DB.types.findIndex(t => t.id === id);
  const cmp = {
    type: (a, b) => ti(a.type) - ti(b.type) || a.at - b.at,
    time: (a, b) => b.at - a.at,
    timeAsc: (a, b) => a.at - b.at,
    name: (a, b) => a.name.localeCompare(b.name, 'zh-Hant'),
    /* 由北至南：緯度大的在前。沒填座標的排在最後 ——
       不知道在哪裡就不能假裝知道它在北邊還是南邊。 */
    ns: (a, b) => (Number.isFinite(b.lat) ? b.lat : -1e3) - (Number.isFinite(a.lat) ? a.lat : -1e3)
      || a.name.localeCompare(b.name, 'zh-Hant'),
    status: (a, b) => ({ off: 0, standby: 1, on: 2 })[a.status] - ({ off: 0, standby: 1, on: 2 })[b.status] || a.at - b.at,
    wind: (a, b) => ((windRead(b, imp[b.id]).bf ?? -1) - (windRead(a, imp[a.id]).bf ?? -1)),
    dist: (a, b) => ((imp[a.id]?.km ?? 1e9) - (imp[b.id]?.km ?? 1e9)),
  }[s];
  return cmp ? arr.sort(cmp) : arr;
}

/* ═══ 新手引導 ═══════════════════════════════════════════
   每一步的「完成」都從實際狀態判斷（有沒有站臺、有沒有座標……），
   不是按一下「我看過了」就算——那樣勾滿了，人還是不會用。
   一次只展開下一步，其餘只留標題：五段說明全攤開，跟沒有引導一樣難讀。 */
function guideSteps() {
  const noXY = DB.stations.find(s => IS_LIVE(s) && !(Number.isFinite(s.lat) && Number.isFinite(s.lng)));
  return [
    { done: DB.stations.length > 0, t: '建立站臺',
      d: '逐站新增；或把群組裡大家的回報、以前發過的回報整段貼到「回報 › 貼上比對」自動建檔。',
      btn: [['新增站臺', 'openStation(null)'], ['貼上回報建檔', 'goImp()']] },
    { done: DB.stations.some(s => Number.isFinite(s.lat) && Number.isFinite(s.lng)), t: '填站臺座標',
      d: '有座標才算得出各站的陣風、應完成待機與可復機時間。按站臺卡的「編輯」填入，度分秒或十進位都可以。',
      btn: noXY ? [['填座標', `openStation('${noXY.id}')`]] : [] },
    { done: !!DB.cfg.guideTy, t: '看颱風動態',
      d: '「戰情」頁自動取得中央氣象署路徑，不必申請授權碼。總覽看警報；「站臺 › 預判」看哪一站先達門檻；總覽旁的「播報員」可直接唸。',
      btn: [['打開戰情頁', "go('ty')"]] },
    { done: !!(DB.ctl && DB.ctl.start), t: '颱風要來時按「開始管制」',
      d: '設備平常開機是常態，不算動作；開始管制之後的開機、待機、關機才會記進時序與回報。按鈕在本頁上方。',
      btn: [['開始管制', 'startCtl()']] },
    { done: !!DB.cfg.guideCopied, t: '達門檻按「待機」，到「回報」複製通報',
      d: `陣風達 ${DB.cfg.bfShut} 級時，站臺卡會把「待機」框起來；關機只在特殊需要時才按。回報頁一鍵複製全文。`,
      btn: [['打開回報頁', "go('rp')"]] },
  ];
}
function guideCard() {
  if (DB.cfg.guideOff) return '';
  const S = guideSteps();
  const n = S.filter(x => x.done).length, next = S.findIndex(x => !x.done);
  return `<section class="card pad guide" aria-label="新手引導">
    <div class="sw"><div class="sw-t"><b>開始使用　${n} / ${S.length}</b>
      <small>${n === S.length ? '都完成了。之後可在「設定 › 系統 › 使用說明」重看。' : '照順序做一遍，完成的會自動打勾。'}</small></div>
      <button class="btn sm" onclick="setGuide(false)">收起</button></div>
    <div class="gbar" role="progressbar" aria-valuemin="0" aria-valuemax="${S.length}" aria-valuenow="${n}"><i style="width:${n / S.length * 100}%"></i></div>
    <ol class="gsteps">${S.map((x, i) => `<li class="${x.done ? 'ok' : ''}${i === next ? ' cur' : ''}">
      <span class="gn" aria-hidden="true">${x.done ? '✓' : i + 1}</span>
      <div style="min-width:0;flex:1"><b>${x.t}${x.done ? '<span class="sr">（已完成）</span>' : ''}</b>${i === next ? `<small>${x.d}</small>`
        + (x.btn.length ? `<div class="btnrow">${x.btn.map(([l, f], j) =>
            `<button class="btn${j ? '' : ' pri'}" onclick="${f}">${l}</button>`).join('')}</div>` : '') : ''}</div>
    </li>`).join('')}</ol></section>`;
}
function setGuide(on) {
  DB.cfg.guideOff = !on; save(); renderStations();
  if (on) go('eq'); else toast('已收起。要再看可到「設定 › 系統 › 使用說明」');
}

function renderStations() {
  const box = $('#eqBody');
  if (!DB.stations.length) {
    // 引導卡第一步就是「建立站臺」，有它的時候下面的空白說明不必再放一次同樣的兩顆鈕
    if (!DB.cfg.guideOff) {
      box.innerHTML = guideCard(); $('#eqLog').innerHTML = '';
      $('#navDot').hidden = true; return;
    }
    box.innerHTML = `<div class="empty">${ICON.radar}
      <b>尚未建立任何站臺</b>
      <p>本程式不內建任何單位或站臺資料。請新增第一個站臺，或把過去的回報文字整段貼上自動建檔。</p>
      <div class="btnrow" style="max-width:20rem;margin:0 auto">
        <button class="btn pri" onclick="openStation(null)">新增站臺</button>
        <button class="btn" onclick="goImp()">貼上回報建檔</button>
      </div></div>`;
    $('#eqLog').innerHTML = '';
    $('#navDot').hidden = true; return;
  }
  const imp = impactMap();
  /* 統計數字要跟交接通報對得起來。中繼站臺是自用監看、不列入回報,
     算進戰力的話「開機 3 / 5」跟通報上寫的處數就對不上,
     交接的時候那個差額沒有人解釋得出來。所以另外列。 */
  const n = { on: 0, standby: 0, off: 0, plan: 0, extra: 0 };
  DB.stations.forEach(s => {
    if (s.status === 'plan') { n.plan++; return; }
    if (!inReport(s)) { n.extra++; return; }
    if (n[s.status] != null) n[s.status]++;
  });
  const down = n.standby + n.off;
  $('#navDot').hidden = !down;
  $('#navDot').textContent = down;

  /* 管制盤是「現在有幾臺、狀態如何」,所以預設只列「已建置、且會進交接通報」的站。
     未建置的還沒架上去,自用監看的（中繼站臺）不進通報 —— 兩者擺在裡面只會佔位置。
     要看它們得**明確點選**：按「未建置」篩選鈕,或點該類別的篩選鈕。
     設定頁的站臺清單仍然是完整的。 */
  /* 自用監看（中繼站臺）用**獨立的開關**,不跟類別篩選同步 ——
     它不是「另一種類別」,而是「要不要把不列入交接的那些也放進來看」。
     做成類別鈕的話,按下去就會把其他類別關掉,那不是使用者要的。 */
  // 單位篩選：有站分了單位才出現（含依位置推估的）；選的單位後來沒站了就回到全部
  const uKeys = [...new Set(DB.stations.map(s => unitOf(s).k).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh-Hant'));
  if (fUnit !== 'all' && fUnit !== '-' && !uKeys.includes(fUnit)) fUnit = 'all';
  const list = sortStations(DB.stations.filter(s =>
    (fUnit === 'all' || (fUnit === '-' ? !unitOf(s).k : unitOf(s).k === fUnit))
    && (fType === 'all' || s.type === fType)
    && (inReport(s) || fAux)
    && (fStatus === 'all' ? s.status !== 'plan'
      : fStatus === 'advice' ? needsAction(s, imp[s.id]) : s.status === fStatus)), imp);

  const fleet = DB.stations.filter(s => IS_LIVE(s) && inReport(s))
    .map(s => `<i style="background:${S_COL[s.status]}"></i>`).join('');
  /* 篩選與排序改成兩個下拉（以前是兩排 chip 按鈕；使用者的規則：選項多用下拉）。
     自用監看的類別（中繼站臺）預設不列——選它或「全部＋自用監看」才出現。 */
  const auxTypes = DB.types.filter(t => t.noReport && DB.stations.some(s => s.type === t.id));
  const fOpts = [['all', '全部類別']]
    .concat(DB.types.filter(t => DB.stations.some(s => s.type === t.id))
      .map(t => ['t:' + t.id, t.label + (t.noReport ? '（自用監看）' : '')]))
    .concat(auxTypes.length ? [['aux', '全部＋自用監看']] : [])
    .concat(n.plan ? [['plan', `未建置（${n.plan}）`]] : []);
  const fCur = fStatus === 'plan' ? 'plan' : fType !== 'all' ? 't:' + fType : fAux ? 'aux' : 'all';
  const sel = (id, label, opts, cur) => `<select id="${id}" aria-label="${label}">${
    opts.map(([v, l]) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  /* 「建議處置」：站臺卡上有建議動作的（該待機、可評估復機）。值班最常問的就是
     「現在有哪幾站要動」,不用從十幾張卡裡一張一張找。數字是即時的。 */
  const nAdv = DB.stations.filter(s => IS_LIVE(s) && (inReport(s) || fAux) && needsAction(s, imp[s.id])).length;
  const maxBf = Math.max(-1, ...DB.stations.filter(IS_LIVE).map(s => windRead(s, imp[s.id]).bf ?? -1));

  box.innerHTML = guideCard() + `
  <div class="stat">
    ${[['on', 'v-on', '開機'], ['standby', 'v-sb', '待機'], ['off', 'v-off', '關機']].map(([k, c, l]) =>
      `<button type="button" class="${c}${n[k] ? '' : ' zero'}" data-f="status" data-v="${k}" aria-pressed="${fStatus === k}">
        <b>${n[k]}</b><small>${l}${fStatus === k ? '　✓' : ''}</small></button>`).join('')}
    <button type="button" class="v-adv${nAdv ? ' hot' : ' zero'}" data-f="status" data-v="advice" aria-pressed="${fStatus === 'advice'}">
      <b>${nAdv}</b><small>建議處置${fStatus === 'advice' ? '　✓' : ''}</small></button>
  </div>
  <div class="fleet">${fleet}</div>
  <div class="fleet-lb"><span>戰力 ${n.on} / ${n.on + n.standby + n.off}${n.extra ? `　另有自用監看 ${n.extra}` : ''}</span>
    <span>${maxBf >= 0 ? '最高 ' + bfLabel(maxBf)
      : !SERIES ? '無颱風資料'
      : '未設座標'}</span></div>
  ${ctlLine()}
  ${uKeys.length ? `<div class="fbar">${sel('uSel', '篩選單位', [['all', '全部單位']].concat(uKeys.map(k =>
    [k, `${unitLabel(k)}（${DB.stations.filter(s => unitOf(s).k === k).length}）`]),
    DB.stations.some(s => !unitOf(s).k) ? [['-', '未分單位']] : []), fUnit)}</div>` : ''}
  <div class="fbar">${sel('fSel', '篩選站臺', fOpts, fCur)}${sel('sSel', '排序', Object.entries(SORT_LABEL), DB.cfg.sort || 'ns')}
    <button class="btn sm" onclick="openStation(null)">＋ 新增</button></div>

  <div class="stlist" id="stlist">${list.length ? list.map((s, i) => stationCard(s, imp[s.id], i, list.length)).join('')
    : `<div class="msg i">目前沒有${fStatus === 'advice' ? '需要處置' : S_LABEL[fStatus] ? '「' + S_LABEL[fStatus] + '」' : '符合條件'}的站臺。
        <button class="btn sm" data-f="status" data-v="all" style="margin-left:0.5rem">顯示全部</button></div>`}</div>`;
  const rail = renderRail();
  $('#eqLog').innerHTML = ctlCard() + (rail ? `<div class="sec"><h2>狀態變更時序</h2>
    <span class="hint" style="margin-left:auto">點一筆可修改</span></div>${rail}` : '');
}
const SORT_LABEL = {
  ns: '由北至南', custom: '自訂順序', type: '類別',
  time: '時間新到舊', timeAsc: '時間舊到新',
  name: '名稱', status: '狀態', wind: '風級高到低', dist: '離颱風近到遠',
};

// 有建議動作＝開機中已達門檻（該待機），或待機／關機中已可評估復機
function needsAction(s, imp) {
  if (!IS_LIVE(s)) return false;
  const a = advise(s, imp, DB.cfg);
  return !!a && (a.k === 'stop' || a.k === 'go');
}

function stationCard(s, imp, i, total) {
  const t = typeOf(s.type);
  const a = advise(s, imp, DB.cfg);
  const custom = DB.cfg.sort === 'custom';
  const meta = [`${S_STATE[s.status]}　<u>${fmtMD(s.at)} ${fmtHM(s.at)}</u> 起`];
  if (s.hum != null && s.hum !== '') meta.push(`濕度 ${s.hum}%`);
  if (imp) meta.push(`距中心 ${imp.km} km`);
  else if (!Number.isFinite(s.lat)) meta.push('未設座標');
  /* 平均風與陣風都列出來（m/s 與級數）,左邊色塊是四者最高的那個——待機看的就是它。
     實測要標明是哪一站量的,否則看的人無從判斷能不能代表自己的現場。 */
  const wr = windRead(s, imp);
  const wl = [];
  if (wr.est) wl.push(`<span class="wl"><em>推估</em>${wPair(wr.est.ms, wr.est.gust)}</span>`);
  if (wr.obs) wl.push(`<span class="wl"><em>實測</em>${wPair(wr.obs.ms, wr.obs.gust, wr.obs.gEst)}　${esc(wr.obs.name)} ${wr.obs.km} km</span>`);
  // 有在校正就講出來 —— 使用者要知道畫面上的推估已經不是原始模型值
  if (imp && imp.k != null && Math.abs(imp.k - 1) > 0.02) {
    meta.push(`<span style="color:var(--acc)">地形校正 ×${imp.k.toFixed(2)}</span>`);
  }
  // 颱風致災常常是雨先出事,山區站臺尤其如此,所以雨量跟風擺在一起看。
  const rb = nearestRain(s);
  if (rb && rb.o.h24 != null) {
    const L = rainLevel(rb.o);
    const dm = dgpaMark(rb.o.h24, s);
    // 等級與停班課標記本身不該被折行拆開——「大／豪雨」分兩行會看成兩個等級。
    const nb = 'white-space:nowrap';
    meta.push(`<span style="${nb}">24 小時雨量 ${Math.round(rb.o.h24)} mm</span>`
      + (L ? `　<b style="color:${L.col};${nb}">${L.name}</b>` : '')
      + (dm ? `　<b style="color:${dm.col};${nb}">停班課${dm.t} ${dm.thr}`
          + `${dm.official ? '（實際觀測）' : ''}</b>` : ''));
  }
  meta.push(...wxLogTag(s.id));
  const aux = !inReport(s);
  return `<article class="st${aux ? ' aux' : ''}" data-id="${s.id}">
    <div class="st-main">
      <i class="st-i" style="background:${aux ? 'var(--aux)' : S_COL[s.status]}"></i>
      ${wr.bf != null ? bfBadge(wr.bf, 'md') : ''}
      <div class="st-b">
        <div class="st-n"><span class="nm">${esc(s.name)}</span><em>${esc(t.label)}</em>${(u => u.k
          ? `<em class="unitlb${u.guess ? ' guess' : ''}" title="${esc(unitLabel(u.k))}${u.guess ? `（依 ${esc(u.from)} ${u.km} km 推估）` : ''}">${esc(u.k)}${u.guess ? '?' : ''}</em>` : '')(unitOf(s))}${aux
          ? '<em class="auxlb" title="自用監看：不進交接通報、不計入戰力">自用監看</em>' : ''}</div>
        <div class="st-m">${meta.map(x => `<span>${x}</span>`).join('')}</div>
        ${wl.length ? `<div class="st-w">${wl.join('')}${wr.bf != null ? `<span class="wl wtop">待機判斷取最高：${wr.src} ${wr.bf} 級</span>` : ''}</div>` : ''}
        ${s.note ? `<div class="st-m" style="color:var(--fg4)"><span>${esc(s.note)}</span></div>` : ''}
      </div>
      <span class="st-tag tag-${S_CSS[s.status]}">${S_LABEL[s.status]}</span>
      ${custom ? `<div class="st-ord">
        <button data-mv="up" data-id="${s.id}" ${i === 0 ? 'disabled' : ''} aria-label="上移">${ICON.up}</button>
        <button data-mv="dn" data-id="${s.id}" ${i === total - 1 ? 'disabled' : ''} aria-label="下移">${ICON.dn}</button></div>` : ''}
    </div>
    ${a ? `<div class="st-alert a-${a.k}">${ICON[a.k]}<span>${esc(a.txt)}</span></div>` : ''}
    <div class="st-act">
      <button class="k-on" data-act="on" data-id="${s.id}" ${s.status === 'on' ? 'disabled' : ''}>開機</button>
      <button class="k-sb${a && a.k === 'stop' ? ' rec' : ''}" data-act="standby" data-id="${s.id}" ${s.status === 'standby' ? 'disabled' : ''}>待機</button>
      <button class="k-off" data-act="off" data-id="${s.id}" ${s.status === 'off' ? 'disabled' : ''}>關機</button>
      <button data-edit="${s.id}">編輯</button>
    </div></article>`;
}

/* ── 本次管制 ──────────────────────────────────────────────
   「還沒開始管制卻已經有一整排開機紀錄」的原因:
   時序以前是拿每個站臺的 `at`（＝「從什麼時候開始是這個狀態」）去畫,
   把「一直開著」當成「剛剛完成開機」。設備平常本來就是開的,
   那不是一次動作,不該出現在紀錄裡。

   改法是把「常態」跟「管制期間」分開:
   ① 時序改用 DB.log —— 那裡記的是**真的發生過的狀態變更**,不是目前狀態;
   ② 加上「本次管制」的起訖。沒有開始管制時,時序只顯示提示,不列任何東西;
      開始管制之後,只列這段期間內的變更。
   按下「開始管制」也會把回報的「已復機起算時間」一起推到那個時刻 ——
   兩者本來就是同一件事的兩個名字。                                   */
const ctlOn = () => !!(DB.ctl && DB.ctl.start && !DB.ctl.end);
function startCtl() {
  DB.ctl = { start: Date.now(), end: 0, ty: (DB.ty.name || '') };
  DB.since = DB.ctl.start;
  save(); renderStations(); generate();
  toast('已開始管制。之後的狀態變更才會進入本次紀錄');
}
function endCtl() {
  if (!confirm('結束本次管制？時序會保留這段期間的紀錄，之後的變更不再計入。')) return;
  DB.ctl.end = Date.now();
  save(); renderStations(); generate();
  toast('已結束管制');
}
/* 管制頁最上面一行：管制中就講從何時起（點了到時序看紀錄）,還沒開始就直接給「開始管制」——
   開始管制是颱風來時的第一個動作,不能藏在第三個子頁裡。 */
function ctlLine() {
  const c = DB.ctl || {};
  if (ctlOn()) {
    return `<button type="button" class="ctlbar on" data-sub="eq:log"><i></i><b>管制中${c.ty ? '　' + esc(c.ty) : ''}</b>
      <span>自 ${fmtShort(c.start)} 起 · ${Math.floor((Date.now() - c.start) / 3600000)} 小時</span><em>時序 ›</em></button>`;
  }
  return `<div class="ctlbar"><b>${c.end ? '管制已結束' : '尚未開始管制'}</b>
    <button class="btn pri sm" onclick="startCtl()">開始管制</button></div>`;
}
function ctlCard() {
  const c = DB.ctl || {};
  // 有起訖就能清：按錯「開始管制」或測試按出來的紀錄，不該永遠留在畫面上
  const clr = c.start ? `<div class="btnrow" style="margin-top:0.625rem">
      <button class="btn sm" data-clearlog>清除${c.end ? '這次管制與' : '本次'}紀錄</button></div>` : '';
  if (!ctlOn()) {
    return `<div class="card pad" style="margin-bottom:0.75rem">
      <div class="sw"><div class="sw-t"><b>${c.end ? '管制已結束' : '尚未開始管制'}</b>
        <small>${c.end ? `上次管制 ${fmtShort(c.start)} – ${fmtShort(c.end)}　下方為該期間的紀錄` :
          '按下後，每次開機／待機／關機才記進時序與回報（平常開機是常態，不算動作）'}</small></div>
        <button class="btn pri sm" onclick="startCtl()">開始管制</button></div>${clr}</div>`;
  }
  return `<div class="card pad" style="margin-bottom:0.75rem;border-color:var(--sb)">
    <div class="sw"><div class="sw-t"><b style="color:var(--sb)">管制中${c.ty ? `　${esc(c.ty)}` : ''}</b>
      <small>自 ${fmtShort(c.start)} 起　已 ${Math.floor((Date.now() - c.start) / 3600000)} 小時</small></div>
      <button class="btn sm" onclick="endCtl()">結束管制</button></div>${clr}</div>`;
}

function renderRail() {
  /* 時序要跟上面的清單一致 —— 上面看不到的站,下面卻在時序裡冒出來,
     會讓人以為清單漏了誰。 */
  const nameOf = n => DB.stations.find(x => x.name === n);
  const inView = n => {
    const st = nameOf(n);
    if (!st) return fType === 'all';             // 已刪除的站臺:全部類別時仍列出
    return IS_LIVE(st) && (fType === 'all' || st.type === fType) && (inReport(st) || fAux);
  };
  /* 上面那張卡與這裡必須講同一件事。以前這裡只看 `c.start`,
     管制結束之後卡片寫「尚未開始管制」、時序卻寫「本次管制自 05:57 起」,
     同一個畫面自相矛盾。改成三種狀態各自講各自的話。 */
  logIds();
  const c = DB.ctl || {};
  const on = ctlOn();
  if (!c.start) return '';            // 上面那張卡已經講了「按開始管制之後才記」,這裡不再重複
  const from = c.start, to = c.end || Infinity;
  const label = on ? `本次管制自 ${fmtShort(from)} 起`
    : `上次管制 ${fmtShort(from)} – ${fmtShort(c.end)}`;
  const evs = (DB.log || [])
    .filter(e => e && e.at >= from - 3600000 && e.at <= to && inView(e.name))
    .sort((a, b) => b.at - a.at);
  if (!evs.length) {
    return `<div class="msg i">${label}，${on ? '目前還沒有任何狀態變更' : '期間沒有任何狀態變更'}。${
      on ? '' : '要開始新的一輪，請按上方「開始管制」。'}</div>`;
  }
  const head = on ? '' : `<div class="msg i" style="margin-bottom:0.5rem">以下是${label}的紀錄。
    要開始新的一輪，請按上方「開始管制」。</div>`;
  let html = head + '<div class="rail">', day = '';
  for (const e of evs) {
    const st = nameOf(e.name);
    const d = new Date(e.at), dk = `${d.getMonth() + 1}/${d.getDate()}`;
    if (dk !== day) {
      day = dk;
      html += `<div class="rail-day"><b>${d.getMonth() + 1} 月 ${d.getDate()} 日</b><span>週${wk(e.at)}</span></div>`;
    }
    html += `<div class="ev">
      <div class="ev-t">${fmtClock(e.at)}</div>
      <div class="ev-l"><i class="ev-d" style="background:${S_COL[e.to] || 'var(--fg4)'}"></i></div>
      <button type="button" class="ev-b" data-evedit="${e.id}"><b>${esc(e.name)}</b><small>${[S_VERB[e.to] || '狀態變更',
        e.hum != null && e.to !== 'on' ? `濕度 ${e.hum}%` : '', st ? esc(typeOf(st.type).label) : '',
        e.from && e.from !== e.to ? `原 ${S_LABEL[e.from] || '—'}` : ''].filter(Boolean).map(x => `<span>${x}</span>`).join('')}${
        e.edited ? '<span class="ev-ed">已手動修改</span>' : ''}</small></button>
      <button type="button" class="ev-x" data-undo="${e.id}" aria-label="刪除 ${esc(e.name)} ${fmtClock(e.at)} 這筆紀錄">刪除</button>
    </div>`;
  }
  return html + '</div>';
}


// 管制、預判、時序三個子頁都在 #p-eq 裡：事件掛在整頁上,時序的「刪除」「清除紀錄」才接得到
$('#p-eq').addEventListener('change', e => {
  if (e.target.id === 'fSel') {
    const v = e.target.value;
    if (fStatus === 'plan') fStatus = 'all';
    if (v === 'plan') { fStatus = 'plan'; fType = 'all'; }
    else if (v === 'aux') { fType = 'all'; fAux = true; }
    else if (v.startsWith('t:')) {
      fType = v.slice(2);
      // 選了自用監看的類別,就得把自用監看一起放出來,不然選了卻是空的
      if (typeOf(fType).noReport) fAux = true;
    } else { fType = 'all'; fAux = false; }
    try { localStorage.setItem(AUX_KEY, fAux ? '1' : '0'); } catch (err) {}
    renderStations();
  } else if (e.target.id === 'sSel') {
    DB.cfg.sort = e.target.value; save(); renderStations();
  } else if (e.target.id === 'uSel') {
    fUnit = e.target.value; renderStations();
  }
});
$('#p-eq').addEventListener('click', e => {
  const chip = e.target.closest('[data-f]');
  if (chip) {
    // 統計卡：再點一次同一個就回到全部
    fStatus = (fStatus === chip.dataset.v && chip.dataset.v !== 'all') ? 'all' : chip.dataset.v;
    renderStations(); return;
  }
  const mv = e.target.closest('[data-mv]');
  if (mv) { moveStation(mv.dataset.id, mv.dataset.mv === 'up' ? -1 : 1); return; }
  const ed = e.target.closest('[data-edit]');
  if (ed) { openStation(ed.dataset.edit); return; }
  const un = e.target.closest('[data-undo]');
  if (un) { dropLog(un.dataset.undo, false); return; }
  const le = e.target.closest('[data-evedit]');
  if (le) { editLog(le.dataset.evedit); return; }
  if (e.target.closest('[data-clearlog]')) { clearCtlLog(); return; }
  const act = e.target.closest('[data-act]');
  if (act) {
    /* 風大預設待機；關機要人到現場才能復機，按錯代價高，在視窗裡多確認一次。
       以前用瀏覽器的 confirm()：iPhone 上跳出的系統對話框容易被當成沒反應（使用者回報「關機不能點」）。 */
    if (act.dataset.act === 'off') askOff(act.dataset.id);
    else setStatus(act.dataset.id, act.dataset.act);
  }
});

function askOff(id) {
  const s = DB.stations.find(x => x.id === id); if (!s) return;
  openSheet(`${s.name}　改為關機？`, `
    <div class="msg w" style="margin-bottom:0.875rem">風大時預設為<b>待機</b>，有特殊需要才關機（關機後要到現場才能復機）。</div>
    <label class="fld"><span class="lb">實際關機時間</span>
      <input type="datetime-local" id="off_at" value="${toInput(Date.now())}"></label>
    <div class="btnrow">
      <button class="btn dg" id="off_ok" style="flex:1">確定關機</button>
      <button class="btn" id="off_sb" style="flex:1">改成待機</button></div>`,
    () => {
      $('#off_ok').onclick = () => {
        const t = fromInput($('#off_at').value);
        if (t > Date.now() + 5 * 60000) return toast('時間在未來，請確認');
        closeSheet(); setStatus(id, 'off', t);
      };
      $('#off_sb').onclick = () => { closeSheet(); setStatus(id, 'standby'); };
    });
}

/* at：已經在確認視窗問過時間（關機）就直接用,不再跳一次時間視窗 */
function setStatus(id, to, at) {
  const s = DB.stations.find(x => x.id === id); if (!s) return;
  const from = s.status;
  /* prevAt／prevHum：按錯要能「整個退回去」。只把狀態改回來的話,
     站臺的 at 已經被蓋成剛剛,回報就會多一筆「完成開機」—— 誤按一次、通報錯一行。 */
  const e = { id: uid(), t: Date.now(), sid: s.id, name: s.name, from, to,
              prevAt: s.at, prevHum: s.hum ?? null };
  s.status = to; s.at = Number.isFinite(at) ? at : Date.now(); s.mt = Date.now();
  if (to === 'on') s.hum = null;
  e.at = s.at;
  DB.log.push(e);
  save(); renderStations(); renderTyphoon({}); generate();
  if (Number.isFinite(at)) toast(`${s.name}　${S_VERB[to]}　${fmtHM(s.at)}（按錯可在時序刪除）`);
  else askTime(e);
}

/* 按下開機／待機／關機後馬上問時間。現場常是「十分鐘前就關了,現在才回來按」,
   回報要的是實際動作的時間,不是按鈕的時間。預設現在,改了才動;按錯就在這裡復原。
   點背景或「確定」都算接受。 */
function askTime(e) {
  const s = logStation(e); if (!s) return;
  const q = m => toInput(Date.now() - m * 60000);
  openSheet(`${e.name}　${S_VERB[e.to] || ''}`, `
    <label class="fld"><span class="lb">實際動作時間</span>
      <input type="datetime-local" id="at_in" value="${toInput(e.at)}">
      <span class="sub">回報會寫這個時間。現在才按、但其實早就動作了，就改成實際的時間。</span></label>
    <div class="btnrow" style="margin:-0.25rem 0 1rem">
      ${[5, 10, 15, 30].map(m => `<button class="btn sm" data-ago="${m}">${m} 分鐘前</button>`).join('')}</div>
    <div class="btnrow">
      <button class="btn pri" id="at_ok" style="flex:1">確定</button>
      <button class="btn dg" id="at_undo" style="flex:1">按錯了，復原</button></div>`,
    () => {
      $$('[data-ago]').forEach(b => b.onclick = () => { $('#at_in').value = q(+b.dataset.ago); });
      $('#at_ok').onclick = () => {
        const t = fromInput($('#at_in').value);
        if (t > Date.now() + 5 * 60000) return toast('時間在未來，請確認');
        if (Math.abs(t - e.at) >= 60000) {
          e.at = t; s.at = t; s.mt = Date.now();
          save(); renderStations(); generate();
        }
        closeSheet(); toast(`${e.name}　${S_VERB[e.to]}　${fmtHM(e.at)}`);
      };
      $('#at_undo').onclick = () => { closeSheet(); dropLog(e.id, true); };
    });
}

/* ── 刪除紀錄 ─────────────────────────────────────────────
   刪的是「這個站最新的那一筆」而且站臺目前就是那一筆的結果 →
   把站臺退回上一個狀態與上一個時間（回報跟著恢復）。
   刪的是比較舊的那幾筆 → 只拿掉時序,不動站臺現況：現況是後來那些操作的結果。 */
function logStation(e) {
  return DB.stations.find(x => x.id === e.sid) || DB.stations.find(x => x.name === e.name);
}
/* 時序逐筆可改（使用者：狀態變更要能手動編輯,不然改不了）。
   改的是這站最新的一筆 → 站臺目前的狀態、時間、濕度跟著改,回報也跟著變；
   改的是比較舊的 → 只改時序：站臺現況是後來那幾筆操作的結果,不能被舊紀錄蓋掉。 */
function editLog(id) {
  const e = DB.log.find(x => x.id === id); if (!e) return;
  const st = logStation(e), latest = isLatestOf(e);
  const hum = latest && st ? st.hum : e.hum;
  openSheet(`${e.name}　修改紀錄`, `
    <div class="two">
      <label class="fld"><span class="lb">狀態</span><select id="le_to">${['on', 'standby', 'off'].map(k =>
        `<option value="${k}" ${e.to === k ? 'selected' : ''}>${S_LABEL[k]}</option>`).join('')}</select></label>
      <label class="fld"><span class="lb">濕度 %</span><input type="number" id="le_hum" min="0" max="100"
        inputmode="numeric" value="${hum ?? ''}" placeholder="—"></label>
    </div>
    <label class="fld"><span class="lb">時間</span><input type="datetime-local" id="le_at" value="${toInput(e.at)}"></label>
    <p class="hint" style="margin:-0.25rem 0 0.875rem">${latest
      ? `這是 ${esc(e.name)} 最新的一筆：改了，站臺目前狀態與回報會一起改。`
      : '這不是這站最新的一筆：只改時序，站臺目前狀態不變。'}</p>
    <div class="btnrow">
      <button class="btn pri" id="le_ok" style="flex:1">儲存</button>
      <button class="btn dg" id="le_del" style="flex:1">刪除這筆</button></div>`,
    () => {
      $('#le_ok').onclick = () => {
        const to = $('#le_to').value, at = fromInput($('#le_at').value), hv = $('#le_hum').value.trim();
        if (at > Date.now() + 5 * 60000) return toast('時間在未來，請確認');
        const h = hv === '' || to === 'on' ? null : clamp(+hv, 0, 100);
        e.to = to; e.at = at; e.hum = h; e.edited = Date.now();
        if (latest && st) { st.status = to; st.at = at; st.hum = h; st.mt = Date.now(); }
        save(); closeSheet(); renderStations(); renderTyphoon({}); generate();
        toast(`已修改：${e.name}　${S_VERB[to]}　${fmtHM(at)}`);
      };
      $('#le_del').onclick = () => { closeSheet(); dropLog(e.id, false); };
    });
}
function isLatestOf(e) {
  const later = DB.log.filter(x => x !== e && x.name === e.name && x.at >= e.at && x.t > e.t);
  const st = logStation(e);
  return !later.length && st && st.status === e.to;
}
function dropLog(id, quiet) {
  const i = DB.log.findIndex(x => x.id === id);
  if (i < 0) return;
  const e = DB.log[i];
  const st = logStation(e);
  const revert = isLatestOf(e) && e.from && S_LABEL[e.from];
  if (!quiet) {
    const msg = revert
      ? `刪除「${e.name}　${S_VERB[e.to] || ''}　${fmtShort(e.at)}」？\n${e.name} 會恢復成「${S_LABEL[e.from]}」，回報也會跟著改。`
      : `刪除「${e.name}　${S_VERB[e.to] || ''}　${fmtShort(e.at)}」這筆紀錄？\n只刪時序，${e.name} 目前的狀態不變。`;
    if (!confirm(msg)) return;
  }
  DB.log.splice(i, 1);
  if (revert && st) {
    st.status = e.from;
    // 舊紀錄沒有 prevAt：找這站上一筆變成 from 的紀錄,用它的時間
    const prev = DB.log.filter(x => x.name === e.name && x.to === e.from && x.at <= e.at).sort((a, b) => b.at - a.at)[0];
    st.at = Number.isFinite(e.prevAt) ? e.prevAt : (prev ? prev.at : st.at);
    /* 舊紀錄沒有 prevAt、也找不到上一筆時,退回「開機」不能留著剛剛的時間——
       那會被回報當成「剛完成開機」。開機是常態,當它從回報起算之前就是開著的。 */
    if (!Number.isFinite(e.prevAt) && !prev && e.from === 'on' && DB.since) st.at = Math.min(st.at, DB.since - 60000);
    if ('prevHum' in e) st.hum = e.prevHum;
    st.mt = Date.now();
  }
  save(); renderStations(); renderTyphoon({}); generate();
  toast(revert && st ? `已刪除，${st.name} 恢復成${S_LABEL[st.status]}` : '已刪除這筆紀錄');
}
/* 整段清掉：管制期間（含開始前一小時，跟時序顯示的範圍一致）的紀錄全部刪除。
   已結束的那一輪連管制起訖一起清掉,畫面回到「尚未開始管制」。站臺目前狀態不動。 */
function clearCtlLog() {
  const c = DB.ctl || {};
  if (!c.start) return;
  const from = c.start - 3600000, to = c.end || Infinity;
  const n = DB.log.filter(e => e && e.at >= from && e.at <= to).length;
  const ended = !!c.end;
  const nEv = (DB.events || []).length;
  if (!confirm(`清除${ended ? '上次' : '本次'}管制的 ${n} 筆狀態變更紀錄${nEv ? `、回報稿裡的 ${nEv} 句事件` : ''}${ended ? '，以及這次管制的起訖時間' : ''}？\n`
    + '站臺目前的狀態不會改。這個動作不能復原。')) return;
  DB.log = DB.log.filter(e => !(e && e.at >= from && e.at <= to));
  DB.events = [];                     // 事件跟著這次管制走,下一場颱風不該還掛著
  if (ended) DB.ctl = { start: 0, end: 0, ty: '' };
  save(); renderStations(); generate();
  toast(`已清除 ${n} 筆紀錄`);
}
function moveStation(id, d) {
  const i = DB.stations.findIndex(x => x.id === id);
  const j = i + d;
  if (i < 0 || j < 0 || j >= DB.stations.length) return;
  const [x] = DB.stations.splice(i, 1);
  DB.stations.splice(j, 0, x);
  save(); renderStations();
}

const cdTxt = ms => {

   「幾分鐘前」跟著倒數每 15 秒刷新——只寫時刻的話,畫面放著一小時也看不出來是舊的。 */
const ageTxt = ts => {

// 官方的移動預測原文「以每小時14轉21公里速度，向西北轉北北西進行」拆成速度與方向兩格
function moveParts(ty) {
  const t = ty.mvTxt || '';
  const sp = t.match(/每小時\s*([\d.]+(?:\s*轉\s*[\d.]+)?)\s*公里/), dr = t.match(/向(.+?)進行/);
  return {
    spd: sp ? sp[1].replace(/\s*轉\s*/, '→') : (ty.mvSpd ? String(ty.mvSpd) : '—'),

function bfBar(bf, g) {

}

// 官方颱風警報頁：固定網址,每次颱風都是當下那一報（含警報圖）。警報單 JSON 的 web 欄位指的是一般警特報頁,不是這個。
const TYWARN_URL = 'https://www.cwa.gov.tw/V8/C/P/Typhoon/TY_WARN.html';
/* 官方發布時間（使用者要的：海上、陸上警報幾點發布）。確定的寫第幾報；
   前面的報沒收到時寫「推算」或「前」,不把猜的寫成官方的。 */
function wtRows(wt) {
  if (!wt) return '';
  const D = ts => fmtShort(ts);
  const row = (label, x, none) => `<div class="wt-r"><span>${label}</span><b>${
    !x ? `<em>${none}</em>`
    : x.exact ? `${D(x.t)}<small>第 ${x.no} 報</small>`
    : x.guess ? `約 ${D(x.guess)}<small>推算（第 1 報沒收到，由第 ${x.no} 報往回推）</small>`
    : `${D(x.t)} 前<small>最早收到第 ${x.no} 報</small>`}</b></div>`;
  return `<div class="wtime">${row('海上颱風警報', wt.sea, '未發布')}${row('陸上颱風警報', wt.land, wt.end ? '未發布' : '尚未發布')}${
    wt.end ? row('解除颱風警報', { t: wt.end.t, no: wt.end.no, exact: true }, '') : ''}</div>`;
}

/* ── 強度排名（使用者：這顆是今年第幾大、歷史第幾大）──────────
   「大」照新聞的講法當「強」：比近中心最低氣壓（越低越強）,同氣壓不分先後。
   歷史表是 IBTrACS 西北太平洋（日本氣象廳最佳路徑,1951 年起）,後端每週重建成 data/tyhist.json；
   這顆颱風用中央氣象署分析的巔峰值去比——同一顆颱風兩個單位常差幾到十幾百帕,所以面板裡寫明是約略的排名。
   今年的資料是暫定的、每週才更新：收錄數比氣象署的颱風編號少時另外講,不讓「第 1 強」看起來比實際好。 */
let TYHIST = null, _tyhP = null;
function loadTyHist() {
  if (TYHIST || _tyhP) return _tyhP;
  _tyhP = getJSON(new URL('data/tyhist.json', location.href).href, 9000)
    .then(j => { if (j && Array.isArray(j.storms) && j.storms.length) { TYHIST = j; if (DB.ty.data) renderTyphoon({}); } })
    .catch(() => { _tyhP = null; });
  return _tyhP;
}
function peakPres(ty) {
  const ps = [ty.pres, ...(ty.past || []).map(p => p.pres)].filter(v => v > 800);
  return ps.length ? Math.min(...ps) : 0;
}
const peakWind = ty => Math.max(0, ...[ty.vmax, ...(ty.past || []).map(p => p.vmax)].filter(Number.isFinite));
function tyRank(ty) {
  if (!TYHIST || !ty) return null;
  const pres = peakPres(ty);
  if (!pres) return null;
  const yr = +ty.year || new Date(ty.t0).getFullYear(), en = String(ty.en || '').toUpperCase();
  // 這顆自己在表裡（暫定資料）要拿掉,用氣象署的數字代表它,不然會跟自己比
  const others = TYHIST.storms.filter(s => !(s[0] === yr && en && s[1] === en));
  const rank = arr => arr.filter(s => s[2] < pres).length + 1;
  const thisYr = others.filter(s => s[0] === yr);
  return { pres, yr, en, year: { rank: rank(thisYr), n: thisYr.length + 1, list: thisYr },
    hist: { rank: rank(others), n: others.length + 1, from: TYHIST.from || 1951 },
    tyNo: +ty.tyNo || 0, through: TYHIST.through || '', src: TYHIST.src || '', others };
}
function openRank() {
  const ty = DB.ty.data, rk = tyRank(ty);
  if (!rk) return;
  const kt2ms = kt => Math.round(kt * 0.5144);
  /* 表裡一列是 [年, 英文名, 最低氣壓, 最大風速 kt（0＝沒有）, 來源 J 日本氣象廳／U JTWC]。
     JTWC 的風是 1 分鐘平均,跟這裡的 10 分鐘平均不能放同一欄比,所以不列；1977 年前日本氣象廳沒有風速。 */
  const row = s => ({ y: s[0], n: s[1], p: s[2], ms: s[4] === 'U' || !s[3] ? null : kt2ms(s[3]), u: s[4] === 'U' });
  const me = { y: rk.yr, n: rk.en || ty.name, p: rk.pres, ms: peakWind(ty) || null, me: true };
  // 同氣壓時自己排前面：跟「第幾強」的算法（比它低的才算在前面）對得起來
  const top = (arr, k) => [...arr.map(row), me].sort((a, b) => a.p - b.p || (b.me ? 1 : 0) - (a.me ? 1 : 0)).slice(0, k);
  const tbl = rows => `<table class="impact rk"><tr><th>#</th><th>颱風</th><th>最低氣壓</th><th>最大風速</th></tr>${
    rows.map((r, i) => `<tr${r.me ? ' class="me"' : ''}><td>${i + 1}</td>
      <td class="nm">${r.me ? esc(ty.name) + ' ' : ''}${esc(r.n || '（未命名）')}${r.me ? '' : `<small>${r.y}${r.u ? '　JTWC' : ''}</small>`}</td>
      <td>${r.p} hPa</td><td>${r.ms == null ? '—' : `${r.ms} m/s`}</td></tr>`).join('')}</table>`;
  const lag = rk.tyNo && rk.year.n < rk.tyNo
    ? `今年表裡只收到 ${rk.year.n} 個（氣象署已編到第 ${rk.tyNo} 號），還沒收進來的那幾個不在排名裡。` : '';
  const nU = rk.year.list.filter(x => x[4] === 'U').length;
  const jtwc = nU ? `今年有 ${nU} 個日本氣象廳還沒出最終分析，先用美國聯合颱風警報中心（JTWC）的氣壓（標「JTWC」），口徑又更不同一些。` : '';
  openSheet(`${ty.name}　強度排名`, `
    <div class="cd-p"><b>今年第 ${rk.year.rank} 強</b><span>共 ${rk.year.n} 個</span></div>
    <div class="cd-p"><b>${rk.hist.from} 年以來第 ${rk.hist.rank} 強</b><span>西北太平洋 ${rk.hist.n.toLocaleString()} 個命名颱風</span></div>
    <p class="hint" style="margin:0.25rem 0 0.25rem">依近中心最低氣壓排名（越低越強），各單位分析值有落差，排名是約略的。</p>
    <details class="more" style="margin-bottom:0.75rem"><summary>資料來源與限制</summary><div class="hint">
      ${esc(ty.name)}用中央氣象署分析的巔峰 ${rk.pres} hPa；其他颱風用日本氣象廳最佳路徑（${esc(rk.src)}）。
      同一顆颱風不同單位的分析值常差幾到十幾百帕。${jtwc}${lag}</div></details>
    <div class="sec2">今年最強 5 個</div>${tbl(top(rk.year.list, 5))}
    <div class="sec2">${rk.hist.from} 年以來最強 5 個</div>${tbl(top(rk.others, 5))}
    <p class="hint" style="margin-top:0.625rem">歷史資料到 ${esc(String(rk.through).slice(0, 10))}，每週更新一次。</p>`);
}
window.openRank = openRank;

/* 陸上警戒常常是十幾個縣市：大半個臺灣都在裡面時改講「除了哪幾個」,一行講完 */
function zoneTxt(areas) {

      /* expires 是「下一報預計發布的時間」,過了還沒收到新的,多半是我們這邊排程晚了,不是警報解除了 */
      + (w.stale ? `<div class="msg w" style="margin:0.5rem 0 0">已過了下一報時間還沒收到新的一報——可能已經有更新的警報單（例如改發陸上警報），以官方為準。</div>` : '')
      + (land.length ? `<div class="wzone"><i>陸上</i><span>${zoneTxt(land)}</span></div>` : '')
      + (sea.length ? `<div class="wzone sea"><i>海上</i><span>${sea.map(esc).join('、')}</span></div>` : '');
  } else if (w) {
    // 有拿到警報單、而且確定沒有警報才講「沒有」;沒拿到就什麼都不講（沒有資料不等於沒有警報）
    warn = '<div class="wbadge none">目前沒有颱風警報<small>中央氣象署</small></div>';
  }
  const times = wtRows(warnTimes(ty));
  // 以前「警報時機預判」卡講的那幾種情況,濃縮成一句放在名牌裡
  const notes = [];
  if (WARN && !WARN.isTy) {
    notes.push(`目前是${TC_FULL[tcClass(ty.vmax)] || '熱帶性低氣壓'}，不會發布颱風警報（只發給 8 級以上的颱風）；氣象署改發豪大雨、強風特報。`);
  } else if (WARN && WARN.isTy && !WARN.sea && !WARN.land && !(w && w.active)) {
    notes.push('推估：暴風圈不會觸及臺灣近海，不會發布颱風警報。');
  }
  if (EXTRAP) notes.push('沒有官方預報路徑：時間軸與各站推估是照現在方向直線外推的，只能粗略參考。');

  // 資料時間：氣象署分析時刻與它離現在多久。超過 3 小時（颱風警報期間每 3 小時至少一報）就標黃
  const age = now - ty.t0;
  const tiles = [`<div class="${age > 3 * 3600000 ? 'stale' : ''}"><small>氣象署分析</small>
    <b>${fmtShort(ty.t0).replace(/\(.\)/, '')}</b><em>${relative(ty.t0)}</em></div>`];
  const cpa = WARN && WARN.cpa;
  if (cpa && cpa.t > now && cpa.d < CPA_MID) {
    tiles.push(`<div><small>距最接近臺灣（推估）</small><b data-cd="${cpa.t}">${cdTxt(cpa.t - now)}</b>
      <em>${fmtShort(cpa.t)}　約 ${Math.round(cpa.d)} km</em></div>`);
  }
  /* 《天然災害停止上班及上課作業辦法》第 10 條：全日或上午停止,前一日 19–22 時公告。
     只在陸上警報發布中才顯示 —— 沒有陸警時,這個倒數只會讓人以為今晚要宣布放假。 */
  if (w && w.active && w.isLand) {
    const d = new Date(now), at19 = new Date(d).setHours(19, 0, 0, 0), at22 = new Date(d).setHours(22, 0, 0, 0);
    if (now < at19) tiles.push(`<div><small>停班停課公告（法規）</small><b data-cd="${at19}">${cdTxt(at19 - now)}</b>
      <em>今晚 19–22 時公告明天</em></div>`);
    else if (now < at22) tiles.push(`<div class="hot"><small>停班停課公告（法規）</small><b>公告時段中</b>
      <em>今晚 22 時前公告明天</em></div>`);
  }
  const top = topProb();
  if (top) {
    tiles.push(`<button type="button" class="tile-btn" onclick="go('dg')"><small>侵襲機率最高（${top.src}）</small>
      <b>${esc(top.label)}</b><em>${esc(top.names)}</em></button>`);
  }

  // 位置描述：警報單有就用警報單原文（官方）,沒有才自己算距離與方位
  const pos = w && w.active && w.sec && w.sec['命名與位置']
    ? `${esc(w.sec['命名與位置'].replace(/^.*?(\d+日\d+時的中心位置)/, '$1'))}<span class="src">警報單</span>`
    : `中心北緯 ${ty.pos.lat.toFixed(1)} 度、東經 ${ty.pos.lng.toFixed(1)} 度，距臺灣約 ${Math.round(distToTaiwan(ty.pos))} 公里`
      + `（臺灣之${dirName(bearing({ lat: 23.7, lng: 121.0 }, ty.pos))}方）。<span class="src">推算</span>`;
  const bfV = ms2bf(ty.vmax), bfG = ty.gust ? ms2bf(ty.gust) : null, mv = moveParts(ty);

  const rk = tyRank(ty);
  // 今年前三、歷史前三十（約前 1.5%）才上色：第 25 強也塗橘色,等於每一顆都在喊
  const rank = rk ? `<button type="button" class="tyh-r" onclick="openRank()"
      aria-label="強度排名：今年第 ${rk.year.rank} 強，${rk.hist.from} 年以來第 ${rk.hist.rank} 強，巔峰 ${rk.pres} 百帕">
      <span${rk.year.rank <= 3 ? ' class="hot"' : ''}><small>今年</small><b><em>第</em>${rk.year.rank}<em>強</em></b></span>
      <span${rk.hist.rank <= 30 ? ' class="hot"' : ''}><small>${rk.hist.from} 年以來</small><b><em>第</em>${rk.hist.rank}<em>強</em></b></span>
      <span><small>巔峰氣壓</small><b>${rk.pres}<em>hPa</em></b></span></button>` : '';
  return `<div class="card tyh hud">
    ${kick ? `<div class="tyh-k">${esc(kick)}</div>` : ''}
    <div class="tyh-n"><b data-t="${esc(ty.name)}">${esc(ty.name)}</b><span>${esc(cls)}</span></div>
    ${rank}${warn}${times}
    ${notes.map(t => `<p class="tyh-note">${esc(t)}</p>`).join('')}
    <div class="tyh-c">${tiles.join('')}</div>
  </div>
  <div class="card pad lv">
    <div class="lv-h">${fmtShort(ty.t0)} 實況<span>${ty.official ? '中央氣象署分析' : 'GDACS（非官方）'}</span></div>
    <div class="lv-g">
      <div><small>中心氣壓</small><b>${ty.pres || '—'}<u>hPa</u></b></div>
      <div><small>移動</small><b>${esc(mv.spd)}<u>km/h</u></b><em>${esc(mv.dir)}</em></div>
      <div><small>近中心風</small><b>${bfV >= 17 ? '17+' : bfV}<u>級</u></b><em>${Math.round(ty.vmax)} m/s</em></div>
      <div><small>瞬間陣風</small><b>${bfG == null ? '—' : bfG >= 17 ? '17+' : bfG}<u>${bfG == null ? '' : '級'}</u></b><em>${ty.gust ? Math.round(ty.gust) + ' m/s' : ''}</em></div>
      <div><small>七級暴風半徑</small><b class="r7">${ty.r15 || '—'}<u>${ty.r15 ? 'km' : ''}</u></b>${ty.r15 ? '' : '<em>熱帶性低氣壓沒有暴風圈</em>'}</div>
      <div><small>十級暴風半徑</small><b class="r10">${ty.r25 || '—'}<u>${ty.r25 ? 'km' : ''}</u></b></div>
    </div>
    ${bfBar(bfV, bfG)}
    <p class="lv-p">${pos}</p>
  </div>`;
}

/* ── 颱風時間軸 ─────────────────────────────────────────────
   一眼看完「發生過什麼、現在在哪、接下來會怎樣」。紅點是現在。
   每一條都標來源：官方（氣象署分析／警報單）、預報（氣象署預報點）、推估（風哨自己算的）——
   三種的可信度不同,不能混成一樣的字。 */
function tyEvents(ty) {
  const ev = [], now = Date.now(), H = 3600000;
  const add = (t, txt, src) => { if (Number.isFinite(t)) ev.push({ t, txt, src }); };
  const past = (ty.past || []).filter(p => p.t && p.vmax);
  if (past.length) {
    add(past[0].t, `開始定位（${TC_FULL[tcClass(past[0].vmax)] || ''}）`, '官方');
    let prev = tcClass(past[0].vmax), peak = past[0];
    for (const p of past.slice(1)) {
      const c = tcClass(p.vmax);
      if (c !== prev) add(p.t, `${TC_RANK.indexOf(c) > TC_RANK.indexOf(prev) ? '增強' : '減弱'}為${TC_FULL[c]}`, '官方');
      prev = c;
      if (p.vmax > peak.vmax) peak = p;
    }
    if (peak !== past[past.length - 1] && peak.vmax >= TY_MIN_MS) add(peak.t, `最強：近中心風 ${bfLabel(ms2bf(peak.vmax))}`, '官方');
  }
  const wt = warnTimes(ty);
  if (wt) {
    if (wt.sea) add(wt.sea.guess || wt.sea.t, `發布海上颱風警報${wt.sea.exact ? '' : wt.sea.guess ? '（時間推算）' : '（最晚此時）'}`, '官方');
    if (wt.land) add(wt.land.t, `發布陸上颱風警報${wt.land.exact ? '' : '（最晚此時）'}`, '官方');
    if (wt.landOff && !(wt.end && wt.landOff.t === wt.end.t)) add(wt.landOff.t, `解除陸上颱風警報${wt.landOff.exact ? '' : '（最晚此時）'}`, '官方');
    if (wt.end) add(wt.end.t, '解除颱風警報', '官方');
  }
  add(now, `現在：${TC_FULL[tcClass(ty.vmax)] || ''} ${bfLabel(ms2bf(ty.vmax))}，距臺灣約 ${Math.round(distToTaiwan(ty.pos))} 公里`, 'now');
  // 預報：強度等級的變化與狀態轉變（變性為溫帶氣旋）——氣象署預報點本身就有
  let pc = tcClass(ty.vmax);
  for (const f of ty.track || []) {
    const t = ty.t0 + f.tau * H;
    if (f.vmax > 0) {
      const c = tcClass(f.vmax);
      if (c !== pc) add(t, `預報${TC_RANK.indexOf(c) > TC_RANK.indexOf(pc) ? '增強' : '減弱'}為${TC_FULL[c]}`, '預報');
      pc = c;
    }
    if (f.st) add(t, `預報${f.st}`, '預報');
  }
  // 推估：還沒發布的警報何時可能發布（發布後由上面的官方時間取代）、暴風圈進出警報範圍、最接近臺灣
  if (WARN && WARN.isTy && !EXTRAP) {
    if (WARN.sea && !(wt && wt.sea) && WARN.sea.issue > now) add(WARN.sea.issue, '可能發布海上颱風警報', '推估');
    if (WARN.land && !(wt && wt.land) && WARN.land.issue > now) add(WARN.land.issue, '可能發布陸上颱風警報', '推估');
    if (WARN.sea && WARN.sea.affect > now) add(WARN.sea.affect, '暴風圈進入近海（海警範圍）', '推估');
    if (WARN.land && WARN.land.affect > now) add(WARN.land.affect, '暴風圈觸及陸地（陸警範圍）', '推估');
    if (WARN.cpa && WARN.cpa.t > now && WARN.cpa.d < CPA_MID) add(WARN.cpa.t, `最接近臺灣，約 ${Math.round(WARN.cpa.d)} 公里`, '推估');
    if (WARN.land && WARN.land.clear > now) add(WARN.land.clear, '暴風圈離開陸地', '推估');
    if (WARN.sea && WARN.sea.clear > now) add(WARN.sea.clear, '暴風圈離開近海，可望解除警報', '推估');
  }
  /* 應變三段是我們的建議,另標「建議」——就算觸發它的是官方的解除警報,也不能跟官方事件寫在同一格。
     開設提前、撤除延後的小時數在設定改。 */
  const mp = meetPlan();
  if (mp) {
    add(mp.open, '應變開設', '建議');
    if (mp.shrink != null) add(mp.shrink, '應變縮編', '建議');
    if (mp.close != null) add(mp.close, mp.rainHold.length ? `應變撤除（${mp.rainHold.join('、')}仍有豪雨特報）` : '應變撤除', '建議');
  }
  return ev.sort((a, b) => a.t - b.t || (a.src === 'now' ? 1 : 0) - (b.src === 'now' ? 1 : 0));
}
function eventsCard(ty) {
  const ev = tyEvents(ty);
  if (ev.length < 2) return '';
  const SRC = { 官方: 'off', 預報: 'fc', 推估: 'est', 建議: 'adv' };
  const now = Date.now(), cut = now - 24 * 3600000;
  const li = e => {
    const st = e.src === 'now' ? 'cur' : e.t <= now ? 'past' : '';
    return `<li class="${st}"><time>${fmtShort(e.t)}</time>${esc(e.txt)}${e.src !== 'now'
      ? `<span class="esrc ${SRC[e.src]}">${e.src}</span>` : ''}</li>`;
  };
  // 一天以前的收起來：颱風追了一個禮拜,時間軸會比整頁還長；要看再點開
  const old = ev.filter(e => e.t < cut && e.src !== 'now'), recent = ev.filter(e => !old.includes(e));
  return `<div class="sec"><h2>颱風時間軸</h2><span class="hint" style="margin-left:auto">紅點是現在</span></div>
    ${old.length ? `<details class="fold evt-old"><summary>更早 ${old.length} 則<span class="fold-s">${fmtShort(old[0].t)} 起</span></summary>
      <ol class="evt">${old.map(li).join('')}</ol></details>` : ''}
    <ol class="evt">${recent.map(li).join('')}</ol>`;
}

function renderTyphoon(o) {
  o = o || {};
  if (o.note !== undefined) _loadNote = o.note || '';
  const note = _loadNote;
  const msg = $('#tyMsg'), body = $('#tyBody');
  const ty = DB.ty.data;
  if (o.loading) { _loadEnd = null; msg.innerHTML = '<div class="msg i">查詢中…</div>'; return; }
  /* 「查詢失敗」與「查無颱風」要記住。切分頁、改站臺都會不帶參數重畫一次,
     以前一重畫就掉到下面「尚未取得颱風資料、請去填授權碼」——
     後端明明設好了、只是這一輪連不上，同事看到的卻是叫他去設定。
     手上已有颱風資料時不套用：那時候顯示資料，比一句舊的錯誤有用。 */
  if (o.error || o.none) _loadEnd = o.error ? { error: o.error } : { none: true };
  else if (!ty && _loadEnd) o = Object.assign({}, o, _loadEnd);
  /* 雷電與天氣跟颱風無關 —— 夏天午後雷陣雨正是最常要關機的日子,而那天多半沒有颱風。
     以前這兩頁只在「有颱風資料」的分支裡畫,沒颱風時被 clearTyPanes 清空,
     最需要它們的時候反而是一片空白。所以放在所有分支之前。 */
  /* 這兩張各自包起來：任何一張算不出來,只在那一張寫原因——以前丟錯整個 renderTyphoon 停在半路,
     畫面停在上一次的樣子（使用者看到的是「一直定位中、沒反應」）。 */
  safeHtml('#tyThunder', thunderCard, '雷電');
  safeHtml('#tyWx', wxCard, '天氣');
  renderDg();                       // 停班停課頁不管有沒有颱風都要更新（推估跟著路徑變）
  renderEnd();                      // 撤除檢核也是：颱風消散、資料拿不到了,檢核還是要做完
  /* 取不到官方資料時會默默退回 GDACS 或空白,看起來像「氣象署沒發布」——其實多半是直連被擋。
     把真正的原因留在畫面上（有官方資料時不講,那時候講的是過去的失敗）。 */
  let diag = '';
  try { diag = cwaDiag(); } catch (e) { diag = ''; }
  const diagHtml = diag && !(ty && ty.official)
    ? `<div class="msg w">取不到中央氣象署官方資料：${esc(diag)}</div>` : '';
  if (o.error) {
    msg.innerHTML = `<div class="tybar"><b>中央氣象署</b>${updAt(DB.ty.at)}`
      + '<button class="act" onclick="loadTyphoon(true)">更新</button></div>'
      + `<div class="msg e">連線失敗：${esc(o.error)}。站臺管制與回報產出不需要網路，可照常使用。</div>` + diagHtml;
    return;
  }
  if (o.none) {
    // 什麼都沒查到的時候,原因反而最該講出來 ——
    // 以前這裡把 note 丟掉,結果「氣象署沒發布」和「我們把資料解析壞了」
    // 都只會顯示同一句「查無熱帶氣旋」。
    msg.innerHTML = `<div class="tybar"><b>中央氣象署</b>${updAt(DB.ty.at)}`
      + '<button class="act" onclick="loadTyphoon(true)">更新</button></div>'
      + (note ? `<div class="msg w">${esc(note)}</div>` : '') + diagHtml
      + '<div class="msg i">目前查無活動中的熱帶氣旋。</div>';
    body.innerHTML = ''; $('#mapWrap').style.display = 'none';
    clearTyPanes(); return;
  }

  if (!ty) {
    msg.innerHTML = `<div class="tybar"><b>中央氣象署</b>${updAt(DB.ty.at)}`
      + '<button class="act" onclick="loadTyphoon(true)">更新</button></div>'
      + (note ? `<div class="msg w">${esc(note)}</div>` : '') + diagHtml;
    body.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 12c0-3 2.5-5 5.5-5S22 9 20 11c-3 3-8 1-8 1zM12 12c0 3-2.5 5-5.5 5S2 15 4 13c3-3 8-1 8-1z"/></svg>
      <b>尚未取得颱風資料</b>
      <p>按「立即查詢」取得中央氣象署路徑潛勢預報（站臺後端代抓，不必自備授權碼），即可推算警報時機與各站臺的待機、復機時間。</p>
      <div class="btnrow" style="max-width:20rem;margin:0 auto">
        <button class="btn pri" onclick="loadTyphoon(true)">立即查詢</button>
        <button class="btn" onclick="go('cfg')">前往設定</button></div></div>`;
    $('#mapWrap').style.display = 'none'; clearTyPanes();
    return;
  }

  /* 資料放久了要講。
     這支程式是「快取優先」而且颱風天訊號常常斷,畫面上明明有數字、
     其實可能是一小時前的 —— 過期的颱風資訊比沒有資訊更危險,
     所以超過門檻就明講幾分鐘前,不要讓人以為看到的是即時的。 */
  const ageMin = DB.ty.at ? Math.floor((Date.now() - DB.ty.at) / 60000) : -1;
  const stale = ageMin >= 30
    ? `<div class="msg ${ageMin >= 90 ? 'e' : 'w'}">資料已是 ${ageMin >= 120
        ? Math.floor(ageMin / 60) + ' 小時' : ageMin + ' 分鐘'}前取得的，`
      + `可能已經不是現況。按上方「更新」重新取得。</div>`
    : '';
  /* 一行帶過。「關機與警報時機為推估，以氣象署警報單為準」那句話,
     在警報卡、衝擊表、播報稿裡各講過一次,這裡再講第四次不會多提醒到誰。 */
  msg.innerHTML = `<div class="tybar"><b>${ty.official ? '中央氣象署' : 'GDACS（非官方）'}</b>`
    + `${updAt(DB.ty.at)}<button class="act" onclick="loadTyphoon(true)">更新</button></div>`
    + (note ? `<div class="msg w">${esc(note)}</div>` : '') + diagHtml + stale;

  $('#tyPick').innerHTML = typhoonPicker();
  loadTyHist();
  /* 播報稿畫在「戰情 › 播報員」（要抄進通報、要唸出來的材料）；
     總覽＝名牌（官方警報、警戒區、發布時間）＋實況＋摘要＋時間軸（警報時機推估、應變會議都在時間軸）。
     （天氣、雷電、停班課在函式開頭就畫好了,不受有沒有颱風影響。） */
  $('#tyBrief').innerHTML = briefCard();
  $('#tyEvt').innerHTML = eventsCard(ty);
  const wN = warnFor(ty);
  body.innerHTML = heroCard(ty) + glanceCard(!!(wN && wN.active));

  drawMap(ty);
  renderImpact();
  renderForecast();
}

/* ── 各縣市停班停課「官方」資訊 ─────────────────────────────
   使用者要的是官方公告本身,不是我的推估。這裡分兩件事處理:

   ① **官方基準**：《天然災害停止上班及上課作業辦法》第四條附表已經內建
      （DGPA_COUNTY）,那是法規附表,可以直接列給人看。
   ② **官方即時公告**：行政院人事行政總處的「天然災害停止上班及上課情形」。
      **我沒有驗證過任何可跨網域取用的官方資料端點** —— 這個開發環境連不到
      dgpa.gov.tw,無從確認。憑猜測寫一個網址上去,就是重演抓 W-C0034-003
      （平台上根本不存在的資料集）那個錯:畫面上會出現一個永遠失敗、
      或更糟、成功但內容是別的東西的區塊。
      所以做法是:預設只給官方頁面的連結,另外開一個設定欄位,
      使用者拿到可用的 JSON 端點時自己填進來,程式才會去抓。         */
let DGPA_LIVE = null, DGPA_LIVE_AT = 0, DGPA_LIVE_ERR = '', DGPA_HEAD = '', DGPA_UPD = '';
/* 公告從哪來：live＝即時（代理或自訂來源）、backend＝GitHub Actions 抓好的 data/dgpa.json。
   DGPA_NOTE 記「即時抓不到、改用後端」這種事,畫面上要講,不能默默換來源。 */
let DGPA_SRC = '', DGPA_NOTE = '', DGPA_BUSY = false;
const DGPA_FILE = 'data/dgpa.json';
/* 沒有颱風的日子,官方那張表裡一列縣市都沒有,只有一格
   「無停班停課訊息。」。那是**有效的答案**,不是解析失敗 ——
   原本一律當成「找不到縣市資料（來源格式可能變了）」報錯,
   等於在風平浪靜的日子天天對值班的人謊報來源壞掉。 */
let DGPA_NONE = false;
const DGPA_NONE_RE = /無停班停課訊息|無停止上班上課|尚無停班停課|無停班、?停課/;

/* 解析官方那張表。結構（實際回應）:
     <TABLE id="Table"> … <TD headers='city_Name'><FONT>基隆市</FONT></TD>
     <TD headers='StopWorkSchool_Info'>
       <FONT color=#000080>今天照常上班、照常上課。</FONT><br>
       <FONT color=#FF0000>明天停止上班、停止上課。</FONT> … </TD>
   紅字（#FF0000）＝有停班停課,藍字（#000080）＝照常。
   最後一列是備註,只有一個 colspan 的 TD,沒有 city_Name,自然會被略過。
   縣市以外的細項（「○○鎮○○里:今天晚上06:00起…」）原樣保留 ——
   那正是值班的人要看的那一行,不能只留縣市層級的結論。            */
function parseDgpaHtml(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const t = doc.querySelector('#Table') || doc.querySelector('table');
  const head = doc.querySelector('.Header_YMD');
  DGPA_HEAD = head ? head.textContent.trim().replace(/\s+/g, ' ') : '';
  const upd = doc.querySelector('.Content_Updata');
  const m = upd && upd.textContent.match(/更新時間：([\d\/: -]+)/);
  /* 官方寫的是「2026/08/25 06:47:16」。年份與秒在這裡沒有用 ——
     公告本來就是今天的,秒數也不會改變任何決定。留「08/25 06:47」。 */
  DGPA_UPD = m ? m[1].trim().replace(/^\d{4}[\/-]/, '').replace(/:\d{2}$/, '') : '';
  DGPA_NONE = false;
  if (!t) return [];
  /* 表格在、但整張表寫著「無停班停課訊息。」—— 這是官方的答案本身,
     不是抓不到。記下來,下面 rows 為空時才分得出是「今天沒事」
     還是「頁面格式真的變了」。 */
  if (DGPA_NONE_RE.test(t.textContent.replace(/\s+/g, ''))) DGPA_NONE = true;
  const out = [];
  for (const tr of t.querySelectorAll('tr')) {
    const all = [...tr.querySelectorAll('td')];
    /* 每一區的第一列前面多一格「北部地區／東部地區…」（跨列合併）,縣市不在第一格。
       以前只看第一格,基隆、苗栗、嘉義市、宜蘭、澎湖這五個每區第一名的縣市整列被跳過——
       停班停課頁和出門評估都說「沒有資料」。先認官方標的 headers="city_Name …",再找以縣、市結尾的格。 */
    let ci = all.findIndex(td => /city_Name/.test(td.getAttribute('headers') || ''));
    if (ci < 0) ci = all.findIndex(td => /^[^\s]{1,5}[縣市]$/.test(td.textContent.trim().replace(/\s+/g, '')));
    if (ci < 0 || ci + 1 >= all.length) continue;       // 表頭、備註列
    const tds = all.slice(ci);
    const county = tds[0].textContent.trim().replace(/\s+/g, '');
    if (!county || !/[縣市]$/.test(county)) continue;    // 表頭與雜項
    /* 每一行分兩件事看:停不停,以及**停的是整個縣市還是某幾個區／鄉／里**。
       官方那張表在高雄市、屏東縣這種情況下,整格裡一條全縣的敘述都沒有,
       只有「六龜區:今天停止上班、停止上課。」這種逐區的。
       如果把整個縣市塗紅,等於說高雄市全市放假 —— 那天並沒有。
       判斷方式:行首有「○○區:」「○○鄉:」「○○里:」這種前綴的就是局部。 */
    const PART_RE = /^[^:：]{1,18}(區|鄉|鎮|市|里|村|部落|分校|國民小學|國小|國中|高中)[^:：]{0,12}[:：]/;
    /* 「明天未達停止上班及上課標準。」也含「停止上班」四個字——以前被當成停班,
       金門縣「今天照常、明天未達」被標成「明日停」；隔天看昨晚那份公告時還會變成「今日停」。 */
    const isStop = (txt, red) => !/未達|照常|不停止/.test(txt) && (/停止上班|停止上課/.test(txt) || red);
    const lines = [];
    let full = false, part = false;
    const add = (txt, stop) => {
      const scope = PART_RE.test(txt) ? 'part' : 'all';
      if (stop) { if (scope === 'all') full = true; else part = true; }
      lines.push({ txt, stop, scope });
    };
    for (const f of tds[1].querySelectorAll('font, span')) {
      const txt = f.textContent.trim().replace(/\s+/g, ' ');
      if (!txt) continue;
      const col = (f.getAttribute('color') || '').toUpperCase();
      add(txt, isStop(txt, col === '#FF0000' || col === 'FF0000'));
    }
    if (!lines.length) {
      const txt = tds[1].textContent.trim().replace(/\s+/g, ' ');
      if (txt) add(txt, isStop(txt, false));
    }
    out.push({ county, lines, full, part, alert: full || part });
  }
  return out;
}

/* 也接 JSON —— 使用者若自備一個整理好的端點,不必被逼著回傳 HTML。 */
function parseDgpaJson(j) {
  const rows = Array.isArray(j) ? j
    : (j && (j.records || j.data || j.result || j.list)) || [];
  if (!Array.isArray(rows)) return [];
  return rows.map(r => {
    if (!r || typeof r !== 'object') return null;
    const county = pick(r, 'county', 'County', 'countyName', 'CountyName', 'name', 'area', '縣市');
    if (!county) return null;
    const parts = [pick(r, 'work', 'Work', 'status', '上班'), pick(r, 'school', 'School', '上課'),
      pick(r, 'note', 'Note', '備註')].filter(Boolean).map(String);
    const txt = parts.join('、');
    // 逐欄看：「未達停止上班標準」「照常上班」不是停,但不能因為上課那欄寫照常就把上班那欄的停班蓋掉
    const stop = parts.some(x => /停止上班|停止上課|停班|停課/.test(x) && !/未達|照常|不停止/.test(x));
    return { county: String(county), lines: txt ? [{ txt, stop, scope: 'all' }] : [],
      full: stop, part: false, alert: stop };
  }).filter(Boolean);
}

/* 停班停課公告：① 即時（設定裡的代理或自訂來源,預設是公開的轉發 Worker）→ ② 後端抓好的 data/dgpa.json。
   使用者回報「停班課頁的更新壞掉了」：第三方代理一掛,以前就只剩一句「Failed to fetch」。
   後端（GitHub Actions）在伺服器端直接抓官方頁,沒有 CORS 的問題；即時那條 8 秒拿不到就改用它,
   並在畫面上寫「後端 HH:MM 抓的」——後端跟著排程跑,可能慢一兩個小時,不能當成即時。 */
async function fetchDgpaLive(url) {
  const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 8000);
  try {
    const r = await fetch(url, { cache: 'no-store', signal: ac.signal });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const body = await r.text();
    const isJson = /^\s*[[{]/.test(body);
    const rows = isJson ? parseDgpaJson(JSON.parse(body)) : parseDgpaHtml(body);
    // 自訂 JSON 端點回一個空陣列,意思就是「今天沒有任何縣市停班停課」
    if (isJson) DGPA_NONE = !rows.length;
    // 一列縣市都沒有,但官方明講「無停班停課訊息」—— 那是答案,不是失敗
    if (!rows.length && !DGPA_NONE) throw new Error('回應中找不到縣市資料（來源格式可能變了）');
    return rows;
  } catch (e) {
    // 瀏覽器只回「Failed to fetch」這種英文：轉發服務掛了、被擋或沒網路都長這樣,換成看得懂的話
    throw new Error(e && e.name === 'AbortError' ? '8 秒沒有回應'
      : e instanceof TypeError ? '連不上轉發服務' : String((e && e.message) || e));
  } finally { clearTimeout(tm); }
}
async function fetchDgpaFile() {
  // no-cache：GitHub Pages 讓瀏覽器把檔案留 10 分鐘,按「更新」不能拿那份,要回伺服器問（沒變只回 304,不多花流量）
  const j = await getJSON(new URL(DGPA_FILE, location.href).href, 9000, { cache: 'no-cache' }).catch(() => null);
  if (!j) throw new Error('後端還沒有這份檔案');
  if (!j.html) throw new Error(j.error ? `後端也抓不到（${j.error}）` : '後端還沒抓到資料');
  const rows = parseDgpaHtml(j.html);
  if (!rows.length && !DGPA_NONE) throw new Error('後端那份找不到縣市資料');
  return { rows, at: Date.parse(j.fetched) || 0, err: j.error || '' };
}
async function fetchDgpa(manual) {
  if (DGPA_BUSY) return;
  const cfgUrl = (DB.cfg.dgpaUrl || '').trim();
  const proxy = DB.cfg.dgpaProxy === undefined ? DGPA_PROXY_DEFAULT : String(DB.cfg.dgpaProxy || '');
  const url = cfgUrl || (proxy ? proxy + encodeURIComponent(DGPA_URL) : '');
  DGPA_BUSY = true;
  if (manual) renderDg();                     // 按鈕先變「更新中…」,不然看起來像按了沒反應
  let liveErr = '';
  try {
    if (url) {
      try {
        DGPA_LIVE = await fetchDgpaLive(url);
        DGPA_LIVE_AT = Date.now(); DGPA_SRC = 'live'; DGPA_NOTE = ''; DGPA_LIVE_ERR = '';
      } catch (e) { liveErr = e.message; }
    }
    if (!url || liveErr) {
      try {
        const b = await fetchDgpaFile();
        DGPA_LIVE = b.rows; DGPA_LIVE_AT = b.at; DGPA_SRC = 'backend'; DGPA_LIVE_ERR = '';
        DGPA_NOTE = liveErr ? `即時抓不到（${liveErr}），改用後端 ${b.at ? fmtShort(b.at) : ''} 抓的公告` : '';
        if (b.err) DGPA_NOTE += `${DGPA_NOTE ? '；' : ''}後端最近一次沒抓到（${b.err}），這份是上一次成功的`;
      } catch (e2) {
        DGPA_LIVE = null; DGPA_NONE = false; DGPA_SRC = ''; DGPA_NOTE = '';
        DGPA_LIVE_ERR = [liveErr && `即時：${liveErr}`, `後端：${e2.message}`].filter(Boolean).join('；');
      }
    }
    if (DGPA_LIVE) { try { recordCmp(); } catch (e3) { console.warn('停班停課比對記錄失敗', e3); } }
  } finally { DGPA_BUSY = false; }
  renderDg();
  // 天氣頁的出門評估也看停班停課；自動更新時公告常比雨量晚回來,不重畫的話卡片會漏掉它
  if (!manual) { const w = $('#tyWx'); if (w) w.innerHTML = wxCard(); }
  if (manual) {
    renderTyphoon({});
    toast(DGPA_LIVE
      ? (DGPA_SRC === 'live' ? `停班停課公告已更新${DGPA_UPD ? `（官方 ${DGPA_UPD}）` : ''}`
        : `即時抓不到，改用後端 ${DGPA_LIVE_AT ? fmtClock(DGPA_LIVE_AT) : ''} 抓的公告`)
      : '停班停課公告抓不到，原因寫在頁面上');
  }
}

/* 我自己的站臺與關注地點落在哪些縣市 —— 只把那幾個縣市挑出來排在最前面,
   二十二個縣市全列一次,要找自己的那一個還得用眼睛掃。 */
function myCounties() {
  const set = new Set();
  for (const x of DB.stations) { if (!IS_LIVE(x)) continue; const c = countyOf(x); if (c) set.add(c); }
  return [...set];
}

/* ── 天氣 ────────────────────────────────────────────────
   分三段,因為這三段的資料來源與可信度完全不同:
   ① **現在**:雨量站的 10 分鐘累積 —— **實測**,不是預報。
   ② **未來 2 天**:鄉鎮預報逐 3 小時 —— 照原始時距,不內插成 1 小時。
   ③ **第 3 天起**:1 週預報,12 小時一格,只講早上／晚上。
   每一段都標明是實測還是預報,這是這支程式一貫的規矩。          */
/* ── 天氣要看哪裡 ─────────────────────────────────────────
   以前是「清單裡第一個有座標的站臺」—— 那是**實作的順序**,不是
   使用者的選擇。值班的人手上可能有五個站,想看的常常不是第一個;
   人也可能就站在現場,那時最準的參考點是「我現在人在這裡」。      */
const WXLOC_GEO = '__geo__';
let GEO = null, GEO_ERR = '', GEO_BUSY = false;

// 可選的站臺:要有座標才談得上天氣。排序沿用設定裡的清單排序（預設由北至南）。
const wxSites = () => sortForList(
  DB.stations.filter(x => IS_LIVE(x) && Number.isFinite(x.lat) && Number.isFinite(x.lng)));

/* 目前正在細看的那一個地點。「全部站臺」模式沒有單一地點,回傳 null ——
   讓呼叫端自己決定要怎麼辦,而不是偷偷挑一站當成使用者選的。 */
/* 現在位置叫什麼地方：最近的雨量站（一千多站,幾公里內一定有）所在的縣市鄉鎮——使用者要「大里」這種。
   不接外部的地址反查服務：要多送一次位置出去,離線也不能用。超過 8 公里就只寫縣市。 */
function placeOf(site) {
  if (!site || !Number.isFinite(site.lat) || !Number.isFinite(site.lng)) return '';
  const near = [nearestIn(RAIN.filter(o => o.town), site), nearestIn(OBS.filter(o => o.town), site)]
    .filter(Boolean).sort((a, b) => a.km - b.km)[0];
  if (near && near.km <= 8) return `${near.o.county}${near.o.town}`;
  return countyOf(site);
}
function wxSite() {
  const pick = DB.cfg.wxLoc || '';
  if (!pick) return null;                       // 全部站臺
  if (pick === WXLOC_GEO) {
    return GEO
      ? { id: WXLOC_GEO, name: '現在位置', lat: GEO.lat, lng: GEO.lng, geo: true, at: GEO.at }
      : { id: WXLOC_GEO, name: '現在位置', lat: NaN, lng: NaN, geo: true, pending: true };
  }
  const hit = wxSites().find(x => x.id === pick);
  if (hit) return hit;
  /* 選過的站臺被刪掉或被改成未建置了。不要靜靜換一站當成沒事 ——
     畫面上會是別的地方的天氣,而使用者以為還是原本那個。 */
  return { id: pick, name: '（已選的站臺不存在）', lat: NaN, lng: NaN, gone: true };
}


/* 位置以前只放在記憶體：App 一改版就自動重新載入,「現在位置」變回「尚未定位」,
   使用者看到的是「現在位置壞掉了」。存在自己的鍵（不進備份匯出檔）,12 小時內的拿來先用,
   畫面上有定位時間；允許過定位的話背景再重定一次。 */
const GEO_KEY = 'galepost.geo', GEO_KEEP = 12 * 3600000;
function geoLoad() {
  try {
    const g = JSON.parse(localStorage.getItem(GEO_KEY) || 'null');
    if (g && Number.isFinite(g.lat) && Number.isFinite(g.lng) && Date.now() - g.at < GEO_KEEP) GEO = g;
  } catch (e) { /* 私密瀏覽、儲存被擋：當成沒有存過 */ }
}
let _geoT = null;
function safeHtml(sel, fn, name) {
  const el = $(sel); if (!el) return;
  try { el.innerHTML = fn(); } catch (e) {
    console.error(name, e);
    el.innerHTML = `<div class="msg e">${esc(name)}這一區算不出來：${esc((e && e.message) || e)}`
      + `<br><small>${esc(String((e && e.stack) || '').split('\n').slice(0, 2).join(' ／ '))}</small>`
      + `<br>請截圖給維護的人（${esc(APP_VER)}）。</div>`;
  }
}
function locateMe() {
  if (!navigator.geolocation) { GEO_ERR = '這個瀏覽器沒有定位功能'; renderTyphoon({}); return; }
  GEO_BUSY = true; GEO_ERR = '';
  // 「定位中…」的畫面晚一拍畫：先把定位送出去,畫面就算出錯也不會擋住定位（以前畫面丟錯,定位根本沒送出）
  setTimeout(() => { try { renderTyphoon({}); } catch (e) { reportErr(e); } }, 0);
  /* iPhone 關掉權限詢問視窗時,有時兩個回呼都不會來——「定位中…」會永遠卡著。15 秒還沒回音就放掉 */
  clearTimeout(_geoT);
  _geoT = setTimeout(() => {
    if (!GEO_BUSY) return;
    GEO_BUSY = false; GEO_ERR = '定位沒有回應（可能權限視窗被關掉），請再按一次，或到瀏覽器設定允許此網站取用位置';
    renderTyphoon({});
  }, 15000);
  navigator.geolocation.getCurrentPosition(
    p => {
      clearTimeout(_geoT);
      GEO = { lat: p.coords.latitude, lng: p.coords.longitude, at: Date.now(),
        acc: Math.round(p.coords.accuracy || 0) };
      try { localStorage.setItem(GEO_KEY, JSON.stringify(GEO)); } catch (e) { /* 存不了就只留在這次 */ }
      GEO_BUSY = false; GEO_ERR = '';
      DB.cfg.wxLoc = WXLOC_GEO; save();
      try { renderTyphoon({}); } catch (e) { reportErr(e); }
    },
    e => {
      clearTimeout(_geoT);
      GEO_BUSY = false;
      /* 講清楚是哪一種失敗。「定位失敗」四個字讓人不知道要去開權限
         還是走到窗邊 —— 這兩件事要做的動作完全不同。 */
      GEO_ERR = e && e.code === 1 ? '定位權限被拒絕。iPhone：設定 › 隱私權與安全性 › 定位服務要開著，裡面的「Safari 網站」選「使用 App 期間」；'
          + '再到 Safari 網址列左邊的「大小」› 網站設定 › 位置，改成「允許」或「詢問」，回來按「取得目前位置」'
        : e && e.code === 2 ? '取不到位置訊號（室內或關閉定位服務時常見）'
        : e && e.code === 3 ? '定位逾時，請再試一次'
        : '定位失敗';
      renderTyphoon({});
    },
    /* 不要求高精度：看天氣只要知道在哪個縣市、附近哪個測站,Wi-Fi／基地台定位就夠。
       iPhone 在室內要 GPS 高精度常常等很久,看起來就是「一直定位中」。 */
    { enableHighAccuracy: false, timeout: 10000, maximumAge: 10 * 60000 });
}

function setWxLoc(v) {
  /* 先切過去再定位：以前要等定位成功才切分頁,定位被拒或沒回應時分頁停在原地、錯誤訊息又只在
     「現在位置」裡顯示——使用者看到的是「現在位置不能點」。 */
  DB.cfg.wxLoc = v; save();
  if (v === WXLOC_GEO && !GEO) { locateMe(); return; }   // 選了就順手定位一次（locateMe 會重畫）
  renderTyphoon({});
}

/* ── 地點選擇 ────────────────────────────────────────────
   上一版做成一個 <select>,使用者的回饋是「還是沒有看到可以選擇地點的功能」,
   而且「目前站臺位置是誰也不明顯」—— 那顆下拉混在卡片裡,看起來像裝飾。

   重做成兩層,而且把「現在在看哪裡」講得很大聲:
   ① 一排**分頁鈕**：全部站臺 / 現在位置 /（有站臺時）指定站臺
   ② 選了「指定站臺」才出現站臺清單,照設定的清單排序（預設由北至南）
   ③ 不管選哪一種,下面一定有一行**大字寫出現在看的是哪裡**

   預設是**全部站臺**。使用者問「裡面還有全部站臺會不會錯亂」——
   會,如果只給單站又不講清楚是哪一站。解法不是把其他站藏起來,
   而是**先給一張全部站臺的總表**,要看細節再點進單站。      */
const WXMODE_ALL = '', WXMODE_GEO = '__geo__';
const wxMode = () => {
  const v = DB.cfg.wxLoc || '';
  if (v === WXMODE_GEO) return 'geo';
  return v ? 'one' : 'all';
};

function wxPicker() {
  const mode = wxMode();
  const list = wxSites();
  const cur = DB.cfg.wxLoc || '';
  const seg = [
    ['geo', WXMODE_GEO, '現在位置'],
    ['all', WXMODE_ALL, `全部站臺${list.length ? `（${list.length}）` : ''}`],
  ];
  if (list.length) seg.push(['one', '', '指定站臺']);

  const segHtml = `<div class="seg" style="margin-bottom:0.5rem">${seg.map(([m, v, label]) =>
    `<button type="button" aria-pressed="${mode === m}" onclick="setWxMode('${m}')">${label}</button>`
  ).join('')}</div>`;

  const chips = (mode === 'one' && list.length)
    ? `<div class="chips" style="margin-bottom:0.5rem">${list.map(x =>
        `<button type="button" class="chip" aria-pressed="${cur === x.id}"
          onclick="setWxLoc('${esc(x.id)}')">${esc(x.name)}</button>`).join('')}</div>`
    : '';

  const geoBtn = mode === 'geo'
    ? `<div class="btnrow" style="margin-bottom:0.5rem">
        <button class="btn sm" onclick="locateMe()"${GEO_BUSY ? ' disabled' : ''}>${
          GEO_BUSY ? '定位中…' : GEO ? '重新定位' : '取得目前位置'}</button>
        ${GEO ? `<span class="mono" style="align-self:center;font-size:0.6875rem;color:var(--fg4)">
          誤差 ±${GEO.acc} m　${fmtShort(GEO.at)}</span>` : ''}</div>`
    : '';

  return segHtml + chips + geoBtn
    + (GEO_ERR && mode === 'geo' ? `<div class="msg e" style="margin:0 0 0.5rem">${esc(GEO_ERR)}${list.length
        ? `<div class="btnrow" style="margin-top:0.5rem"><button class="btn sm" onclick="setWxMode('one')">改看指定站臺</button></div>` : ''}</div>` : '')
    + (!list.length && mode !== 'geo'
        ? '<div class="msg i" style="margin:0 0 0.5rem">還沒有任何有座標的站臺。'
          + '可以先用「現在位置」，或到站臺頁替站臺補上經緯度。</div>' : '');
}

/* 現在看的是哪裡 —— 大字,而且一定出現。以前只在卡片標題旁邊寫一小行,
   使用者的原話是「目前站臺位置是誰也不明顯」。 */
function wxWhere(site, sub) {
  return `<div style="display:flex;align-items:baseline;gap:0.5rem;flex-wrap:wrap;
    padding:0.5rem 0.75rem;background:var(--surf);border:1px solid var(--edge);
    border-radius:var(--r2);margin-bottom:0.5rem">
    <span class="mono" style="font-size:0.6875rem;color:var(--fg4);letter-spacing:0.06em">地點</span>
    <b style="font-size:1.0625rem;color:var(--acc)">${esc(site.name)}</b>
    ${sub ? `<span class="mono" style="font-size:0.6875rem;color:var(--fg4)">${sub}</span>` : ''}</div>`;
}

function setWxMode(m) {
  if (m === 'all') { DB.cfg.wxLoc = WXMODE_ALL; save(); renderTyphoon({}); return; }
  if (m === 'geo') { setWxLoc(WXMODE_GEO); return; }
  // 「指定站臺」：還沒選過就先選清單第一個（由北至南的最北那一站）
  const list = wxSites();
  if (!list.length) return;
  const cur = DB.cfg.wxLoc || '';
  if (!cur || cur === WXMODE_GEO || !list.some(x => x.id === cur)) DB.cfg.wxLoc = list[0].id;
  save(); renderTyphoon({});
}

function nowRain(st) {
  const rb = nearestRain(st);
  if (!rb) return null;
  const o = rb.o;
  const m10 = o.now, h1 = o.h1;
  const raining = (m10 != null && m10 > 0) || (h1 != null && h1 > 0);
  return { raining, m10, h1, h24: o.h24, name: o.name, km: Math.round(rb.km) };
}

/* ── 今日重點 ─────────────────────────────────────────────
   使用者的原話：**「像今天風哨重點應該是雷雨，其它暫時不是重點，
   應該要靈活變動」**。

   固定順序的摘要在颱風天是對的,在今天就是錯的:一顆四千公里外的
   輕颱排在第一行,而真正要動作的雷雨排在第三行。所以摘要不排死,
   **依現在實際的威脅程度重排**,最該注意的那一件放最上面、放大。

   分數的來源全部是既有資料,不另外算一套模型 ——
   兩套算法遲早會不一致,而不一致的那一刻沒有人會發現。         */
function todayFocus() {
  const F = [];
  const add = (rank, key, tab, val, sub, col) => F.push({ rank, key, tab, val, sub, col });

  const sites = DB.stations.filter(x => IS_LIVE(x) && Number.isFinite(x.lat));

  // ── 應變：開設 → 縮編 → 撤除（建議,以縣市災害應變中心通知為準）──
  const mp = meetPlan();
  if (mp) {
    const now = Date.now();
    const why = (src, off, est) => src === 'official' ? off : `推估${est}`;
    if (mp.phase === 'before' && mp.open - now <= MEET_WARN_H * 3600000)
      add(97, '應變', 'warn', `${untilTxt(mp.open - now)}後建議開設`, `${fmtShort(mp.open)}　推估進入海警範圍前 ${DB.cfg.meetLead} 小時`, 'var(--no)');
    else if (mp.phase === 'before')
      add(35, '應變', 'warn', `建議 ${fmtShort(mp.open)} 開設`, '推估，時間到前 12 小時會移到最上面', 'var(--sb)');
    else if (mp.phase === 'open')
      add(55, '應變', 'warn', '應變中', mp.shrink != null
        ? `建議 ${fmtShort(mp.shrink)} 縮編（${why(mp.shrinkSrc, '陸上警報已解除', '暴風圈離開陸地')}）`
        : mp.close != null ? `建議 ${fmtShort(mp.close)} 撤除（${why(mp.closeSrc, '颱風警報已解除', '離開海警範圍')}）`
        : '撤除等中央氣象署解除颱風警報', 'var(--sb)');
    else if (mp.phase === 'shrink')
      add(60, '應變', 'end', '建議縮編', `${why(mp.shrinkSrc, '陸上警報已解除', '暴風圈已離開陸地')}；`
        + (mp.close != null ? `建議 ${fmtShort(mp.close)} 撤除` : '撤除等官方解除颱風警報') + '。以縣市應變中心通知為準', 'var(--sb)');
    else if (mp.close != null && now - mp.close < 24 * 3600000 && !endChkDone())
      add(62, '應變', 'end', '建議撤除', mp.rainHold.length
        ? `${mp.rainHold.join('、')}仍有豪雨特報，可能轉水災應變；以縣市應變中心通知為準`
        : `${why(mp.closeSrc, '颱風警報已解除', '已離開海警範圍')}；點開撤除檢核`, 'var(--sb)');
  }

  // ── 警報 ──
  const w = DB.ty.warning;
  if (w && w.active) {
    const n = (w.areas || []).length;
    add(w.isLand ? 100 : 90, '警報', 'warn', esc(w.headline || '颱風警報'),
      // 海上警報的範圍是海域（巴士海峽、臺灣北部海面…）,不是縣市
      `中央氣象署${w.no ? `第 ${w.no} 報` : '發布'}${n ? `　影響 ${n} 個地區` : ''}${w.stale ? '　可能已有新報' : ''}`, 'var(--no)');
  } else if (WARN && WARN.isTy && (WARN.sea || WARN.land)) {
    const p = WARN.land || WARN.sea;
    if (p && p.phase === 'pending') {
      const which = WARN.land ? '陸上' : '海上';
      add(60, '警報', 'warn',
        `推估 ${fmtWhen((WARN.land || WARN.sea).issue)} 發布${which}警報`,
        '本機推估，非官方發布時間', 'var(--sb)');
    } else {
      add(55, '警報', 'warn', '尚未發布警報', '本機已推算發布時機，點開看', 'var(--sb)');
    }
  } else {
    /* 沒有威脅的時候要沉下去,而且要講出**為什麼**沒事 ——
       「目前無颱風警報」配上一顆四千公里外的颱風,講的是同一件事。 */
    const km = WARN && WARN.cpa ? Math.round(WARN.cpa.d) : null;
    add(5, '警報', 'warn', '目前無颱風警報',
      km != null
        ? (km > CPA_MID ? `路徑最近時距臺約 ${km} 公里，距離很遠、無影響`
                        : `路徑最近時距臺約 ${km} 公里`)
        : (WARN ? '暴風範圍預估不會觸及臺灣近海' : '尚未取得官方預報路徑'),
      'var(--fg2)');
  }

  /* ── 雷電：打雷就要關站臺,所以它的分數只低於官方颱風警報 ──
     **實測的落雷排在特報前面** —— 特報說「這個縣市正在打雷」,
     落雷點說「離這一站 4 公里處三分鐘前打了一次雲對地」。
     值班要決定關不關機,問的是後者。 */
  const R = ltnRadius();
  const cgNear = sites.map(x => ({ x, s: strikesNear(x, R) })).filter(r => r.s.cg > 0)
    .sort((a, b) => a.s.nearest.d - b.s.nearest.d);
  const icNear = sites.map(x => ({ x, s: strikesNear(x, R) })).filter(r => r.s.cg === 0 && r.s.ic > 0);
  const tAdv = thunderAdv();
  const inZone = tAdv.length ? sites.filter(x => thunderFor(x)) : [];
  if (cgNear.length) {
    const n0 = cgNear[0];
    add(98, '雷電', 'live', `${cgNear.length} 站 ${R} km 內有雲對地落雷`,
      `最近 ${esc(n0.x.name)} ${Math.round(n0.s.nearest.d)} km`
      + (n0.s.last ? `　${fmtClock(n0.s.last)}` : '') + '　實測，依規定應關閉設備', 'var(--no)');
  } else if (inZone.length) {
    add(95, '雷電', 'live', `${inZone.length} 站在雷雨特報範圍`,
      inZone.slice(0, 4).map(x => esc(x.name)).join('、')
      + (inZone.length > 4 ? ' 等' : '') + '　依規定應關閉設備', 'var(--no)');
  } else if (icNear.length) {
    add(72, '雷電', 'live', `${icNear.length} 站 ${R} km 內有雲間閃電`,
      '雲間閃電不會打到地面設備，但代表雷雨胞就在附近', 'var(--sb)');
  } else if (tAdv.length) {
    add(70, '雷電', 'live', `${tAdv.map(a => esc(a.kind)).join('、')}發布中`,
      '轄區內沒有站臺落在範圍內', 'var(--sb)');
  } else {
    const ahead = sites.map(x => ({ x, t: thunderAhead(x) })).filter(r => r.t);
    if (ahead.length) {
      const first = ahead.reduce((a, b) => a.t.from <= b.t.from ? a : b);
      add(40, '雷電', 'live', `預報 ${ahead.length} 站有雷`,
        `最早 ${esc(first.x.name)} ${relDay(first.t.from)}${fmtClock(first.t.from)}　這是預報不是現在`, 'var(--sb)');
    } else if (LTN_AT) {
      // 沒填授權碼就沒抓特報,不能說「也沒有雷雨特報」
      add(6, '雷電', 'live', `${R} km 內沒有落雷`,
        String(DB.cfg.cwaKey || '').trim() ? '過去 1 小時實測，也沒有雷雨特報' : '過去 1 小時實測',
        'var(--ok)');
    }
  }

  // ── 停班停課 ──
  const offHit = (DGPA_LIVE || []).filter(r => r.alert);
  if (offHit.length) {
    add(85, '停班課', 'dgpa', `官方 ${offHit.length} 個縣市停止上班上課`,
      offHit.slice(0, 4).map(r => esc(r.county)).join('、') + (offHit.length > 4 ? ' 等' : ''), 'var(--no)');
  } else if (DGPA_NONE) {
    add(4, '停班課', 'dgpa', '官方：無停班停課訊息', '人事行政總處公告', 'var(--ok)');
  } else {
    const estHit = COUNTIES_NS.filter(n => { const e = countyEstimate(n); return e && e.any; });
    add(estHit.length ? 50 : 3, '停班課', 'dgpa',
      estHit.length ? `推估 ${estHit.length} 個縣市停止上班上課` : '推估均未達停止上班上課基準',
      DGPA_LIVE_ERR ? '官方公告取得失敗，點開看原因' : '推估不是公告，一律以官方為準',
      estHit.length ? 'var(--sb)' : 'var(--fg2)');
  }

  // ── 站臺已達關機門檻（推估）──
  if (SERIES && sites.length) {
    const hit = sites.map(x => ({ x, i: stationImpact(SERIES, x, DB.cfg) }))
      .filter(r => r.i && r.i.deadline);
    if (hit.length) {
      add(80, '站臺', 'st', `${hit.length} 站推估陣風將達待機門檻`,
        `門檻 ${DB.cfg.bfShut} 級　點開看各站時間`, 'var(--no)');
    }
  }

  /* ── 天氣 ──
     一律講「幾站」,不挑代表點。挑一站代表其餘十八站,寫出來的東西
     對那十八站可能完全不成立。 */
  const raining = sites.filter(x => { const r = nowRain(x); return r && r.raining; });
  if (raining.length) {
    add(45, '天氣', 'wx', `${raining.length} 站正在下雨`,
      raining.slice(0, 4).map(x => esc(x.name)).join('、')
      + (raining.length > 4 ? ' 等' : '') + '　雨量站實測', 'var(--acc)');
  } else if (!sites.length) {
    add(2, '天氣', 'wx', '尚未有可判斷的站臺', '站臺要有經緯度才對得到雨量站與預報', 'var(--fg2)');
  } else {
    // 最早會下雨的那一站,講它 —— 那是「接下來第一件事」,不是代表
    const ahead = sites.map(x => {
      const tf = townFor(x);
      const ser = tf ? townSeries(tf.town).filter(y => y.to > Date.now()) : [];
      const wet = ser.find(y => isRainy(y.wx) || (y.pop != null && y.pop >= 70));
      return wet ? { x, wet } : null;
    }).filter(Boolean).sort((a, b) => a.wet.from - b.wet.from);
    if (ahead.length) {
      add(20, '天氣', 'wx', `${ahead.length} 站預報有雨`,
        `最早 ${esc(ahead[0].x.name)} ${relDay(ahead[0].wet.from)}${fmtClock(ahead[0].wet.from)} 起`,
        'var(--fg2)');
    } else {
      const anyTf = sites.some(x => townFor(x));
      add(2, '天氣', 'wx',
        anyTf ? `${sites.length} 站目前都沒有下雨` : '尚未取得鄉鎮天氣預報',
        anyTf ? '未來預報時段內也無明顯降雨'
              : (WX_ERR ? '預報取得失敗，點開看原因' : '按上方「更新」取得'), 'var(--fg2)');
    }
  }

  return F.sort((a, b) => b.rank - a.rank);
}

/* ── 概況頁的摘要 ─────────────────────────────────────────
   最上面一張「現在最該注意的事」,下面是其餘各項,一律照威脅程度排。
   按下去跳到那一頁。數字全部取自各頁自己的資料。            */
function glanceCard(skipWarn) {
  // 名牌上已經有官方警報徽章時,摘要不再講一次「警報」
  const F = todayFocus().filter(f => !(skipWarn && f.key === '警報'));
  if (!F.length) return '';
  const top = F[0], rest = F.slice(1);

  /* 分數低於 30 就代表「今天沒有什麼特別要注意的」——
     那時候不該端出一張大卡假裝有事。 */
  const hot = top.rank >= 30;

  const banner = hot
    ? `<button type="button" class="focus" onclick="goTySub('${top.tab}')"
        style="border-color:${top.col}">
        <span class="fc-k" style="color:${top.col}">現在最該注意　${top.key}</span>
        <span class="fc-v" style="color:${top.col}">${top.val}</span>
        <span class="fc-s">${top.sub}</span></button>`
    : '';

  // 其餘各項排成兩欄小格（以前一項一整列,四五列就佔掉半個畫面）
  const tile = f =>
    `<button type="button" class="gl" onclick="goTySub('${f.tab}')">
       <small>${f.key}</small><b${f.col ? ` style="color:${f.col}"` : ''}>${f.val}</b>
       ${f.sub ? `<em>${f.sub}</em>` : ''}</button>`;
  const list = hot ? rest : F;
  return banner
    + (hot ? '' : '<div class="lbl" style="margin:0.25rem 0 0.375rem">目前沒有需要立即處置的項目</div>')
    + (list.length ? `<div class="gl-grid">${list.map(tile).join('')}</div>` : '');
}

/* ── 雷電 ─────────────────────────────────────────────────
   使用者的規則：**打雷就要關站臺**。所以雷不能跟雨混在一起講,
   它要自己一段,而且要回答「**離我的站臺幾公里處剛剛打了一次**」。

   來源有三種,可信度與意義完全不同,畫面上一律分開標:
   ① **落雷實測**（O-A0039-001,見上面 fetchLightning）—— 逐點的經緯度與時間,
      是真的量到的。**雲對地才會打到地面設備**,與雲間分開算。
   ② **官方雷雨特報** —— 區域性的判斷,講的是「這個縣市正在打雷」。
   ③ **鄉鎮預報裡的雷雨時段** —— 那是預報,不是現在正在打雷。

   註：上一版這裡寫著「真正的落雷即時位置拿不到」。那是**錯的** ——
   使用者提供了官方檔案,O-A0039-001 確實存在。沒查證就說「沒有」,
   跟沒查證就說「有」（W-C0034-003）是同一個毛病的反面,而且更難發現:
   畫面上不會出錯,只會少一個本來做得到的功能。              */
const thunderAdv = () => ADV.filter(a => a.cat === 'thunder');

// 這個地點目前是否在官方雷雨特報的範圍內
function thunderFor(st) {
  const c = cnorm(countyOf(st));
  if (!c) return null;
  for (const a of thunderAdv()) {
    for (const area of a.areas) {
      const an = cnorm(area);
      const bare = an.replace(/(山區|平地|沿海|地區|北部|南部|東部|西部)+$/, '');
      if (an.includes(c) || bare.includes(c) || c.includes(bare)) {
        return { kind: a.kind, area, end: a.end };
      }
    }
  }
  return null;
}

// 預報時段裡的雷（不是現在正在打雷,是等一下可能會）
const isThunder = w => /雷/.test(String(w || ''));
function thunderAhead(site) {
  const tf = site && Number.isFinite(site.lat) ? townFor(site) : null;
  if (!tf) return null;
  const ser = townSeries(tf.town).filter(x => x.to > Date.now());
  const hit = ser.find(x => isThunder(x.wx));
  return hit ? { from: hit.from, to: hit.to, wx: hit.wx, town: tf.town.name } : null;
}

function thunderCard() {
  const adv = thunderAdv();
  const sites = DB.stations.filter(x => IS_LIVE(x) && Number.isFinite(x.lat));
  const R = ltnRadius();

  /* 每一站周圍的落雷。這是**實測**,優先於特報 ——
     特報講的是「這個縣市正在打雷」,落雷點講的是「離這一站幾公里處剛剛打了一次」。
     值班要決定關不關機,問的是後者。 */
  const near = sites.map(x => ({ x, s: strikesNear(x, R) }))
    .filter(r => r.s.cg + r.s.ic > 0)
    .sort((a, b) => (b.s.cg - a.s.cg) || (a.s.nearest.d - b.s.nearest.d));
  const cgHit = near.filter(r => r.s.cg > 0);

  const inZone = adv.length ? sites.map(x => ({ x, t: thunderFor(x) })).filter(r => r.t) : [];
  const ahead = sites.map(x => ({ x, t: thunderAhead(x) })).filter(r => r.t);

  /* 收成一行摺疊（使用者：雷電很佔空間,天氣卡片要往上）。附近有對地落雷、或站臺在雷雨特報範圍內就自動打開——
     那時候是要立刻看的,不能藏起來。 */
  const wrap = (t, col, open, body) => `<details class="card pad fold thz"${open ? ' open' : ''} style="margin-bottom:0.75rem">
    <summary>雷電<span class="fold-s" style="color:${col}">${t}</span></summary><div style="margin-top:0.5rem">${body}</div></details>`;
  /* 手動匯入的檔案不會自己更新。最後一筆落雷距現在超過 90 分鐘就明講
     「資料可能已過期」—— 拿兩小時前的落雷判斷現在要不要關機是危險的。 */
  const newest = LTN.reduce((m, x) => Math.max(m, x.t || 0), 0);
  const stale = LTN_AT && newest && (Date.now() - newest > 90 * 60000);
  const win = LTN_AT
    ? `<div class="tybar" style="margin-bottom:0.5rem;flex-wrap:wrap;row-gap:0.125rem"><b>落雷實測</b>
        ${LTN_WIN ? esc(LTN_WIN) : '過去 1 小時'}
        <span class="mono" style="color:var(--fg4)">　全臺 ${LTN.length} 筆　半徑 ${R} km</span>
        ${LTN_MANUAL ? '<span class="tag" style="background:var(--sb);color:#08131A">手動匯入</span>'
          : LTN_SRC ? `<span class="mono" style="font-size:0.625rem;color:var(--fg4)">　${esc(LTN_SRC)}</span>` : ''}
       </div>`
      + (stale ? `<div class="msg w" style="margin-bottom:0.5rem">
          <b>這份落雷資料可能已過期</b>：最後一筆是 ${fmtShort(newest)}（${relative(newest)}）。
          ${LTN_MANUAL ? '手動匯入的檔案不會自己更新，請重新下載後再匯入。' : '請按上方「更新」。'}</div>` : '')
    : '';
  const err = LTN_ERR
    ? `<div class="msg e" style="margin-bottom:0.5rem">落雷資料取得失敗：${esc(LTN_ERR)}。
       可在「設定 › 資料來源 › 落雷」改資料集代號。下方仍會顯示官方雷雨特報與預報。</div>` : '';
  /* 「還沒設定」不是「壞掉」:沒設金鑰時不該掛一個紅色錯誤框天天嚇人。
     但也**絕不能**畫成綠色的「沒有落雷」—— 沒有資料跟沒有雷是兩回事,
     把前者講成後者,就是讓值班在雷雨胞底下以為可以不關機。 */
  const off = !LTN_AT && LTN_OFF ? ltnOffNote() : '';
  // 特報與預報只有填了授權碼才會抓;沒抓到的東西不能寫成「沒有」
  const haveKey = !!String(DB.cfg.cwaKey || '').trim();

  const nothing = !adv.length && !ahead.length && !near.length;
  if (nothing) {
    const title = LTN_AT ? `半徑 ${R} km 內沒有落雷`
      : haveKey ? '沒有雷雨特報，預報也沒有雷' : '尚未取得任何雷電資料';
    const sub = LTN_AT
      ? '過去 1 小時各站臺周圍都沒有偵測到落雷' + (haveKey
        ? '，中央氣象署也沒有發布雷雨特報，鄉鎮預報的時段裡也沒有雷。'
        : '。（沒有填中央氣象署授權碼，雷雨特報與預報沒有抓。）')
      : haveKey
        ? '特報與預報都是區域性的判斷；<b>站臺附近有沒有落雷要看逐站實測</b>，目前沒有這份資料。'
        : '設定裡還沒填中央氣象署授權碼，雷雨特報與預報都沒有抓。';
    return wrap(title, LTN_AT ? 'var(--ok)' : 'var(--fg3)', !!err, err + off + `${win}
      <div class="hint" style="margin-top:0.375rem">${sub}</div>
      ${thunderNote()}`);
  }

  const rows = [];

  // ① 落雷實測 —— 這一段排最前面,因為它是實測而且是逐點的
  if (near.length) {
    rows.push(`<div style="padding:0.5rem 0;border-bottom:1px solid var(--edge)">
      <div style="display:flex;align-items:baseline;gap:0.5rem;flex-wrap:wrap">
        <b style="font-size:1.0625rem;color:${cgHit.length ? 'var(--no)' : 'var(--sb)'}">${
          cgHit.length ? `${cgHit.length} 站 ${R} km 內有雲對地落雷`
                       : `${near.length} 站 ${R} km 內有雲間閃電`}</b>
        <span class="tag" style="background:${cgHit.length ? 'var(--no)' : 'var(--sb)'};color:#08131A">實測</span></div>
      <div style="overflow-x:auto;margin-top:0.375rem"><table class="impact wx">
        <colgroup><col><col style="width:3.6rem"><col style="width:3.6rem"><col style="width:5.4rem"></colgroup>
        <tr><th>站臺</th><th>對地</th><th>雲間</th><th>最近一次</th></tr>
        ${near.map(r => `<tr${r.s.cg ? ' style="background:var(--no-d)"' : ''}>
          <td class="nm">${esc(r.x.name)}
            <span class="mono" style="font-size:0.625rem;color:var(--fg4);font-weight:400">　${
              S_LABEL[r.x.status] || r.x.status}</span></td>
          <td class="mono" style="text-align:right;color:${r.s.cg ? 'var(--no)' : 'var(--fg4)'};font-weight:700">${r.s.cg}</td>
          <td class="mono" style="text-align:right;color:var(--fg3)">${r.s.ic}</td>
          <td class="mono" style="text-align:right">${Math.round(r.s.nearest.d)} km<br>
            <span style="color:var(--fg4)">${r.s.last ? fmtClock(r.s.last) : '—'}</span></td>
        </tr>`).join('')}</table></div>
      <div class="hint" style="margin-top:0.375rem">
        <b>「對地」才是打到地面的那一種</b>，對設備有直接威脅；雲間閃電不會打到設備，兩者分開算。
        依單位規定，雷雨期間應關閉站臺設備——這裡只列出偵測到什麼，
        <b>關機與否仍由值班判斷</b>。半徑可在設定調整。</div></div>`);
  } else if (LTN_AT) {
    rows.push(`<div style="padding:0.5rem 0;border-bottom:1px solid var(--edge)">
      <span style="color:var(--ok)">落雷實測：各站臺 ${R} km 內過去 1 小時沒有偵測到落雷。</span></div>`);
  }

  // ② 官方雷雨特報
  if (adv.length) {
    rows.push(`<div style="padding:0.5rem 0;border-bottom:1px solid var(--edge)">
      <div style="display:flex;align-items:baseline;gap:0.5rem;flex-wrap:wrap">
        <b style="color:var(--no)">${adv.map(a => esc(a.kind)).join('、')}</b>
        <span class="tag" style="background:var(--no);color:#08131A">中央氣象署發布</span></div>
      ${adv.map(a => `<div style="font-size:0.8125rem;color:var(--fg2);margin-top:0.25rem">
        ${esc(a.kind)}：${a.areas.length ? esc(a.areas.join('、')) : '（未列地區）'}
        ${a.end ? `<span class="mono" style="color:var(--fg4)">　至 ${fmtShort(a.end)}</span>` : ''}
        </div>`).join('')}
      ${inZone.length
        ? `<div style="font-size:0.8125rem;margin-top:0.375rem"><b style="color:var(--no)">轄區內 ${
            inZone.length} 站在範圍：</b>${inZone.map(r => esc(r.x.name)).join('、')}</div>`
        : '<div style="font-size:0.8125rem;margin-top:0.375rem;color:var(--ok)">轄區內沒有站臺落在特報範圍內。</div>'}
      </div>`);
  }

  // ③ 預報
  if (ahead.length) {
    /* 十九站各寫一行,而且十九行寫的是同兩個時段 —— 那是雜訊不是資訊。
       **照時段分組**:同一個時段的站臺併成一行,值班一眼看到的是
       「幾點開始、有幾站」,而不是一整面站名。 */
    const byT = new Map();
    for (const r of ahead) {
      const k = `${relDay(r.t.from)}${fmtClock(r.t.from)}–${fmtClock(r.t.to)}`;
      if (!byT.has(k)) byT.set(k, { from: r.t.from, wx: r.t.wx, names: [] });
      byT.get(k).names.push(r.x.name);
    }
    const groups = [...byT.entries()].sort((a, b) => a[1].from - b[1].from);
    rows.push(`<div style="padding:0.5rem 0">
      <b style="color:var(--sb)">預報有雷：${ahead.length} 站，${groups.length} 個時段</b>
      ${groups.map(([k, g]) => `<details style="margin-top:0.3125rem">
        <summary style="cursor:pointer;font-size:0.8125rem;padding:0.125rem 0">
          <span class="mono" style="color:var(--sb)">${k}</span>
