          <span style="color:var(--fg2)">　${esc(g.wx)}　${g.names.length} 站</span></summary>
        <div style="font-size:0.75rem;color:var(--fg3);padding:0.125rem 0 0 0.75rem">${
          g.names.map(esc).join('、')}</div></details>`).join('')}
      <div class="hint" style="margin-top:0.375rem">
        <b>這是預報不是現在正在打雷</b>，時距 3 小時一格。點時段看是哪幾站。</div></div>`);
  }

  const sum = cgHit.length ? [`${cgHit.length} 站 ${R} km 內有雲對地落雷`, 'var(--no)']
    : near.length ? [`${near.length} 站有雲間閃電`, 'var(--sb)']
    : adv.length ? [`${adv.map(a => a.kind).join('、')}`, 'var(--no)']
    : [`預報有雷：${ahead.length} 站`, 'var(--sb)'];
  return wrap(esc(sum[0]), sum[1], !!(cgHit.length || inZone.length || err), err + off + `${win}${rows.join('')}${thunderNote()}`);
}

/* 落雷實測沒啟用時的說明。網址從目前所在的 GitHub Pages 推回 repo,
   不寫死帳號 —— 別人 fork 一份去用,連結就該指向他自己的 repo。 */
function ltnOffNote() {
  const m = /^([^.]+)\.github\.io$/i.exec(location.hostname);
  const repo = m ? location.pathname.split('/').filter(Boolean)[0] : '';
  const where = m && repo
    ? `<a href="https://github.com/${esc(m[1])}/${esc(repo)}/settings/secrets/actions/new"
         target="_blank" rel="noopener">repo 的 Secrets 設定頁</a>`
    : 'GitHub repo → Settings → Secrets and variables → Actions';
  return `<div class="msg i" style="margin-bottom:0.5rem">
      <b>逐站落雷實測尚未啟用</b>——現在是<b>不知道</b>站臺附近有沒有落雷，不是「沒有落雷」。
      路徑頁「即時影像」（Windy 雷達圖）上的 ⚡ 可以先目視參考。<br>
      啟用方式（repo 管理者做一次就好）：到 ${where} 新增 <code>CWA_API_KEY</code>，
      值填中央氣象署授權碼。之後每 10 分鐘自動更新，每支手機都不用再設定。
      <details style="margin-top:0.25rem"><summary style="cursor:pointer;color:var(--fg3)">技術細節</summary>
        <span class="mono" style="font-size:0.6875rem;color:var(--fg4);word-break:break-all">${esc(LTN_OFF)}</span>
      </details></div>`;
}

function thunderNote() {
  return `<details style="margin-top:0.5rem">
    <summary style="cursor:pointer;font-size:0.8125rem;color:var(--acc);padding:0.25rem 0">
      這裡的雷是哪裡來的　·　點開</summary>
    <p class="hint" style="margin:0.375rem 0">
      三種來源，可信度與意義完全不同，畫面上一律分開標：<br><br>
      ① <b>落雷實測</b>（<code>O-A0039-001</code> 過去 1 小時閃電偵測資料）——
      逐點的經緯度與時間，是<b>真的量到的落雷</b>。分成<b>雲對地</b>與<b>雲間</b>：
      只有雲對地會打到地面設備，兩者一定要分開算
      （官方樣本裡 124 筆中有 91 筆是雲間，加在一起會把數字灌水一倍以上）。<br>
      ② <b>官方雷雨特報</b>——區域性的判斷，講的是「這個縣市正在打雷」，
      不是「離這一站幾公里」。<br>
      ③ <b>鄉鎮預報裡有雷的時段</b>——那是<b>預報</b>，不是現在。<br><br>
      下方 Windy 雷達圖上的 ⚡ 是 Windy 自己的閃電資料，適合看雷雨胞往哪移動；
      它不逐站計算距離，所以要不要關機請看上面的實測表。也可對照
      <a href="https://www.cwa.gov.tw/V8/C/W/OBS_Radar.html" target="_blank" rel="noopener">氣象署雷達回波</a>。</p>
  </details>`;
}

/* ── 站臺天氣紀錄：附近落雷、致災性豪雨 ───────────────────────
   使用者：站臺要記下附近有沒有打雷、有沒有致災性的豪雨。
   只有 App 抓到資料時記得到（落雷每次往前 1 小時、雨量是當下的 1／3／24 小時累積）;
   App 沒開、後端沒跑的時段就沒有紀錄——畫面上照實講,不把「沒紀錄」說成「沒打雷」。 */
const WXLOG_DAYS = 30, RAIN_KM = 20;
// 致災性：豪雨以上（24 小時 200、3 小時 100 毫米）或時雨量 40 毫米以上的短時強降雨
const isDz = e => e.k === 'rain' && (['豪雨', '大豪雨', '超大豪雨'].includes(e.lv) || (e.h1 || 0) >= 40);
const lvRank = n => { const i = RAIN_LEVELS.findIndex(z => z.name === n); return i < 0 ? 99 : i; };
function recordWxLog() {
  if (!Array.isArray(DB.wxlog)) DB.wxlog = [];
  const L = DB.wxlog, now = Date.now(), R = ltnRadius();
  const sites = DB.stations.filter(x => IS_LIVE(x) && Number.isFinite(x.lat) && Number.isFinite(x.lng));
  let changed = false;
  /* 落雷：每站記住算到哪一個落雷時間,只算比它新的——每次抓的都是「過去 1 小時」,
     十分鐘抓一次的話同一次落雷會被看到六次,不能算六次。依整點分組,一小時一筆。 */
  if (LTN_AT && LTN.length) {
    const M = DB.wxmark && typeof DB.wxmark === 'object' ? DB.wxmark : (DB.wxmark = {});
    for (const x of sites) {
      const mark = M[x.id] || 0;
      let top = mark;
      for (const s of LTN) {
        if (!(s.t > mark)) continue;
        const d = distKm(x, s);
        if (d > R) continue;
        const h = Math.floor(s.t / 3600000) * 3600000;
        let e = L.find(y => y.sid === x.id && y.k === 'ltn' && y.t === h);
        if (!e) { e = { id: uid(), sid: x.id, k: 'ltn', t: h, cg: 0, ic: 0, near: d, last: s.t }; L.push(e); }
        if (s.cg) e.cg++; else e.ic++;
        e.near = Math.min(e.near, d); e.last = Math.max(e.last, s.t);
        if (s.t > top) top = s.t;
        changed = true;
      }
      if (top > mark) M[x.id] = top;
    }
  }
  // 雨：20 公里內最近的雨量站到大雨以上記一筆；同一站 6 小時內接續的算同一場,留最大值
  if (RAIN.length) {
    for (const x of sites) {
      const rb = nearestRain(x);
      if (!rb || rb.km > RAIN_KM) continue;
      const o = rb.o, lv = rainLevel(o);
      if (!lv) continue;
      const at = o.at || RAIN_AT || now;
      const e = L.find(y => y.sid === x.id && y.k === 'rain' && at >= y.t && at - y.t2 <= 6 * 3600000);
      if (!e) {
        L.push({ id: uid(), sid: x.id, k: 'rain', t: at, t2: at, lv: lv.name, h1: o.h1, h3: o.h3, h24: o.h24,
          g: o.name, km: Math.round(rb.km) });
        changed = true; continue;
      }
      const mx = (a, b) => b == null ? a : a == null ? b : Math.max(a, b);
      const was = JSON.stringify(e);
      e.t2 = Math.max(e.t2, at); e.h1 = mx(e.h1, o.h1); e.h3 = mx(e.h3, o.h3); e.h24 = mx(e.h24, o.h24);
      if (lvRank(lv.name) < lvRank(e.lv)) e.lv = lv.name;
      if (JSON.stringify(e) !== was) changed = true;
    }
  }
  const cut = now - WXLOG_DAYS * 86400000;
  const keep = L.filter(e => (e.t2 || e.last || e.t) >= cut).sort((a, b) => a.t - b.t).slice(-3000);
  if (keep.length !== L.length) { DB.wxlog = keep; changed = true; }
  if (changed) save();
}
const wxLogOf = (sid, ms) => (DB.wxlog || []).filter(e => e.sid === sid && (e.t2 || e.last || e.t) >= Date.now() - ms);
const ltnTxt = (cg, ic) => [cg ? `對地 ${cg} 次` : '', ic ? `雲間 ${ic} 次` : ''].filter(Boolean).join('、');
// 站臺卡上的標籤：24 小時內有落雷、大雨以上才出現（一項一個,給 meta 逐項排）
function wxLogTag(sid) {
  const L = wxLogOf(sid, 24 * 3600000);
  if (!L.length) return [];
  const lt = L.filter(e => e.k === 'ltn'), rn = L.filter(e => e.k === 'rain').sort((a, b) => lvRank(a.lv) - lvRank(b.lv));
  const cg = lt.reduce((a, e) => a + e.cg, 0), ic = lt.reduce((a, e) => a + e.ic, 0);
  const out = [];
  // 不加 nowrap：落雷那行比卡片右側的狀態鈕還長,不換行會被蓋住、尾巴切掉
  if (cg + ic) out.push(`<b class="${cg ? 'c-no' : 'c-sb'}">24 小時落雷 ${ltnTxt(cg, ic)}（最近 ${
    Math.min(...lt.map(e => e.near)).toFixed(1)} km）</b>`);
  if (rn.length) out.push(`<b class="${rn.some(isDz) ? 'c-no' : 'c-sb'}">24 小時${rn[0].lv}${rn.some(isDz) ? '（致災性）' : ''}</b>`);
  return out;
}
// 站臺編輯面板：近 30 天的落雷與大雨以上紀錄
function wxLogHtml(sid) {
  const L = wxLogOf(sid, WXLOG_DAYS * 86400000).sort((a, b) => (b.t2 || b.last || b.t) - (a.t2 || a.last || a.t));
  const T = ts => fmtShort(ts).replace(/\(.\)/, '');
  const nL = L.filter(e => e.k === 'ltn').length, nR = L.length - nL;
  const li = e => e.k === 'ltn'
    ? `<div class="wxl-it"><b class="${e.cg ? 'c-no' : 'c-sb'}">落雷</b><span>${T(e.t)}–${fmtClock(e.t + 3600000)}　${ltnTxt(e.cg, e.ic)}，最近 ${e.near.toFixed(1)} km</span></div>`
    : `<div class="wxl-it"><b class="${isDz(e) ? 'c-no' : 'c-sb'}">${e.lv}${isDz(e) ? '・致災性' : ''}</b><span>${T(e.t)}${e.t2 > e.t ? `–${fmtClock(e.t2)}` : ''}　時雨量最大 ${
      e.h1 ?? '—'}、3 小時 ${e.h3 ?? '—'}、24 小時 ${e.h24 == null ? '—' : Math.round(e.h24)} 毫米（${esc(e.g)}站 ${e.km} km）</span></div>`;
  return `<details class="card pad fold wxl" style="margin-bottom:0.875rem"${L.length ? ' open' : ''}>
    <summary>天氣紀錄　近 ${WXLOG_DAYS} 天<span class="fold-s">落雷 ${nL} 筆・大雨以上 ${nR} 筆</span></summary>
    ${L.length ? L.slice(0, 80).map(li).join('') : '<p class="hint" style="margin-top:0.5rem">還沒有紀錄。</p>'}
    <p class="hint" style="margin-top:0.5rem">App 抓到資料時自動記下：${ltnRadius()} 公里內的落雷（一小時一筆）、${RAIN_KM} 公里內最近雨量站達大雨以上
      （豪雨以上或時雨量 40 毫米以上標「致災性」）。App 沒開、後端沒跑的時段沒有紀錄——沒紀錄不等於沒發生。</p></details>`;
}

/* ── 出門建議（天氣 › 現在位置／指定站臺）──────────────────────
   使用者第一版：點了現在位置,能不能告訴我現在出門安不安全。
   使用者第二版：寫法太普通——要依照真實數據告訴我能不能先出去採買、幾點前回家、可以走多遠,隔天也要講。
   做法：「現在」用實測（落雷、雨量、陣風）與官方即時資料（停班停課、警報、特報）；「接下來」用官方逐 3 小時預報
   與颱風路徑推估,排成逐小時的時間軸到明天午夜,每小時給一個等級,再從時間軸讀出：
   現在能不能出門、幾點前回到家（轉差前 30 分鐘）、不能出門的話最早幾點、活動範圍、帶什麼、避開哪裡、明天哪個時段好。
   不寫「安全」——資料只看得到這幾種危險；沒資料的小時畫成斜線,不畫成沒事。
   等級：3 不要出門／2 盡量不要出門／1 可以出門但要注意／0 沒有發現危險訊號。門檻：
   - 陣風 10 級以上（停班停課的陣風基準）3、8～9 級（迎風步行困難、樹枝斷落）2、6～7 級（傘撐不住）1；
   - 5 公里內 30 分鐘內有對地落雷 3（聽得到雷聲就在雷擊範圍內）、15 公里內 2；雷停 30 分鐘後再出門；
   - 時雨量 40 毫米以上 3、15 毫米以上 2；24 小時累積豪雨以上 2（積淹水、坍方）；
   - 停班停課、陸上颱風警報只當 1：官方的意思是「非必要不外出」,採買、就醫這種必要的短程照樣要排時間,
     真正決定幾點能出門的是風、雨、雷。 */
const OUT_FRESH = 3 * 3600000, HR = 3600000;
const lvOfBf = bf => bf >= 10 ? 3 : bf >= 8 ? 2 : bf >= 6 ? 1 : 0;
// 預報給的是平均風級：取該級中間值 ×1.3 當陣風,跟實測、模型用同一把尺
const fcGust = bf => ms2bf((bf2ms(bf) + bf2ms(bf + 1)) / 2 * GUST_FACTOR);
// 某一天的官方停班停課：'full'／'part'／'none'；null＝那一天還沒公布；undefined＝沒有公告資料或不知道縣市
function offOn(county, day) {
  const o = county && countyOfficial(county);
  if (!o) return undefined;
  const page = dgpaPageDay();
  if (day !== page && day !== page + 86400000) return null;
  return officialFor(o, day, page);
}
function outlook(site) {
  const now = Date.now(), rs = [], ok = [], no = [], adv = [];
  const add = (lv, src, txt, ltn) => rs.push({ lv, src, txt, ltn: !!ltn });
  const age = t => t ? `（${ageTxt(t)}）` : '';
  const county = countyOf(site), cn = cnorm(county);
  const inC = area => { const a = cnorm(area), b = a.replace(/(山區|平地|沿海|地區|北部|南部|東部|西部)+$/, '');
    return !!cn && (a.includes(cn) || b.includes(cn) || cn.includes(b)); };
  let warn = false, gust = null, ltnHold = 0, rainNow = false, rainAcc = '';
  // ── 官方：停班停課、颱風警報、豪大雨／雷雨特報 ──
  const off = offOn(county, new Date(now).setHours(0, 0, 0, 0));
  if (off === 'full') add(1, '官方', `${esc(county)}今天停止上班上課——外出以採買、就醫等必要為限`);
  else if (off === 'part') add(1, '官方', `${esc(county)}部分地區今天停止上班上課`);
  if (off !== undefined) ok.push('停班停課'); else no.push(county ? '停班停課' : '停班停課（不知道在哪個縣市）');
  const w = DB.ty.data ? warnFor(DB.ty.data) : DB.ty.warning;
  if (w) {
    if (w.active && w.isLand && (w.areas || []).some(inC)) { warn = true; add(1, '官方', `在陸上颱風警報範圍（${esc(county)}）`); }
    ok.push('颱風警報');
  }
  if (WX_SRC) {
    /* ADV 已照嚴重程度排好,雨、雷各只留最重的一條——同一縣市山區大豪雨、平地豪雨會各發一張,全列像在灌水。
       豪大雨特報範圍是整個縣市、時效一兩天,只當「注意」（另外叫人避開山區河邊）——真資料裡大豪雨特報把
       臺北接下來 27 小時全染成橘色,市區實測時雨量才 0.5 毫米。幾點能出門交給實測與逐時預報。
       雷雨特報是一兩個小時內、範圍小的即時警告,才到「盡量不要出門」。 */
    const seen = new Set();
    for (const a of ADV) {
      if (!a.areas.some(inC) || seen.has(a.cat)) continue;
      seen.add(a.cat);
      const lv = /雷/.test(a.kind) ? 2 : 1;
      adv.push({ kind: a.kind, lv, end: a.end || 0 });
      add(lv, '官方', `${esc(a.kind)}特報（${esc(county)}）`);
    }
    ok.push('豪大雨與雷雨特報');
  } else no.push('豪大雨與雷雨特報');
  // ── 實測：落雷、雨量、陣風 ──
  const ltnT = LTN_DATA || LTN_AT;
  if (LTN_AT && now - ltnT <= 90 * 60000) {
    const near = LTN.map(s => ({ s, d: distKm(site, s) })).filter(x => x.d <= 15);
    const cg5 = near.filter(x => x.s.cg && x.d <= 5 && (!x.s.t || now - x.s.t <= 30 * 60000));
    const cg = near.filter(x => x.s.cg), dmin = near.length ? Math.min(...near.map(x => x.d)) : 0;
    if (cg5.length) add(3, '實測', `5 公里內 30 分鐘內有對地落雷 ${cg5.length} 次（最近 ${dmin.toFixed(1)} 公里）`, true);
    else if (cg.length) add(2, '實測', `15 公里內一小時內有對地落雷 ${cg.length} 次（最近 ${dmin.toFixed(1)} 公里）`, true);
    else if (near.length) add(1, '實測', `15 公里內有雲間閃電 ${near.length} 次`, true);
    // 10 公里內最後一次對地落雷之後 30 分鐘內不出門（雷雨常一陣一陣,停了不代表走了）
    const last = Math.max(0, ...near.filter(x => x.s.cg && x.d <= 10).map(x => x.s.t || ltnT));
    if (last && last + 30 * 60000 > now) ltnHold = last + 30 * 60000;
    ok.push(`落雷${age(ltnT)}`);
  } else no.push(LTN_AT ? `落雷（${ageTxt(ltnT)}的資料，太舊）` : '落雷');
  const rb = nearestRain(site);
  if (rb && rb.km <= RAIN_KM && now - (rb.o.at || RAIN_AT) <= OUT_FRESH) {
    const o = rb.o, lv = rainLevel(o), where = `${esc(o.name)}站 ${Math.round(rb.km)} 公里`;
    rainNow = (o.h1 || 0) > 0 || (o.now || 0) > 0;
    if (lv) rainAcc = lv.name;
    if ((o.h1 || 0) >= 40) add(3, '實測', `${lv ? lv.name : '短時強降雨'}：時雨量 ${o.h1} 毫米、24 小時 ${Math.round(o.h24 || 0)} 毫米（${where}）`);
    else if ((o.h1 || 0) >= 15) add(2, '實測', `雨勢大：時雨量 ${o.h1} 毫米（${where}）`);
    // 到大雨多半是 24 小時累積（積淹水、坍方看的是這個）,不一定現在雨大——講累積,不講「雨勢大」
    else if (lv) add(lvRank(lv.name) <= lvRank('豪雨') ? 2 : 1, '實測', `${lv.name}：24 小時 ${Math.round(o.h24 || 0)} 毫米、時雨量 ${o.h1 ?? '—'} 毫米（${where}）`);
    else if (rainNow) add(1, '實測', `正在下雨：時雨量 ${o.h1 ?? '—'} 毫米（${where}）`);
    ok.push(`雨量${age(o.at || RAIN_AT)}`);
  } else no.push(RAIN.length ? `雨量（${RAIN_KM} 公里內沒有雨量站或資料太舊）` : '雨量');
  const ob = nearestObs(site);
  if (ob && ob.km <= 30 && now - (ob.o.at || OBS_AT) <= OUT_FRESH && (ob.o.gust != null || ob.o.wind != null)) {
    const g = ob.o.gust != null ? ob.o.gust : ob.o.wind * GUST_FACTOR, bf = ms2bf(g);
    gust = { g, bf, name: ob.o.name, km: ob.km };
    const txt = `陣風 ${bf} 級（${g.toFixed(1)} m/s，${esc(ob.o.name)}站 ${Math.round(ob.km)} 公里${ob.o.gust == null ? '，由平均風估' : ''}）`;
    if (bf >= 6) add(lvOfBf(bf), '實測', txt);
    ok.push(`陣風${age(ob.o.at || OBS_AT)}`);
  } else no.push('陣風');
  rs.sort((a, b) => b.lv - a.lv);
  const live = ok.some(x => /^(落雷|雨量|陣風)/.test(x));
  return { rs, ok, no, county, adv, warn, gust, live, ltnHold, rainNow, rainAcc, ltnOk: ok.some(x => /^落雷/.test(x)),
    ltnOld: LTN_AT && !ok.some(x => /^落雷/.test(x)) ? ltnT : 0 };
}

/* 附近（30 公里內）正在發生的危險,給「活動範圍」用：哪個方向、多遠。 */
function outHazards(site) {
  const now = Date.now(), out = [];
  const at = (p, txt) => { const km = distKm(site, p); if (km <= 30) out.push({ km, dir: dirName(bearing(site, p)), txt }); };
  const ltnT = LTN_DATA || LTN_AT;
  if (LTN_AT && now - ltnT <= 90 * 60000) {
    for (const s of LTN) if (s.cg && (!s.t || now - s.t <= HR)) at(s, '有對地落雷');
  }
  for (const o of RAIN) if ((o.h1 || 0) >= 15 && now - (o.at || RAIN_AT) <= OUT_FRESH) at(o.pos, `${esc(o.name)}站時雨量 ${o.h1} 毫米`);
  for (const o of OBS) {
    const g = o.gust != null ? o.gust : o.wind != null ? o.wind * GUST_FACTOR : null;
    if (g != null && ms2bf(g) >= 8 && now - (o.at || OBS_AT) <= OUT_FRESH) at(o.pos, `${esc(o.name)}站陣風 ${ms2bf(g)} 級`);
  }
  return out.sort((a, b) => a.km - b.km);
}

function outPlan(site) {
  const now = Date.now(), o = outlook(site);
  const t0 = Math.floor(now / HR) * HR;
  const day0 = new Date(now).setHours(0, 0, 0, 0);
  const day1 = new Date(day0 + 36 * HR).setHours(0, 0, 0, 0), day2 = new Date(day1 + 36 * HR).setHours(0, 0, 0, 0);
  const tf = townFor(site), fc = tf ? townSeries(tf.town) : [];
  const st = DB.stations.find(x => x.id === site.id);
  const model = DB.ty.data && SERIES && SERIES.length ? SERIES : null;
  const snapAt = t => { if (!model) return null; const i = Math.round((t - model[0].t) / HR); return i >= 0 && i < model.length ? model[i] : null; };
  const mMs = x => { const w = windAt(x, site); return w.ms * (st ? calFactor(st, w.dirFrom) : 1) * GUST_FACTOR; };
  /* 用附近實測陣風校正颱風推估：模型沒有地形,平地常偏高（真資料：臺北站實測 7 級、模型 11 級）。
     只在模型自己也算出 5 級以上時才校正——颱風還遠的時候實測風多半是別的天氣系統,比了沒意義。 */
  let k = 1;
  if (o.gust && model) { const x = snapAt(now); if (x) { const m = mMs(x); if (ms2bf(m) >= 5) k = clamp(o.gust.g / m, 0.5, 1.2); } }
  const offT = offOn(o.county, day0), offM = offOn(o.county, day1);
  /* 凌晨 0～5 點講「明天」,大家想的是天亮以後——那時日期上的明天其實是後天。這段時間改講今天白天 */
  const early = new Date(now).getHours() < 5, dayN = early ? day0 : day1, nWord = early ? '今天' : '明天';
  const S = [];
  for (let t = t0; t < day2; t += HR) {
    // base：不算落雷的等級——只因為剛打雷才不能出門的話,雷停 30 分鐘就能走,不必等到下一個整點
    const mid = t + HR / 2, s = { t, lv: 0, base: 0, known: false, why: [], gust: null, pop: null, thunder: false };
    const put = (lv, src, txt, ltn) => {
      if (lv > s.lv) s.lv = lv;
      if (!ltn && lv > s.base) s.base = lv;
      if (lv > 0) s.why.push({ lv, src, txt });
    };
    const f = fc.find(x => mid >= x.from && mid < x.to);
    if (f) {
      s.known = true; s.pop = f.pop;
      if (isThunder(f.wx)) { s.thunder = true; put(2, '官方預報', `有雷（${esc(f.wx)}）`); }
      else if (/豪雨|大雨/.test(f.wx)) put(2, '官方預報', `有${esc(f.wx)}`);
      else if ((f.pop ?? 0) >= 50) put(1, '官方預報', `降雨機率 ${f.pop}%`);
      if (Number.isFinite(f.bf)) { const g = fcGust(f.bf); s.gust = g; put(lvOfBf(g), '官方預報', `平均風 ${f.bf} 級（陣風約 ${g} 級）`); }
    }
    const x = snapAt(mid);
    // 這一小時有實測陣風就以實測為準,不再疊推估
    if (x && !(t === t0 && o.gust)) {
      s.known = true;
      const g = ms2bf(mMs(x) * k);
      s.gust = Math.max(s.gust ?? 0, g);
      put(lvOfBf(g), '推估', `颱風陣風約 ${g} 級${k !== 1 ? '（依附近實測校正）' : ''}`);
    }
    if (t === t0) {
      for (const r of o.rs) put(r.lv, r.src, r.txt, r.ltn);
      if (o.gust) s.gust = Math.max(s.gust ?? 0, o.gust.bf);
      if (o.live) s.known = true;
    } else {
      // 特報沒寫結束時間就只往後延 12 小時,不能一路掛到明天晚上
      for (const a of o.adv) if (a.end ? a.end > t : t < now + 12 * HR) put(a.lv, '官方', `${esc(a.kind)}特報`);
      const off = t < day1 ? offT : offM;
      if (off === 'full' || off === 'part') put(1, '官方', t < day1 ? '今天停班停課' : '明天停班停課');
      if (o.warn && t < now + 12 * HR) put(1, '官方', '陸上颱風警報範圍');
    }
    S.push(s);
  }
  const top = s => s.why.slice().sort((a, b) => b.lv - a.lv)[0];
  // 「18:00 起官方預報有雷」「起推估颱風陣風約 8 級」——來源接在前面讀得通,不用括號套括號
  const whyTxt = s => { const w = top(s); return w ? `${w.src}${w.txt}` : ''; };
  const whenTxt = ts => { const d = Math.round((new Date(ts).setHours(0, 0, 0, 0) - day0) / 86400000);
    return `${d === 0 ? '' : d === 1 ? '明天 ' : d === 2 ? '後天 ' : relDay(ts) + ' '}${fmtClock(ts)}`; };
  const runEnd = j => { let e = j; while (e < S.length && S[e].known && S[e].lv <= 1) e++; return e; };
  const endAt = e => e < S.length ? S[e].t : day2;
  const cur = S[0], dos = [];
  let v, head, sub = '', back = null, okFrom = null, R = null;
  if (!cur.known) {
    v = 'unk'; head = '資料不足，無法判斷';
    sub = '現在沒有這附近的實測，也沒有預報或颱風推估可以看。';
  } else {
    const jb = S.findIndex((s, i) => i >= 1 && s.known && s.lv >= 2);
    const jg = S.findIndex((s, i) => i >= 1 && !s.known);
    back = jb > 0 ? S[jb].t - 30 * 60000 : null;
    // 後面沒資料不算轉差,不拿來縮短可出門的時間（另外講「幾點以後沒有預報」）
    const mins = back ? (back - now) / 60000 : Infinity;
    const canGo = cur.lv <= 1 && !(o.ltnHold > now) && mins >= 40;
    if (canGo) {
      v = cur.lv === 0 && o.live ? 'grn' : 'yel';
      // 黃燈（停班停課、警報、風雨不大但有）講「必要的話」——官方的意思是非必要不外出,不能寫得像沒事
      const go = v === 'grn' ? '現在可以出門' : '必要的話可以出門';
      if (back) {
        head = mins < 120 ? `${v === 'grn' ? '可以' : '必要的話'}就近出門，${fmtClock(back)} 前回到家` : `${go}，${whenTxt(back)} 前回到家`;
        dos.push(['回家', `<b>${whenTxt(back)} 前</b>，${whenTxt(S[jb].t)} 起${whyTxt(S[jb])}`]);
      } else {
        head = go;
        sub = jg > 0 ? `${whenTxt(S[jg].t)} 以後沒有預報資料，到時再看。`
          : v === 'grn' ? '到明天晚上都沒有發現轉差的訊號。' : '到明天晚上風雨都差不多，沒有發現更強的時段。';
      }
      // 活動範圍：附近哪裡已經有雷、大雨、強風；時間短就別走遠
      const hz = outHazards(site), h = hz[0];
      const RT = mins < 60 ? 1 : mins < 120 ? 3 : mins < 240 ? 5 : 10;
      const RS = h ? ([10, 5, 3, 1].find(r => r <= h.km - 2) || 1) : 10;
      R = Math.min(RT, RS);
      dos.push(['範圍', `<b>${R} 公里內</b>${h && RS <= RT ? `，${h.dir}方 ${Math.round(h.km)} 公里${h.txt}`
        : RT < 10 ? `，離回家只有 ${mins < 60 ? Math.round(mins) + ' 分鐘' : (mins / 60).toFixed(1) + ' 小時'}` : ''}`]);
      const win = S.slice(0, jb > 0 ? jb : jg > 0 ? jg : S.length);
      const pop = Math.max(-1, ...win.map(s => s.pop ?? -1)), windy = win.some(s => (s.gust ?? 0) >= 6);
      if (o.rainNow || pop >= 30) dos.push(['帶', `${windy ? '雨衣（風大，傘不好撐）' : '雨具'}${pop >= 30 ? `，降雨機率最高 ${pop}%` : '，現在正在下雨'}`]);
      else if (windy) dos.push(['注意', '風大，騎車、走騎樓邊小心掉落物']);
      // 接下來有一段長的壞天氣：提醒趁現在把該辦的辦完
      if (jb > 0 && S[jb].t - now <= 18 * HR) {
        let e = jb; while (e < S.length && S[e].known && S[e].lv >= 2) e++;
        if (e - jb >= 4) dos.push(['提早', `${whenTxt(S[jb].t)} 起到 ${whenTxt(endAt(e))} 風雨較大，要採買、加油趁現在`]);
      }
    } else {
      const ltnOnly = o.ltnHold > now && cur.base <= 1;
      v = cur.lv >= 3 ? 'red' : cur.lv === 2 ? 'org' : 'yel';
      head = ltnOnly ? `附近剛打雷，${fmtClock(o.ltnHold)} 後再出門` : cur.lv >= 3 ? '現在不要出門' : cur.lv === 2 ? '現在盡量不要出門'
        : `${fmtClock(S[jb].t)} 起轉差，現在出門來不及回來`;
      if (ltnOnly) {
        okFrom = o.ltnHold;
        dos.push(['最早', `<b>${fmtClock(okFrom)} 後</b>可以出門${back ? `（${whenTxt(back)} 前回到家）` : ''}`]);
      } else {
        // 最早幾點可以出門：現在壞就從下一小時找；來不及回來的就從那段壞天氣之後找
        const j = S.findIndex((s, i) => i >= (cur.lv >= 2 ? 1 : jb) && s.known && s.lv <= 1);
        if (j >= 0) {
          okFrom = Math.max(S[j].t, o.ltnHold || 0);
          const e = runEnd(j);
          dos.push(['最早', `<b>${whenTxt(okFrom)} 後</b>可以出門${e < S.length ? `（到 ${whenTxt(endAt(e))}）` : ''}`]);
        } else sub = jg > 1 ? `到 ${whenTxt(S[jg].t)} 為止都沒有轉好，之後沒有預報資料。`
          : jg === 1 ? '接下來沒有預報資料，晚點更新再看。' : '到明天晚上都沒有轉好。';
      }
      // 現在還好、只是來不及回來：第一行講幾點起、為什麼轉差,不是現在的小事
      const w = top(cur);
      if (cur.lv <= 1 && !ltnOnly && jb > 0) dos.unshift(['轉差', `${fmtClock(S[jb].t)} 起${whyTxt(S[jb])}`]);
      else if (w) dos.unshift(['現在', `<em>${w.src}</em>${w.txt}`]);
    }
    if (o.warn || /豪雨/.test(o.rainAcc) || o.adv.some(a => /豪雨/.test(a.kind))) dos.push(['避開', '山區、河堤、海邊、地下道']);
    if (!o.ltnOk) dos.push(['注意', `${o.ltnOld ? `落雷資料是 ${ageTxt(o.ltnOld)}的，太舊不能用` : '沒有落雷資料'}：聽到雷聲就進室內，雷停 30 分鐘後再出門`]);
    if (!o.live) sub = (sub ? sub + ' ' : '') + '現在沒有這附近的實測，只靠預報與推估。';
  }
  // ── 明天：四個時段、官方停班停課、最適合出門的時段 ──
  const PER = [['凌晨', 0, 6], ['上午', 6, 12], ['下午', 12, 18], ['晚上', 18, 24]];
  const tm = PER.map(([n, a, b]) => {
    const kn = S.filter(s => s.known && s.t >= dayN + a * HR && s.t < dayN + b * HR);
    if (!kn.length) return { n, lv: null };
    const g = Math.max(0, ...kn.map(s => s.gust ?? 0)), pop = Math.max(-1, ...kn.map(s => s.pop ?? -1));
    return { n, lv: Math.max(...kn.map(s => s.lv)), gust: g || null, pop: pop >= 0 ? pop : null, thunder: kn.some(s => s.thunder) };
  });
  let best = null;
  for (let i = 0; i < S.length; i++) {
    if (S[i].t < dayN + 6 * HR || S[i].t >= dayN + 21 * HR || !S[i].known || S[i].lv > 1) continue;
    let e = i; while (e < S.length && S[e].t < dayN + 21 * HR && S[e].known && S[e].lv <= 1) e++;
    if (!best || e - i > best.n) best = { a: S[i].t, b: e < S.length ? S[e].t : dayN + 21 * HR, n: e - i };
    i = e;
  }
  const dayKnown = S.filter(s => s.t >= dayN + 6 * HR && s.t < dayN + 21 * HR && s.known).length;
  const bestLv = best ? Math.max(...S.filter(s => s.t >= best.a && s.t < best.b).map(s => s.lv)) : 0;
  const bestTxt = best && best.n >= 15 ? (bestLv ? `${nWord}白天都可以出門，注意風雨。` : `${nWord}白天都沒有發現危險訊號。`)
    : best ? `${nWord} ${fmtClock(best.a)}–${fmtClock(best.b)} 比較適合出門。`
    : dayKnown ? `${nWord}白天都不建議出門。` : `${nWord}白天的資料不足。`;
  return { v, head, sub, dos, S, o, back, okFrom, R, tm, best, bestTxt, offM: early ? offT : offM, dayN, nWord, tf };
}

const OUT_LV = ['沒發現危險', '注意', '盡量不要', '不要出門'];
function outTimeline(S, now) {
  const x0 = S[0].t, span = S.length * HR, pct = t => ((t - x0) / span * 100).toFixed(2);
  const ticks = S.filter((s, i) => i > 0 && new Date(s.t).getHours() % 6 === 0 && (s.t - x0) / span > 0.13)
    .map(s => { const h = new Date(s.t).getHours();
      return `<span style="left:${pct(s.t)}%">${h === 0 ? (s.t - x0 < 24 * HR ? '明天' : '後天') : p2(h)}</span>`; }).join('');
  return `<div class="tl" aria-label="逐小時出門等級">
    <div class="tl-bar">${S.map(s => `<i class="${s.known ? 'l' + s.lv : 'lx'}" title="${fmtClock(s.t)} ${s.known ? OUT_LV[s.lv] : '沒資料'}"></i>`).join('')}
      <b class="tl-now" style="left:${pct(now)}%"></b></div>
    <div class="tl-ax"><span class="tl-0">現在</span>${ticks}</div>
    <div class="tl-lg"><i class="l3"></i>不要出門<i class="l2"></i>盡量不要<i class="l1"></i>注意<i class="l0"></i>沒發現危險<i class="lx"></i>沒資料</div>
  </div>`;
}
function outCard(site) {
  if (!site || !Number.isFinite(site.lat)) return '';
  /* 算不出來只壞這一張卡：以前這裡丟錯,整個天氣頁（連預報）都畫不出來 */
  try { return outCardHtml(site); } catch (e) {
    console.error('出門建議', e);
    return `<div class="card pad out-card out-unk"><div class="out-h"><span class="lbl">出門建議</span></div>
      <p class="out-sub">算不出來（${esc((e && e.message) || e)}）。請截圖這一段給維護的人；下面的預報與實測照常可看。</p></div>`;
  }
}
function outCardHtml(site) {
  const now = Date.now(), p = outPlan(site), o = p.o, d1 = new Date(p.dayN), W = p.nWord;
  const offTxt = { full: `官方：${W}停止上班上課`, part: `官方：${W}部分地區停班停課`, none: `官方：${W}照常上班上課` }[p.offM]
    || (p.offM === null ? `${W}的停班停課還沒公布` : '');
  const why = p.S[0].why.slice().sort((a, b) => b.lv - a.lv);
  return `<div class="card pad out-card out-${p.v}">
    <div class="out-h"><span class="lbl">出門建議${o.county ? `　${esc(o.county)}` : ''}</span><span class="mono out-t">${fmtClock(now)}</span></div>
    <div class="out-v"><i></i><b>${p.head}</b></div>
    ${p.sub ? `<p class="out-sub">${p.sub}</p>` : ''}
    ${p.dos.length ? `<dl class="out-do">${p.dos.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>` : ''}
    ${p.v !== 'unk' ? outTimeline(p.S, now) : ''}
    <div class="out-tm">
      <div class="out-h"><span class="lbl">${W} ${d1.getMonth() + 1}/${d1.getDate()}（${WEEK[d1.getDay()]}）</span>${offTxt
        ? `<a class="out-off" href="${DGPA_URL}" target="_blank" rel="noopener">${offTxt} ↗</a>` : ''}</div>
      <div class="out-pd">${p.tm.map(t => `<div class="pd-${t.lv ?? 'x'}"><b>${t.n}</b><span>${t.lv == null ? '沒資料' : OUT_LV[t.lv]}</span><small>${
        t.lv == null ? '—' : [t.gust ? `陣風 ${t.gust} 級` : '', t.pop != null ? `雨 ${t.pop}%` : '', t.thunder ? '有雷' : ''].filter(Boolean).join('・') || '—'}</small></div>`).join('')}</div>
      <p class="out-sub">${p.bestTxt}</p>
    </div>
    <details class="fold out-why"><summary>判斷依據<span class="fold-s">${why.length ? `現在 ${why.length} 條` : '現在沒有危險訊號'}</span></summary>
      ${why.length ? `<ul class="out-rs">${why.map(r => `<li class="lv${r.lv}"><em>${r.src}</em><span>${r.txt}</span></li>`).join('')}</ul>` : ''}
      <p class="hint">已查：${o.ok.join('、') || '—'}${o.no.length ? `；沒有資料：${o.no.join('、')}` : ''}${p.tf ? `；預報用${esc(p.tf.town.name)}${p.tf.km != null ? `（${p.tf.km} 公里）` : ''}` : '；沒有預報'}。</p>
      <p class="hint">怎麼判斷：陣風 10 級以上不要出門、8～9 級盡量不要（走路吃力、樹枝斷落）、6～7 級傘撐不住；
        5 公里內 30 分鐘內有對地落雷不要出門，雷停 30 分鐘後再出門；時雨量 40 毫米以上不要出門、15 毫米以上盡量不要。
        預報的平均風換算成陣風（×1.3）跟實測同一把尺；颱風推估依附近實測陣風校正。回家時間＝轉差前 30 分鐘。</p>
    </details>
    <p class="hint">路況、坍方、淹水這裡看不到，以政府公告與現場狀況為準。</p>
  </div>`;
}

function wxCard() {
  // 不放「天氣」大標：分頁鈕上面已經寫了「天氣」,手機上多一行就把出門建議往下推（使用者要求拿掉）
  const head = wxPicker();
  const mode = wxMode();
  if (mode === 'all') return head + wxAllTable();

  const st = wxSite();
  if (!st || st.gone) {
    return head + `<div class="msg ${st ? 'e' : 'i'}">${st
      ? '原本選的站臺已經不存在了，請從上面重新選一個地點。'
      : '還沒有可用的地點。'}</div>`;
  }
  if (st.pending) {
    return head + wxWhere(st, '尚未定位')
      + `<div class="msg i">${GEO_BUSY ? '定位中…'
        : '尚未取得目前位置。按上面的「取得目前位置」，或改選一個站臺。'}</div>`;
  }
  return head + wxDetail(st);
}

/* ── 全部站臺：卡片列 ────────────────────────────────────
   本來是一張表。表格在手機上要靠欄位對齊才讀得懂,而站臺名稱長度
   差很多,對不齊就得瞇著眼睛找。改成一站一張卡:左邊名字與狀態,
   右邊大字寫**最該知道的那一個數字**,底下一行摘要。            */
function wxAllTable() {
  const list = wxSites();
  if (!list.length) {
    return `<div class="msg i">還沒有任何有座標的站臺。天氣要靠座標才對得到雨量站與鄉鎮預報。</div>`;
  }
  const R = ltnRadius();
  const rows = list.map(x => {
    const rn = nowRain(x);
    const tf = townFor(x);
    const ser = tf ? townSeries(tf.town).filter(y => y.to > Date.now()) : [];
    const cur = ser[0] || null;
    const wet = ser.find(y => isRainy(y.wx) || (y.pop != null && y.pop >= 70));
    const th = ser.find(y => isThunder(y.wx));
    const zone = thunderFor(x);
    const st = strikesNear(x, R);
    return { x, rn, tf, ser, cur, wet, th, zone, st };
  });
  const wetN = rows.filter(r => r.rn && r.rn.raining).length;
  const thN = rows.filter(r => r.zone || r.st.cg > 0).length;
  const noRn = rows.filter(r => !r.rn).length;

  /* 排序:有事的排前面。由北至南是「找某一站」的順序,
     但這一頁問的是「哪一站要出事」—— 那就該讓出事的浮上來。 */
  const score = r => (r.st.cg > 0 ? 400 : 0) + (r.zone ? 300 : 0)
    + (r.rn && r.rn.raining ? 200 : 0) + (r.th ? 50 : 0) + (r.wet ? 10 : 0);
  const sorted = rows.slice().sort((a, b) => score(b) - score(a));

  const card = r => {
    const hot = r.st.cg > 0 || r.zone;
    const wetNow = r.rn && r.rn.raining;
    const col = hot ? 'var(--no)' : wetNow ? 'var(--acc)' : 'var(--fg3)';
    const bits = [];
    if (r.st.cg > 0) bits.push(`<b style="color:var(--no)">${R} km 內 ${r.st.cg} 次雲對地落雷</b>`);
    else if (r.zone) bits.push(`<b style="color:var(--no)">${esc(r.zone.kind)}範圍內</b>`);
    if (wetNow) bits.push(`時雨量 ${r.rn.h1 == null ? '—' : r.rn.h1} mm`
      + `　24 小時 ${r.rn.h24 == null ? '—' : Math.round(r.rn.h24)} mm`);
    if (!wetNow && r.wet) bits.push(`${relDay(r.wet.from)}${fmtClock(r.wet.from)} 起預報有雨`);
    if (!wetNow && !r.wet && r.tf) bits.push('預報時段內無明顯降雨');
    if (!r.rn) bits.push('無鄰近雨量站');
    if (!r.tf) bits.push(WX_ERR ? '預報取得失敗' : '尚未取得預報');

    return `<button type="button" class="wxcard" onclick="setWxLoc('${esc(r.x.id)}')"
      style="border-left-color:${col}">
      <span class="wc-l">
        <b class="wc-n">${esc(r.x.name)}</b>
        <span class="wc-s">${wetNow ? '<span style="color:var(--acc)">正在下雨</span>'
          : r.cur ? esc(r.cur.wx || '—') : '—'}
          <span style="color:var(--fg4)">　${S_LABEL[r.x.status] || ''}</span></span>
        <span class="wc-b">${bits.join('　')}</span>
      </span>
      <span class="wc-r">
        <span class="wc-i">${r.cur ? wxIcon(r.cur.wx, r.cur.from) : '—'}</span>
        <span class="wc-t">${r.cur && r.cur.t != null ? r.cur.t + '°' : ''}</span>
        <span class="wc-p">${r.cur && r.cur.pop != null ? r.cur.pop + '%' : ''}</span>
      </span>
      <span class="wc-a">›</span></button>`;
  };

  return `<div class="card pad" style="margin-bottom:0.5rem">
      <b style="font-size:1.0625rem;color:${thN ? 'var(--no)' : wetN ? 'var(--acc)' : noRn === list.length ? 'var(--fg3)' : 'var(--ok)'}">${
        // 沒有雨量資料的站不能算進「沒有下雨」——沒資料不等於沒下
        thN ? `${thN} 站有雷` : wetN ? `${wetN} 站正在下雨` : noRn === list.length ? '沒有雨量資料，無法判斷有沒有下雨'
          : noRn ? `可判斷的 ${list.length - noRn} 站目前都沒有下雨` : '全部站臺目前都沒有下雨'}</b>
      <span class="mono" style="font-size:0.6875rem;color:var(--fg4)">　共 ${list.length} 站</span>
      <div class="hint" style="margin-top:0.25rem">有狀況的排前面，點卡片看單站預報。
        「正在下雨」是雨量站<b>實測</b>，其餘是<b>預報</b>（一格 3 小時）。</div>
    </div>`
    + sorted.map(card).join('');
}

/* ── 單一地點 ─────────────────────────────────────────── */
function wxDetail(st) {
  const rn = nowRain(st);
  const zone = thunderFor(st);
  const tf = townFor(st);
  const ser = tf ? townSeries(tf.town).filter(x => x.to > Date.now()) : [];
  const cur = ser[0] || null;

  const where = wxWhere(st, st.geo ? `${esc(placeOf(st) || '')}${placeOf(st) ? '　' : ''}GPS 定位` : (countyOf(st) || ''));

  // ── 大字現況 ──
  const hero = `<div class="card pad wxhero" style="margin-bottom:0.5rem">
    <div class="wh-top">
      <span class="wh-i">${cur ? wxIcon(cur.wx, cur.from) : '—'}</span>
      <span class="wh-m">
        <b class="wh-v" style="color:${rn && rn.raining ? 'var(--acc)' : 'var(--fg)'}">${
          rn ? (rn.raining ? '正在下雨' : '目前沒有下雨') : '無雨量站可判斷'}</b>
        <span class="wh-s">${cur ? esc(cur.wx || '') : ''}${
          cur && cur.t != null ? `　${cur.t}°` : ''}${
          cur && cur.pop != null ? `　降雨機率 ${cur.pop}%` : ''}</span>
      </span></div>
    ${rn ? `<div class="mono wh-r">10 分鐘 ${rn.m10 == null ? '—' : rn.m10} mm　
      時雨 ${rn.h1 == null ? '—' : rn.h1} mm　24 小時 ${rn.h24 == null ? '—' : Math.round(rn.h24)} mm
      <span style="color:var(--fg4)">　實測 ${esc(rn.name)} ${rn.km} km</span></div>` : ''}
    ${zone ? `<div class="msg e" style="margin:0.5rem 0 0"><b>這一站在「${esc(zone.kind)}」範圍內</b>
      （${esc(zone.area)}${zone.end ? `，至 ${fmtShort(zone.end)}` : ''}）。
      依單位規定，雷雨期間應關閉站臺設備。</div>` : ''}
  </div>`;

  if (!tf) {
    return where + outCard(st) + hero + `<div class="msg ${WX_ERR ? 'e' : 'i'}">${
      WX_ERR ? `預報取得失敗：${esc(WX_ERR)}。資料集代號可在「設定 › 資料來源 › 天氣預報」修改。`
      : '尚未取得鄉鎮天氣預報。按戰情頁上方「更新」，或到「設定 › 資料來源」確認授權碼與天氣預報資料集。'}</div>`;
  }

  // ── 一句話：接下來會怎樣 ──
  const wet = ser.find(x => isRainy(x.wx) || (x.pop != null && x.pop >= 70));
  const lead = wet
    ? (wet === ser[0]
      ? '<b style="color:var(--acc)">目前時段預報有雨</b>'
      : `<b style="color:var(--acc)">${relDay(wet.from)}${fmtClock(wet.from)}</b> 起預報有雨`)
    : '<span style="color:var(--ok)">未來預報時段內都沒有明顯降雨</span>';

  // ── 橫向逐 3 小時 ──
  const soon = ser.filter(x => x.from < Date.now() + 30 * 3600000);
  const strip = soon.length ? `<div class="wxstrip">${soon.map(x => {
    const th = isThunder(x.wx), rain = isRainy(x.wx);
    return `<div class="ws-c${th ? ' hot' : rain ? ' wet' : ''}">
      <span class="ws-d">${relDay(x.from)}</span>
      <span class="ws-t mono">${fmtClock(x.from)}</span>
      <span class="ws-i">${wxIcon(x.wx, x.from)}</span>
      <span class="ws-w">${esc(x.wx || '—')}</span>
      <span class="ws-p mono" style="color:${x.pop == null ? 'var(--fg4)'
        : x.pop >= 70 ? 'var(--no)' : x.pop >= 30 ? 'var(--sb)' : 'var(--fg3)'}">${
        x.pop == null ? '—' : x.pop + '%'}</span>
      <span class="ws-g mono">${x.t == null ? '' : x.t + '°'}</span>
      <span class="ws-b mono">${slotBf(x) == null ? '' : slotBf(x) + ' 級'}</span>
    </div>`;
  }).join('')}</div>` : '<div class="msg i">預報時段都已過去，請按上方「更新」。</div>';

  // ── 逐日（只有官方）──
  const days = townDays(ser);
  const tMin = Math.min(...days.map(d => d.lo).filter(Number.isFinite));
  const tMax = Math.max(...days.map(d => d.hi).filter(Number.isFinite));
  const span = (tMax - tMin) || 1;
  const dayRow = d => {
    const l = Number.isFinite(d.lo) ? d.lo : null, h = Number.isFinite(d.hi) ? d.hi : null;
    const left = l == null ? 0 : ((l - tMin) / span) * 100;
    const w = (l == null || h == null) ? 0 : Math.max(4, ((h - l) / span) * 100);
    return `<div class="wxday">
      <span class="wd-n">${sameDay(d.at, Date.now()) ? '今天' : `${WK_CH[new Date(d.at).getDay()]}`}
        <span class="mono" style="color:var(--fg4);font-size:0.6875rem">${
          new Date(d.at).getMonth() + 1}/${new Date(d.at).getDate()}</span></span>
      <span class="wd-i">${wxIcon(d.wx, d.at + 12 * 3600000)}</span>
      <span class="wd-p mono" style="color:${d.pop == null ? 'var(--fg4)'
        : d.pop >= 70 ? 'var(--no)' : d.pop >= 30 ? 'var(--sb)' : 'var(--fg3)'}">${
        d.pop == null ? '' : d.pop + '%'}</span>
      ${(l == null && h == null)
        ? '<span class="wd-none">無溫度資料</span>'
        : `<span class="wd-lo mono">${l == null ? '' : l + '°'}</span>
           <span class="wd-bar"><i style="left:${left}%;width:${w}%"></i></span>
           <span class="wd-hi mono">${h == null ? '' : h + '°'}</span>`}
    </div>`;
  };

  // ── 完整數字表（收起來）──
  const cell = x => {
    const rain = isRainy(x.wx), th = isThunder(x.wx);
    const popCol = x.pop == null ? 'var(--fg4)' : x.pop >= 70 ? 'var(--no)' : x.pop >= 30 ? 'var(--sb)' : 'var(--fg3)';
    return `<tr${th ? ' style="background:var(--no-d)"' : rain ? ' style="background:var(--acc-d)"' : ''}>
      <td class="mono" style="white-space:nowrap">${relDay(x.from)}<br>
        <span style="color:var(--fg4)">${fmtClock(x.from)}–${fmtClock(x.to)}</span></td>
      <td style="color:${th ? 'var(--no)' : rain ? 'var(--acc)' : 'var(--fg2)'}">${esc(x.wx || '—')}</td>
      <td class="mono" style="color:${popCol};font-weight:700;text-align:right">${
        x.pop == null ? '—' : x.pop + '%'}</td>
      <td class="mono" style="text-align:right">${x.t == null ? '—' : x.t + '°'}</td>
      <td class="mono" style="text-align:right;color:var(--fg3)">${
        slotBf(x) == null ? '—' : bfLabel(slotBf(x))}</td></tr>`;
  };

  return where + outCard(st) + hero + `<div class="card pad" style="margin-bottom:0.75rem">
    <div style="margin-bottom:0.5rem">
      <span class="mono" style="font-size:0.6875rem;color:var(--fg4)">預報</span>
      ${lead}
      <span class="mono" style="font-size:0.6875rem;color:var(--fg4)">
        　${esc(tf.town.name)}${tf.km != null ? `（${tf.km} km）` : `（依${tf.by}對應）`}</span></div>
    ${strip}
    <div class="hint" style="margin-top:0.375rem">
      橫向捲動看更遠的時段。<b>一格是 3 小時</b>——官方最細就是這樣，本程式不做內插。</div>
    ${days.length ? `<div class="sec2">逐日　${days.length} 天（中央氣象署）</div>`
      + days.map(dayRow).join('')
      + `<div class="hint" style="margin-top:0.375rem">官方逐日最長就是 1 週，本程式不接第三方的長天期預報。</div>`
      : ''}
    <details style="margin-top:0.5rem">
      <summary style="cursor:pointer;font-size:0.8125rem;color:var(--acc);padding:0.25rem 0">
        完整數字表（${ser.length} 個時段）</summary>
      <div style="overflow-x:auto"><table class="impact wx">
        <colgroup><col class="c-t"><col><col style="width:2.9rem"><col style="width:2.6rem">
          <col style="width:2.9rem"></colgroup>
        <tr><th>時段</th><th>天氣</th><th>降雨</th><th>溫度</th><th>風</th></tr>
        ${ser.map(cell).join('')}</table></div></details>
    <p class="hint" style="margin-top:0.5rem">
      <b>「正在下雨」是雨量站的實測</b>（10 分鐘累積），不是預報。
      要看「等一下會不會下」請用<b>本頁上方的雷達回波</b>，那才是臨近預報該看的東西。
      ${WX_ERR ? `<br><b style="color:var(--no)">部分預報取得失敗：${esc(WX_ERR)}</b>` : ''}</p>
  </div>`;
}

/* ── 停班停課：官方公告與本機推估合成一張表 ────────────────
   以前是兩張卡:一張「推估」、一張「官方公告」。同一件事分兩處講,
   讀的人得自己在兩張卡之間對照 —— 而且推估說沒事、官方說停課時,
   兩張卡會並排給出相反的印象。合成一張:
   **每個縣市一列,官方在左（是事實）、推估在右（是推算）**,
   一列裡就看得出「現在放不放假」跟「接下來可能怎樣」。

   全臺二十二個縣市都算,由北到南排 —— 停班停課本來就是以縣市為單位宣布的,
   只算自己站臺所在的那幾個縣市,反而看不出颱風正從哪個方向掃過來。   */
function countyEstimate(name) {
  const pt = COUNTY_PT[name];
  if (!pt) return null;
  const wins = SERIES ? suspendWindows(SERIES, pt) : [];
  const ref = { lat: pt.lat, lng: pt.lng, county: name, terrain: 'flat' };
  const rain = advRainFor(ref);
  const w0 = wins[0] || null;
  const wEnd = wins.length ? wins[wins.length - 1].to : 0;
  // 推估的「到何時取消」:風力款看最後一段達標時段的結束,雨量款看特報有效期
  const until = Math.max(wEnd || 0, (rain && rain.meets && rain.end) || 0) || 0;
  return {
    name, lat: pt.lat,
    wind: w0 ? { from: w0.from, to: wEnd, peakBf: Math.max(...wins.map(x => x.peakBf)) } : null,
    rain: rain && rain.meets ? rain : null,
    rainNear: rain || null,
    until,
    any: !!w0 || !!(rain && rain.meets),
  };
}

/* ── 公告時機 ────────────────────────────────────────────
   《天然災害停止上班及上課作業辦法》第 10 條（颱風警報期間）：
   · 全日或上午半日停止：前一日晚間 7 時至 10 時前發布，11 時前播報。
   · 下午半日或晚間停止：當日上午 10 時 30 分前發布，11 時前播報。
   · 前一日沒發布、當日零時後風雨增強達基準：當日上午 4 時 30 分前發布，5 時前播報。
   所以「明天下午才達到風力」的縣市,可能今晚就公告全日,也可能明天早上 10:30 前才公告下午停。
   這裡只講法規給的時間窗,不猜地方政府會選哪一個。 */
function announceHint(from) {
  const d = new Date(from), day0 = new Date(from); day0.setHours(0, 0, 0, 0);
  const D = day0.getTime(), now = Date.now(), H = 3600000;
  const eve = `${relDay(D - 1)}晚間 19–22 時`;
  if (d.getHours() < 12) {
    return now < D - 2 * H ? `${eve}（全日或上午停）`
      : now < D + 4.5 * H ? `已過前晚公告時限；若凌晨風雨增強，最晚${relDay(D)} 04:30 前公告`
      : '已過公告時限';
  }
  return now < D + 10.5 * H
    ? `最晚${relDay(D)} 10:30 前（下午或晚間停）；也可能${eve}一併公告全日`
    : '已過下午／晚間的公告時限（當日 10:30）';
}

/* 一列的官方狀態。回傳 null 代表還沒取得公告。 */
function countyOfficial(name) {
  if (!DGPA_LIVE) return null;
  const hit = DGPA_LIVE.find(r => cnorm(r.county) === cnorm(name));
  if (hit) return hit;
  /* 官方公告「無停班停課訊息」的日子,表上一列縣市都沒有。
     那時每一縣市的官方狀態是「照常」,不是「尚未取得」——
     後者會讓值班的人以為公告還沒出來,其實已經出來了,寫的是沒事。 */
  if (DGPA_NONE) {
    return { county: name, lines: [{ txt: '無停班停課訊息。', stop: false, scope: 'all' }],
      full: false, part: false, alert: false, none: true };
  }
  return null;
}

/* ── 推估與官方比對 ───────────────────────────────────────
   使用者要「預估與實際都保留,做個比對」。每天、每個縣市記兩件事：
   e＝我們推估那天停不停（風力時段落在當天 06–22 時,或雨量特報達基準）,
   o＝官方公告那天的結果（全縣停／部分停／照常）。
   官方一公告,那天的推估就凍結,不再被之後的推估蓋掉——比的是「公告前我們怎麼估」。 */
const CMP_KEEP_DAYS = 30;
const dayKey = ts => { const d = new Date(ts); return `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`; };

  const out = new Set();
  if (!e) return out;
  if (e.wind) {
    for (let t = new Date(e.wind.from).setHours(0, 0, 0, 0); t <= e.wind.to; t += 86400000) {
      // 跟上班上課有關的是白天到晚間；凌晨兩點吹到門檻、六點前就減弱,不算那天
      if (Math.min(e.wind.to, t + 22 * 3600000) > Math.max(e.wind.from, t + 6 * 3600000)) out.add(dayKey(t));

}
// 公告頁的日期（民國年）；拿不到就當今天
function dgpaPageDay() {
  const m = /(\d{2,3})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/.exec(DGPA_HEAD || '');
  return m ? new Date(+m[1] + 1911, +m[2] - 1, +m[3]).getTime() : new Date().setHours(0, 0, 0, 0);
}

  if (!o) return null;

  const lines = (o.lines || []).filter(l => tomorrow ? /明天|明日/.test(l.txt) : !/明天|明日/.test(l.txt));
  if (tomorrow && !lines.length) return null;            // 明天的還沒公告
  const stop = lines.filter(l => l.stop);
  return stop.some(l => l.scope === 'all') ? 'full' : stop.length ? 'part' : 'none';
}
function recordCmp() {
  if (!DB.dgpaCmp || typeof DB.dgpaCmp !== 'object') DB.dgpaCmp = {};
  const C = DB.dgpaCmp, now = Date.now(), today = new Date().setHours(0, 0, 0, 0);
  const pageTs = dgpaPageDay();
  let changed = false;
  for (const name of COUNTIES_NS) {
    const e = SERIES ? countyEstimate(name) : null;
    const days = estDays(e);
    for (const k of [dayKey(today), dayKey(today + 86400000), dayKey(today + 2 * 86400000)]) {
      const row = (C[k] = C[k] || {})[name] = C[k][name] || {};
      if (row.o == null && SERIES) {                     // 官方公告前才更新推估
        const v = days.has(k) ? 1 : 0;
        if (row.e !== v) { row.e = v; row.eAt = now; changed = true; }
      }
    }
    if (DGPA_LIVE || DGPA_NONE) {
      const o = countyOfficial(name);
      for (const dTs of [pageTs, pageTs + 86400000]) {
        const v = officialFor(o, dTs, pageTs);
        if (v == null) continue;
        const k = dayKey(dTs);
        const row = (C[k] = C[k] || {})[name] = C[k][name] || {};
        if (row.o !== v) { row.o = v; row.oAt = now; changed = true; }
      }
    }
  }
  const cut = dayKey(today - CMP_KEEP_DAYS * 86400000);
  for (const k of Object.keys(C)) if (k < cut) { delete C[k]; changed = true; }

}
function cmpCard() {
  const C = DB.dgpaCmp || {};
  const days = Object.keys(C).sort().reverse()
    .filter(k => Object.values(C[k]).some(r => r.e || (r.o && r.o !== 'none'))).slice(0, 7);
  if (!days.length) return '';
  const lab = { full: '全縣停', part: '部分停', none: '照常' };
  const dayHtml = k => {
    const rows = Object.entries(C[k]);
    const ok = rows.filter(([, r]) => r.o != null && !!r.e === (r.o !== 'none'));
    const over = rows.filter(([, r]) => r.o === 'none' && r.e);
    const miss = rows.filter(([, r]) => r.o && r.o !== 'none' && !r.e);
    const wait = rows.filter(([, r]) => r.o == null && r.e);
    const list = (arr, f) => arr.map(([n, r]) => `${esc(n)}${f ? `（${f(r)}）` : ''}`).join('、');
    const [y, m, d] = k.split('-').map(Number);
    return `<details style="border-top:1px solid var(--edge);padding:0.375rem 0">
      <summary style="cursor:pointer;font-size:0.875rem;min-height:2.75rem;display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap">
        <b>${m}/${d}（${relDay(new Date(y, m - 1, d).getTime())}）</b>
        <span style="color:var(--ok)">一致 ${ok.length}</span>
        <span style="color:var(--sb)">推估多報 ${over.length}</span>
        <span style="color:var(--no)">推估漏報 ${miss.length}</span>
        ${wait.length ? `<span style="color:var(--fg4)">待公告 ${wait.length}</span>` : ''}</summary>
      <div class="hint" style="line-height:1.7">
        ${over.length ? `<div><b style="color:var(--sb)">推估停、官方照常：</b>${list(over)}</div>` : ''}
        ${miss.length ? `<div><b style="color:var(--no)">官方停、推估沒估到：</b>${list(miss, r => lab[r.o])}</div>` : ''}
        ${ok.filter(([, r]) => r.e).length ? `<div><b style="color:var(--ok)">推估停、官方也停：</b>${list(ok.filter(([, r]) => r.e), r => lab[r.o])}</div>` : ''}
        ${wait.length ? `<div><b>推估停、官方尚未公告：</b>${list(wait)}</div>` : ''}
      </div></details>`;
  };
  return `<div class="sec"><h2>推估與官方比對</h2></div>
    <div class="card pad" style="margin-bottom:0.75rem">
      ${days.map(dayHtml).join('')}
      <p class="hint" style="margin-top:0.5rem">每天每縣市保留「公告前最後一次推估」與「官方公告結果」，留 ${CMP_KEEP_DAYS} 天。
      推估多報多半是模型算的是海面風、縣市政府所在地在內陸被地形擋掉；累積幾次颱風後可以看出哪些縣市要打折。</p>
    </div>`;
}

/* 停班停課頁。沒有颱風也要能看（官方公告、比對紀錄）,所以獨立出來,
   切到這頁、颱風資料更新、公告抓回來時都重畫。 */
function renderDg() {
  const box = document.getElementById('tyDgpa');

  box.innerHTML = dgpaCard();

/* ── 長截圖 ────────────────────────────────────────────────
   整頁（含收起來的 details）畫成一張 PNG,用分享面板存進相簿或丟到群組。
   html2canvas 只在按下去時才從 cdnjs 載入（單檔 PWA 不必一開就多 200 KB）;載過一次 service worker 會留著。
   iPhone 的 canvas 有面積上限（約 1,670 萬像素）,超過會整張變白,所以依高度自動降解析度。
   分享只帶 files 不帶 title——iOS 同時帶 title 會只送出文字、圖片被丟掉。 */
const H2C_URL = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
function loadH2C() {
  if (window.html2canvas) return Promise.resolve(window.html2canvas);
  return new Promise((ok, no) => {
    const sc = document.createElement('script');
    sc.src = H2C_URL; sc.async = true;
    sc.onload = () => window.html2canvas ? ok(window.html2canvas) : no(new Error('截圖元件載入後不可用'));
    sc.onerror = () => no(new Error('截圖元件下載失敗（第一次使用需要連網）'));
    document.head.appendChild(sc);
  });
}
async function dgShot() {
  const el = document.getElementById('dgCap'), btn = document.getElementById('dgShot');
  if (!el || !el.textContent.trim()) return toast('目前沒有內容可截圖');
  btn.disabled = true; btn.textContent = '產生中…';
  const closed = [...el.querySelectorAll('details:not([open])')];
  closed.forEach(d => { d.open = true; });                  // 收起來的也要截進去
  try {
    const h2c = await loadH2C();
    const r = el.getBoundingClientRect();
    const MAXPX = 16e6, MAXH = 16000;
    const scale = Math.max(0.5, Math.min(2, Math.sqrt(MAXPX / (r.width * r.height)), MAXH / r.height));
    const bg = getComputedStyle(document.body).backgroundColor || '#080E13';
    const cv = await h2c(el, { backgroundColor: bg, scale, useCORS: true, logging: false,
      windowWidth: document.documentElement.clientWidth,
      ignoreElements: n => !!(n.classList && n.classList.contains('noshot')) });
    const blob = await new Promise(ok => cv.toBlob(ok, 'image/png'));
    if (!blob) throw new Error('圖片產生失敗（頁面太長，請收起部分內容再試）');
    const d = new Date(), name = `停班停課_${d.getMonth() + 1}月${d.getDate()}日${p2(d.getHours())}${p2(d.getMinutes())}.png`;
    const f = new File([blob], name, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [f] })) {
      try { await navigator.share({ files: [f] }); }
      catch (e) { if (e && e.name !== 'AbortError') throw e; }
    } else {
      const url = URL.createObjectURL(blob), a = document.createElement('a');
      // 下載檔名用英數：部分 Chromium 遇到中文檔名會整個換成「download」（沒有副檔名，相簿認不得）
      a.href = url; a.download = `galepost-dgpa-${p2(d.getMonth() + 1)}${p2(d.getDate())}-${p2(d.getHours())}${p2(d.getMinutes())}.png`;
      a.style.display = 'none';
      document.body.appendChild(a); a.click();
      setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 30000);
      toast('已下載圖片');
    }
  } catch (e) {
    toast(`長截圖失敗：${(e && e.message) || e}`);
  } finally {
    closed.forEach(d => { d.open = false; });
    btn.disabled = false; btn.textContent = '長截圖（存成圖片）';
  }
}
document.getElementById('dgShot').addEventListener('click', dgShot);

/* ── 暴風圈侵襲機率（停班停課頁、總覽）────────────────────
   官方：中央氣象署「颱風侵襲機率」W-C0034-003（後端抓 KMZ,解析成 20%、40%…100% 一圈一圈的等值區,外圈有洞）。
   每個縣市看「縣市政府所在地落在哪一圈」,寫成區間（例：60–80%）——等值區只分級,沒有逐點的數字；
   新聞上「基隆 100%」那種逐城市的表不在開放資料裡,但一定落在這個區間內。
   官方還沒發布、或後端沒金鑰時,用自己的系集模擬推估（照官方 70% 機率半徑擾動路徑 400 次,
   數七級風圈掃到縣市政府所在地的比例）,一律標「推估」。 */
function inRing(p, ring) {                      // 射線法；ring 是 [[緯, 經], …]
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [yi, xi] = ring[i], [yj, xj] = ring[j];
    if ((yi > p.lat) !== (yj > p.lat) && p.lng < (xj - xi) * (p.lat - yi) / (yj - yi) + xi) inside = !inside;

}
let _probOffKey = null, _probOff = null;

  const P = DB.ty.prob;
  if (!P || !Array.isArray(P.items)) return null;
  if (_probOffKey === P) return _probOff;
  const its = P.items.filter(it => Number.isFinite(it.p) && (it.polys || []).length);
  let out = null;
  if (its.length) {
    const levels = [...new Set(its.map(it => it.p))].sort((a, b) => a - b);
    const by = {};
    for (const [name, pt] of Object.entries(COUNTY_PT)) {
      let best = null;
      for (const it of its) for (const pg of it.polys) {
        if (inRing(pt, pg.o) && !(pg.h || []).some(h => inRing(pt, h)) && (best == null || it.p > best)) best = it.p;
      }
      // 不在任何一圈裡＝低於最低那一級（例如不到 20%）——有資料、只是低,不是沒有資料
      const hi = best == null ? levels[0] : (levels.find(v => v > best) ?? 100);
      by[name] = { v: best == null ? 0 : best, hi: best != null && best >= 100 ? 100 : hi,
        label: best == null ? `<${levels[0]}%` : best >= 100 ? '100%' : `${best}–${hi}%` };
    }

}
let _probEstKey = '', _probEst = null;
function probEstimate() {
  if (!SERIES || SERIES.length < 2 || EXTRAP || !WARN || !WARN.isTy) return null;
  const nodes = [{ tau: 0, r: 0 }, ...TRACK.filter(f => f.r70 > 0).map(f => ({ tau: f.tau, r: f.r70 }))];
  if (nodes.length < 2) return null;
  const key = `${SERIES[0].t}|${SERIES.length}|${nodes.map(n => n.r).join(',')}`;
  if (key === _probEstKey) return _probEst;
  const rAt = h => {
    let i = 0;
    while (i < nodes.length - 2 && nodes[i + 1].tau < h) i++;

    return a.r + (b.r - a.r) * clamp((h - a.tau) / ((b.tau - a.tau) || 1), 0, 1);
  };

  for (let m = 0; m < N; m++) {

      if (!(s.r15 > 0) || s.vmax < TY_MIN_MS) continue;
      // 70% 落在半徑 R 內的二維常態：σ = R ÷ √(2·ln(1/0.3)) ≈ R ÷ 1.552
      const sg = rAt(h) / 1.552, cos = Math.cos(rad(s.pos.lat));
      const lat = s.pos.lat + zy * sg / 111.2, lng = s.pos.lng + zx * sg / (111.2 * cos), r2 = s.r15 * s.r15;
      for (let i = 0; i < pts.length; i++) {
        if (hit[i]) continue;
        const dy = (pts[i].lat - lat) * 111.2, dx = (pts[i].lng - lng) * 111.2 * cos;
        if (dx * dx + dy * dy <= r2) hit[i] = 1;
      }
    }
    for (let i = 0; i < pts.length; i++) hits[i] += hit[i];
  }
  const by = {};
  names.forEach((n, i) => { const v = Math.round(hits[i] / N * 100); by[n] = { v, hi: v, label: `${v}%` }; });
  _probEstKey = key; _probEst = { by };
  return _probEst;
}
function countyProb(name) {
  const off = probOfficial();
  if (off && off.by[name]) return Object.assign({ src: '官方', time: off.time }, off.by[name]);
  const est = probEstimate();
  if (est && est.by[name]) return Object.assign({ src: '推估' }, est.by[name]);
  return null;
}
// 總覽名牌上的一格：侵襲機率最高的縣市（都很低就不佔位置）
function topProb() {
  const rows = Object.keys(COUNTY_PT).map(n => ({ n, p: countyProb(n) })).filter(r => r.p);
  if (!rows.length) return null;
  const mx = Math.max(...rows.map(r => r.p.v));
  if (mx < 20) return null;
  const top = rows.filter(r => r.p.v === mx);
  return { label: top[0].p.label, src: top[0].p.src,
    names: top.slice(0, 3).map(r => r.n).join('、') + (top.length > 3 ? ` 等 ${top.length} 縣市` : '') };
}

/* 侵襲機率的顏色：青→琥珀→橘→紅。不用綠色——綠會被讀成「安全」,20% 並不安全。 */
const probCol = v => v >= 80 ? 'var(--no)' : v >= 60 ? 'var(--or)' : v >= 40 ? 'var(--sb)' : v >= 20 ? 'var(--acc)' : 'var(--fg4)';
const dayTs = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d).getTime(); };
/* 一列裡的兩格短字。官方實心、推估虛線框：並排時一眼分得出哪個是公告、哪個是推算。 */
function offTag(o) {
  if (!o) return { t: '—', k: '' };
  /* 公告裡的「今天／明天」是相對公告頁的日期：後端那份若是昨晚抓的,「明天」才是今天,
     「今天」講的是昨天。只看講到今天以後的那幾行；一行都沒有就是那份公告沒講到今天,
     寫「—」——不能寫成照常（沒有資料不等於沒事）。 */
  const page = dgpaPageDay(), today = new Date().setHours(0, 0, 0, 0);
  const dayOf = l => /明天|明日/.test(l.txt) ? page + 86400000 : page;
  const cur = (o.lines || []).filter(l => dayOf(l) >= today);
  if (!cur.length) return page < today ? { t: '—', k: '' } : { t: '照常', k: 'ok' };
  const stop = cur.filter(l => l.stop);
  if (!stop.length) return { t: '照常', k: 'ok' };
  return stop.some(l => l.scope === 'all')
    ? { t: `${relDay(Math.min(...stop.map(dayOf)))}停`, k: 'no' } : { t: '部分停', k: 'sb' };
}
function estTag(e) {
  // 沒有颱風路徑、也沒抓到豪大雨特報＝沒有推估依據：寫「—」,不能寫成「未達」（沒有資料不等於沒事）
  if (!e || (!e.any && !SERIES && !RAIN_AT)) return { t: '—', k: '' };
  if (!e.any) return { t: '未達', k: '' };
  // 跟「推估比對」用同一個口徑（06–22 時有達基準才算那天停）,兩頁講的才會一樣
  const d = [...estDays(e)].sort()[0];
  return d ? { t: `${relDay(dayTs(d))}停`, k: 'sb' } : { t: '夜間', k: 'sb' };
}
function probTimeTxt(t) {
  const ts = Date.parse(t || '');
  return Number.isFinite(ts) ? fmtShort(ts) : (t || '');
}

/* 停班課頁：一縣市一列（縣市｜侵襲機率｜推估｜官方）,細節點那一列再開。
   以前每列攤開三四行（風力時段、解除時間、公告時機、局部停班的地區）,
   二十二個縣市捲不完——使用者說頁面不要一大串。要分享的長截圖也就是這張表。 */
function dgpaCard() {
  const myC = myCounties().map(cnorm);
  const rows = COUNTIES_NS.map(name => ({
    name, off: countyOfficial(name), est: countyEstimate(name), p: countyProb(name), mine: myC.includes(cnorm(name)),
  }));
  const anyOff = rows.some(r => r.off);
  // 跟每一列的官方標籤同一個口徑：後端那份是昨天的公告時,昨天停的不算進今天
  const nOff = rows.filter(r => r.off && (offTag(r.off).k === 'no' || offTag(r.off).k === 'sb')).length;
  const nEst = rows.filter(r => r.est && r.est.any).length;
  const pAny = (rows.find(r => r.p) || {}).p || null;
  const nHi = rows.filter(r => r.p && r.p.v >= 60).length;

  const tile = (cls, v, lb) => `<div class="${cls}"><b>${v}</b><small>${lb}</small></div>`;
  const tiles = `<div class="stat c3">
    ${tile(nOff ? 'v-off' : 'zero', anyOff ? nOff : '—', '官方停止')}
    ${tile(nEst ? 'v-sb' : 'zero', SERIES ? nEst : '—', '推估停止')}
    ${tile(nHi ? 'v-hi' : 'zero', pAny ? nHi : '—', '侵襲 ≥60%')}</div>`;

  const src = `<div class="dg-src">
    <span><i>公告</i>${DGPA_UPD ? `官方 ${esc(DGPA_UPD)}` : anyOff ? '已取得' : '未取得'}${
      DGPA_SRC === 'backend' ? '（後端）' : DGPA_SRC === 'live' ? '（即時）' : ''}</span>
    <span><i>機率</i>${!pAny ? '目前沒有颱風' : pAny.src === '官方'
      ? `中央氣象署 ${esc(probTimeTxt(pAny.time))}` : '推估（官方未發布）'}</span>
    <a class="dg-off" href="${DGPA_URL}" target="_blank" rel="noopener">人事行政總處官方公告 ↗</a></div>`;

  // 不進長截圖：分享出去的圖上方「公告」那一行就夠了,這兩段是給自己看的
  const err = (!anyOff && DGPA_LIVE_ERR)
    ? `<div class="msg e noshot">公告抓不到（${esc(DGPA_LIVE_ERR)}）。可以直接看<a href="${DGPA_URL}" target="_blank" rel="noopener">官方公告 ↗</a>；
       後端每次排程都會重抓，「設定 › 資料來源」可改即時用的代理。</div>`
    : DGPA_NOTE ? `<div class="msg w noshot">${esc(DGPA_NOTE)}</div>` : '';

  const row = r => {
    const p = r.p, ot = offTag(r.off), et = estTag(r.est);
    const v = p ? p.v : 0, hi = p ? (p.hi == null ? p.v : p.hi) : 0, col = p ? probCol(Math.max(v, 1)) : 'var(--fg4)';
    return `<button type="button" class="cty${r.mine ? ' mine' : ''}" data-cty="${esc(r.name)}">
      <b>${esc(r.name)}</b>
      <span class="cp">${p ? `<span class="pb"><i style="width:${v}%;background:${col}"></i>${
        hi > v ? `<i class="rg" style="left:${v}%;width:${hi - v}%;background:${col}"></i>` : ''}</span>
        <em style="color:${col}">${p.label}</em>` : '<em>—</em>'}</span>
      <span class="tg e ${et.k}">${et.t}</span>
      <span class="tg o ${ot.k}">${ot.t}</span></button>`;
  };
  const byName = Object.fromEntries(rows.map(r => [r.name, r]));
  const list = COUNTY_GROUPS.map(g => `<div class="cgrp">${g.label}</div>`
    + g.names.map(n => row(byName[n])).join('')).join('');

  return `<div class="sec"><h2>停班停課　全國</h2>
      ${updAt(DGPA_LIVE_AT, '', 'noshot')}
      <button class="act noshot" onclick="fetchDgpa(true)"${DGPA_BUSY ? ' disabled' : ''}>${DGPA_BUSY ? '更新中…' : '更新'}</button></div>
    <div class="card pad dgc">${tiles}${src}${err}
      <div class="cty-h"><span>縣市</span><span>暴風圈侵襲機率</span><span>推估</span><span>官方</span></div>
      ${list}
      <div class="dg-lg"><span class="tg e sb">推估</span>本機推算，不是公告
        <span class="tg o no">官方</span>人事行政總處${myC.length ? '<i class="mk"></i>有站臺' : ''}</div></div>`;
}

/* 點一列：那個縣市的細節（官方原文、推估時段、公告時機、機率來源） */
function openCounty(name) {
  const o = countyOfficial(name), e = countyEstimate(name), p = countyProb(name);
  const sec = t => `<div class="sec2">${t}</div>`;
  let pH = '<p class="hint">目前沒有颱風，沒有侵襲機率。</p>';
  if (p) {
    const col = probCol(Math.max(p.v, 1));
    pH = `<div class="cd-p"><b style="color:${col}">${p.label}</b>
      <span>${p.src === '官方' ? `中央氣象署 ${esc(probTimeTxt(p.time))} 發布` : '推估：本機依官方 70% 機率半徑擾動路徑 400 次'}</span></div>
      <p class="hint">未來 120 小時內七級風暴風圈掃到縣市政府所在地的機率。不是放假機率——停班停課由縣市政府宣布。</p>`;
  }
  const oH = o ? o.lines.map(l => `<div class="cd-l${l.stop ? ' stop' : ''}">${esc(l.txt)}</div>`).join('')
      + `<p class="hint"><a href="${DGPA_URL}" target="_blank" rel="noopener">人事行政總處官方公告 ↗</a></p>`
    : `<p class="hint">${DGPA_LIVE_ERR ? `公告抓不到（${esc(DGPA_LIVE_ERR)}）` : '尚未取得公告'}——
      <a href="${DGPA_URL}" target="_blank" rel="noopener">看官方公告 ↗</a></p>`;
  let eH = RAIN_AT ? '<p class="hint">沒有颱風預報路徑；豪大雨特報也未達門檻。</p>'
    : '<p class="hint">沒有颱風預報路徑，也沒有取得豪大雨特報（要在「設定 › 資料來源」填授權碼），無法推估。</p>';
  if (e && e.any) {
    const bits = [];
    if (e.wind) bits.push(`<div class="cd-l">風力：${fmtWhen(e.wind.from)} 起達停止上班上課標準，尖峰 ${e.wind.peakBf} 級</div>`);
    if (e.rain) bits.push(`<div class="cd-l">雨量：${esc(e.rain.kind)}（24 小時 ≥ ${e.rain.mm} mm）</div>`);
    if (e.until) bits.push(`<div class="cd-l">預估 ${fmtWhen(e.until)} 前後解除</div>`);
    if (!estDays(e).size) bits.push('<div class="cd-l">只在夜間（22–06 時）達標，上班上課時段未達</div>');
    eH = bits.join('') + (e.wind ? `<p class="hint">公告時機：${announceHint(e.wind.from)}</p>` : '');
  } else if (e && SERIES) {
    eH = '<p class="hint">未達停止上班上課基準（平均風 7 級或陣風 10 級，或雨量達縣市門檻）。</p>';
  }
  const pt = COUNTY_PT[name];
  openSheet(name, `${sec('暴風圈侵襲機率')}${pH}${sec('官方公告')}${oH}${sec('推估')}${eH}
    <p class="hint" style="margin-top:0.75rem">代表點：縣市政府所在地${pt ? `（${pt.lat.toFixed(2)}, ${pt.lng.toFixed(2)}）` : ''}；
    山區與離島的實際風雨會不同。一律以官方公告為準。</p>`);
}
document.getElementById('tyDgpa').addEventListener('click', e => {
  const b = e.target.closest('[data-cty]');
  if (b) openCounty(b.dataset.cty);
});

/* 推估依據收在表外面：要分享的長截圖只放表,不放說明 */
function dgNote() {
  return `<details class="card pad fold" style="margin-top:0.75rem">
    <summary>怎麼推估的</summary>
    <div class="hint" style="margin-top:0.5rem">
    <p><b>侵襲機率</b>：中央氣象署「颱風侵襲機率」（未來 120 小時七級風暴風圈侵襲的機率，依過去五年預報誤差統計），
    看縣市政府所在地落在哪一級等值區，寫成區間。官方還沒發布時，本機照官方 70% 機率半徑把路徑擾動 400 次推估，標「推估」。</p>
    <p style="margin-top:0.375rem"><b>推估停止上班上課</b>：《天然災害停止上班及上課作業辦法》——平均風 ${SUSP_BF_MEAN} 級或陣風 ${SUSP_BF_GUST} 級以上
    （由預報路徑逐時推算，陣風以持續風 ${GUST_FACTOR} 倍估）；或 24 小時雨量預測達門檻（多數縣市平地 ${DGPA_FLAT}、山區 ${DGPA_HILL} 毫米，
    以豪大雨特報等級判斷）。06–22 時有達到才算那天停。</p>
    <p style="margin-top:0.375rem">達到基準不等於一定放假：還要有致災之虞，由地方政府綜合研判宣布。</p></div></details>`;
}

/* 站臺最近雨量站的累積雨量。24 小時是特報分級的主要依據,所以擺第一個。 */
function rainCell(st) {
  const rb = nearestRain(st);
  if (!rb) return '<td><span style="color:var(--fg4)">—</span></td>';
  const r = rb.o, L = rainLevel(r);
  const v = n => n == null ? '—' : (n < 10 ? n.toFixed(1) : Math.round(n));
  return `<td><span style="font-family:var(--mono);font-weight:700;color:${L ? L.col : 'var(--fg2)'}">`
    + `${v(r.h24)}</span><span style="font-size:0.6875rem;color:var(--fg4)"> mm/24h</span>`
    + (L ? `<b style="display:block;font-size:0.6875rem;color:${L.col}">${L.name}</b>` : '')
    + (() => { const m = dgpaMark(r.h24, st); return m
        ? `<b style="display:block;font-size:0.6875rem;color:${m.col}">停班課${m.t} ${m.thr}`
          + `${m.official ? '（實測）' : ''}</b>` : ''; })()
    + `<span style="display:block;font-size:0.6875rem;color:var(--fg4)">`
    + `時雨 ${v(r.h1)}　${esc(r.name)} ${Math.round(rb.km)}km</span></td>`;
}

/* ── 時間的講法 ────────────────────────────────────────────
   通報上不會寫「8/24 22:00」,會寫「今日晚間 22:00」——
   值班的人不必自己把日期換算成「那是今天還是明天」。
   當天=今日、隔天=明日、再隔天=後天,第四天起用星期。
   超過一週還講「週三」會分不出是哪一個週三,所以改回日期。   */
const WEEK = WK_CH;                     // 同一份星期表,不再各留一份

function relDay(ts) {
  const a = new Date(); a.setHours(0, 0, 0, 0);
  const b = new Date(ts); b.setHours(0, 0, 0, 0);
  const n = Math.round((b - a) / 86400000);
  if (n === 0) return '今日';
  if (n === 1) return '明日';
  if (n === 2) return '後天';
  if (n >= 3 && n <= 6) return '週' + WEEK[b.getDay()];
  if (n === -1) return '昨日';
  return `${b.getMonth() + 1}/${b.getDate()}`;
}

// 一天之內的時段。22:00 講「晚間」,05:30 講「清晨」。
function dayPart(h) {
  if (h < 5) return '凌晨';
  if (h < 8) return '清晨';
  if (h < 11) return '上午';
  if (h < 13) return '中午';
  if (h < 17) return '午後';
  if (h < 19) return '傍晚';
  if (h < 23) return '晚間';
  return '深夜';
}

// 「今日晚間 22:00」
function fmtWhen(ts) {
  const d = new Date(ts);
  return `${relDay(ts)}${dayPart(d.getHours())} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
}
// 「今日 08:23」——標頭用,不必講時段
function fmtDayTime(ts) {
  const d = new Date(ts);
  return `${relDay(ts)} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
}

/* ── 氣象員播報 ────────────────────────────────────────────
   把距離、方位、強度、侵襲機率、最接近時間、豪大雨特報、
   各站臺實測與衝擊，串成一段可以直接唸、直接抄進通報的話。
   規則：官方數字（侵襲機率、特報、警報單、實測）與本機推估分開講，
   每一句都要說得出來源，不能讓聽的人分不清哪句是氣象署說的。      */
/* ── 動態研判（使用者：播報要講颱風是加速離開、滯留還是轉向,要像專業的）──────
   全部從資料算,不憑感覺寫：
   ・現在：氣象署分析的移速移向；過去 12 小時（分析點 −12h→−6h→現在）移速差 5 公里以上算加快／減慢,
     移向差 25 度以上算轉向。
   ・預報：官方預報點 0→24、24→48 小時兩段的移速與移向；差 30 度以上算轉向,每小時不到 8 公里算移動緩慢（滯留）。
   ・距離：逐時序列算與臺灣的距離；最接近的時刻與距離（推估）,之後往哪裡走。
   ・強度：過去 12 小時與預報 24 小時的近中心風速。
   每一句都要講「依據」：分析是官方、預報是官方、距離與最接近是本機推算。 */
function motionBrief(ty) {
  const H = 3600000, out = [];
  if (!ty || !ty.pos || !Number.isFinite(ty.t0)) return { lines: out, cpa: false };
  const kmh = v => Math.round(v);
  const turn = (a, b) => ((b - a + 540) % 360) - 180;          // 正＝順時針（右偏）,負＝逆時針（左偏）
  const now = { t: ty.t0, lat: ty.pos.lat, lng: ty.pos.lng };
  const fixes = (ty.past || []).filter(p => Number.isFinite(p.t) && p.t < ty.t0 - 0.5 * H);
  const ago = h => {                                             // 離 t0−h 小時最近（±2 小時內）的分析點
    let best = null;
    for (const f of fixes) { const d = Math.abs(f.t - (ty.t0 - h * H)); if (d <= 2 * H && (!best || d < best.d)) best = { f, d }; }
    return best && best.f;
  };
  const seg = (a, b) => { const hrs = (b.t - a.t) / H; return hrs > 0.5 ? { v: distKm(a, b) / hrs, brg: bearing(a, b) } : null; };
  const p6 = ago(6), p12 = ago(12);
  const rec = p6 && seg(p6, now), prv = p6 && p12 && seg(p12, p6);
  const v0 = ty.mvSpd || (rec && rec.v) || 0;
  const d0 = ty.mvDir ? (dirZh(ty.mvDir) || '') : rec ? dirName(rec.brg) : '';
  // ── 現在 ──
  if (v0 || rec) {
    let t = `颱風中心以每小時 ${kmh(v0)} 公里${d0 ? `向${d0}` : ''}移動`;
    t += v0 < 5 ? '，幾乎滯留' : v0 < 10 ? '，移動緩慢' : v0 >= 30 ? '，移動快速' : '';
    if (rec && prv) {
      const dv = rec.v - prv.v, dt = turn(prv.brg, rec.brg);
      t += Math.abs(dv) >= 5 ? `；過去 12 小時移速由每小時 ${kmh(prv.v)} 公里${dv > 0 ? '加快' : '減慢'}到 ${kmh(rec.v)} 公里` : '；過去 12 小時移速大致穩定';
      // 幾乎不動時方位只是雜訊,講「偏轉」會誤導
      if (Math.abs(dt) >= 25 && rec.v >= 3 && prv.v >= 3) t += `，路徑由${dirName(prv.brg)}${dt > 0 ? '向右' : '向左'}偏轉為${dirName(rec.brg)}`;
    }
    out.push(t + '。');
  }
  // ── 預報（官方預報點）──
  const at = tau => { let b = null; for (const f of TRACK) if (!b || Math.abs(f.tau - tau) < Math.abs(b.tau - tau)) b = f; return b && Math.abs(b.tau - tau) <= 6 ? b : null; };
  const f24 = !EXTRAP && at(24), f48 = !EXTRAP && at(48);
  if (f24) {
    const s0 = seg(now, { t: ty.t0 + f24.tau * H, lat: f24.pos.lat, lng: f24.pos.lng });
    const s1 = f48 && seg({ t: ty.t0 + f24.tau * H, ...f24.pos }, { t: ty.t0 + f48.tau * H, ...f48.pos });
    if (s0) {
      // 「以每小時約 0 公里向北移動」不像人話：幾乎不動就直說
      let t = s0.v < 3 ? '官方預報未來 24 小時幾乎停留在原地'
        : `官方預報未來 24 小時以每小時約 ${kmh(s0.v)} 公里向${dirName(s0.brg)}移動`;
      const dt0 = rec && rec.v >= 3 && s0.v >= 3 ? turn(rec.brg, s0.brg) : 0;
      if (Math.abs(dt0) >= 30) t += `，較目前${dt0 > 0 ? '向右' : '向左'}偏轉`;
      if (s1) {
        const dt = s0.v >= 3 && s1.v >= 3 ? turn(s0.brg, s1.brg) : 0, dv = s1.v - s0.v;
        const parts = [];
        if (Math.abs(dt) >= 30) parts.push(`轉向${dirName(s1.brg)}`);
        if (s1.v < 8) parts.push(s0.v < 8 ? '仍近乎滯留' : `移速降到每小時 ${kmh(s1.v)} 公里、近乎滯留`);
        else if (Math.abs(dv) >= 5) parts.push(`${dv > 0 ? '加速' : '減速'}到每小時 ${kmh(s1.v)} 公里`);
        t += parts.length ? `；24 至 48 小時${parts.join('並')}` : '；之後路徑與移速變化不大';
        // 由西行轉北上再往東北：典型的轉向颱風
        const w = b => b >= 225 && b <= 340, ne = b => b >= 350 || b <= 80;
        if (s1.v >= 3 && w(rec ? rec.brg : s0.brg) && ne(s1.brg)) t += '，屬北轉後往東北移動的轉向路徑';
      }
      out.push(t + '。');
    }
  }
  // ── 與臺灣的距離（本機逐時推算）──
  let cpa = false;
  const dNow = Math.round(distToTaiwan(ty.pos));
  const dAt = h => SERIES && SERIES[h] ? Math.round(distToTaiwan(SERIES[h].pos)) : null;
  const d12 = dAt(12);
  if (WARN && WARN.cpa && d12 != null) {
    const c = WARN.cpa, nowMs = Date.now();
    if (c.t > nowMs + H && c.d < CPA_MID) {
      cpa = true;
      let t = `與臺灣距離${d12 < dNow - 20 ? '持續縮短' : '變化不大'}（現在約 ${dNow} 公里，12 小時後約 ${d12} 公里），`
        + `推估 ${fmtWhen(c.t)} 最接近臺灣，距離約 ${Math.round(c.d)} 公里`;
      const ci = SERIES.findIndex(x => x.t >= c.t), after = ci >= 0 && SERIES[Math.min(SERIES.length - 1, ci + 12)];
      if (after && after !== SERIES[ci]) {
        const sa = seg({ t: SERIES[ci].t, ...SERIES[ci].pos }, { t: after.t, ...after.pos });
        if (sa) t += `，之後${sa.v < 8 ? '移動緩慢、仍在附近徘徊' : `往${dirName(sa.brg)}${sa.v >= 25 ? '加速' : ''}遠離`}`;
      }
      out.push(t + '（本機推算）。');
    } else if (d12 > dNow + 20) {
      out.push(`颱風正遠離臺灣（現在約 ${dNow} 公里，12 小時後約 ${d12} 公里）。`);
    }
  }
  // ── 強度 ──
  {
    const pk = ago(12), fv = f24 && f24.vmax;
    const bits = [];
    if (pk && pk.vmax) {
      const dv = ty.vmax - pk.vmax;
      bits.push(Math.abs(dv) >= 3 ? `過去 12 小時近中心風速由每秒 ${Math.round(pk.vmax)} 公尺${dv > 0 ? '增強' : '減弱'}為 ${Math.round(ty.vmax)} 公尺` : '過去 12 小時強度大致維持');
    }
    if (fv) {
      const dv = fv - ty.vmax;
      bits.push(Math.abs(dv) >= 3 ? `預報 24 小時後${dv > 0 ? '增強' : '減弱'}為每秒 ${Math.round(fv)} 公尺（${TC_FULL[tcClass(fv)] || ''}）` : '預報未來 24 小時強度變化不大');
    }
    if (bits.length) out.push(bits.join('；') + '。');
  }
  // ── 研判：挑最要緊的一句 ──
  {
    const fs = f24 && seg(now, { t: ty.t0 + f24.tau * H, ...f24.pos });
    const slow = v0 < 10 || (fs && fs.v < 10);
    let t = '';
    if (d12 != null && d12 > dNow + 50) t = '颱風逐漸遠離，風力將減弱，但外圍環流仍可能帶來降雨，持續注意。';
    else if (slow && dNow < 600) t = '颱風移動緩慢，在臺灣附近停留時間長，風雨影響時間可能拉長。';
    else if (WARN && WARN.cpa && WARN.cpa.t > Date.now() && WARN.cpa.d < 300) {
      // 拿最接近那時的七級風半徑比：同樣離 120 公里,半徑 250 公里的大颱風早就掃到陸地了
      const c = WARN.cpa, at = SERIES && SERIES.find(x => x.t >= c.t), r = (at && at.r15) || ty.r15 || 100;
      t = c.d <= r ? '颱風持續接近，暴風圈可能直接影響臺灣陸地，各站請依推估時間預作準備。'
        : c.d <= r + 100 ? '颱風持續接近，暴風圈可能觸及臺灣近海，各站請依推估時間預作準備。'
        : '颱風持續接近，暴風圈預估不會直接碰到臺灣，但外圍環流仍會帶來風雨，持續注意。';
    }
    if (t) out.push(`研判：${t}`);
  }
  return { lines: out, cpa };
}

function briefText() {
  const ty = DB.ty.data;
  if (!ty) return '';
  const IN = '　';                       // 全形空格縮排,中文對得齊
  const L = [];
  const bf = ms2bf(ty.vmax);
  const d = Math.round(distToTaiwan(ty.pos));
  const brg = bearing({ lat: 23.7, lng: 121.0 }, ty.pos);

  L.push(`【今日氣象概況與警報】（更新時間：${fmtDayTime(DB.ty.at || Date.now())}）`);

  /* 播報稿也要靈活:今天真正的重點是什麼,就先講什麼。
     固定從颱風動態開始念,在颱風四千公里外、卻正在打雷的日子是本末倒置。 */
  {
    const f = todayFocus()[0];
    if (f && f.rank >= 30) {
      L.push('');
      L.push(`本日重點：${f.key}——${String(f.val).replace(/<[^>]+>/g, '')}`
        + `（${String(f.sub).replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim()}）`);
    }
  }

  // ── 颱風動態 ──
  L.push('');
  L.push(`${TC_FULL[tcClass(ty.vmax)] || '熱帶氣旋'} ${ty.name}` +
    `${ty.en && ty.en !== ty.name ? `（${ty.en}）` : ''} 動態`);
  L.push(`${IN}位置風力：臺灣${dirName(brg)}方 ${d} 公里海面，近中心最大風速 ${bfLabel(bf)}。`);
  if (ty.mvSpd) {
    L.push(`${IN}移動方向：向${dirZh(ty.mvDir) || dirName(brg)}移動（時速 ${Math.round(ty.mvSpd)} 公里）。`);
  }
  if (ty.pres) L.push(`${IN}中心氣壓：${Math.round(ty.pres)} 百帕。`);
  const mv = motionBrief(ty);
  // 動態研判已經講了最接近的時刻與距離,這裡就不再講一次
  if (WARN && WARN.cpa && !mv.cpa) {
    const km = Math.round(WARN.cpa.d);
    /* 四千公里外還寫「最接近時間」,唸出來就像快到了。距離遠就直說遠。 */
    L.push(`${IN}路徑最近時刻：推估為${fmtWhen(WARN.cpa.t)}，屆時距臺約 ${km} 公里`
      + (km > CPA_MID ? '，距離很遠、對臺灣無影響' : km > CPA_NEAR ? '，仍有距離' : '')
      + '。' + (EXTRAP ? '［外推路徑推算，非官方預報］' : ''));
  }
  if (!ty.official) L.push(`${IN}資料來源：GDACS 全球災害警報系統（非官方，僅觀測位置）。`);
  if (mv.lines.length) {
    L.push('');
    L.push('動態研判（依中央氣象署分析與預報推算）');
    mv.lines.forEach(x => L.push(`${IN}${x}`));
  }

  // ── 颱風警報 ──
  const w = DB.ty.warning;
  const wt = warnTimes(ty);
  if ((w && w.active) || wt) {
    L.push('');
    L.push('颱風警報（中央氣象署發布）');
    // 標題照官方原文：「海上陸上颱風警報」以前被縮成只剩「陸上」
    if (w && w.active) L.push(`${IN}${w.headline}${w.no ? `（第${w.no}報）` : ''}` +
      `${w.areas && w.areas.length ? `：${w.areas.join('、')}` : ''}`);
    if (wt) {
      L.push(`${IN}海上颱風警報發布：${warnTimeTxt(wt.sea)}。`);
      L.push(`${IN}陸上颱風警報發布：${warnTimeTxt(wt.land)}。`);
      if (wt.end) L.push(`${IN}解除颱風警報：${warnTimeTxt({ t: wt.end.t, exact: true })}。`);
    }
  }

  // ── 應變（本機建議）──
  const mp = meetPlan();
  if (mp) {
    L.push('');
    L.push('應變開設與撤除（本機建議，以縣市災害應變中心通知為準）');
    // 事件進行中這個時間通常已經過了：照寫「建議開設：今日凌晨 04:00」像是叫人現在才去開
    L.push(`${IN}建議開設：${fmtWhen(mp.open)}（推估進入海警範圍前 ${DB.cfg.meetLead} 小時${
      mp.open <= Date.now() ? '；時間已過，應已開設' : ''}）。`);
    if (mp.shrink != null) L.push(`${IN}建議縮編：${fmtWhen(mp.shrink)}（${mp.shrinkSrc === 'official' ? '中央氣象署已解除陸上颱風警報' : '推估暴風圈離開陸地'}）。`);
    L.push(mp.close == null ? `${IN}建議撤除：待中央氣象署解除颱風警報。`
      : `${IN}建議撤除：${fmtWhen(mp.close)}（${mp.closeSrc === 'official' ? '中央氣象署已發布解除颱風警報' : '推估離開海警範圍'}${
        mp.rainHold.length ? `；${mp.rainHold.join('、')}仍有豪雨特報，可能轉水災應變` : ''}）。`);
  }

  // ── 降雨特報 ──
  if (ADV.length) {
    L.push('');
    L.push('降雨特報分級（中央氣象署發布）');
    for (const a of ADV) {
      L.push(`${IN}${a.kind}：${a.areas.length ? a.areas.join('、') : '（未列地區）'}`);
    }
  }

  /* ── 雷電 ──
     打雷要關站臺,所以它自己一段,而且實測的落雷寫在特報前面。 */
  {
    const R = ltnRadius();
    const sites2 = DB.stations.filter(x => IS_LIVE(x) && Number.isFinite(x.lat));
    const near2 = sites2.map(x => ({ x, s: strikesNear(x, R) })).filter(r => r.s.cg + r.s.ic > 0)
      .sort((a, b) => (b.s.cg - a.s.cg) || (a.s.nearest.d - b.s.nearest.d));
    const tAdv2 = thunderAdv();
    if (near2.length || tAdv2.length) {
      L.push('');
      L.push('雷電');
      if (LTN_AT) {
        const cg2 = near2.filter(r => r.s.cg > 0);
        if (cg2.length) {
          L.push(`${IN}落雷實測：${cg2.length} 站於半徑 ${R} 公里內偵測到雲對地落雷`
            + `（${cg2.slice(0, 4).map(r => `${r.x.name} ${r.s.cg} 次、最近 ${Math.round(r.s.nearest.d)} 公里`).join('；')}`
            + `${cg2.length > 4 ? `；等 ${cg2.length} 站` : ''}）。`);
        } else if (near2.length) {
          L.push(`${IN}落雷實測：半徑 ${R} 公里內僅偵測到雲間閃電，無雲對地落雷。`);
        }
      } else if (LTN_ERR) {
        L.push(`${IN}落雷實測：取得失敗（${LTN_ERR}）。`);
      } else if (LTN_OFF) {
        // 有特報卻沒寫實測,讀的人會以為實測查過了、站臺附近沒雷
        L.push(`${IN}落雷實測：尚未啟用，無逐站資料。`);
      }
      for (const a of tAdv2) {
        L.push(`${IN}${a.kind}：${a.areas.length ? a.areas.join('、') : '（未列地區）'}`
          + `${a.end ? `，至 ${fmtShort(a.end)}` : ''}。`);
      }
      L.push(`${IN}※ 雲對地落雷才會打到地面設備；雲間閃電不會。關機與否依單位規定由值班判斷。`);
    }
  }

  /* ── 天氣（各站臺雨量，實測）──
     使用者指定：用「一、二、…」逐站寫雨量並分類（小雨、大雨…）；預報有雨不必報；
     停班停課（另有自己的頁）與站臺衝擊（各站頁有完整表）也不放進播報稿。
     分類：大雨以上照氣象署標準（24 小時 80／200／350／500 毫米，或時雨量 40、3 小時 100）；
     未達大雨的,依時雨量分小雨（< 2.5 毫米）與中雨——這兩級氣象署沒有定義,是本程式的分法,稿裡註明。 */
  const withXY = DB.stations.filter(x => IS_LIVE(x) && Number.isFinite(x.lat) && Number.isFinite(x.lng));
  {
    const rows = withXY.slice()
      .sort((a, b) => b.lat - a.lat)                      // 由北至南,照讀的人看地圖的順序
      .map(x => ({ x, rn: nowRain(x), rb: nearestRain(x) }));
    const wet = rows.filter(r => r.rb && ((r.rb.o.h24 || 0) > 0 || (r.rn && r.rn.raining)));
    const dry = rows.filter(r => r.rb && !wet.includes(r));
    const noG = rows.filter(r => !r.rb);
    if (rows.length) {
      L.push('');
      L.push('天氣（各站臺雨量，鄰近自動雨量站實測）');
      const rainClass = o => {
        const lv = rainLevel(o);
        if (lv) return lv.name;
        if (o.h1 != null && o.h1 >= 2.5) return '中雨';
        if ((o.h1 || 0) > 0 || (o.now || 0) > 0) return '小雨';
        return '雨停';                                   // 24 小時有累積、但現在沒在下
      };
      wet.forEach((r, i) => {
        const o = r.rb.o;
        L.push(`${IN}${CN[i] || i + 1}、${r.x.name}：時雨量 ${o.h1 == null ? '—' : o.h1} 毫米、`
          + `24 小時累積 ${o.h24 == null ? '—' : Math.round(o.h24)} 毫米（${rainClass(o)}）`
          + `，${o.name}站 ${Math.round(r.rb.km)} 公里。`);
      });
      // 沒有雨量資料（沒授權碼、後端也沒有）時每一站都是 noG：不能寫成「均無降雨」——沒資料不等於沒下
      if (!RAIN.length) L.push(`${IN}目前沒有雨量資料，無法判斷。`);
      else if (!wet.length && dry.length) L.push(`${IN}${noG.length ? `可判斷的 ${dry.length} 站` : '各站臺'}鄰近雨量站 24 小時內均無降雨。`);
      else if (dry.length) L.push(`${IN}其餘 ${dry.length} 站無降雨。`);
      if (noG.length && RAIN.length) L.push(`${IN}無鄰近雨量站可判斷：${noG.map(r => r.x.name).join('、')}。`);
      if (wet.length) L.push(`${IN}※ 大雨以上依氣象署分級；小雨（時雨量未達 2.5 毫米）、中雨為本程式區分。`);
    }
  }

  // 模型與實測差太多的站（只用在最後的注意事項,不再列站臺衝擊段）
  let gaps = [];
  if (SERIES && withXY.length) {
    gaps = withXY.map(x => {
      const i = stationImpact(SERIES, x, DB.cfg);
      const ob = nearestObs(x), obf = obsBf(ob);
      return (i && obf != null && Math.abs(obf - i.now.bf) >= 3)
        ? `${x.name}（推估陣風 ${i.now.bf} 級、實測陣風 ${obf} 級）` : null;
    }).filter(Boolean);
  }

  // ── 注意事項 ──
  L.push('');
  if (gaps.length) {
    L.push(`注意：${gaps.join('、')}實測與推估相差三級以上，代表模型在該地形不可靠，`
      + '請以現場實測為準，勿逕依系統時間執行待機。');
  }
  L.push('注意事項：警報資料來自氣象署官方發布；系統推估時間與距離僅供參考，'
    + '最新動態請依中央氣象署為準。');
  return L.join('\n');
}

/* 播報稿的上色。
   整段同一個灰色時,要在裡面找出「幾點該關機」得逐字讀。
   上色的對象只有三種:**會改變決定的數字**（風級、雨量等級、時刻）、
   **動作**（關機、停班停課）、以及**但書**（推估、非公告）。
   其餘一律不動 —— 每個字都是重點就等於沒有重點。

   注意這是先 esc 再上色,所以比對的是已經跳脫過的字串;
   複製出去的仍然是 briefText() 的純文字,不含任何標記。            */
function briefHtml(txt) {
  const wrap = (v, col, bold) =>
    `<span style="color:${col}${bold ? ';font-weight:700' : ''}">${v}</span>`;
  const rainRe = new RegExp('(' + RAIN_LEVELS.map(x => x.name).join('|') + ')', 'g');

  /* 一行一行處理。整段一起 replace 的話,但書那幾行會被前面的規則
     先塗上紅色與粗體,再被但書規則包一層灰 —— 內層贏,結果但書比正文還醒目。
     但書就是要安靜,所以碰到但書行直接整行壓暗,不再套其他規則。 */
  return txt.split('\n').map(raw => {
    const line = esc(raw);
    if (!line) return '';
    if (/^　?(※|注意事項：|注意：)/.test(raw)) {
      return `<span style="color:var(--fg4)">${line}</span>`;
    }
    let h = line;
    // 風級 → 用蒲福風級本來的色階,跟畫面上的徽章對得起來
    h = h.replace(/(\d{1,2})\s*級/g, (m0, n) => wrap(m0, bfColor(+n), +n >= 8));
    /* 雨量等級必須一次掃完 —— 逐個等級各掃一遍的話,「超大豪雨」上色之後
       下一輪的「大豪雨」會再命中它裡面那三個字,顏色會從中間裂開。
       RAIN_LEVELS 由重到輕排,交替式會先吃長的那個。 */
    h = h.replace(rainRe, m0 => wrap(m0, (RAIN_LEVELS.find(x => x.name === m0) || {}).col || 'var(--sb)', true));
    // 時刻
    h = h.replace(/(今日|明日|後天|昨日|週[日一二三四五六]|\d{1,2}\/\d{1,2})?\s*(凌晨|清晨|上午|中午|午後|傍晚|晚間|深夜)?\s*(\d{1,2}:\d{2})/g,
      m0 => wrap(m0, 'var(--acc)', true));
    // 要動作的事
    h = h.replace(/(應於|前完成待機|完成待機|立即待機|前完成關機|完成關機|立即關機|停班停課|停止上班上課|陸上颱風警報|海上颱風警報)/g,
      m0 => wrap(m0, 'var(--no)', true));
    h = h.replace(/(可評估復機|不需待機|未達待機門檻)/g, m0 => wrap(m0, 'var(--ok)', true));
    h = h.replace(/(本機推估，非公告|系統推估|推估)/g, m0 => wrap(m0, 'var(--fg4)'));

    if (raw.startsWith('【')) return `<b style="color:var(--acc);font-size:0.9375rem">${h}</b>`;
    if (!raw.startsWith('　')) return `<b style="color:var(--fg);letter-spacing:.04em">${h}</b>`;
    return h;

}

   第 43 輪補上災害應變中心的兩段解除——先縮小編組、再撤除。查證過《中央災害應變中心作業要點》：
   縮編是「災害狀況已不再繼續擴大或災情已趨緩和,無緊急應變任務需求時」,撤除是「災害緊急應變處置已完成,
   且後續復原重建可由各相關機關自行辦理」,兩者都要主管機關提報、指揮官決定。
   所以程式只給「建議時間」,實際一律以縣市災害應變中心的通知為準。
   程式看得到的訊號：
   ・開設：推估進入海警範圍往前 meetLead 小時。
   ・縮編：中央氣象署解除陸上颱風警報（官方）；還沒解除就用推估「暴風圈離開陸地」。只發海上警報的颱風沒有這一段。
   ・撤除：中央氣象署解除颱風警報（官方）；還沒解除就用推估「離開海警範圍」往後 meetLag 小時。
   ・撤除時站臺所在縣市還有豪雨以上特報：風災撤了也可能轉水災應變,另外提醒（臺中市作業要點裡

const MEET_WARN_H = 12;          // 開設前 12 小時內升到總覽最上面提醒
function meetPlan() {
  if (!WARN || !WARN.isTy || !WARN.sea) return null;
  const c = DB.cfg, H = 3600000, now = Date.now();
  const open = WARN.sea.affect - (Number.isFinite(c.meetLead) ? c.meetLead : 3) * H;
  let close = WARN.sea.clear + (Number.isFinite(c.meetLag) ? c.meetLag : 0) * H, closeSrc = 'est';
  const wt = DB.ty.data ? warnTimes(DB.ty.data) : null;
  if (wt && wt.end && Number.isFinite(wt.end.t)) { close = wt.end.t; closeSrc = 'official'; }
  let shrink = null, shrinkSrc = '';
  if (wt && wt.landOff && Number.isFinite(wt.landOff.t)) { shrink = wt.landOff.t; shrinkSrc = 'official'; }
  else if (WARN.land && !(wt && wt.end)) { shrink = WARN.land.clear; shrinkSrc = 'est'; }
  /* 推估說已經離開、官方警報卻還掛著：以官方為準,這一段等官方解除才建議（不能叫人照推估先撤） */
  const w = DB.ty.data ? warnFor(DB.ty.data) : null;
  if (closeSrc === 'est' && close <= now && w && w.active) { close = null; closeSrc = 'wait'; }
  if (shrinkSrc === 'est' && shrink <= now && w && w.active && w.isLand) { shrink = null; shrinkSrc = 'wait'; }
  if (shrink != null && close != null && shrink >= close) shrink = null;   // 陸上與颱風警報同時解除：直接撤除
  const next = shrink ?? close;
  let phase = now < open ? 'before' : next == null || now < next ? 'open' : close == null || now < close ? 'shrink' : 'end';
  // 官方訊號優先於推估：已發布警報就算應變中,已解除陸上警報就至少是縮編
  if (closeSrc === 'official' && now >= close) phase = 'end';
  else if (shrinkSrc === 'official' && now >= shrink) phase = 'shrink';

// 站臺所在縣市（不知道在哪就看全部）目前有豪雨以上特報的縣市
function heavyRainCounties() {
  const mine = myCounties().map(cnorm), out = [];
  for (const a of ADV) {
    if (advCat(a.kind) !== 'rain' || advH24(a.kind) < ADV_H24['豪雨']) continue;
    for (const area of a.areas) {
      const bare = cnorm(area).replace(/(山區|平地|沿海|地區|北部|南部|東部|西部)+$/, '');
      if (mine.length && !mine.some(m => bare.includes(m) || m.includes(bare))) continue;
      const name = COUNTIES_NS.find(n => bare.includes(cnorm(n))) || area;
      if (!out.includes(name)) out.push(name);
    }
  }
  return out;
}
