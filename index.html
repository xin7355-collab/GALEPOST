/* ── 啟動 ────────────────────────────────────────────── */
function syncForm() {
  $('#tyName').value = DB.ty.name || '';
  $('#since').value = toInput(DB.since || Date.now());
  $$('#tplSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t === DB.tpl)));
}
function tickClock() {
  const d = new Date();
  $('#now').textContent = `${d.getMonth() + 1}/${d.getDate()} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
}
if (!DB.since) DB.since = Date.now() - 86400000;
tickClock(); setInterval(tickClock, 15000);
setInterval(() => { if (DB.ty.data) { renderStations(); } }, 300000);   // 每 5 分鐘更新推估風級
rebuildModel();
syncForm();
renderStations();
renderTyphoon({});
renderSettings();
generate();

window.startCtl = startCtl; window.endCtl = endCtl; window.openTypes = openTypes; window.openSort = openSort;
window.openImportPreview = openImportPreview; window.loadTyphoon = loadTyphoon; window.go = go; window.openPin = openPin;
/* 手動檢查更新。
   平常不自動換版是刻意的（颱風天不該把正在操作的人從腳下抽換）,
   但那也代表使用者可能一直停在舊版。這顆按鈕是唯一的出口。 */
async function checkUpdate() {
  if (!('serviceWorker' in navigator)) { toast('此瀏覽器不支援離線更新'); return; }
  let reg = null;
  try { reg = await navigator.serviceWorker.getRegistration(); } catch (e) {}
  if (!reg) { toast('尚未安裝離線版本，重新整理即可取得最新版'); return; }
  toast('檢查中…');
  try { await reg.update(); } catch (e) {}
  // update() 回來時新的 worker 可能還在安裝,等它進到 waiting 再說
  const waiting = await new Promise(res => {
    if (reg.waiting) return res(reg.waiting);
    const nw = reg.installing;
    if (!nw) return res(null);
    nw.addEventListener('statechange', () => {
      if (nw.state === 'installed') res(reg.waiting || nw);
      else if (nw.state === 'redundant') res(null);
    });
    setTimeout(() => res(reg.waiting || null), 8000);
  });
  if (waiting) { toast('正在套用新版本…'); waiting.postMessage('SKIP_WAITING'); }
  else toast(`目前已是最新版本 ${APP_VER}`);
}

/* ── 颱風頁的子頁籤 ────────────────────────────────────────
   整頁攤開要滑很久,而值班的人一次只問一件事:
   現在怎樣（概況）、往哪走（路徑）、我的站臺會怎樣（站臺）、
   要怎麼寫（播報）、外面實際在下什麼（實況）。
   選的分頁會記住 —— 每次進來都要重點一次很煩。              */
const TYSUB_KEY = 'galepost.ui.tysub';
let tySub = 'now';
try { tySub = localStorage.getItem(TYSUB_KEY) || 'now'; } catch (e) {}

function goTySub(k) {
  const panes = ['now', 'brief', 'map', 'live', 'st'];
  if (!panes.includes(k)) k = 'now';
  tySub = k;
  try { localStorage.setItem(TYSUB_KEY, k); } catch (e) {}
  panes.forEach(x => {
    const el = document.getElementById('ty-' + x);
    if (el) el.classList.toggle('on', x === k);
  });
  document.querySelectorAll('#tySeg button[data-ty]').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.ty === k)));
  // 地圖在隱藏狀態下量不到自己的大小,切回來要重新量再重新框,
  // 否則會停在切走之前的尺寸,變成一條窄縫或整個世界。
  if (k === 'map' && MAP) {
    setTimeout(() => { MAP.invalidateSize(); if (DB.ty.data) drawMap(DB.ty.data); }, 30);
  }
  // Windy 的 iframe 到真的切到實況頁才建立,不然一開 app 就吃掉幾 MB。
  if (k === 'live') renderWindyIfReady();
}

let _windyReady = null;
function renderWindyIfReady() { if (_windyReady) _windyReady(); }

window.pickTyphoon = pickTyphoon; window.goTySub = goTySub; window.copyBrief = copyBrief; window.onTimeline = onTimeline;
window.checkUpdate = checkUpdate; window.fetchDgpa = fetchDgpa;

</script>

  overflow:hidden;border:1px solid var(--edge);background:var(--bg2)}

<div class="pwa" id="pwaBar" role="status">
  <div class="tx"><b id="pwaT"></b><span id="pwaS"></span></div>
  <button id="pwaGo"></button>
  <button class="gh" id="pwaNo" aria-label="關閉">✕</button>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   PWA:安裝、離線警示、版本更新
   直接用 file:// 打開時 service worker 不存在,整段靜默跳過,不影響 app。
   ═══════════════════════════════════════════════════════════════ */
(function () {
  'use strict';
  const bar = document.getElementById('pwaBar');
  const elT = document.getElementById('pwaT'), elS = document.getElementById('pwaS');
  const elGo = document.getElementById('pwaGo'), elNo = document.getElementById('pwaNo');
  if (!bar) return;

  const DISMISS = 'galepost.pwa.dismiss';
  let onGo = null;

  function show(kind, title, sub, action, fn) {
    elT.textContent = title;
    elS.textContent = sub || '';
    elGo.textContent = action;
    elGo.hidden = !action;
    onGo = fn;
    bar.classList.toggle('warn', kind === 'warn');
    bar.classList.add('on');
  }
  function hide() { bar.classList.remove('on'); onGo = null; }

  elGo.addEventListener('click', () => { const f = onGo; hide(); if (f) f(); });
  elNo.addEventListener('click', hide);

  const standalone = () =>
    matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

  /* ── 字級 ───────────────────────────────────────────────────
     存在自己的 key,不進 DB —— 字級是這台裝置的偏好,
     不該跟著站臺資料被匯出、也不該被別台的備份蓋掉。 */
  const TS_KEY = 'galepost.ui.ts';
  const TS = [
    ['s', '小'], ['m', '中'], ['l', '大'], ['xl', '特大'],
  ];
  function getTs() {
    const v = localStorage.getItem(TS_KEY);
    return TS.some(([k]) => k === v) ? v : 'm';
  }
  function applyTs(v) {
    document.documentElement.setAttribute('data-ts', v);
    // 地圖容器尺寸跟著字級變,Leaflet 需要被告知重新量測
    // 同上:頂層 let 不會出現在 window 上。原本這裡的字級切換其實沒有通知過地圖。
    if (typeof MAP !== 'undefined' && MAP && MAP.invalidateSize) {
      setTimeout(() => { MAP.invalidateSize(); if (MAPFIT) MAPFIT(); }, 60);
    }
  }
  function setTs(v) {
    localStorage.setItem(TS_KEY, v);
    applyTs(v);
  }
  applyTs(getTs());

  /* 設定頁的「顯示」區塊。renderSettings 每次進頁都會整段重畫,
     所以用包裝的方式在它畫完之後補上,不動它的函式本體。 */
  function displaySection() {
    const wrap = document.createElement('div');
    wrap.className = 'card pad';
    wrap.style.marginTop = '0.875rem';
    wrap.innerHTML =
      '<div class="sec"><h2>中央氣象署連線</h2></div>' +
      '<label class="fld" style="margin-bottom:0">' +
      '<span class="lb">CWA 代理網址（選填）</span>' +
      `<input type="text" id="cwaProxyIn" placeholder="https://xxx.workers.dev" ` +
      `value="${esc((DB.cfg && DB.cfg.cwaProxy) || '')}" autocomplete="off" spellcheck="false">` +
      '<span class="sub">瀏覽器直連氣象署若被 CORS 擋下，會改走這個代理。' +
      '格式與常見的 CWA 代理相同（POST cwaDataset / cwaKey），' +
      '若你其他程式已經部署過同一個 Worker，直接貼同一個網址即可。留空則只用直連。</span>' +
      '</label>' +
      '<div class="sec" style="margin-top:1.125rem"><h2>版本</h2></div>' +
      '<div class="card pad">' +
      `<div style="display:flex;align-items:center;gap:0.625rem;flex-wrap:wrap">
         <b style="font-family:var(--mono);font-size:1rem">風哨 ${APP_VER}</b>
         <span id="swVer" style="font-size:0.75rem;color:var(--fg3)"></span>
         <button class="btn sm" id="updBtn" style="margin-left:auto">檢查更新</button>
       </div>` +
      '<span class="sub" style="display:block;margin-top:0.5rem">' +
      '為了颱風天離線可用，程式本體是「快取優先」——裝過一次之後，' +
      '就算站臺已經更新，手機上仍可能是舊版，而且畫面上看不出來。' +
      '新版預設不會在你操作到一半時自動抽換（颱風天尤其不該），' +
      '要換版請按這顆按鈕。</span></div>';
    // 顯示 service worker 實際掛著的狀態,跟上面的版本號對照才知道是不是舊的
    const swVer = wrap.querySelector('#swVer');
    if (swVer && 'serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistration().then(reg => {
        if (!reg) { swVer.textContent = '（未安裝離線版本）'; return; }
        swVer.textContent = reg.waiting ? '（有新版本待套用）'
          : reg.active ? '（離線版本已就緒）' : '（安裝中）';
      }).catch(() => {});
    }
    const updBtn = wrap.querySelector('#updBtn');
    if (updBtn) updBtn.addEventListener('click', () => checkUpdate());

    const proxyIn = wrap.querySelector('#cwaProxyIn');
    if (proxyIn) {
      proxyIn.addEventListener('change', e => {
        DB.cfg.cwaProxy = e.target.value.trim();
        save();
        toast(DB.cfg.cwaProxy ? '已儲存代理網址' : '已清除代理網址');
      });
    }
    return wrap;
  }

  /* ── 兩指暫時放大 ────────────────────────────────────────
     只吃「兩根手指」的手勢,單指捲動完全不動它。
     放大時以兩指中點為原點,才會放大你正在看的那一塊而不是畫面正中央。
     手指離開就彈回 scale(1) —— 這是「湊近看一眼」,不是切換縮放層級。
     地圖自己有雙指縮放,所以在地圖上不接管。                    */
  (function pinchPeek() {
    const el = document.querySelector('main');
    if (!el) return;
    const MAXK = 3;
    let base = 0, k = 1, ox = 0, oy = 0, on = false;

    const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
    const apply = () => { el.style.transform = k === 1 ? '' : `translate(${ox}px,${oy}px) scale(${k})`; };
    const reset = () => {
      on = false; k = 1; ox = oy = 0;
      el.classList.remove('peeking');
      el.classList.add('peek-back');
      el.style.transform = '';
      setTimeout(() => el.classList.remove('peek-back', 'peek'), 240);
    };

    el.addEventListener('touchstart', e => {
      if (e.touches.length !== 2) return;
      // 地圖有自己的雙指縮放,不搶
      if (e.target.closest && e.target.closest('#mapWrap')) return;
      const t = [e.touches[0], e.touches[1]];
      base = dist(t);
      if (!base) return;
      on = true;
      const r = el.getBoundingClientRect();
      const cx = (t[0].clientX + t[1].clientX) / 2 - r.left;
      const cy = (t[0].clientY + t[1].clientY) / 2 - r.top;
      el.style.transformOrigin = `${cx}px ${cy}px`;
      el.classList.add('peek', 'peeking');
      el.classList.remove('peek-back');
    }, { passive: true });

    el.addEventListener('touchmove', e => {
      if (!on || e.touches.length !== 2) return;
      const d = dist([e.touches[0], e.touches[1]]);
      if (!d || !base) return;
      const next = clamp(d / base, 1, MAXK);
      // 只放大不縮小 —— 縮到比原本還小沒有用途,而且會露出背景
      if (next <= 1.01 && k <= 1.01) return;
      k = next;
      e.preventDefault();                 // 蓋掉瀏覽器自己的縮放與捲動
      apply();
    }, { passive: false });

    const end = e => { if (on && e.touches.length < 2) reset(); };
    el.addEventListener('touchend', end, { passive: true });
    el.addEventListener('touchcancel', end, { passive: true });
  })();

  /* 字級擺在設定的**最上面**（使用者指定）。
     它是「看不清楚的時候第一個要找的東西」,埋在版本號旁邊等於找不到。 */
  function textSizeSection() {
    const wrap = document.createElement('div');
    wrap.className = 'card pad';
    wrap.style.marginBottom = '1.125rem';
    wrap.innerHTML =
      '<div class="sec" style="margin-top:0"><h2>顯示</h2></div>' +
      '<label class="fld" style="margin-bottom:0">' +
      '<span class="lb">字級</span>' +
      '<div class="seg" id="tsSeg" style="margin-bottom:0">' +
      TS.map(([k, label]) =>
        `<button type="button" data-ts="${k}" aria-pressed="${getTs() === k}">${label}</button>`
      ).join('') +
      '</div>' +
      '<span class="sub">整個介面會一起縮放，不只字體。橫放手機時導覽列會自動移到左側。' +
      '另外，在任何頁面都可以用兩指撐開暫時放大，放開就彈回原狀。</span>' +
      '</label>';
    wrap.querySelector('#tsSeg').addEventListener('click', e => {
      const b = e.target.closest('button[data-ts]');
      if (!b) return;
      setTs(b.dataset.ts);
      wrap.querySelectorAll('#tsSeg button').forEach(x =>
        x.setAttribute('aria-pressed', String(x === b)));
    });
    return wrap;
  }

  const cfgBody = document.getElementById('cfgBody');
  if (cfgBody && typeof window.renderSettings === 'function') {
    const orig = window.renderSettings;
    window.renderSettings = function () {
      orig.apply(this, arguments);
      cfgBody.insertBefore(textSizeSection(), cfgBody.firstChild);
      cfgBody.appendChild(displaySection());
    };
  }

  /* ── Windy 即時影像 ─────────────────────────────────────────
     風哨自己算的是「模式推估」,Windy 給的是實際的雷達回波與風場。
     兩者互補:推估用來排關機時程,實況用來確認現在到底在下什麼。
     嵌入不需要金鑰。iframe 到真的切到颱風頁才建立 —— 一開 app 就載
     等於每次開啟都吃掉幾 MB 行動網路,颱風天很珍貴。 */
  const WINDY_OV = [
    ['radar', '雷達'], ['rain', '雨量'], ['wind', '風速'], ['gust', '陣風'],
  ];
  let windyOv = 'radar';

  /* 對焦位置:站臺或颱風。
     預設仍是站臺 —— 值班最常問的是「自家設備頭上在下什麼」,
     不是颱風中心那片海。但要看颱風本體的雲系與環流時,
     切到颱風才對得上,所以兩個都留,並記住上次的選擇。      */
  const WINDY_FOCUS_KEY = 'galepost.ui.windyfocus';
  let windyFocus = 'station';
  try { windyFocus = localStorage.getItem(WINDY_FOCUS_KEY) || 'station'; } catch (e) {}

  function typhoonCenter() {
    const ty = (typeof DB !== 'undefined' && DB.ty) ? DB.ty.data : null;
    const p = ty && ty.pos;
    return (p && Number.isFinite(p.lat) && Number.isFinite(p.lng)) ? p : null;
  }

  function windyCenter() {
    if (windyFocus === 'typhoon') {
      const p = typhoonCenter();
      // 颱風可能還在幾百公里外,拉遠一級才看得到整個環流
      if (p) return { lat: p.lat, lng: p.lng, zoom: 5 };
    }
    // 以自己的站臺為中心最有用 —— 要看的是自家設備頭上在下什麼,
    // 不是颱風中心那片海。沒有站臺座標才退回臺灣中心。
    const pts = (typeof DB !== 'undefined' ? DB.stations : [])
      .filter(s => Number.isFinite(s.lat) && Number.isFinite(s.lng));
    if (pts.length) {
      return {
        lat: pts.reduce((a, s) => a + s.lat, 0) / pts.length,
        lng: pts.reduce((a, s) => a + s.lng, 0) / pts.length,
        zoom: 6,
      };
    }
    return { lat: 23.7, lng: 121.0, zoom: 6 };
  }

  function windyURL(ov) {
    const c = windyCenter();
    const lat = c.lat.toFixed(3), lng = c.lng.toFixed(3);
    const q = new URLSearchParams({
      lat, lon: lng, detailLat: lat, detailLon: lng,
      zoom: String(c.zoom || 6), level: 'surface', overlay: ov,
      calendar: 'now', menu: '', type: 'map',
      location: 'coordinates', metricWind: 'm/s', metricTemp: 'default',
      radarRange: '-1',
    });
    if (ov === 'radar') q.set('product', 'radar');
    return 'https://embed.windy.com/embed2.html?' + q.toString();
  }

  _windyReady = () => renderWindy();

  function renderWindy() {
    const box = document.getElementById('tyWindy');
    if (!box) return;
    const c = windyCenter();
    const full = `https://www.windy.com/${c.lat.toFixed(3)}/${c.lng.toFixed(3)}?${windyOv},${c.lat.toFixed(3)},${c.lng.toFixed(3)},${c.zoom || 6}`;
    // 沒有颱風就不顯示對焦切換 —— 切過去也只會是一片空海
    const canTy = !!typhoonCenter();
    const focusSeg = canTy
      ? '<div class="seg" id="wyFo" style="margin-top:0.375rem">'
        + [['station', '對焦站臺'], ['typhoon', '對焦颱風']].map(([f, l]) =>
            `<button type="button" data-fo="${f}" aria-pressed="${windyFocus === f}">${l}</button>`
          ).join('') + '</div>'
      : '';
    box.innerHTML =
      '<div class="sec"><h2>即時影像 Windy</h2></div>' +
      '<div class="seg" id="wyOv">' +
      WINDY_OV.map(([o, l]) =>
        `<button type="button" data-ov="${o}" aria-pressed="${windyOv === o}">${l}</button>`
      ).join('') + '</div>' + focusSeg +
      '<div class="tyframe" id="wyFrame"></div>' +
      `<div class="btnrow" style="margin-top:0.625rem">
         <a class="btn sm" href="${full}" target="_blank" rel="noopener"
            style="text-decoration:none">Windy 全畫面 ↗</a>
         <a class="btn sm" href="https://watch.ncdr.nat.gov.tw/watch_page_typhoon_v2"
            target="_blank" rel="noopener" style="text-decoration:none">NCDR 颱風監測 ↗</a>
         <a class="btn sm" href="https://www.dgpa.gov.tw/typh/daily/nds.html"
            target="_blank" rel="noopener" style="text-decoration:none">停班停課公告 ↗</a>
       </div>` +
      '<p class="hint" style="margin-top:0.5rem">NCDR 天氣與氣候監測網：各國預報路徑比對' +
      '（氣象署／美軍／日本／韓國／中國）、衛星雲圖、雨量與風速監測。<br>' +
      '停班停課：行政院人事行政總處公告，各縣市由地方政府宣布，' +
      '本程式不代為判斷，請以公告為準。</p>' +
      '<p class="hint" style="margin-top:0.5rem">Windy 為實際觀測與模式繪圖，需連網。' +
      '風哨的關機、復機時間仍是本機推估，兩者請分開看。</p>';

    mountWindyFrame();
    box.querySelector('#wyOv').addEventListener('click', e => {
      const b = e.target.closest('button[data-ov]');
      if (!b) return;
      windyOv = b.dataset.ov;
      box.querySelectorAll('#wyOv button').forEach(x =>
        x.setAttribute('aria-pressed', String(x === b)));
      mountWindyFrame();
    });
    const fo = box.querySelector('#wyFo');
    if (fo) fo.addEventListener('click', e => {
      const b = e.target.closest('button[data-fo]');
      if (!b) return;
      windyFocus = b.dataset.fo;
      try { localStorage.setItem(WINDY_FOCUS_KEY, windyFocus); } catch (err) {}
      fo.querySelectorAll('button').forEach(x =>
        x.setAttribute('aria-pressed', String(x === b)));
      mountWindyFrame();
    });
  }

  // 上一次真的載進去的網址。Windy 的圖磚刻意不快取,重掛一次 iframe
  // 就是又一輪流量,颱風天要省。網址沒變就不重載。
  let _windySrc = '';

  function mountWindyFrame() {
    const frame = document.getElementById('wyFrame');
    if (!frame) return;
    if (!navigator.onLine) {
      frame.innerHTML = '<div class="ph">目前離線，無法載入 Windy 即時影像。<br>' +
        '站臺管制與回報產出不受影響。</div>';
      _windySrc = '';                  // 恢復連線後要重新掛回來
      return;
    }
    const src = windyURL(windyOv);
    if (_windySrc === src && frame.querySelector('iframe')) return;
    _windySrc = src;
    const f = document.createElement('iframe');
    f.src = src;
    f.loading = 'lazy';
    f.title = 'Windy 即時影像';
    f.referrerPolicy = 'no-referrer';
    f.setAttribute('allow', 'fullscreen');
    frame.innerHTML = '';
    frame.appendChild(f);
  }

  /* ── 官方警報單 ─────────────────────────────────────────────
     風哨自己算的發布時機是模式推估;氣象署實際發布的警報單才是
     單位行動的依據。有官方警報時擺到最上面,推估退居輔助。 */
  function renderWarn() {
    const box = document.getElementById('tyWarn');
    if (!box) return;

    /* 取不到官方資料時,原本只會默默退回 GDACS,看起來像「氣象署沒發布」——
       其實多半是直連被擋。把真正的原因留在畫面上,而不是只閃一下就消失。 */
    let diag = '';
    try { diag = typeof cwaDiag === 'function' ? cwaDiag() : ''; } catch (e) { diag = ''; }
    const usingOfficial = DB && DB.ty && DB.ty.data && DB.ty.data.official;
    const diagHtml = (diag && !usingOfficial)
      ? `<div class="msg w" style="margin-bottom:0.75rem">取不到中央氣象署官方資料：${esc(diag)}</div>`
      : '';

    const w = (typeof DB !== 'undefined' && DB.ty) ? DB.ty.warning : null;
    if (!w || !w.active) { box.innerHTML = diagHtml; return; }

    const land = w.isLand;
    const col = land ? 'var(--no)' : 'var(--sb)';
    const bg = land ? 'var(--no-d)' : 'var(--sb-d)';
    const list = w.areas || [];
    const areas = list.slice(0, 8).join('、');
    const more = list.length > 8 ? ` 等 ${list.length} 個縣市` : '';
    const t = s => {
      if (!s) return '';
      const d = new Date(s);
      return isNaN(d) ? '' : `${d.getMonth() + 1}/${d.getDate()} `
        + `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    };
    box.innerHTML = diagHtml +
      `<div class="card pad" style="border-color:${col};background:${bg};margin-bottom:0.75rem">
         <div style="display:flex;align-items:center;gap:0.625rem;flex-wrap:wrap">
           <b style="font-size:1.0625rem;color:${col}">${esc(w.headline)}</b>
           <span class="tag" style="background:${col};color:#08131A">中央氣象署發布</span>
         </div>
         ${areas ? `<div class="hint" style="margin-top:0.5rem;color:var(--fg2)">影響地區：${esc(areas)}${more}</div>` : ''}
         <div class="hint" style="margin-top:0.25rem">${w.issuedAt ? '發布 ' + t(w.issuedAt) : ''}${w.expires ? '　下次更新 ' + t(w.expires) : ''}</div>
       </div>`;
  }

  if (typeof window.renderTyphoon === 'function') {
    const origRT = window.renderTyphoon;
    window.renderTyphoon = function () {
      origRT.apply(this, arguments);
      renderWarn();
    };
  }

  // 切到颱風頁才掛載,其他分頁不建立 iframe
  if (typeof window.go === 'function') {
    const origGo = window.go;
    window.go = function (p) {
      origGo.apply(this, arguments);
      if (p === 'ty') { goTySub(tySub); }
      else {
        const box = document.getElementById('tyWindy');
        if (box) box.innerHTML = '';   // 離開就卸載,不讓它在背景繼續拉圖資
      }
    };
  }
  addEventListener('online', () => {
    if (document.getElementById('wyFrame')) mountWindyFrame();
  });
  addEventListener('offline', () => {
    if (document.getElementById('wyFrame')) mountWindyFrame();
  });

  /* ── 分頁深連結 ────────────────────────────────────────────
     manifest 的捷徑(長按圖示 → 站臺 / 回報)靠 #eq、#rp 指定開哪一頁。 */
  const PANES = ['ty', 'eq', 'rp', 'cfg'];
  function fromHash() {
    const p = (location.hash || '').replace(/^#/, '');
    if (PANES.includes(p) && typeof go === 'function') go(p);
  }
  addEventListener('hashchange', fromHash);
  fromHash();

  /* ── 離線警示 ──────────────────────────────────────────────
     颱風資料是唯一會過期的東西。離線時操作者必須知道畫面上的
     颱風位置是什麼時候抓的,否則會拿舊資料做關機判斷。          */
  function tyAge() {
    try {
      const at = (typeof DB !== 'undefined' && DB.ty && DB.ty.at) || 0;
      if (!at) return '尚未取得過颱風資料';
      const min = Math.round((Date.now() - at) / 60000);
      if (min < 60) return `颱風資料為 ${min} 分鐘前取得`;
      const hr = min / 60;
      if (hr < 48) return `颱風資料為 ${hr.toFixed(1)} 小時前取得`;
      return `颱風資料為 ${(hr / 24).toFixed(1)} 天前取得`;
    } catch (e) { return ''; }
  }
  function offlineCheck() {
    if (!navigator.onLine) {
      show('warn', '目前離線', tyAge() + ',站臺管制與回報不受影響。', '', null);
    } else if (bar.classList.contains('warn')) {
      hide();
    }
  }
  addEventListener('offline', offlineCheck);
  addEventListener('online', offlineCheck);

  /* ── 安裝 ─────────────────────────────────────────────────── */
  let deferred = null;
  addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferred = e;
    if (standalone() || localStorage.getItem(DISMISS) || !navigator.onLine) return;
    show('', '把風哨加到主畫面', '之後開啟不必找網址,離線也能用。', '安裝', async () => {
      localStorage.setItem(DISMISS, '1');
      deferred.prompt();
      await deferred.userChoice.catch(() => {});
      deferred = null;
    });
  });
  addEventListener('appinstalled', () => { localStorage.setItem(DISMISS, '1'); hide(); });
  elNo.addEventListener('click', () => {
    if (deferred) localStorage.setItem(DISMISS, '1');
  });

  // iOS Safari 沒有 beforeinstallprompt,只能告訴使用者手動加入
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (isIOS && !standalone() && !localStorage.getItem(DISMISS) &&
      location.protocol === 'https:') {
    setTimeout(() => {
      if (!bar.classList.contains('on')) {
        show('', '把風哨加到主畫面', '點下方分享鈕 → 加入主畫面。', '知道了',
          () => localStorage.setItem(DISMISS, '1'));
      }
    }, 2500);
  }

  /* ── Service worker 與版本更新 ─────────────────────────────── */
  if (!('serviceWorker' in navigator) || !location.protocol.startsWith('http')) {
    offlineCheck();
    return;
  }

  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloading) return;
    reloading = true;
    location.reload();
  });

  function offerUpdate(worker) {
    show('', '有新版本', '重新載入即可套用,現有資料不受影響。', '重新載入',
      () => worker.postMessage('SKIP_WAITING'));
  }

  addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      if (reg.waiting && navigator.serviceWorker.controller) offerUpdate(reg.waiting);
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', () => {
          // 有 controller 才代表這是「更新」而非第一次安裝
          if (nw.state === 'installed' && navigator.serviceWorker.controller) offerUpdate(nw);
        });
      });
      // 回到前景時查一次有沒有新版
      addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') reg.update().catch(() => {});
      });
    }).catch(() => {});
    offlineCheck();
  });
})();
</script>
</body>
</html>
