  /* 資料放久了要講。
     這支程式是「快取優先」而且颱風天訊號常常斷,畫面上明明有數字、
     其實可能是一小時前的 —— 過期的颱風資訊比沒有資訊更危險,
     所以超過門檻就明講幾分鐘前,不要讓人以為看到的是即時的。 */
  const ageMin = DB.ty.at ? Math.floor((Date.now() - DB.ty.at) / 60000) : -1;
  const stale = ageMin >= 30
    ? `<div class="msg ${ageMin >= 90 ? 'e' : 'w'}">資料已是 ${ageMin >= 120
        ? Math.floor(ageMin / 60) + ' 小時' : ageMin + ' 分鐘'}前取得的，`
      + `可能已經不是現況。按上方「更新」重新取得。</div>`
    : '';
  msg.innerHTML = (note ? `<div class="msg w">${esc(note)}</div>` : '') + stale +
    `<div class="msg i">${ty.official ? '中央氣象署官方路徑' : 'GDACS（非官方，僅觀測位置）'}`
    + `${DB.ty.at ? `　${fmtShort(DB.ty.at)} 更新` : ''}`
    + '　·　關機與警報時機為<b>推估</b>，以氣象署警報單為準。</div>';

  const bfV = ms2bf(ty.vmax), bfG = ms2bf(ty.gust);
  const dTw = Math.round(distToTaiwan(ty.pos));
  const brg = bearing({ lat: 23.7, lng: 121.0 }, ty.pos);
  const g = [
    ['中心氣壓', ty.pres ? ty.pres + ' hPa' : '—'],
    ['瞬間陣風', ty.gust ? bfLabel(bfG) : '—'],
    ['七級風半徑', ty.r15 ? ty.r15 + ' km' : '—'],
    ['移動', ty.mvDir ? `${dirZh(ty.mvDir)} ${ty.mvSpd || '—'} km/h` : '—'],
    ['中心位置', fmtCoordShort(ty.pos.lat, ty.pos.lng)],
    ['距臺灣', `${dTw} km · 臺灣之${dirName(brg)}`],
  ];
  $('#tyPick').innerHTML = typhoonPicker();
  /* 停班停課（推估與官方公告）擺在播報頁籤 —— 那一頁本來就是
     「要抄進通報、要唸出來的材料」,概況頁是看颱風本身的。 */
  $('#tyBrief').innerHTML = advisoryCard() + suspendCard() + dgpaOfficialCard() + briefCard();
  body.innerHTML = `<div class="card ty-hero">
    <div class="glow" style="background:${bfColor(bfV)}"></div>
    <div class="ty-top">${bfBadge(bfV, 'lg')}
      <div class="ty-nm"><b>${esc(ty.name)}</b>
        <span>${ty.en && ty.en !== ty.name ? esc(ty.en) + '　' : ''}<i style="font-style:normal;font-weight:700;color:${bfColor(bfV)}">${TC_FULL[tcClass(ty.vmax)] || ''}</i>　近中心最大風 ${bfLabel(bfV)}</span></div></div>
    <div class="ty-gr">${g.map(([l, v]) => `<div><b>${esc(v)}</b><small>${l}</small></div>`).join('')}</div>
  </div>` + warningCard();

  drawMap(ty);
  renderImpact();
  renderForecast();
  paintBfBar(Math.max(bfV, ...DB.stations.filter(IS_LIVE)
    .map(s => (SERIES ? stationImpact(SERIES, s, DB.cfg)?.now.bf : -1) ?? -1)));
}

/* ── 各縣市停班停課「官方」資訊 ─────────────────────────────
   使用者要的是官方公告本身,不是我的推估。這裡分兩件事處理:

   ① **官方基準**：《天然災害停止上班及上課作業辦法》第四條附表已經內建
      （DGPA_COUNTY）,那是法規附表,可以直接列給人看。
   ② **官方即時公告**：行政院人事行政總處的「天然災害停止上班及上課情形」。
      **我沒有驗證過任何可跨網域取用的官方資料端點** —— 這個開發環境連不到
      dgpa.gov.tw,無從確認。憑猜測寫一個網址上去,就是重演抓 W-C0034-003
      （平台上根本不存在的資料集）那個錯:畫面上會出現一個永遠失敗、
      或更糟、成功但內容是別的東西的區塊。
      所以做法是:預設只給官方頁面的連結,另外開一個設定欄位,
      使用者拿到可用的 JSON 端點時自己填進來,程式才會去抓。         */
let DGPA_LIVE = null, DGPA_LIVE_AT = 0, DGPA_LIVE_ERR = '', DGPA_HEAD = '', DGPA_UPD = '';

/* 解析官方那張表。結構（實際回應）:
     <TABLE id="Table"> … <TD headers='city_Name'><FONT>基隆市</FONT></TD>
     <TD headers='StopWorkSchool_Info'>
       <FONT color=#000080>今天照常上班、照常上課。</FONT><br>
       <FONT color=#FF0000>明天停止上班、停止上課。</FONT> … </TD>
   紅字（#FF0000）＝有停班停課,藍字（#000080）＝照常。
   最後一列是備註,只有一個 colspan 的 TD,沒有 city_Name,自然會被略過。
   縣市以外的細項（「蘇澳鎮南強里:今天晚上06:00起…」）原樣保留 ——
   那正是值班的人要看的那一行,不能只留縣市層級的結論。            */
function parseDgpaHtml(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const t = doc.querySelector('#Table') || doc.querySelector('table');
  const head = doc.querySelector('.Header_YMD');
  DGPA_HEAD = head ? head.textContent.trim().replace(/\s+/g, ' ') : '';
  const upd = doc.querySelector('.Content_Updata');
  const m = upd && upd.textContent.match(/更新時間：([\d\/: -]+)/);
  /* 官方寫的是「2026/08/25 06:47:16」。年份與秒在這裡沒有用 ——
     公告本來就是今天的,秒數也不會改變任何決定。留「08/25 06:47」。 */
  DGPA_UPD = m ? m[1].trim().replace(/^\d{4}[\/-]/, '').replace(/:\d{2}$/, '') : '';
  if (!t) return [];
  const out = [];
  for (const tr of t.querySelectorAll('tr')) {
    const tds = tr.querySelectorAll('td');
    if (tds.length < 2) continue;                       // 備註列
    const county = tds[0].textContent.trim().replace(/\s+/g, '');
    if (!county || !/[縣市]$/.test(county)) continue;    // 表頭與雜項
    /* 每一行分兩件事看:停不停,以及**停的是整個縣市還是某幾個區／鄉／里**。
       官方那張表在高雄市、屏東縣這種情況下,整格裡一條全縣的敘述都沒有,
       只有「六龜區:今天停止上班、停止上課。」這種逐區的。
       如果把整個縣市塗紅,等於說高雄市全市放假 —— 那天並沒有。
       判斷方式:行首有「○○區:」「○○鄉:」「○○里:」這種前綴的就是局部。 */
    const PART_RE = /^[^:：]{1,18}(區|鄉|鎮|市|里|村|部落|分校|國民小學|國小|國中|高中)[^:：]{0,12}[:：]/;
    const lines = [];
    let full = false, part = false;
    const add = (txt, stop) => {
      const scope = PART_RE.test(txt) ? 'part' : 'all';
      if (stop) { if (scope === 'all') full = true; else part = true; }
      lines.push({ txt, stop, scope });
    };
    for (const f of tds[1].querySelectorAll('font, span')) {
      const txt = f.textContent.trim().replace(/\s+/g, ' ');
      if (!txt) continue;
      const col = (f.getAttribute('color') || '').toUpperCase();
      add(txt, /停止上班|停止上課/.test(txt) || col === '#FF0000' || col === 'FF0000');
    }
    if (!lines.length) {
      const txt = tds[1].textContent.trim().replace(/\s+/g, ' ');
      if (txt) add(txt, /停止上班|停止上課/.test(txt));
    }
    out.push({ county, lines, full, part, alert: full || part });
  }
  return out;
}

/* 也接 JSON —— 使用者若自備一個整理好的端點,不必被逼著回傳 HTML。 */
function parseDgpaJson(j) {
  const rows = Array.isArray(j) ? j
    : (j && (j.records || j.data || j.result || j.list)) || [];
  if (!Array.isArray(rows)) return [];
  return rows.map(r => {
    if (!r || typeof r !== 'object') return null;
    const county = pick(r, 'county', 'County', 'countyName', 'CountyName', 'name', 'area', '縣市');
    if (!county) return null;
    const txt = [pick(r, 'work', 'Work', 'status', '上班'), pick(r, 'school', 'School', '上課'),
      pick(r, 'note', 'Note', '備註')].filter(Boolean).map(String).join('、');
    const stop = /停止上班|停止上課|停班|停課/.test(txt);
    return { county: String(county), lines: txt ? [{ txt, stop, scope: 'all' }] : [],
      full: stop, part: false, alert: stop };
  }).filter(Boolean);
}

async function fetchDgpa(manual) {
  const cfgUrl = (DB.cfg.dgpaUrl || '').trim();
  const proxy = DB.cfg.dgpaProxy === undefined ? DGPA_PROXY_DEFAULT : String(DB.cfg.dgpaProxy || '');
  const url = cfgUrl || (proxy ? proxy + encodeURIComponent(DGPA_URL) : '');
  if (!url) { DGPA_LIVE = null; DGPA_LIVE_ERR = ''; if (manual) renderTyphoon({}); return; }
  try {
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const body = await r.text();
    const rows = /^\s*[[{]/.test(body)
      ? parseDgpaJson(JSON.parse(body))
      : parseDgpaHtml(body);
    if (!rows.length) throw new Error('回應中找不到縣市資料（來源格式可能變了）');
    DGPA_LIVE = rows; DGPA_LIVE_AT = Date.now(); DGPA_LIVE_ERR = '';
  } catch (e) {
    DGPA_LIVE = null; DGPA_LIVE_ERR = String((e && e.message) || e);
  }
  if (manual) renderTyphoon({});
}

/* 我自己的站臺與關注地點落在哪些縣市 —— 只把那幾個縣市挑出來排在最前面,
   二十二個縣市全列一次,要找自己的那一個還得用眼睛掃。 */
function myCounties() {
  const set = new Set();
  for (const x of DB.places) { const c = countyOf(x); if (c) set.add(c); }
  for (const x of DB.stations) { if (!IS_LIVE(x)) continue; const c = countyOf(x); if (c) set.add(c); }
  return [...set];
}

function dgpaOfficialCard() {
  const mine = myCounties().map(cnorm);
  const live = DGPA_LIVE;
  let liveHtml;
  if (live && live.length) {
    // 自己的縣市排最前面,其次是有停班停課的,其餘照原順序
    const rows = live.map((r, i) => ({ r, i }))
      // 我的縣市 → 全縣停 → 部分地區停 → 其餘
      .sort((a, b) => (mine.includes(cnorm(b.r.county)) - mine.includes(cnorm(a.r.county)))
        || (b.r.full - a.r.full) || (b.r.part - a.r.part) || (a.i - b.i))
      .map(x => x.r);
    liveHtml = `${DGPA_HEAD ? `<div style="font-weight:700;margin-bottom:0.25rem">${esc(DGPA_HEAD)}</div>` : ''}
      <div class="hint" style="margin:0 0 0.5rem">
        ${DGPA_UPD ? `官方更新時間 ${esc(DGPA_UPD)}　·　` : ''}本機 ${fmtShort(DGPA_LIVE_AT)} 取得</div>
      ${(() => {
        /* 二十二個縣市全攤開,概況頁會被推長一大截,而且要找自己的那一個
           還得用眼睛掃。所以只把「我的」與「有停班停課的」直接列出來,
           其餘收在一個可以展開的區塊裡 —— 資料一筆都沒有少。 */
        /* 縣市名的顏色講的是**這個縣市整體**停不停:
           全縣停＝紅;只有幾個區鄉停＝琥珀並標「部分地區」——
           把高雄市塗成紅色等於說全市放假,那天並沒有。 */
        const row = r => {
          const on = mine.includes(cnorm(r.county));
          const col = r.full ? 'var(--no)' : r.part ? 'var(--sb)' : 'var(--fg2)';
          return `<div style="padding:0.4375rem 0;border-top:1px solid var(--edge)${
            on ? ';background:var(--acc-d);margin:0 -0.5rem;padding-left:0.5rem;padding-right:0.5rem' : ''}">
            <div><b style="color:${col}">${esc(r.county)}</b>${
              (!r.full && r.part) ? '<em style="font-style:normal;font-size:0.6875rem;color:var(--sb);margin-left:0.375rem">部分地區</em>' : ''}${
              on ? '<em style="font-style:normal;font-size:0.6875rem;color:var(--acc);margin-left:0.375rem">轄區</em>' : ''}</div>
            ${(() => {
              /* 縣市層級的敘述直接列;「六龜區:…」這種細部地點折起來 ——
                 屏東縣一次十二行,四五個縣市就把整頁推到看不到底。
                 折疊的標題會寫出有幾個地點,不必展開也知道規模。 */
              const wide = r.lines.filter(l => l.scope === 'all');
              const part = r.lines.filter(l => l.scope === 'part');
              const line = l => `<div style="color:${
                l.stop ? (l.scope === 'all' ? 'var(--no)' : 'var(--sb)') : 'var(--fg3)'}">${esc(l.txt)}</div>`;
              const body = wide.map(line).join('')
                || (part.length ? '' : '<div style="color:var(--fg4)">未發布（照常上班上課）</div>');
              const fold = part.length ? `<details${on || r.full ? '' : ''}>
                <summary style="cursor:pointer;color:var(--sb);padding:0.125rem 0">
                  ${part.length} 個地區停止上班上課（展開）</summary>
                <div style="padding-left:0.25rem">${part.map(line).join('')}</div></details>` : '';
              return `<div style="font-size:0.8125rem;line-height:1.7">${body}${fold}</div>`;
            })()}
          </div>`;
        };
        const top = rows.filter(r => mine.includes(cnorm(r.county)) || r.alert);
        const rest = rows.filter(r => !top.includes(r));
        return top.map(row).join('')
          + (rest.length ? `<details style="margin-top:0.375rem">
              <summary style="cursor:pointer;font-size:0.8125rem;color:var(--acc);padding:0.375rem 0">
                其餘 ${rest.length} 個縣市（照常上班上課）</summary>
              ${rest.map(row).join('')}</details>` : '');
      })()}`;
  } else {
    liveHtml = `<div class="msg ${DGPA_LIVE_ERR ? 'e' : 'i'}" style="margin:0">${
      DGPA_LIVE_ERR
        ? `取得失敗：${esc(DGPA_LIVE_ERR)}。官方那一頁沒有 CORS 標頭，瀏覽器直連一定被擋，
           要透過代理才拿得到。到設定確認「停班停課來源」，或直接按下方連結看官方公告。`
        : '尚未取得。按右上「更新」，或直接按下方連結看官方公告。'}</div>`;
  }

  const rule = mine.length
    ? myCounties().map(c => {
        const r = DGPA_BY_NORM[cnorm(c)];
        if (!r) return `<div>${esc(c)}：附表未列，本程式以平地 ${DGPA_FLAT}／山區 ${DGPA_HILL} 計。</div>`;
        return `<div><b>${esc(r.name)}</b>：${r.hill === r.flat
          ? `不分山區平地 ${r.flat}` : `山區 ${r.hill}／平地 ${r.flat}`} mm${
          r.obs != null ? `　<span style="color:var(--sb)">實際觀測 ${r.obs} mm${
            r.obsZone === 'flat' ? '（平地）' : ''}</span>` : ''}</div>`;
      }).join('')
    : '<div style="color:var(--fg4)">尚未有站臺或關注地點對應得到縣市。</div>';

  return `<div class="sec"><h2>各縣市停班停課</h2>
    <button class="act" onclick="fetchDgpa(true)">更新</button></div>
    <div class="card pad" style="margin-bottom:0.75rem">
      ${liveHtml}
      <div class="btnrow" style="margin-top:0.625rem">
        <a class="btn pri sm" href="${DGPA_URL}" target="_blank" rel="noopener"
          style="text-decoration:none">開啟官方公告 ↗</a>
      </div>
      <div class="hint" style="margin-top:0.5rem">資料來源：行政院人事行政總處
        「天然災害停止上班及上課情形」。本程式只是把那一頁取回來重排，
        <b>不代為判斷</b>，一切以官方公告為準。</div>
      <div class="sec" style="margin-top:0.875rem"><h2>官方雨量基準（第四條附表）</h2></div>
      <div style="font-family:var(--mono);font-size:0.75rem;line-height:1.9;color:var(--fg2)">${rule}</div>
      <div class="hint" style="margin-top:0.5rem">附表單位為<b>未來 24 小時累積雨量預測</b>；
        南投平地 300、宜蘭 250、連江 180 另訂<b>實際觀測</b>基準，同為決定及通報依據。
        達到基準仍須已致災或有致災之虞，由地方政府綜合研判宣布。</div>
    </div>`;
}

/* 查某個地點所在縣市的**官方公告**。官方講的話永遠壓過我的推估 ——
   推估是拿模型算的,公告是已經發生的事實。 */
function dgpaFor(x) {
  if (!DGPA_LIVE || !DGPA_LIVE.length) return null;
  const c = cnorm(countyOf(x));
  if (!c) return null;
  return DGPA_LIVE.find(r => cnorm(r.county) === c) || null;
}

/* ── 停班停課推估卡 ─────────────────────────────────────
   使用者要的是「哪一天、幾點可能不用上班上課」。
   能算的只有風力那一款（平均風 7 級／陣風 10 級）—— 雨量款要的是
   「未來 24 小時累積雨量預測」,本程式沒有預測雨量。
   所以卡片上只講「推估達風力基準」,而且每一次都把三件事寫出來:
   ① 這是推估不是公告 ② 還要「已致災或有致災之虞」 ③ 宣布權在地方政府。 */
/* 一個地點的官方公告摘要。全縣停＝紅;只有幾個區鄉停＝琥珀,
   而且**要把那幾個區鄉列出來** —— 只說「部分地區」等於沒說,
   值班的人要自己判斷站臺在不在那幾個裡面。 */
function officialLine(x) {
  const d = dgpaFor(x);
  if (!d) return '';
  const stops = d.lines.filter(l => l.stop);
  if (!stops.length) {
    return `<div style="margin-top:0.3125rem">
      <span class="mono" style="font-size:0.6875rem;color:var(--fg4)">官方公告</span>
      <b style="color:var(--ok);margin-left:0.375rem">${esc(d.county)}　照常上班上課</b></div>`;
  }
  const col = d.full ? 'var(--no)' : 'var(--sb)';
  const wide = stops.filter(l => l.scope === 'all');
  const part = stops.filter(l => l.scope !== 'all');
  return `<div style="margin-top:0.3125rem;padding:0.375rem 0.5rem;border-radius:var(--r3);
      background:${d.full ? 'var(--no-d)' : 'var(--sb-d)'}">
    <span class="mono" style="font-size:0.6875rem;color:var(--fg4)">官方公告</span>
    <b style="color:${col};margin-left:0.375rem">${esc(d.county)}　${
      d.full ? '停止上班上課' : '部分地區停止上班上課'}</b>
    <div style="font-size:0.75rem;line-height:1.65;color:var(--fg2);margin-top:0.125rem">
      ${wide.map(l => `<div>${esc(l.txt)}</div>`).join('')}
      ${part.length ? `<details><summary style="cursor:pointer;color:${col};padding:0.125rem 0">
        ${part.length} 個地區停止上班上課（展開）</summary>
        <div style="padding-left:0.25rem">${part.map(l => `<div>${esc(l.txt)}</div>`).join('')}</div>
      </details>` : ''}</div>${
    d.full ? '' : `<div style="font-size:0.6875rem;color:var(--fg4);margin-top:0.125rem">
      請自行確認本站臺是否落在上列範圍內。</div>`}</div>`;
}

function suspendCard() {
  const targets = [
    ...DB.places.map(x => ({ ...x, kind: 'place' })),
    // 未建置的點還沒有人在那裡上班,不必推估它幾點停班停課
    ...DB.stations.filter(x => IS_LIVE(x) && Number.isFinite(x.lat)).map(x => ({ ...x, kind: 'st' })),
  ];
  if (!targets.length) return '';
  const rows = targets.map(x => ({ x, r: suspendFor(x) })).filter(v => v.r);
  const hit = rows.filter(v => v.r.any);
  const head = `<div class="sec"><h2>停班停課推估</h2>
    <button class="act" onclick="openPlace(null)">＋ 關注地點</button></div>`;
  const foot = `<details class="msg w" style="margin:0.625rem 0 0">
    <summary style="cursor:pointer;font-weight:700">這是本機推估，不是公告　·　點開看依據與但書</summary>
    <div style="margin-top:0.375rem">
    《天然災害停止上班及上課作業辦法》兩款：<b>風力</b>——平均風 ${SUSP_BF_MEAN} 級以上或陣風 ${SUSP_BF_GUST} 級以上
    （本程式由預報路徑逐時推算，陣風以持續風 ${GUST_FACTOR} 倍估算）；
    <b>雨量</b>——24 小時累積雨量<b>預測</b>達平地 ${DGPA_FLAT}、山區 ${DGPA_HILL} 毫米
    （本程式改看氣象署的豪大雨特報等級，特報本身即預測性質、門檻同一口徑，但它是分級不是逐點預測值）。
    <b>達到基準不等於一定放假</b>——還要已致災或有致災之虞，且由地方政府綜合研判宣布。請以
    <a href="https://www.dgpa.gov.tw/typh/daily/nds.html" target="_blank" rel="noopener">人事行政總處公告</a>為準。</div></details>`;

  /* 官方已經公告的地點,就算推估沒達標也要列出來 ——
     推估說「沒事」而官方說「停班停課」時,該相信的是官方。 */
  const official = rows.filter(v => !hit.includes(v) && (() => { const d = dgpaFor(v.x); return d && d.alert; })());
  if (!hit.length && !official.length) {
    /* 空狀態要講得具體。一整段但書、沒有一個地名,看的人不知道
       「到底有沒有查到我的縣市」—— 所以把轄區縣市與它們的官方狀態列出來。 */
    const cs = myCounties();
    const list = cs.length ? cs.map(c => {
      const d = DGPA_LIVE && DGPA_LIVE.find(r => cnorm(r.county) === cnorm(c));
      const st = !DGPA_LIVE ? '<span style="color:var(--fg4)">尚未取得公告</span>'
        : !d ? '<span style="color:var(--fg4)">公告中未列</span>'
        : d.full ? '<b style="color:var(--no)">停止上班上課</b>'
        : d.part ? '<b style="color:var(--sb)">部分地區停止上班上課</b>'
        : '<b style="color:var(--ok)">照常上班上課</b>';
      return `<div style="padding:0.1875rem 0"><b>${esc(c)}</b>　${st}</div>`;
    }).join('') : '<div style="color:var(--fg4)">站臺與關注地點都還對應不到縣市（需要鄰近雨量站或氣象站的資料）。</div>';
    return head + `<div class="card pad" style="margin-bottom:0.75rem">
      <div style="font-size:0.8125rem;line-height:1.7">${list}</div>
      <div class="msg i" style="margin:0.5rem 0 0">${targets.length} 個地點都沒有推估達到停班停課的基準
      （風力：平均風 ${SUSP_BF_MEAN} 級或陣風 ${SUSP_BF_GUST} 級；雨量：所在縣市未發布豪雨以上特報）。
      <b>推估沒達標不代表不會放假</b>——上列的官方狀態才是準的。</div>
      ${foot}</div>`;
  }
  const body = hit.concat(official).map(({ x, r }) => {
    const parts = [officialLine(x)].filter(Boolean);
    if (r.days.length) {
      parts.push(`<div style="margin-top:0.3125rem">
        <span class="mono" style="font-size:0.6875rem;color:var(--fg4)">風力款</span>
        ${r.days.map(d => `<b style="color:var(--no);margin-left:0.375rem">${dayPhrase(d)}</b>
          <span style="color:var(--fg3)">達標 ${fmtClock(d.from)}–${fmtClock(d.to)}　尖峰 ${d.peakBf} 級</span>`).join('<br>')}</div>`);
    }
    if (r.rain && r.rain.meets) {
      parts.push(`<div style="margin-top:0.3125rem">
        <span class="mono" style="font-size:0.6875rem;color:var(--fg4)">雨量款</span>
        <b style="color:var(--no);margin-left:0.375rem">${r.rainDays.length
          ? r.rainDays.map(rainDayPhrase).join('、') : '特報生效中'}</b>
        <span style="color:var(--fg3)">氣象署${esc(r.rain.area)}${esc(r.rain.kind)}
        （預測 24 小時 ≥ ${r.rain.mm} mm，達${r.rain.label}基準 ${r.rain.thr} mm）${
          r.rain.end ? `，有效至 ${fmtShort(r.rain.end)}` : ''}</span></div>`);
    } else if (r.rain) {
      parts.push(`<div style="margin-top:0.3125rem;color:var(--fg4);font-size:0.75rem">
        雨量款未達：${esc(r.rain.area)}${esc(r.rain.kind)}（${r.rain.mm} mm）＜ ${r.rain.label}基準 ${r.rain.thr} mm</div>`);
    }
    const first = r.days[0] || r.rainDays[0];
    return `<div style="padding:0.5rem 0;border-top:1px solid var(--edge)">
      <div><b>${esc(x.name)}</b>
        <em style="font-style:normal;font-size:0.6875rem;color:var(--fg4);margin-left:0.375rem">${
          x.kind === 'place' ? '關注地點' : esc(typeOf(x.type).label)}</em></div>
      ${parts.join('')}
      ${first ? `<div style="font-size:0.6875rem;color:var(--fg4);margin-top:0.25rem">
        ${notifyPhrase(first)}</div>` : ''}
    </div>`;
  }).join('');
  return head + `<div class="card pad" style="margin-bottom:0.75rem">${body}${foot}</div>`;
}

/* 豪大雨特報。放在播報頁 —— 它是寫通報時要抄的材料,
   跟播報稿擺在一起才順手,也不會把颱風卡撐長。
   「大雨」常常一次列十幾個縣市,所以等級標籤固定在左邊、
   地區在右邊自己換行,不要讓長清單把版面推歪。               */
function advisoryCard() {
  if (!ADV.length) return '';
  const colOf = k => (RAIN_LEVELS.find(L => k.includes(L.name)) || { col: 'var(--sb)' }).col;
  const rows = ADV.map(a => {
    const c = colOf(a.kind);
    return `<div style="display:flex;gap:0.5625rem;align-items:flex-start;
       padding:0.5rem 0;border-top:1px solid var(--edge)">
      <b style="color:${c};font-size:0.8125rem;flex:0 0 3.75rem;text-align:center;
        border:1px solid ${c};border-radius:0.25rem;padding:0.125rem 0;
        line-height:1.35">${esc(a.kind)}</b>
      <div style="flex:1 1 auto;min-width:0">
        <div style="font-size:0.8125rem;color:var(--fg2);line-height:1.7">
          ${a.areas.length ? esc(a.areas.join('、')) : '（未列地區）'}</div>
        ${a.end ? `<div style="font-family:var(--mono);font-size:0.6875rem;color:var(--fg4);
          margin-top:0.125rem">有效至 ${fmtShort(a.end)}</div>` : ''}
      </div></div>`;
  }).join('');
  return `<div class="sec"><h2>氣象署特報</h2></div>
    <div class="card pad" style="margin-bottom:0.75rem">${rows}</div>`;
}

/* 站臺最近雨量站的累積雨量。24 小時是特報分級的主要依據,所以擺第一個。 */
function rainCell(st) {
  const rb = nearestRain(st);
  if (!rb) return '<td><span style="color:var(--fg4)">—</span></td>';
  const r = rb.o, L = rainLevel(r);
  const v = n => n == null ? '—' : (n < 10 ? n.toFixed(1) : Math.round(n));
  return `<td><span style="font-family:var(--mono);font-weight:700;color:${L ? L.col : 'var(--fg2)'}">`
    + `${v(r.h24)}</span><span style="font-size:0.6875rem;color:var(--fg4)"> mm/24h</span>`
    + (L ? `<b style="display:block;font-size:0.6875rem;color:${L.col}">${L.name}</b>` : '')
    + (() => { const m = dgpaMark(r.h24, st); return m
        ? `<b style="display:block;font-size:0.6875rem;color:${m.col}">停班課${m.t} ${m.thr}`
          + `${m.official ? '（實測）' : ''}</b>` : ''; })()
    + `<span style="display:block;font-size:0.6875rem;color:var(--fg4)">`
    + `時雨 ${v(r.h1)}　${esc(r.name)} ${Math.round(rb.km)}km</span></td>`;
}

/* ── 時間的講法 ────────────────────────────────────────────
   通報上不會寫「8/24 22:00」,會寫「今日晚間 22:00」——
   值班的人不必自己把日期換算成「那是今天還是明天」。
   當天=今日、隔天=明日、再隔天=後天,第四天起用星期。
   超過一週還講「週三」會分不出是哪一個週三,所以改回日期。   */
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];

function relDay(ts) {
  const a = new Date(); a.setHours(0, 0, 0, 0);
  const b = new Date(ts); b.setHours(0, 0, 0, 0);
  const n = Math.round((b - a) / 86400000);
  if (n === 0) return '今日';
  if (n === 1) return '明日';
  if (n === 2) return '後天';
  if (n >= 3 && n <= 6) return '週' + WEEK[b.getDay()];
  if (n === -1) return '昨日';
  return `${b.getMonth() + 1}/${b.getDate()}`;
}

// 一天之內的時段。22:00 講「晚間」,05:30 講「清晨」。
function dayPart(h) {
  if (h < 5) return '凌晨';
  if (h < 8) return '清晨';
  if (h < 11) return '上午';
  if (h < 13) return '中午';
  if (h < 17) return '午後';
  if (h < 19) return '傍晚';
  if (h < 23) return '晚間';
  return '深夜';
}

// 「今日晚間 22:00」
function fmtWhen(ts) {
  const d = new Date(ts);
  return `${relDay(ts)}${dayPart(d.getHours())} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
}
// 「今日 08:23」——標頭用,不必講時段
function fmtDayTime(ts) {
  const d = new Date(ts);
  return `${relDay(ts)} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
}

/* ── 氣象員播報 ────────────────────────────────────────────
   把距離、方位、強度、侵襲機率、最接近時間、豪大雨特報、
   各站臺實測與衝擊，串成一段可以直接唸、直接抄進通報的話。
   規則：官方數字（侵襲機率、特報、警報單、實測）與本機推估分開講，
   每一句都要說得出來源，不能讓聽的人分不清哪句是氣象署說的。      */
function briefText() {
  const ty = DB.ty.data;
  if (!ty) return '';
  const IN = '　';                       // 全形空格縮排,中文對得齊
  const L = [];
  const bf = ms2bf(ty.vmax);
  const d = Math.round(distToTaiwan(ty.pos));
  const brg = bearing({ lat: 23.7, lng: 121.0 }, ty.pos);

  L.push(`【今日氣象概況與警報】（更新時間：${fmtDayTime(DB.ty.at || Date.now())}）`);

  // ── 颱風動態 ──
  L.push('');
  L.push(`${TC_FULL[tcClass(ty.vmax)] || '熱帶氣旋'} ${ty.name}` +
    `${ty.en && ty.en !== ty.name ? `（${ty.en}）` : ''} 動態`);
  L.push(`${IN}位置風力：臺灣${dirName(brg)}方 ${d} 公里海面，近中心最大風速 ${bfLabel(bf)}。`);
  if (ty.mvSpd) {
    L.push(`${IN}移動方向：向${dirZh(ty.mvDir) || dirName(brg)}移動（時速 ${Math.round(ty.mvSpd)} 公里）。`);
  }
  if (ty.pres) L.push(`${IN}中心氣壓：${Math.round(ty.pres)} 百帕。`);
  if (WARN && WARN.cpa) {
    L.push(`${IN}最接近時間：推估為${fmtWhen(WARN.cpa.t)}（距臺約 ${Math.round(WARN.cpa.d)} 公里）。`
      + (EXTRAP ? '［外推路徑推算，非官方預報］' : ''));
  }
  if (!ty.official) L.push(`${IN}資料來源：GDACS 全球災害警報系統（非官方，僅觀測位置）。`);

  // ── 颱風警報 ──
  const w = DB.ty.warning;
  if (w && w.active) {
    L.push('');
    L.push('颱風警報（中央氣象署發布）');
    L.push(`${IN}${w.isLand ? '陸上颱風警報' : '海上颱風警報'}` +
      `${w.areas && w.areas.length ? `：${w.areas.join('、')}` : ''}`);
  }

  // ── 降雨特報 ──
  if (ADV.length) {
    L.push('');
    L.push('降雨特報分級（中央氣象署發布）');
    for (const a of ADV) {
      L.push(`${IN}${a.kind}：${a.areas.length ? a.areas.join('、') : '（未列地區）'}`);
    }
  }

  /* ── 站臺衝擊 ──
     以前是每一站一句完整敘述,十幾站就是十幾行,而且十幾行講的都是
     「推估不需關機」—— 值班的人要在那面文字裡找出真正會被影響的那幾站。
     改成只列「會被影響的」,並且講的是**時段**而不是每站的流水帳;
     其餘的用一行帶過。要逐站細節的話,衝擊預判那一頁本來就是完整的表。 */
  const withXY = DB.stations.filter(x => IS_LIVE(x) && Number.isFinite(x.lat) && Number.isFinite(x.lng));
  let gaps = [];
  if (SERIES && withXY.length) {
    const rows = withXY.map(x => ({ x, i: stationImpact(SERIES, x, DB.cfg) }))
      .filter(r => r.i).sort((a, b) => b.i.peak.bf - a.i.peak.bf);
    const hit = rows.filter(r => r.i.deadline);
    const miss = rows.filter(r => !r.i.deadline);
    if (rows.length) {
      L.push('');
      L.push(`站臺衝擊（系統推估，關機門檻 ${DB.cfg.bfShut} 級）`);
      if (hit.length) {
        for (const { x, i } of hit) {
          // 不列入回報的類別（中繼站臺）仍然要看,但要看得出來它不會出現在交接通報裡
          L.push(`${IN}${x.name}${inReport(x) ? '' : '（不列入回報）'}：應於${fmtWhen(i.deadline)}前完成關機`
            + `（尖峰 ${i.peak.bf} 級於${fmtWhen(i.peak.t)}`
            + (i.resume ? `，${fmtWhen(i.resume.t)}起可評估復機` : '') + '）。');
        }
      } else {
        L.push(`${IN}全部 ${rows.length} 站推估均未達關機門檻。`);
      }
      if (miss.length && hit.length) {
        const bfs = miss.map(r => r.i.peak.bf);
        const lo = Math.min(...bfs), hi = Math.max(...bfs);
        L.push(`${IN}其餘 ${miss.length} 站推估尖峰 ${lo === hi ? `${lo} 級` : `${lo}–${hi} 級`}，不需關機。`);
      }
      // 尖峰時段:所有站臺尖峰時刻的範圍,一句話講完「什麼時候最不好過」
      const pt = rows.map(r => r.i.peak.t).sort((a, b) => a - b);
      const pk = Math.max(...rows.map(r => r.i.peak.bf));
      L.push(`${IN}影響時段：${fmtWhen(pt[0])}` +
        (pt[pt.length - 1] - pt[0] > 3600000 ? ` 至 ${fmtWhen(pt[pt.length - 1])}` : '') +
        `，全區推估尖峰 ${pk} 級。`);
    }
    gaps = rows.map(({ x, i }) => {
      const ob = nearestObs(x), obf = obsBf(ob);
      return (obf != null && Math.abs(obf - i.now.bf) >= 3)
        ? `${x.name}（推估 ${i.now.bf} 級、實測 ${obf} 級）` : null;
    }).filter(Boolean);
  }

  // ── 停班停課推估 ──
  {
    const tg = [
      ...DB.places.map(x => ({ ...x, kind: 'place' })),
      ...withXY.map(x => ({ ...x, kind: 'st' })),
    ];
    const hits = tg.map(x => ({ x, r: suspendFor(x) }))
      .filter(v => v.r && (v.r.any || (() => { const d = dgpaFor(v.x); return d && d.alert; })()));
    if (hits.length) {
      L.push('');
      L.push('停班停課（官方公告優先，其餘為本機推估）');
      for (const { x, r } of hits) {
        const seg = [];
        // 官方講的話排在最前面 —— 推估說沒事而官方說停班停課時,該相信的是官方
        const d = dgpaFor(x);
        if (d && d.alert) {
          /* 播報稿是要唸、要貼進通報的,十二個鄉全部串成一句話沒有人唸得完。
             列前三個,其餘用數量帶過 —— 完整清單在上面那張卡裡。 */
          const st2 = d.lines.filter(l => l.stop);
          const wide2 = st2.filter(l => l.scope === 'all').map(l => l.txt.replace(/。\s*$/, ''));
          const part2 = st2.filter(l => l.scope !== 'all').map(l => l.txt.replace(/[:：].*$/, ''));
          const detail = wide2.concat(part2.length
            ? [part2.slice(0, 3).join('、') + (part2.length > 3 ? `等 ${part2.length} 個地區` : '')]
            : []).join('；');
          seg.push(`官方公告 ${d.county}${d.full ? '停止上班上課' : '部分地區停止上班上課'}`
            + (detail ? `（${detail}）` : ''));
        } else if (d) {
          seg.push(`官方公告 ${d.county}照常上班上課`);
        }
        if (r.days.length) {
          seg.push(`風力款 ${r.days.map(d => `${dayPhrase(d)} ${fmtClock(d.from)}–${fmtClock(d.to)}`).join('、')}`
            + `（尖峰 ${Math.max(...r.days.map(d => d.peakBf))} 級）`);
        }
        if (r.rain && r.rain.meets) {
          seg.push(`雨量款 ${r.rainDays.length ? r.rainDays.map(rainDayPhrase).join('、') : '特報生效中'}`
            + `（氣象署${r.rain.area}${r.rain.kind}，預測 24 小時 ≥ ${r.rain.mm} 毫米，`
            + `達${r.rain.label}基準 ${r.rain.thr} 毫米）`);
        }
        L.push(`${IN}${x.name}：${seg.join('；')}。`);
      }
      const f = hits[0].r.days[0] || hits[0].r.rainDays[0];
      if (f) L.push(`${IN}${notifyPhrase(f)}。`);
      L.push(`${IN}※ 依《天然災害停止上班及上課作業辦法》兩款：風力為平均風 ${SUSP_BF_MEAN} 級以上`
        + `或陣風 ${SUSP_BF_GUST} 級以上（此處由預報路徑逐時推算，陣風以持續風 ${GUST_FACTOR} 倍估算）；`
        + `雨量為 24 小時累積雨量「預測」達平地 ${DGPA_FLAT}、山區 ${DGPA_HILL} 毫米`
        + '（此處改看氣象署豪大雨特報等級，特報本身即預測性質、門檻同一口徑，但它是分級不是逐點預測值）。'
        + '達到基準不等於一定放假——還要已致災或有致災之虞，且由地方政府綜合研判宣布，'
        + '請以人事行政總處公告為準。');
    }
  }

  // ── 雨量實測 ──
  let anyDgpa = false;
  /* 只列「豪雨等級以上或已達停班停課基準」的那幾站 —— 大雨等級一次列七八站,
     那幾行沒有一行會改變任何決定。其餘的用一行帶過。 */
  const rall = withXY.map(x => {
    const rb = nearestRain(x);
    const lv = rb && rainLevel(rb.o);
    if (!lv) return null;
    const m = dgpaMark(rb.o.h24, x);
    if (m) anyDgpa = true;
    return { x, rb, lv, m, key: RAIN_LEVELS.findIndex(L2 => L2.name === lv.name) };
  }).filter(Boolean);
  const rTop = rall.filter(r => r.m || r.key < RAIN_LEVELS.length - 1);   // 非「大雨」即入列
  const rains = rTop.map(({ x, rb, lv, m }) =>
    `${IN}${x.name}：鄰近${rb.o.name}站 24 小時累積 ${Math.round(rb.o.h24)} 毫米`
      + `（${lv.name}等級${m ? `，已達停班停課雨量參考基準之${m.label}基準 ${m.thr} 毫米` : ''}）。`);
  const rRest = rall.length - rTop.length;
  if (rRest > 0) rains.push(`${IN}其餘 ${rRest} 站為大雨等級。`);
  if (rains.length) {
    L.push(''); L.push('雨量實測（自動雨量站）'); L.push(...rains);
    if (anyDgpa) {
      L.push(`${IN}※ 停班停課基準為未來 24 小時累積雨量「預測」達山區 ${DGPA_HILL} 毫米、`
        + `平地 ${DGPA_FLAT} 毫米（各站依其所在地形取一個基準），`
        + '且已致災或有致災之虞，由地方政府研判宣布；'
        + '上列為雨量站實測累積，達標不等於已宣布停班停課，請以人事行政總處公告為準。');
    }
  }

  // ── 注意事項 ──
  L.push('');
  if (gaps.length) {
    L.push(`注意：${gaps.join('、')}實測與推估相差三級以上，代表模型在該地形不可靠，`
      + '請以現場實測為準，勿逕依系統時間執行關機。');
  }
  L.push('注意事項：警報資料來自氣象署官方發布；系統推估時間與距離僅供參考，'
    + '最新動態請依中央氣象署為準。');
  return L.join('\n');
}

/* 播報稿的上色。
   整段同一個灰色時,要在裡面找出「幾點該關機」得逐字讀。
   上色的對象只有三種:**會改變決定的數字**（風級、雨量等級、時刻）、
   **動作**（關機、停班停課）、以及**但書**（推估、非公告）。
   其餘一律不動 —— 每個字都是重點就等於沒有重點。

   注意這是先 esc 再上色,所以比對的是已經跳脫過的字串;
   複製出去的仍然是 briefText() 的純文字,不含任何標記。            */
function briefHtml(txt) {
  const wrap = (v, col, bold) =>
    `<span style="color:${col}${bold ? ';font-weight:700' : ''}">${v}</span>`;
  const rainRe = new RegExp('(' + RAIN_LEVELS.map(x => x.name).join('|') + ')', 'g');

  /* 一行一行處理。整段一起 replace 的話,但書那幾行會被前面的規則
     先塗上紅色與粗體,再被但書規則包一層灰 —— 內層贏,結果但書比正文還醒目。
     但書就是要安靜,所以碰到但書行直接整行壓暗,不再套其他規則。 */
  return txt.split('\n').map(raw => {
    const line = esc(raw);
    if (!line) return '';
    if (/^　?(※|注意事項：|注意：)/.test(raw)) {
      return `<span style="color:var(--fg4)">${line}</span>`;
    }
    let h = line;
    // 風級 → 用蒲福風級本來的色階,跟畫面上的徽章對得起來
    h = h.replace(/(\d{1,2})\s*級/g, (m0, n) => wrap(m0, bfColor(+n), +n >= 8));
    /* 雨量等級必須一次掃完 —— 逐個等級各掃一遍的話,「超大豪雨」上色之後
       下一輪的「大豪雨」會再命中它裡面那三個字,顏色會從中間裂開。
       RAIN_LEVELS 由重到輕排,交替式會先吃長的那個。 */
    h = h.replace(rainRe, m0 => wrap(m0, (RAIN_LEVELS.find(x => x.name === m0) || {}).col || 'var(--sb)', true));
    // 時刻
    h = h.replace(/(今日|明日|後天|昨日|週[日一二三四五六]|\d{1,2}\/\d{1,2})?\s*(凌晨|清晨|上午|中午|午後|傍晚|晚間|深夜)?\s*(\d{1,2}:\d{2})/g,
      m0 => wrap(m0, 'var(--acc)', true));
    // 要動作的事
    h = h.replace(/(應於|前完成關機|完成關機|立即關機|停班停課|停止上班上課|陸上颱風警報|海上颱風警報)/g,
      m0 => wrap(m0, 'var(--no)', true));
    h = h.replace(/(可評估復機|不需關機|未達關機門檻)/g, m0 => wrap(m0, 'var(--ok)', true));
    h = h.replace(/(本機推估，非公告|系統推估|推估)/g, m0 => wrap(m0, 'var(--fg4)'));
    // 段落標題（不以全形空格起首的那幾行）
    if (raw.startsWith('【')) return `<b style="color:var(--acc);font-size:0.9375rem">${h}</b>`;
    if (!raw.startsWith('　')) return `<b style="color:var(--fg);letter-spacing:.04em">${h}</b>`;
    return h;
  }).join('\n');
}

function briefCard() {
  const txt = briefText();
  if (!txt) return '';
  return `<div class="sec"><h2>氣象員播報</h2>
    <button class="act" onclick="copyBrief()">複製</button></div>
   <div class="card pad" style="margin-bottom:0.75rem">
     <div id="briefTxt" style="white-space:pre-wrap;line-height:1.85;font-size:0.875rem;
       color:var(--fg2)">${briefHtml(txt)}</div>
   </div>`;
}

function copyBrief() {
  const txt = briefText();
  if (!txt) return;
  const done = () => toast('已複製播報稿');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt, done));
  } else fallbackCopy(txt, done);
}

function fallbackCopy(txt, done) {
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast('複製失敗，請長按選取'); }
  document.body.removeChild(ta);
}

function clearTyPanes() {
  ['tyPick', 'tyTl', 'tyImpact', 'tyFc', 'tyBrief'].forEach(id => {
    const el = document.getElementById(id); if (el) el.innerHTML = '';
  });
}

/* 雙颱（含以上）時的選擇列。只有一顆就不顯示，免得多佔一行版面。 */
function typhoonPicker() {
  const list = DB.ty.list || [];
  if (list.length < 2) return '';
  const cur = tyKey(DB.ty.data);
  const chips = list.map(t => {
    const k = tyKey(t), bf = ms2bf(t.vmax), d = Math.round(distToTaiwan(t.pos));
    return `<button class="ty-chip${k === cur ? ' on' : ''}" onclick="pickTyphoon('${esc(k)}')">
      <i style="background:${bfColor(bf)}"></i>
      <span class="tc-b"><span class="tc-n">${esc(t.name)}</span>
      <span class="tc-d">${tcClass(t.vmax)} ${bf} 級 · ${d} km</span></span></button>`;
  }).join('');
  return `<div class="ty-pick">
    <div class="tp-h">${list.length} 個熱帶氣旋活動中，點選要推算的那一顆</div>
    <div class="tp-r">${chips}</div></div>`;
}

function warningCard() {
  if (!WARN) return `<div class="msg w">目前來源沒有官方預報路徑，無法推算警報時機。到設定填入中央氣象署授權碼即可啟用。</div>`;

  /* 熱帶性低氣壓不會有颱風警報 —— 氣象署的颱風警報只發給
     近中心最大風達八級（17.2 m/s）以上的系統。
     這裡不能拿它去套海警／陸警的推算,否則會端出一個
     「預估發布陸上颱風警報」這種根本不會發生的結論。      */
  if (!WARN.isTy) {
    const ty0 = DB.ty.data;
    const cpa = WARN.cpa
      ? `<div class="warnrow"><div class="wi" style="background:#EF5B4C22;color:#EF5B4C">🎯</div>
         <div class="wt"><b>中心最接近</b><small>距臺灣最近約 ${Math.round(WARN.cpa.d)} 公里</small></div>
         <div class="wv" style="color:#EF5B4C">${fmtWhen(WARN.cpa.t)}
         <br><span style="color:var(--fg4);font-weight:400">${fmtShort(WARN.cpa.t)}　${relative(WARN.cpa.t)}</span></div></div>`
      : '';
    return `<div class="sec"><h2>警報時機預判</h2></div>
      <div class="msg i" style="margin-bottom:0.75rem">
        目前是<b>${TC_FULL[tcClass(ty0 ? ty0.vmax : 0)] || '熱帶性低氣壓'}</b>
        （近中心最大風 ${bfLabel(ms2bf(ty0 ? ty0.vmax : 0))}），
        <b>不會發布颱風警報</b> —— 中央氣象署的海上／陸上颱風警報，
        只發給近中心最大風達 8 級（17.2 m/s）以上的颱風。
        這類系統氣象署改以<b>豪大雨特報、強風特報</b>因應，請看播報頁的特報清單。
        若後續增強為颱風，這裡就會出現警報時機推算。</div>
      ${cpa ? `<div class="card" style="margin-bottom:0.75rem">${cpa}</div>` : ''}`;
  }
  // 外推來的時機和官方預報算出來的時機,風險完全不同,不能長得一樣。
  const exNote = EXTRAP ? `<div class="msg w" style="margin-bottom:0.5rem">
    以下時機是由<b>外推路徑</b>推算的，不是根據中央氣象署的預報路徑。
    只能當作粗略參考，不建議直接拿來排關機時程。</div>` : '';
  const row = (icon, col, title, sub, val) =>
    `<div class="warnrow"><div class="wi" style="background:${col}22;color:${col}">${icon}</div>
     <div class="wt"><b>${title}</b><small>${sub}</small></div><div class="wv" style="color:${col}">${val}</div></div>`;
  // 「8/27 01:00 · 3.8 天後」要自己換算成星期幾;「週三凌晨 01:00」不用。
  const two = (t, tag) => `${tag ? tag + '<br>' : ''}${fmtWhen(t)}`
    + `<br><span style="color:var(--fg4);font-weight:400">${fmtShort(t)}　${relative(t)}</span>`;

  // 依目前處於哪個階段，講當下最該知道的那一件事
  const state = w => {
    if (!w) return { sub: '暴風範圍預估不會觸及', val: '<span style="color:var(--fg4)">預估不發布</span>' };
    if (w.phase === 'pending') return { sub: '預估發布時機', val: two(w.issue) };
    if (w.phase === 'issued') return { sub: '已達發布時機，暴風範圍尚未觸及', val: two(w.affect, '預估開始影響') };
    if (w.phase === 'active') return { sub: '暴風範圍影響中', val: two(w.clear, '預估脫離') };
    return { sub: '暴風範圍已脫離', val: '<span style="color:var(--fg4)">預估可解除</span>' };
  };
  const s = state(WARN.sea), l = state(WARN.land);
  /* 沒有資料的列就不要擺出來。四列裡三列寫著「預估不發布」「—」,
     等於用整張卡講一句「不會有事」—— 那一句話寫成一行就好。 */
  const noWarn = !WARN.sea && !WARN.land;
  const rows = [];
  if (!noWarn) {
    rows.push(row('🌊', '#54C7EA', '海上颱風警報', s.sub, s.val));
    rows.push(row('🏝', '#EFAA35', '陸上颱風警報', l.sub, l.val));
  }
  if (WARN.cpa) {
    rows.push(row('🎯', '#EF5B4C', '中心最接近',
      `距臺灣最近約 ${Math.round(WARN.cpa.d)} 公里`, two(WARN.cpa.t)));
  }
  if (WARN.sea) {
    rows.push(row('✅', '#3ECB92', '預估解除警報', '暴風範圍完全脫離近海之後', two(WARN.sea.clear)));
  }
  if (!rows.length) return '';
  let html = `<div class="sec"><h2>警報時機預判${EXTRAP ? '（由外推路徑推算）' : ''}</h2></div>` + exNote;
  if (noWarn) {
    html += `<div class="msg i" style="margin-bottom:0.5rem">暴風範圍預估不會觸及臺灣近海，
      <b>推估不會發布海上或陸上颱風警報</b>。</div>`;
  }
  html += '<div class="card" style="margin-bottom:0.75rem">' + rows.join('') + '</div>';
  if (!noWarn) {
    html += `<p class="hint" style="margin-bottom:0.875rem">依氣象署慣例推算（海警：暴風範圍及岸外 ${DB.cfg.seaBuffer} km 前 24 小時；陸警：及陸前 18 小時）。實際發布時間由氣象署決定，此處供先期排程參考。</p>`;
  }
  return html;
}

/* ── 時間軸 ────────────────────────────────────────────────
   逐時內插序列本來就算好了,只差一個介面。
   排班的人最想知道的是「我交接的那個時刻,各站臺是幾級風」,
   拖到那一格看一眼就有答案,不必自己從尖峰時間反推。            */
let TCUR = 0, TMARK = null;

function timelineCard() {
  if (!SERIES || SERIES.length < 2) return '';
  const max = SERIES.length - 1;
  if (TCUR > max) TCUR = 0;
  return `<div class="sec"><h2>時間軸${EXTRAP ? '（外推推估）' : ''}</h2></div>
  <div class="card pad" style="margin-bottom:0.75rem">
    <input class="tl-r" type="range" id="tlR" min="0" max="${max}" step="1" value="${TCUR}"
      oninput="onTimeline(this.value)" aria-label="預報時刻">
    <div id="tlOut">${timelineOut()}</div>
    <span class="sub" style="display:block;margin-top:0.375rem">
      拖到交接時刻，看那時各站臺幾級風。${EXTRAP ? '外推推估，越遠越不可信。' : ''}</span>
  </div>`;
}

function timelineOut() {
  if (!SERIES || !SERIES[TCUR]) return '';
  const s = SERIES[TCUR], bf = ms2bf(s.vmax), d = Math.round(distToTaiwan(s.pos));
  // 真實時刻放最大 —— 拖到某一格時,要的答案是「幾點」而不是「第幾小時」。
  const head = `<div style="display:flex;align-items:baseline;gap:0.5rem;flex-wrap:wrap;margin:0.5rem 0">
    <b style="font-size:1.0625rem;color:var(--fg)">${TCUR === 0 ? '現在' : fmtWhen(s.t)}</b>
    <span style="font-family:var(--mono);font-size:0.8125rem;color:var(--acc)">${TCUR === 0
      ? fmtShort(s.t) : '+' + s.h + ' 小時後'}</span>
    <span class="pill" style="background:${bfColor(bf)}">${bf} 級</span>
    <span style="font-size:0.8125rem;color:var(--fg3)">距臺灣 ${d} km</span></div>`;

  const withXY = DB.stations.filter(x => Number.isFinite(x.lat) && Number.isFinite(x.lng));
  if (!withXY.length) return head;
  const rows = withXY
    .map(x => ({ name: x.name, bf: windAt(s, { lat: x.lat, lng: x.lng }).bf }))
    .sort((a, b) => b.bf - a.bf);
  return head + '<div style="display:flex;flex-wrap:wrap;gap:0.375rem">'
    + rows.map(r => `<div class="tl-st">
        <span class="pill" style="background:${bfColor(r.bf)}">${r.bf}</span>
        <span>${esc(r.name)}</span></div>`).join('')
    + '</div>';
}

function onTimeline(v) {
  const max = SERIES ? SERIES.length - 1 : 0;
  TCUR = clamp(parseInt(v, 10) || 0, 0, max);
  // 滑桿自己拖的時候值已經對了,但從別處呼叫時要把把手一起移過去,
  // 否則畫面顯示 +18h、滑桿卻停在最左邊,兩者對不起來。
  const r = document.getElementById('tlR');
  if (r && String(TCUR) !== r.value) r.value = String(TCUR);
  const out = document.getElementById('tlOut');
  if (out) out.innerHTML = timelineOut();
  drawTimeMarker();
}

/* 地圖上的時刻標記。放在自己的圖層,重畫主圖時不會互相蓋掉。
   拖到 0（現在）就撤掉,免得跟主標記重疊看不清楚。               */
function drawTimeMarker() {
  if (typeof L === 'undefined' || !MAP || !SERIES) return;
  if (TMARK) { MAP.removeLayer(TMARK); TMARK = null; }
  if (!TCUR || !SERIES[TCUR]) return;
  const s = SERIES[TCUR];
  TMARK = L.layerGroup().addTo(MAP);
  L.circle([s.pos.lat, s.pos.lng], {
    radius: Math.max(s.r15, 0) * 1000, color: '#FFFFFF', weight: 1.2,
    dashArray: '4,4', fill: false, opacity: .65,
  }).addTo(TMARK);
  L.circleMarker([s.pos.lat, s.pos.lng], {
    radius: 6, color: '#FFFFFF', weight: 2,
    fillColor: bfColor(ms2bf(s.vmax)), fillOpacity: 1,
  }).bindTooltip(`+${s.h}h　${fmtShort(s.t)}　${bfLabel(ms2bf(s.vmax))}`).addTo(TMARK);
  // 拖到的那個時刻也標出來,白框紅底,跟預報點的藍標籤分得開
  L.marker([s.pos.lat, s.pos.lng], {
    icon: tyTag(`${fmtShort(s.t)}<br>+${s.h}h`, 'now', -6), zIndexOffset: 1400,
  }).addTo(TMARK);
}

/* 地圖圖例。顏色多了之後（紅=選中、琥珀=其他颱風、青=預報、虛線=近海界線）,
   不講一下沒人知道那條淡青虛線是什麼。 */
function mapLegend() {
  const seaKm = Number.isFinite(DB.cfg.seaBuffer) ? DB.cfg.seaBuffer : 100;
  const dot = (c, t) => `<span style="display:inline-flex;align-items:center;gap:0.25rem">
    <i style="width:0.625rem;height:0.625rem;border-radius:50%;background:${c};
      display:inline-block;flex:0 0 auto"></i>${t}</span>`;
  return `<p class="hint" style="display:flex;flex-wrap:wrap;gap:0.5rem 0.875rem;
    margin:0.375rem 0 0.875rem">
    ${dot('#EF5B4C', '選中的颱風')}${dot('#EFAA35', '其他颱風（點可切換）')}
    ${dot(EXTRAP ? '#EFAA35' : '#54C7EA', EXTRAP ? '外推路徑' : '官方預報路徑')}
    <span style="display:inline-flex;align-items:center;gap:0.25rem">
      <i style="width:1.125rem;height:0;border-top:1.5px dashed #54C7EA;
        display:inline-block;flex:0 0 auto"></i>近海 ${seaKm} km（海警門檻）</span>
  </p>
  <p class="hint" style="display:flex;flex-wrap:wrap;gap:0.5rem 0.875rem;margin:0 0 0.875rem">
    <b style="color:var(--fg3)">站臺</b>
    ${dot('var(--ok)', '開機')}${dot('var(--sb)', '待機')}${dot('var(--no)', '關機')}
    <span style="display:inline-flex;align-items:center;gap:0.25rem">
      <i style="width:0.625rem;height:0.625rem;border-radius:50%;border:1.5px dashed var(--fg4);
        display:inline-block;flex:0 0 auto"></i>未建置</span>
    ${dot('var(--acc)', '★ 關注地點')}
    <span style="color:var(--fg4)">符號為類別，右上角可逐類開關圖層</span>
  </p>`;
}

function renderImpact() {
  const tl = $('#tyTl');
  if (tl) tl.innerHTML = (SERIES ? mapLegend() : '') + (SERIES ? timelineCard() : '');
  const box = $('#tyImpact');
  if (!SERIES) { box.innerHTML = ''; return; }
  const withXY = DB.stations.filter(s => IS_LIVE(s) && Number.isFinite(s.lat) && Number.isFinite(s.lng));
  if (!withXY.length) {
    box.innerHTML = `<div class="sec"><h2>站臺衝擊預判</h2></div>
      <div class="msg i">尚無站臺填寫座標。到設定或站臺編輯中填入座標後，這裡會逐站列出目前風級、尖峰風級、應完成關機時間與預估可復機時間。座標支援度分秒、十進位、海圖式等多種寫法。</div>`;
    return;
  }
  const rows = withXY.map(s => ({ s, i: stationImpact(SERIES, s, DB.cfg) }))
    .sort((a, b) => (b.i.peak.bf - a.i.peak.bf) || (a.i.km - b.i.km));
  box.innerHTML = `<div class="sec"><h2>站臺衝擊預判</h2></div>
  <div class="card" style="padding:0.25rem 0.625rem;margin-bottom:0.375rem;overflow-x:auto">
   <table class="impact wide"><tr>
     <th>站臺</th><th>目前推估</th><th>實測</th><th>雨量</th><th>尖峰</th><th>應完成關機</th><th>預估可復機</th></tr>
   ${rows.map(({ s, i }) => `<tr>
     <td class="nm">${esc(s.name)}<br><span style="font-family:var(--mono);font-size:0.6875rem;color:var(--fg4)">${i.km} km</span></td>
     <td><span class="pill" style="background:${bfColor(i.now.bf)}">${i.now.bf}</span></td>
     ${obsCell(s, i.now.bf)}
     ${rainCell(s)}
     <td><span class="pill" style="background:${bfColor(i.peak.bf)}">${i.peak.bf}</span><br>
         <span style="font-size:0.6875rem;color:var(--fg4)">${fmtShort(i.peak.t)}</span></td>
     <td>${i.deadline ? fmtShort(i.deadline) : '<span style="color:var(--fg4)">不需關機</span>'}</td>
     <td>${i.resume ? fmtShort(i.resume.t) : '<span style="color:var(--fg4)">—</span>'}</td>
   </tr>`).join('')}</table></div>
  <p class="hint" style="margin-bottom:0.875rem">
    <b>推估</b>為渦旋模型算的海面持續風，未計入地形；<b>實測</b>為最近測站實際量到的地面風。
    ${obsHint()} ${rainHint()}
    門檻：關機 ${DB.cfg.bfShut} 級、緊急 ${DB.cfg.bfEmerg} 級、可復機 ${DB.cfg.bfResume} 級以下，預留 ${DB.cfg.leadMin} 分鐘（可於設定調整）。</p>`;
}

/* 衝擊表的「實測」欄。
   實測與推估差 3 級以上就標出來 —— 那不是小數點的差別,
   而是「模型在這個地形下算不準」的訊號,值班的人必須自己判斷,
   不能照著程式給的時間關機。差 1、2 級屬正常(海面風 vs 地面風)。 */
/* 實測欄。
   「差 N 級」以前講的是「實測跟推估差多少」—— 那是模型準不準,值班的人幫不上忙。
   改成講**距離關機門檻還差幾級**:那才是要做決定的那個數字
   （「還差 4 級」＝還很遠;「已達門檻」＝現在就該關）。
   模型與實測差三級以上仍然要講,但降成一個小記號,因為它的意思是
   「這一站的推估時間不可信,以現場為準」,不是一個要立刻動作的數字。 */
function obsCell(st, estBf) {
  const ob = nearestObs(st), bf = obsBf(ob);
  if (bf == null) {
    return '<td><span style="color:var(--fg4)">—</span></td>';
  }
  const shut = DB.cfg.bfShut;
  const toShut = shut - bf;
  const line = toShut <= 0
    ? `<b style="display:block;font-size:0.6875rem;color:var(--no)">已達關機門檻 ${shut} 級</b>`
    : `<b style="display:block;font-size:0.6875rem;color:${toShut <= 2 ? 'var(--sb)' : 'var(--fg3)'}">`
      + `距關機門檻 ${toShut} 級</b>`;
  const est = Math.abs(bf - estBf) >= 3
    ? `<span style="display:block;font-size:0.6875rem;color:var(--sb)" title="模型在此地形不可信，以現場為準">`
      + `推估差 ${Math.abs(bf - estBf)} 級</span>` : '';
  return `<td><span class="pill" style="background:${bfColor(bf)}">${bf}</span>`
    + line + est
    + `<span style="display:block;font-size:0.6875rem;color:var(--fg4)">`
    + `${esc(ob.o.name)} ${Math.round(ob.km)}km</span></td>`;
}

function rainHint() {
  if (!RAIN.length) return '';
  return `雨量取最近雨量站（${RAIN.length} 站），分級依氣象署標準。`
    + '<b>關機門檻只看風，雨量供研判道路與積水風險。</b>'
    + '停班停課基準依《天然災害停止上班及上課作業辦法》第四條附表逐縣市認定'
    + `（多數縣市 ${DGPA_FLAT} mm，山區縣市山區 ${DGPA_HILL} mm，連江縣 200 mm）；`
    + '<b>附表的值是「未來 24 小時累積雨量預測」，此處為雨量站「實測」累積 ——'
    + '只有南投平地 300、宜蘭 250、連江 180 這三個縣訂了實際觀測基準，實測達標才是官方依據，'
    + '其餘縣市拿實測去比只是參考。達標仍須地方政府依致災情形研判。</b>';
}

function obsHint() {
  if (!OBS.length) return '目前沒有觀測資料，實測欄為 —。';
  return `取 ${OBS_MAX_KM} km 內最近測站（${OBS.length} 站，${OBS_AT ? fmtShort(OBS_AT) : '—'}）。`
    + `<b>「距關機門檻 N 級」是實測風力離建議關機門檻（${DB.cfg.bfShut} 級）還差幾級</b>，`
    + '這是要做決定的那個數字。'
    + '<b style="color:var(--sb)">另標「推估差 N 級」時代表模型與實測差三級以上，'
    + '該站的推估時間不可信，請以現場為準。</b>';
}

function renderForecast() {
  const box = $('#tyFc');
  const ty = DB.ty.data;
  if (!ty || !TRACK.length) { box.innerHTML = ''; return; }
  box.innerHTML = `<div class="sec"><h2>${EXTRAP ? '外推路徑（非官方預報）' : '路徑潛勢預報'}</h2></div>
  ${EXTRAP ? `<div class="msg w" style="margin-bottom:0.5rem">
    <b>以下不是中央氣象署的預報路徑。</b>目前來源只有分析位置，沒有官方預報，
    這張表是假設它<b>照現在的方向（${esc(dirName(motionOf(ty) ? motionOf(ty).brg : 0))}）
    與速度（${Math.round(ty.mvSpd)} km/h）直線前進</b>算出來的，強度沿用現值、不預測增強減弱。
    颱風不會這樣走，時距越遠誤差越大。請以中央氣象署發布的警報單為準。</div>` : ''}
  <div class="card" style="padding:0.25rem 0.625rem;overflow-x:auto"><table class="impact">
    <tr><th>時刻</th><th>中心位置</th><th>近中心風</th><th>距臺灣</th><th>${EXTRAP ? '性質' : '70%機率半徑'}</th></tr>
    ${TRACK.map(f => {
      const bf = ms2bf(f.vmax), d = Math.round(distToTaiwan(f.pos));
      // 幾點鐘擺前面、時距擺後面 —— 排班要的是「幾點」,不必自己加減。
      return `<tr><td><b style="color:var(--fg)">${fmtShort(ty.t0 + f.tau * 3600000)}</b>
        <br><span style="color:var(--acc);font-size:0.6875rem">+${f.tau}h</span></td>
        <td>${f.pos.lat.toFixed(1)}N ${f.pos.lng.toFixed(1)}E</td>
        <td><span class="pill" style="background:${bfColor(bf)}">${bf} 級</span></td>
        <td>${d} km</td><td>${EXTRAP ? '<span style="color:var(--sb)">外推</span>' : (f.r70 ? f.r70 + ' km' : '—')}</td></tr>`;
    }).join('')}</table></div>`;
}

/* ── 底圖 ────────────────────────────────────────────────
   預設彩色衛星影像：看得出海陸、地形與雲下的島嶼位置，
   判斷颱風離哪個岸段近時比灰階底圖直觀得多。
   另外保留彩色街道圖與暗色圖 —— 暗色在夜間值班的機房裡比較不刺眼，
   要用的人自己切，選擇會記住。                                        */
const BASEMAPS = {
  sat: {
    label: '衛星影像',
    url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    attr: 'Esri, Maxar, Earthstar Geographics',
    max: 12,
    // 衛星影像沒有地名,疊一層邊界與地名才知道打到哪裡
    over: 'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
  },
  street: {
    label: '彩色地圖',
    url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    attr: '&copy; OpenStreetMap 貢獻者',
    max: 12,
  },
  dark: {
    label: '暗色地圖',
    url: 'https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
    attr: '&copy; OpenStreetMap 貢獻者, &copy; CARTO',
    max: 12,
  },
};
const BASEMAP_KEY = 'galepost.ui.basemap';

let BASELAYERS = null;
function initBasemaps(map) {
  let saved = 'sat';
  try { saved = localStorage.getItem(BASEMAP_KEY) || 'sat'; } catch (e) {}
  if (!BASEMAPS[saved]) saved = 'sat';

  const layers = {};
  for (const [k, b] of Object.entries(BASEMAPS)) {
    const base = L.tileLayer(b.url, { maxZoom: b.max, attribution: b.attr });
    layers[b.label] = b.over
      ? L.layerGroup([base, L.tileLayer(b.over, { maxZoom: b.max })])
      : base;
    layers[b.label]._gpKey = k;
  }
  layers[BASEMAPS[saved].label].addTo(map);
  /* 底圖與站臺圖層共用同一個控制項。分成兩個的話右上角會出現兩疊一樣的圖示,
     使用者要猜哪一個是哪一個。 */
  BASELAYERS = layers;
  map.on('baselayerchange', e => {
    try { localStorage.setItem(BASEMAP_KEY, e.layer._gpKey || 'sat'); } catch (err) {}
  });
}

/* ── 地圖上的站臺 ────────────────────────────────────────
   使用者要的是「臺灣地圖上看得到我的雷達站、紅外線，關機的用灰色」。
   顏色 = 狀態（開機綠／待機琥珀／關機紅／未建置虛線灰）,
   符號 = 類別（可在設備類別裡自己改一個字或 emoji）。
   每個類別自成一個圖層,右上角的圖層控制可以逐類開關 ——
   十幾個點擠在西海岸,不能逐類關掉的話什麼都看不清楚。       */
const TYPE_ICON_DEFAULT = '◉';
function typeIcon(t) {
  if (t && t.icon) return t.icon;
  const n = (t && (t.label + t.report)) || '';
  if (/紅外線|熱影像/.test(n)) return '🔺';
  if (/中繼/.test(n)) return '📡';
  if (/雷達/.test(n)) return '◎';
  return TYPE_ICON_DEFAULT;
}
const stPin = (s, t) => L.divIcon({
  className: '', iconSize: [22, 22], iconAnchor: [11, 11],
  html: `<div class="st-pin${s.status === 'plan' ? ' plan' : ''}" style="color:${S_COL[s.status]}"><i>${typeIcon(t)}</i></div>`,
});
// 標籤要落在圖標下方,不能壓在圖標上 —— 圖標高 22px,中心錨定,
// 所以下緣在 +11,標籤從 +14 開始才不會被蓋住。
const stTag = name => L.divIcon({
  className: '', iconSize: [110, 14], iconAnchor: [55, -14],
  html: `<div class="st-lb">${esc(name)}</div>`,
});

let STLAYERS = null, STCTRL = null;
let MYPTS = [];                          // 自己的點（站臺＋關注地點）,對焦用
const MAPFOCUS_KEY = 'galepost.ui.mapfocus';
let MAPFOCUS = (() => { try { return localStorage.getItem(MAPFOCUS_KEY) || 'all'; } catch (e) { return 'all'; } })();
function drawStations(pts) {
  MYPTS = [];
  /* 舊圖層一定要從地圖上移掉。只把變數設成 null 會讓上一輪的標記留在圖上,
     每重畫一次多疊一層 —— 時刻標記那裡踩過同一個坑。 */
  if (STLAYERS) { for (const g of Object.values(STLAYERS)) MAP.removeLayer(g); }
  STLAYERS = {};
  for (const t of DB.types) {
    const has = DB.stations.some(x => x.type === t.id && Number.isFinite(x.lat));
    if (!has) continue;
    STLAYERS[t.id] = L.layerGroup().addTo(MAP);
  }
  if (DB.places.length) STLAYERS._pl = L.layerGroup().addTo(MAP);

  DB.stations.forEach(s => {
    if (!Number.isFinite(s.lat) || !Number.isFinite(s.lng)) return;
    const g = STLAYERS[s.type]; if (!g) return;
    const t = typeOf(s.type);
    const imp = SERIES && IS_LIVE(s) ? stationImpact(SERIES, s, DB.cfg) : null;
    L.marker([s.lat, s.lng], { icon: stPin(s, t), zIndexOffset: 800 })
      .bindTooltip(`${s.name}　${S_STATE[s.status]}` +
        (imp ? `　推估 ${bfLabel(imp.now.bf)}` : '') + `　${t.label}`)
      .on('click', () => openStation(s.id))
      .addTo(g);
    /* 名稱標籤交給疏化機制。十幾個站臺擠在西海岸,縮小的時候標籤會疊成一團 ——
       疊在一起等於全部看不見,不如讓它自己在放大之後才長回來。 */
    FCLABELS.push(L.marker([s.lat, s.lng],
      { icon: stTag(s.name), zIndexOffset: 790, interactive: false }).addTo(g));
    pts.push([s.lat, s.lng]); MYPTS.push([s.lat, s.lng]);
  });

  DB.places.forEach(x => {
    if (!Number.isFinite(x.lat)) return;
    L.marker([x.lat, x.lng], {
      icon: L.divIcon({ className: '', iconSize: [22, 22], iconAnchor: [11, 11],
        html: '<div class="st-pin" style="color:var(--acc)"><i>★</i></div>' }),
      zIndexOffset: 810,
    }).bindTooltip(`${x.name}　關注地點`).on('click', () => openPlace(x.id)).addTo(STLAYERS._pl);
    FCLABELS.push(L.marker([x.lat, x.lng],
      { icon: stTag(x.name), zIndexOffset: 800, interactive: false }).addTo(STLAYERS._pl));
    pts.push([x.lat, x.lng]); MYPTS.push([x.lat, x.lng]);
  });

  /* 圖層控制每次重畫都要換掉 —— 類別可能被改名、新增或刪除,
     沿用舊的控制項會指向已經從地圖上移除的圖層。 */
  if (STCTRL) { MAP.removeControl(STCTRL); STCTRL = null; }
  const ov = {};
  for (const [k, g] of Object.entries(STLAYERS)) {
    ov[k === '_pl' ? '★ 關注地點' : `${typeIcon(typeOf(k))} ${typeOf(k).label}`] = g;
  }
  STCTRL = L.control.layers(BASELAYERS, Object.keys(ov).length ? ov : null,
    { position: 'topright', collapsed: true }).addTo(MAP);
}

/* 颱風符號（會轉的 🌀）與常駐標籤。
   做法取自使用者另一支程式 ARGUS —— 四顆颱風同圖時，
   靠 tooltip 認不出來，名稱與時間要直接畫在圖上。          */
const tyEye = sel => L.divIcon({
  className: '', iconSize: [34, 34], iconAnchor: [17, 17],
  html: `<div class="ty-eye${sel ? '' : ' sec'}">🌀</div>`,
});

// 標籤寬度隨字數變,外面包一層 flex 置中,長短名稱都對得準中心點。
/* 預報點標籤在縮小時會擠成一團,疊在一起等於全部看不見。
   依螢幕距離疏化:離已保留的標籤太近就藏起來,放大之後自然再出現。
   颱風名稱標籤永遠保留 —— 那是最該看見的東西,先佔位。      */
let FCLABELS = [], ANCHORS = [];
const LABEL_MIN_X = 52, LABEL_MIN_Y = 26;

function declutterLabels() {
  if (!MAP) return;
  const kept = [];
  for (const m of ANCHORS) {
    if (!m.getElement()) continue;
    kept.push(MAP.latLngToContainerPoint(m.getLatLng()));
  }
  for (const m of FCLABELS) {
    const el = m.getElement();
    if (!el) continue;
    const p = MAP.latLngToContainerPoint(m.getLatLng());
    const clash = kept.some(q =>
      Math.abs(q.x - p.x) < LABEL_MIN_X && Math.abs(q.y - p.y) < LABEL_MIN_Y);
    el.style.display = clash ? 'none' : '';
    if (!clash) kept.push(p);
  }
}

const tyTag = (html, cls, dy) => L.divIcon({
  className: '', iconSize: [96, 30], iconAnchor: [48, dy == null ? -8 : dy],
  html: `<div class="ty-wrap"><div class="ty-lb${cls ? ' ' + cls : ''}">${html}</div></div>`,
});

function drawMap(ty) {
  if (window.__noLeaflet || typeof L === 'undefined' || !ty.pos) { $('#mapWrap').style.display = 'none'; return; }
  $('#mapWrap').style.display = '';
  if (!MAP) {
    MAP = L.map('map', { attributionControl: true, zoomControl: true }).setView([23.7, 121], 5);
    MAP.attributionControl.setPrefix('');
    initBasemaps(MAP);
    MAP.on('zoomend', declutterLabels);
    MAP.on('moveend', declutterLabels);
  }
  if (MLAYER) MAP.removeLayer(MLAYER);
  // 時刻標記是獨立圖層,上面那行清不到它。只把變數設成 null 會讓舊圖層
  // 留在地圖上變成孤兒,每重畫一次多疊一個,所以要真的移除再重掛。
  if (TMARK) { MAP.removeLayer(TMARK); TMARK = null; }
  MLAYER = L.layerGroup().addTo(MAP);
  FCLABELS = []; ANCHORS = [];
  const pts = [[ty.pos.lat, ty.pos.lng]];

  // 彩色底圖（尤其衛星影像）底下什麼顏色都有,細線會被吃掉。
  // 每條路徑先鋪一條深色襯線再畫本體,亮處暗處都看得見。
  const cased = (latlngs, opt) => {
    L.polyline(latlngs, { color: '#08131A', weight: (opt.weight || 2) + 2.5, opacity: .55 }).addTo(MLAYER);
    return L.polyline(latlngs, opt).addTo(MLAYER);
  };

  // ── 臺灣近海界線：海上颱風警報的門檻 ──────────────────────
  // 墊在最底層。暴風圈碰到這條線,就是氣象署發海警的條件。
  const seaKm = Number.isFinite(DB.cfg.seaBuffer) ? DB.cfg.seaBuffer : 100;
  if (seaKm > 0) {
    L.polyline(offshoreRing(seaKm), {
      color: '#54C7EA', weight: 1.4, opacity: .5, dashArray: '3,6',
      fill: false, interactive: false,
    }).addTo(MLAYER);
  }

  // ── 其他同時活動的颱風：琥珀色、輕量、可點選切換 ──────────
  // 先畫,讓選中的那顆疊在最上層。
  // 一併納入 fitBounds:多颱時要能一眼看到全部幾顆在哪裡,
  // 代價是臺灣會縮小一點 —— station 標記仍然畫著,要看細節就點選擇列切換,
  // 切過去之後這顆就變成主要颱風,框選也會跟著收斂。
  (DB.ty.list || []).forEach(o => {
    if (!o || !o.pos || tyKey(o) === tyKey(ty)) return;
    const k = tyKey(o), go = () => pickTyphoon(k);
    if (o.track && o.track.length) {
      L.polyline([[o.pos.lat, o.pos.lng], ...o.track.map(f => [f.pos.lat, f.pos.lng])],
        { color: '#EFAA35', weight: 1.6, dashArray: '5,5', opacity: .75 }).on('click', go).addTo(MLAYER);
      o.track.forEach(f => L.circleMarker([f.pos.lat, f.pos.lng],
        { radius: 2.5, color: '#EFAA35', fillColor: '#B4700B', fillOpacity: 1, weight: 1 }).addTo(MLAYER));
    }
    if (o.r15 > 0) L.circle([o.pos.lat, o.pos.lng], {
      radius: o.r15 * 1000, color: '#EFAA35', weight: 1.4,
      dashArray: '4,4', fillColor: '#EFAA35', fillOpacity: .06,
    }).addTo(MLAYER);
    L.marker([o.pos.lat, o.pos.lng], { icon: tyEye(false), zIndexOffset: 1100 })
      .bindTooltip(`${o.name}　${tcLabel(o.vmax)}（點選切換）`).on('click', go).addTo(MLAYER);
    ANCHORS.push(
      L.marker([o.pos.lat, o.pos.lng], { icon: tyTag(`${esc(o.name)}<br>${fmtShort(o.t0)}`, 'sec'), zIndexOffset: 1090 })
        .on('click', go).addTo(MLAYER));
    pts.push([o.pos.lat, o.pos.lng]);
  });

  // ── 選中的颱風：完整 ────────────────────────────────────
  if (ty.past.length > 1)
    cased(ty.past.map(p => [p.lat, p.lng]), { color: '#A8C6D6', weight: 2 });

  if (TRACK.length) {
    const tp = TRACK.map(f => [f.pos.lat, f.pos.lng]);
    // 外推路徑用另一個顏色與更疏的虛線,一眼就看得出不是官方預報。
    const tcol = EXTRAP ? '#EFAA35' : '#54C7EA';
    cased([[ty.pos.lat, ty.pos.lng], ...tp],
      { color: tcol, weight: 2.5, dashArray: EXTRAP ? '2,7' : '6,5' });
    TRACK.forEach(f => {
      if (f.r70) L.circle([f.pos.lat, f.pos.lng], { radius: f.r70 * 1000, color: tcol, weight: 1.4, fill: false, opacity: .55 }).addTo(MLAYER);
      L.circleMarker([f.pos.lat, f.pos.lng], { radius: 4, color: '#08131A', weight: 1.2, fillColor: tcol, fillOpacity: 1 })
        .bindTooltip(`+${f.tau}h　${bfLabel(ms2bf(f.vmax))}${EXTRAP ? '（外推推估，非官方預報）' : ''}`).addTo(MLAYER);
      // 每個預報點標上時刻與時距 —— 排班的人要的是「幾點」,不是「第幾個點」
      FCLABELS.push(L.marker([f.pos.lat, f.pos.lng], {
        icon: tyTag(`${fmtShort(ty.t0 + f.tau * 3600000)}<br><span style="opacity:.75">+${f.tau}h${EXTRAP ? ' 外推' : ''}</span>`,
                    EXTRAP ? 'ex' : 'fc', -6),
      }).addTo(MLAYER));
      pts.push([f.pos.lat, f.pos.lng]);
    });
  }

  // 沒有暴風圈就不要畫圈 —— 熱帶性低氣壓本來就沒有七級風範圍
  if (ty.r15 > 0) {
    L.circle([ty.pos.lat, ty.pos.lng], {
      radius: ty.r15 * 1000, color: '#EF5B4C', weight: 2,
      fillColor: '#EF5B4C', fillOpacity: .10,
    }).bindTooltip(`七級風半徑 ${ty.r15} km`).addTo(MLAYER);
  }

  L.marker([ty.pos.lat, ty.pos.lng], { icon: tyEye(true), zIndexOffset: 1300 })
    .bindTooltip(`${ty.name}　${tcLabel(ty.vmax)}`).addTo(MLAYER);
  ANCHORS.unshift(L.marker([ty.pos.lat, ty.pos.lng], {
    icon: tyTag(`${esc(ty.name)}<br>${fmtShort(ty.t0)}`, ''), zIndexOffset: 1290,
  }).addTo(MLAYER));

  drawStations(pts);
  /* 切到颱風頁的當下 #map 可能還沒有尺寸（剛從 display:none 出來）,
     這時候 fitBounds 會拿 0×0 去算縮放,結果縮到 zoom 0 ——
     整個世界擠成一團,颱風跟站臺全部疊在畫面中央。
     所以要先 invalidateSize 讓 Leaflet 量到真正的大小,再 fitBounds。 */
  /* 兩種框選：全域（颱風＋站臺一起看得到）與對焦站臺（只框自己的點）。
     颱風還在一千多公里外的時候,全域框出來站臺就是海岸線上的一小撮 ——
     「我的站臺現在長怎樣」那個問題,在那個縮放下根本回答不了。 */
  const fit = MAPFIT = () => {
    const good = pts.filter(p => Number.isFinite(p[0]) && Number.isFinite(p[1]));
    const mine = MYPTS.filter(p => Number.isFinite(p[0]) && Number.isFinite(p[1]));
    const use = (MAPFOCUS === 'tw' && mine.length) ? mine : good;
    if (use.length > 1) MAP.fitBounds(L.latLngBounds(use).pad(0.28));
    else if (use.length === 1) MAP.setView(use[0], 10);
  };
  const seg = $('#mapFocus');
  if (seg) {
    seg.style.display = MYPTS.length ? '' : 'none';
    $$('#mapFocus button').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.mf === MAPFOCUS)));
  }
  MAP.invalidateSize();
  fit();
  drawTimeMarker();                  // 主圖重畫後把時刻標記掛回去
  declutterLabels();
  // 版面若還在收斂（字級切換、旋轉螢幕）,晚一拍再量一次並重新框。
  setTimeout(() => { MAP.invalidateSize(); fit(); declutterLabels(); }, 80);
}

/* ═══ 回報產出 ═══════════════════════════════════════════ */
const CN = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
function repLine(s, opt) {
  let t = `${s.name}於${fmtHM(s.at)}${S_VERB[s.status]}（${fmtMD(s.at)}）`;
  if (opt.hum && s.hum != null && s.status !== 'on') t += `（濕度${s.hum}%）`;
  return t + '。';
}
function blk(title, items, opt) {
  return { title, body: items.length ? items.map((x, i) => `${i + 1}.${x}`).join('\n') : (opt.empty ? '1.無。' : ''), n: items.length };
}
function joinBlocks(bs, opt) {
  let i = 0;
  return bs.filter(b => b.n > 0 || b.body || opt.empty)
    .map(b => `${CN[i++]}、${b.title}${b.body ? '\n' + b.body : ''}`).join('\n');
}
function generate() {
  const opt = { hum: tglOn('#optHum'), empty: tglOn('#optEmpty') };
  const c = DB.cfg;
  const head = tglOn('#optHead') && c.unit ? `${c.unit}報告：\n` : '';
  const since = DB.since || 0;
  /* 回報稿裡每個區塊都由北至南列。原本是照狀態變更時間排,
     但通報是給人照地理位置對照的,時間順序在紙上看不出任何意義。
     沒填座標的排在最後,同緯度或都沒座標時才回到時間先後。 */
  const nsAt = (a, b) => (Number.isFinite(b.lat) ? b.lat : -1e3) - (Number.isFinite(a.lat) ? a.lat : -1e3)
    || a.at - b.at;
  /* 標成「不列入回報」的類別整個不進交接通報（中繼站臺是自用監看）。
     它們仍然出現在站臺頁、衝擊表與播報 —— 值班的人自己要看,只是不對外發。 */
  const rTypes = DB.types.filter(t => !t.noReport);
  const inType = id => DB.stations.filter(s => s.type === id && IS_LIVE(s)).sort(nsAt);
  const back = DB.stations.filter(s => s.status === 'on' && s.at >= since && inReport(s)).sort(nsAt);
  const bs = [];
  let txt = '';

  if (DB.tpl === 'A') {
    const intro = (c.introA || '').replace('{颱風}', DB.ty.name || '（颱風名稱）');
    rTypes.forEach(t => {
      const items = inType(t.id).filter(s => s.status !== 'on')
        .sort((a, b) => (a.status === 'standby') - (b.status === 'standby') || nsAt(a, b))
        .map(s => repLine(s, opt));
      if (items.length || opt.empty) bs.push(blk(`${t.report}${items.length}處：`, items, opt));
    });
    bs.push(blk(`已復機站臺${back.length}處：`, back.map(s => repLine(s, opt)), opt));
    bs.push({ title: c.endA, body: '', n: 1 });
    txt = head + intro + '\n' + joinBlocks(bs, opt);
  } else {
    rTypes.forEach(t => {
      const off = inType(t.id).filter(s => s.status === 'off');
      if (off.length) bs.push(blk(`尚未開機${t.report}計${off.length}處：`, off.map(s => repLine(s, opt)), opt));
    });
    if (!bs.length && opt.empty) bs.push(blk('尚未開機站臺計0處：', [], opt));
    bs.push(blk(`已復機站臺${back.length}處：`, back.map(s => repLine(s, opt)), opt));
    const sb = DB.stations.filter(s => s.status === 'standby' && inReport(s)).sort(nsAt);
    if (sb.length || opt.empty) bs.push(blk(`待機站臺計${sb.length}處：`, sb.map(s => repLine(s, opt)), opt));
    bs.push({ title: c.endB, body: '', n: 1 });
    txt = head + joinBlocks(bs, opt);
  }
  $('#out').value = txt;
}

/* ── 反向彙整：把既有回報文字解析回站臺資料 ─────────────
   兩段式：先 parseReport 產生比對結果供預覽，確認後才 applyReport 寫入。
   直接覆蓋會在貼錯內容時把整個管制盤蓋掉，所以中間一定要有確認關卡。 */
const HDR_RE = /^\s*[一二三四五六七八九十]\s*[、.．]\s*(.+?)(?:計)?\s*\d*\s*處/;
const ITEM_RE = /^\s*\d+\s*[.、．]\s*(.+?)\s*於\s*(\d{1,4})\s*時\s*(完成關機|實施關機|完成開機|實施開機|完成復機|實施待機|完成待機)\s*[（(]?\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/;

function parseReport(text) {
  const lines = String(text).split(/\r?\n/);
  const Y = new Date().getFullYear();
  let curType = DB.types[0] ? DB.types[0].id : '';
  let typeSure = true;
  const raw_rows = [];
  let skipped = 0, seenItem = false;

  for (const raw of lines) {
    const L = raw.trim();
    if (!L) continue;

    const h = L.match(HDR_RE);
    if (h) {
      const title = h[1].replace(/^(本分署|本單位|尚未開機|已復機|目前)+/g, '');
      const t = DB.types.find(x =>
        title.includes(x.report) || title.includes(x.label) ||
        x.report.includes(title) || x.label.includes(title));
      // 「已復機站臺」「待機站臺」這類區塊沒有指明設備類別，沿用上一個區塊，
      // 但標記為不確定，之後同名合併時以有指明類別的那筆為準。
      typeSure = !!t;
      if (t) curType = t.id;
      continue;
    }

    const m = L.match(ITEM_RE);
    if (!m) { if (/^\s*\d+\s*[.、．]\s*\S+\s*於/.test(L) || /於\s*\d{1,4}\s*時/.test(L)) skipped++; continue; }
    seenItem = true;

    const name = m[1].replace(/^\d+\s*[.、．]\s*/, '').replace(/\s+/g, '').trim();
    if (!name) continue;
    const hhmm = m[2];
    const hh = hhmm.length <= 2 ? +hhmm : +hhmm.slice(0, hhmm.length - 2);
    const mi = hhmm.length <= 2 ? 0 : +hhmm.slice(-2);
    if (hh > 23 || mi > 59) { skipped++; continue; }
    const status = /開機|復機/.test(m[3]) ? 'on' : /待機/.test(m[3]) ? 'standby' : 'off';
    const at = new Date(Y, +m[4] - 1, +m[5], hh, mi).getTime();
    const humM = L.match(/濕度\s*(\d{1,3})\s*%/);
    const hum = humM ? clamp(+humM[1], 0, 100) : null;

    raw_rows.push({ name, type: curType, typeSure, status, at, hum });
  }

  // 同一份文字裡同名站臺可能出現兩次（例如先列關機、後列已復機）。
  // 直接照單全收會建出重複站臺，因此以名稱合併：狀態時間取最新的一筆，
  // 類別取「區塊標題有明確指出類別」的那一筆。
  const byName = new Map();
  let merged = 0;
  for (const r of raw_rows) {
    const p = byName.get(r.name);
    if (!p) { byName.set(r.name, r); continue; }
    merged++;
    const keepType = p.typeSure ? p.type : (r.typeSure ? r.type : p.type);
    const newer = r.at >= p.at ? r : p;
    byName.set(r.name, { ...newer, type: keepType, typeSure: p.typeSure || r.typeSure });
  }

  const rows = [];
  for (const r of byName.values()) {
    const ex = DB.stations.find(s => s.name === r.name);
    const same = ex && ex.status === r.status && ex.at === r.at && (ex.hum ?? null) === r.hum;
    rows.push({
      name: r.name, type: ex ? ex.type : r.type, status: r.status, at: r.at, hum: r.hum,
      kind: !ex ? 'new' : same ? 'same' : 'update',
      exId: ex ? ex.id : null,
      from: ex ? { status: ex.status, at: ex.at } : null,
      typeSure: r.typeSure || !!ex,
    });
  }
  rows.sort((a, b) => a.at - b.at);
  return { rows, skipped, seenItem, merged };
}

function applyReport(rows) {
  let added = 0, updated = 0;
  for (const r of rows) {
    if (r.kind === 'same') continue;
    if (r.exId) {
      const s = DB.stations.find(x => x.id === r.exId);
      if (!s) continue;
      if (s.status !== r.status) DB.log.push({ t: Date.now(), name: s.name, from: s.status, to: r.status, at: r.at });
      s.status = r.status; s.at = r.at; s.hum = r.hum; updated++;
    } else {
      DB.stations.push({ id: uid(), name: r.name, type: r.type, status: r.status, at: r.at, hum: r.hum, note: '', lat: null, lng: null });
      DB.log.push({ t: Date.now(), name: r.name, from: null, to: r.status, at: r.at });
      added++;
    }
  }
  save(); rebuildModel(); renderStations(); generate();
  toast(`已套用：新增 ${added} 站、更新 ${updated} 站`);
  go('eq');
}

function openImportPreview(text) {
  const { rows, skipped, merged } = parseReport(text);
  if (!rows.length) {
    openSheet('解析結果', `<div class="msg e">沒有解析到任何站臺。</div>
      <p class="hint">可辨識的句型是：<code>1.○○雷達站於1310時完成關機（7月10日）。</code><br><br>
      動詞支援完成關機、實施關機、完成開機、完成復機、實施待機、完成待機；
      時間可寫 <code>15時</code> 或 <code>1310時</code>；濕度寫在同一行的
      <code>（濕度87%）</code> 也會一併帶入。區塊標題如
      <code>一、岸際雷達11處：</code> 用來判斷新站臺歸到哪個類別。</p>`);
    return;
  }
  const KIND = {
    new: ['新增', 'var(--ok)'], update: ['更新', 'var(--sb)'], same: ['無變更', 'var(--fg4)'],
  };
  const n = { new: 0, update: 0, same: 0 };
  rows.forEach(r => n[r.kind]++);

  openSheet('確認要套用的內容', `
    <div class="stat" style="margin-bottom:0.75rem">
      <div class="v-on"><b>${n.new}</b><small>新增站臺</small></div>
      <div class="v-sb"><b>${n.update}</b><small>狀態更新</small></div>
      <div><b style="color:var(--fg4)">${n.same}</b><small>無變更</small></div>
    </div>
    ${skipped ? `<div class="msg w">有 ${skipped} 行看起來像站臺紀錄但格式不合，已略過。請比對下表確認沒有漏掉。</div>` : ''}
    ${merged ? `<div class="msg i">有 ${merged} 個站臺在這份文字裡出現超過一次（例如先列關機、後列已復機），已合併為最新的一筆狀態。</div>` : ''}
    ${rows.some(r => r.kind === 'new' && !r.typeSure) ? `<div class="msg w">部分新站臺所在的區塊沒有指明設備類別，已暫時歸到最接近的類別，套用後請確認下表的類別欄。</div>` : ''}
    <div class="card" style="padding:0.25rem 0.625rem;margin-bottom:0.75rem;max-height:46vh;overflow-y:auto">
      <table class="impact"><tr><th>站臺</th><th>類別</th><th>解析結果</th><th>異動</th></tr>
      ${rows.map(r => `<tr>
        <td class="nm">${esc(r.name)}</td>
        <td style="font-size:0.7188rem;color:${r.typeSure ? 'var(--fg3)' : 'var(--sb)'}">${esc(typeOf(r.type).label)}${r.typeSure ? '' : ' ?'}</td>
        <td>${fmtMD(r.at)} ${fmtHM(r.at)}<br>
            <span style="font-size:0.7188rem;color:var(--fg3)">${S_VERB[r.status]}${r.hum != null ? `　濕度${r.hum}%` : ''}</span></td>
        <td style="color:${KIND[r.kind][1]};font-size:0.75rem">${KIND[r.kind][0]}
          ${r.from && r.kind === 'update' ? `<br><span style="font-size:0.6562rem;color:var(--fg4)">原為 ${S_LABEL[r.from.status]} ${fmtHM(r.from.at)}</span>` : ''}</td>
      </tr>`).join('')}</table>
    </div>
    <div class="btnrow">
      <button class="btn pri" id="ip_ok">套用到管制盤</button>
      <button class="btn" id="ip_no">取消</button></div>
    <p class="hint" style="margin-top:0.625rem">
      比對依據是站臺名稱完全相同。名稱有一個字不一樣就會被當成新站臺，
      套用後若看到重複，請到該站「編輯」改名或刪除。新站臺的座標需另外補填。</p>`,
    () => {
      $('#ip_ok').onclick = () => { applyReport(rows); closeSheet(); };
      $('#ip_no').onclick = closeSheet;
    });
}

/* ═══════════════════════════════════════════════════════════════
   設定 / 對話框 / 安全 / 啟動
   ═══════════════════════════════════════════════════════════════ */
function tglOn(sel) { return $(sel).getAttribute('aria-pressed') === 'true'; }
function bindToggle(sel, get, set) {
  const el = $(sel);
  el.setAttribute('aria-pressed', String(!!get()));
  el.onclick = () => {
    const v = el.getAttribute('aria-pressed') !== 'true';
    el.setAttribute('aria-pressed', String(v)); set(v);
  };
}

/* ── 底部彈出面板 ────────────────────────────────────── */
function openSheet(title, html, mount) {
  $('#shTitle').textContent = title;
  $('#shBody').innerHTML = html;
  $('#sheet').classList.add('on');
  document.body.style.overflow = 'hidden';
  if (mount) mount();
}
function closeSheet() { $('#sheet').classList.remove('on'); document.body.style.overflow = ''; }
$('#shClose').onclick = closeSheet;
$('.sheet-bg').onclick = closeSheet;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* ── 站臺編輯 ────────────────────────────────────────── */
function openStation(id) {
  const s = id ? DB.stations.find(x => x.id === id) : null;
  const opts = DB.types.map(t => `<option value="${t.id}" ${s && s.type === t.id ? 'selected' : ''}>${esc(t.label)}</option>`).join('');
  openSheet(s ? '編輯站臺' : '新增站臺', `
    <label class="fld"><span class="lb">回報名稱</span>
      <input type="text" id="f_name" value="${esc(s ? s.name : '')}" placeholder="例：○○雷達站">
      <span class="sub">產出回報文字時會原字照用，請填成正式回報要出現的寫法。</span></label>

      };

      $('#f_gps').onclick = () => {
        if (!navigator.geolocation) return toast('此裝置不支援定位');
        toast('定位中…');
        navigator.geolocation.getCurrentPosition(
          p => { $('#f_ll').value = `${p.coords.latitude.toFixed(6)}, ${p.coords.longitude.toFixed(6)}`; show(); },
          () => toast('取得定位失敗，請確認已允許定位權限'), { enableHighAccuracy: true, timeout: 10000 });
      };
      $('#f_save').onclick = () => {
        const name = $('#f_name').value.trim();
        if (!name) return toast('請填站臺名稱');
        const llv = $('#f_ll').value.trim();
        const c = llv ? parseCoord(llv) : null;
        if (llv && !c) return toast('座標格式無法辨識，請修正或清空');
        const humv = $('#f_hum').value.trim();
        const d = {
          name, type: $('#f_type').value, status: $('#f_status').value,
          at: fromInput($('#f_at').value),
          lat: c ? c.lat : null, lng: c ? c.lng : null,
          hum: humv === '' ? null : clamp(+humv, 0, 100),
          note: $('#f_note').value.trim(),
          terrain: $('#f_terr').value || null,
        };
        if (s) { if (s.status !== d.status) DB.log.push({ t: Date.now(), name, from: s.status, to: d.status, at: d.at }); Object.assign(s, d); }
        else { DB.stations.push(Object.assign({ id: uid() }, d)); DB.log.push({ t: Date.now(), name, from: null, to: d.status, at: d.at }); }
        save(); rebuildModel(); renderStations(); renderTyphoon({}); renderSettings(); closeSheet(); toast('已儲存');
      };
      if (s) $('#f_del').onclick = () => {
        if (!confirm(`刪除「${s.name}」？無法復原。`)) return;
        DB.stations = DB.stations.filter(x => x.id !== s.id);
        save(); renderStations(); renderSettings(); closeSheet(); toast('已刪除');
      };
    });
}

/* ── 設定頁清單的排序 ────────────────────────────────────
   站臺頁的排序（DB.cfg.sort）是給值班掃狀態用的,會用到風級、離颱風遠近;
   設定頁的清單是用來「找到某一站去改它」,要的只有地理位置與名字。
   兩個分開存,互不影響。 */
const LIST_SORT = { ns: '由北至南', name: '名稱', type: '類別', custom: '自訂順序' };
const listSortKey = () => (LIST_SORT[DB.cfg.listSort] ? DB.cfg.listSort : 'ns');
function sortForList(list) {
  const k = listSortKey();
  const arr = list.slice();
  if (k === 'custom') return arr;
  const ti = id => DB.types.findIndex(t => t.id === id);
  const byName = (a, b) => String(a.name).localeCompare(String(b.name), 'zh-Hant');
  const byNs = (a, b) =>
    (Number.isFinite(b.lat) ? b.lat : -1e3) - (Number.isFinite(a.lat) ? a.lat : -1e3) || byName(a, b);
  if (k === 'name') return arr.sort(byName);
  if (k === 'type') return arr.sort((a, b) => (ti(a.type) - ti(b.type)) || byNs(a, b));
  return arr.sort(byNs);
}

          `<option value="${k}" ${t.terrain === k ? 'selected' : ''}>${v.thr} mm（${v.label}）</option>`).join('')}
      </select>
      <span class="sub">目前為 <b>${TERRAIN[t.terrain === 'hill' ? 'hill' : 'flat'].thr} mm</b>。
        依《天然災害停止上班及上課作業辦法》第四條附表，門檻是「平地／山區」而不是一個固定數字——
        多數縣市平地與山區都是 ${DGPA_FLAT} mm，只有部分縣市山區是 ${DGPA_HILL} mm，連江縣兩者都是 200 mm。
        實際比對時會依該站所在縣市查表。個別站臺可在該站「編輯」裡覆寫。</span></label>
    <div class="sw" style="margin-bottom:0.5rem"><div class="sw-t"><b>列入回報稿</b>
      <small>${t.noReport ? '目前不列入。自用監看，不進交接通報' : '目前列入交接通報'}</small></div>
      <button class="tgl" data-t="${t.id}" data-k="noReport" aria-pressed="${!t.noReport}"></button></div>
    <button class="btn sm dg" data-del="${t.id}">刪除此類別</button></div>`).join('');
  openSheet('設備類別', rows + `
    <div class="btnrow"><button class="btn pri wide" id="t_add">新增類別</button></div>
    <p class="hint" style="margin-top:0.75rem">類別完全由您自訂，程式不預設任何實際設備名稱。刪除類別前，請先把該類別下的站臺改到其他類別。
    關掉「列入回報稿」的類別，仍會出現在站臺頁、衝擊預判與播報，只是不進交接通報。</p>`,
    () => {
      $('#shBody').addEventListener('change', e => {
        const el = e.target.closest('select[data-t]'); if (!el) return;
        const t = DB.types.find(x => x.id === el.dataset.t); if (!t) return;
        t[el.dataset.k] = el.value; save(); renderStations(); renderTyphoon({}); generate();
      });
      $('#shBody').addEventListener('input', e => {
        const el = e.target.closest('input[data-t]'); if (!el) return;
        const t = DB.types.find(x => x.id === el.dataset.t); if (!t) return;
        t[el.dataset.k] = el.value; save();
      });
      $('#shBody').addEventListener('click', e => {
        const g = e.target.closest('button.tgl[data-t]');
        if (g) {
          const t = DB.types.find(x => x.id === g.dataset.t);
          if (t) { t.noReport = !t.noReport; save(); openTypes(); renderStations(); generate(); }
          return;
        }
        const d = e.target.closest('[data-del]');
        if (d) {
          const used = DB.stations.filter(s => s.type === d.dataset.del).length;
          if (used) return toast(`還有 ${used} 個站臺屬於此類別，請先改到其他類別`);
          if (DB.types.length <= 1) return toast('至少需保留一個類別');
          DB.types = DB.types.filter(x => x.id !== d.dataset.del); save(); openTypes(); renderStations();
        }
      });
      $('#t_add').onclick = () => {
        DB.types.push({ id: uid(), label: '新類別', report: '新類別', terrain: 'flat', noReport: false });
        save(); openTypes(); renderStations();
      };
    });
}

function refreshAll() {

/* ── 匯出 / 匯入 ─────────────────────────────────────── */
function exportPayload() {
  const d = JSON.parse(JSON.stringify(DB));
  if (!DB.cfg.exportCoords) d.stations.forEach(s => { s.lat = null; s.lng = null; });
  d.cfg.pin = '';                      // 備份不帶密碼雜湊
  d.ty.data = null; d.ty.list = [];    // 颱風資料每次重抓即可
  return d;
}
function download(obj, name) {
  const b = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}
const stamp = () => new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '');
async function doExport(enc) {
  const p = exportPayload();
  if (!enc) { download(p, `風哨備份_${stamp()}.json`); toast('備份已下載'); return; }
  const pw = prompt('設定備份檔密碼（解密時需要，遺失無法還原）：');
  if (!pw) return;
  try { download(await encryptJSON(p, pw), `風哨備份_加密_${stamp()}.json`); toast('加密備份已下載'); }
  catch (e) { toast('加密失敗：' + e.message); }
}
function doImport(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try {
      let o = JSON.parse(r.result);
      if (o && o.galepost === 'enc1') {
        const pw = prompt('這是加密備份，請輸入密碼：');
        if (!pw) return;
        o = await decryptJSON(o, pw);
      }
      if (!o || !Array.isArray(o.stations)) throw new Error('不是風哨的備份檔');
      const keepPin = DB.cfg.pin;
      const base = blankDB();
      DB = Object.assign(base, o);
      DB.cfg = Object.assign(base.cfg, o.cfg || {}); DB.cfg.pin = keepPin;
      DB.ty = Object.assign(base.ty, o.ty || {});
      save(); refreshAll(); renderSettings(); syncForm(); toast('備份已匯入');
    } catch (err) { toast('匯入失敗：' + (err.message === 'OperationError' ? '密碼錯誤' : err.message)); }
  };
  r.readAsText(f); e.target.value = '';
}

/* ── 密碼鎖 ──────────────────────────────────────────── */
let locked = false, idleT = null;
function openPin() {
  openSheet('開啟密碼', `
    ${DB.cfg.pin ? '<label class="fld"><span class="lb">目前密碼</span><input type="password" id="p_old" inputmode="numeric"></label>' : ''}
    <label class="fld"><span class="lb">新密碼　留空表示取消密碼</span>
      <input type="password" id="p_new" inputmode="numeric" maxlength="8" placeholder="4 至 8 位數字">
      <span class="sub">密碼只在本機驗證。忘記密碼時只能清除資料重建，請保留匯出的備份。</span></label>
    <button class="btn pri wide" id="p_ok">儲存</button>`, () => {
    $('#p_ok').onclick = async () => {
      if (DB.cfg.pin) {
        const old = await sha256($('#p_old').value);
        if (old !== DB.cfg.pin) return toast('目前密碼不正確');
      }
      const nv = $('#p_new').value.trim();
      if (nv && !/^\d{4,8}$/.test(nv)) return toast('請設定 4 至 8 位數字');
      DB.cfg.pin = nv ? await sha256(nv) : '';
      save(); renderSettings(); closeSheet();
      toast(nv ? '密碼已設定' : '密碼已取消');
    };
  });
}
function lock() {
  if (!DB.cfg.pin || locked) return;
  locked = true; $('#lock').classList.add('on'); $('#pinIn').value = '';
  setTimeout(() => $('#pinIn').focus(), 120);
}
async function unlock() {
  if (await sha256($('#pinIn').value) === DB.cfg.pin) {
    locked = false; $('#lock').classList.remove('on'); $('#pinIn').value = '';
  } else { toast('密碼不正確'); $('#pinIn').value = ''; }
}
$('#pinGo').onclick = unlock;
$('#pinIn').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
document.addEventListener('visibilitychange', () => {
  if (!DB.cfg.pin || !DB.cfg.lockMin) return;
  if (document.hidden) { clearTimeout(idleT); idleT = setTimeout(lock, DB.cfg.lockMin * 60000); }
  else clearTimeout(idleT);
});

/* ── 自動更新 ────────────────────────────────────────── */

/* ── 回報頁事件 ──────────────────────────────────────── */
$('#tplSeg').addEventListener('click', e => {

  DB.tpl = b.dataset.t; save();
  $$('#tplSeg button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));

['#optHum', '#optEmpty', '#optHead'].forEach(id => $(id).addEventListener('click', () => {
  const el = $(id); el.setAttribute('aria-pressed', String(el.getAttribute('aria-pressed') !== 'true')); generate();
}));
/* 全螢幕地圖。切換之後一定要 invalidateSize —— 容器換了大小,
   Leaflet 不會自己知道,圖磚會停在舊尺寸的格線上。 */
function toggleMapFull(on) {
  const w = document.getElementById('mapWrap');
  if (!w) return;
  const next = on == null ? !w.classList.contains('full') : !!on;
  w.classList.toggle('full', next);
  document.body.style.overflow = next ? 'hidden' : '';
  const b = document.getElementById('mapFull');
  if (b) { b.textContent = next ? '✕' : '⛶'; b.title = next ? '離開全螢幕' : '全螢幕'; }
  /* 換了大小之後不只要 invalidateSize,還要重新框一次 ——
     不然全螢幕打開來,內容還擠在原本那 18.75rem 的位置,下面一大片空白。 */
  /* 用 MAP 不是 window.MAP —— MAP 是頂層 `let`,不會掛到 window 上,
     `window.MAP` 永遠是 undefined,整段就永遠不會執行。 */
  if (MAP) setTimeout(() => {
    MAP.invalidateSize();
    if (typeof MAPFIT === 'function') MAPFIT();
    declutterLabels();
  }, 60);
}
document.getElementById('mapFull').addEventListener('click', () => toggleMapFull());
addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('mapWrap').classList.contains('full')) toggleMapFull(false);
});
document.getElementById('mapFocus').addEventListener('click', e => {
  const b = e.target.closest('button[data-mf]'); if (!b) return;
  MAPFOCUS = b.dataset.mf;

});
document.getElementById('tySeg').addEventListener('click', e => {
  const b = e.target.closest('button[data-ty]');
  if (b) goTySub(b.dataset.ty);
});

$('#tyName').addEventListener('input', () => {
  DB.ty.name = $('#tyName').value.trim();

  DB.ty.nameEdited = !!DB.ty.name;

});
$('#since').addEventListener('change', () => { DB.since = fromInput($('#since').value); save(); generate(); });
$('#regen').onclick = () => { generate(); toast('已依目前站臺狀態重新產生'); };
$('#markSent').onclick = () => {

  catch { $('#out').select(); document.execCommand('copy'); toast('全文已複製'); }

  if (!t) return toast('請先貼上回報文字');
