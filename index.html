      // 「變性為溫帶氣旋」這類官方預報的狀態轉變,時間軸要列出來
      st: zhText(pick(f, 'StateTransfer', 'stateTransfer')),
    })).filter(f => f.pos && Number.isFinite(f.tau) && f.tau > 0)
       .sort((a, b) => a.tau - b.tau),
    // 過去路徑帶時間與強度：地圖要標「10/21 14時」、時間軸要找出增強／減弱的時刻
    past: fixes.map(f => {
      const p = fixCoord(f);
      if (!p) return null;
      const t = fixTime(f);
      return { lat: p.lat, lng: p.lng, t: Number.isFinite(t) ? t : null,
        vmax: num(pick(f, 'MaxWindSpeed', 'maxWindSpeed')) || 0,
        pres: num(pick(f, 'PressureCenter', 'pressureCenter', 'Pressure', 'pressure')) || 0 };
    }).filter(Boolean),
  };
}

/* ── 中央氣象署取得策略：直連 → 代理 ────────────────────────
   opendata.cwa.gov.tw 不一定回 CORS 標頭，瀏覽器直連常常被擋。
   擋掉時如果設了代理網址就改走代理（Cloudflare Worker 之類），
   請求格式與常見的 CWA 代理一致：POST {cwaDataset, cwaKey, cwaParams}。
   兩條都失敗才拋錯，並把原因記下來給使用者看，不要默默退回 GDACS
   讓人以為「氣象署就是沒資料」。                                    */
/* 診斷訊息依資料集分開存放。
   路徑（W-C0034-005）與警報單（W-C0034-001）是同時發出的兩個請求，
   共用一個變數的話後回來的那個會把先回來的訊息蓋掉——警報單成功時
   會把路徑失敗的原因擦掉，畫面就又變回「氣象署沒資料」的樣子，
   正好是這段診斷本來要防的事。                                      */
const _cwaDiag = Object.create(null);
const CWA_PATH_SET = 'W-C0034-005';

// 對外只回報「官方路徑為什麼沒拿到」——那才是推算停擺的原因。
function cwaDiag() { return _cwaDiag[CWA_PATH_SET] || ''; }

async function cwaJson(dataset, key) {
  const proxy = (DB.cfg.cwaProxy || '').trim();
  let directErr = '';
  try {
    const j = await getJSON(
      `${CWA_BASE}/${dataset}?Authorization=${encodeURIComponent(key)}&format=JSON`);
    _cwaDiag[dataset] = '';
    return j;
  } catch (e) {
    // 瀏覽器把 CORS 擋下時只會給一個沒有細節的 TypeError，
    // 這裡不猜是哪一種，只如實轉述並提示代理這條路。
    directErr = (e && e.message) || String(e);
    if (!proxy) {
      const m = `直連中央氣象署失敗（${directErr}）。`
        + '若是瀏覽器 CORS 擋下，請到「設定 › 資料來源」填入 CWA 代理網址。';
      _cwaDiag[dataset] = m;
      throw new Error(m);
    }
  }

  const c = new AbortController();
  const t = setTimeout(() => c.abort(), 15000);
  try {
    const r = await fetch(proxy, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ cwaDataset: dataset, cwaKey: key, cwaParams: {} }),
      signal: c.signal,
    });
    if (!r.ok) throw new Error('代理回應 ' + r.status);
    const j = await r.json();
    _cwaDiag[dataset] = '';
    return j;
  } catch (e) {
    const m = `直連失敗（${directErr}），改走代理也失敗（${(e && e.message) || e}）。`;
    _cwaDiag[dataset] = m;
    throw new Error(m);
  } finally { clearTimeout(t); }
}

/* 颱風侵襲機率（W-C0034-003）本來做在這裡,已經移除。
   氣象署開放資料平台的資料集清單裡沒有這支 —— 天氣警特報底下只有
   W-C0033-001~005 與 W-C0034-001、W-C0034-005。抓一個不存在的資料集
   只會每次更新多送一個必然失敗的請求。
   平台若重新提供,解析邏輯在 git 歷史裡（commit cb18761）。      */

/* ── 中央氣象署 O-A0001-001 自動氣象站即時觀測 ──────────────
   畫面上其他每一個風級都是模型推估出來的,這裡是唯一真的量到的數字。
   兩者並排看:差一兩級屬正常(模型算的是海面持續風,測站在地面又被地形擋),
   差很多就代表模型在這個地形下不可信 —— 值班的人要知道不能全信程式。
   觀測值只放在記憶體,不寫進本機儲存:過期的風速比沒有風速更危險。   */
let OBS = [], OBS_AT = 0;

// 氣象署用負數當「這項沒測到」的哨兵(-99、-991、-9997…)。
// 直接 Number() 會把它當成風速 -99 然後算成 0 級,那是無中生有的假資料。
const obsNum = v => {
  const n = Number(v);
  return Number.isFinite(n) && n > -90 ? n : null;
};

/* 測站的共同部分：名稱、代號、座標、觀測時間。
   自動氣象站(風)與自動雨量站(雨)的外殼一樣,只有量測欄位不同。 */
function stationBase(o) {
  // 新版 API 是 Station / GeoInfo,舊版是 location / lat,lon。
  // 兩種都接,因為沒辦法在這個環境對真實回應,少接一種就等於少一半機會。
  const name = pick(o, 'StationName', 'stationName', 'locationName');
  if (!name) return null;

  const geo = pick(o, 'GeoInfo', 'geoInfo') || {};
  let lat = null, lng = null;
  const coords = pick(geo, 'Coordinates', 'coordinates');
  if (Array.isArray(coords) && coords.length) {
    // 一站會同時給 TWD67 與 WGS84 兩組,要挑 WGS84,
    // 拿錯會整站偏移數百公尺,選最近測站時就會選錯站。
    const w = coords.find(c => String(pick(c, 'CoordinateName', 'coordinateName') || '')
      .toUpperCase().includes('WGS84')) || coords[0];
    lat = obsNum(pick(w, 'StationLatitude', 'stationLatitude'));
    lng = obsNum(pick(w, 'StationLongitude', 'stationLongitude'));
  }
  if (lat == null) lat = obsNum(pick(o, 'lat', 'Latitude', 'latitude'));
  if (lng == null) lng = obsNum(pick(o, 'lon', 'lng', 'Longitude', 'longitude'));
  if (lat == null || lng == null) return null;

  const ot = pick(o, 'ObsTime', 'obsTime', 'time') || {};
  const at = Date.parse(pick(ot, 'DateTime', 'dateTime', 'obsTime') || '');

  return {
    name: String(name).trim(),
    id: String(pick(o, 'StationId', 'stationId') || ''),
    pos: { lat, lng },
    at: Number.isFinite(at) ? at : 0,
    county: String(pick(geo, 'CountyName', 'countyName') || ''),
    town: String(pick(geo, 'TownName', 'townName') || ''),
  };
}

// 舊版把量測放在 weatherElement 陣列裡,用 elementName 找。
const legacyEl = (arr, k) => {
  const e = arr.find(x => String(pick(x, 'elementName', 'ElementName') || '') === k);
  return e ? obsNum(pick(e, 'elementValue', 'ElementValue')) : null;
};

function parseObsStation(o) {
  const base = stationBase(o);
  if (!base) return null;

  let wind = null, gust = null, dir = null;
  const we = pick(o, 'WeatherElement', 'weatherElement');
  if (Array.isArray(we)) {
    wind = legacyEl(we, 'WDSD'); gust = legacyEl(we, 'H_FX'); dir = legacyEl(we, 'WDIR');
  } else if (we && typeof we === 'object') {
    wind = obsNum(pick(we, 'WindSpeed', 'windSpeed'));
    dir = obsNum(pick(we, 'WindDirection', 'windDirection'));
    const gi = pick(we, 'GustInfo', 'gustInfo');
    if (gi) gust = obsNum(pick(gi, 'PeakGustSpeed', 'peakGustSpeed'));
  }
  if (wind == null && gust == null) return null;   // 沒有風的測站對這裡沒有用

  return Object.assign(base, { wind, gust, dir });
}

async function fetchObs(key) {
  const j = await cwaJson('O-A0001-001', key);
  const list = pick(j && j.records ? j.records : {}, 'Station', 'station', 'location', 'Location');
  return Array.isArray(list) ? list.map(parseObsStation).filter(Boolean) : [];
}

/* ── 中央氣象署 W-C0033-001 天氣特報（豪大雨） ──────────────
   雨量站是「已經下了多少」,特報是「氣象署認為接下來會下多少」。
   兩個都要:前者是事實,後者是官方預警,決策依據不同。
   一樣認不出來就空著,不硬湊。                                      */
let ADV = [], _advDiag = '';

/* 留下來的特報分兩類。風的部分已經有颱風警報單在管,低溫高溫與站臺無關。

   **雷雨是獨立的一類,不是雨的一種。** 使用者的規則是「打雷就要關站臺」——
   那跟「24 小時累積幾毫米」是完全不同的判斷:雷擊是瞬間的、對設備是直接風險,
   而且來得快去得也快。原本的過濾式 /(大雨|豪雨|豪大雨)/ 會把「大雷雨即時訊息」
   整個丟掉 —— 最該看到的那一種反而看不到。                       */
const RAIN_PHENOM = /(大雨|豪雨|豪大雨)/;
const THUNDER_PHENOM = /(雷|閃電)/;
const advCat = k => THUNDER_PHENOM.test(k) ? 'thunder' : RAIN_PHENOM.test(k) ? 'rain' : '';

/* 天氣特報的結構在不同資料集之間不一致,照著某個固定形狀解析很容易整份落空。
   改成遞迴走訪:沿途記住最近看到的 locationName 與 endTime,
   碰到 phenomena 節點就記一筆 —— 欄位怎麼包都抓得到。
   （作法取自使用者另一支程式 ARGUS，那邊已在真實環境跑過。）      */
/* 把一個節點底下所有的 locationName 撈出來。
   W-C0033-002 的影響地區放在 info.affectedAreas.location[] ——
   也就是在 phenomena 的「下面」而不是上面。只往下傳承的話,
   記到 phenomena 那一刻地區還是空的,卡片上就完全沒有影響地區。 */
function collectNames(node, out) {
  if (!node || typeof node !== 'object') return out;
  if (Array.isArray(node)) { for (const x of node) collectNames(x, out); return out; }
  const v = pick(node, 'locationName', 'LocationName', 'countyName', 'CountyName');
  if (typeof v === 'string' && v.trim() && !out.includes(v.trim())) out.push(v.trim());
  for (const k in node) collectNames(node[k], out);
  return out;
}

function walkAdvisory(node, loc, end, out) {
  if (!node || typeof node !== 'object') return;
  if (Array.isArray(node)) { for (const x of node) walkAdvisory(x, loc, end, out); return; }

  const lRaw = pick(node, 'locationName', 'LocationName', 'countyName', 'CountyName');
  const nextLoc = (typeof lRaw === 'string' && lRaw.trim()) ? lRaw.trim() : loc;

  let nextEnd = end;
  const vt = pick(node, 'validTime', 'ValidTime');
  const e = Date.parse(pick(vt || node, 'endTime', 'EndTime') || '');
  if (Number.isFinite(e)) nextEnd = e;

  const ph = pick(node, 'phenomena', 'Phenomena');
  const kind = String((ph && typeof ph === 'object' ? pick(ph, 'value', 'Value') : ph) || '').trim();
  if (kind) {
    // 先看自己底下有沒有地區,沒有才用從上面傳下來的
    const own = collectNames(node, []);
    const areas = own.length ? own : (nextLoc ? [nextLoc] : []);
    out.push({ kind, areas, end: nextEnd });
  }

  for (const k in node) walkAdvisory(node[k], nextLoc, nextEnd, out);
}

/* 資料集順序:-002「各別天氣警特報之內容及所影響之區域」欄位最完整,
   -003 是豪大雨專用,-001 是各縣市目前的警特報。取到雨類特報就停。  */
/* ── 鄉鎮天氣預報 ────────────────────────────────────────
   使用者要「是否下雨」到小時等級、還有未來三天。三件事分開處理:

   **現在下不下雨**:不用預報,用**自動雨量站的 10 分鐘累積**（已經在抓了）。
   那是實測,解析度就是 10 分鐘,比任何預報都準。

   **未來 0–3 小時**:Open Data **沒有**逐時降雨預報。真正的臨近預報要靠
   雷達回波外推,那在「天氣」頁的 Windy 雷達圖層。
   **不把 3 小時的預報內插成 1 小時** —— 天氣現象是類別欄位,內插就是編造,
   那正是抓 W-C0034-003 的同一種錯。

   **未來 2–3 天**:鄉鎮天氣預報,逐 3 小時（2 天）+ 1 週（12 小時一格）。
   照原始時距顯示。

   代號做成可改:我在這個開發環境連不到氣象署,**沒辦法驗證這兩支代號**。
   抓不到時畫面會明講是哪一支失敗、可以到設定改 —— 不會靜靜空白。      */
let WX = null, WX_AT = 0, WX_ERR = '';

const wxNum = v => { const x = parseFloat(v); return Number.isFinite(x) ? x : null; };

/* 氣象署的時間字串有兩種寫法:新版是 2026-08-26T12:00:00+08:00,
   舊版是 2026-08-26 12:00:00（沒有時區）。後者直接丟給 Date.parse,
   會被當成「裝置的本地時間」—— 裝置不在臺灣時區就整條時間軸偏掉。
   資料本身一定是臺灣時間,所以沒有時區就補 +08:00。 */
function wxTime(v) {
  if (!v) return NaN;
  let x = String(v).trim().replace(' ', 'T');
  if (!/[Zz]|[+-]\d{2}:?\d{2}$/.test(x)) x += '+08:00';
  const t = Date.parse(x);
  return Number.isFinite(t) ? t : Date.parse(String(v));
}

/* 一個鄉鎮的預報。新版是 Locations/Location/WeatherElement/Time/ElementValue,
   舊版是 locations/location/weatherElement/time/elementValue,兩種都接。 */
function parseTownFc(j) {
  const recs = (j && j.records) || {};
  const locsWrap = toArr(pick(recs, 'Locations', 'locations'));
  const out = [];
  const grab = wrap => {
    for (const L of toArr(pick(wrap, 'Location', 'location'))) {
      const name = pick(L, 'LocationName', 'locationName');
      if (!name) continue;
      const lat = wxNum(pick(L, 'Latitude', 'lat')), lng = wxNum(pick(L, 'Longitude', 'lon', 'lng'));
      const els = {};
      for (const E of toArr(pick(L, 'WeatherElement', 'weatherElement'))) {
        const en = String(pick(E, 'ElementName', 'elementName') || '');
        if (!en) continue;
        const times = toArr(pick(E, 'Time', 'time')).map(T => {
          const from = pick(T, 'StartTime', 'startTime', 'DataTime', 'dataTime');
          const to = pick(T, 'EndTime', 'endTime');
          const evRaw = pick(T, 'ElementValue', 'elementValue');
          /* elementValue **可能直接就是一個字串**（"陰天"、"80"）,不是只有
             [{value:…}] 那一種。使用者提供的真實回應就是字串那一種 ——
             照原本的寫法會取到 undefined,整份預報靜靜變成空白。 */
          let v, code = '';
          if (typeof evRaw === 'string' || typeof evRaw === 'number') {
            v = evRaw;
          } else {
            const ev = toArr(evRaw)[0];
            if (typeof ev === 'string' || typeof ev === 'number') v = ev;
            else {
              // 新版每個欄位有自己的鍵名;舊版一律叫 value
              v = pick(ev || {}, 'Weather', 'WeatherDescription', 'ProbabilityOfPrecipitation',
                'Temperature', 'RelativeHumidity', 'WindSpeed', 'WindDirection', 'BeaufortScale',
                'MaxTemperature', 'MinTemperature', 'value');
              code = String(pick(ev || {}, 'WeatherCode', 'weatherCode') || '');
            }
          }
          /* 風速藏在 parameter[] 裡（風速／風級／風向描述）,不在 elementValue。
             舊格式的 Wind 欄位 elementValue 是空字串,真正的值全在 parameter。 */
          const par = toArr(pick(T, 'parameter', 'Parameter'));
          const pv = nm => {
            const h = par.find(x => String(pick(x || {}, 'parameterName', 'ParameterName') || '') === nm);
            return h ? String(pick(h, 'parameterValue', 'ParameterValue') || '') : '';
          };
          if (!code) code = pv('天氣圖示代碼');
          const ws = pv('風速'), bf = pv('風級'), wd = pv('風向描述');
          if ((v == null || v === '') && (ws || bf || wd)) v = ws || bf || wd;
          return { from: from ? wxTime(from) : NaN, to: to ? wxTime(to) : NaN,
            v: v == null ? '' : String(v), code,
            ws, bf, wd };
        }).filter(x => Number.isFinite(x.from))
          /* 官方回傳的時間**不保證照順序**（真實樣本裡 3/11 12:00 排在 3/9 18:00 前面）。
             不排的話整張預報表的時序是亂的。 */
          .sort((a, b) => a.from - b.from);
        els[en] = times;
      }
      if (Object.keys(els).length) out.push({ name: String(name), lat, lng, els });
    }
  };
  if (locsWrap.length) locsWrap.forEach(grab); else grab(recs);
  return out;
}

/* 欄位名稱在不同資料集之間不一樣,依序找第一個有東西的。
   **完全相同的名稱一律優先**:舊格式裡溫度叫 T、體感溫度叫 AT,
   而 'AT'.includes('T') 為真 —— 只做包含比對會把體感溫度當成溫度。 */
const wxEl = (t, ...names) => (wxEls(t, ...names)[0] || []);

/* 有時候**不只一個**欄位在講同一件事,而且各自只涵蓋一段時間:
   逐 3 小時那一支給「溫度」（只到 +2 天）,一週那一支給「平均溫度」。
   只取第一個找到的,第 3 天以後就永遠是空的。
   所以回傳**全部**符合的,由呼叫端逐一往下找哪一個涵蓋這個時刻。 */
function wxEls(t, ...names) {
  const ks = Object.keys(t.els);
  const out = [];
  const push = k => { const a = t.els[k]; if (a && a.length && !out.includes(a)) out.push(a); };
  for (const n of names) for (const k of ks) if (k === n) push(k);
  for (const n of names) for (const k of ks) if (k.includes(n)) push(k);
  return out;
}

/* 把一個鄉鎮的各欄位併成一條時間序列。以「天氣現象」的時距為主軸 ——
   降雨機率有時是 3 小時、有時是 6 或 12 小時,以它為主軸會少掉一半的格子。 */
function townSeries(t) {
  const wx = wxEl(t, '天氣現象', 'Wx');
  if (!wx.length) return [];
  const at = (arr, ts) => {
    for (const x of arr) {
      const to = Number.isFinite(x.to) ? x.to : x.from + 3 * 3600000;
      if (ts >= x.from && ts < to) return x.v;
    }
    return '';
  };
  /* 取整筆而不只是取值 —— 風速在舊格式裡藏在 parameter 裡（x.ws / x.bf）,
     只看 elementValue 會永遠是空的。 */
  const atRec = (arr, ts) => {
    for (const x of arr) {
      const to = Number.isFinite(x.to) ? x.to : x.from + 3 * 3600000;
      if (ts >= x.from && ts < to) return x;
    }
    return null;
  };
  // 每一項都可能分散在好幾個欄位（各自涵蓋不同的時間範圍）
  const atAll = (arrs, ts) => { for (const a of arrs) { const v = at(a, ts); if (v !== '') return v; } return ''; };
  const atRecAll = (arrs, ts) => { for (const a of arrs) { const r = atRec(a, ts); if (r) return r; } return null; };
  const pop = wxEls(t, '降雨機率', 'PoP');
  const tmp = wxEls(t, '溫度', 'T', '平均溫度', 'MaxTemperature', 'MinTemperature');
  const rh = wxEls(t, '相對濕度', 'RH');
  const wsE = wxEls(t, '風速', 'WS', 'Wind');
  const wdE = wxEls(t, '風向', 'WD', 'Wind');
  return wx.map(x => {
    const w = atRecAll(wsE, x.from), d = atRecAll(wdE, x.from);
    /* 舊格式的風速寫成 "<=1" 這種字串,parseFloat 會得到 NaN —— 那是對的,
       但風級（Beaufort）也在 parameter 裡,拿得到就直接用,不要硬換算。 */
    const wsNum = w ? wxNum(w.ws || w.v) : null;
    const bfNum = w ? wxNum(w.bf) : null;
    return {
      from: x.from,
      to: Number.isFinite(x.to) ? x.to : x.from + 3 * 3600000,
      wx: x.v, code: x.code,
      pop: wxNum(atAll(pop, x.from)),
      t: wxNum(atAll(tmp, x.from)),
      rh: wxNum(atAll(rh, x.from)),
      ws: wsNum,
      bf: bfNum,
      wd: d ? (d.wd || d.v || '') : '',
    };
  });
}

const isRainy = w => /雨|雷|陣雨|豪|雹/.test(String(w || ''));

/* ── 天氣圖示與逐日彙整 ──────────────────────────────────
   使用者拿 iOS 天氣 App 當參考,問「改成這樣會不會比較清楚」。
   會 —— 但要借的是**結構**不是外觀:
   ① 地點做成一張張卡片,不是表格的一列（手機上卡片好掃太多）
   ② 逐時做成**橫向捲動條**,一個螢幕寬看得到八格,而不是八列
   ③ 遠一點的日子做成**逐日一行**,不是「12 小時一格 × 9 格」

   ※ 本程式的「逐時」實際上是**逐 3 小時**,官方最細就是這樣,
     所以每一格都標出時段起訖,不假裝是一小時。               */
function wxIcon(text, ts) {
  const w = String(text || '');
  const h = Number.isFinite(ts) ? new Date(ts).getHours() : 12;
  const night = h >= 18 || h < 6;
  if (/雷/.test(w)) return '⛈️';
  if (/雹/.test(w)) return '🌨️';
  if (/雪/.test(w)) return '❄️';
  if (/豪雨|大雨/.test(w)) return '🌧️';
  if (/雨/.test(w)) return night ? '🌧️' : '🌦️';
  if (/霧|靄/.test(w)) return '🌫️';
  if (/陰/.test(w)) return '☁️';
  if (/多雲/.test(w)) return night ? '☁️' : '⛅';
  if (/晴/.test(w)) return night ? '🌙' : '☀️';
  return night ? '🌙' : '☀️';
}

// 一天之內出現過的天氣,取「最該注意的那一個」當代表圖示
const WX_SEV = [[/雷/, 5], [/豪雨|大雨/, 4], [/雨/, 3], [/陰/, 2], [/多雲/, 1], [/晴/, 0]];
const wxSev = w => { for (const [re, n] of WX_SEV) if (re.test(String(w || ''))) return n; return 0; };

/* 把逐 3 小時（與後面 12 小時一格）的序列彙整成逐日。
   低溫／高溫取當天的極值,降雨機率取當天最大 —— 那是值班要問的
   「這一天會不會下」,不是平均起來的一個沒有意義的數字。 */
function townDays(ser) {
  const by = new Map();
  for (const x of ser) {
    const d = new Date(x.from);
    const k = `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
    if (!by.has(k)) by.set(k, { key: k, at: new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(),
      lo: null, hi: null, pop: null, wx: '', sev: -1, thunder: false });
    const g = by.get(k);
    if (Number.isFinite(x.t)) {
      g.lo = g.lo == null ? x.t : Math.min(g.lo, x.t);
      g.hi = g.hi == null ? x.t : Math.max(g.hi, x.t);
    }
    if (Number.isFinite(x.pop)) g.pop = g.pop == null ? x.pop : Math.max(g.pop, x.pop);
    const sv = wxSev(x.wx);
    if (sv > g.sev) { g.sev = sv; g.wx = x.wx; }
    if (isThunder(x.wx)) g.thunder = true;
  }
  return [...by.values()].sort((a, b) => a.at - b.at);
}

/* 一格的風級。官方若直接給了風級（Beaufort）就用官方的 ——
   自己拿 m/s 換算會跟官方的數字不一致,而值班看的是同一份預報。 */
const slotBf = x => Number.isFinite(x.bf) ? Math.round(x.bf)
  : (Number.isFinite(x.ws) ? ms2bf(x.ws) : null);

async function fetchForecast(key) {
  /* 資料集清單做成可以再加。使用者若找到更長的官方產品,貼進設定的
     「其他資料集」就能用,不必等我改版 —— 而我在這個環境查不到、
     也不該憑空塞一個代號進來（抓 W-C0034-003 就是那樣來的）。
     合併規則本來就是「照時間接續」,多幾支不會互相打架。 */
  const ids = [
    (DB.cfg.wx3h === undefined ? WX_3H_DEFAULT : DB.cfg.wx3h) || '',
    (DB.cfg.wxWk === undefined ? WX_WK_DEFAULT : DB.cfg.wxWk) || '',
    ...String(DB.cfg.wxMore || '').split(/[\s,、;；]+/),
  ].map(x => String(x).trim()).filter(Boolean);
  if (!ids.length) { WX = null; WX_ERR = ''; return; }
  const errs = [];
  const towns = new Map();
  for (const id of ids) {
    try {
      const j = await cwaJson(id, key);
      const list = parseTownFc(j);
      if (!list.length) { errs.push(`${id}：回應中找不到鄉鎮資料`); continue; }
      for (const t of list) {
        const ex = towns.get(t.name);
        if (!ex) { towns.set(t.name, t); continue; }
        /* 兩支資料集的同一個鄉鎮。不能只留先到的那一支:
           逐 3 小時只到 +2 天,一週預報才有第 3 天以後。
           所以同名欄位要「接續」—— 保留細的那一份,
           再把後面時間才開始的粗格接到尾巴。 */
        for (const k of Object.keys(t.els)) {
          if (!ex.els[k] || !ex.els[k].length) { ex.els[k] = t.els[k]; continue; }
          const end = Math.max(...ex.els[k].map(x => Number.isFinite(x.to) ? x.to : x.from));
          const tail = t.els[k].filter(x => x.from >= end);
          if (tail.length) ex.els[k] = ex.els[k].concat(tail).sort((a, b) => a.from - b.from);
        }
        if (ex.lat == null && t.lat != null) { ex.lat = t.lat; ex.lng = t.lng; }
      }
    } catch (e) { errs.push(`${id}：${(e && e.message) || e}`); }
  }
  if (!towns.size) { WX = null; WX_ERR = errs.join('；') || '沒有取得任何預報'; return; }
  WX = [...towns.values()];
  WX_AT = Date.now();
  WX_ERR = errs.join('；');
}

/* 站臺對到哪一個鄉鎮:優先用座標找最近的（資料集有給經緯度時）,
   沒有座標就退回「鄉鎮名稱包含該站所在縣市」的第一筆,再不行就不猜。 */
function townFor(st) {
  if (!WX || !WX.length || !st) return null;
  const withXY = WX.filter(t => Number.isFinite(t.lat) && Number.isFinite(t.lng));
  if (withXY.length && Number.isFinite(st.lat) && Number.isFinite(st.lng)) {
    let best = null;
    for (const t of withXY) {
      const km = distKm({ lat: st.lat, lng: st.lng }, { lat: t.lat, lng: t.lng });
      if (!best || km < best.km) best = { t, km };
    }
    if (best) return { town: best.t, km: Math.round(best.km), by: '座標' };
  }
  const c = cnorm(countyOf(st));
  if (c) {
    const hit = WX.find(t => cnorm(t.name).includes(c) || c.includes(cnorm(t.name)));
    if (hit) return { town: hit, km: null, by: '縣市' };
  }
  return null;
}

/* ── 閃電（落雷）─────────────────────────────────────────
   使用者拿官方檔案給我看,證明 O-A0039-001「過去 1 小時閃電偵測資料」
   確實存在。我上一輪說「開放資料裡沒有免費的閃電定位資料集」是**錯的**,
   這裡改正,並且把它做成這支程式回答「現在哪裡在打雷」的**主要來源**——
   它是實測的落雷點,不是特報那種區域性的判斷。

   一筆的內容（取自使用者提供的官方 KMZ）:
     <name>雲間閃電 1-2026-08-30 17:05</name>
     <description> 閃電種類: 雲間
       時間: 2026-08-30 17:05
       經緯度: 120.814 , 24.566</description>
     <TimeStamp><when>2026-08-30T09:05Z</when></TimeStamp>
     <Point><coordinates>120.814,24.566</coordinates></Point>
   種類有「對地」與「雲間」兩種。**對地才是打到地面的那一種**,
   對站臺設備的威脅完全不同,所以兩者一定要分開算。

   這支資料集官方是以 KML／KMZ 發布的。datastore 的 JSON 端點會不會
   一樣有,我在這個環境**無法確認** —— 所以下面的解析**兩種都接**:
   拿到 JSON 就走 JSON,拿到 XML 就當 KML 解。抓不到就明講。      */
let LTN = [], LTN_AT = 0, LTN_ERR = '', LTN_WIN = '', LTN_MANUAL = false;
// 落雷資料本身是幾點的（後端檔可能是二十幾分鐘前的）；LTN_AT 是抓到的時間。出門評估要看前者
let LTN_DATA = 0;
/* 「還沒設定」與「真的壞掉」分開記:後端沒金鑰、使用者也沒自備代理時,
   直連一定被 CORS 擋 —— 那是預期中的,不是故障。這裡放試過的細節,
   畫面上收在「技術細節」裡,主訊息講的是怎麼啟用。 */
let LTN_OFF = '';

const CG_RE = /對地/;          // 「雲對地」「對地」都算;「雲間」不算

function parseLightningKml(text) {
  const doc = new DOMParser().parseFromString(text, 'text/xml');
  if (doc.querySelector('parsererror')) return null;
  const out = [];
  // 標題會寫出資料涵蓋的時間區間,值班要知道這一小時是哪一小時
  const top = doc.querySelector('Document > name');
  if (top) LTN_WIN = top.textContent.replace(/^[^:：]*[:：]\s*/, '').trim();
  for (const pm of doc.querySelectorAll('Placemark')) {
    const co = pm.querySelector('Point > coordinates');
    if (!co) continue;
    const [lng, lat] = String(co.textContent).trim().split(',').map(parseFloat);
    if (!Number.isFinite(lat) || !Number.isFinite(lng)) continue;
    const desc = (pm.querySelector('description') || {}).textContent || '';
    const nm = (pm.querySelector('name') || {}).textContent || '';
    const when = (pm.querySelector('TimeStamp > when') || {}).textContent || '';
    const t = when ? Date.parse(when) : NaN;
    out.push({ lat, lng, t: Number.isFinite(t) ? t : 0, cg: CG_RE.test(desc + nm) });
  }
  return out;
}

/* JSON 端點若存在,形狀我沒有看過。用遞迴找「同時具備經緯度」的物件,
   而不是賭某一個固定路徑 —— 賭錯就是整份落空,而且是靜靜落空。 */
function parseLightningJson(j) {
  const out = [];
  const seen = new Set();
  const walk = (n, inhT, inhK) => {
    if (!n || typeof n !== 'object') return;
    if (Array.isArray(n)) { for (const x of n) walk(x, inhT, inhK); return; }
    const kind = String(pick(n, 'LightningType', 'lightningType', 'type', 'kind', '閃電種類') || inhK || '');
    const tRaw = pick(n, 'LightningTime', 'lightningTime', 'DateTime', 'dateTime', 'ObsTime', 'obsTime', 'time', '時間');
    const t = tRaw ? wxTime(typeof tRaw === 'object' ? pick(tRaw, 'DateTime', 'dateTime') : tRaw) : inhT;
    let lat = wxNum(pick(n, 'Latitude', 'latitude', 'lat', 'CoordinateLatitude'));
    let lng = wxNum(pick(n, 'Longitude', 'longitude', 'lon', 'lng', 'CoordinateLongitude'));
    // 也接 "lng,lat" 這種一欄兩個值的寫法
    const co = pick(n, 'coordinates', 'Coordinates');
    if ((lat == null || lng == null) && typeof co === 'string') {
      const p = co.split(',').map(parseFloat);
      if (p.length >= 2 && Number.isFinite(p[0]) && Number.isFinite(p[1])) { lng = p[0]; lat = p[1]; }
    }
    if (lat != null && lng != null && Math.abs(lat) <= 90 && Math.abs(lng) <= 180) {
      const k = `${lat},${lng},${t || 0}`;
      if (!seen.has(k)) { seen.add(k); out.push({ lat, lng, t: t || 0, cg: CG_RE.test(kind) }); }
    }
    for (const k in n) walk(n[k], t || inhT, kind || inhK);
  };
  walk(j && j.records ? j.records : j, 0, '');
  return out;
}

/* 這支資料集官方是以 **KML／KMZ** 發布的,不是一般的 JSON 資料集。
   上一版只打 datastore 的 JSON 端點,使用者實機得到「Load failed」——
   那多半就是因為這支根本不在 datastore 上,或它的回應沒有 CORS 標頭。

   所以改成**依序試幾個端點**,而且把每一個試過什麼、失敗在哪裡都留下來:
   ① 使用者自填的網址（設定裡可貼,{KEY}／{DS} 會被代換）
   ② fileapi 的 KML —— 官方就是以 KML 發布,先試這個
   ③ datastore 的 JSON —— 萬一平台也有一份
   每一個都先直連,直連被擋就走**通用網址代理**（就是停班停課那一支,
   它只是把公開網址原樣轉發,已經在用了）。最後才試 POST 式的 CWA 代理。

   全部失敗時,錯誤訊息會列出**試過哪些**,而不是只說一句 Load failed ——
   使用者才有辦法把正確的網址貼進設定,不必等我猜對。            */
let LTN_SRC = '';

/* ── KMZ（ZIP）直接在瀏覽器裡解開 ──────────────────────────
   上一版我寫「瀏覽器沒有函式庫解不開壓縮檔」。那句話**過時了** ——
   現代瀏覽器有 DecompressionStream('deflate-raw'),而 KMZ 就是一個
   標準 ZIP,裡面通常只有一個 doc.kml,壓縮方式是 deflate。
   四十行就讀得到,不必拉一個 JSZip 進來。

   做法照 ZIP 規格走中央目錄（不是本地檔頭）—— 本地檔頭在使用
   data descriptor 時大小欄位會是 0,中央目錄才一定有正確的大小。 */
async function unzipFirstKml(buf) {
  const u8 = new Uint8Array(buf);
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  // 尾端的 End of Central Directory：PK\x05\x06
  let eocd = -1;
  for (let i = u8.length - 22; i >= 0 && i > u8.length - 66000; i--) {
    if (u8[i] === 0x50 && u8[i + 1] === 0x4B && u8[i + 2] === 0x05 && u8[i + 3] === 0x06) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('不是有效的 ZIP（找不到中央目錄）');
  const count = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);

  const dec = new TextDecoder('utf-8');
  for (let n = 0; n < count; n++) {
    if (dv.getUint32(off, true) !== 0x02014b50) throw new Error('中央目錄格式不符');
    const method = dv.getUint16(off + 10, true);
    const compSize = dv.getUint32(off + 20, true);
    const nameLen = dv.getUint16(off + 28, true);
    const extraLen = dv.getUint16(off + 30, true);
    const cmtLen = dv.getUint16(off + 32, true);
    const local = dv.getUint32(off + 42, true);
    const name = dec.decode(u8.subarray(off + 46, off + 46 + nameLen));
    off += 46 + nameLen + extraLen + cmtLen;
    if (!/\.kml$/i.test(name)) continue;

    // 本地檔頭：資料從 local+30+nameLen+extraLen 開始（這兩個長度可能與中央目錄不同）
    if (dv.getUint32(local, true) !== 0x04034b50) throw new Error('本地檔頭格式不符');
    const lNameLen = dv.getUint16(local + 26, true);
    const lExtraLen = dv.getUint16(local + 28, true);
    const start = local + 30 + lNameLen + lExtraLen;
    const data = u8.subarray(start, start + compSize);
    if (method === 0) return dec.decode(data);        // 未壓縮
    if (method !== 8) throw new Error(`ZIP 壓縮方式 ${method} 不支援`);
    if (typeof DecompressionStream !== 'function') {
      throw new Error('這個瀏覽器沒有 DecompressionStream，讀不了壓縮檔');
    }
    const ds = new DecompressionStream('deflate-raw');
    const blob = new Blob([data]).stream().pipeThrough(ds);
    return dec.decode(await new Response(blob).arrayBuffer());   // guardrails: ignore —— 一小時的 KML 解開也才幾百 KB
  }
  throw new Error('ZIP 裡沒有 .kml');
}


function ltnUrls(ds, key) {
  const k = encodeURIComponent(key);
  const out = [];
  const custom = (DB.cfg.ltnUrl || '').trim();
  if (custom && (key || !custom.includes('{KEY}'))) {
    out.push({ tag: '自訂', url: custom.replace(/\{KEY\}/g, k).replace(/\{DS\}/g, ds) });
  }
  // 沒有授權碼時官方端點只會回 401,打了也是白打一輪
  if (!key) return out;
  const F ='https://opendata.cwa.gov.tw/fileapi/v1/opendataapi/' + ds;
  out.push({ tag: 'fileapi KML', url: `${F}?Authorization=${k}&downloadType=WEB&format=KML` });
  // KMZ 也試 —— 現在解得開壓縮檔了,而官方主要就是發 KMZ
  out.push({ tag: 'fileapi KMZ', url: `${F}?Authorization=${k}&downloadType=WEB&format=KMZ` });
  out.push({ tag: 'datastore JSON', url: `${CWA_BASE}/${ds}?Authorization=${k}&format=JSON` });
  return out;
}

async function fetchLightning(key) {
  key = String(key || '').trim();
  const ds = (DB.cfg.ltnSet === undefined ? LTN_DEFAULT : DB.cfg.ltnSet) || '';
  if (!ds) { LTN = []; LTN_AT = 0; LTN_ERR = ''; LTN_OFF = ''; LTN_SRC = ''; return; }
  /* 手動匯入的檔案在 30 分鐘內視為有效,不要被一次失敗的自動抓取蓋掉 ——
     使用者好不容易把檔案弄進來,按一下「更新」就沒了會很惱人。 */
  if (LTN_MANUAL && Date.now() - LTN_AT < 30 * 60000) return;

  /* 代理有兩個來源:落雷專用的（設定裡可填,{URL} 會被代換成編碼過的網址）,
     以及停班停課那一支通用的。專用的優先 —— 那支通用 Worker 是為了
     dgpa.gov.tw 做的,對別的網域回 500 是很合理的事。 */
  const lproxy = (DB.cfg.ltnProxy || '').trim();
  const gproxy = DB.cfg.dgpaProxy === undefined ? DGPA_PROXY_DEFAULT : String(DB.cfg.dgpaProxy || '');
  const cproxy = (DB.cfg.cwaProxy || '').trim();
  const viaProxy = (tpl, url) => tpl.includes('{URL}')
    ? tpl.replace(/\{URL\}/g, encodeURIComponent(url))
    : tpl + encodeURIComponent(url);
  const tried = [];
  let backendOff = false;

  /* 讀成 bytes 而不是文字 —— KMZ 是二進位的,先用 text() 讀會把它毀掉。
     失敗時把回應的開頭一小段也記下來:代理回 500 的時候,那一段
     常常就寫著原因（whitelist、缺參數之類）。 */
  const grab = async (label, run) => {
    try {
      const r = await run();
      const buf = await r.arrayBuffer();   // guardrails: ignore —— KMZ 是二進位,不能用 text();檔案只有幾十 KB
      if (!r.ok) {
        const head = new TextDecoder().decode(new Uint8Array(buf).subarray(0, 120))
          .replace(/\s+/g, ' ').trim();
        tried.push(`${label} HTTP ${r.status}${head ? `「${head}」` : ''}`);
        return null;
      }
      if (!buf.byteLength) { tried.push(`${label} 回應是空的`); return null; }
      LTN_SRC = label;
      return buf;
    } catch (e) {
      tried.push(`${label} ${(e && e.message) || e}`);
      return null;
    }
  };

  /* ── 先看同源的後端檔 ────────────────────────────────
     `data/lightning.json` 是 GitHub Actions 每十分鐘抓好放上來的。
     **同源就沒有 CORS 這件事** —— 不需要代理、不需要使用者做任何設定,
     而氣象署那些端點在瀏覽器裡是連一個位元組都拿不到的。

     代價是**時效**:排程最短五分鐘,而且實際觸發常常再延遲十幾分鐘。
     所以只在「夠新」的時候直接採用；太舊就往下走,再去試live 的端點。 */
  const backend = await (async () => {
    try {
      const r = await fetch('./data/lightning.json', { cache: 'no-store' });
      if (!r.ok) { tried.push(`後端檔 HTTP ${r.status}`); return null; }
      const j = await r.json();
      if (!j || j.hasKey === false) {
        backendOff = true; tried.push('後端檔：尚未設定 CWA_API_KEY'); return null;
      }
      if (j.error) { tried.push(`後端檔：${String(j.error).slice(0, 120)}`); return null; }
      const list = (j.strikes || []).map(x => ({
        lat: x.lat, lng: x.lng, t: x.t ? wxTime(x.t) : 0, cg: !!x.cg,
      })).filter(x => Number.isFinite(x.lat) && Number.isFinite(x.lng));
      const age = j.updated ? Date.now() - wxTime(j.updated) : Infinity;
      return { list, win: j.win || j.window || '', age, src: j.source || '' };
    } catch (e) { tried.push(`後端檔 ${(e && e.message) || e}`); return null; }
  })();
  // 30 分鐘內就直接用。再舊就先試 live,live 也不行時下面還會退回來。
  if (backend && backend.age < 30 * 60000) {
    LTN = backend.list; LTN_AT = Date.now(); LTN_ERR = ''; LTN_OFF = ''; LTN_MANUAL = false;
    LTN_DATA = Number.isFinite(backend.age) ? Date.now() - backend.age : 0;
    LTN_WIN = backend.win;
    LTN_SRC = `後端管線${backend.src ? '（' + backend.src + '）' : ''}`;
    return;
  }

  let buf = null;
  for (const c of ltnUrls(ds, key)) {
    buf = await grab(c.tag, () => fetch(c.url, { cache: 'no-store' }));
    if (buf) break;
    if (lproxy) {
      buf = await grab(`${c.tag}（落雷代理）`,
        () => fetch(viaProxy(lproxy, c.url), { cache: 'no-store' }));
      if (buf) break;
    }
    if (gproxy && gproxy !== lproxy) {
      buf = await grab(`${c.tag}（通用代理）`,
        () => fetch(viaProxy(gproxy, c.url), { cache: 'no-store' }));
      if (buf) break;
    }
  }
  if (!buf && cproxy && key) {
    buf = await grab('CWA 代理', () => fetch(cproxy, {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ cwaDataset: ds, cwaKey: key, cwaParams: {} }),
    }));
  }

  if (!buf) {
    /* live 也拿不到 —— 有一份舊的後端檔總比什麼都沒有好,
       但一定要標出它有多舊,不能讓人以為是現在的。 */
    // 0 筆也是答案（那一小時沒有落雷）——以前只收有落雷的,沒雷的時候反而變成「沒有落雷資料」
    if (backend) {
      LTN = backend.list; LTN_AT = Date.now(); LTN_ERR = ''; LTN_OFF = ''; LTN_MANUAL = false;
      LTN_DATA = Number.isFinite(backend.age) ? Date.now() - backend.age : 0;
      LTN_WIN = backend.win;
      LTN_SRC = `後端管線（${Math.round(backend.age / 60000)} 分鐘前）`;
      return;
    }
    LTN = []; LTN_SRC = ''; LTN_AT = 0;
    /* 後端沒金鑰、使用者也沒有自己架落雷代理或自訂網址 —— 直連被擋是必然的,
       這是「還沒設定」。有自己設過路線卻失敗,才是「壞掉」要亮紅燈。
       （通用代理是停班停課用的,對氣象署回錯是預期中的,不算使用者設過。） */
    const ownRoute = lproxy || (DB.cfg.ltnUrl || '').trim() || (cproxy && key);
    if (backendOff && !ownRoute) {
      LTN_ERR = '';
      LTN_OFF = tried.join('；');
      return;
    }
    LTN_OFF = '';
    LTN_ERR = `${ds}：${tried.length} 種方式都失敗 —— ${tried.join('；')}`;
    return;
  }

  const u8 = new Uint8Array(buf);
  let body;
  // PK\x03\x04 = ZIP。KMZ 就是一個 ZIP,裡面通常只有 doc.kml。
  if (u8[0] === 0x50 && u8[1] === 0x4B && u8[2] === 0x03 && u8[3] === 0x04) {
    try { body = await unzipFirstKml(buf); }
    catch (e) {
      LTN = []; LTN_AT = 0; LTN_OFF = '';  // 失敗時不能留著上一輪的時間,否則畫面會說「沒有落雷」
      LTN_ERR = `${ds}：${LTN_SRC} 回應是 KMZ，但解壓縮失敗（${(e && e.message) || e}）`;
      return;
    }
  } else {
    body = new TextDecoder('utf-8').decode(u8);
  }
  body = String(body).replace(/^﻿/, '').trim();

  let list = null;
  if (/^[[{]/.test(body)) {
    try { list = parseLightningJson(JSON.parse(body)); }
    catch (e) { list = null; }
  }
  if ((!list || !list.length) && /^</.test(body)) list = parseLightningKml(body);

  if (!list) {
    LTN = []; LTN_AT = 0; LTN_OFF = '';  // 失敗時不能留著上一輪的時間,否則畫面會說「沒有落雷」
    /* 開頭是 PK 但沒有走到解壓縮那條路,代表 ZIP 檔頭不完整 ——
       多半是只下載到一半,或代理把二進位內容當成文字轉過一手。
       講「格式無法辨識」對排查沒有幫助,講「像壓縮檔但壞了」才有。 */
    LTN_ERR = /^PK/.test(body)
      ? `${ds}：${LTN_SRC} 回應看起來是壓縮檔（ZIP／KMZ）但檔頭不完整，`
        + '可能只下載到一半，或代理把二進位內容當成文字轉過一手'
      : `${ds}：${LTN_SRC} 回應格式無法辨識（開頭是「${body.slice(0, 24)}」）`;
    return;
  }
  /* 解析成功但一筆都沒有 —— 那是**正常的**:沒有雷的時候本來就是空的。
     不能當成失敗,否則風平浪靜的日子天天報錯。 */
  LTN = list; LTN_AT = Date.now(); LTN_ERR = ''; LTN_OFF = ''; LTN_MANUAL = false; LTN_DATA = LTN_AT;
}

/* ── 手動匯入落雷檔 ───────────────────────────────────────
   自動抓取被 CORS 與代理擋住時,值班的人手上其實有辦法:
   到氣象署網站把 KMZ／KML 下載下來,直接餵給這支程式。
   現在解得開 ZIP,所以 KMZ 原檔就能用,不必先自己解壓縮。

   這是**逃生口不是正路** —— 它是靜態的一份檔案,不會自己更新,
   所以畫面上一定標明「手動匯入」與資料涵蓋的時間。         */
function importLightningFile(e) {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  /* 一小時的全臺落雷 KMZ 只有幾十 KB。整檔讀進記憶體只在檔案夠小時才安全 ——
     選錯成一支影片的話,iPhone 分頁會直接被系統砍掉。 */
  if (f.size > 20 * 1024 * 1024) {
    toast(`這個檔案有 ${(f.size / 1048576).toFixed(0)} MB，不像落雷檔（通常不到 1 MB）`);
    return;
  }
  const r = new FileReader();
  r.onerror = () => { LTN_ERR = '讀不到這個檔案'; renderTyphoon({}); };
  r.onload = async () => {
    try {
      const buf = r.result;
      const u8 = new Uint8Array(buf);
      let text;
      if (u8[0] === 0x50 && u8[1] === 0x4B && u8[2] === 0x03 && u8[3] === 0x04) {
        text = await unzipFirstKml(buf);
      } else {
        text = new TextDecoder('utf-8').decode(u8).replace(/^\uFEFF/, '');
      }
      let list = null;
      if (/^\s*[[{]/.test(text)) { try { list = parseLightningJson(JSON.parse(text)); } catch (err) { list = null; } }
      if ((!list || !list.length) && /^\s*</.test(text)) list = parseLightningKml(text);
      if (!list) throw new Error(`認不出這個檔案的格式（開頭是「${text.slice(0, 24)}」）`);
      LTN = list; LTN_AT = Date.now(); LTN_ERR = ''; LTN_MANUAL = true; LTN_DATA = LTN_AT;
      LTN_SRC = '手動匯入 ' + f.name;
      toast(`已匯入 ${list.length} 筆落雷（${list.filter(x => x.cg).length} 筆對地）`);
      renderTyphoon({});
    } catch (err) {
      LTN_ERR = `檔案匯入失敗：${(err && err.message) || err}`;
      renderTyphoon({});
      toast('落雷檔匯入失敗');
    }
  };
  r.readAsArrayBuffer(f);   // guardrails: ignore —— 上面已擋掉 20 MB 以上
}

/* 這一站周圍有幾次落雷。**雲對地與雲間分開算** ——
   雲間閃電不會打到設備,把兩者加在一起會把數字灌水一倍以上
   （官方那份樣本裡 124 筆中有 91 筆是雲間）。 */
function strikesNear(st, km) {
  const R = km || ltnRadius();
  const out = { cg: 0, ic: 0, nearest: null, last: 0 };
  if (!LTN.length || !st || !Number.isFinite(st.lat)) return out;
  for (const s of LTN) {
    const d = distKm({ lat: st.lat, lng: st.lng }, { lat: s.lat, lng: s.lng });
    if (d > R) continue;
    if (s.cg) out.cg++; else out.ic++;
    if (!out.nearest || d < out.nearest.d) out.nearest = { d, t: s.t, cg: s.cg };
    if (s.t > out.last) out.last = s.t;
  }
  return out;
}
const ltnRadius = () => {
  const v = +DB.cfg.ltnKm;
  return Number.isFinite(v) && v > 0 ? clamp(v, 1, 100) : 15;
};

const ADV_SETS = ['W-C0033-002', 'W-C0033-003', 'W-C0033-001'];

async function fetchAdvisory(key) {
  let lastErr = '';
  for (const ds of ADV_SETS) {
    let j;
    try { j = await cwaJson(ds, key); }
    catch (e) { lastErr = (e && e.message) || String(e); continue; }
    const list = j && advFrom(j);
    if (list) { _advDiag = ''; return list; }
  }
  _advDiag = lastErr;
  return [];
}
// 一份特報回應 → 生效中的雨、雷特報（同一種合併地區）。沒有可用的回 null。後端 data/wx.json 的 adv 也走這裡
function advFrom(j) {
  const now = Date.now();
  const raw = [];
  walkAdvisory(j.records || j, '', 0, raw);
  const keep = raw
    .map(a => Object.assign({}, a, { cat: advCat(a.kind) }))
    .filter(a => a.cat)                        // 只留雨與雷這兩類
    .filter(a => !a.end || a.end > now);       // 過期的擺著會讓人以為還在生效
  if (!keep.length) return null;

  const byKind = new Map();                    // 同一種特報合併地區,不要一縣市一張卡
  for (const a of keep) {
    const cur = byKind.get(a.kind) || { kind: a.kind, cat: a.cat, areas: [], end: 0 };
    for (const x of a.areas) if (!cur.areas.includes(x)) cur.areas.push(x);
    cur.end = Math.max(cur.end, a.end || 0);
    byKind.set(a.kind, cur);
  }
  /* 雷排在雨前面 —— 對站臺來說雷是立即要動作的,雨是要盯著的。 */
  const order = ['大雷雨', '雷雨', '閃電', '超大豪雨', '大豪雨', '豪雨', '大雨'];
  return [...byKind.values()].sort((x, y) => {
    const a = order.findIndex(o => x.kind.includes(o));
    const b = order.findIndex(o => y.kind.includes(o));
    return (a < 0 ? 99 : a) - (b < 0 ? 99 : b);
  });
}

/* ── 後端 data/wx.json（scripts/fetch_wx.py）────────────────
   沒填授權碼的同事也有雨量、陣風、特報。時間用檔案裡的觀測時間,不是「現在」——
   後端排程慢（實際 3～5 小時一次）的時候,畫面上要看得出資料有多舊。 */
let WX_SRC = '';                       // 'key'＝自己的授權碼抓的、'backend'＝後端檔、''＝都沒有
async function fetchWxBackend() {
  const j = await getJSON(new URL('data/wx.json', location.href).href, 9000, { cache: 'no-cache' }).catch(() => null);
  if (!j || !j.hasKey) return false;
  // 尾巴省略的欄位是 0（乾的站只存站名座標）；null 是測站沒給值,不能當 0
  const v = (r, i) => r.length > i ? r[i] : 0;
  // 鄉鎮在另一列（tw[i] 是第 i 列在 towns 的第幾個）；舊的後端檔沒有就空著
  const dec = (blk, f) => blk && Array.isArray(blk.rows) && blk.rows.length
    ? { at: wxTime(blk.t) || 0, list: blk.rows.map((r, i) => Object.assign(f(r, wxTime(blk.t) || 0),
        { town: (blk.towns || [])[(blk.tw || [])[i]] || '' })) } : null;
  // 第四欄是縣市（counties 的第幾個）：countyOf 靠最近雨量站的縣市判斷站臺在哪個縣市
  const cty = (blk, r) => (blk.counties || [])[r[3]] || '';
  const rain = dec(j.rain, (r, at) => ({ name: r[0], id: '', pos: { lat: r[1], lng: r[2] }, at, county: cty(j.rain, r),
    now: v(r, 4), h1: v(r, 5), h3: v(r, 6), h24: v(r, 7), day: null }));
  const wind = dec(j.wind, (r, at) => ({ name: r[0], id: '', pos: { lat: r[1], lng: r[2] }, at, county: cty(j.wind, r),
    wind: v(r, 4), gust: v(r, 5), dir: null }));
  const useR = rain && !RAIN.length, useW = wind && !OBS.length;
  if (useR) { RAIN = rain.list; RAIN_AT = rain.at; }
  if (useW) { OBS = wind.list; OBS_AT = wind.at; }
  if (j.adv && !ADV.length) ADV = advFrom({ records: j.adv }) || [];
  const fc = decodeFc(j.fc);
  if (fc && !(WX && WX.length)) { WX = fc; WX_AT = wxTime(j.updated) || Date.now(); WX_ERR = ''; }
  if (useR || useW) WX_SRC = 'backend';
  return !!(rain || wind || fc);
}
/* 後端的縣市預報（F-D0047-089 接 091）→ 跟 parseTownFc 一樣的形狀,後面 townSeries、出門建議都不用分來源。
   每格 [距 t 幾小時, 長幾小時, 天氣現象序號, 降雨機率, 溫度, 平均風級]；null＝官方沒給（不是 0）。 */
function decodeFc(fc) {
  const t0 = fc ? wxTime(fc.t) : NaN;
  if (!Number.isFinite(t0) || !Array.isArray(fc.towns) || !fc.towns.length) return null;
  const W = fc.wx || [], blank = { v: '', code: '', ws: '', bf: '', wd: '' };
  return fc.towns.map(([name, lat, lng, sl]) => {
    const S = (sl || []).map(x => ({ from: t0 + x[0] * 3600000, to: t0 + (x[0] + x[1]) * 3600000, x }));
    const el = (i, f) => S.filter(s => s.x[i] != null).map(s => ({ ...blank, from: s.from, to: s.to, ...f(s.x[i]) }));
    return { name, lat, lng, els: {
      天氣現象: S.map(s => ({ ...blank, from: s.from, to: s.to, v: W[s.x[2]] || '' })),
      降雨機率: el(3, v => ({ v: String(v) })), 溫度: el(4, v => ({ v: String(v) })), 風速: el(5, v => ({ bf: String(v) })) } };
  });
}

/* ── 中央氣象署 O-A0002-001 自動雨量站 ──────────────────────
   颱風真正致災的往往是雨,不是風。關機門檻看風,但值班的人要知道
   現在雨下到什麼程度 —— 尤其山區站臺,路先斷的機會比風吹壞設備高。   */
let RAIN = [], RAIN_AT = 0;

/* 中央氣象署的雨量分級定義（豪大雨特報標準）。
   由大到小排,第一個達標的就是等級。                                */
const RAIN_LEVELS = [
  { name: '超大豪雨', h24: 500, col: '#B0186B' },
  { name: '大豪雨',   h24: 350, col: '#EF5B4C' },
  { name: '豪雨',     h24: 200, h3: 100, col: '#EF8A35' },
  { name: '大雨',     h24: 80,  h1: 40,  col: '#EFC935' },
];

/* ── 停班停課雨量基準：《天然災害停止上班及上課作業辦法》第四條附表 ──
   「各通報權責機關停止上班上課雨量參考基準一覽表」,單位為
   **未來 24 小時累積雨量預測／毫米**。各縣市不一樣,不是一律 350/200:

   - 多數縣市不分山區平地,一律 350
   - 桃園、新竹縣、苗栗、臺中、南投、雲林、嘉義縣、高雄、臺東：山區 200 / 平地 350
   - 連江縣：200（不分山區平地）
   - 三個縣另訂「實際觀測」值 —— 附表備註二寫明它同樣「作為決定及通報依據」：
     南投縣平地 300、宜蘭縣 250、連江縣 180。

   兩個門檻是兩件事,不能混：
   **預測** 值要拿氣象署的預報去比（本程式改看豪大雨特報的分級,口徑相同）；
   **實際觀測** 值要拿雨量站實測的 24 小時累積去比 —— 只有上面那三個縣有,
   其餘縣市拿實測去比 350 只是參考,不是官方基準。                        */
const DGPA_HILL = 200, DGPA_FLAT = 350;          // 附表未列的縣市用這組
/* flat/hill：預測基準；obs：實際觀測基準（沒有就是沒有訂）；
   obsZone：實際觀測基準適用的地形（'all' 或 'flat'）。 */
const DGPA_COUNTY = {
  基隆市: { flat: 350, hill: 350 },
  臺北市: { flat: 350, hill: 350 },
  新北市: { flat: 350, hill: 350 },
  桃園市: { flat: 350, hill: 200 },
  新竹市: { flat: 350, hill: 350 },
  新竹縣: { flat: 350, hill: 200 },
  苗栗縣: { flat: 350, hill: 200 },
  臺中市: { flat: 350, hill: 200 },
  彰化縣: { flat: 350, hill: 350 },
  南投縣: { flat: 350, hill: 200, obs: 300, obsZone: 'flat' },
  雲林縣: { flat: 350, hill: 200 },
  嘉義市: { flat: 350, hill: 350 },
  嘉義縣: { flat: 350, hill: 200 },
  臺南市: { flat: 350, hill: 350 },
  高雄市: { flat: 350, hill: 200 },
  屏東縣: { flat: 350, hill: 350 },
  宜蘭縣: { flat: 350, hill: 350, obs: 250, obsZone: 'all' },
  花蓮縣: { flat: 350, hill: 350 },
  臺東縣: { flat: 350, hill: 200 },
  澎湖縣: { flat: 350, hill: 350 },
  金門縣: { flat: 350, hill: 350 },
  連江縣: { flat: 200, hill: 200, obs: 180, obsZone: 'all' },
};
// 臺／台混用是常態,查表前先正規化
const cnorm = v => String(v || '').replace(/[臺台]/g, '台');
const DGPA_BY_NORM = (() => {
  const m = {};
  for (const [k, v] of Object.entries(DGPA_COUNTY)) m[cnorm(k)] = Object.assign({ name: k }, v);
  return m;
})();
/* 各縣市政府所在地的座標,拿來做「全臺推估」的代表點。
   一個縣市當然不只一個點 —— 但停班停課本來就是以縣市為單位宣布的,
   拿縣治當代表是這個尺度下講得通的取法。lat 同時用來由北到南排序。
   （山區縣市的代表點在縣治,不在山上;所以山區的雨量款仍然靠特報,
     那份特報本來就會寫「臺中市山區」。） */
const COUNTY_PT = {
  連江縣: { lat: 26.160, lng: 119.951 },
  基隆市: { lat: 25.128, lng: 121.741 },
  臺北市: { lat: 25.038, lng: 121.563 },
  新北市: { lat: 25.012, lng: 121.465 },
  桃園市: { lat: 24.993, lng: 121.301 },
  新竹市: { lat: 24.806, lng: 120.968 },
  新竹縣: { lat: 24.827, lng: 121.014 },
  宜蘭縣: { lat: 24.702, lng: 121.738 },
  苗栗縣: { lat: 24.560, lng: 120.821 },
  金門縣: { lat: 24.436, lng: 118.317 },
  臺中市: { lat: 24.148, lng: 120.674 },
  彰化縣: { lat: 24.075, lng: 120.544 },
  花蓮縣: { lat: 23.991, lng: 121.601 },
  南投縣: { lat: 23.913, lng: 120.685 },
  雲林縣: { lat: 23.708, lng: 120.431 },
  澎湖縣: { lat: 23.566, lng: 119.579 },
  嘉義市: { lat: 23.480, lng: 120.449 },
  嘉義縣: { lat: 23.452, lng: 120.255 },
  臺南市: { lat: 22.999, lng: 120.227 },
  臺東縣: { lat: 22.755, lng: 121.150 },
  高雄市: { lat: 22.627, lng: 120.302 },
  屏東縣: { lat: 22.551, lng: 120.549 },
};
/* 排法:西部由北至南 → 東部（宜、花、東）→ 外離島（澎、金、馬）。
   純照緯度排會把連江縣擺在最前面、金門插在苗栗與臺中之間 ——
   緯度上沒錯,但看的人是照著臺灣本島從上往下找自己的縣市,
   離島夾在中間會讓那條線斷掉。所以分三組,組內才照緯度由北至南。 */
const COUNTY_GROUPS = [
  { label: '西部', names: ['基隆市', '臺北市', '新北市', '桃園市', '新竹縣', '新竹市', '苗栗縣',
      '臺中市', '彰化縣', '南投縣', '雲林縣', '嘉義市', '嘉義縣', '臺南市', '高雄市', '屏東縣'] },
  { label: '東部', names: ['宜蘭縣', '花蓮縣', '臺東縣'] },
  // 外離島用慣用的「澎金馬」順序,不照緯度 —— 那三個字本來就是一組固定的講法
  { label: '外離島', names: ['澎湖縣', '金門縣', '連江縣'] },
];
const COUNTIES_NS = COUNTY_GROUPS.flatMap(g => g.names);

function dgpaRule(county, terrain) {
  const r = DGPA_BY_NORM[cnorm(county)];
  const hill = terrain === 'hill';
  if (!r) {
    return { county: county || '', known: false, label: hill ? '山區' : '平地',
      fc: hill ? DGPA_HILL : DGPA_FLAT, obs: null };
  }
  return {
    county: r.name, known: true, label: hill ? '山區' : '平地',
    fc: hill ? r.hill : r.flat,
    // 實際觀測基準只在它適用的地形上成立
    obs: (r.obs != null && (r.obsZone === 'all' || (r.obsZone === 'flat' && !hill))) ? r.obs : null,
    uniform: r.hill === r.flat,
  };
}

const TERRAIN = {
  flat: { label: '平地', thr: DGPA_FLAT, col: '#B0186B' },
  hill: { label: '山區', thr: DGPA_HILL, col: '#EF5B4C' },
};

/* 一個站臺只適用一個基準 —— 它不是平地就是山區。
   同時列出兩個門檻是錯的:岸際雷達拿到 240 mm 不該被標成「已達山區基準」。
   地形記在類別上（雷達站一律平地、中繼站臺山區）,個別站臺可以覆寫
   —— 同一種設備架在山上還是海邊,是位置的事,不是設備的事。 */
function terrainOf(st) {
  const own = st && st.terrain;
  if (own === 'flat' || own === 'hill') return own;
  const t = st && DB.types.find(x => x.id === st.type);
  return t && t.terrain === 'hill' ? 'hill' : 'flat';
}

/* 拿「實測」的 24 小時累積去比停班停課基準。
   附表裡只有南投（平地 300）、宜蘭（250）、連江（180）訂了實際觀測基準,
   那三個縣的實測達標是**官方依據**;其餘縣市附表只給預測值,
   拿實測去比 350／200 充其量是參考,所以回傳裡把兩者分開標。 */
function dgpaMark(h24, st) {
  if (h24 == null) return null;
  const k = terrainOf(st), T = TERRAIN[k];
  const rule = dgpaRule(countyOf(st), k);
  // 有訂實際觀測基準就用它（那是官方的）,沒有就退回預測值當參考
  const thr = rule.obs != null ? rule.obs : (rule.fc != null ? rule.fc : T.thr);
  if (h24 < thr) return null;
  return {
    t: `已達${T.label}基準`, terrain: k, label: T.label, thr,
    official: rule.obs != null, county: rule.county, col: T.col,
  };
}

/* 這個類別的站臺要不要進回報稿。中繼站臺是自用監看,不進交接通報。 */
const inReport = st => {
  const t = st && DB.types.find(x => x.id === st.type);
  return !(t && t.noReport);
};

function rainLevel(r) {
  if (!r) return null;
  for (const L of RAIN_LEVELS) {
    if ((L.h24 != null && r.h24 != null && r.h24 >= L.h24) ||
        (L.h3  != null && r.h3  != null && r.h3  >= L.h3)  ||
        (L.h1  != null && r.h1  != null && r.h1  >= L.h1)) return L;
  }
  return null;
}

function parseRainStation(o) {
  const base = stationBase(o);
  if (!base) return null;

  let now = null, h1 = null, h3 = null, h24 = null, day = null;
  const re = pick(o, 'RainfallElement', 'rainfallElement', 'WeatherElement', 'weatherElement');
  if (Array.isArray(re)) {
    // 舊版：RAIN 是當日累積,HOUR_x 是時段累積
    now = legacyEl(re, 'MIN_10'); h1 = legacyEl(re, 'HOUR_1');
    h3 = legacyEl(re, 'HOUR_3'); h24 = legacyEl(re, 'HOUR_24');
    day = legacyEl(re, 'RAIN');
  } else if (re && typeof re === 'object') {
    const g = (...ks) => {
      const v = pick(re, ...ks);
      if (v == null) return null;
      // 新版每個時段是 {Precipitation: 12.5} 這樣的物件
      return obsNum(typeof v === 'object' ? pick(v, 'Precipitation', 'precipitation') : v);
    };
    now = g('Past10Min', 'past10Min', 'Past10min');
    h1  = g('Past1hr', 'past1hr', 'Past1Hr');
    h3  = g('Past3hr', 'past3hr', 'Past3Hr');
    h24 = g('Past24hr', 'past24hr', 'Past24Hr');
    day = g('Now', 'now');
  }
  if (now == null && h1 == null && h3 == null && h24 == null && day == null) return null;

  return Object.assign(base, { now, h1, h3, h24, day });
}

async function fetchRain(key) {
  const j = await cwaJson('O-A0002-001', key);
  const list = pick(j && j.records ? j.records : {}, 'Station', 'station', 'location', 'Location');
  return Array.isArray(list) ? list.map(parseRainStation).filter(Boolean) : [];
}

/* 最近的測站超過這個距離就不採用。
   隔著一座山的測站量到的風,跟站臺現場沒有關係,擺出來只會誤導。 */
const OBS_MAX_KM = 60;

function nearestIn(list, st) {
  if (!list.length || !st || !Number.isFinite(st.lat) || !Number.isFinite(st.lng)) return null;
  const p = { lat: st.lat, lng: st.lng };
  let best = null;
  for (const o of list) {
    const km = distKm(p, o.pos);
    if (!best || km < best.km) best = { o, km };
  }
  return best && best.km <= OBS_MAX_KM ? best : null;
}
const nearestObs = st => nearestIn(OBS, st);
const nearestRain = st => nearestIn(RAIN, st);

/* 實測風級看**最大陣風**（判斷基準是陣風）。
   測站沒報陣風時用平均風 ×GUST_FACTOR 估,並標明是估的 —— 不能把估的講成量的。 */
function obsGust(ob) {
  if (!ob) return null;
  if (ob.o.gust != null) return { bf: ms2bf(ob.o.gust), est: false };
  if (ob.o.wind != null) return { bf: ms2bf(ob.o.wind * GUST_FACTOR), est: true };
  return null;
}
const obsBf = ob => { const g = obsGust(ob); return g ? g.bf : null; };

/* ── 中央氣象署 W-C0034-001 颱風警報單 ─────────────────────
   風哨自己算的發布時機是模式推估；氣象署實際發布的警報單才是單位行動的依據。
   排除標題含「解除」與已過期的兩種，那都代表警報已不生效。
   任何解析失敗一律回「無警報」而不是拋錯 —— 警報單只是加分資訊，
   不該因為它的格式有變動就把整個颱風頁弄壞。                        */
const NO_WARNING = { active: false, headline: '', issuedAt: '', expires: '',
                     areas: [], isLand: false, isSea: false };
async function fetchWarningCWA(key) {
  let records;
  try {
    const j = await cwaJson('W-C0034-001', key);
    records = j && j.records;
  } catch (e) { return NO_WARNING; }
  return parseWarning(records);
}
/* 每一報的「第幾報、類別、颱風編號、幾點生效」。後端 fetch_typhoon.py 的 bulletins() 取同樣五個欄位,
   把每一報都記下來（warnLog）——警報單只有目前這一報,第 4 報裡不會寫第 1 報是幾點發的。
   使用者自填授權碼時,前端自己抓到的那一報也用這裡記進本機。 */
function parseBulletins(records) {
  const out = [];
  for (const info of toArr(records && records.info)) {
    if (!info || typeof info !== 'object') continue;
    const head = String(info.headline || ''), eff = String(info.effective || info.onset || '');
    if (!head || !eff) continue;
    const b = { ty: '', name: '', no: null, sub: 0, kind: '', headline: head, effective: eff };
    for (const t of toArr(info.description && info.description['typhoon-info'])) {
      for (const sc of toArr(t && t.section)) {
        if (!sc) continue;
        if (sc.title === '警報報數') {
          // 加報寫成「5-1」：陸上警報常用加報發布，只認純數字的話這一報整份沒有報數
          const m = /^\s*(\d+)\s*(?:[-－—]\s*(\d+))?\s*$/.exec(String(sc.value));
          if (m) { b.no = +m[1]; b.sub = +(m[2] || 0); }
        }
        else if (sc.title === '警報類別') b.kind = String(sc.value || '');
        else if (sc.title === '颱風編號') b.ty = String(sc.value || '');
        else if (sc.title === '颱風資訊') b.name = String(sc.cwa_typhoon_name || '');
      }
    }
    out.push(b);
  }
  return out;
}

function parseWarning(records) {
  const none = NO_WARNING;
  if (!records || typeof records !== 'object') return none;

  const list = Array.isArray(records.info) ? records.info
    : (records.info ? [records.info] : []);
  const now = Date.now();
  const bl = parseBulletins(records);
  for (const info of list) {
    if (!info || typeof info !== 'object') continue;
    let text = String(info.headline || '');
    if (!text) {
      const ps = Array.isArray(info.parameter) ? info.parameter
        : (info.parameter ? [info.parameter] : []);
      const t = ps.find(p => p && p.valueName === 'alert_title');
      text = t ? String(t.value || '') : '';
    }
    if (!text || text.includes('解除')) continue;
    /* expires 是「下一報預計發布的時間」,不是警報結束。過了它還沒收到新的一報,
       多半是我們這邊排程晚了（GitHub 排程常延遲數小時）,不是警報解除了。
       以前這裡直接當成沒有警報 —— 沒收到資料被畫成沒事。改成照樣顯示並標「可能已有新報」。 */
    const expires = String(info.expires || '');
    const ex = expires ? Date.parse(expires) : NaN;
    const rawAreas = Array.isArray(info.area) ? info.area
      : (info.area ? [info.area] : []);
    const me = bl.find(b => b.headline === text) || {};
    // 警報單的文字段落（命名與位置、移速與預測…）：總覽要引用官方的位置描述,不自己湊
    const sec = {};
    toArr(info.description && info.description.section).forEach(x => {
      if (x && x.title && x.value) sec[String(x.title)] = String(x.value);
    });
    return {
      active: true, sec,
      headline: text,
      issuedAt: String(info.effective || info.onset || ''),
      expires,
      stale: Number.isFinite(ex) && ex < now,
      no: me.no != null ? noTxt(me) : null, tyNo: me.ty || '', kind: me.kind || '',
      areas: rawAreas.map(a => a && a.areaDesc).filter(Boolean).map(String),
      isLand: text.includes('陸上'),
      isSea: text.includes('海上'),
      bulletins: bl,
    };
  }
  return Object.assign({}, none, { bulletins: bl });
}

/* ── 警報發布時間 ─────────────────────────────────────────
   使用者要「官方發布海上、陸上警報的時間」。來源是 warnLog（後端每一報都記）
   加上本機自己抓到的那幾報。判斷規則：
   · 海上警報＝這顆颱風第一份含「海上」的報。是第 1 報才確定；不是第 1 報代表前面沒收到,
     只能依每 3 小時一報往回推,標「推算」。
   · 陸上警報＝第一份含「陸上」的報。前一報有收到而且還沒有陸上 → 確定;
     前一報沒收到 → 只能說「最晚某時已發布」。
   · 解除＝第一份「解除」。
   推算的一律寫明是推算——發布時間是要寫進通報的,不能把猜的寫成官方的。 */
const WLOG_MAX = 300;
function mergeWlog(list) {
  const cur = Array.isArray(DB.ty.wlog) ? DB.ty.wlog : [];
  // 同一報＝同一顆颱風、同一個生效時間（舊版解析可能把加報的報數存成 null，不拿報數當鍵）
  const key = b => `${b.ty}|${b.effective}`;
  const seen = new Set(cur.map(key));
  let added = 0;
  for (const b of list || []) {
    if (!b || !b.effective || seen.has(key(b))) continue;
    cur.push({ ty: String(b.ty || ''), name: String(b.name || ''), no: Number.isFinite(b.no) ? b.no : null,
               sub: Number.isFinite(b.sub) ? b.sub : 0,
               kind: String(b.kind || ''), headline: String(b.headline || ''), effective: String(b.effective) });
    seen.add(key(b)); added++;
  }
  cur.sort((a, b) => Date.parse(a.effective) - Date.parse(b.effective));
  DB.ty.wlog = cur.slice(-WLOG_MAX);
  return added;
}
const wIsEnd = b => /解除/.test(b.headline) || /END/i.test(b.kind);
const wIsLand = b => !wIsEnd(b) && (/陸上/.test(b.headline) || /LAND/i.test(b.kind));
const wIsSea = b => !wIsEnd(b) && (/海上/.test(b.headline) || /SEA/i.test(b.kind));
function warnTimes(ty) {
  if (!ty) return null;
  const L = (DB.ty.wlog || []).filter(b =>
    (ty.tyNo && b.ty === ty.tyNo) || (!ty.tyNo && b.name && b.name === ty.name));
  if (!L.length) return null;
  // 照發布時間排：加報（5-1）夾在第 5、第 6 報之間,時間序本來就對
  L.sort((a, b) => Date.parse(a.effective) - Date.parse(b.effective));
  const sf = L.find(wIsSea), lf = L.find(wIsLand), ef = L.find(wIsEnd);
  const sea = sf && { t: Date.parse(sf.effective), no: noTxt(sf), exact: sf.no === 1 && !sf.sub };
  if (sea && !sea.exact && sf.no > 1) sea.guess = sea.t - (sf.no - 1) * 3 * 3600000;
  /* 陸上警報確定與否：它的前一報有收到、而且還沒有陸上 → 確定。
     前一報＝加報 5-1 的前一報是第 5 報；整報 6 的前一報是第 5 報或 5-x 加報。 */
  const prev = lf && L.filter(b => Date.parse(b.effective) < Date.parse(lf.effective)).pop();
  const adj = prev && lf && (lf.sub ? prev.no === lf.no && (prev.sub || 0) === lf.sub - 1 : prev.no === lf.no - 1);
  const land = lf && { t: Date.parse(lf.effective), no: noTxt(lf),
    exact: (lf.no === 1 && !lf.sub) || !!(adj && !wIsLand(prev)) };
  const end = ef && { t: Date.parse(ef.effective), no: noTxt(ef) };
  /* 解除陸上警報（應變縮編的官方訊號）：最後一份陸上警報單之後的下一份（改回海上、或直接解除）。
     兩份報數相連才是確定時間；中間漏收了幾報就只能說「最晚此時」。 */
  const li = L.map(wIsLand).lastIndexOf(true), nx = li >= 0 ? L[li + 1] : null;
  const landOff = nx && { t: Date.parse(nx.effective), no: noTxt(nx),
    exact: nx.sub ? L[li].no === nx.no && (L[li].sub || 0) === nx.sub - 1 : L[li].no === nx.no - 1 };
  const last = L[L.length - 1];
  return { sea, land, landOff, end, last: { t: Date.parse(last.effective), no: noTxt(last), headline: last.headline } };
}
const noTxt = b => b.no == null ? '—' : b.sub ? `${b.no}-${b.sub}` : String(b.no);
/* 給通報用的寫法：10月21日2330時（沿用回報慣例）。推算的加註「推算」。 */
function warnTimeTxt(x) {
  if (!x) return '尚未發布';
  const d = ts => `${new Date(ts).getMonth() + 1}月${new Date(ts).getDate()}日${fmtHM(ts)}`;
  if (x.exact) return d(x.t);
  if (x.guess) return `約${d(x.guess)}（推算）`;
  return `${d(x.t)}前（第${x.no}報時已發布）`;
}

/* ── 站臺端靜態資料：由 GitHub Actions 在後端抓好並提交 ──────
   授權碼放在 repo 的 Secrets，使用者端不必申請、也不必填。
   這份 JSON 同源，會被 service worker 快取，離線時仍讀得到最後一次的內容。
   回傳 null 代表「沒設定」（檔案不存在或後端沒有金鑰）—— 安靜往下退。
   回傳 { fail } 代表「設定了但不能用」（後端報錯、資料太舊、解析不出來）——
   一樣往下退，但原因要講出來,不能讓人以為氣象署沒發布。            */
const STATIC_MAX_AGE = 12 * 3600000;   // 後端每 10 分鐘確認一次、沒變也 3 小時刷新時間戳
async function fetchStatic() {
  let j;
  try {
    j = await getJSON(new URL('data/typhoon.json', location.href).href, 9000);
  } catch (e) { return null; }
  if (!j || typeof j !== 'object') return null;
  if (!j.hasKey) return null;              // 後端沒金鑰，這份是空殼
  if (j.error || !j.raw) {
    return { fail: `後端颱風資料抓取失敗（${String(j.error || '檔案沒有內容').slice(0, 160)}）` };
  }
  const age = Date.now() - wxTime(j.updated);
  if (!(age < STATIC_MAX_AGE)) {
    return { fail: `後端颱風資料已 ${Number.isFinite(age) ? Math.round(age / 3600000) + ' 小時' : '不知多久'}沒有更新（後端排程或網站部署可能停了，可到 GitHub 的 Actions 頁看「Fetch CWA data」與「Deploy to GitHub Pages」有沒有紅燈）` };
  }
  const typhoons = parseCyclones(j.raw['W-C0034-005']);
  if (_cwaSeen.raw > 0 && !typhoons.length) {
    return { fail: `後端檔裡有 ${_cwaSeen.raw} 筆熱帶氣旋，但風哨一筆都解析不出來（程式的問題，不是氣象署沒發布）` };
  }
  return {
    updated: j.updated,
    warning: j.raw['W-C0034-001'] ? parseWarning(j.raw['W-C0034-001']) : null,
    // 侵襲機率（後端解開 KMZ 的等值區）；沒有這份產品時是 null
    prob: j.raw['W-C0034-003'] && Array.isArray(j.raw['W-C0034-003'].items) ? j.raw['W-C0034-003'] : null,
    warnLog: Array.isArray(j.warnLog) ? j.warnLog : [],
    typhoons,
  };
}

/* ── GDACS 免金鑰備援：只有觀測位置，沒有官方預報 ────────── */
async function fetchGDACS() {
  const j = await getJSON(GDACS_URL);
  const fs = (j?.features || []).filter(f => String(f?.properties?.eventtype || '').trim() === 'TC');
  if (!fs.length) return null;
  const TW = { lat: 23.7, lng: 121.0 };
  let best = null;
  for (const f of fs) {
    const g = f?.geometry?.coordinates; if (!Array.isArray(g)) continue;
    const p = { lat: Number(g[1]), lng: Number(g[0]) };
    if (!Number.isFinite(p.lat) || !Number.isFinite(p.lng)) continue;
    const d = distKm(p, TW);
    if (!best || d < best.d) best = { f, d, p };
  }
  if (!best) return null;
  const pr = best.f.properties || {};
  const kmh = Number(pr.severitydata?.severity || 0);
  const vmax = kmh / 3.6;
  return {
    src: 'GDACS', official: false,
    name: String(pr.eventname || pr.name || '未命名').trim(), en: pr.eventname || '',
    t0: new Date(pr.todate || pr.fromdate || Date.now()).getTime(),
    pos: best.p, vmax, gust: 0, pres: 0, mvDir: '', mvSpd: 0,
    r15: vmax >= 33 ? 250 : vmax >= 25 ? 200 : vmax >= TY_MIN_MS ? 150 : 0,
    track: [], past: [],
  };
}

/* ═══ 外推路徑：官方沒給預報時的替代品 ═══════════════════
   還是熱帶性低氣壓的時候，W-C0034-005 常常只有分析位置、沒有預報路徑，
   這時什麼時機都算不出來。用移動向量直線外推可以補上，但這是
   「假設它照現在的方向和速度直直走」，颱風並不會這樣走。
   所以外推出來的東西一定要標明白，不能讓它看起來像官方預報 ——
   拿外推的時間去排關機，跟拿官方預報去排，是兩件不同風險的事。   */
const EXTRAP_MIN_KMH = 8;      // 移速低於此值不外推：慢速系統的方向沒有意義
const EXTRAP_HOURS = 24;

function motionOf(ty) {
  const spd = Number(ty.mvSpd) || 0;
  let brg = null;
  // 方位優先用最近兩個分析點量出來的,比方位字串精確
  if (Array.isArray(ty.past) && ty.past.length >= 2) {
    const a = ty.past[ty.past.length - 2], b = ty.past[ty.past.length - 1];
    if (distKm(a, b) > 1) brg = bearing(a, b);
  }
  if (brg == null) brg = dirDeg(ty.mvDir);
  return (spd > 0 && brg != null) ? { spd, brg } : null;
}

function extrapolateTrack(ty) {
  if (!ty || !ty.pos) return null;
  if (ty.track && ty.track.length) return null;      // 有官方預報就絕不外推
  const m = motionOf(ty);
  if (!m || m.spd < EXTRAP_MIN_KMH) return null;
  const out = [];
  for (let tau = 6; tau <= EXTRAP_HOURS; tau += 6) {
    // 強度不外推:我們沒有能力預報增強或減弱,沿用現值並在畫面上說明。
    out.push({ tau, pos: destPoint(ty.pos, m.brg, m.spd * tau), vmax: ty.vmax, r70: 0 });
  }
  return out;
}

/* ═══ 逐時內插：把預報點補成每小時一筆 ═══════════════════ */
function interpolate(ty) {
  const pts = [{ tau: 0, pos: ty.pos, vmax: ty.vmax, r15: ty.r15, r25: ty.r25 || 0 }];
  for (const f of ty.track) {
    /* 預報點有官方的七級／十級風半徑就用官方的（氣象署現在每個預報點都給到 72 小時左右）。
       沒給的時距（太遠、舊格式、外推點）才照強度縮放推估。
       以前一律用縮放,72 小時那點會算成 242 km,官方是 180 km —— 解除時機因此估晚。 */
    const scale = ty.vmax > 0 ? Math.pow(Math.max(f.vmax, 1) / ty.vmax, 0.35) : 1;
    const r15 = f.r15 > 0 ? f.r15 : Math.round(ty.r15 * scale);
    /* 十級風半徑：官方給了就用。官方給了七級卻沒給十級＝那時已沒有十級風範圍,記 0。
       七級也沒給（外推點、舊格式）才跟七級一樣照強度縮放 —— 外推不預測增減弱,圈不該自己縮掉。 */
    const r25 = f.r25 > 0 ? f.r25
      : f.r15 > 0 || f.vmax < BF_MIN[10] ? 0 : Math.round((ty.r25 || 0) * scale);
    pts.push({ tau: f.tau, pos: f.pos, vmax: f.vmax, r15, r25 });
  }
  pts.sort((a, b) => a.tau - b.tau);
  const maxTau = pts[pts.length - 1].tau;
  const out = [];
  for (let h = 0; h <= maxTau; h++) {
    let i = 0; while (i < pts.length - 2 && pts[i + 1].tau < h) i++;
    const a = pts[i], b = pts[i + 1] || pts[i];
    const span = b.tau - a.tau || 1, f = clamp((h - a.tau) / span, 0, 1);
    const prev = out[out.length - 1];
    const pos = { lat: a.pos.lat + (b.pos.lat - a.pos.lat) * f, lng: a.pos.lng + (b.pos.lng - a.pos.lng) * f };
    out.push({
      h, t: ty.t0 + h * 3600000, pos,
      vmax: a.vmax + (b.vmax - a.vmax) * f,
      r15: a.r15 + (b.r15 - a.r15) * f,
      r25: (a.r25 || 0) + ((b.r25 || 0) - (a.r25 || 0)) * f,
      mv: prev ? bearing(prev.pos, pos) : null,
      mvSpd: prev ? distKm(prev.pos, pos) : ty.mvSpd,
    });
  }
  if (out.length > 1 && out[0].mv == null) { out[0].mv = out[1].mv; out[0].mvSpd = out[1].mvSpd; }
  return out;
}

/* ═══ 風場：修正型 Rankine 渦旋 + 移動不對稱 ══════════════
   V(r) = Vmax·(r/Rmax)^0.6                r ≤ Rmax
   V(r) = Vmax·(Rmax/r)^x                  r > Rmax，x 由 R15 反解
   再疊加移動速度造成的右半圓增強。回傳持續風速 m/s。          */
function windAt(snap, p) {
  const r = distKm(snap.pos, p);
  const vmax = Math.max(snap.vmax, 1);
  const r15 = Math.max(snap.r15, 30);
  const Rmax = clamp(r15 * 0.18, 15, 70);
  let v;
  if (r <= Rmax) v = vmax * Math.pow(Math.max(r, 1) / Rmax, 0.6);
  else {
    let x = 0.55;
    if (vmax > 15 && r15 > Rmax) x = clamp(Math.log(vmax / 15) / Math.log(r15 / Rmax), 0.30, 0.95);
    v = vmax * Math.pow(Rmax / r, x);
  }
  if (snap.mv != null && snap.mvSpd > 0) {          // 右半圓增強
    const b = bearing(snap.pos, p);
    v += 0.5 * snap.mvSpd / 3.6 * Math.cos(rad(b - snap.mv - 90));
  }
  const brg = bearing(snap.pos, p);
  /* 風「從哪個方向來」。北半球是逆時針環流:在中心東側(θ=90°)空氣往北走,
     所以移動方向 ≈ θ−90°,再加上約 20° 的向心內流,風來向 = 移動方向+180 ≈ θ+110°。
     這個角度只用來分「哪一個象限」,校正與套用兩邊用同一條式子,
     就算內流角估得不準,分箱仍然一致。 */
  const dirFrom = ((brg + 110) % 360 + 360) % 360;
  return { ms: Math.max(v, 0), bf: ms2bf(Math.max(v, 0)), km: r, brg, dirFrom };
}

/* ═══ 站臺風力校正 ═══════════════════════════════════════
   問題:渦旋模型算的是**海面上的持續風**,沒有地形。
   真正的地形修正要有地形追隨的邊界層模式與地形高程資料,
   那不是一支單檔前端程式做得到的事,硬做只會做出一個看起來很準的假數字。

   做得到而且有用的是另一件事:**拿這個站自己的實測去學它的偏差**。
   每次更新時,同一個地點同時有「模型推估」與「最近測站實測」,
   兩者的比值就是這個站的**地形／曝風修正係數**。把它平滑地累積起來,
   之後的推估就乘上去 —— 這是作業上常用的偏差校正（MOS 的精神）,
   不是憑空猜一個地形參數。

   為什麼要分方位:同一個站,吹北風時被山擋住、吹南風時整片敞開,
   係數可以差一倍。颱風經過時風向會轉一大圈,剛好把各方位都學到。

   這修得掉的是**系統性偏差**（曝風、遮蔽、測站高度）。
   修不掉的是路徑誤差造成的時間偏移,以及複雜地形裡的瞬間陣風 ——
   所以畫面上仍然要並列實測,並保留「推估差 N 級」那個警告。      */
const CAL_MIN_MS = 5;        // 推估低於這個值不學:分母太小,比值全是雜訊
const CAL_MAX_KM = 25;       // 學習用的測站要比顯示用的(60 km)更近
const CAL_ALPHA = 0.25;      // 指數移動平均的權重
const CAL_MIN_N = 3;         // 樣本不足就不套用,寧可用未校正的原值
const CAL_LO = 0.35, CAL_HI = 1.8;   // 超出這個範圍多半是配錯測站,不是地形
const OCT = d => Math.round((((d % 360) + 360) % 360) / 45) % 8;
const OCT_NAME = ['北', '東北', '東', '東南', '南', '西南', '西', '西北'];

function calOf(st) {
  if (!st.cal || typeof st.cal !== 'object') st.cal = { k: 1, n: 0, at: 0, dir: [] };
  if (!Array.isArray(st.cal.dir)) st.cal.dir = [];
  return st.cal;
}
/* 取這個站在某個風向下該乘的係數。方位樣本夠就用方位的,
   不夠退回整體的,再不夠就回 1（＝不校正）。 */
function calFactor(st, dirFrom) {
  if (!st || st.calOff) return 1;
  if (Number.isFinite(st.calManual) && st.calManual > 0) return clamp(st.calManual, CAL_LO, CAL_HI);
  const c = st.cal;
  if (!c) return 1;
  if (Number.isFinite(dirFrom) && Array.isArray(c.dir)) {
    const d = c.dir[OCT(dirFrom)];
    if (d && d.n >= CAL_MIN_N) return clamp(d.k, CAL_LO, CAL_HI);
  }
  return (c.n >= CAL_MIN_N) ? clamp(c.k, CAL_LO, CAL_HI) : 1;
}

/* 每次拿到新的實測就學一次。只在「模型與實測都有意義」時才學。 */
function calibrateStations() {
  if (!SERIES || !SERIES.length || !OBS.length) return 0;
  const now = SERIES[0];
  let learned = 0;
  for (const st of DB.stations) {
    if (!IS_LIVE(st) || !Number.isFinite(st.lat) || !Number.isFinite(st.lng)) continue;
    const ob = nearestIn(OBS, st);
    if (!ob || ob.km > CAL_MAX_KM || (ob.o.wind == null && ob.o.gust == null)) continue;
    const w = windAt(now, { lat: st.lat, lng: st.lng });
    if (!(w.ms >= CAL_MIN_MS)) continue;            // 風太小,比值沒有意義
    /* 判斷看陣風,就拿陣風對陣風學:測站有最大陣風時用它比推估陣風。
       陸上測站的陣風／平均風常到 1.5–2 倍,拿平均風學出來的係數會把陣風低估。
       沒報陣風的測站才退回平均風對平均風。 */
    const ratio = clamp(ob.o.gust != null && ob.o.gust > 0
      ? ob.o.gust / (w.ms * GUST_FACTOR) : ob.o.wind / w.ms, CAL_LO, CAL_HI);
    const c = calOf(st);
    // 同一筆觀測時刻不要重複學（按兩次更新不該讓係數跑兩步）
    if (c.at && OBS_AT && c.at === OBS_AT) continue;
    c.k = c.n ? c.k + CAL_ALPHA * (ratio - c.k) : ratio;
    c.n++;
    c.at = OBS_AT || Date.now();
    c.km = Math.round(ob.km);
    c.src = ob.o.name;
    const i = OCT(w.dirFrom);
    const d = c.dir[i] || { k: ratio, n: 0 };
    d.k = d.n ? d.k + CAL_ALPHA * (ratio - d.k) : ratio;
    d.n++;
    c.dir[i] = d;
    learned++;
  }
  if (learned) save();
  return learned;
}

/* ═══ 警報預判 ═══════════════════════════════════════════
   海上颱風警報：暴風範圍可能侵襲臺灣或金馬 100 公里海域，約 24 小時前發布
   陸上颱風警報：暴風範圍可能侵襲陸地，約 18 小時前發布
   解除警報　：暴風範圍脫離上述範圍                           */
function predictWarnings(series, seaBuf) {
  const buf = Number.isFinite(seaBuf) ? seaBuf : 100;
  let seaIn = null, seaOut = null, landIn = null, landOut = null, cpa = null;
  let isTy = false;                      // 這段期間內有沒有達到颱風強度
  for (const s of series) {
    const d = distToTaiwan(s.pos);
    if (cpa == null || d < cpa.d) cpa = { d, t: s.t, h: s.h };
    /* 只有「當下已經是颱風」的時刻才算得上暴風範圍侵襲。
       熱帶性低氣壓不會有颱風警報 —— 氣象署改以豪大雨或強風特報因應。
       少了這個條件,一個 6 級的低壓也會被算成「暴風範圍影響中」。 */
    if (s.vmax < TY_MIN_MS || !(s.r15 > 0)) continue;
    isTy = true;
    const sea = s.r15 >= d - buf, land = s.r15 >= d;
    if (sea) { if (seaIn == null) seaIn = s; seaOut = s; }
    if (land) { if (landIn == null) landIn = s; landOut = s; }
  }
  const now = Date.now();
  const wrap = (i, o, lead) => i ? {
    affect: i.t, issue: i.t - lead * 3600000, clear: o.t,
    phase: now >= o.t ? 'done' : now >= i.t ? 'active' : now >= i.t - lead * 3600000 ? 'issued' : 'pending',
  } : null;
  return { cpa, isTy, sea: wrap(seaIn, seaOut, 24), land: wrap(landIn, landOut, 18) };
}

/* ═══ 站臺衝擊：何時該關、何時可復 ═══════════════════════ */
function stationImpact(series, st, cfg) {
  if (!Number.isFinite(st.lat) || !Number.isFinite(st.lng)) return null;
  const p = { lat: st.lat, lng: st.lng };
  /* 每個時刻各自依「那個時刻的風向」取係數 —— 颱風經過時風向會轉一大圈,
     用同一個係數套整條曲線,等於假設它從頭到尾都吹同一個方向。 */
  /* bf 是**推估陣風**的級數:門檻、尖峰、待機與復機時間全部用它比。
     ms 留著持續風,停班停課那一款要的是平均風。 */
  const curve = series.map(s => {
    const w = windAt(s, p);
    const k = calFactor(st, w.dirFrom);
    const ms = w.ms * k;
    const gust = ms * GUST_FACTOR;
    return { t: s.t, h: s.h, ...w, ms, gust, bf: ms2bf(gust), k };
  });
  const now = curve[0];
  let peak = curve[0];
  for (const c of curve) if (c.bf > peak.bf) peak = c;

  let shut = null, emerg = null, resume = null, lastHigh = -1;
  curve.forEach((c, i) => {
    if (shut == null && c.bf >= cfg.bfShut) shut = c;
    if (emerg == null && c.bf >= cfg.bfEmerg) emerg = c;
    if (c.bf >= cfg.bfShut) lastHigh = i;                // 記住最後一次超標
  });
  // 復機時機必須在「最後一次超過關機門檻」之後才算數。
  // 直接用尖峰之後判斷會被颱風眼通過時的短暫風平誤導，是致命誤判。
  if (lastHigh >= 0) resume = curve.slice(lastHigh + 1).find(c => c.bf <= cfg.bfResume) || null;
  else resume = curve.find(c => c.bf <= cfg.bfResume) || null;

  return {
    now, peak, shut, emerg, resume,
    deadline: shut ? shut.t - cfg.leadMin * 60000 : null,   // 應於此時前完成待機
    km: Math.round(now.km), brg: now.brg,
    k: now.k, cal: st.cal || null, calManual: st.calManual, calOff: !!st.calOff,
  };
}

/* ═══ 停班停課的風力基準推估 ══════════════════════════════
   《天然災害停止上班及上課作業辦法》第 4 條的風力款：
   **平均風力達 7 級以上,或陣風達 10 級以上**。
   這一款是可以算的 —— 逐時風場本來就有,拿門檻去掃一遍就得到時段。
   雨量款要的是「未來 24 小時累積雨量預測」,本程式沒有預測雨量,算不出來。

   算得出來不等於會放假:辦法要的是「已致災或有致災之虞」,
   而且宣布權在地方政府綜合研判。所以這裡一律寫「推估停止上班上課」並註明尚未公告,
   不寫「會放假」,並在每一處都附上這句但書。

   陣風以持續風的 1.3 倍估（常用的陣風因子）。這是估的,不是實測。   */
const SUSP_BF_MEAN = 7, SUSP_BF_GUST = 10;
const suspMeets = ms => ms2bf(ms) >= SUSP_BF_MEAN || ms2bf(ms * GUST_FACTOR) >= SUSP_BF_GUST;

/* ── 雨量款：用氣象署的豪大雨特報當替代訊號 ──────────────
   官方雨量款看的是「未來 24 小時累積雨量**預測**」,本程式沒有預測雨量。
   但**豪大雨特報本身就是預測性質**,而且它的分級門檻跟停班停課的門檻同一個口徑:
     超大豪雨 ≥ 500、大豪雨 ≥ 350（＝平地基準）、豪雨 ≥ 200（＝山區基準）。
   所以「氣象署已對這個縣市發布大豪雨特報」＝「官方預測該地 24 小時雨量達 350 mm」,
   這比拿雨量站的實測累積去比 350 更貼近官方的判斷口徑。

   這仍然是**替代訊號不是官方數字**:特報是分級,不是那個縣市每一點的預測值;
   而且雨量達標之後還要「已致災或有致災之虞」,宣布權仍在地方政府。       */
const ADV_H24 = { 超大豪雨: 500, 大豪雨: 350, 豪雨: 200, 大雨: 80 };
function advH24(kind) {
  // 由重到輕比對 —— 「大豪雨」本身就含有「豪雨」兩個字,順序反了會降級。
  for (const k of Object.keys(ADV_H24)) if (String(kind).includes(k)) return ADV_H24[k];
  return 0;
}
/* 站臺沒有縣市欄位,拿最近的雨量站（沒有就拿最近的氣象站）的縣市當作它所在的縣市。
   兩者都在 60 km 以內才會被採用,同縣市的機會很高;真的對不上就回 null,
   寧可不判斷也不要判斷錯 —— 說錯縣市就是說錯放假。 */
function countyOf(st) {
  if (!st) return '';
  if (st.county) return st.county;            // 使用者自己填的優先
  const r = nearestRain(st); if (r && r.o.county) return r.o.county;
  const o = nearestObs(st);  if (o && o.o.county) return o.o.county;
  /* 沒有雨量站、測站時看預報的地點（後端預報是縣市層級）。站臺本身也要有座標：townFor 碰到沒座標的站
     會回頭叫 countyOf——v71～v74 這裡少了這個條件,名單裡只要有一站沒填經緯度就無限遞迴當掉,
     「現在位置」停在「定位中…」（連定位都還沒送出去）。 */
  if (Number.isFinite(st.lat) && Number.isFinite(st.lng) && WX && WX.some(t => Number.isFinite(t.lat))) {
    const t = townFor(st); if (t && /[縣市]$/.test(t.town.name)) return t.town.name;
  }
  return '';
}
function advRainFor(st) {
  const c = cnorm(countyOf(st));
  if (!c || !ADV.length) return null;
  const hill = terrainOf(st) === 'hill';
  let best = null;
  for (const a of ADV) {
    const mm = advH24(a.kind);
    if (!mm) continue;
    for (const area of a.areas) {
      const an = cnorm(area);
      // 「臺中市山區」「南投縣山區」只算山區的點
      if (/山區/.test(an) && !hill) continue;
      const bare = an.replace(/(山區|平地|沿海|地區|北部|南部|東部|西部)+$/, '');
      if (!an.includes(c) && !bare.includes(c) && !c.includes(bare)) continue;
      if (!best || mm > best.mm) best = { mm, kind: a.kind, area, end: a.end, county: c };
    }
  }
  if (!best) return null;
  // 門檻依附表逐縣市查,不是一律 350／200 —— 連江縣是 200,山區縣市山區也是 200
  const rule = dgpaRule(countyOf(st), terrainOf(st));
  best.thr = rule.fc;
  best.label = rule.label;
  best.knownCounty = rule.known;
  best.meets = best.mm >= best.thr;
  return best;
}

/* 回傳達標的連續時段（可能不只一段,颱風眼通過時會斷開;
   間隔 3 小時以內視為同一段 —— 中間那一兩個小時沒有人會去上班）。 */
function suspendWindows(series, p) {
  if (!series || !series.length) return [];
  const segs = [];
  let cur = null, peak = 0;
  for (const s of series) {
    const w = windAt(s, p);
    if (suspMeets(w.ms)) {
      if (!cur) { cur = { from: s.t, to: s.t, peakMs: w.ms }; }
      else { cur.to = s.t; if (w.ms > cur.peakMs) cur.peakMs = w.ms; }
    } else if (cur) { segs.push(cur); cur = null; }
    if (w.ms > peak) peak = w.ms;
  }
  if (cur) segs.push(cur);
  const merged = [];
  for (const g of segs) {
    const last = merged[merged.length - 1];
    if (last && g.from - last.to <= 3 * 3600000) {
      last.to = g.to; last.peakMs = Math.max(last.peakMs, g.peakMs);
    } else merged.push({ ...g });
  }
  merged.forEach(m => { m.peakBf = ms2bf(m.peakMs); m.peakGustBf = ms2bf(m.peakMs * GUST_FACTOR); });
  return merged;
}

/* ═══ 站臺當下建議 ═══════════════════════════════════════ */
/* ── 一站的風：平均風與陣風,推估與實測各一組 ─────────────
   使用者規定「風速跟陣風都要看,以最高的為待機標準」。
   所以判斷級數＝推估平均、推估陣風、實測平均、實測陣風四個換成風級後取最高,
   並記下最高的是哪一個,畫面上講得出「這個級數是怎麼來的」。
   測站沒報陣風時用平均風 ×GUST_FACTOR 估,標「估」,不能把估的當量的。 */
function windRead(st, imp) {
  const ob = nearestObs(st);
  const est = imp ? { ms: imp.now.ms, gust: imp.now.gust } : null;
  let obs = null;
  if (ob && (ob.o.wind != null || ob.o.gust != null)) {
    const gEst = ob.o.gust == null && ob.o.wind != null;
    obs = { ms: ob.o.wind, gust: gEst ? ob.o.wind * GUST_FACTOR : ob.o.gust, gEst,
            name: ob.o.name, km: Math.round(ob.km) };
  }
  const cand = [];
  if (est) cand.push(['推估平均風', ms2bf(est.ms)], ['推估陣風', ms2bf(est.gust)]);
  if (obs) {
    if (obs.ms != null) cand.push(['實測平均風', ms2bf(obs.ms)]);
    if (obs.gust != null) cand.push([obs.gEst ? '實測陣風（平均風估）' : '實測陣風', ms2bf(obs.gust)]);
  }
  let top = null;
  // 同級時實測優先：講「實測陣風 9 級」比「推估陣風 9 級」更有根據
  for (const c of cand) if (!top || c[1] > top[1] || (c[1] === top[1] && c[0].startsWith('實測'))) top = c;
  return { est, obs, bf: top ? top[1] : null, src: top ? top[0] : '' };
}
const msTxt = v => (v == null || !Number.isFinite(v)) ? '—' : `${v.toFixed(1)} m/s`;
// 數字跟單位、級數不能被拆到兩行（「陣風」在上一行、「11.9 m/s」在下一行很難讀）
const wPair = (ms, gust, gEst) => `<span class="nw">平均 ${msTxt(ms)}${ms != null ? `（${ms2bf(ms)}級）` : ''}</span> <span class="nw">陣風 ${msTxt(gust)}${
  gust != null ? `（${ms2bf(gust)}級${gEst ? '，估' : ''}）` : ''}</span>`;

/* 風大的預設動作是**待機**,不是關機:待機隨時可以拉回來,關機要人到現場、復機慢。
   所以達門檻一律建議待機;到緊急門檻才提醒「設備有受損之虞再關機」—— 關不關由值班決定。
   現場風級取推估與實測的平均風、陣風四者最高（windRead）:
   模型低估、現場已經吹到門檻時,不能因為模型說還好就不提醒。 */
// 衝擊表的「評估」欄：現在照風、濕度應該是什麼狀態,跟目前狀態一不一致（跟 advise 同一套門檻）
function evalState(st, imp) {
  const a = advise(st, imp, DB.cfg);
  if (st.status === 'on') {
    if (a && a.k === 'stop') return { label: '待機', ok: false, act: '應待機', note: '' };
    return { label: '開機', ok: true, act: '', note: imp && imp.deadline ? `${fmtShort(imp.deadline)} 前待機` : '' };
  }
  if (a && a.k === 'go') return { label: '可復機', ok: false, act: '可評估復機', note: '' };
  return { label: `維持${S_LABEL[st.status] || ''}`, ok: true, act: '',
    note: imp && imp.resume && imp.resume.t > Date.now() ? `預估 ${fmtShort(imp.resume.t)} 可復機` : '' };
}
function advise(st, imp, cfg) {
  if (!IS_LIVE(st)) return { k: 'warn', txt: '此點尚未建置，不列入待機管制與回報。建置完成後請改為開機。' };
  const wr = windRead(st, imp);
  const bf = wr.bf, src = wr.src;
  if (st.status === 'on') {
    if (bf != null && bf >= cfg.bfEmerg) return { k: 'stop', txt: `${src} ${bfLabel(bf)}，已達緊急門檻 ${cfg.bfEmerg} 級，應立即待機；設備有受損之虞再改為關機。` };
    if (bf != null && bf >= cfg.bfShut) return { k: 'stop', txt: `${src} ${bfLabel(bf)}，已達待機門檻 ${cfg.bfShut} 級，建議實施待機（特殊需要再關機）。` };
    if (imp && imp.deadline) return { k: 'warn', txt: `預估 ${fmtShort(imp.shut.t)} 陣風達 ${bfLabel(imp.shut.bf)}，應於 ${fmtShort(imp.deadline)} 前完成待機。` };
    return null;
  }
  // 關機或待機中
  const reasons = [];
  if (st.hum != null && st.hum > cfg.humMax) reasons.push(`現場濕度 ${st.hum}%，高於復機上限 ${cfg.humMax}%`);
  if (bf != null && bf > cfg.bfResume) reasons.push(`${src} ${bfLabel(bf)}，高於可復機門檻 ${cfg.bfResume} 級`);
  if (reasons.length) return { k: 'warn', txt: reasons.join('；') + '，暫不宜復機。' };
  if (imp && imp.resume && imp.resume.t > Date.now())
    return { k: 'warn', txt: `預估 ${fmtShort(imp.resume.t)} 陣風降至 ${bfLabel(imp.resume.bf)}，屆時可評估復機。` };
  if (bf != null || st.hum != null) return { k: 'go', txt: '陣風與濕度均已低於門檻，可評估復機。' };
  return null;
}

/* ═══ 取得颱風資料 ═══════════════════════════════════════ */
let SERIES = null, WARN = null;
// TRACK：目前實際採用的預報點（官方的，或外推出來的）。EXTRAP：是不是外推的。
let TRACK = [], EXTRAP = false;

function rebuildModel() {
  const ty = DB.ty.data;
  if (!ty) { SERIES = null; WARN = null; TRACK = []; EXTRAP = false; return; }
  const ex = extrapolateTrack(ty);
  EXTRAP = !!ex;
  TRACK = ex || ty.track || [];
  SERIES = interpolate(ex ? Object.assign({}, ty, { track: ex }) : ty);
  WARN = SERIES.length > 1 ? predictWarnings(SERIES, DB.cfg.seaBuffer) : null;
}

async function loadTyphoon(manual) {
  if (_busy) return;
  const now = Date.now();
  if (manual && now - _last < MIN_GAP) {
    toast(`${Math.ceil((MIN_GAP - (now - _last)) / 1000)} 秒後才能再次更新`); return;
  }
  _busy = true; _last = now;
  renderTyphoon({ loading: true });
  // 公告來源跟颱風資料一起更新。沒設定就是 no-op,不會多送任何請求。
  fetchDgpa(false);
  const key = (DB.cfg.cwaKey || '').trim();
  let note = '';
  // 實測觀測跟颱風路徑是兩件事:就算氣象署現在沒有任何颱風,
  // 「現在各站臺幾級風」還是要看得到。所以先發出去,不等路徑的結果。
  const obsP = key
    // fetchForecast 自己會寫 WX / WX_ERR,這裡不取它的回傳值;
    // 天氣預報抓不到絕對不能連帶讓颱風那條路徑掛掉,所以一律 allSettled。
    ? Promise.allSettled([fetchObs(key), fetchRain(key), fetchAdvisory(key),
        fetchForecast(key), fetchLightning(key)])
        .then(([w, r, a, f, l]) => {
          OBS = w.status === 'fulfilled' ? w.value : [];
          RAIN = r.status === 'fulfilled' ? r.value : [];
          ADV = a.status === 'fulfilled' ? a.value : [];
          if (f.status === 'rejected') { WX = null; WX_ERR = String((f.reason && f.reason.message) || f.reason || '天氣預報讀取失敗'); }
          if (l.status === 'rejected') { LTN = []; LTN_AT = 0; LTN_ERR = String((l.reason && l.reason.message) || l.reason || '閃電資料讀取失敗'); }
          OBS_AT = RAIN_AT = Date.now(); WX_SRC = 'key';
          // 自己的授權碼抓不到（被 CORS 擋、授權碼過期）：缺的那幾份退回後端檔,總比整片空白好
          if (!OBS.length || !RAIN.length || !(WX && WX.length)) return fetchWxBackend();
        })
    /* 沒有授權碼時,其他觀測都抓不到,但落雷還是要抓 ——
       data/lightning.json 是同源的後端檔,本來就不需要使用者自己的授權碼。
       以前這裡直接清空,等於 repo 設好了 Secret,沒填授權碼的同事還是看不到雷。 */
    : Promise.allSettled([fetchLightning('').catch(e => {
        LTN = []; LTN_AT = 0; LTN_ERR = String((e && e.message) || e || '閃電資料讀取失敗');
      }), (async () => {
        OBS = []; RAIN = []; ADV = []; OBS_AT = RAIN_AT = 0; WX_SRC = '';
        WX = null; WX_AT = 0; WX_ERR = '';
        await fetchWxBackend();            // 雨量、陣風、特報改讀後端檔（repo Secret 抓的）
      })()]);
  try {
    let all = [];
    // ① 站臺端靜態資料：不需要任何人自備授權碼，優先用
    const stat = await fetchStatic();
    await obsP;                       // 上面已經在跑了,這裡只是收線
    try { recordWxLog(); } catch (e) { console.warn('站臺天氣紀錄失敗', e); }
    // 實測進來了,但 SERIES 還要等路徑解析完;真正的學習在下面 rebuildModel 之後
    /* why:官方那幾條路為什麼沒拿到。跟「改用 GDACS」分開組,
       因為 GDACS 可能也連不上 —— 那時候再說「改以 GDACS 顯示」就是自相矛盾。
       後端設好了卻不能用也要講,不然退到 GDACS 看起來像氣象署沒發布。 */
    let why = stat && stat.fail ? stat.fail + '。' : '';
    if (stat && !stat.fail) {
      DB.ty.warning = stat.warning || null;
      DB.ty.prob = stat.prob || null;
      mergeWlog(stat.warnLog);
      mergeWlog(stat.warning && stat.warning.bulletins);
      if (stat.typhoons.length) {
        all = stat.typhoons;
      } else {
        // 後端有金鑰、也查得到，只是目前真的沒有颱風 —— 這是明確的答案，
        // 不該再退到 GDACS 去撈出一個地球另一端的熱帶氣旋。
        // 查成功了也要記時間：不然「更新」旁邊永遠是上一顆颱風的時間,看起來像按了沒反應
        DB.ty.at = Date.now();
        clearTyphoon(); renderTyphoon({ none: true, note }); renderStations();
        if (manual) toast('已更新：目前沒有颱風');
        return;
      }
    }
    // ② 使用者自填授權碼（後端沒設定或不能用時的退路）
    if (!all.length && key) {
      // 路徑與警報單一起抓：兩者互不相干，警報單掛掉不該影響路徑，
      // 所以用 allSettled 而不是讓任一個失敗把另一個一起帶走。
      const [pathRes, warnRes] = await Promise.allSettled([
        fetchCWAAll(key), fetchWarningCWA(key),
      ]);
      if (warnRes.status === 'fulfilled') {
        DB.ty.warning = warnRes.value;
        mergeWlog(warnRes.value && warnRes.value.bulletins);
      }
      if (pathRes.status === 'fulfilled') {
        all = pathRes.value || [];
        if (!all.length) {
          // 氣象署給了資料但一顆都解析不出來,跟氣象署沒發布是兩回事。
          // 講成一樣的話,等於把自己的 bug 說成別人沒資料。
          why += _cwaSeen.raw > 0
            ? `中央氣象署回傳了 ${_cwaSeen.raw} 筆熱帶氣旋，但風哨一筆都解析不出來`
              + '（欄位格式可能與預期不符，這是程式的問題，不是氣象署沒發布）。'
            : '中央氣象署目前沒有發布中的颱風路徑資料。';
        }
      } else {
        why += `中央氣象署查詢失敗（${pathRes.reason && pathRes.reason.message}）。`;
      }
    } else if (!all.length && !why) {
      why = '尚未取得官方路徑資料。';
    }
    note = why;
    // ③ GDACS：免金鑰，但只有觀測位置
    if (!all.length) {
      /* GDACS 是最後一條路。它連不上時以前直接丟到外層 catch,畫面只剩一句
         「Failed to fetch」—— 前面後端檔為什麼不能用、授權碼查詢為什麼失敗,全被吃掉。
         也不能畫成「查無熱帶氣旋」:一個來源都沒查成,不代表沒有颱風。 */
      try {
        const g = await fetchGDACS();
        if (g) {
          all = [g];
          note = why + '改以 GDACS 全球來源顯示：只有觀測位置，沒有官方預報路徑，無法推算警報與復機時機。';
        }
      } catch (e) {
        renderTyphoon({ error: `${why}GDACS 也連不上（${(e && e.message) || e}）` });
        renderStations(); return;
      }
    }
    if (!all.length) {
      DB.ty.at = Date.now();
      clearTyphoon(); renderTyphoon({ none: true, note }); renderStations();
      if (manual) toast('已更新：查無颱風');
      return;
    }

    DB.ty.list = all;
    DB.ty.data = selectTyphoon(all, DB.ty.sel);
    DB.ty.sel = tyKey(DB.ty.data);
    DB.ty.at = Date.now();
    // 回報稿的颱風名稱:使用者沒有自己改過就跟著選中的颱風走。
    // 以前只在「空的」時候才設,結果從 GDACS 換到氣象署資料之後,
    // 名字還停在 GDACS 的 NARRA-26,畫面上跟實際那顆對不起來。
    if (!DB.ty.nameEdited) DB.ty.name = DB.ty.data.name;
    save(); rebuildModel();
    /* 路徑與實測都到齊了才學得動:要有 SERIES（模型）也要有 OBS（實測）。
       學完再畫,畫面上看到的就是校正後的推估。 */
    calibrateStations();
    renderTyphoon({ note });
    renderStations(); syncForm(); generate();
    // 按了要有回音,順便講資料本身是幾點的分析（後端排程慢的時候,剛更新不等於資料是新的）
    if (manual) toast(`已更新：${DB.ty.data.official ? '氣象署' : 'GDACS'} ${fmtShort(DB.ty.data.t0).replace(/\(.\)/, '')} 分析`);
  } catch (e) {
    renderTyphoon({ error: e.message });
  } finally { _busy = false; }
}

function clearTyphoon() {
  DB.ty.data = null; DB.ty.list = []; DB.ty.sel = '';
  save(); rebuildModel();
}

/* 同一顆颱風在不同批資料裡要能對上：優先用編號，其次英文名，最後中文名。 */
const tyKey = t => String((t && (t.id || t.en || t.name)) || '');

function selectTyphoon(list, sel) {
  // 使用者挑過的那顆若還在，就繼續看那顆；不在了（減弱、遠離而下架）就回到最近的一顆。
  return list.find(t => sel && tyKey(t) === sel) || list[0];
}

/* 雙颱時切換要看哪一顆。整份推算（內插、警報時機、站臺衝擊）全部跟著換，
   不只是換張圖 —— 選錯颱風做關機排程是會出事的。                        */
function pickTyphoon(k) {
  const t = (DB.ty.list || []).find(x => tyKey(x) === k);
  if (!t || tyKey(DB.ty.data) === k) return;
  DB.ty.data = t; DB.ty.sel = k;
  // 換颱風就換名字,回報稿才不會寫錯颱風。使用者自己改過的名字不動。
  if (!DB.ty.nameEdited) DB.ty.name = t.name;
  save(); rebuildModel(); renderTyphoon({});
  renderStations(); syncForm(); generate();
}
